      ON CONFLICT (id) DO NOTHING;
      INSERT INTO users (id, tenant_id, username, display_name, email, status, created_at, updated_at)
      VALUES ($3, $2, 'reviewer', 'Reviewer', 'reviewer@example.com', 'ACTIVE', now(), now())
      ON CONFLICT (id) DO NOTHING;
    params: [test_user_id, test_tenant_id, test_user_id_2]

