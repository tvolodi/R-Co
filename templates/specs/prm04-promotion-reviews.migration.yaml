# Migration + integration-test parameter file (Lego Type C)
#
# Requirement: PRM-04 (promotion_reviews table — promotion review state machine)
#
# Design artefact: src/design/prm-04-promotion-review-state-machine.md
#
# This file is the COMPLETE design output for the Type C portion of PRM-04.
# CODE-DESIGN-VALIDATOR lints it. BACKEND-DEV runs codegen_migration.py over it.

schema_version: 1
migration_number: 96
name: promotion_reviews
requirement_ids: [PRM-04]
purpose: |
  Persist promotion approvals in a promotion_reviews table. The table is the
  central state machine for the promotion pipeline: records who requested a
  promotion, what plan was approved, who approved it, and whether it has been
  applied/rejected/failed/superseded. Status is CHECK-constrained to exactly
  six values. Partial unique index enforces at most one live review per
  (tenant_id, plan_digest). Extends PRM-01 (plan submission) and PRM-03
  (plan digest storage), and is read by PRM-05 (approval gate), PRM-06/07
  (assertion re-run), PRM-08 (rollback), and PRM-09 (solution pack).

# ------------------------------------------------------------
# Tables
# ------------------------------------------------------------
tables:
  - mode: create
    name: promotion_reviews
    columns:
      - { name: id,               type: uuid,          pk: true,          default: gen_random_uuid() }
      - { name: tenant_id,        type: uuid,          not_null: true }
      - { name: plan_digest,      type: text,          not_null: true }
      - { name: def_type,         type: text,          not_null: true }
      - { name: def_id,           type: text,          not_null: true }
      - { name: serialised_plan,  type: text,          not_null: true }
      - { name: status,           type: text,          not_null: true,     default: "'pending_review'" }
      - { name: requested_by,     type: uuid,          not_null: true }
      - { name: approved_by,      type: uuid,          not_null: false }
      - { name: approved_at,      type: timestamptz,   not_null: false }
      - { name: superseded_by,    type: uuid,          not_null: false }
      - { name: row_version,      type: integer,       not_null: true,     default: "1" }
      - { name: created_at,       type: timestamptz,   not_null: true,     default: now() }
      - { name: updated_at,       type: timestamptz,   not_null: true,     default: now() }
    constraints:
      - kind: check
        name: chk_promotion_reviews_status
        expression: "status IN ('pending_review','approved','rejected','applied','failed','superseded')"
    indexes:
      - name: idx_promotion_reviews_tenant_id
        columns: [tenant_id]
      - name: idx_promotion_reviews_status
        columns: [status]
      - name: idx_promotion_reviews_requested_by
        columns: [requested_by]
      - name: promotion_reviews_plan_digest_active_uniq
        unique: true
        columns: [tenant_id, plan_digest]
        where: "status IN ('pending_review', 'approved')"
      - name: idx_promotion_reviews_tenant_status
        unique: false
        columns: [tenant_id, status]
        where: "status IN ('applied', 'superseded')"

