# ------------------------------------------------------------
# Rollback strategy
# ------------------------------------------------------------
rollback_strategy: |
  Append-only table. Rollback of promotion_reviews rows is not performed —
  rows transition to superseded rather than being deleted. The table is
  immutable append-only for audit purposes.
