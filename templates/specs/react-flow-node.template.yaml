# React Flow node parameter file (Lego Type D)
#
# Use this when a requirement adds a new BPMN node type to the canvas.
# codegen_react_flow_node.py emits:
#   web/src/components/canvas/nodes/<ComponentName>.tsx
#
# Worked example — fictional "Compensation" node.

schema_version: 1
component_name: CompensationNode             # PascalCase, ends in "Node"
node_kind: compensation                      # snake_case, used as React Flow `type`
requirement_ids: [BPMN-22]
purpose: |
  Renders a BPMN compensation node. Used when an instance must roll back a
  prior service task. Appears on the canvas with a backwards-arrow icon and
  one inbound + one outbound handle.

# ------------------------------------------------------------
# Visual shape — drives the wrapper <div> style.
# ------------------------------------------------------------
shape: rectangle                  # rectangle | diamond | circle | rounded
width: 180
min_height: 72
border_color_var: "--color-warning-600"   # CSS variable name (no var())
border_color_fallback: "#f08c00"          # fallback hex
background_color_var: "--color-neutral-0"
background_color_fallback: "#ffffff"
label_field: name                 # which `data` field renders as the main label
subtitle: "Compensation"          # static subtitle line below the label

# ------------------------------------------------------------
# Icon — embedded inline SVG. Codegen emits the <svg> verbatim into the JSX,
# so paste a valid SVG fragment here (no XML declaration, no namespace).
# Use `currentColor` for fills you want to inherit the border colour.
# ------------------------------------------------------------
icon_svg: |
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/>
  </svg>

# ------------------------------------------------------------
# Handles — one entry per React Flow Handle to render.
# Position: top | right | bottom | left
# Type:     source | target
# ------------------------------------------------------------
handles:
  - { id: in,  type: target, position: top }
  - { id: out, type: source, position: bottom }

# ------------------------------------------------------------
# Validation badge — when truthy, a red `!` bubble appears top-right.
# Most nodes use the standard `data.validationError` convention.
# ------------------------------------------------------------
validation_field: validationError
