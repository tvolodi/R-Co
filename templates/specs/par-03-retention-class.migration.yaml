# Migration + integration-test parameter file (Lego Type C)
#
# CODE-DESIGNER output for PAR-03 (Partition-scoped retention and archival).
# Stage 16 / WF02-batch-3-20260811.
# See src/design/par-03-partition-scoped-retention.md for the full design this
# migration supports (the DETACH/ATTACH/DROP retention logic itself is Type
# E, produced separately).
#
# IMPLEMENTER NOTE (BACKEND-DEV, read before running codegen):
# This file covers ONLY the retention_class ALTER — a standard, codegen-clean
# Type C piece confirmed by running the actual lint
# (`python tools/lint_design_artefact.py` against this file passes with 0
# issues). `events_ephemeral` is DELIBERATELY NOT included here: it needs
# `PARTITION BY RANGE (created_at)` (tools/codegen_migration.py has no
# PARTITION BY support at all, confirmed by grep — the same gap PAR-01's
# design already hit for events/events_archive) AND a composite
# (event_id, created_at) primary key, which tools/lint_design_artefact.py's
# Y125 rule rejects outright ("2 pk:true columns (max 1)") — confirmed by
# actually running the lint against a two-pk draft of this file, not assumed.
# `events_ephemeral`'s full CREATE TABLE (composite PK, PARTITION BY RANGE,
# per-partition CHECKs, initial 3-month seed) is therefore written by hand in
# the SAME migration file as this ALTER, following PAR-01's precedent exactly
# (src/design/par-01-monthly-range-partitioning.md's Migration 1 guarded
# rebuild + Migration 4 seed loop) — see
# src/design/par-03-partition-scoped-retention.md's Public interface section
# for the full hand-written SQL shape BACKEND-DEV should follow.
#
# See templates/migration.schema.md for the full field reference.

schema_version: 1
migration_number: 1149   # next free after PAR-02's 1148
name: par03_retention_class
requirement_ids: [PAR-03]
purpose: |
  Adds retention_class to event_type_registry so RetentionClassForbidden
  (PAR-03 AC1) has a concrete column to validate against. events_ephemeral
  (the third RANGE-partitioned parent PAR-03 also requires, confined to
  delete-class event types per ADP-11's protected-family prohibition) is
  hand-written in the same migration file per the IMPLEMENTER NOTE above —
  this YAML's `tables:` block covers only the codegen-clean ALTER.

tables:
  - mode: alter
    name: event_type_registry
    add_columns:
      - { name: retention_class, type: text, not_null: true, default: "'archive_queryable'" }
    # CUSTOM: add, in the generated SQL, immediately after the ADD COLUMN
    # statement above (codegen's `alter` mode has no `check:` field for
    # add_columns as of this template's writing — confirm against the actual
    # tool output):
    #   ALTER TABLE event_type_registry ADD CONSTRAINT chk_retention_class
    #     CHECK (retention_class IN ('retain_forever', 'archive_queryable', 'delete'));
    #
    # CUSTOM: append events_ephemeral's full hand-written CREATE TABLE
    # (composite PK, PARTITION BY RANGE, per-partition CHECKs, initial
    # 3-month seed) to this same generated file, following PAR-01's Migration
    # 1 + Migration 4 pattern — see the IMPLEMENTER NOTE at the top of this
    # file and src/design/par-03-partition-scoped-retention.md's Public
    # interface section.

# ------------------------------------------------------------
# Integration test scaffold
# ------------------------------------------------------------
fixtures:
  - name: event_type_name
    kind: random_string
  - name: tenant_id
    kind: uuid

test_cases:
  - name: retention_class_check_constraint_rejects_unknown_value
    description: A retention_class outside retain_forever/archive_queryable/delete is rejected.
    requirement_ref: PAR-03
    arrange: |
      try h.conn.exec(
          "INSERT INTO event_type_registry (name, schema_version, json_schema) VALUES ($1, 1, '{}')",
          &.{fx.event_type_name},
      );
    act: |
      const result = h.conn.exec(
          "UPDATE event_type_registry SET retention_class = 'BOGUS' WHERE name = $1",
          &.{fx.event_type_name},
      );
    assertions: |
      // CUSTOM: assert error.CheckConstraintViolation (SQLSTATE 23514) from
      // chk_retention_class; the row's retention_class is unchanged.

  - name: retention_class_defaults_to_archive_queryable
    description: A newly registered event type defaults to archive_queryable, not delete.
    requirement_ref: PAR-03
    arrange: ""
    act: |
      try h.conn.exec(
          "INSERT INTO event_type_registry (name, schema_version, json_schema) VALUES ($1, 1, '{}')",
          &.{fx.event_type_name},
      );
    assertions: |
      // CUSTOM: assert SELECT retention_class FROM event_type_registry WHERE
      // name = fx.event_type_name returns 'archive_queryable'.

  - name: events_ephemeral_accepts_a_row_with_composite_pk
    description: |
      events_ephemeral's (event_id, created_at) composite PK accepts a
      well-formed insert. NOTE: events_ephemeral itself is hand-written in
      the same migration file per the IMPLEMENTER NOTE above (codegen cannot
      express PARTITION BY or a composite PK) — this test case exercises
      that hand-written portion, not codegen output.
    requirement_ref: PAR-03
    arrange: ""
    act: |
      const event_id = generated.uuid();
      try h.conn.exec(
          "INSERT INTO events_ephemeral (event_id, instance_id, event_type, actor_id, " ++
          "created_at, sequence_number, idempotency_key, global_seq, tenant_id) " ++
          "VALUES ($1, $2, 'SOME_DELETE_CLASS_TYPE', $2, now(), 1, $3, 1, $4)",
          &.{ event_id, generated.uuid(), generated.uuidString(), fx.tenant_id },
      );
    assertions: |
      // CUSTOM: assert exactly one row exists in events_ephemeral for event_id;
      // assert a second INSERT with the SAME (event_id, created_at) pair fails
      // with a primary-key violation (23505).

# ------------------------------------------------------------
# Rollback notes
# ------------------------------------------------------------
rollback_strategy: |
  Forward-only, per project policy (docs/anti-patterns.md — no DROP in
  migrations). retention_class defaults to the non-destructive
  archive_queryable mode, so no existing event type is silently reclassified
  toward hard deletion by this migration alone.
