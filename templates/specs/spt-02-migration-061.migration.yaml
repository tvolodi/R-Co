schema_version: 1
migration_number: 61
name: spt02_copy_rows_to_tenant_schemas
requirement_ids: [SPT-02]
purpose: |
  SPT-02 data migration phase 1: copy all rows from public schema tables into
  per-tenant schemas.

  Steps performed (in a DO $$ block):
    1. ADD COLUMN tenant_schemas.status TEXT NOT NULL DEFAULT 'pending' (idempotent).
    2. Collect all distinct tenant_id values across every affected table.
    3. For each tenant_id not yet in tenant_schemas: call bpm_provision_tenant_schema().
    4. For each tenant_id where tenant_schemas.status != 'active':
       in a single transaction, INSERT INTO tenant_<schema>.<table>
       SELECT ... FROM public.<table> WHERE tenant_id = <this_tenant>
       using ON CONFLICT DO NOTHING so a partial retry does not duplicate rows.
    5. UPDATE tenant_schemas SET status = 'active' WHERE tenant_id = <this_tenant>.

  Idempotent: tenants with status = 'active' are skipped on re-run.
  Interrupted copy: status remains 'pending'; retry re-copies missing rows safely
  via ON CONFLICT DO NOTHING semantics.

  Affected tables (all carrying tenant_id NOT NULL as of migration 060 baseline):
    events, events_archive, process_definitions, instance_projections, tasks,
    tokens, audit_entries, audit_log, users, groups.
  Additional table with tenant_id FK (requires special handling): tenant_hostnames.

# The ALTER TABLE for the status column is generated by codegen.
# All remaining SQL (the per-tenant copy DO $$ block) is a -- CUSTOM: block
# that BACKEND-DEV writes inside the generated migration file.
tables:
  - mode: alter
    name: tenant_schemas
    add_columns:
      - { name: status, type: "text", not_null: true, default: "'pending'" }

fixtures:
  - name: tenant_a_id
    kind: uuid
  - name: tenant_b_id
    kind: uuid

test_cases:
  - name: two_tenants_schemas_created_and_rows_copied
    description: |
      Given two tenants each with rows in process_definitions, events, and tasks
      in the public schema, when migration 061 is applied, then tenant_schemas
      has exactly two rows with status='active', the matching tenant schemas
      exist in pg_namespace, and row counts in each tenant schema match the
      public schema counts for that tenant.
    requirement_ref: SPT-02
    arrange: |
      // CUSTOM: insert process_definitions, events, tasks rows for tenant_a and tenant_b
      // with tenant_id = fx.tenant_a_id and fx.tenant_b_id respectively
    act: |
      // CUSTOM: apply migration 061 SQL via helpers.applyMigration(h.conn, "061_spt02_copy_rows_to_tenant_schemas.sql")
    assertions: |
      // CUSTOM: assert tenant_schemas has 2 rows with status='active'
      // CUSTOM: assert SELECT COUNT(*) FROM tenant_<a>.<table> matches public.<table> WHERE tenant_id=tenant_a
      // CUSTOM: assert SELECT COUNT(*) FROM tenant_<b>.<table> matches public.<table> WHERE tenant_id=tenant_b
      // CUSTOM: assert no cross-tenant contamination (tenant_a schema has 0 rows belonging to tenant_b)

  - name: idempotent_rerun_no_error_no_change
    description: |
      Given migration 061 has already been applied (all tenants have status='active'),
      when migration 061 is applied again, then no error is raised and the database
      state is unchanged (row counts identical, status still 'active').
    requirement_ref: SPT-02
    arrange: |
      // CUSTOM: apply migration 061 once (setup: tenants already active)
    act: |
      // CUSTOM: apply migration 061 a second time via helpers.applyMigration
    assertions: |
      // CUSTOM: assert no error raised on second run
      // CUSTOM: assert row counts in tenant schemas unchanged (no duplicates)
      // CUSTOM: assert tenant_schemas.status = 'active' for all tenants

  - name: interrupted_copy_retry_copies_missing_rows
    description: |
      Given a tenant with a tenant_schemas row at status='pending' (simulating an
      interrupted copy with some rows already present in the tenant schema), when
      migration 061 is applied, then the remaining rows are inserted without error
      and status becomes 'active' with no duplicate rows.
    requirement_ref: SPT-02
    arrange: |
      // CUSTOM: insert tenant_a rows in public schema
      // CUSTOM: call bpm_provision_tenant_schema() to create schema + registry row (status='pending')
      // CUSTOM: insert a subset of tenant_a rows into the tenant schema directly (partial copy)
    act: |
      // CUSTOM: apply migration 061 via helpers.applyMigration (should fill in the remaining rows)
    assertions: |
      // CUSTOM: assert no error raised
      // CUSTOM: assert row count in tenant schema equals full count in public schema for tenant_a
      // CUSTOM: assert no duplicate rows (ON CONFLICT DO NOTHING semantics)
      // CUSTOM: assert tenant_schemas.status = 'active' for tenant_a
