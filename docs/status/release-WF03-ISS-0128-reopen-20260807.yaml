         failure with only that change applied.
      2. Running zig build test-integration against current main
         (commit c077db0, after PR #535 was squash-merged) with a freshly
         created database, and reproducing the identical
         StoreError.InstanceNotFound failure at the identical call site.

    The actual defect: TC-DB-03-01 called store.append() with a hardcoded
    UUID literal that was never inserted into instance_projections --
    the test's own fixture INSERT, post-append assertions, and cleanup all
    correctly used a different, per-run random UUID (inst_id_str).

