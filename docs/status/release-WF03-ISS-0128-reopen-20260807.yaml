  implementation: "CORRECT"
  verification: "Direct test execution against main both before and after the fix, on freshly created databases"
  notes: |
    The prior release decision approved PR #535 (SET LOCAL search_path in
    src/event_store/store.zig::Store.append()) as the fix for ISS-0128.
    That change is retained in this branch's history (it is already on
    main) and is harmless, reasonable defensive hardening consistent with
