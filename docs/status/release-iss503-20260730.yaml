blockers: []
major_issues:
  - id: "ISS-503-TESTISO-01"
    severity: MAJOR
    description: >-
      tests/integration/test_iss503_rls_removal.zig's four test cases mutate
      the shared public.tenant table directly (INSERT/UPDATE storage_mode)
      without transactional isolation between test blocks, relying only on
      `defer` cleanup. Independently re-running test-integration-iss503
      8 times produced 7 clean 4/4 passes and 1 failure of TC-ISS503-03 ("GBL-084
      is idempotent on re-apply"), which failed its own pre-flight guard
      because a LEGACY_RLS tenant row from a sibling test's fixture was
      visible at evaluation time under Zig's randomized test-block ordering.
      This is the exact anti-pattern documented in docs/anti-patterns.md
      ("Shared mutable tenant or fixture state across integration test
      blocks"). It does not indicate a defect in the GBL-084 migration
      itself — every criterion passed cleanly on isolated runs — but it is a
      latent flake that will intermittently fail CI runs of this suite until
      fixed.
    affected_requirement: ISS-503
    recommendation: >-
      Route a follow-up WF-03 to TEST-DESIGNER/BACKEND-DEV to give
      TC-ISS503-01/02/03 fully isolated per-test-UUID tenant fixtures (or
      serialize this file's test-block execution) so no test's LEGACY_RLS
      fixture can be visible to another test's pre-flight guard check. Does
      not block this release — the migration's own correctness is proven on
      clean runs — but must be fixed before this suite can be trusted
      unattended in CI.

