recommendation: >-
  Release ISS-503. The GBL-084 RLS-removal migration (already merged to main
  via PR #95/#99, commit 01cf924, prior to this continuation run) is
  content-identical on this feature branch — verified byte-for-byte against
  origin/main. What this continuation run adds is the missing integration
  test file (tests/integration/test_iss503_rls_removal.zig, 4 test cases)
  that gives ISS-503's three acceptance criteria their first real evidence
  against a live PostgreSQL database, plus mechanical Zig-0.16 compile-drift
  fixes that were blocking the umbrella test suite (unrelated to ISS-503
  business logic, fixed per the Unblock-Everything directive). All three
  acceptance criteria are independently confirmed by direct re-execution in
  this validation pass, not merely trusted from the TEST-RUNNER report. One
  MAJOR test-isolation defect was found and is documented below — it affects
  only the reliability of the regression test itself, not the correctness of
  the GBL-084 migration, which passed a clean run in this same validation
  pass.
