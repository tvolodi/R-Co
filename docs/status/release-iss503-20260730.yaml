acceptance_criteria_evidence:
  - criterion_id: "ISS-503 AC-1"
    description: >-
      Guard: only proceeds when no tenant remains in LEGACY_RLS.
    evidence:
      - source: "migrations/GBL-084_rls_removal.sql (read directly, lines 15-43)"
        note: >-
          The DO $$ ... $$ block's pre-flight counts public.tenant rows with
          storage_mode = 'LEGACY_RLS' and RAISE EXCEPTIONs with message
          "ISS-503 pre-flight failed: % tenant(s) still in LEGACY_RLS mode..."
          when v_legacy_count > 0, before any DDL statement runs. Because the
          guard and all DDL share one DO $$ ... $$ block, a RAISE EXCEPTION
          aborts the entire block atomically — zero DDL executes and the
          migration runner (src/tools/migrate.zig) does not record the file
          in public.schema_migrations.
      - test_id: TC-ISS503-01
        name: "GBL-084 pre-flight blocks when LEGACY_RLS tenants exist"
        verdict: PASS
        note: >-
          Read tests/integration/test_iss503_rls_removal.zig lines 234-292
          directly. The test inserts a real tenant row with
          storage_mode='LEGACY_RLS', runs the actual GBL-084 SQL file's bytes
          via conn.simpleQuery() inside a self-managed BEGIN/ROLLBACK, and
          asserts pg.PgError.ServerError is raised plus zero drift in
          RLS-policy count / tenant_id column count / helper-function count
          before vs after. This exercises the exact guard path described in
          AC-1, not a mock or approximation. Independently re-run by
          RELEASE-VALIDATOR (see test_results_summary) — passed cleanly in
          6 of 7 properly-spaced re-runs (see AC-3 for the one flake, which
          is a test-isolation issue, not a guard-logic defect).
    status: SATISFIED
  - criterion_id: "ISS-503 AC-2"
    description: >-
      RLS policies + tenant_id predicates removed; GBL-077 teardown completed.
    evidence:
      - source: "migrations/GBL-077_tnt07_rls_cleanup.sql + migrations/GBL-084_rls_removal.sql (both read directly)"
        note: >-
          GBL-077 (TNT-07, merged earlier) already disables RLS, drops the
          six tenant-scoped policies, and drops tenant_id from the same
          public business tables plus the bpm_effective_tenant_id() helper,
          gated by its own pre-flight (all tenants have a completed
          tenant_schemas + tnt05_progress row). GBL-084 (ISS-503) re-applies
          the identical DISABLE ROW LEVEL SECURITY / DROP POLICY IF EXISTS /
          DROP COLUMN IF EXISTS tenant_id / DROP FUNCTION IF EXISTS
          bpm_effective_tenant_id() CASCADE statements, gated by ISS-503's
          own narrower pre-flight (storage_mode = 'LEGACY_RLS' count). Every
          statement in both files uses IF EXISTS / DROP COLUMN IF EXISTS, so
          GBL-084 is a safe, idempotent no-op re-assertion of GBL-077's
          teardown for any environment where GBL-077 already ran, and is the
          actual enforcement point for environments where tenants only
          became SCHEMA-eligible after GBL-077's stricter gate had already
          passed. Together the two files fully remove RLS policies, tenant_id
          columns from public-schema business tables, and the helper
          function — confirmed by direct file read, not by inference.
      - test_id: TC-ISS503-02
        name: "GBL-084 succeeds when zero LEGACY_RLS tenants remain"
        verdict: PASS
        note: >-
          Flips any residual LEGACY_RLS tenant to SCHEMA, applies GBL-084's
          real SQL for real (BEGIN/COMMIT, not rolled back), and asserts
          countRlsPolicies()==0, countTenantIdColumns()==0,
          countEffectiveTenantIdFunction()==0 against pg_policies /
          information_schema.columns / pg_proc directly. Independently
          re-run — passed.
      - test_id: TC-ISS503-03
        name: "GBL-084 is idempotent on re-apply"
        verdict: PASS (with one flaky failure observed independently — see issues)
        note: >-
          Applies GBL-084 twice in a row and asserts identical
          all-zero teardown state after each apply (IF EXISTS everywhere
          means the second apply is a no-op). Passed in 6 of 7 independent
          re-runs by RELEASE-VALIDATOR; failed once when a leftover
          LEGACY_RLS tenant row from a concurrently-scoped fixture in the
          same shared public.tenant table caused this test's own
          "flip-to-SCHEMA" precondition step to be evaluated against a
          polluted table. See issues list — MAJOR, root cause is missing
          test isolation, not a migration defect.
    status: SATISFIED
  - criterion_id: "ISS-503 AC-3"
    description: >-
      Regression suite green (ties to ISS-504).
    evidence:
      - test_id: "test-integration-tm (14/14)"
        verdict: PASS
        note: >-
          Independently re-run by RELEASE-VALIDATOR via
          `zig build test-integration-tm --summary all` against the live
          BPM_TEST_DB_URL (port 5434) — exit 0, "Build Summary: 5/5 steps
          succeeded; 14/14 tests passed". Confirms TEST-RUNNER's reported
          14/14 was real, not fabricated.
      - source: "docs/requirements.yaml ISS-504 acceptance criteria (read directly)"
        note: >-
          ISS-504's three criteria are (1) public.schema_migrations tracks
          GBL- migrations while each tenant_<slug>.schema_migrations tracks
          per-tenant migrations, (2) provisioning a new tenant records its
          per-tenant migration state in its own schema, (3) the ADP-12
          default-tenant regression is green. None of these depend on the
          tenant_id columns or RLS policies GBL-084 removes from public
          business tables — ISS-504's tracking mechanism is
          public.schema_migrations.schema_name, an orthogonal column unaffected
          by GBL-084's DDL. test-integration-tm (the ISS-504 regression gate)
          passing 14/14 on a database with GBL-084 applied confirms ISS-503
          does not contradict or regress ISS-504.
    status: SATISFIED

migration_check:
  file: migrations/GBL-084_rls_removal.sql
  present: true
  additive: false
  idempotent: true
  no_drop_table: true
  drops_columns: true
  drop_column_justification: >-
    tenant_id column removal from public-schema business tables is the
    explicit, intended purpose of this migration (SPT-03 cleanup phase) —
    gated behind a pre-flight guard requiring zero LEGACY_RLS tenants, so no
    tenant relying on RLS-based isolation can have its tenant_id dropped out
    from under it. This is a deliberate, guarded exception to the
    "no DROP COLUMN without a data-preservation step" anti-pattern, consistent
    with GBL-077's identical precedent for the same tables.
  guards: >-
    RAISE EXCEPTION when count(*) of public.tenant WHERE storage_mode =
    'LEGACY_RLS' > 0. Zero schema-qualified issues (uses public.* explicitly
    by design since GBL- prefix is exempt from lint_migration_schema.py's
    business-table check, per file header).
  migrate_command: "zig build migrate"
  migrate_exit_code: 0
  migrate_outcome: >-
    Independently re-run by RELEASE-VALIDATOR against BPM_DB_URL
    (postgres://bpm:bpm@localhost:5442/bpm_dev). GBL-084_rls_removal.sql
    shows "skip" (already applied, recorded in public.schema_migrations).
    No new migrations to apply. Confirms the migration is truly applied to
    the live dev database state, not merely present as a file.
  main_vs_feature_branch: >-
    migrations/GBL-084_rls_removal.sql is BYTE-CONTENT-IDENTICAL between
    origin/main and feature/ADHOC-iss503-infra-20260730 (diffed directly;
    only CRLF/LF line-ending artifacts, zero content difference). The
    migration file was already merged to main in PR #95/#99
    ("feat(WF02-iss501-504): Epic 5 — Multi-tenancy SPT coexistence
    (ISS-501..504)", commit 01cf924) before this continuation run started.
    This continuation run's actual new contribution is the previously-missing
    integration test file (tests/integration/test_iss503_rls_removal.zig,
    624 lines, new) that gives ISS-503's acceptance criteria their first real
    test evidence, plus unrelated Zig-0.16 compile-drift fixes needed to
    unblock the umbrella suite build (src/engine/reconstruction.zig,
    src/entities/validator.zig, and ~10 integration test files — see commit
    cc1dff7). Main does NOT yet have the new test file; it will be added to
    main when this feature branch's PR (once created) is merged. Main already
    has GBL-084 applied logically (migration file merged); the authoritative
    state for "is GBL-084 applied" is the live database's
    public.schema_migrations table, independently confirmed above via
    `zig build migrate` against BPM_DB_URL — GBL-084 is applied there
    regardless of which branch is checked out, because migrations are a
    database-state concern, not a branch-state concern.

