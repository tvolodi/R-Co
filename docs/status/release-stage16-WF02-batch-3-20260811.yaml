acceptance_criteria_audit:
  par_01:
    title: Monthly range partitioning of the event log
    ac1: "covered (TC-PAR-01-01, transitively via par02/par03 fixtures + migration 1147 inspection)"
    ac2: "covered (TC-PAR-01-02, TC-ES-03-01 duplicate idempotency_key path)"
    ac3: "covered, positive direction (TC-PAR-01-03, TC-ES-01-01); negative/rollback direction not
      separately exercised -- MINOR, structural (BEGIN/COMMIT bracketing is a 2-line invariant,
      any DB driver failure mid-transaction already rolls back by Postgres protocol, not by
      application logic that could regress silently)."
    ac4: "covered (TC-PAR01-04-01, REWORK 1, commit fa63e32d). Independently re-read: detaches the
      real current-month partition, asserts StoreError.PartitionMissingForWrite / HTTP 503,
      asserts zero rows written, unconditionally reattaches via defer. Confirmed against
      src/event_store/store.zig:79,647 and src/api/errors.zig:171-177 -- the SQLSTATE 23514
      check_violation-driven variant is genuinely implemented, not stubbed."
    ac5: "covered (TC-PAR-01-04, transitively via LIKE ... INCLUDING DEFAULTS at every partition
      creation site; index physical presence not independently asserted via pg_indexes -- MINOR,
      same class as PAR-04's transitive-evidence ACs below)."
    verdict: PASS -- all 5 ACs have real implementation and passing test evidence; no MUST AC is
      unimplemented.

  par_02:
    title: Proactive future partition creation
    ac1: "covered (TC-PAR-02-01/02/05, month-grid math)"
    ac2: "covered (TC-PAR-02-04/06/07, DB-enforced idempotency gate)"
    ac3: "implemented, thin coverage -- WARN/BLOCKER severity branch (partition_maintenance.zig:231-236)
      is 3 lines of pure integer comparison, no test drives runMaintenanceCycle() to
      future_count exactly 1 or 0. MINOR, acceptable as documented follow-up (ISS/GH not yet
      filed for this specific sub-gap per the handoff context -- recommend TEST-DESIGNER add
      in a follow-up batch, non-blocking for this release)."
    ac4: "covered (TC-PAR-02-03, computeNextRunDelayMs immediate-fire-on-restart path)"
    ac5: >
      NOT MET. AC5 text: "Each creation appends EXECUTION_PARTITION_CREATED carrying the
      partition name and its range bounds." Independently grepped src/scheduler/partition_maintenance.zig
      and the whole of src/ for EXECUTION_PARTITION_CREATED: zero call sites. This is not a
      test-coverage gap (no test written) -- it is an implementation gap (no code exists to
      test). ensurePartitionAttached() creates and attaches partitions but never calls
      Store.append() or emits any event. Filed as ISS-0670/GH-711 (OPEN), root-caused to a
      genuine missing design convention (no platform/system instance_id exists for
      Store.append()'s InstanceNotFound-gated API to accept a non-instance-scoped event) --
      correctly scoped as needing CODE-DESIGNER input, not a quick BACKEND-DEV fix.
    verdict: PARTIAL -- AC1/AC2/AC4 solid, AC3 acceptable-thin, AC5 UNMET (MUST AC, zero
      implementation). See disposition below.

  par_03:
    title: Partition-scoped retention and archival
    ac1: "covered, two independent layers (TC-PAR-03-01/02/03 app-level guard, NEW this batch,
      closing a real pre-existing coverage gap; TC-PAR-03-04/05/06 DB-level CHECK backstop)"
    ac2: "covered (TC-PAR-03-08 DETACH/ATTACH no-row-copy aging + queryability; TC-PAR-03-09
      idempotent re-run; TC-PAR-03-07 delete-class converse routing)"
    ac3: "implemented, thin coverage -- pre-drop guard SQL shape unit-tested (TC-PAR-03-11);
      TC-PAR-03-07 exercises only the non-tripping path. MINOR, acceptable (guard is
      defense-in-depth behind two independent AC1 layers that already prevent the condition
      it guards against in normal operation)."
    ac4: "implemented, no direct test -- Adp11GuardTripped branch (partition_retention.zig:323-326)
      is simple pure logic, structurally unreachable in normal operation (same reasoning as
      AC3). MINOR, acceptable as documented follow-up."
    ac5: "implemented, no direct test -- ORPHAN_PARTITION transition on failed re-attach
      (archiveOnePartition()'s markOrphan(), retryOrphanedAttaches()) not exercised by a test
      that deliberately induces the failure. MINOR, acceptable as documented follow-up,
      same class as PAR-02 AC3."
    ac6: >
      NOT MET. AC6 text: "Detach and drop each append EXECUTION_PARTITION_DETACHED or
      EXECUTION_PARTITION_DROPPED to the event log." Independently grepped
      src/scheduler/partition_retention.zig and the whole of src/: zero call sites for either
      event name. Same class of gap as PAR-02 AC5 -- implementation, not test-coverage.
      Filed under the same ISS-0670/GH-711 umbrella (the design-note recommendation in that
      issue explicitly covers all six unimplemented EXECUTION_* platform events, including
      these two).
    verdict: PARTIAL -- AC1/AC2 solid, AC3/AC4/AC5 acceptable-thin, AC6 UNMET (MUST AC, zero
      implementation). See disposition below.

  par_04:
    title: Partition constraints declared before attach
    ac1: "covered transitively -- every successful attach in this batch's par02/par03/ADP-11-rewrite
      integration tests (6/6 targeted steps, independently re-run and confirmed this session)
      is a live, non-vacuous exercise of verifyAttachConstraints() returning .ok; a constraint
