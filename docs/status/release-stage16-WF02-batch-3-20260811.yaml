      presence already confirmed by every attach's .ok verdict (a missing CHECK would fail
      the attach itself, not just this insert test)."
    ac5: "covered (TC-PAR-04-01 formatting correctness) + transitively (every successful attach)."
    verdict: PASS -- all 5 ACs have real implementation; AC3/AC4 lack direct tests but the
      thinness is well-reasoned and structurally backstopped, not a hidden implementation gap.

