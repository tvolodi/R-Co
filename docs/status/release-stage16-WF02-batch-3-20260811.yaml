blocking_issues:
  - id: ISS-0670
    github_issue: "https://github.com/tvolodi/R-Co/issues/711"
    severity: MAJOR
    status: OPEN
    scope: "PAR-02 AC5, PAR-03 AC6"
    description: >
      EXECUTION_PARTITION_CREATED (PAR-02 AC5) and EXECUTION_PARTITION_DETACHED /
      EXECUTION_PARTITION_DROPPED (PAR-03 AC6) are not emitted anywhere in src/ --
      confirmed by direct grep, not inferred from the issue text alone. These are not
      optional/SHOULD clauses: both ACs are plain bullets in a MUST-priority requirement's
      Acceptance Criteria list, with the same unconditional phrasing ("Each creation
      appends...", "Detach and drop each append...") as every other AC in the same list.
      Per docs/anti-patterns.md's governing rule ("RELEASE-VALIDATOR MUST return FAIL if any
      MUST requirement has no passing integration test evidence... 'will be addressed later'
      is not an acceptance criterion"), and by the stronger fact that this is missing
      implementation rather than merely missing test coverage, these two specific ACs cannot
      be treated as met. The root cause (no platform/system instance_id convention exists for
      Store.append()'s InstanceNotFound-gated API) is correctly scoped as needing a
      CODE-DESIGNER design note before BACKEND-DEV can close it -- this is not a quick fix,
      and forcing it into this handoff's rework budget would be the wrong move. It should
      remain a tracked, scheduled follow-up.
    disposition: >
      Does NOT block PAR-01 or PAR-04, which have no comparable gap. DOES block PAR-02 and
      PAR-03 from being marked fully RELEASED as-is: their status should move to a state that
      reflects "implemented and tested except for AC5/AC6 respectively, tracked via
      ISS-0670/GH-711" rather than an unqualified RELEASED that silently claims full AC
      coverage. Recommend DOC-UPDATER route PAR-02/PAR-03 to a partial-release / TESTED-not-RELEASED
      marking (see reqctl.py's available status values) with ISS-0670/GH-711 referenced, while
      PAR-01/PAR-04 proceed to full RELEASED.

