    tracking: "ISS-0672 / GH-306 (OPEN)"
    scope_marking_rationale: >
      Applying the SAME partially_approved_requirements pattern as batch-3's PAR-02/PAR-03,
      despite a real and deliberately-noted difference in provenance. Batch-3's PAR-02
      AC5/PAR-03 AC6 gap was discovered AS A SURPRISE during RELEASE-VALIDATOR's own independent
      grep -- no design document flagged it in advance, and CODE-DESIGN-VALIDATOR's Step 1b PASS
      did not know the gap existed. PIN-01's AC1/AC2 gap is the opposite: it was surfaced BY
      CODE-DESIGNER at Step 1 (a real schema-absence finding, not a shortcut), stated explicitly
      in the design document's own Scoping note and Open questions, and CODE-DESIGN-VALIDATOR
      PASSed the design AT STEP 1B KNOWING AC1/AC2 were out of scope -- the whole downstream
      chain (TEST-DESIGNER's spec, TEST-DESIGN-VALIDATOR, TEST-RUNNER, this handoff's own task
      description) treats it as a pre-agreed, validated scope boundary rather than a defect.
      Decision: this distinction changes the QUALITATIVE framing (this is planned, tracked,
      forward-looking scope-phasing -- not a missed requirement or a quality escape) but does
      NOT change the RELEASE MARKING itself. The requirement's text in docs/requirements.yaml is
      unconditional: PIN-01 is one requirement with 5 MUST-priority AC bullets, and 2 of the 5
      have no implementation behind them regardless of how well-reasoned or how far in advance
      the decision to defer them was made. A requirement_status.yaml entry of unqualified
      RELEASED would silently claim full AC coverage to any future reader who has not read this
      release decision or the design document's own scoping note -- exactly the failure mode
      docs/anti-patterns.md's governing rule for RELEASE-VALIDATOR warns against ("'will be
      addressed later' is not an acceptance criterion", regardless of how deliberately or how
      early "later" was decided). The batch-3 precedent's own language already generalizes
      correctly here: it says a requirement moves to a qualified state when "any MUST AC has no
      passing integration test evidence" -- it does not carve out an exception for ACs whose
      absence was foreseen. Practically: PIN-01's AC1/AC2 gap is LOWER RISK than batch-3's
      PAR-02/PAR-03 gap (a known, bounded, tracked scope-phasing decision with a clear unblock
      condition -- service_catalog schema changes + PLC-01 shipping -- vs. batch-3's gap, which
      needed a net-new design convention invented from scratch), and that lower risk is worth
      recording explicitly in this rationale for DOC-UPDATER and any future reader. But "lower
      risk" and "well-planned" are not the same axis as "fully met" -- the release marking tracks
      the latter, and on that axis PIN-01 and batch-3's PAR-02/PAR-03 are the same case.

