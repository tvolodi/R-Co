nfr_applicability:
  nfr_01_02_general_latency_throughput: >
    Applicable platform-wide, not specific to this batch's own new surface (PAR-05/PAR-06/PIN-01/
    PIN-02 add no new HTTP endpoint). zig build bench's NFR-01 (p99 read 1.010ms, p99 write
    2.586ms) and NFR-02 (append throughput 65369 events/sec) targets both pass their thresholds
    by a wide margin, run live this session after starting the stopped r-co-db-1 dev container
    (BPM_DB_URL target, port 5442) that zig build bench requires. These two targets are
    unaffected by this batch's changes either way (no read/write API path changed) and are
    reported for completeness, not as evidence specific to PAR-05/PAR-06.
  nfr_04_reconstruction_replay_INAPPLICABLE_AS_MEASURED: >
    PAR-06 changes the reconstruction query path itself (the bounded
    "SELECT * FROM events WHERE instance_id = $1 AND created_at >= $2 AND created_at < $3"
    predicate against the now-partitioned events table, plus the events_archive merge), which is
    exactly the surface NFR-04 (docs/BPM_Platform_Functional_Requirements.md: "Replaying an
    instance with up to 10,000 events SHALL complete in <=5 seconds") and EE-11 govern. Unlike
    batch-3's PAR-01..04 (correctly found not-applicable -- no new HTTP surface, no reconstruction
    query change), this batch's surface change means NFR-04 SHOULD be exercised.
    However: read tests/bench/bench.zig's measureReplayMs() (the existing "replay_10000_ms"
    target) in full and confirmed by grep that it seeds and scans a STANDALONE nfr_bench_events
    table by (run_id, seq) -- it never calls src/engine/reconstruction.zig's
    reconstructInstance() or eventWindowForInstanceInTx(), and never issues PAR-06's actual
    bounded query against the real partitioned events table or events_archive. Ran zig build
    bench live this session: all 5 targets report passed=true (replay_10000_ms
    actual=34.283ms against the 5000ms threshold), but this number is NOT evidence about
    PAR-06's real reconstruction path's latency under partition pruning or archive merge --
    it measures an unrelated synthetic table scan that predates PAR-06 and was never updated to
    exercise it. Treating the green "replay_10000_ms" result as satisfying NFR-04 for THIS batch
    would be exactly the kind of unverified benchmark-label trust this handoff was written to
    prevent. Filed as a new incidental issue (ISS-0685/GH-732, MINOR -- benchmark fidelity gap,
    not a functional defect in PAR-06 itself) rather than silently accepted or silently ignored.
    This batch's OWN integration tests (TC-PAR-06-02/-03/-04/-05, all independently re-run
    passing) are real evidence the bounded query is correct and prunes partitions as designed;
    what is missing is NFR-04's specific latency-at-10,000-events claim against the real code
    path, which remains unverified by any benchmark after this batch, tracked via ISS-0685/GH-732.

blocking_issues:
  - id: ISS-0678
    github_issue: "https://github.com/tvolodi/R-Co/issues/720"
    severity: MAJOR
    status: OPEN
    scope: "par06_instance_projections_event_window_test.zig (pre-existing test file, NOT this
      batch's own PAR-06 behavioral code)"
    description: >
      Schema-agnostic information_schema.columns/pg_indexes queries in a PRE-EXISTING test file
      (from an earlier Step 2a, not this batch's new par06_reconstruction_bounded_test.zig) match
      every accumulated tenant_% schema on the shared long-lived bpm_test container instead of
      just tenant_default. Independently re-reproduced this session (8/4 rows observed vs the
      report's 58/29 -- absolute counts vary with container schema accumulation, failure mode
      identical). Confirmed genuinely pre-existing and unrelated to this batch's own PAR-06
      changes: the NEW file, test-integration-par06-reconstruction, passes 5/5 independently.
    disposition: "Does NOT block PAR-06's own release -- this batch's own PAR-06 behavioral
      surface (the bounded query, archive merge, repair path, window maintenance) is fully
      covered by test-integration-par06-reconstruction (5/5, independently re-run). Tracked
      separately, does not gate this batch."
  - id: ISS-0680
    github_issue: "https://github.com/tvolodi/R-Co/issues/722"
    severity: MAJOR
    status: OPEN
    scope: "PIN-01 (AC3/AC4 error paths, resolve())"
    description: >
      PinResolver.resolve() leaks allocator-owned PinnedVersion fields (resolved_id/version/ref)
      on early-return error paths (VariableSchemaViolation, UnresolvedPinOverride,
      PoolExhausted/TransactionFailed) -- confirmed via this session's own live re-run (8 leaked
      allocations, 0 assertion failures, stack traces matching the issue's documented signature
      exactly).
    disposition: "Does NOT block PIN-01's AC3/AC4/AC5 release -- 0 assertion failures across
      9/9 independently re-run tests confirms this is a resource leak on error paths, not a
      functional/correctness defect. A production instance-start rejection leaks memory
      proportional to SERVICE_TASK count per rejected request; tracked separately as MAJOR,
      recommend prioritizing given it affects every UnresolvedPinOverride/VariableSchemaViolation
      rejection in production, not just this batch's own scope."
  - id: ISS-0672
    github_issue: "https://github.com/tvolodi/R-Co/issues/306 (requirement issue's own comment thread)"
    severity: "N/A (design-time scope decision, not a defect)"
    status: OPEN
    scope: "PIN-01 AC1, AC2"
    description: >
      service_catalog has no version/status column and PLC-01 (process module catalog) does not
      exist in this codebase yet -- both are genuine, confirmed schema/table absences, not
      implementation shortcuts. This scoping was made explicitly by CODE-DESIGNER at Step 1
      (src/design/pin-01-dependency-version-resolution.md's Scoping note and Open questions
      #1/#2) and confirmed PASS by CODE-DESIGN-VALIDATOR at Step 1b -- i.e. the design was
      validated WITH this gap known and explicit, not discovered as a surprise during or after
      implementation.
    disposition: >
      DOES block PIN-01 from being marked fully RELEASED as-is: AC1/AC2 are plain MUST-priority
      bullets in PIN-01's Acceptance Criteria list, unconditionally worded ("GIVEN a SERVICE_TASK
      reference that names no catalog entry with an active version, WHEN... THEN... returns HTTP
      422 UnresolvedCatalogRef"), with zero implementation behind them. See rationale below for
      why this still receives the same partially_approved_requirements marking as batch-3's
      PAR-02/PAR-03 despite the different provenance of the gap.
  - id: ISS-0685
    github_issue: "https://github.com/tvolodi/R-Co/issues/732"
    severity: MINOR
    status: OPEN
    scope: "NFR-04 benchmark fidelity (tests/bench/bench.zig), not PAR-06's own implementation"
    description: >
      zig build bench's NFR-04 "replay_10000_ms" target measures a synthetic standalone table
      scan, not reconstruction.reconstructInstance()'s real PAR-06 bounded query. Filed this
      session as a new incidental finding (see nfr_applicability above).
    disposition: "Does NOT block this batch's release -- PAR-06's own integration tests already
      provide real, independently re-run evidence the bounded query is correct; what's missing
      is NFR-04's specific 10,000-event latency claim against the real path, which is a
      benchmark-coverage gap, not a PAR-06 functional defect. Tracked for a future benchmark fix."
  - id: ISS-0686
    github_issue: "https://github.com/tvolodi/R-Co/issues/733"
    severity: MAJOR
    status: OPEN
    scope: "PAR-05 (trailing AC sentence: events_legacy retention/archival integration)"
    description: >
      PAR-05's trailing AC sentence ("events_legacy is retained read-only for one full
      archive_after_months cycle and then attached to events_archive; it is never emptied row by
      row") has zero implementation. PartitionConverter (src/db/partition_conversion.zig) has no
      code path that hands events_legacy off to PartitionRetention.runArchivalAging() (PAR-03)
      after the archive_after_months cycle -- confirmed by reading both modules in full and
      grepping each for the other's identifiers; no call site references the other.
      events_legacy is left retained indefinitely with no automatic transition to events_archive
      once its retention window elapses. Unlike ISS-0670/GH-711 (batch-3's precedent, which
      already had a filed, numbered tracking issue by the time batch-3's RELEASE-VALIDATOR ran),
      no local ISS number or GitHub issue was found for this specific gap when searched this
      session (docs/issues/issue_index.json, gh issue search) -- the design document's own Open
      questions #5 flagged it in prose but it had not yet been converted into a tracked issue.
      Filed this session as part of this handoff's incidental-defect duty.
    disposition: >
      Blocks PAR-05 from unqualified full RELEASED status; does not block AC1-AC5 (the
      conversion pipeline itself), which are independently re-run and confirmed working (6/6).
      See partially_approved_requirements below. This mirrors batch-3's PAR-02 AC5/PAR-03 AC6
      pattern closely enough (a MUST AC with genuinely zero implementation, not merely thin test
      coverage) that the same partial-release treatment applies.

