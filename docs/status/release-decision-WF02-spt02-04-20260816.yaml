blocking_issues:
  - severity: BLOCKER
    source: "Independent RELEASE-VALIDATOR verification (fresh-DB path + NFR bench gate)"
    description: >-
      Migration 062_remove_tenant_id_rls_from_public.sql (shipped by this run) aborts on any
      database where migration 052 has created the v_active_configs view and public
      artifact_activations still carries tenant_id — which is EVERY fresh database, because
      GBL-123 (migrationOrder 1123) runs ~1000 order-units AFTER 062 (order 62), and 052
      (order 52) runs before both. Reproduced verbatim against bpm_dev (BPM_DB_URL) inside a
      rolled-back transaction: `ERROR: cannot drop column tenant_id of table
      artifact_activations because other objects depend on it / DETAIL: view v_active_configs
      depends on column tenant_id of table artifact_activations`. 062's belt-and-suspenders
      residual-index sweep handles indexes/constraints but NOT dependent VIEWS. The Step 4 gate
      passed only because bpm_test applied GBL-123 on 2026-08-11 (before 061/062/063 existed),
      so artifact_activations had already lost tenant_id and 062's Class-B discovery found
      nothing to drop there — the failure path was never exercised by the SPT test suite.
    affected_requirements: ["SPT-02", "SPT-03", "SPT-04"]
    recommended_agent: "BACKEND-DEV (fix migration 062 to drop/recreate the dependent v_active_configs view around the DROP COLUMN, or DROP COLUMN with dependent-view handling) + TEST-DESIGNER (add a test reproducing the view-dependency state: synthetic public view depending on a Class-B tenant_id column, then execute 062 raw SQL and assert success)"

