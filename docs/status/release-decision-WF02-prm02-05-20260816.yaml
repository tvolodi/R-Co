known_minor_issues:
  - severity: MINOR
    description: >
      timestampToIso in the promotion-context path returns a fixed "1970-01-01T00:00:00Z"
      placeholder, so created_at in handleGetPromotionContext is no longer the review's
      creation time. Pre-existing code was equally broken (dangling stack pointer +
      free-on-string-literal segfault); TEST-DESIGNER's fix removes the crash but leaves
      the field constant. Functional, not a security invariant. Recorded by SECURITY-REVIEWER
      rework2 inner report; recommended follow-up to implement real ISO formatting (TODO
      in code). Related to ISS-0135 (Zig 0.16 timestamp API removed).
  - severity: MINOR
    description: >
      fillRandom ignores the return value of std.os.linux.getrandom. Bounded impact (bytes
      feed a synthetic promotion_id idempotency key, not an access-control token; getrandom
      blocks rather than failing for 16-byte requests). Mirrors the pre-existing
      src/api/routes/onboarding.zig pattern. Recorded by SECURITY-REVIEWER rework2 inner report.

