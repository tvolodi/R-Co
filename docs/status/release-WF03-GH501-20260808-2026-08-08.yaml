# ---------------------------------------------------------------------------
# Decision rationale
# ---------------------------------------------------------------------------
rationale: >
  ISS-0173 was the OIDC-side instance of the ISS-0172 build-wiring blind spot: a Zig 0.16-incompatible
  orphan file (src/oidc/jwks.zig, 538 lines) re-exported from src/main.zig:78 with zero reachable
  callers, hidden from every test target and every build-wire check. The fix removes both the file
  and the dead re-export (State A DELETE), then installs a 4-test regression suite with deliberate-
  mutation verification. Three independent verification axes (build green, regression tests pass,
  mutation tests fail-then-green-then-fail-then-green) all line up. No DB, Keycloak, or HTTP impact;
  zero callers existed pre-fix and zero callers are needed post-fix. PR squash-merge follows.

