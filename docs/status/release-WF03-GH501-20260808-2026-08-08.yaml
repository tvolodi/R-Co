acceptance_criteria_status:
  ac1_jwks_zig_compiles:
    target: "src/oidc/jwks.zig compiles under Zig 0.16"
    status: "N/A — file removed by State A DELETE decision"
    rationale: "Workspace caller census confirmed zero callers of main.oidc_jwks across src/ and web/ (excluding zig-out/zig-pkg/vendor/.venv/node_modules). State A (DELETE) selected over State B (KEEP + RENAME + WIRE) because there is no runtime code to support. If a future intent resurrects ISS-402's token cache, State B design (with std.Io.Mutex threading) is documented in src/design/iss0173-gh501-jwks-zig016-fix.md §4."
  ac2_genuine_test_target:
    target: "A build target genuinely ANALYSES the file (not a bare _ = oidc_jwks; pin)"
    status: "PASS"
    rationale: "4 regression tests at tests/unit/iss0173_oidc_jwks_orphan_test.zig exercise the absence of the file, the absence of the re-export, the absence of the identifier, and the git-tracking status. Each test does I/O (filesystem, git ls-files) — a deliberate real I/O pattern, not a type-only pin. lint_test_wiring confirms 267 test-bearing files reachable from 84 addTest roots."
  ac3_deliberate_mutation:
    target: "Inject a statement error into a jwks.zig function body and confirm the target goes red"
    status: "PASS — Phase 3 RED confirmed"
    rationale: "Three-phase mutation: Phase 1 RED proof (file present, 4/4 fail), Phase 2 GREEN proof (file deleted, 4/4 pass), Phase 3 mutation (re-adding re-export line in scratch wrapper, zig build returns RED with 'unable to load jwks.zig: FileNotFound', revert returns GREEN). All evidence captured in scratch/_iss0173_*.log."
  ac4_iss402_re_verified:
    target: "ISS-402 OIDC token validation cache behaviour (GH #198) re-verified once the file actually compiles"
    status: "N/A"
    rationale: "ISS-402 token cache is in src/identity/provider/oidc/jwks_cache.zig (NOT src/oidc/jwks.zig). The src/oidc/jwks.zig file was a mis-named duplicate from before the ISS-402 fix landed. No ISS-402 functionality lost in this DELETE."
  ac5_census_for_dead_reexports:
    target: "A census is run for the same pattern: every pub const X = @import(...) in src/main.zig / src/bpm.zig whose module has no reachable caller"
    status: "PASS — conducted by BACKEND-DEV Step 3 pre-flight grep"
