partially_approved_requirements:
  - id: "VLD-04"
    met: ["AC3", "AC4", "AC5", "AC1 (module half: version not marked semantically_valid)", "AC2 (module half: gate returns invalid)"]
    unmet: ["AC1 (handler half: draft-save HTTP 422)", "AC2 (handler half: promotion-submit HTTP 422, no plan, no promotion_reviews row)"]
    tracking: "ISS-0715 / GH-813 (OPEN)"
    scope_marking_rationale: >
      Applying the same partially_approved_requirements pattern established by batch-3
      (PAR-02/PAR-03), batch-4 (PIN-01), and batch-5 (PIN-03): a requirement whose acceptance
      criteria are not fully met end-to-end is held at TESTED-not-RELEASED, regardless of how
      early/deliberately the gap was disclosed. VLD-04's gate module is fully implemented and
      tested (7/7, independently re-run) -- AC3 (stale-verdict re-verification), AC4 (5 s compile
      budget -> timeout), AC5 (DEFINITION_VALIDATED / DEFINITION_VALIDATION_FAILED events), and
      the verdict-persistence halves of AC1/AC2 are all proven. What is missing is the handler
      wiring: no HTTP handler calls runSemanticGate, so the platform does not currently return
      HTTP 422 at the draft-save and promotion-submit call sites and the promotion path still
      computes a plan / could create a promotion_reviews row. The gap is disclosed in the design's
      Open questions and the test spec's Structural verification note and was accepted by the
      CODE-DESIGN-VALIDATOR and TEST-DESIGN-VALIDATOR hard gates, but per the governing precedent
      ("a requirement with N of M ACs met is held at TESTED, not RELEASED"), VLD-04 should not be
      marked unqualified RELEASED -- that would silently claim full AC coverage to a future reader
      who has not read the design, the test spec, or this decision. When ISS-0715/GH-813 is
      resolved (gate wired into the draft-save, /validate, and promotion-submit handlers), VLD-04
      should be revisited and moved to RELEASED.

