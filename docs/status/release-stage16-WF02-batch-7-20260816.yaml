non_blocking_followups:
  - id: ISS-0716
    github_issue: "https://github.com/tvolodi/R-Co/issues/814"
    severity: MINOR
    status: OPEN
    scope: "DDL-04 plat_migration_state bookkeeping (backfill_batch_size column static 5000; persisted status stays running)"
    disposition: "Does NOT block DDL-04's release -- purely bookkeeping, no AC impact. Tracked for a documentation/consistency follow-up."
  - id: ISS-0717
    github_issue: "https://github.com/tvolodi/R-Co/issues/816"
    severity: MINOR
    status: OPEN
    scope: "VLD-04 AC1 live draft-save surface: main.zig registers PATCH -> handlePatch (not PUT -> handlePut); the VLD-04 gate is wired into handlePut per the validated design call-site table, so the live frontend draft-save path (client.patch) is not yet gate-enforced"
    description: >
      REWORK-2 wired runSemanticGate into handlePut (PUT /api/v1/definitions/{id}) per the
      design's declared draft-save call site, and TEST-RUNNER/RELEASE-VALIDATOR confirmed the
      gate + handler. However main.zig's live definition-update route is PATCH -> handlePatch
      (web/src/api/definitions.ts uses client.patch), and handlePatch does not call the gate --
      so a finding-producing definition saved through the frontend would receive HTTP 200, not
      the AC1 HTTP 422. Pre-existing route-registration divergence (predates this batch; design /
      validators / ISS-0715 / prior decision all treated PUT as the draft-save surface). Fix:
      wire the gate into handlePatch (or register handlePut as the live PUT route). Non-blocking
      for VLD-04's release -- AC1 is satisfied at the declared call-site contract and the gate
      module + /validate + promotion surfaces are all enforced -- but tracked so the live PATCH
      gap is not silently dropped (filed this session as new issue).
  - id: PRM-01-vs-VLD-04-precedence
    severity: MINOR
    status: AWARE
    scope: "Promotion handler precedence edge: the VLD-04 gate runs before computePromotionPlan, so an unauthorized caller (no promotion.submit) with a semantically-invalid source definition receives HTTP 422 (gate) instead of PRM-01 AC1's HTTP 403"
    description: >
      In both promotion handlers the gate (runSemanticGateOnSource) runs before
      computePromotionPlan, so PlanError.Forbidden (403) is only reachable after the gate
      passes. Both outcomes are rejections; neither VLD-04 AC2 nor PRM-01 AC1 is invalidated --
      it only changes which error an unauthorized caller with an invalid source sees. No test
      exercises this precedence edge; flagged for awareness / potential future handler-order
      refinement. Non-blocking.

