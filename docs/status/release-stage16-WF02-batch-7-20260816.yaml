blocking_issues:
  - id: ISS-0715
    github_issue: "https://github.com/tvolodi/R-Co/issues/813"
    severity: MAJOR
    status: OPEN
    scope: "VLD-04 AC1 (draft-save HTTP 422) + AC2 (promotion-submit HTTP 422 / no plan / no promotion_reviews row) -- handler wiring"
    description: >
      The VLD-04 validation gate (src/validation/gate.zig) is implemented and tested (7/7),
      but no HTTP handler calls runSemanticGate: the draft-save handler (PUT
      /api/v1/definitions/{id}), the /validate handler (which runs VLD-01/02/03 validateDefinition
      directly without persisting a verdict), and the promotion-submit handler
      (src/api/routes/promotions.zig, which calls computePromotionPlan at line 84) all bypass the
      gate. Grep across src/**/*.zig for runSemanticGate|storedVerdictIsCurrent|persistVerdict
      returns matches only inside gate.zig. So AC1's "the platform returns HTTP 422" and AC2's
      "HTTP 422, computes no promotion plan and creates no promotion_reviews row" are not met
      end-to-end. Disclosed at design time (src/design/vld-04-validation-gate-authoring-
      promotion.md Open questions + tests/specs/VLD-04.md Structural verification note) and
      accepted by the CODE-DESIGN-VALIDATOR / TEST-DESIGN-VALIDATOR hard gates; the release
      marking nonetheless holds VLD-04 at TESTED per the batch-3/batch-5 precedent ("a requirement
      with N of M ACs met is held at TESTED, not RELEASED, regardless of how early/deliberately
      the gap was identified"). Filed this session as a new issue.
    disposition: "DOES block VLD-04 from being marked fully RELEASED as-is. VLD-04 should be held at TESTED (AC3/AC4/AC5 and the module halves of AC1/AC2 met) until the gate is wired into the three call sites, then moved to RELEASED."
  - id: ISS-0716
    github_issue: "https://github.com/tvolodi/R-Co/issues/814"
    severity: MINOR
    status: OPEN
    scope: "DDL-04 plat_migration_state bookkeeping (backfill_batch_size column static 5000; persisted status stays running)"
    description: >
      recordBatchProgress hardcodes backfill_batch_size=5000 in the persisted row (the adaptive
      value is only reported via BackfillResult.final_batch_size, asserted 2500 by
      TC-DDL-04-AC4-halving) and leaves the persisted status 'running' after loop completion (the
      design's applied/failed terminal write is not done). Both are documented and deliberately
      asserted in TC-DDL-04-AC6; neither violates any DDL-04 AC (progress counters are recorded;
      resume reads status IN ('pending','running')). Filed this session as a new issue.
    disposition: "Does NOT block DDL-04's release -- purely bookkeeping, no AC impact. Tracked for a documentation/consistency follow-up."

