nfr_benchmarks:
  applicable: false
  ran_bench: true
  note: >
    Ran `zig build bench` for completeness -- all 5 existing NFR checks pass
    (NFR-01 read p99 0.937ms, NFR-01 write p99 1.995ms, NFR-02 throughput
    67454.6 events/sec, NFR-04 replay 44.2ms, NFR-04 snapshot-replay 9.8ms, all
    well within threshold). This batch adds 3 real HTTP endpoints (MIG-06's
    run/status/resume), but tests/bench/bench.zig contains no HTTP-route-level
    latency/throughput harness at all -- every measurement it makes
    (measureReadP99/measureWriteP99/measureThroughput/measureReplayMs) is a
    direct DB-level event-store operation, with no code path anywhere in the
    test suite that drives a request through src/main.zig's router for ANY
    route, not only this batch's three new ones. This is a pre-existing,
    codebase-wide infrastructure gap, not something specific to MIG-06 that
    this batch should be blocked on introducing. Per
    docs/agents/workflows/WF-04_full_test_run.md, HTTP-level NFR benchmarking
    (Step 6 of that workflow) is a separate, dedicated pre-release/full-suite
    pass, distinct from a single WF-02 batch's Step 5 -- consistent with
    batch-0's own precedent (docs/status/release-stage16-WF02-batch-0-20260811.yaml)
    which recorded the same endpoints as "not applicable, no route to measure
    against in this batch" before they existed. Now that the routes exist,
    the correct next step is a future WF-04 pass (or a dedicated ADHOC task)
    to build an HTTP-level bench harness covering them, not for this batch to
    invent one ad hoc. Flagged here explicitly rather than silently skipped,
    per this role's instructions.

