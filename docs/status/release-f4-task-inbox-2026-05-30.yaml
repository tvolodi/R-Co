fixes_applied_before_release:
  - issue: task_id vs id field mismatch
    severity: MAJOR
    resolution: Added normalizeTask() in web/src/api/tasks.ts to map task_id->id at API boundary

  - issue: created_at epoch microseconds not converted to ISO string
    severity: MAJOR
    resolution: normalizeTask() converts epoch-us to ISO string via new Date(us/1000).toISOString()

  - issue: form_schema not stored or returned in task detail
    severity: MAJOR
    resolution: >
      Added form_schema_json param to createInTx; getById now fetches t.form_schema::text;
      serializeTaskDetail includes form_schema and correlation_key in response.

  - issue: operators see empty task inbox
    severity: MAJOR
    resolution: >
      handleInbox passes null assignee_id for operators; TaskInboxPage skips client-side
      assignee_ref filter for operator roles.

  - issue: useClaimTask using placeholder get() instead of assign endpoint
    severity: MAJOR
    resolution: Added tasksApi.assign(); useClaimTask now calls POST /tasks/:id/assign.

  - issue: task-detail-panel testid missing on loading and error states
    severity: MINOR
    resolution: Added data-testid="task-detail-panel" to all render branches in TaskDetailPanel.

rationale: >
  All 7 MUST requirements (TK-UI-01..06, TK-UI-10) have 100% passing E2E test coverage
  (22/22 tests). All 3 SHOULD requirements (TK-UI-07..09) also pass (7/7 tests).
  Total test pass rate: 29/29 (100%). No BLOCKER or MAJOR issues remain outstanding.
  All issues identified during TEST-RUNNER execution were resolved and re-verified in the
