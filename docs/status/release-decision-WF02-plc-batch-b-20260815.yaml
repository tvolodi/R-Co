scope_note: >
  Declared SUB_PROCESS interface contract release for stage 15 (SPC-01/SPC-02, both
  SHOULD). SPC-01 introduces the `interface` object on SUB_PROCESS nodes: when declared,
  only the named `inputs` are copied into the child instance's initial variable map (each
  validated against its json_schema before the child is created), and on child completion
  only the named `outputs` are merged back into the parent per EE-09 (unlisted child
  variables discarded); omitting the interface preserves EXT-05 behaviour unchanged
  (full copy / full merge). SPC-02 validates at definition-time (create/update) that every
  json_schema under inputs/outputs is well-formed JSON Schema, rejecting the definition
  with HTTP 422 otherwise; cross-definition compatibility (parent/child authored
  independently) is deliberately NOT checked here — that is PLC-03. Backend:
  src/definition/sub_process_interface.zig (new, 1059 lines), src/tools/json_schema.zig
  (new validateSchemaShape), src/definition/graph.zig, src/engine/instance.zig. Frontend:
  web/src/utils/canvas/interfaceValidation.ts (+ test), PropertyPanel, DefinitionEditorPage,
  ProcessCanvas, web/src/types/api.ts.

