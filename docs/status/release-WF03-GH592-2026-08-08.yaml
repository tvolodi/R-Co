    severity: MINOR
    blocks_release: false
    disposition: "filed and queued; will be fixed in its own WF-03 run"
    notes: |
      TC-ISS-0625-LUA-16-int-01 PASSES by asserting `stack_trace.len == 0` (the current
      ground truth). The intended non-empty-trace behaviour requires `debug.traceback`
      installed as the `errfunc` argument to `lua_pcall` so frames are captured before
      unwinding. Documented in the test report as a known limitation; release proceeds
      because the conditional payload construction (no zero-valued fields emitted) is
      the contract that matters at this stage.
