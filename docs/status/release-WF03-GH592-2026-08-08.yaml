# Safety / Mutation Evidence
mutation_evidence:
  - area: "LUA-15 anti-forgery"
    mechanism: "TC-ISS-0625-LUA-15-int-03 deliberately writes `__failure_reason__ = 'forged'` via `_G` from inside a Lua script"
    expected: "ScriptResult.error_kind == .RuntimeError (not .ExplicitFailure)"
    actual: "PASS — the registry-channel read ignores the _G overwrite; only `bpm.failure_reason` (set by platformFail) is read"
  - area: "LUA-12 service-call validator"
    mechanism: "TC-ISS-0625-LUA-12-int-02 calls platform.call_service with a non-existent svc_id"
    expected: "Structured error table returned (no exception)"
    actual: "PASS — service_catalog.lookup returns null, call_service.zig returns the structured error table"
  - area: "LUA-16 conditional payload"
    mechanism: "Conditional across two paths: .ExplicitFailure (no ScriptErrorPayload stack_trace) and .RuntimeError with empty LUA-08 source"
    expected: "ScriptErrorPayload is constructed only when LUA-08 instruction_count and LUA-09 memory_peak_bytes are non-zero (per design §21.3)"
    actual: "PASS — code path gates on those sources; zero-valued fields are NOT silently emitted"

# Release Recommendation
release_recommendation: APPROVED

recommendation_rationale: |
  1. **Quality**: HIGH
     - Three independent root causes, one per requirement, each with a clean, single-shape fix;
       no scope creep beyond the LUA-12/15/16 surface.
     - Conditional ScriptErrorPayload construction (LUA-16) avoids emitting zero-valued fields,
       which is the explicitly-warned worse test outcome in the design.
     - LUA-15's anti-forgery pattern (LUA_REGISTRYINDEX private keys) is the same pattern
       host_context.zig already established for ExecutionContext (LUA-05/06), and is
       mutation-tested by forging `_G.__failure_reason__` in TC-ISS-0625-LUA-15-int-03.

  2. **Risk**: LOW
     - Public API change: LUA-12's return shape changed from `(string, number)` to a single
       Lua table — this is the change noted in the design §17.1 and the field set is
       documented in the test report. No other public signature changes.
     - ServiceCatalog gains a real caller (call_service.zig) but the field is `*const` —
       no caller mutates the catalog.

  3. **Test Verification**: PASS
     - 9/9 integration TCs pass; pre-checks (backend services, infrastructure health, env-gate)
       all green.
     - 0 leaks.
     - Three-of-three requirements now have working runtime + tests.

  4. **CI / Platform**: No CI runs on the feature branch at this stage; Step Final
     (BACKEND-DEV) will open the PR and trigger the CI pipeline.

