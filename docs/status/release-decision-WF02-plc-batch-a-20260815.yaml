scope_note: >
  Pure-backend + admin-modules-frontend release for stage 15 (PLC-01/02/03/04).
  PLC-01 introduces the process_module_catalog table and CRUD/repository layer
  for admin-curated reusable process modules. PLC-02 introduces the publication
  requirement (catalog entries cannot be referenced from instance definitions
  until they declare a published interface schema). PLC-03 introduces
  cross-version compatibility (instance definition version + module reference
  must form a deterministic, replayable binding). PLC-04 introduces
  cross-tenant distribution (modules declared public/distributable are visible
  to other tenants via the cross-tenant catalog query). Migration 1161 creates
  the catalog table; migration 1162 adds the per-tenant uniqueness constraint
  resolved during the rework8→rework9 ISS-0703/0704/0705 cycle.

