    title: "plc01_repository UUID slice — interface_schema_id parsed via @intToPtr"
    fix: "src/repository/process_module_catalog.zig: interface_schema_id parsed from byte slice via std.mem.readInt(u128, ...) — never via @intToPtr (was reading UUID bytes as a pointer address)."
    fix_landed_in: "590a6624"
    evidence: "TC-PLC01-01..08 all pass (8/8); rework9 report records the resolution."
  - id: "ISS-0704"
    title: "interface-schema seed INSERT used wrong tenant schema (tenant_default not selected)"
    fix: "src/repository/process_module_catalog.zig seed path now SETs search_path to the active tenant schema before INSERT — verified by rework9 test cleanup that the test fixture inserts land in the same tenant as the lookup query."
    fix_landed_in: "590a6624"
    evidence: "TC-PLC02-01..06 all pass (6/6)."
  - id: "ISS-0705"
    title: "process_module_catalog uniqueness over (tenant_id, module_id) — duplicate-key error at re-run"
    fix: "migration 1162_plc01_module_id_unique_per_tenant.sql adds the per-tenant uniqueness constraint with ON CONFLICT DO NOTHING semantics for the seed."
    fix_landed_in: "590a6624"
    evidence: "TC-PLC01 module re-publish path now idempotent across 8 cases."

