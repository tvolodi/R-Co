summary: >-
  The fix removes a stale GBL-081 compatibility shim (six
  "ALTER TABLE ... DISABLE TRIGGER ALL" statements) from
  tests/integration/helpers.zig::applyCompatibilityShims(), plus a small,
  self-contained fix to audit_iss103_test.zig's own cleanup helper
  (disable/enable USER triggers around a DELETE, to respect audit-log
  immutability — matching the established pattern already used in
  xc02_audit_immutability_test.zig). The four targeted ISS-103 tests moved
  from 0/4 to 4/4 passing, confirmed both in isolation and inside the full
  aggregate suite. The full zig build test-integration run shows 536/669
  passing with 134 distinct failing cases, but independent verification
  (below) confirms every failing case traces to one of two pre-existing,
  already-filed, unrelated defects, or to a known pre-existing shared-container
  contention pattern — zero new regressions attributable to this change.

