rationale: >
  ISS-0617's stated root cause is genuinely fixed. The confirmed_root_cause in
  docs/issues/ISS-0617.json identifies two compounding defects in
  tests/integration/exp601_tier_quota_test.zig: (1) an unqualified
  "INSERT INTO repository_artifacts" that resolved to tenant_default.repository_artifacts
  instead of public.repository_artifacts under the pool connection's search_path, and
  (2) fixture writes issued via harness.conn's rolled-back transaction, invisible to the
  separate pool connections that quota_policy/quota_middleware read through (same class
  as ISS-0144/GH-454). Commit 2393f5e addresses both: repository_artifacts and
  tenant_artifact_activations INSERTs are now schema-qualified to public.*, and all
  fixture writes for public-schema-reachable tables (artifact, activation, tenant) were
  moved from harness.conn to pool-acquired connections. This directly targets the
  root cause documented in ISS-0617, not merely a symptom. exp601_tier_quota_test.zig
  was also wired into build.zig for the first time (test-integration-exp601), closing a
  CI-invisibility gap, and an unrelated memory leak in TC-EXP-601-03 was fixed in the
  same commit. Locally, TC-EXP-601-01, 03, 05 now pass, confirming the resolver
  correctly finds the tenant's tier-profile override (10) instead of the platform
  default (200000) -- the exact symptom ISS-0617 was filed against.

  TC-EXP-601-02 and TC-EXP-601-04 still fail locally, but for two separate, already
  understood, pre-existing reasons that are explicitly out of ISS-0617's scope: (a)
  ISS-0622/GH-576 (BLOCKER, quota_enforcement.zig reads PER_TENANT usage tables
  unqualified via pool, fails under LEGACY_RLS storage mode for every tenant, not
  specific to this fix or this test), and (b) a distinct instance_waits insert error
  that ISS-0617's own original diagnosis already flagged as a separate, untraced
  issue. Neither failure was introduced by this PR's changes; both existed before this
  fix and are downstream of infrastructure this PR does not touch.

  ISS-0622 was correctly filed per the Issue Queue protocol: docs/issues/ISS-0622.json
  exists with full root-cause analysis, GitHub issue #576 is open
  (https://github.com/tvolodi/R-Co/issues/576), and it is present in
  handoffs/global_queue.json with status QUEUED, severity BLOCKER, added_at
  2026-08-08T07:58:58Z. Per CLAUDE.md's Issue Queue protocol and the Unblock-Everything
  directive's own scope boundary, an incidentally-discovered, pre-existing defect that
  does not block this run's acceptance criteria is filed and forwarded to its own future
  WF-03 run -- it is not fixed on this branch and does not block this PR's release.
  ISS-0622 does not regress anything this PR touches (repository_artifacts /
  config-surface resolution); it affects a structurally separate code path
  (quota_enforcement.zig's usage-table reads) that was already broken before this PR
  and remains broken in the same way after it.

  PR #577 checks are confirmed green: Build and unit tests (pass, 1m43s), Frontend
  checks (pass), Pipeline bookkeeping (pass), Platform status (pass), Source linters
  (pass) -- all 5 required checks pass as of this verification. GitHub Actions platform
  status is operational (see github_status_check below), so this green result is
  attributable to the code, not platform luck. Note per project convention: CI's
  "Build and unit tests" job runs only the pure unit suite (zig build + zig build test);
  it does not execute any test-integration-* target, so CI does not independently verify
  the TC-EXP-601-01/03/05 pass / 02/04 fail result described above -- that verification
  was performed locally against a real PostgreSQL test database by TEST-RUNNER and is
  recorded in handoffs/WF03-GH566-20260808/step-04-test-runner.json.
