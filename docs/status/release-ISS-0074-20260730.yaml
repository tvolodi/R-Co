  - "A test asserts ciphertext != plaintext for a non-empty plaintext: VERIFIED (TC-ISS-0074-01)"
  - "A round-trip test asserts decrypt(encrypt(x)) == x: VERIFIED (TC-ISS-0074-02, short/medium/long secrets + TC-03 empty case)"
  - "Existing stored secrets are migrated or re-wrapped; no reader silently treats a plaintext-era row as decrypted: N/A -- verified directly against the running dev and test databases (docker exec psql \\dt / pg_tables query): the `secrets` table does not exist in ANY schema in either database. Root cause: migrations/GBL-100_exp501_secrets.sql guards table creation on to_regclass('instance_projections') being non-null under the migration runner's search_path; instance_projections only exists under the tenant_default schema, not public, so the guard likely never fired with the right search_path and the secrets table was never created. This means zero rows have ever been persisted through this module in this environment -- no plaintext-era data exists to migrate or re-wrap. This is a separate, pre-existing migration-scoping defect, not part of ISS-0074's scope; logging it as a new finding (see minor_notes) rather than blocking this fix on it."
