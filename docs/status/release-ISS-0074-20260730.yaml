minor_notes:
  - "wrapped_key_algorithm enum tag (.aes_kw_256) is kept as opaque wire metadata though the real construction is a second AEAD layer, not RFC 3394 AES-KW; documented via source comment in src/secrets/crypto.zig."
new_finding_out_of_scope:
  title: "migrations/GBL-100_exp501_secrets.sql never actually creates the secrets table in dev/test DBs"
  detail: >
    Verified via direct psql query against both r-co-db-1 (bpm_dev) and
    r-co-db_test-1 (bpm_test): no `secrets` table exists in any schema,
    including tenant_default. The migration's DO block guards CREATE TABLE
    on `to_regclass('instance_projections') IS NOT NULL`, but
    instance_projections only exists under the tenant_default schema, not
    public -- the guard appears to evaluate against the wrong search_path
    at migration-apply time. `zig build migrate` reports this migration as
    already "skip"ped (recorded applied) with the table never created.
    Consequence: the entire EXP-501 secrets module is currently non-functional
    in this environment (putSecret would fail with a relation-does-not-exist
    error at the DB layer). This is unrelated to the ISS-0074 plaintext-crypto
    defect (which is now fixed) and does not block this release, but should be
    filed as a new issue and routed through WF-03 separately.
  recommendation: "ORCH should register a new issue for this migration-scoping defect after this run completes."
