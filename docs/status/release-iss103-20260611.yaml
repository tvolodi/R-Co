summary: >
  ISS-103 changes audit_log.resource_id from UUID to TEXT NOT NULL.
  Existing UUID rows are cast to text. This enables auditing of
  text-keyed resource IDs (role names, event types, definition names)
  that cannot be stored in a UUID column.

