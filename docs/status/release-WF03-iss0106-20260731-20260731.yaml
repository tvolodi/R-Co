out_of_scope_finding:
  id: ISS-0107
  github_issue: https://github.com/tvolodi/R-Co/issues/366
  severity: MAJOR
  status: OPEN — separately tracked, not blocking this release decision
  summary: >
    The original #357 acceptance-bar tests (TC-DB-01-01, TC-DB-01-02 in
    tests/integration/db_integration_test.zig) still fail under a full
    concurrent `zig build test-integration` run. This is proven, via
    independent root-cause analysis by both BACKEND-DEV and TEST-RUNNER, to
    be caused entirely by cross-binary Postgres deadlock/lock contention
    among the ~19+ OTHER test-integration binaries (the
    test-integration-others-internal barrier group) — a condition that
    predates ISS-0106, is unaffected by ISS-0106's diff in either direction,
    and is filed and tracked independently as ISS-0107 (MAJOR, GitHub #366).
    ISS-503's own participation in this failure mode is definitively proven
    eliminated (see own_scope_verification above).
  why_not_blocking: >
    ISS-0107 is a pre-existing defect, not a regression introduced by this
    fix. Blocking ISS-0106's merge on ISS-0107's resolution would hold a
    verified-correct, narrowly-scoped fix hostage to an unrelated,
    independently-filed issue that this branch's diff neither causes nor
    is capable of fixing (files_to_change for ISS-0107 has not even been
    triaged yet — it requires its own ISSUE-FIXER root-cause diagnosis).
    Per CLAUDE.md's Unblock-Everything directive, out-of-scope blockers are
    to be fixed if they block the CURRENT task's acceptance criteria; here,
    ISS-0106's own acceptance criteria (ISS-503 elimination from deadlocks;
    zig build/test/migrate/test-integration-iss503 clean) are fully met
    without touching ISS-0107 at all — ISS-0107 blocks a DIFFERENT, broader
    acceptance bar (the original #357 end-to-end green run) that was never
    within ISS-0106's own files_to_change or chosen_resolution scope.
  next_step: >
    ISS-0107 remains OPEN on GitHub (#366) and in docs/issues/ISS-0107.json,
    to be resolved by its own dedicated WF-03 run per TEST-RUNNER's
    recommendation in the step-05 verification report.

