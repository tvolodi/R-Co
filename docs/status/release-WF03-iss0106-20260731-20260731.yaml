    shell's BPM_TEST_DB_URL environment variable points to
    postgres://bpm:bpm@localhost:5433/bpm_test, but docker-compose reports
    db_test's actual published port as 5434 — a stale/mismatched local
    env var, unrelated to any file changed on this branch. This is a
    pre-existing local environment limitation, not an NFR regression caused
    by ISS-0106's build.zig restructuring.
  conclusion: >
    No NFR regression is attributable to ISS-0106. The benchmark harness
    itself could not be exercised end-to-end in this environment for reasons
