# Issue Summary
issue:
  id: ISS-0206
  title: "definition store.zig::rowToDefinition leaks resources on partial construction"
  severity_registry: MAJOR
  severity_user_stated: BLOCKER
  github: "https://github.com/tvolodi/R-Co/issues/526"
  affected_area: "src/definition/store.zig"
  impact: |
    The function constructed a Definition{...} literal in place, with fallible
    allocator calls after already-attached fields. On any failure between
    allocator.success() and return, prior fields leaked (no errdefer chain
    across the literal). Memory leak under repeated DB error paths.

# Fix Assessment
fix_quality:
  pattern: "RowFields-then-rowToDefinitionFromFields with per-step errdefer"
  implementation: CORRECT
  verification: "Code review + narrow test 5/5 PASS + regression 3/3 PASS"
  notes: |
    Fix refactors rowToDefinition so that:
    - All 11 plain-slice fields are parsed into a single RowFields struct first
      (Block A), with one errdefer registered immediately after each try.
    - parseGraphJson failure path returns OutOfMemory or falls back to fallback.graph
      (matching the proven ISS-0132 fix for the parseGraphJson side of the same flow).
    - The Definition{...} literal is assembled last in Block B, which contains no
      fallible calls and therefore cannot leak.
    - 9 existing call sites (294, 347, 688, 775, 862, 1067, 1205, 1511, 1542) are
      unchanged because the public function signature (CreateParams -> Definition!Oom)
      is preserved.
    - Error set is unchanged (still error{OutOfMemory}); the only inline return
      from parseGraphJson catch is error.OutOfMemory which is in the set.

