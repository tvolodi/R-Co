nfr_results:
  NFR-01_api_latency_p99:
    assessment: "PASS (analytical)"
    detail: >
      OBP-02 middleware adds one lockless atomic read (readCached) per request.
      readCached holds no lock and touches no DB; per OBP-01 AC2 this adds < 1 ms.
      Refused requests (gate closed) return before BEGIN and before a pool connection
      is taken — net latency is less than an in-memory cache read. No impact on the
      ≤ 200 ms / ≤ 500 ms p99 targets.
  NFR-02_event_append_throughput:
    assessment: "N/A"
    detail: "OBP-03 guards the outbox emit path; does not affect the event store append path."
  NFR-07_crash_safety:
    assessment: "PASS"
    detail: >
      OBP-02 refuses before BEGIN — no partial writes possible on the refusal path.
      OBP-03 emit() returns OutboxOverflow before any INSERT; the calling step transaction
      rolls back in full. No partial DB state can result from either path.
  bench_note: >
    No new benchmark target covers the OBP path specifically. The lockless design of
    DepthCache (atomic reads, no DB on request path) analytically satisfies NFR-01.
    A full zig build bench run against NFR-02 baseline is not required for a purely
    additive guard path.

security_review:
  step: "02c"
  result: PASS
  minor_findings:
    - id: SEC-MINOR-1
      severity: MINOR
      description: >
        ddl_generate.zig module comment over-claims identifier safety: states
        "backfill_expr and column_type" are covered by validateSpec, but only
        table and column are validated via isSafeIdentifier. Non-blocking because
        backfill_expr/column_type are operator-authored YAML fields with no runtime
        tenant input path. Comment should be corrected.
      follow_up: "File documentation fix issue against ddl_generate.zig"
    - id: SEC-MINOR-2
      severity: MINOR
      description: >
        Migration 1167 comment claims to seed EXECUTION_INGRESS_REFUSED in
        event_type_registry but no INSERT statement is present. The async refusal
        event queue is best-effort (silently drops on full; DB flush may fail if
        type is unregistered). OBP-02 core refusal behavior (HTTP 429, no transaction,
        correct status code) is correct and all 4 OBP-02 integration tests pass.
        The audit append gap should be addressed in a follow-up migration.
      follow_up: "Add INSERT INTO event_type_registry for EXECUTION_INGRESS_REFUSED"

