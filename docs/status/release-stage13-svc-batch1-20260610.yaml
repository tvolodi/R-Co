# -----------------------------------------------------------------------
# MUST Acceptance Criteria Verification
# -----------------------------------------------------------------------
must_criteria_verification:
  SVC-01:
    title: "Service catalog entries carry a scope and owner tenant"
    criteria_tested:
      - "service_catalog table has scope/owner_tenant_id columns with constraints"
      - "global service referenceable by any tenant"
      - "tenant-scoped service activation succeeds for owner tenant"
      - "tenant-scoped service activation rejected (HTTP 422) for non-owner tenant"
      - "POST /api/v1/services registers tenant-scoped service visible only to owner"
      - "GET /api/v1/services returns global + caller's tenant-scoped entries only"
      - "existing entries migrated to scope=global, owner_tenant_id=NULL"
    verdict: PASS

  SVC-02:
    title: "Plugin handlers declare scope and optional owner tenant at registration"
    criteria_tested:
      - "PluginRegistration struct has scope/owner_tenant_id fields"
      - "registerPlugin with scope=tenant and owner_tenant_id=null fails with error.TenantScopedPluginRequiresOwnerId"
      - "SERVICE_TASK dispatch only considers global or matching-tenant plugins"
      - "tenant-scoped plugin not invoked for different tenant's instance"
      - "tenant-scoped plugin takes precedence over global plugin for owning tenant"
      - "freezePluginRegistry rejects duplicate (node_type, owner_tenant_id) combinations"
    verdict: PASS

  SVC-03:
    title: "Definition activation validates service and plugin availability"
    criteria_tested:
      - "global service reference passes activation"
      - "tenant-scoped service ref for own tenant passes activation"
      - "tenant-scoped service ref for other tenant rejected HTTP 422"
      - "unregistered service reference rejected HTTP 422"
      - "tenant-scoped plugin for other tenant rejected at activation"
      - "activation validation is atomic — no partial activation"
      - "re-activation (DEPRECATED→ACTIVE) also validates"
    verdict: PASS

  SVC-04:
    title: "Admin UI and API for service catalog scope management"
    criteria_tested:
      - "POST /api/v1/admin/services (platform-admin only, HTTP 201)"
      - "PATCH /api/v1/admin/services/:service_id (scope/owner_tenant_id update)"
      - "DELETE /api/v1/admin/services/:service_id (HTTP 409 if referenced)"
      - "GET /api/v1/services (tenant-scoped, global+own entries only)"
      - "GET /api/v1/admin/services (platform-admin, all entries)"
      - "Admin UI Services page — platform-admin sees Register button"
      - "Admin UI Services page — non-platform-admin sees page without Register button"
    verdict: PASS

