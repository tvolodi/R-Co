    severity: "N/A (design-time scope decision, not a defect)"
    status: OPEN
    scope: "PIN-03 AC3"
    description: >
      service_catalog has no version/status column -- confirmed again this session by reading
      migrations/049_repository_service_catalog.sql, unchanged since PIN-01's design first hit this
      wall in batch-4. There is no DEPRECATED value anywhere in the schema, so AC3's literal trigger
      condition ("the pinned catalog entry version is set to DEPRECATED") cannot be constructed in a
      test fixture, and consequently no code path in src/engine/instance.zig branches on it either.
      This is the SAME underlying schema gap that held PIN-01 AC1/AC2 at TESTED in batch-4 and is
      tracked under the SAME issue number. Disclosed explicitly at every gate this batch too:
      CODE-DESIGNER's design document (src/design/pin-03-no-fallback-to-latest-version.md) flags it
      as a "BLOCKING gap" in its own Scoping note and Open questions §1 before implementation began;
      CODE-DESIGN-VALIDATOR passed Step 1b with the gap explicit; TEST-DESIGNER's spec (tests/specs/
      PIN-03.md) documents the scoped structural substitute (TC-PIN-03-05) and states in writing
      that it does not claim full AC3 coverage.
    disposition: >
      DOES block PIN-03 from being marked fully RELEASED as-is. See scope_marking_rationale below
      for the precedent-based reasoning: this is materially the same situation as batch-4's PIN-01
      AC1/AC2 (same issue, same root cause, same "disclosed at every gate" provenance), and that
      precedent explicitly holds that early/deliberate disclosure changes the QUALITATIVE framing
      of a gap but not the RELEASE MARKING itself.
