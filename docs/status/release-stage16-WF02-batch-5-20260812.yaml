partially_approved_requirements:
  - id: "PIN-03"
    met: ["AC1", "AC2", "AC4", "AC5"]
    unmet: ["AC3"]
    tracking: "ISS-0672 / GH-306 (OPEN)"
    scope_marking_rationale: >
      Applying the SAME partially_approved_requirements pattern as batch-4's PIN-01 (and, before
      that, batch-3's PAR-02/PAR-03), because this is the same class of finding, not a new one.
      PIN-03 AC3's gap has the identical provenance shape batch-4 already resolved this question
      for: surfaced BY CODE-DESIGNER at Step 1 (not discovered as a surprise by RELEASE-VALIDATOR),
      stated explicitly in the design document's own Scoping note and Open questions as a
      "BLOCKING gap," validated PASS by CODE-DESIGN-VALIDATOR at Step 1b WITH the gap known, and
      carried forward honestly through TEST-DESIGNER's spec (which states in writing, twice --
      once in tests/specs/PIN-03.md and again in the test file's own inline comment -- that its
      AC3 test is a scoped structural substitute, not full coverage). It is tracked under the exact
      SAME issue (ISS-0672/GH-306) as PIN-01's AC1/AC2 gap, because it is the exact same root
      cause: service_catalog has no version/status column.

      The question this handoff was asked to make a real judgment call on, rather than default:
      does the scoped substitute (TC-PIN-03-05, proving "the engine reads through the pin's
      resolved_id, not a fresh re-lookup" using the catalog_entry degenerate stopgap) satisfy AC3's
      SPIRIT well enough to justify RELEASED despite not covering AC3's literal DEPRECATED-status
      trigger? On independent reading, no -- for three reasons. First, TC-PIN-03-05 is not a novel
      angle on AC3; read side-by-side, it is the SAME assertion as TC-PIN-03-02 (AC2): mutate the
      catalog row, assert resolved_id is unchanged. It provides no INCREMENTAL evidence beyond what
      AC2 already established -- it re-uses AC2's mechanism and relabels it, rather than testing a
      distinct guarantee. Second, and more fundamentally, AC3's own text has two clauses: a
      precondition ("the pinned catalog entry version is set to DEPRECATED") and a behavior
      ("execution proceeds on the pinned version" -- i.e. THE NODE ACTUALLY EXECUTES). No test in
      this batch drives node execution through any DEPRECATED-equivalent state at all; TC-PIN-03-05
      only re-checks a stored value's equality, the same "does resolved_id change" question as AC2,
      never reaching the "does the node still run" question AC3 actually asks. Third, and decisively:
      this is not a question of thin test coverage of real behavior (which this batch's own
      precedent, e.g. batch-3's PAR-04 AC3/AC4, treats as MINOR-acceptable) -- it is zero
      implementation of a distinguishable code path, because no DEPRECATED state exists anywhere in
      the schema for any code to branch on. The batch-3/batch-4 precedent's own governing language
      applies without modification: "a requirement with N of M ACs met is held at TESTED, not
      RELEASED, regardless of how early/deliberately the gap was identified" -- and PIN-01's own
      scope_marking_rationale already established this exact principle against this exact issue
      number. A requirement_status.yaml entry of unqualified RELEASED for PIN-03 would silently
      claim full AC coverage to a future reader who has not read this release decision, the design
      document's own Scoping note, or the test file's own inline disclaimer -- exactly the failure
