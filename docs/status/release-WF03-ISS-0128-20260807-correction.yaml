    The actual defect: tests/integration/db_integration_test.zig's
    TC-DB-03-01 called store.append() with a hardcoded UUID literal
    ("db0301aa...") that was never inserted into instance_projections --
    the test's fixture INSERT, post-append assertions, and cleanup all
    correctly used a separate, per-run random UUID (inst_id_str) instead.
    store.append() was correctly returning InstanceNotFound throughout.

