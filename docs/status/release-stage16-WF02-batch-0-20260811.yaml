blocking_issues:
  - id: ISS-NOTE-MIG02-AC4
    severity: MAJOR
    requirement: MIG-02
    description: >
      MIG-02 AC4 ("GIVEN the failure-recording transaction itself fails, WHEN
      the fanout continues, THEN the row remains pending and the MIG-04
      resume query covers it") has no test evidence anywhere in
      tests/reports/report-20260811-WF02-batch-0.yaml or the underlying test
      files. tests/specs/MIG-02.md documents this as a deliberate deferral
      ("recorded as a known, narrow, non-blocking gap... revisit when MIG-04
      lands"), not a scope boundary to a different requirement. Per
      docs/anti-patterns.md and this role's directive, RELEASE-VALIDATOR must
      return FAIL when any MUST requirement has an acceptance criterion with
      no passing integration test evidence, regardless of how narrow or
      well-documented the deferral is.
    recommended_fix: >
      Either (a) add a fault-injection seam to migration_fanout.zig narrow
      enough to trigger recordFailureSeparately's own transaction failing
      without violating DIRECTIVE T-1's no-mock-pool rule (e.g. an
      injectable, test-only failure hook scoped exactly to that one internal
      call, analogous to patterns used elsewhere in this codebase for
      hard-to-reach error paths), and add TC-MIG-02-AC4 exercising it; or
      (b) if the team judges this AC genuinely untestable without MIG-04
      existing, escalate to REQ-ANALYST/ORCH to explicitly amend MIG-02's
      acceptance criteria or split AC4 into its own tracked, out-of-scope
      requirement the way DDL-05 AC5 and MIG-03 AC4 were -- do not let
      RELEASE-VALIDATOR silently accept a same-batch deferral as done.
    assigned_to: BACKEND-DEV (fix) or REQ-ANALYST (requirement amendment), routed via ORCH

