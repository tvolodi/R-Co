      test in the file uses), driven through runFanout with a single fixture
      tenant and failingStep. Independently re-verified by RELEASE-VALIDATOR
      by reading both the test and the underlying src/platform/migration_fanout.zig
      implementation line-by-line (not just trusting the spec/report claims):
      applyToTenant's `defer pool.release(conn)` (line 219) genuinely does not
      fire until applyToTenant itself returns, and recordFailureSeparately is
      called (line 256) from inside the DDL-step catch block, strictly BEFORE
      that deferred release runs -- so with lock_conn (1) + the tenant's own
      DDL conn (2) already held against a pool_size=2 pool,
      recordFailureSeparately's own pool.acquire() at line 356 genuinely
      returns PoolError.ExhaustedPool (a real error from src/db/pool.zig's
      `if (self.idle_count == 0) return PoolError.ExhaustedPool;`, not a
      simulated/mocked one). TC-MIG-02-04 asserts runFanout returns normally
      (no panic/escalation) and the control row is left exactly at its seeded
      'pending' status with error_msg IS NULL and completed_at IS NULL --
      matching AC4's exact wording ("the row remains pending"). This is a
      genuine double-failure fault injection, not a mock of bpm.pool.Pool
      (DIRECTIVE T-1 compliant).
