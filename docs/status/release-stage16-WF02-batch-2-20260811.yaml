issue_iss_0669_reassessment:
  question: >
    ISS-0669/GH-709 (Pool.acquire() loses row-lock isolation under genuine
    multi-OS-thread contention, discovered while writing this batch's own
    concurrency tests) was forwarded rather than fixed inline.
    TEST-DESIGN-VALIDATOR asserted this batch's actual production code path
    does not hit it. Independently reassessed as final sign-off: does this
    genuinely not block DDL-02/ORD-01/ORD-02/ORD-04, or could a real
    multi-consumer production deployment -- which is the explicit point of
    ORD-04's "8 consumers" requirement -- hit the same bug?
  evidence_read:
    - "docs/issues/ISS-0669.json: the bug is in src/db/pool.zig's Pool.acquire()
      (and/or applyRequestStorageRouting(), which reads Zig 0.16 threadlocal
      tenant_context state per src/db/pool.zig:258-274) when acquire() itself
      is raced across raw std.Thread.spawn-created OS threads. Confirmed NOT
      a client-side aliasing bug and NOT a PostgreSQL/SKIP LOCKED bug (an
      equivalent plain-Python/psycopg2 harness with real threads and the same
      barrier synchronization produced exactly one winner every time)."
    - "src/ordering/consumer.zig (read in full): runOneCycle() calls
      pool.acquire() exactly once per cycle, synchronously, on whatever
      thread calls it; pollLoopStep() calls runOneCycle() once per invocation
      and returns. Neither function spawns a thread, and neither is called
      from more than one place in this batch's own code. There is no
      std.Thread.spawn anywhere in src/ordering/*.zig."
    - "build.zig (searched for ordering_consumer_mod/ordering_cursor_mod
      references): both modules are imported ONLY by
      tests/integration/ordering_consumer_test.zig's test binary. Grepped
      src/main.zig, src/scheduler/scheduler.zig, and src/effects/worker.zig
      for pollLoopStep/runOneCycle/ordering_consumer/consumer_count --
      zero matches in all three. This batch's consumer loop is not wired
      into any production executable at all yet."
    - "src/design/ord-01-02-04-correlated-effect-reentry.md 'Open questions'
      #1 (lines 434-439): explicitly defers 'which existing background-thread
      mechanism runs consumer_count copies of pollLoopStep concurrently' to
      BACKEND-DEV as a future wiring decision, calling it 'non-blocking...a
      wiring choice, not an open design question about correctness' for THIS
      batch. Multi-consumer production deployment (the scenario that would
      actually race Pool.acquire() across raw threads the way ISS-0669
      reproduces) is explicitly out of this batch's delivered scope."
    - "src/effects/worker.zig (grepped): single poll loop (sweepOnce), no
      Thread.spawn -- the one existing precedent the design doc points at for
      'reuse an existing polling mechanism' does not itself spawn N racing
      threads against a shared Pool either. src/webhook/dispatcher.zig spawns
      exactly one background thread for itself, not N threads sharing one
      Pool. No existing codebase precedent currently does what ISS-0669's
      repro does (N raw OS threads all calling Pool.acquire() on one shared
      *Pool concurrently) in any production path today."
    - "tests/integration/ordering_consumer_test.zig lines 418-463 (section
      header comment) and lines 605-611/828-835 (both concurrency tests):
      documents that an earlier test version DID race pool.acquire()+begin()
      itself across the 8 threads and was empirically confirmed broken (all
      8 threads claimed the identical row); the committed version
      pre-acquires and begin()s all connections sequentially from the main
      thread before spawning any racing thread, so only the claim/guard QUERY
      -- the thing ORD-01/ORD-02 actually implement -- races across threads.
      This is legitimate test isolation from a different, already-broken
      component, not concealment: it is documented in the test file itself,
      in ISS-0669, and cross-referenced in both directions."
  judgment: >
    ISS-0669 is a real, latent defect in src/db/pool.zig -- not merely a test-
    infrastructure artifact -- and TEST-DESIGN-VALIDATOR's forwarding
    decision is correct for a different reason than "it's just a test
    problem": it is that THIS BATCH's own deliverable never exercises the
    broken code path in production, because the consumer loop this batch
    implements is not wired into any concurrently-running production
    executable yet. ORD-04's "8 consumers" requirement is fully real and its
    eventual production deployment WOULD be the exact scenario ISS-0669
    reproduces IF that deployment spawns 8 raw OS threads each independently
    calling Pool.acquire() on one shared Pool -- which is a plausible, even
    likely, implementation choice for whichever future batch answers the
    design doc's Open Question 1. That makes ISS-0669 a hard release-blocking
    prerequisite for THAT future batch (the one that actually wires
    consumer_count concurrent loops into main.zig/scheduler.zig), not for
    this one. Confirmed this batch introduces zero new callers of
    Pool.acquire() from raw spawned threads in any production path: the only
    raw-thread callers anywhere in src/ are src/api/routes/onboarding.zig's
    single background saga thread and src/identity/provider/bootstrap.zig's
    single HTTP-call thread, both pre-existing and both spawning exactly one
    thread (not N threads racing one shared Pool), neither touched by this
    batch. Recommendation carried forward (not actioned by this handoff,
    since RELEASE-VALIDATOR does not fix): the future ORD-03/consumer-wiring
    batch must treat ISS-0669/GH-709 as a hard pre-requisite gate before
    choosing a raw-std.Thread.spawn-based deployment for consumer_count
    loops, or must use Io.Threaded's own task-spawning API instead of raw
    OS threads if that sidesteps the bug -- this should be stated explicitly
    in that future batch's own design artefact so CODE-DESIGN-VALIDATOR
    catches it if forgotten.

