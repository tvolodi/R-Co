acceptance_criteria_audit:
  method: >
    Read full requirement bodies and Acceptance Criteria for DDL-02, ORD-01,
    ORD-02, ORD-04 directly from docs/requirements.yaml. Cross-checked every
    AC against actual Zig test source, not just the test report or spec
    claims: src/platform/ddl_validate.zig (28 tests total, 7 DDL-02-specific:
    AC1-AC5 plus tiebreak/conservative supplementary tests), src/ordering/observability.zig
    (4 pure unit tests, ORD-04 AC2/AC3 contention-window math),
    tests/integration/ord01_plat_effect_completion_test.zig (3 tests, schema/
    constraint layer), tests/integration/ord04_plat_correlation_cursor_test.zig
    (4 tests, schema/constraint layer), tests/integration/ordering_consumer_test.zig
    (10 tests: 3 ORD-01 claim-query tests, 3 ORD-02 execute-guard tests, 2
    runOneCycle connection-discipline tests, and 2 genuine multi-thread
    concurrency tests -- TC-ORD-01-AC1-concurrent and TC-ORD-04-AC1-concurrent
    -- using real std.Thread.spawn with start-gate/arrival-gate barriers, not
    sequential simulation). Also read src/ordering/consumer.zig,
    src/ordering/mod.zig, src/ordering/cursor.zig, src/db/pool.zig's acquire()
    and applyRequestStorageRouting(), and build.zig's module wiring for
    src/ordering/* line-by-line. Independently re-ran every layer: test-ddl-validate
    (28/28), test-ordering (4/4), test-integration-ord01 (3/3),
    test-integration-ord04 (4/4), test-integration-ordering (10/10, run twice,
    identical both times) -- all match the test report exactly, exit code 0
    each.
  ddl_02:
    ac1: covered (TC-DDL-02-AC1, ADD COLUMN NOT NULL with no default and no
      prior expand -> ConstrainBeforeExpand)
    ac2: covered (TC-DDL-02-AC2, SET NOT NULL immediately after ADD COLUMN
      NULL with no backfill -> ConstrainBeforeExpand, names both statements)
    ac3: covered (TC-DDL-02-AC3, expand + NOT VALID check + backfill +
      VALIDATE CONSTRAINT sequence -> ACCEPT)
    ac4: covered (TC-DDL-02-AC4, ADD CONSTRAINT FOREIGN KEY without NOT VALID
      -> ConstrainBeforeExpand)
    ac5: covered (TC-DDL-02-AC5, rejection detail names file and byte offset
      for both the constraining statement and the statement it depends on)
    plus: TC-DDL-02-tiebreak (an earlier lock-class failure reported instead
      of a later constrain-before-expand violation) and TC-DDL-02-conservative
      (a bare SET NOT NULL with zero prior statements for that column
      anywhere in the file set is rejected) -- both strengthen AC1/AC2's
      literal wording against edge cases.
  ord_01:
    ac1: covered (TC-ORD-01-AC1-concurrent: 8 real std.Thread.spawn threads,
      each on its own pre-acquired connection, race FOR UPDATE SKIP LOCKED on
      one PENDING row via a start-gate barrier so all 8 claims genuinely
      overlap -- exactly one wins, the other 7 receive no row, none blocks;
      this is the AC's literal "8 consumers polling ... claim concurrently"
      scenario, not a sequential simulation)
    ac2: covered (TC-ORD-01-AC2, claimOneCompletion returns null, not an
      error, when no PENDING row is available)
    ac3: covered structurally -- SKIP LOCKED's row-lock-release-on-backend-exit
      behavior is a PostgreSQL guarantee this batch relies on rather than
      implements; TC-ORD-01-AC1/AC5's locked-row test proves the claim query
      correctly respects an in-flight lock, and ORD-02's crash-equivalent test
      (TC-ORD-02-AC3, rollback releases the guard "same as a crash") covers
      the same release-on-abort mechanism at the advisory-lock layer this
      batch owns
    ac4: covered (TC-ORD-01-AC4, two PENDING rows of the same correlation_id
      with different sequence_no both claimed concurrently by two separate
      connections, no blocking, no error)
    ac5: covered (TC-ORD-01-AC1/AC5, claim query ordered by (correlation_id,
      sequence_no) -- proven by draining the shared PENDING set and showing
      the locked row (seq 1) is never returned while the unlocked row (seq 2)
      is reachable)
  ord_02:
    ac1: covered (TC-ORD-02-AC1, a second consumer's tryExecuteGuard on the
      SAME correlation returns .busy while the first holds it, and does not
      block -- getting past the call at all is the non-blocking proof)
    ac2: covered (TC-ORD-02-AC1's own comment/assertion: the try-variant never
      blocks, since pg_advisory_xact_lock -- the blocking form -- is never
      called on this path; a blocking call would have hung the test)
    ac3: covered (TC-ORD-02-AC3, a rolled-back transaction releases the guard
