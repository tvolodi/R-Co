root_cause:
  type: test-vs-implementation-drift
  location: src/engine/instance.zig InstanceStore.create() line ~860
  explanation: |
    After every successful `InstanceStore.create()` call, the implementation
    now writes a JSONB baseline snapshot at `snapshot_seq = 1` to
    `instance_state_snapshots`. The four integration tests that exercise
    `inst_store.create()` (TC-ISS-601-01, -02, -05, -08 v2) predate that
    feature and assert snapshot counts or specific seq values that are now
    off-by-one. Specifically:

      * TC-01 asserts `snap_rows == 0` immediately after `inst_store.create()`,
        but the implementation now also takes a seq=1 baseline snapshot.
      * TC-02 reconstructs seq-at-25 via events, then takes a snapshot at seq=25
        and asserts the ONLY snapshot is seq=25; in reality there is also a
        seq=1 baseline row written by `inst_store.create()` — the test needs to
        pin `WHERE snapshot_seq = 25` (or accept the row count is 2).
      * TC-08 (v2) inserts snapshots at seq 1000 and seq 2000 and asserts the
        row count is exactly 2; with the new baseline, the count is 3.
      * TC-05 takes a snapshot at seq 1 explicitly via `snapshot_writer.takeSnapshot`
        — this test is "passing behaviour-correct but stale-assertion" because
        the row count check (which does NOT exist in this test today) was
        previously `0` and is now `1`.

    The four "passing" tests (TC-03, TC-04, TC-07, TC-08 v1) all invoke
    `snapshot_writer.takeSnapshot()` directly, bypassing `InstanceStore.create()`,
    so they are unaffected by the baseline feature.

    The single "skipped" test (TC-09) inserts a corrupt `{corrupt_not_valid_json`
    via raw `INSERT` and is independent of the create() path.

  evidence:
    - file: src/engine/instance.zig
      line_range: "859-868"
      code_excerpt: |
        // ── Step f: Build and return Instance ──────────────────────────────
        return rowToInstance(allocator, ins_rows.rows[0], initial_variables) catch
            InstanceError.TransactionFailed;
    - file: src/engine/instance.zig
      line_range: "857-865"
      code_excerpt: |
        // ISS-601: Take initial snapshot at seq 1 (baseline).
        self.snapshot_writer.takeSnapshot(
            allocator,
            uuid_bytes,
            &new_state,
            1,
        ) catch {}; // Non-fatal: snapshot failure does not roll back the event.
    - file: src/engine/snapshot_writer.zig
      line_range: "78-101"
      code_excerpt: |
        // Security: $1=instance_id, $2=snapshot_seq, $3=state_blob — all bound as $N.
        const conn = self.pool.acquire() catch |err| switch (err) { ... };
        defer self.pool.release(conn);

        conn.exec(
            \\INSERT INTO instance_state_snapshots
            \\    (instance_id, snapshot_seq, state_blob)
            \\VALUES ($1::uuid, $2::bigint, $3::jsonb)
            \\ON CONFLICT (instance_id, snapshot_seq) DO NOTHING
        , &.{ inst_id_hex, snapshot_seq_str, state_blob },
        ) catch return SnapshotWriterError.PersistenceFailed;
    - file: tests/integration/iss601_state_snapshots_test.zig
      failing_assertions:
        - TC: TC-ISS-601-01
          line: 242
          assertion: try testing.expectEqual(@as(i64, 0), cnt)
          actual: 1 (baseline seq=1 snapshot written by `inst_store.create()`)
          fix_hint: expect `@as(i64, 1), cnt` AND verify state_blob is non-empty; reconstruction MUST use the seq=1 baseline (verify reconst_state.status == .ACTIVE && tokens.len >= 1)
        - TC: TC-ISS-601-02
          line: "749-759 (sequence_value assertion in `snap_rows.rows[0][0]`)"
          assertion: |
            WHERE instance_id = $1::uuid ORDER BY snapshot_seq DESC; expect rows.len >= 1;
            expectEqual(@as(i64, 25), snap_seq) on rows[0] (the first DESC-ordered row)
          actual: |
            Rows after create() + 49 inserts + explicit seq=25 snapshot are
            [seq=25, seq=1] (DESC). rows.len == 2, rows[0] snapshot_seq == 25
            — so the `expectEqual(25, snap_seq)` PASSES because rows[0] is the
            newer row. The test still fails because BEFORE this block the test
            performs `reconstruction_mod.reconstructInstancePointInTime(...,25)`
            which (with seq=1 baseline present) may now reconstruct a state that
            differs subtly from the seq=25 explicit snapshot — the assertion
            `snap_reconstructed.status == full_reconstructed.status` at line 820
            then fails if delta-replay of seq 2..50 with seq=1 baseline emits
            a different state shape than full-replay of seq 1..50.
          fix_hint: |
            Pin the assertion to `WHERE snapshot_seq = 25` and the row count to 1
            for the seq=25 explicit snapshot. Then when constructing the explicit
            `state_at_25`, ALSO delete the seq=1 baseline first (or skip
            `inst_store.create()`'s baseline) so that reconstruction semantics
            match the original spec. Optionally accept `rows.len == 2` and assert
            `rows[0].snapshot_seq == 25 && rows[1].snapshot_seq == 1`.
        - TC: TC-ISS-601-05
          line: "957 (after `takeSnapshot at seq=1`) — the test does NOT
                 currently assert row count, but the reconstruction result
                 is what trips the test."
          assertion: reconst_state.status == .ACTIVE (line ~1010)
          actual: |
            Reconstruction starts from seq=1 baseline (created by
            `inst_store.create()`) and replays an overflow event at seq=2;
            token state ends up empty because the seq=1 snapshot was taken
            BEFORE the test's overflow insert and the seq=2 overflow event
            uses `$ref: "overflow"` placeholder. The COALESCE join path
            still works in production, but the test's hidden assumption
            ("seq=1 snapshot is the same state we created") no longer
            holds because the seq=1 baseline was written from `new_state`
            *before* the test overrode the active token.
          fix_hint: |
            Either (a) explicitly take a fresh seq=1 snapshot with the
            test's `state_at_1` AFTER the seq-1 baseline from `create()` so
            both reconstruct the same way, or (b) DELETE the baseline
            snapshot before taking the explicit seq=1 snapshot. The
            invariant the test is checking is "overflow-join works"; the
            baseline presence is orthogonal to that invariant.
        - TC: TC-ISS-601-08 (v2 — `reconstructInstanceWithSnapshot uses latest of multiple snapshots`)
          line: 1124
          assertion: try testing.expectEqual(@as(usize, 2), snap_chk.rows.len)
          actual: 3 (seq=1 baseline + seq=1000 explicit + seq=2000 explicit)
          fix_hint: expectEqual(@as(usize, 3), snap_chk.rows.len)

# ---------------------------------------------------------------------------
# 3. Secondary finding — `audit_entries is immutable` red-herring
# ---------------------------------------------------------------------------

secondary_finding:
  description: |
    During `tests/integration/helpers.zig::resetTestData()` (line ~365), the
    helper executes `DELETE FROM audit_entries`. This DELETE runs BEFORE
    `TestHarness.init()` has called `SET session_replication_role = 'replica'`,
    so the `bpm_audit_immutable_guard()` trigger (migration 020) fires and
    raises `P0001 audit_entries is immutable`. The error is silently swallowed
    by `deleteTableBestEffort` (`error.ServerError => {}`), so `resetTestData`
    returns OK and the test continues. The same DELETE in
    `TestHarness.deinit()` runs AFTER `SET session_replication_role = 'replica'`
    has been executed, so it succeeds (verified: `DELETE 0`, no error).

    This is INDEPENDENT of the failing 4 tests' root cause — but the noisy
    `POSTGRES ERROR: audit_entries is immutable` lines printed by vendor/pg/pg.zig:316
    appear in test output during the cleanup phases of EVERY test, making
    real failures harder to spot. The fix is cosmetic / log hygiene.

  evidence:
    - file: tests/integration/helpers.zig
      line_range: "344-395"
      code_excerpt: |
        fn resetTestData(conn: *pg.Conn) !void {
            ...
            try deleteTableBestEffort(conn, "audit_entries");
            ...
        }
        fn deleteTableBestEffort(conn: *pg.Conn, comptime table_name: []const u8) !void {
            const sql = "DELETE FROM " ++ table_name;
            conn.exec(sql, &.{}) catch |err| switch (err) {
                error.ServerError => {},   // <-- silently swallows P0001
                ...
            };
        }
    - file: tests/integration/helpers.zig
      line_range: "670-690"
      code_excerpt: |
        // TestHarness.init — runs AFTER resetTestData (called by test harness, not by resetTestData).
        conn.begin() catch |err| { ... };
        _ = conn.exec("SET session_replication_role = 'replica'", &.{}) catch |err| { ... };
    - verified: docker exec r-co-db_test-1 psql -U bpm -d bpm_test -c
                "BEGIN; SET LOCAL session_replication_role = 'replica';
                 SET search_path TO tenant_default, public;
                 DELETE FROM audit_entries WHERE audit_id = '00000000-0000-0000-0000-000000000000';
                 ROLLBACK;"
                → DELETE 0 (no error). Confirms replica-mode DELETE works.

  fix_proposal: |
    MINOR / cosmetic. TWO viable options:
      (a) Move `SET session_replication_role = 'replica'` to the top of
          `TestHarness.init()` BEFORE the implicit `resetTestData` invocation
          (note: `resetTestData` is called externally before `TestHarness.init`
          in the test framework's standard flow — moving `replica` setting into
          `resetTestData`'s prologue would be cleaner).
      (b) Exclude `audit_entries` from the `DELETE` list in `resetTestData`
          (it is wiped at `TestHarness.deinit` anyway via the rollback-and-
          cleanup pattern).
    Both options preserve test isolation; (b) is lower risk because (a)
    requires careful reordering to avoid breaking connection state. RECOMMENDED:
    option (b). Priority: MINOR.

