  observed_divergence_root_cause: |
    The current test environment has an INFRASTRUCTURE issue unrelated to
    ISS-0601. `psql bpm:bpm@localhost:5434/bpm_test` works from the host
    (password 'bpm' stored as scram-sha-256 in `pg_authid`; `pg_hba.conf`
    ends with `host all all all trust` which matches our TCP connection).
    However the Zig `pg.zig` library's startup handshake fails with
    `PgError.AuthenticationFailed` before any SQL is sent — verified by
    inspecting DB logs: NO `LOG: connection authorized` / NO `FATAL`
    line appears during the test run, the connection is closed cleanly
    by Postgres with an `E` (ErrorResponse) message that Zig translates
    to `AuthenticationFailed`.

    Cross-checked with `zig build test-integration-iss101` — same error
    on every integration test target, confirming the auth failure is
    global, not specific to iss601_state_snapshots_test.

    This means I CANNOT empirically re-prove the 4/4/1/4 ORCH-claimed
    counts in THIS environment. The CODE-LEVEL diagnosis is nevertheless
    sound (see evidence section) — every assertion ORCH flagged is
    real and IS contradicted by the implementation. CODE-DESIGNER /
    BACKEND-DEV can proceed with the fix as scoped.

