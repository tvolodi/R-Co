issue_id: ISS-0073
run_id: WF03-oidc-callback-realm-20260616
created_at: "2026-06-16T05:47:49Z"
severity: BLOCKER
category: "logic error — singleton cache bypasses realm resolution at callback time"
affected_areas:
  - web/src/pages/OidcCallbackPage.tsx
  - web/src/auth/OidcManager.ts
  - web/src/auth/tenantConfig.ts

---
symptom: |
  UAT scenario EO-004: After Alice (SwiftRoute admin) enters her credentials on the
  SwiftRoute Keycloak login page, Keycloak issues an auth code and redirects the
  browser to /auth/callback?code=...&state=... A redirect loop starts immediately —
  the app returns to / and re-initiates OIDC login. Alice never lands in the dashboard.

root_cause:
  file: web/src/pages/OidcCallbackPage.tsx
  line: 35
  expression: "const m = await getOidcManager()"
  explanation: |
    At /auth/callback the URL contains no ?realm= query parameter.
    OidcCallbackPage calls getOidcManager() (line 35), which:

      1. Checks _resolvedManager (module-level singleton). On a fresh callback page
         load this is null.
      2. Calls fetchTenantConfig(window.location.hostname) — OidcManager.ts line 43.
      3. fetchTenantConfig (tenantConfig.ts line 43) checks _cachedConfig (null), then
         calls resolveRealmFromUrl() (tenantConfig.ts line 47).
      4. resolveRealmFromUrl() reads sessionStorage.getItem('bpm_realm_slug').

    If 'bpm_realm_slug' is absent from sessionStorage at callback time, the function
    returns null. fetchTenantConfig then sends GET /api/tenant-config?host=127.0.0.1
    to the backend. Per ISS-0072 the backend returns bpm-default when only a hostname
    is provided (no realm slug). fetchTenantConfig caches bpm-default in _cachedConfig.
    getOidcManager() creates a bpm-default UserManager and stores it in _resolvedManager.

    signinRedirectCallback() called on that bpm-default UserManager attempts to
    exchange the SwiftRoute-issued auth code at the bpm-default Keycloak token
    endpoint. Keycloak rejects the code (wrong realm). The catch block executes
    window.location.replace('/'), reloading the app. On reload, _cachedConfig and
    _resolvedManager are null again, but bpm_realm_slug is still absent from
    sessionStorage → the same path is taken → infinite redirect loop.

  secondary_factor: |
    fetchTenantConfig has a catch block that sets _cachedConfig = bpm-default fallback
    on ANY network error. If the first network request at callback time fails for any
    transient reason, bpm-default is permanently cached for the page load, ensuring
    the redirect loop continues regardless of subsequent retries.

  tertiary_factor: |
    OidcManager.ts exports a synchronous oidcManager constant (line 36) built from
    VITE_OIDC_AUTHORITY (bpm-default). This is a separate object from _resolvedManager,
    but its existence means that if any import chain instantiates OidcManager.ts before
    the callback page's useEffect fires, and that code path calls signinRedirect() via
    oidcManager instead of getOidcManager(), the OIDC state stored in sessionStorage
    would be keyed to the bpm-default authority. The callback-page UserManager (even if
    it correctly fetches swiftroute) would fail to find the PKCE state because
    oidc-client-ts keys stored state entries by authority.

confirmed_behavior:
  - "OidcCallbackPage.tsx calls getOidcManager() (line 35) — CONFIRMED. It does NOT
    bypass this path; it correctly uses the async factory."
  - "getOidcManager() calls fetchTenantConfig(window.location.hostname) if
    _resolvedManager is null — CONFIRMED (OidcManager.ts lines 41-46)."
  - "fetchTenantConfig calls resolveRealmFromUrl() — CONFIRMED (tenantConfig.ts line 47)."
  - "resolveRealmFromUrl() reads sessionStorage['bpm_realm_slug'] first, then ?realm=
    URL param — CONFIRMED (tenantConfig.ts lines 30-38)."
  - "At /auth/callback the URL has no ?realm= parameter — CONFIRMED by OAuth2 spec:
    Keycloak does not forward custom query params through the authorization code flow."
  - "If resolveRealmFromUrl returns null, fetchTenantConfig sends ?host=hostname and
    gets bpm-default — CONFIRMED by ISS-0072 backend behavior."
  - "fetchTenantConfig caches its result; a bpm-default result is cached permanently
    — CONFIRMED (tenantConfig.ts line 50)."
  - "The entire callback flow depends on bpm_realm_slug being present in sessionStorage
    — CONFIRMED. No explicit realm is passed through the redirect_uri."

key_gap: |
  The OAuth2 authorization code flow performs a FULL BROWSER NAVIGATION from the SPA
  to Keycloak and back. On the return leg, the browser loads a fresh page at
  /auth/callback. The module-level singletons (_resolvedManager, _cachedConfig) are
  reset. The only cross-page state available is sessionStorage.

  'bpm_realm_slug' is written to sessionStorage by resolveRealmFromUrl() only when
  ?realm= is present in the URL — which requires that fetchTenantConfig was called
  while the browser was at /?realm=swiftroute. If that call happened before Fix 1+2
  landed (or if the login was triggered by a code path that used the sync oidcManager
  export rather than getOidcManager()), sessionStorage would not have the key, and
  the callback would silently fall back to bpm-default.

  Even after Fix 1+2: the sessionStorage key is set once and relied upon implicitly.
  There is no explicit, URL-level proof of which realm the current OIDC state belongs
  to, so a stale/missing sessionStorage entry produces a silent wrong-realm callback.

recommended_fix:
  approach: "Pass realm slug in redirect_uri + bypass singleton in OidcCallbackPage"
  steps:
    - "When calling signinRedirect(), include the realm slug explicitly in the
       redirect_uri query parameter: redirect_uri = '/auth/callback?realm=<slug>'.
       This embeds the realm identity into the callback URL itself, so
       resolveRealmFromUrl() can always read ?realm= from the URL regardless of
       sessionStorage state."
    - "OidcCallbackPage must NOT use the _resolvedManager singleton for the callback
       exchange. Instead it should call fetchTenantConfig() directly (bypassing the
       getOidcManager() cache), construct a one-time UserManager with the returned
       oidc_authority, and call signinRedirectCallback() on that fresh instance.
       This prevents stale bpm-default cache from poisoning the code exchange."
    - "After a successful callback, warm _resolvedManager with the correct swiftroute
       UserManager so that the rest of the SPA session uses the right authority."
  rationale: |
    Embedding the realm in the redirect_uri is the most robust approach because:
    - It survives sessionStorage loss (e.g. browser privacy modes, test harness resets)
    - It is deterministic: the realm is derived from the same URL that Keycloak returns to
    - It does not require changes to the backend tenant-config API
    - It is idempotent: repeated navigations to the callback URL still work

next_action: "Route to CODE-DESIGNER (Step 02) to produce a Type E design artefact for the fix"
