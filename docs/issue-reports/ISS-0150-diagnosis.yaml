summary: >-
  The issue text framed the dominant symptom as a per-tenant `schema_migrations`
  ledger table that was never created during tenant provisioning, and asked why a
  tenant schema is reachable without its ledger. That premise does not survive
  measurement. The three `tenant_<uuid>.schema_migrations does not exist` lines in
  the log are not failures of any test — they are stderr bleed from a concurrently
  running sibling, captured inside the output block of an unrelated failing test
  (TC-ISS503-01). Tenant provisioning is not defective. The real failures are
  several independent, pre-existing test-fixture and schema-scoping defects.

environment_note: >-
  The process environment carried a stale BPM_TEST_DB_URL pointing at port 5434
  (workspace 1's band), shadowing .env's 5453. All measurements below were taken
  with the correct test database after `zig build test-env-verify` reported
  HEALTHY (8/8 checks, 108/108 migrations applied on localhost:5453/bpm_test).

measurement_method: >-
  Counts are unreliable against the long-lived shared bpm_test database because it
  carries accumulated fixture rows and one baked-in migration-ordering artifact
  (below). The authoritative before/after numbers were therefore taken on two
  freshly created, separately migrated databases (bpm_base for BEFORE with the fix
  stashed, bpm_fresh2 for AFTER), so the two runs differ only by the source change.

