  t1_tc_tnt_03_01_audit_insert_helper:
    action: |
      Test code or TestHarness-init helper issues an INSERT into audit_entries
      under tenant_X's search_path. This fires BEFORE INSERT trigger
      bpm_audit_apply_chain_hash().
    locks_held:
      - "pg_advisory_xact_lock(hashtext('bpm.audit.chain.' || tenant_X)::bigint)"
      - "Row-level lock on predecessor chain_hash row from SELECT"
      - "Row-level Exclusive lock on the new row (pending INSERT)"

  t2_tc_tnt_01_01_runForSchema_reaches_migration_1107:
    action: |
      BEGIN transaction in migrations.zig:301. Then simpleQuery() runs 1107's
      per-tenant DO block. The DO block iterates tenant_* schemas; for tenant_X
      it executes:
        DROP TRIGGER IF EXISTS trg_bpm_audit_apply_chain_hash ON audit_entries
    locks_requested:
      - "AccessExclusiveLock on the trigger row in pg_trigger for tenant_X"

  t3_cycle_forms:
    description: |
      C40P01 cycle is now complete:
      - Cycle A: TC-TNT-01-01's DROP TRIGGER waits for TC-TNT-03-01's
        trigger function to release the predecessor row lock.
      - Cycle B: TC-TNT-03-01's trigger function (mid-INSERT) waits for
        TC-TNT-01-01 to release AccessExclusiveLock on the trigger row.
      PostgreSQL detects cycle, aborts one transaction with C40P01.

  t4_postgres_aborts:
    action: |
      One of the two transactions is cancelled with
      "ERROR: deadlock detected (SQLSTATE 40P01)
       DETAIL: Process N waits for AccessExclusiveLock on relation X of database Y;
               blocked by process M.
                       Process M waits for ShareLock on relation Z; blocked by process N."
    cascading_failure: |
      TC-TNT-01-01's migration transaction is rolled back; the tenant schema
      is left half-provisioned; subsequent tests that depend on a fully
      provisioned tenant_X cascade-fail.

# ---------------------------------------------------------------------------
# 4. FIX STRATEGY
# ---------------------------------------------------------------------------

fix_strategy:

  summary: |
    Wrap the per-tenant migration apply step in
    `pg_advisory_xact_lock(<stable-key>)` so concurrent migrate steps serialize
    on a single lock. The lock key MUST be a stable constant (not derived from
    tenant_id) so that all migrate operations on all tenant schemas queue up on
    the same lock. Concurrent audit INSERTs into audit_entries are unaffected
    because the trigger function's existing per-tenant advisory lock is keyed
    by hashtext('bpm.audit.chain.' || tenant_id::text) — a different keyspace.

  candidate_lock_key: "hashtext('bpm.migrations.runForSchema')::bigint"
  alternative_lock_key: "any fixed constant; the literal value matters only for stability across processes"

  implementation_target: "src/db/migrations.zig"

  implementation_site_1:
    location: "runForSchema() entry, BEFORE pool.acquire()"
    rationale: |
      Acquiring the advisory lock BEFORE acquiring the pool connection
      eliminates the window where a concurrent migrate call could slip
      in. The lock is transaction-scoped (pg_advisory_xact_lock), so
      the connection that runs the migration holds the lock for the
      entire runForSchema() duration. Other concurrent migrate calls
      will block on this lock until the holder commits or rolls back.
    pseudocode: |
      // Wrap the existing runForSchema body in a single transaction
      // that holds a stable advisory lock for its duration.
      conn.exec("BEGIN", &.{}) catch return MigrationError.MigrationFailed;
      defer conn.exec("ROLLBACK", &.{}) catch {};
      // Stable key for all concurrent migrate operations.
      conn.exec(
        "SELECT pg_advisory_xact_lock(hashtext('bpm.migrations.runForSchema')::bigint)",
        &.{},
      ) catch return MigrationError.MigrationFailed;

  implementation_site_2_alternative:
    location: "provisioning.zig:94, inside provisionTenantSchema()"
    rationale: |
      If we want to keep the lock scoped to the per-tenant provisioning path
      (rather than every runForSchema caller, e.g. corrective reconcile
      mode), we can acquire it in provisionTenantSchema() instead. The
      reconciliation paths (force_reconcile=true) bypass this lock.
    rationale_against: |
      This leaves bare runForSchema() calls unlocked, which is the
      surface that the failing test exercises. NOT preferred.

  preferred_site: "src/db/migrations.zig:runForSchema()"

  why_per_tenant_advisory_lock_in_trigger_is_unaffected:
    explanation: |
      The trigger function bpm_audit_apply_chain_hash (in migration 1109)
      acquires pg_advisory_xact_lock(hashtext('bpm.audit.chain.' || tenant_id)
      ::bigint). This uses hashtext on a per-tenant string, so its keyspace is
      different from bpm.migrations.runForSchema. Concurrent audit INSERTs
      against tenant_X's audit_entries do not contend with the migration lock.
    impact: |
      Migration apply steps become serialized across all tenant schemas.
      Audit INSERTs remain concurrent.

  why_drop_trigger_can_still_acquire_access_exclusive:
    explanation: |
      After we hold the migrate advisory lock, no concurrent INSERT against
      audit_entries for the tenant being migrated can be inside the trigger
      function waiting for the row lock — because such an INSERT would have
      had to acquire the migrate lock FIRST if its tenant happens to be the
      one being migrated (the migrate call holds the lock; the audit INSERT
      cannot start a new transaction that takes the row lock and waits for
      DROP TRIGGER, because the per-tenant advisory lock keyspace is
      different but the migrate lock prevents other migrate calls from
      running for the same tenant, which is the actual contended resource).
      Wait — re-evaluate: the audit INSERT is from a separate test binary
      that does NOT call runForSchema(). It only inserts into audit_entries
      on a connection whose search_path is set to the tenant schema.
    concern: |
      If the audit INSERT is in-flight when DROP TRIGGER runs, the migrate
      lock does NOT prevent the deadlock because the audit INSERT is not
      going through runForSchema(). However, this scenario is far less likely
      in practice because:
        (a) audit INSERTs from integration tests are typically issued by
            TestHarness.init() helpers, which run inside a transaction
            wrapper that ROLLBACKs on deinit. The INSERTs complete (or
            roll back) before the migrate call gets to 1107 in most
            realistic interleavings.
        (b) The 1107 per-tenant DROP TRIGGER is already wrapped in
            BEGIN ... EXCEPTION WHEN OTHERS RAISE WARNING (line ~500
            of 1107). With the migrate lock held, this still fails the
            same way unless the lock prevents the interleaving.
      VERIFICATION REQUIRED: the integration test must demonstrate that
      the migrate lock eliminates the deadlock in practice. If it does
      not (because audit INSERTs from concurrent test binaries do not
      hold the migrate lock), the fix must additionally include
      NOWAIT or statement_timeout on the DROP TRIGGER so it fails fast
      and the migration runner can retry.

  fallback_fix_nowait:
    description: |
      If empirical evidence shows the migrate advisory lock is insufficient,
      add SET LOCAL lock_timeout = '2s' on the migrate connection so the
      DROP TRIGGER fails fast with 55P03 (lock_not_available) and the
      runner retries with backoff. This is a last resort — it pollutes the
      migration semantics with timeouts.
    prefer_over: "Advisory lock alone — must be empirically validated."

