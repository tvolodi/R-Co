      -- Inside the per-tenant DO loop — THIS is the deadlock source.

  - file: migrations/1107_fix_audit_chain_text_resource_id.sql
    line_471: |
      'DROP TRIGGER IF EXISTS trg_bpm_audit_apply_chain_hash ON %I.audit_entries'
      -- Same trigger drop, second per-tenant location.

  - file: migrations/1107_fix_audit_chain_text_resource_id.sql
    line_500: |
      Final per-tenant DROP TRIGGER on the %I.audit_entries table inside the
      per-tenant DO loop with EXCEPTION WHEN OTHERS RAISE WARNING.

  - file: src/db/migrations.zig
    line_301: "BEGIN transaction wrapping the migration SQL"
    line_307: "conn.simpleQuery(sql_bytes) — runs the migration that contains DROP TRIGGER"
    line_323: "COMMIT"
    line_78: "pub fn runForSchema(allocator, pool, migrations_dir, schema_name, force_reconcile)"
    note: |
      No advisory lock is acquired around the per-tenant migrate step. The
      helper acquires a single connection from the pool, sets search_path,
      iterates files, and for each pending migration runs BEGIN →
      simpleQuery(file) → INSERT INTO public.schema_migrations → COMMIT.
      Concurrent runForSchema() calls on the same or different tenant
      schemas are NOT serialized.

  - file: src/db/provisioning.zig
    line_94: "Step 5: migrations.Migrations.runForSchema(allocator, pool, migrations_dir, schema_name, false)"
    note: |
      provisionTenantSchema() is what TC-TNT-01-01 exercises. It calls
      runForSchema() with no surrounding lock — so multiple test processes
      provisioning different tenants concurrently (or the same tenant re-run
      during rework) all enter runForSchema() without serialization.

  - file: tests/integration/tnt_schema_isolation_test.zig
    line_187: 'test "TC-TNT-01-01: all 21 business tables exist in tenant schema after provisioning"'
    line_207: "try provisionTenantSchema(alloc, &pool, tenant_id, migrationsDir()) — concurrent calls from multiple test binaries"
    line_839: 'test "TC-TNT-03-01: pool checkout for resolved tenant includes tenant schema in search_path"'
    line_937: 'test "TC-TNT-03-03: two concurrent connections for different tenants have independent search_paths"'
    note: |
      TC-TNT-03-01 and TC-TNT-03-03 do not directly INSERT into audit_entries,
      but TC-TNT-03-01 acquires a pool connection whose search_path is set to
      a tenant_* schema; any follow-on INSERT issued under that search_path
      (or by helpers operating on the same connection) hits audit_entries in
      that tenant and fires the BEFORE INSERT trigger.

  - file: migrations/1109_iss0122_apply_chain_hash_lock_cast.sql
    note: |
      Migration 1109 itself does NOT contain DROP TRIGGER. It re-creates
      `bpm_audit_apply_chain_hash()` per tenant via CREATE OR REPLACE FUNCTION
      inside a per-tenant DO loop, but the trigger binding is preserved
      (CREATE OR REPLACE keeps the function OID). However, 1109's
      CREATE OR REPLACE acquires a brief AccessExclusiveLock on the function
      row — this overlaps in time with 1107's DROP TRIGGER and is therefore
      part of the same concurrency window.

