# ISS-0129 — Migration Runner DROP TRIGGER vs Audit Trigger C40P01 Deadlock
# Diagnosis (WF-03 Step 1, ISSUE-FIXER)
#
# Run:        WF03-gh419-20260805
# Issue ID:   ISS-0129
# GitHub:     https://github.com/tvolodi/R-Co/issues/419
# Symptom:    TC-TNT-01-01 hits POSTGRES C40P01 deadlock on
#             DROP TRIGGER trg_bpm_audit_apply_chain_hash under concurrent
#             `zig build test-integration` (concurrent TC-TNT-01-01 + TC-TNT-03-01
#             + TC-TNT-03-03).
# Author:     ISSUE-FIXER (diagnosis only — no source changes in this step)

