# ---------------------------------------------------------------------------
# 9. SUMMARY
# ---------------------------------------------------------------------------

one_paragraph_root_cause: |
  The C40P01 deadlock in TC-TNT-01-01 is NOT caused by migration 1135 (which
  contains only an INSERT...SELECT backfill and no DROP TRIGGER) but by
  migration 1107, whose per-tenant DO block contains `DROP TRIGGER IF EXISTS
  trg_bpm_audit_apply_chain_hash ON audit_entries`. When runForSchema()
  applies 1107 to a tenant schema, it acquires AccessExclusiveLock on the
  trigger row. Concurrently, a different test process (TC-TNT-03-01 or its
  TestHarness helpers) inserts into the same tenant's audit_entries; the
  BEFORE INSERT trigger bpm_audit_apply_chain_hash acquires a per-tenant
  pg_advisory_xact_lock AND a row lock on the predecessor chain_hash row.
  DROP TRIGGER waits for the row lock; the trigger function's commit waits
  for DROP TRIGGER to release AccessExclusiveLock — classic C40P01 cycle.
  Fix: wrap the per-tenant migration apply step in
  pg_advisory_xact_lock(hashtext('bpm.migrations.runForSchema')::bigint) in
  src/db/migrations.zig:runForSchema() so concurrent migrate calls serialize
  on a single lock whose keyspace does NOT overlap with the trigger's
  per-tenant advisory lock. Audit INSERTs remain concurrent.