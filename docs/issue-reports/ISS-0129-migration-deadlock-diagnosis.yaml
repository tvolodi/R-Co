# ---------------------------------------------------------------------------
# 6. RISK ANALYSIS
# ---------------------------------------------------------------------------

risk_analysis:

  test_parallelism_loss:
    severity: MINOR
    description: |
      Serializing migrate steps across tenants means tests that previously
      ran migrate concurrently now serialize. This affects the cold-start
      latency of `zig build test-integration` proportionally to the number
      of tenants each test provisions. Empirically this is small (the
      migrate step is fast; the bulk of integration-test time is audit
      INSERTs which are unaffected).

  audit_insert_deadlock_persists:
    severity: MAJOR
    description: |
      As noted in fix_strategy.why_drop_trigger_can_still_acquire_access_exclusive,
      the advisory lock does NOT prevent an audit INSERT from being in-flight
      when DROP TRIGGER runs, because the audit INSERT does not call
      runForSchema(). If empirical reproduction shows the deadlock still
      occurs after the advisory-lock fix, escalate to NOWAIT + retry.

  migration_already_applied_path:
    severity: MINOR
    description: |
      The advisory lock is acquired BEFORE the already-applied check.
      Already-applied schemas will still block on the lock briefly. This is
      acceptable — already-applied schemas complete the lock check in
      microseconds (no SQL to run).

