# ---------------------------------------------------------------------------
# 1. CORRECTION OF THE REPORTED MISLEADING ROOT CAUSE
# ---------------------------------------------------------------------------

reported_root_cause_wrong: |
  The GitHub issue body (and ISS-0129.json as originally filed) claims the
  deadlock comes from migration 1135 (`migrations/1135_iss0114_backfill_public_tenant_storage_mode.sql`).
  This is INCORRECT.

  Verified by direct file inspection: migration 1135 contains ONLY an
  INSERT...SELECT backfill of `public.tenant` from `public.tenant_schemas`
  (ON CONFLICT DO UPDATE). It has no DROP TRIGGER, no ALTER TABLE, no DDL on
  audit_entries at all.

  Confirmed via Select-String on the migrations directory: the DROP TRIGGER
  on trg_bpm_audit_apply_chain_hash lives in migration 1107, not 1135.

actual_root_cause: |
  Migration 1107 (`migrations/1107_fix_audit_chain_text_resource_id.sql`)
  contains `DROP TRIGGER IF EXISTS trg_bpm_audit_apply_chain_hash
  ON audit_entries` inside a per-tenant DO block (lines ~471 and ~500) that
  runs once for every `tenant_*` schema via Migrations.runForSchema().

  When TC-TNT-01-01 invokes provisionTenantSchema() → runForSchema() and the
  runner reaches migration 1107, it opens a transaction (src/db/migrations.zig:301),
  runs the per-tenant DROP TRIGGER via simpleQuery (src/db/migrations.zig:307),
  then commits (src/db/migrations.zig:323).

  Concurrently, TC-TNT-03-01 / TC-TNT-03-03 acquire pool connections for the
  SAME tenant schema and INSERT into audit_entries. That fires the BEFORE
  INSERT trigger `bpm_audit_apply_chain_hash()` (the same trigger 1107 is
  trying to drop), which executes:
    1. pg_advisory_xact_lock(hashtext('bpm.audit.chain.' || NEW.tenant_id))
    2. SELECT ... FROM audit_entries FOR-key-share on the predecessor hash row
    3. INSERT the new audit_entries row

  The classic C40P01 cycle:
    - TC-TNT-01-01's migrate transaction wants AccessExclusiveLock on the
      trigger row in pg_trigger (DROP TRIGGER semantics).
    - TC-TNT-03-01's INSERT transaction holds the row lock on the predecessor
      audit_entries row from its SELECT inside the trigger function.
    - When TC-TNT-03-01 tries to acquire AccessExclusiveLock on the trigger
      row to COMMIT (trigger-function cleanup), it blocks behind TC-TNT-01-01.
    - TC-TNT-01-01's DROP TRIGGER waits for the trigger function to release
      the row lock it holds.
    - PostgreSQL detects the cycle and aborts one of them with C40P01
      "deadlock detected".

  The trigger function uses `pg_advisory_xact_lock` on the per-tenant lock key
  (bpm_audit_apply_chain_hash in migration 1109 explicitly wraps this in a
  BEGIN ... EXCEPTION WHEN OTHERS block to keep audit writes unblocked, but
  the row lock on the predecessor chain_hash row is NOT guarded — and that
  row lock is precisely what creates the cycle).

