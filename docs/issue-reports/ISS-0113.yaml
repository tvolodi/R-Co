# -----------------------------------------------------------------------------
# RESOLUTION STRATEGY
# -----------------------------------------------------------------------------

resolution_strategy: |
  Three-part fix:
  
  1. **Migrate deterministic UUID generation to per-test randomness**
     Replace `generateTestUuid(seed)` with `TestHarness.newUuid()` (the helper
     added in ISS-0121 / PR #399) in all affected test files. This ensures each
     test invocation generates truly unique event_id and idempotency_key values
     even across concurrent binaries.
  
  2. **Harden cleanup ordering**
     Verify that every affected test's cleanup logic deletes child rows before
     parent rows in FK dependency order:
       - timers (FK to instances)
       - tasks (FK to instances)
       - events (FK to instances, also uq_event_idempotency)
       - instance_definition_snapshots (FK to instances)
       - instance_projections (parent of FK chain)
     
     Ensure all DELETE statements propagate errors (no silent catch) per ISS-0125.
  
  3. **Enforce per-test UUID policy via lint**
     Promote T010 (hardcoded UUID literals) from MAJOR to BLOCKER in
     tools/lint_test_isolation.py for event-store-related test files to prevent
     regression. Consider adding a T011 rule specifically for deterministic-seed
     UUID generation patterns (e.g., flag `generateTestUuid(1)` as an anti-pattern).

resolution_scope:
  files_to_modify: 6
  estimated_lines_changed: ~150
  requires_schema_change: false
  requires_migration: false

# -----------------------------------------------------------------------------
# PREVENTION MEASURES
# -----------------------------------------------------------------------------

prevention:
  - title: Enforce TestHarness.newUuid() for all fixtures
    description: |
      Add a lint rule (T011) that flags local `generateTestUuid(seed)` functions
      or any UUID generation using a hardcoded seed parameter. All per-test UUIDs
      must use `TestHarness.newUuid()` or `std.crypto.random.bytes()`.
  
  - title: Document FK cleanup order in test guide
    description: |
      Update docs/guides/test_developer_guide.md with a canonical FK dependency
      diagram for event-store-related tables and require all cleanup code to
      follow that order. Include a code snippet showing the correct pattern.
  
  - title: Verify cleanup completeness on every test-integration run
    description: |
      Add a post-test-integration check (in build.zig or a wrapper script) that
      queries for leaked rows (e.g., events where instance_id does not exist in
      instance_projections) and fails the run if any are found. This catches
      incomplete cleanup immediately rather than letting it contaminate
      subsequent runs.

