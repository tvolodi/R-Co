# -----------------------------------------------------------------------------
# ROOT CAUSE ANALYSIS
# -----------------------------------------------------------------------------

root_cause: |
  Integration test fixtures in event-store and instance tests reuse
  deterministic event_id and idempotency_key values across test cases and
  binaries that share the same PostgreSQL test database (BPM_TEST_DB_URL).
  
  The specific mechanism:
  
  1. Tests use `generateTestUuid(seed: u64)` with hardcoded seeds (e.g., seed 1,
     seed 2) to produce "per-test" UUIDs, but the seeds are reused across
     different test files that compile into separate binaries.
  
  2. When multiple test binaries run concurrently (zig build test-integration),
     or even sequentially without proper cleanup, the same event_id and
     idempotency_key values appear in multiple INSERT statements.
  
  3. PostgreSQL's uq_event_idempotency UNIQUE constraint (on events table)
     rejects the duplicate, producing error 23505 (unique_violation).
  
  4. Test cleanup (via defer or explicit DELETE) is incomplete or fails due to
     foreign-key dependencies (timers, tasks, events all reference instance_id
     and instance_projections; events must be deleted before instances).
  
  5. Even when cleanup is present, FK ordering violations cause cleanup to fail
     (e.g., attempting to delete instance_projections before deleting child
     events), leaving contaminated state for subsequent tests.
  
  Evidence:
  - tests/integration/iss203_idempotency_keys_test.zig uses
    `generateTestUuid(seed)` with seeds 1-5 across its 5 test cases (TC-ISS-203-01
    through TC-ISS-203-05).
  - tests/integration/event_store_integration_test.zig and
    tests/integration/instance_error_test.zig likely use similar patterns.
  - Prior issue ISS-0121 (GitHub #387/#402) addressed hardcoded UUID literals
    across 100+ integration test files with the same contamination pattern; this
    issue is the event-store-specific manifestation that persisted after that fix.
  - The cleanup helper `cleanupInstance()` in iss203_idempotency_keys_test.zig
    deletes in FK order (timers → tasks → events → snapshots → projections) but
    ISS-0125 (GitHub #391) shows that propagating SQL errors from child deletes
    is required for visible diagnosis — earlier implementations may have swallowed
    errors.

failure_category: CATEGORY_D_test_code_error
category_rationale: |
  The source code (src/events/, src/engine/instance.zig) is correct. The defect
  is in the test fixture generation pattern. Tests reuse deterministic identifiers
  across binaries in a way that violates the shared-database integration model.
  Per the WF-03 failure category table, this is a test implementation error, not
  a logic error in the system under test.

