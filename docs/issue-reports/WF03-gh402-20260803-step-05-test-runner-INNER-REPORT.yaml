# Database Infrastructure Issue — Root Cause Analysis

## Error Trace

```
zig build test
  → tests/unit/test_api08_auth.zig:520
    var db_pool = try pool.Pool.init(std.testing.io, alloc, .{ .url = url, .pool_size = 3 })
                                  ^
    Error thrown: PoolError.ConnectionFailed

  → src/db/pool.zig:672
    return PoolError.ConnectionFailed
    ^
    Triggered by: PgError.AuthenticationFailed

  → vendor/pg/pg.zig:636
    if (f_type != 'R') return PgError.AuthenticationFailed
                       ^
    In handleScram() negotiation

  → vendor/pg/pg.zig:417
    try self.handleScram(opts.password)
    ^
```

## Diagnosis

The PostgreSQL connection is failing at the SCRAM (Salted Challenge Response Authentication Mechanism) handshake. The server is responding with an unexpected frame type `f_type` (not 'R'), indicating either:

1. **Credential mismatch:** Password in connection string doesn't match PostgreSQL user password
2. **Server misconfiguration:** PostgreSQL rejects SCRAM handshake format
3. **Connection string format error:** URL parser fails to extract credentials correctly
4. **Database initialization incomplete:** Test database `bpm_test` created but user `bpm` not properly provisioned

## Environment State Observed

```
docker-compose ps:
  db_test:  UP 27 hours (healthy) ✓
  keycloak: UP 33 hours (healthy) ✓

pg_isready -U bpm:
  /var/run/postgresql:5432 - accepting connections ✓

BPM_TEST_DB_URL:
  postgres://bpm:bpm@localhost:5433/bpm_test
```

## Attempted Connection

```bash
psql -h localhost -p 5433 -U bpm bpm_test
```

Status: Unable to complete query (authentication appears to fail silently in context of this workflow)

## Probable Root Cause

The test database container is running and accepting connections, but the credentials (username=bpm, password=bpm) from docker-compose.yml environment variables either:
1. Were not applied to the container when it started, or
2. Do not match what the container is currently using, or
3. The container has reset since startup and requires re-initialization

## Recommendations

1. **Verify docker-compose.yml credentials** match expected BPM_TEST_DB_URL
2. **Restart db_test container** to re-apply environment variables
3. **Check PostgreSQL logs** inside container for auth failures
4. **Reinitialize test database** by dropping and recreating bpm_test user/database
5. **Verify migrations are applied** via `zig build migrate` after credentials are fixed

