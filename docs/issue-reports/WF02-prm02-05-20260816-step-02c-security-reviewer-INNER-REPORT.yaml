issues_found:
  - severity: BLOCKER
    description: >-
      INV-1 — promotion_reviews is not tenant-isolated. Migration
      096_promotion_reviews.sql is a numeric migration with no -- scope header
      and no public-guard, so it runs in the public pass (confirmed: bpm_test
      schema_migrations has ('public','096_promotion_reviews.sql') only). The
      resulting table exists ONLY in public with zero RLS policies and no
      per-tenant copies (pg query against bpm_test). The PRM-02..05 review
      read/write paths (submit/context/approve/reject/apply) therefore operate
      on a shared, un-scoped table whenever the request resolves via
      search_path=public (LEGACY_RLS-mode tenants, no-tenant/bootstrap
      requests) — cross-tenant read/write of serialised_plan promotion diffs
      and review metadata. This is exactly the INV-1 class of defect
      ('business table under public = cross-tenant leak regardless of SQL
      text'). The linter is blind to it because promotion_reviews is missing
      from tools/lint_migration_schema.py BUSINESS_TABLES.
  - severity: BLOCKER
    description: >-
      INV-2 / PRM-05 no-bypass integrity — approver identity is client-supplied.
      handleApproveReview discards the authenticated principal (_ = actor) and
      takes approved_by from the request body; the self-approval gate compares
      two client-supplied values (approved_by vs requested_by). Any
      authenticated caller who can read a review_id can approve it by supplying
      any approved_by UUID different from requested_by — including a fabricated
      UUID — so the separation-of-duties gate is trivially bypassable. The
      newly added DEFINITION_PROMOTION_APPROVED event records that client-
      supplied identity as actor_id in the audit trail. Combined with the
      public-table exposure above, one authenticated tenant principal can
      read/approve/apply any promotion review.
  - severity: MAJOR
    description: >-
      INV-1/INV-6 consistency — per-tenant event placement is inconsistent.
      rejectIfConflicts explicitly switches tenant context to the target tenant
      before appending DEFINITION_PROMOTION_REJECTED, while
      approveReview/markReviewApplied append DEFINITION_PROMOTION_APPROVED /
      DEFINITION_PROMOTION_APPLIED under the request principal's tenant context
      (no switch to the review row's tenant_id). The same promotion's audit
      trail is therefore split across tenant schemas depending on the pipeline
      step. Additionally submitReview inserts the review row under the caller's
      tenant context while stamping tenant_id = target_tenant_id, creating a
      logical/physical ownership mismatch. The batch needs an explicit
      decision on which tenant schema owns promotion review rows and promotion
      events, enforced consistently on every path.
next_steps:
  - ORCH routes the BLOCKER findings to BACKEND-DEV (fix) and ISSUE-FIXER Step 0.5 (file GitHub issues).
  - Fix required: (1) make promotion_reviews per-tenant (scope migration to tenant schemas only + add public-drop guard) and add it to lint_migration_schema.py BUSINESS_TABLES; (2) derive approver identity from the authenticated actor, not the request body; (3) make event placement consistent (single owner tenant per promotion).
  - Re-route to SECURITY-REVIEWER (Step 2c) after fix; TEST-DESIGNER (Step 3) must not start until this gate re-passes.
