summary: >-
  Security HARD GATE (WF-02 Step 2c) for PRM-02..05 (promotion pipeline) on
  branch feature/WF02-prm02-05-20260816. Verdict FAIL (BLOCKER). Reviewed the
  in-scope diff (src/api/routes/promotion_review.zig, src/definition/
  promotion_digest.zig, promotion_conflict.zig, promotion_review.zig,
  src/bpm.zig) against INV-1..INV-8. INV-7 and INV-8 are satisfied (all SQL
  parameterised via $N; no catch unreachable in the diff; lint_sql_param_types
  clean). INV-3 and INV-4 do not apply (no Lua/Wasm/secret changes). The gate
  fails on INV-1 with an empirically confirmed BLOCKER: the promotion_reviews
  business table is not tenant-isolated — in the test DB (bpm_test) it exists
  ONLY in public, with zero RLS policies and no per-tenant copies; migration
  096 is a numeric migration with no scope guard (applied in the public pass,
  per schema_migrations), and promotion_reviews is absent from the
  lint_migration_schema.py BUSINESS_TABLES list so the linter is blind to it.
  A second BLOCKER: the approve gate takes the approver identity from the
  request body (approved_by) and discards the authenticated principal
  (_ = actor), so the PRM-05 self-approval / separation-of-duties gate is
  trivially bypassable by supplying any approved_by != requested_by. A MAJOR
  finding: inconsistent per-tenant event placement (DEFINITION_PROMOTION_REJECTED
  is written under the target-tenant search_path by rejectIfConflicts, while
  DEFINITION_PROMOTION_APPROVED/_APPLIED are written under the request
  principal's context by appendPromotionEvent), plus the review row's physical
  placement (caller's schema) vs its tenant_id column (target tenant) mismatch.
  Grounding performed: zig build exit 0; lint_migration_schema, lint_sql_table_refs,
  lint_sql_param_types all exit 0; direct pg queries against bpm_dev and bpm_test.
  TEST-DESIGNER must NOT start until the BLOCKER findings are resolved and this
  gate re-passes.
