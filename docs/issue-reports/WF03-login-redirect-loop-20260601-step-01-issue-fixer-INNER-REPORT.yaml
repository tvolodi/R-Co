  root_cause:
    type: oidc_redirect_loop_multi_surface_regression
    details: >-
      The login loop is preserved by three coupled defects. nginx forwarded Host
      without the exposed port, so Keycloak generated redirect URLs on port 80
      instead of 8081. The OIDC manager used in-memory storage for PKCE/state, so
      a callback reload or remount discarded the verifier and made
      signinRedirectCallback fail, which restarted login. The tenant-config
      endpoint returned a 127.0.0.1 authority fallback instead of the browser-
      visible localhost origin, so the configured authority did not match the
      page origin.
  files_to_change:
    - infrastructure/keycloak/gateway/nginx.conf
    - web/src/auth/OidcManager.ts
    - src/api/routes/tenant_config.zig
