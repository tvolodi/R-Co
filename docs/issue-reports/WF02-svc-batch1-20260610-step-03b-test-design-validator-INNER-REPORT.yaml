issues:

  # ── BLOCKERS ──────────────────────────────────────────────────────

  - id: ISSUE-01
    severity: BLOCKER
    test_case: TC-SVC-04-06
    test_name: "svc04: scope change to tenant with conflicting active definitions returns 409"
    file: tests/integration/svc04_admin_api_test.zig
    description: >
      Transaction isolation bug — the ACTIVE process_definition fixture is inserted
      via `h.conn` (which is inside the harness's open, uncommitted transaction). The
      `handleAdminUpdateService` call runs through `catalog` which uses a separate pool
      connection. Under PostgreSQL READ COMMITTED, pool connections cannot see the
      uncommitted definition. The handler finds no conflicting definition and returns
      HTTP 200. The assertion `expectEqual(409, result.status_code)` will fail at
      TEST-RUNNER time.
    required_fix: >
      Move the process_definitions INSERT outside the harness transaction so it is
      committed before the update handler runs. Options:
        (a) Use a separate direct connection for the definition insert and commit it
            before calling handleAdminUpdateService; clean up (DELETE) after the test.
        (b) Use the catalog's pool to insert the definition (e.g., via a test helper that
            inserts and commits a minimal ACTIVE definition).
        (c) Add a dedicated test-only helper that commits the definition and registers it
            in an explicit defer cleanup.

  - id: ISSUE-02
    severity: BLOCKER
    test_case: TC-SVC-04-08
    test_name: "svc04: delete service in use by active definition returns 409"
    file: tests/integration/svc04_admin_api_test.zig
    description: >
      Same transaction isolation bug as ISSUE-01. The ACTIVE definition fixture is
      inserted via `h.conn` (uncommitted transaction). `handleAdminDeleteService` uses
      pool connections that cannot see the uncommitted definition, so it proceeds with
      deletion and returns HTTP 200 (or 204). The assertion `expectEqual(409, ...)` fails.
    required_fix: >
      Same remediation as ISSUE-01 — commit the definition insert before the delete
      handler is called. A per-test committed insert + explicit defer DELETE cleanup
      pattern would fix both TC-SVC-04-06 and TC-SVC-04-08.

