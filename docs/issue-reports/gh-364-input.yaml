    ## Summary

    Discovered by BACKEND-DEV while implementing and verifying the ISS-0105 fix (#363, itself filed while resolving ISS-0100 / #357). ISS-0105's fix (scoping `migrations/GBL-084_rls_removal.sql`'s raw pre-flight guard to `tenant_type='production' AND slug NOT LIKE 'tc-%'`, matching GBL-102/GBL-103) is independently confirmed mechanically correct and complete for its own scope — direct DB query after a full concurrent `test-integration` run showed zero `LEGACY_RLS` rows qualify under the new scoped guard, and "ISS-503 pre-flight failed" log lines dropped from "28 tenant(s)" (pre-fix) to "1 tenant(s)" (post-fix, matching only one deliberate test fixture) across two full-suite runs.

    Despite this, `db_integration_test.zig`'s `TC-DB-01-01` and `TC-DB-01-02` — the original #357 acceptance-bar tests — **still fail deterministically** under full concurrent `zig build test-integration` execution.

    ## Root cause (partial — correlation established, exact causal mechanism not yet proven)

    Both tests fail on `try std.testing.expect(n > 0)`, where `n` is `SELECT COUNT(*) FROM schema_migrations` — the count returns 0, even though the table holds 100+ rows (confirmed via a direct concurrent `psql` query mid-investigation). Critically, no `runMigrations failed` debug print appears anywhere in either failing run's log, meaning `Migrations.run()` did NOT return an error — it silently succeeded — so this is **not** a guard-firing failure and **not** related to ISS-0100/ISS-0105's tenant_type/slug scoping logic.

    Both full-suite logs show extensive Postgres `deadlock detected` (error code 40P01, involving `AccessExclusiveLock`) across concurrently-running migration/DDL test binaries, plus other cross-binary contention signatures in the same log windows (duplicate key violations, missing-relation errors, FK violations). This matches a signature already independently recorded once before this fix existed (`tests/reports/report-20260731-WF03-iss0100-20260731-rework1.yaml`), confirming it is a separate, pre-existing defect — not a regression introduced by ISS-0100 or ISS-0105.

    ## Working hypothesis

    A plain SELECT should not normally be aborted by a deadlock on an unrelated table's lock under READ COMMITTED semantics, unless (a) the SELECT's own connection/transaction was itself a deadlock participant and got silently aborted/returned a stale empty result, or (b) concurrent DDL from multiple binaries independently calling `TestHarness.init() -> Migrations.run()` creates enough lock contention that a connection-pool or driver-level retry masks a failed query as an empty success.

    ## Candidate resolution

    Non-exclusive candidates, needs investigation to pick:
    - (a) Add a session-level advisory lock around `db_integration_test.zig`'s own `TestHarness.init()`/`schema_migrations` read, consistent with the existing advisory-lock pattern already used in `tests/integration/helpers.zig`'s `runMigrations()`.
    - (b) Exclude DDL-heavy binaries (e.g. `test-integration-iss503`) from the default parallel `test-integration` umbrella step's concurrent execution, running them serially instead.
    - (c) Investigate whether the `pg.zig` driver/connection pool silently swallows a deadlock-aborted transaction's error and returns an empty/zero result instead of propagating the error — if so, that may be a separate driver-level bug worth its own issue.

    ## Severity

    BLOCKER — the original #357 acceptance bar (TC-DB-01-01/02 passing) is still not met under standard concurrent test-suite execution, even though both ISS-0100 and ISS-0105's fixes are independently verified correct and complete for their own scope.

    ## How this was found

    Discovered by BACKEND-DEV while implementing and verifying the ISS-0105 (#363) fix, in run WF03-iss0100-20260731.
