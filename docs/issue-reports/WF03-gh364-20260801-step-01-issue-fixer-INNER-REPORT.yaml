summary: >-
  Completed WF-03 Steps 0.5 and 1 without implementation changes. Registry search
  found the existing resolved ISS-0106 entry by exact issue ID, title, affected
  areas, and GitHub URL; no duplicate was filed. Static source inspection and
  archived runtime evidence confirm that tests/integration/test_iss503_rls_removal.zig
  is the AccessExclusiveLock holder: TC-ISS503-01/02/03 use a raw pg.Conn, BEGIN,
  direct execution of GBL-084's ALTER TABLE/DROP POLICY/DROP FUNCTION body, and a
  late ROLLBACK. The historical flat sibling wiring in build.zig allowed that run
  artifact to overlap every other integration binary. The shared TestHarness locks
  cannot protect against this binary because it bypasses helpers.zig and never
  participates in those advisory-lock protocols. vendor/pg/pg.zig falsifies the
  driver-masking hypothesis: ErrorResponse sets got_error and ReadyForQuery returns
  PgError.ServerError; no retry or conversion to an empty successful Result exists.
