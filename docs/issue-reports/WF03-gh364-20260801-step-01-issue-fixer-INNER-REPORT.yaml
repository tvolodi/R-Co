        the barrier prevented the binary from starting before other siblings settled.
    - source: handoffs/WF03-iss0106-20260731/step-05-test-runner.json at commit 35471e7
      finding: >-
        Independent verification scanned a complete 29,680-line integration log and
        found zero ISS-503-related occurrences in any deadlock/failure; standalone
        test-integration-iss503 passed 4/4.
    - source: git commit 35471e72a61c8593bc73ce55203405e9dbe755cb
      finding: >-
        Merged commit #367 introduced the barrier and documentation for ISS-0106/#364,
        corroborating that removal of the temporal overlap was the effective fix.
  current_runtime_execution:
    status: not_run
    reason: >-
      ISSUE-FIXER has no authority to run build/test commands under the capability
      matrix. Diagnosis uses current source plus committed historical runtime evidence.
resolution_strategy_for_code_designer:
  conservative_primary: >-
    Preserve or re-specify the build-graph barrier as the root-cause fix: every
    non-ISS-503 integration Run step must complete before a dedicated full-suite
    ISS-503 Run step becomes eligible, while the narrow test-integration-iss503 target
    remains independent. BACKEND-DEV is the required implementation agent because the
    affected surface is build.zig and backend integration-test infrastructure.
  affected_files:
    required:
      - build.zig
    documentation_only_or_review:
      - tests/integration/test_iss503_rls_removal.zig
    no_change_expected:
      - tests/integration/helpers.zig
      - vendor/pg/pg.zig
      - src/db/migrations.zig
      - tests/integration/db_integration_test.zig
  explicit_non_solutions:
    - Do not add sleep calls.
    - Do not add deadlock retries or retry-on-40P01 wrappers.
    - Do not merely raise lock_timeout or deadlock_timeout.
    - Do not lock only db_integration_test.zig's COUNT query or TestHarness call.
    - Do not claim pg.zig masks deadlock errors; source falsifies that hypothesis.
    - Do not serialize all integration binaries when isolating the single raw-DDL outlier is sufficient.
  design_note: >-
    The current main branch already contains the conservative barrier from merged PR
    #367. CODE-DESIGNER should treat this invocation as diagnosis/revalidation and
    design preservation unless GitHub #364's reopened context identifies a concrete
    regression in that graph. A sleep/retry workaround remains prohibited.
