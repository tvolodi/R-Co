    - file: migrations/GBL-084_rls_removal.sql
      finding: >-
        Contains ALTER TABLE, DROP POLICY, DROP COLUMN, and DROP FUNCTION statements
        across shared public business tables.
    - file: build.zig
      finding: >-
        Current barrier and dedicated post-barrier ISS-503 Run artifact are present;
        commit 35471e7 shows they replaced the pre-fix flat sibling dependency set.
    - file: tests/integration/helpers.zig
      finding: >-
        Advisory locks are explicitly acquired only by TestHarness migration/init
        paths, confirming they are cooperative and cannot cover a raw external Conn.
    - file: vendor/pg/pg.zig
      finding: >-
        ErrorResponse is propagated as PgError.ServerError at ReadyForQuery; query()
        returns Result only after that succeeds.
  empirical_archived:
    - source: handoffs/WF03-iss0106-20260731/step-03-backend-dev.json at commit 35471e7
      finding: >-
