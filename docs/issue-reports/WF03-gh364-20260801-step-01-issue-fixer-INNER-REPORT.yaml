root_cause:
  exact_lock_holder:
    binary_source: tests/integration/test_iss503_rls_removal.zig
    build_artifact: iss503_integration_tests
    umbrella_run_artifact: run_iss503_integration_tests_after_others
    historical_pre_fix_run_artifact: run_iss503_integration_tests
    tests:
      - TC-ISS503-01
      - TC-ISS503-02
      - TC-ISS503-03
    mechanism: >-
      The tests open a direct pg.Conn rather than TestHarness, begin an explicit
      transaction, execute migrations/GBL-084_rls_removal.sql through simpleQuery(),
      and keep the transaction open through assertions until ROLLBACK. GBL-084 runs
      ALTER TABLE, DROP POLICY, and DROP FUNCTION statements against shared public
      relations. PostgreSQL holds those DDL locks until transaction end, so the
      binary owns long-lived AccessExclusiveLock entries while other binaries are
      trying to migrate, truncate, or modify overlapping relations.
  build_scheduling:
    pre_fix: >-
      The historical build graph attached run_iss503_integration_tests.step and the
      other Run steps as independent sibling dependencies of test_integration_step.
      Sibling dependencies have no relative ordering edge, so Zig's build scheduler
      may execute them concurrently.
    current_repository: >-
      build.zig now aggregates every non-ISS-503 Run step under
      test-integration-others-internal and makes a dedicated
      run_iss503_integration_tests_after_others Run step depend on that barrier.
      This is the previously merged ISS-0106 resolution and proves the conservative
      graph shape expected from the new CODE-DESIGNER review.
  advisory_lock_analysis:
    test_harness_protection: >-
      helpers.zig serializes runMigrations() with
      pg_advisory_lock(hashtext('bpm_test_migrations_public')), serializes
      runMigrationsForSchema() with a schema-keyed advisory lock, and currently
      widens the public lock around resetTestData()/compatibility DDL. These locks
      coordinate only sessions that acquire the same keys.
    why_insufficient_for_iss503: >-
      TC-ISS503-01/02/03 never call TestHarness and never acquire those advisory
      locks. PostgreSQL advisory locks are cooperative; they do not automatically
      block ordinary DDL. Therefore adding a lock only around
      db_integration_test.zig's TestHarness or COUNT query cannot prevent the raw
      ISS-503 transaction from acquiring conflicting table locks.
  pg_driver_hypothesis:
    verdict: falsified
    evidence: >-
      vendor/pg/pg.zig Conn.query() sends an extended query and delegates to
      readUntilReady(). On an ErrorResponse, readUntilReady() sets got_error=true;
      when ReadyForQuery arrives, it returns PgError.ServerError. The Result is
      constructed only after readUntilReady() succeeds. There is no retry path,
      connection-pool retry, stale-result reuse, or conversion of 40P01 into an
      empty successful row set. A COUNT value of 0 must therefore come from a
      successfully returned PostgreSQL row or from a separate test/query defect,
      not from this driver swallowing a deadlock error.
