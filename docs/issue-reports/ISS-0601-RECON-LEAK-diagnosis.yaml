notes: |
  The line numbers 707, 709, 752 mentioned in the issue refer to intermediate
  allocations in the token parsing loop. Those allocations are actually CORRECT —
  they properly use allocator.dupe() and have correct error cleanup.
  
  The actual leaks are in the ObjectMap key handling at lines 851 and 904,
  and in the missing value cleanup that should happen before .deinit().
  
  This is a textbook example of the "ObjectMap key ownership" pitfall in Zig:
  keys are NOT copied by put(), so the caller must ensure key lifetime exceeds
  the map lifetime. When keys come from a temporary arena, they MUST be duped.
