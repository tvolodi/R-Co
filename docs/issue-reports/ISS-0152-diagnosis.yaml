  method: >-
    Compared tools/lint_test_isolation.baseline.json at 9a2b45c (PR #499, the
    ISS-0171 regeneration) against its parent on the tuple
    (severity, code, file, message) - deliberately ignoring `line`, since a pure
    line resync must not change the finding set.
  result:
    entries_before: 225
    entries_after: 225
    newly_suppressed_ignoring_line: 0
    disappeared_ignoring_line: 0
  verdict: LEGITIMATE_LINE_RESYNC
  explanation: >-
    Zero findings were newly suppressed. PR #499 only resynced line numbers that
    PR #490 had shifted. Because issue_key() is
    "severity|code|file|line|message", a line shift silently breaks suppression;
    the resync restored it without hiding anything new. This is not gate-gaming.

