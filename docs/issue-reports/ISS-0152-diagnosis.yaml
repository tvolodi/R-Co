t010_categorization:
  - category: SYSTEM_CONSTANT
    description: >-
      Well-known fixed platform identifiers that MUST remain stable because
      production code, migrations, or the tenant-context mechanism depend on the
      exact value. Randomising these would break the tests, not isolate them.
    examples:
      - value: "00000000-0000-0000-0000-000000000000"
        role: default/system tenant sentinel passed to api_tenant_context.set()
        note: >-
          Already exempted in the linter itself (ALL_ZEROS_UUID is skipped) - it
          is not among the 184.
      - value: "00000000-0000-0000-0000-000000000001"
        occurrences: 13
        role: conventional platform-admin actor user_id in AuthContext fixtures
    disposition: BASELINE_WITH_REASON
    rationale: >-
      These are shared constants by design. Per-test randomisation is not the
      correct fix and would not improve isolation.

  - category: TEST_LOCAL_FIXTURE
    description: >-
      Per-file hand-assigned identifiers for instances, definitions and actors
      (e.g. "e5010000-0001-...", "defdef00-0001-...", "acac0000-0000-..."). These
      are the genuine INV-TI-2 violations: two tests running concurrently against
      the same database collide on these rows.
    representative_files:
      - tests/integration/event_store_integration_test.zig
      - tests/integration/test_snapshot_integration.zig
    correct_fix: >-
      TestHarness.newUuid() / TestHarness.newUuidString(allocator) in
      tests/integration/helpers.zig (introduced by ISS-0121 / GH #387 expressly
      to remove this collision class).
    disposition: FIX_IN_SOURCE
    scope_note: >-
      This is the real remaining debt. It is NOT what fails the gate today, and
      it is tracked separately - see `deferred_work` below.

actual_cause_of_exit_1_in_this_session:
  check: C4 schema baseline
  finding: >-
    `zig build test-env-verify` exited 1 in this workspace because of C4, not C5.
    Two distinct C4 failure modes were observed and both were traced to
    environment, not to repository state.
  cause_1_wrong_database:
    observed: "missing Postgres schemas for 95 tenant(s)"
    root_cause: >-
      The process environment carried BPM_TEST_DB_URL=...localhost:5434/bpm_test,
      which is workspace 1's port band. This workspace (compose project r-co-2)
      uses port 5453. verify_test_env.py's documented precedence is "real process
      environment always wins; .env fills gaps only", so the stale process value
      shadowed the correct .env value and the check ran against the wrong
      database - one holding 96 leaked SCHEMA-mode fixture tenants.
    evidence:
      port_5434_schema_tenants: 96
      port_5453_schema_tenants: 1
    disposition: OPERATOR_ENVIRONMENT - not a repo defect.
  cause_2_unapplied_migrations:
    observed: >-
      "public.schema_migrations has 106 rows for schema_name='public', but
      migrations/ contains 108 *.sql files (delta = -2)"
    missing:
      - 1136_iss0149_exp301_effects_outbox_tenant_scope.sql
      - 1137_iss0156_entity_instance_projection_backfill.sql
    remedy_applied: >-
      Ran `zig build migrate` with BPM_DB_URL pointed at the test database; both
      migrations applied cleanly and C4 went green.
    disposition: LOCAL_DB_STATE - not a repo defect.

new_defect_found:
  id: ISS-0180
  severity: MAJOR
  title: >-
    verify_test_env C3 migrates BPM_DB_URL while C4 verifies BPM_TEST_DB_URL, so
    C3 can pass against an unmigrated test database
  detail: >-
    check_migrate() (C3) runs a bare `zig build migrate`, which resolves
    BPM_DB_URL first - the DEV database. check_schema_baseline() (C4) always
    verifies BPM_TEST_DB_URL - the TEST database. When the two point at different
    databases, C3 reports PASS having migrated a database C4 never inspects,
    while the test database stays behind. That is exactly what happened here:
    C3 PASS and C4 FAIL(delta=-2) in the same run. C3's remedy line
    ("resolve the migration failure above") is then misleading, because there was
    no migration failure - the migration simply targeted the wrong database.
  why_it_matters: >-
    C3's purpose in the Infrastructure Health Checklist is to establish that the
    database the integration tests will use is fully migrated. As written it can
    certify a database no test touches, which is a false green on a hard gate.
  disposition: FILED_AND_FORWARDED
  note: >-
    Filed and queued per CLAUDE.md "No Issue Left Local-Only". NOT fixed in this
    run: it did not block the acceptance criteria, and fixing a gate's own
    definition belongs in its own run with its own review.

