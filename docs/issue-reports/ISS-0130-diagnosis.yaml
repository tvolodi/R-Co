    - "Freshly created + freshly migrated bpm_test_fresh_iss0130 database — 10 solo sequential runs, 10/10 passed. Each run logs 48 deterministic, non-fatal PG ErrorResponse lines (see benign_noise_finding) but zero test failures and zero ConcurrentProvisionFailed / TestUnexpectedResult."
