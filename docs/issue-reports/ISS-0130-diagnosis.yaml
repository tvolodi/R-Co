benign_noise_finding: >
  Every run (pass or fail) against a database that has not yet had migration
  008/017/etc. seed tenant business tables prints ~12 `POSTGRES ERROR:
  ...C42P01 relation "X" does not exist...` lines per test (48 total across
  RT-1..RT-4) via vendor/pg/pg.zig:316's unconditional stderr print on any
  server ErrorResponse. These come from best-effort DROP/ALTER statements
  inside migration bodies that are guarded server-side (DO blocks with
  EXCEPTION WHEN undefined_table) but still emit a wire-level ErrorResponse
  that pg.zig logs regardless of whether the caller's own error handling
  swallows it. This is deterministic, present in every run including 10/10
  clean passes, and is NOT the ISS-0130 symptom — it is a separate, pre-existing
  cosmetic logging nuisance. Not in scope for this fix; not filed separately
  since it produces no test failures and is out of scope of the Unblock-Everything
  criteria (does not block any acceptance criterion here).

baseline_drift_finding: >
  The shared, long-lived `bpm_test` container (port 5453, workspace r-co-2) has
  pre-existing schema/fixture drift independent of ISS-0130: `python3
  tools/verify_schema_baseline.py --check-tenants` reports 8 tenant IDs with
  ledger rows in public.tenant_schemas but no matching Postgres schema
  (leaked/partial fixture rows from prior test runs), and --auto-fix does not
  resolve it. A full `zig build test-integration --summary all` run against
  this container reported 97 failed / 1 crashed out of 905 tests -- consistent
  with anti-patterns.md's documented class of shared-DB drift (see the
  "Measuring integration-suite pass/fail counts against the long-lived shared
  test database" entry). Per that guidance, a SEPARATE freshly created +
  freshly migrated database (bpm_test_fresh_iss0130) was created and used for
  the actual before/after measurement in this diagnosis; the drift itself is
  NOT part of ISS-0130's scope and is not fixed here (would require its own
  triage of which of the 8 leaked tenant rows are safe to delete vs.
  reprovision — a distinct, non-blocking, pre-existing condition of the shared
  workspace database, not of the codebase).

chosen_fix:
  approach: "Systemic hardening in Migrations.runForSchema(), not migration-file patching"
  justification: >
    The task's own preference order applies even though the failure cannot be
    reproduced today: patching migrations/008, 017, 040 to schema-qualify
    their CREATE TABLE statements would fix only those three files and leave
    every other unqualified CREATE TABLE/ALTER TABLE/INSERT INTO in the other
    ~100 migration files (all of which rely on the exact same
    runForSchema-sets-search_path-once contract) exposed to the identical
    class of bug the moment a future refactor invalidates the "one connection,
    held for the whole function" invariant. A runner-level fix protects the
    whole class; file-level qualification protects only the three files named
    in the issue and gives no defense against the next migration author who
    writes an unqualified statement. Editing already-applied migration files
    (008/017/040 have version rows in schema_migrations on every existing
    database) would also not re-run on any already-provisioned tenant schema
    or on `public` on any long-lived environment -- it only helps schemas
    provisioned AFTER the file edit ships, whereas a runner-level fix protects
    every future runForSchema() call regardless of migration content.
  fix_detail: >
    Re-assert `SET LOCAL search_path TO <schema>,public` as the FIRST
    statement inside each per-migration transaction (immediately after BEGIN,
    before the MIGRATIONS_LOCK_KEY_SQL advisory-lock acquisition), in addition
    to (not instead of) the existing session-level SET at function entry. This
    is defense in depth: SET LOCAL is transaction-scoped and cannot leak past
    COMMIT/ROLLBACK, so even if some future code path left the connection's
    session-level search_path in a stale state before reaching this loop
    iteration, each individual migration's transaction re-establishes the
    correct schema unconditionally and cannot be contaminated by whatever the
    connection did before BEGIN. This removes the "one distant SET at function
    entry must remain untouched for the entire function body" invariant and
    replaces it with a per-transaction guarantee that is verified by Postgres
    itself (SET LOCAL is inherently rolled back on ROLLBACK, so a failed
    migration cannot leave search_path set for whatever runs next either).
  files_changed:
    - src/db/migrations.zig

post_diagnosis_development: >
  While this diagnosis was in progress, a DIFFERENT concurrent workspace/run
  independently implemented and merged the identical systemic fix to `main`:
  commit 1d388ba (PR #531, "fix(db): SET LOCAL search_path per migration txn
  (GH #423)"), landed 2026-08-07T05:22:02Z UTC -- re-asserting `SET LOCAL
  search_path TO <schema>,public` as the first statement after BEGIN inside
  Migrations.runForSchema's per-migration transaction, matching this
  diagnosis's chosen_fix exactly (same mechanism, same placement). That PR
  additionally added a dedicated RT-6 regression test exercising the precise
  sequential-reprovisioning-after-concurrent-pass scenario RT-1/RT-2's own
  comments (lines 198-206) flagged as untested/out-of-scope for ISS-0129, plus
  an RT-5 source-stability assertion for the SET LOCAL string. Discovering
  this mid-implementation (via `git worktree add` against origin/main for the
  mandated baseline comparison), this run's own redundant src/db/migrations.zig
  edit was discarded and the branch was rebased onto origin/main to inherit
  the merged fix rather than duplicate it. This run's remaining contribution:
  independent empirical verification (0/40 repro attempts before rebasing,
  proving the fix's necessity is architectural rather than reproducible on
  demand), the ISS-0208 compile-blocker fix, and the ISS-0209 discovery below.

