iss_id: ISS-0130
github_issue: https://github.com/tvolodi/R-Co/issues/423
title: "Concurrent provisionTenantSchema races on stale search_path -> C42P01 post-GBL-112"
severity: MAJOR
diagnoser: BACKEND-DEV/ISSUE-FIXER
run_id: WF03-ISS-0130-20260807
diagnosed_at: "2026-08-07T06:08:30Z"

summary: >
  The issue as filed hypothesises that Migrations.runForSchema()'s session-level
  `SET search_path TO <schema>,public` can be silently overridden by a stale
  value left on a reused pool connection, causing migration 008's unqualified
  `CREATE TABLE IF NOT EXISTS users` to land in `public` (dropped by GBL-112)
  instead of the target tenant schema. Root cause CONFIRMED as architecturally
  real (the code has exactly the fragility described), but could NOT be
  empirically reproduced against the current `main` HEAD after 40+ repro
  attempts (solo sequential, concurrent-OS-process stress, and a full
  `zig build test-integration` baseline run), on both the shared long-lived
  `bpm_test` database and a freshly created + freshly migrated database.
  The most likely explanation: GH #424 / ISS-0131 (a DIFFERENT workspace's fix,
  commit 9512c69, merged to `main` at 2026-08-07T05:09:54Z UTC — concurrently
  with this run) added a session-scoped `pg_advisory_lock` wrapping the ENTIRE
  `provisionTenantSchema()` call per tenant_id. That lock forces every
  `pool.acquire()`/`pool.release()` cycle inside one `provisionTenantSchema`
  call (idempotency check, schema creation, runForSchema, registry update,
  promotion) to execute against a stable ordering, incidentally narrowing (and
  in the two-tenant, two-worker-thread scenario RT-1/RT-2 exercise today,
  apparently eliminating) the exact interleaving ISS-0130 depends on. This
  timeline is coincidental, not a deliberate fix for ISS-0130 — GH #424's
  commit message and diff make no mention of search_path staleness.

root_cause_confirmed:
  mechanism: >
    Migrations.runForSchema() (src/db/migrations.zig:104-166) acquires ONE
    connection at function entry (line 112) and holds it via
    `defer pool.release(conn)` for the function's entire lifetime. It sets
    search_path exactly once via a plain session-level
    `SET search_path TO {schema_name},public` (line 126-129) BEFORE any
    `BEGIN`. This SET is correct for as long as (a) this is the only
    `SET search_path` executed against this specific connection instance for
    the rest of the function, and (b) no migration file's own SQL body issues
    a competing `SET search_path` that COMMITs (a session-level SET inside a
    transaction persists past COMMIT; only `SET LOCAL` reverts). Both
    conditions hold in the code as read today (verified: no migration file
    other than two comment-only mentions contains an executable
    `SET search_path`; grep results below). The design is nonetheless FRAGILE
    by construction: the correctness of every unqualified `CREATE TABLE IF NOT
    EXISTS users` (migrations/008_identity.sql:8 and siblings in the same
    file) depends entirely on this one connection's search_path never being
    touched by anything else between line 129 and the per-file
    `simpleQuery()` call (line 482) for that migration — an invariant that is
    true today only because of the current call shape, not because it is
    structurally enforced. A future change that acquires a second connection
    mid-loop, or reuses `conn` outside runForSchema's own frame, would
    silently reintroduce exactly the failure mode ISS-0130 describes, with no
    compiler or test signal until it actually races.
  evidence:
    - "src/db/migrations.zig:104-166 (runForSchema signature through schema_migrations bootstrap) — single acquire/release pair for the whole function, SET search_path issued once outside any transaction."
    - "src/db/pool.zig:779-821 (Pool.acquire) — calls applyRequestStorageRouting() on every acquire, which branches on the per-thread tenant_context; for the no-tenant case (tenant_context.get()==\"\") it issues `SET search_path TO public` (line 263)."
    - "src/db/pool.zig:834-869 (Pool.release) — calls resetConnectionSearchPath() (line 381-387), which issues `SET search_path TO public` before the connection re-enters the idle pool, specifically to prevent cross-tenant contamination on the NEXT acquire."
    - "src/api/tenant_context.zig:23-26 — tenant_context storage is `threadlocal`. tests/integration/iss0129_migration_run_advisory_lock_test.zig's makePool() (line 64-72) calls `bpm.api_tenant_context.set(DEFAULT_TENANT_ID)` on the MAIN test thread, but RT-1/RT-2 spawn worker threads via std.Thread.spawn (lines 262-267, 370-377, 424-431) to run provisionTenantSchema — those worker threads start with a FRESH threadlocal block (_has_value=false), so `applyRequestStorageRouting` takes the no-tenant branch (SET search_path TO public) on every pool.acquire() executed from a worker thread, including the ones inside provisionTenantSchema's steps 2/4/6/6a and runForSchema's own acquire. This is harmless today because those steps are all public.-qualified and runForSchema immediately re-sets search_path explicitly (line 126) before touching anything unqualified — but it means the ONLY thing preventing migration 008's CREATE TABLE from landing in `public` is that one explicit SET at line 126, holding on one connection, for one function's lifetime."
    - "migrations/008_identity.sql:8,31,41,52,69,79,89,106,127 — CREATE TABLE IF NOT EXISTS users/roles/role_permissions/user_roles/groups/user_groups/group_roles/sessions/api_tokens, all fully unqualified (no schema prefix), all default classification .all_schemas (no scope header, no GBL- prefix) per migrationOrder()/migrationScope() in src/db/migrations.zig:529-592 — so 008 legitimately runs in EVERY tenant pass, resolving through search_path."
    - "migrations/GBL-112_tnt01_drop_legacy_public_business_tables.sql:65,61 — DROP TABLE IF EXISTS public.users CASCADE / public.user_roles CASCADE, migrationOrder()==1112 (GBL- prefix, +1000 offset), applied only in the public pass (migrationScope()==.public_only via the GBL- prefix). Confirms the issue's premise: after this migration runs, public.users/public.user_roles no longer exist, so any tenant-pass CREATE TABLE that accidentally lands in `public` due to stale search_path would itself succeed (CREATE TABLE IF NOT EXISTS doesn't fail on the table not existing) but every SUBSEQUENT tenant-scoped migration that expects `users`/`user_roles` already present in the CORRECT tenant schema would then fail with C42P01, matching the reported symptom."
    - "No migration file contains an executable `SET search_path` statement — grep confirms the only two hits (migrations/1107, migrations/1135) are prose comments, not SQL. Ruled out as a contributing factor: no migration body can silently override runForSchema's search_path via a COMMITted SET."
    - "src/db/provisioning.zig:83-116 (GH #424 / ISS-0131 fix, commit 9512c69, merged to main 2026-08-07T05:09:54Z) — wraps the entire provisionTenantSchema() body in a session-scoped pg_advisory_lock keyed by tenant_id, acquired and released on its OWN short-lived connection (acquired/released before the idempotency check). This does not touch search_path directly but serializes all of provisionTenantSchema's internal acquire/release cycles into a single ordered pass per tenant, which is the most plausible explanation for why the originally-reported race is no longer observable: any interleaving where a partially-through-provisioning connection's search_path was visible to a concurrent second caller for the SAME tenant is now impossible, and RT-1/RT-2 provision DIFFERENT tenants so were never blocked by this lock in the first place, but the surrounding acquire/release traffic pattern the two threads produce against the shared 5-connection pool changed as a side effect of GH #424 landing."

