duplicate_resolution:
  question: Does GH #515 (ISS-0182) duplicate GH #479 (ISS-0158)?
  answer: >-
    Partially, and the overlap was resolved by fixing rather than by
    reclassifying. Both were filed against the same 13 failing blocks of the
    same file. #515 attributed them to two causes: wall-clock backoff assertions
    and leaked allocations in "HTTP-adapter tests". The leak half was correct in
    symptom but wrong in attribution — the leaks were in production
    (src/effects/worker.zig deliverSpec, four paths in
    src/engine/transition.zig) and in the test's duplicated teardown helpers,
    not in the adapter tests themselves. Those are now fixed under this run, so
    that half of #515 is closed by this work. The wall-clock half of #515
    (TC-EXP-301-05) is a real and still-open distinct cause, carried forward as
    ISS-0186 / a new GitHub issue so #515 can be closed without losing it.

remaining_failures_forwarded:
  - block: "TC-EXP-301-05: backoff schedule follows expected intervals"
    cause: >-
      Asserts on a measured wall-clock delta between two next_attempt_at reads
      with a +/-500ms tolerance. Not a stable property while ~20 test binaries
      contend for one database. This is the surviving half of ISS-0182/#515.
    disposition: forwarded as its own issue
  - block: "TC-EXP-301-08: duplicate EFFECT_EMITTED events ... deduplicated"
    cause: >-
      PoolError.ExhaustedPool at src/db/pool.zig:783 via store.append's
      duplicate-lookup path (store.zig:428), which acquires a SECOND pool
      connection while the first is still held. Deadlocks against a small pool
      under parallel test execution. Distinct from anything in this issue.
    disposition: forwarded as its own issue
  - block: "TC-EXP-301-09: email adapter returns 200 (stub, no SMTP)"
    cause: >-
      Panics on `rows.rows[0][1].?` — the row exists but the column is NULL, so
      the test's own unwrap is unguarded. Needs a decision on what the email
      stub should record in that column before the assertion can be written
      correctly.
    disposition: forwarded as its own issue

