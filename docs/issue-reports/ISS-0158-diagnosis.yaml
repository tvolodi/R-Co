prevention:
  - >-
    A struct crossing a module boundary must have uniform field ownership. If
    one field is borrowed and the rest are owned, no caller can free it
    correctly — RC-1 was exactly this and it segfaulted rather than leaked.
  - >-
    Test files must not hand-copy engine teardown helpers. RC-5 shows the copy
    silently drifts and then under-frees, and the resulting leak gets blamed on
    the production code whose frame appears in the allocator's stack trace.
    transition.zig exports freeInstanceState and freeTransitionResult as pub —
    call them.
  - >-
    RC-3 would have been caught immediately by any test that exercised effect
    re-entry against a real database. It survived because the file had never
    compiled; a NOT NULL column omitted from an INSERT is not something review
    reliably catches.
