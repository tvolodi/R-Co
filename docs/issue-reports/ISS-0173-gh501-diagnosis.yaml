findings:
- id: MUST-1
  severity: BLOCKER
  site: src/oidc/jwks.zig:322
  snippet: 'var cache_mutex: std.Thread.Mutex = .{};'
  error_message: 'error: root source file struct ''Thread'' has no member named ''Mutex'''
  root_cause_class: ZIG_0_16_API_REMOVED
  fix_direction: 'std.Thread.Mutex was removed in Zig 0.16. Two viable replacements. (a) std.Io.Mutex -- lock/unlock take an Io parameter (pub fn lock(m: *Mutex, io: Io) and pub fn unlock(m: *Mutex, io: Io)). Every lock/unlock call site must thread an Io through; there is no static cache_mutex any more. (b) Refactor to use the new Io-based pattern (recommended given the rest of this codebase already uses std.Io). Simplest minimal-change fix is (a) IF a static Io instance is available at module-init time. If not, the design must change (the module-level cache_mutex must become an instance field threaded through every wrapper). The CODE-DESIGNER step decides which.'
- id: MUST-2
  severity: BLOCKER
  site: src/oidc/jwks.zig:140
  snippet: var to_remove = std.ArrayList(TokenCacheKey).init(self.allocator);
  error_message: 'error: struct ''array_list.Aligned(jwks.TokenCacheKey,null)'' has no member named ''init'''
  root_cause_class: ZIG_0_16_API_FORM
  fix_direction: 'std.ArrayList(T) in 0.16 returns the UNMANAGED form. The new initialiser is std.ArrayList(T).empty (per the Zig 0.16 stdlib doc). Migrate every ArrayList init call site to .empty and thread allocator to every append/deinit site. The compiler''s ''has no member named init'' message is misleading: the unmanaged form actually DOES have init(gpa) -- but in 0.16 it is documented as the empty-list initialiser on the MANAGED form (now reached via std.ArrayListManaged(T) or std.array_list.Managed(T)). The ArrayList(T) factory returns Aligned(T, null) which is the unmanaged variant. Verify the exact migration path by reading lib/std/array_list.zig in the installed Zig 0.16 toolchain.'
- id: MUST-3
