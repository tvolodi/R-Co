fix_plan:
  goal: Make zig build and zig build test-oidc-src RED on feature/WF03-GH501-20260808 until this diagnosis's findings are addressed, then GREEN once they are.
  step_1_wire_the_file_into_a_real_compilation:
    rationale: 'A file not compiled by any target cannot be fixed by editing the file -- the build is green because the build is not looking. The fix MUST start by re-wiring the file into a target that compiles it, then running that target to see the RED, then applying the fixes, then re-running to see GREEN. This is the ISS-0172 / GH-500 deliberate-mutation procedure inverted: instead of ''break it to prove the test doesn''t catch breakage'', it is ''wire it to prove the test catches breakage (because the file already IS broken)''.'
    actions:
    - Add pub const jwks = @import('oidc/jwks.zig'); to src/oidc_test_root.zig
    - Add std.testing.refAllDecls(jwks); AND try jwks.initCache(std.testing.allocator); defer jwks.deinitCache(); inside the test block of src/oidc_test_root.zig
    - Run zig build test-oidc-src -- expect RED with the 5 errors above
    - Capture the RED output as evidence the file is now being compiled
  step_2_fix_the_arraylist_sites:
    rationale: 'The four ArrayList findings (MUST-2..MUST-5) are mechanical migrations: .init(allocator) -> .empty, .deinit() -> .deinit(allocator), .append(item) -> .append(allocator, item). swapRemove and pop are unchanged.'
    actions:
    - jwks.zig:140 var to_remove = std.ArrayList(TokenCacheKey).empty;
    - jwks.zig:148 defer to_remove.deinit(self.allocator);
    - jwks.zig:144 to_remove.append(self.allocator, .{ ... }) catch continue;
    - jwks.zig:164 var to_remove = std.ArrayList(TokenCacheKey).empty;
    - jwks.zig:168 to_remove.append(self.allocator, .{ ... }) catch continue;
    - jwks.zig:172 defer to_remove.deinit(self.allocator);
    - jwks.zig:239 .entries = std.ArrayList(DenylistEntry).empty,
    - jwks.zig:247 keep for-loop body
    - jwks.zig:248 self.entries.deinit(self.allocator);
    - jwks.zig:265 try self.entries.append(self.allocator, .{ ... });
    - jwks.zig:194 try list.append(self.allocator, .{ ... });
  step_3_fix_the_mutex:
    rationale: 'This is the only NON-mechanical fix. std.Thread.Mutex is gone and its replacement requires an Io parameter at every call site. The CODE-DESIGNER step must choose between. (a) Refactor to use std.Io.Mutex, threading an Io instance through every public wrapper (initCache, deinitCache, checkCache, putCache, isRevoked, revokeToken, revokeRealmTokens, evictExpired). (b) Remove thread-safety from this file -- REJECTED because ISS-402 / #198 requires it. Recommend (a). The implementation choice is the CODE-DESIGNER''s call.'
    actions:
    - 'Replace var cache_mutex: std.Thread.Mutex = .{}; with the appropriate Io.Mutex-equivalent pattern (likely a per-instance mutex held inside TokenValidationCache and JtiDenylist)'
    - Update every cache_mutex.lock(); defer cache_mutex.unlock(); call site to thread the Io through
    - Re-run zig build test-oidc-src -- expect GREEN
  step_4_resolve_the_orphan_decision:
    rationale: MUST-8 asks whether the file should exist at all. Compare src/oidc/jwks.zig's public surface against src/identity/provider/oidc/jwks_cache.zig's public surface. If they cover the same functionality, the orphan should be deleted. If they are complementary, the file should be renamed (SHOULD-1) and wired through a real caller.
    actions:
    - CODE-DESIGNER compares public surfaces and reports the decision in the design artefact
    - 'If DELETE: remove src/main.zig:78 and src/oidc/jwks.zig, remove the wiring from src/oidc_test_root.zig, verify zig build stays GREEN'
    - 'If RENAME: move file to src/oidc/token_cache.zig, update src/main.zig:78, update the test root import'
  step_5_regression_tests:
    rationale: Per ISS-0172's acceptance criterion, the fix must be verified by deliberate mutation. Inject a deliberate statement error inside one jwks.zig function body (e.g. initCache) and confirm the target goes RED. Then revert the mutation and confirm GREEN.
    actions:
    - 'Inject const _x: u32 = ''not an int''; inside initCache'
    - Run zig build test-oidc-src -- expect RED with the type error
    - Revert
    - Capture both runs in the step-03 handoff as evidence
    - 'Also: capture the original zig test src/oidc/jwks.zig RED output (already in scratch/_jwks_direct_test.log) as evidence the file is now genuinely compiled'
  step_6_census_run:
    rationale: 'Per SHOULD-2 / ISS-0172 acceptance criterion #5, run a census of every pub const X = @import(...) in src/main.zig (and any sibling file like src/bpm.zig if it exists) and report modules with zero reachable callers. Each is a candidate ISS-0172 blind spot in a different subsystem.'
    actions:
    - Add a tools/lint_dead_reexports.py (or extend tools/lint_test_wiring.py) to detect the pattern
