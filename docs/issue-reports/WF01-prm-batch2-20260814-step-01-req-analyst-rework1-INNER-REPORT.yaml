summary: >-
  WF-01 Step 1 rework iteration 1 — REQ-ANALYST fixed all three substantive defects
  the REQ-VALIDATOR flagged at step-02 (1 BLOCKER + 2 MAJOR) and absorbed the 3 MINOR
  TRACEABILITY gaps into the same edits.

  BLOCKER (PRM-04): added the seventh permitted edge `applied → superseded` to the
  review state machine (now exactly seven edges, all enumerated explicitly). Clarified
  the relationship between the DB CHECK constraint (constrains the value domain of
  `status`) and the application-layer edge enforcement (rejects out-of-edge transitions
  with HTTP 400 `InvalidReviewTransition`), and noted the optional `BEFORE UPDATE`
  trigger path. Added the missing AC covering the rollback path: "GIVEN a review in
  `applied`, WHEN a rollback event moves the active version pointer off the applied
  version (PRM-08), THEN `status` moves `applied` to `superseded` with `superseded_by`
  naming the rollback event." Updated **See:** list to include PRM-01 (the RELEASED
  requirement that produces the plan whose digest PRM-04 persists). This now aligns
  PRM-04 with RELEASED PRM-08 AC4 and the shipped rollback implementation
  (`src/definition/rollback.zig:289-291`).

  MAJOR (PRM-03): reconciled the plan_digest input shape with RELEASED PRM-01's
  emitted shape. Changed `{type, id, changes}` (undefined) to
  `{type, id, change_kind, before, after}` (PRM-01's emitted shape) and added the
  cross-reference "(the entry shape emitted by RELEASED PRM-01 and persisted verbatim
  on the review row)". Added PRM-01 to **See:** list (it was already present, but the
  rework explicitly preserves it for traceability).

  MAJOR (PRM-05): defined the `NEEDS_REVIEW` package as a concrete JSON object
  `{marker: "NEEDS_REVIEW", assertions: [ {id, description, severity, rule, sources:
  [{file, line}]} ]}`. `marker` is the constant string `"NEEDS_REVIEW"`; `assertions`
  is the array of `HumanReviewAssertion` records the source-side authoring agent
  attached at submit time. AC5 now states the shape, the literal marker value, and
  the empty-array convention. Added the Glossary entry to
  docs/BPM_Platform_Functional_Requirements.md (row 37) explicitly distinguishing the
  promotion `NEEDS_REVIEW` package from AGT-06's `needs_review` artifact STATE (a row
  state in a different subsystem). Added PRM-01 and PRM-02 to **See:** list (TRACEABILITY
  MINORs absorbed).

  Cross-doc mirrors in docs/processes/system/definition-promotion.md:
    - Step 3 row (line 55): entry shape `{type, id, change_kind, before, after}`.
    - Step 5 row (line 57): digest input shape `{type, id, change_kind, before, after}`.
    - Step 7 row (line 59): `NEEDS_REVIEW` package shape documented inline.
    - Business Rules table row (line 89): seventh edge `applied -> superseded` added.
