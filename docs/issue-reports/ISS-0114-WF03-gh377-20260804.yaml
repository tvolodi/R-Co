# -----------------------------------------------------------------------------
# Summary
# -----------------------------------------------------------------------------
summary: >-
  Root cause is a routing bug in src/db/pool.zig::applyRequestStorageRouting
  (line 173 approx). The storage_mode cache is resolved by querying
  public.tenant.storage_mode for the current tenant_id. For tenants that
  were JUST provisioned via bpm_provision_tenant_schema() — or for any tenant
  whose ID was created by the integration test (random UUID) — NO row exists in
  public.tenant. The resolver therefore falls through to the default
  .LEGACY_RLS branch and issues SET search_path TO public instead of
  SET search_path TO tenant_<uuid>,public. The result is that every test in
  TC-TNT-02-02, TC-TNT-03-01, TC-TNT-03-03, TC-TNT-03-05 sees
  search_path = 'public' and any unqualified business-table query
  (SELECT COUNT(*) FROM events) either resolves to the public.events shadow
  (if present) or fails with C42P01 (relation "events" does not exist).
  Category F (shared db_test baseline drift, #359-derived) is a secondary
  contributing factor that surfaces the C23505 unique-violation on
  schema_migrations_schema_version_uq in some runs, but is NOT the dominant
  cause for the seven TC-TNT-* / TC-DB-03-01 cases tracked under ISS-0114.

# -----------------------------------------------------------------------------
# Distinct from ISS-0112
# -----------------------------------------------------------------------------
distinct_from_iss0112: >-
  ISS-0112 (WF03-gh375-20260804, RESOLVED) addressed the migration-ledger
  drift in public.schema_migrations via migration 1134_iss0112_add_* and
  target-call-site hardening. ISS-0114 is a per-connection search_path and
  per-tenant provisioning routing defect. The two issues share the same
  evidence surface (db_test contamination) but live at different layers:
  ISS-0112 was a schema-baseline drift; ISS-0114 is a connection-routing
  logic defect that materialises whenever the integration test creates a
  brand-new tenant that has no row in public.tenant.

# -----------------------------------------------------------------------------
# Root cause
# -----------------------------------------------------------------------------
root_cause:
  type: storage_mode-resolver-falls-back-to-legacy-rls
  location: src/db/pool.zig
  function: applyRequestStorageRouting
  lines: '173-208'
  details: >-
    When applyRequestStorageRouting is called with a tenant_id for which
    no row exists in public.tenant, the resolveAndCacheStorageMode block
    (approx lines 183-208) executes the SELECT and produces a null result
    (no row). The default branch executes
    tenant_context_mod.setStorageMode(.LEGACY_RLS). From that point
    onward, the THREADLOCAL cache _storage_mode = .LEGACY_RLS is sticky
    for the entire test thread. The LEGACY_RLS branch (line 218 approx)
    then issues SET search_path TO public, ignoring the per-tenant schema
    name that schemaNameForTenant(tenant_id) would have produced.
  mechanism: >-
    1. Test calls bpm.api_tenant_context.set(tenant_id) for a freshly
       minted UUID.
    2. set(tenant_id) correctly clears _storage_mode_resolved = false.
    3. Test calls pool.acquire().
    4. acquire() invokes applyRequestStorageRouting(conn).
    5. hasStorageMode() returns false, enters resolveAndCacheStorageMode.
    6. Connection runs SELECT storage_mode FROM public.tenant WHERE
       id = $1::uuid with the freshly-provisioned tenant_id.
    7. The query returns 0 rows (provisioning only inserts into
       public.tenant_schemas, NOT public.tenant).
    8. Control flows to the bottom of the block and calls
       tenant_context_mod.setStorageMode(.LEGACY_RLS).
    9. The acquired connection SET search_path TO public executes.
    10. The test SHOW search_path assertion reads public (not
        tenant_<uuid>,public).
    11. The test unqualified SELECT COUNT(*) FROM events resolves to
        either the public.events shadow (often present from #359 leakage)
        or fails with C42P01 relation does not exist.
  why_previous_sessions_missed_it: >-
    ISS-0112 fix addressed the schema_migrations ledger drift but did not
    touch the pool-routing layer. The pool applyRequestStorageRouting was
    introduced in the SPT-01 / ISS-501 work and was reviewed for the
    SCHEMA branch (where public.tenant.storage_mode = 'SCHEMA' resolves
    correctly). The fallback path (no row in public.tenant for a freshly
    provisioned tenant) was considered acceptable because production tenants
    always have a public.tenant row. Integration tests, however, generate
    fresh UUIDs and never create a public.tenant row before checking
    out connections, so they live in the fallback branch.
  evidence_lines:
    - file: src/db/pool.zig
      lines: '173-208'
      finding: >-
        resolveAndCacheStorageMode defaults to LEGACY_RLS on null result.
    - file: src/db/pool.zig
      lines: '218-220'
      finding: >-
        LEGACY_RLS branch unconditionally sets search_path TO public.
    - file: migrations/060_schema_per_tenant_bootstrap.sql
      lines: '70-100'
      finding: >-
        bpm_provision_tenant_schema() inserts into public.tenant_schemas
        but never into public.tenant.
    - file: src/db/provisioning.zig
      lines: '55-65'
      finding: >-
        provisionTenantSchema() executes idempotency check then
        bpm_provision_tenant_schema() — no insert into public.tenant.
    - file: scratch/WF03-gh364-20260801-step03e/_integration_final.log
      lines: '6384-6503'
      finding: >-
        TC-TNT-02-02 reports expected search_path to contain tenant-uuid,
        got public.
    - file: scratch/WF03-gh364-20260801-step03e/_integration_final.log
      lines: '8713-8728'
      finding: >-
        TC-TNT-01-03 cross-tenant isolation reports C42P01 relation events
        does not exist on tenant-A.events insert.
    - file: scratch/WF03-gh364-20260801-step03e/_integration_final.log
      lines: '38774-38872'
      finding: >-
        TC-DB-03-01 reports C42P01 relation instance_projections does not
        exist — the connection search_path is public but the table lives
        in tenant_default.

