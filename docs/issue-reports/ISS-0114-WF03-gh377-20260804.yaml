# -----------------------------------------------------------------------------
# Proposed resolution strategy
# -----------------------------------------------------------------------------
resolution_strategy:
  summary: >-
    Three-layer fix: (a) make applyRequestStorageRouting smarter about the
    no-public.tenant-row case, (b) make provisionTenantSchema promote the
    tenant to public.tenant with storage_mode=SCHEMA immediately on
    provisioning, (c) add a regression migration that backfills existing
    tenants (tenant_schemas row but no public.tenant row) and a regression
    test per impacted TC.
  approach:
    step_1: >-
      Fix the resolver fallback in src/db/pool.zig::applyRequestStorageRouting.
      When SELECT storage_mode FROM public.tenant WHERE id = $1::uuid returns
      0 rows, issue a follow-up SELECT 1 FROM public.tenant_schemas WHERE
      tenant_id = $1::uuid and if THAT returns a row, treat the tenant as
      SCHEMA-mode (because tenant_schemas row means the schema is provisioned).
      Only fall back to LEGACY_RLS when both queries return 0 rows. This makes
      the routing robust to integration test fixtures while preserving
      production semantics.
    step_2: >-
      Promote provisionTenantSchema to insert a public.tenant row with
      storage_mode=SCHEMA (idempotent) immediately after the SQL
      bpm_provision_tenant_schema() call. This is the authoritative path;
      the resolver change in step 1 is a defensive fallback.
    step_3: >-
      Add a migration that backfills public.tenant for all tenants that have
      a tenant_schemas row but no public.tenant row, setting
      storage_mode=SCHEMA. This handles the on-disk state with a one-shot
      reconciliation so that even old integration databases (db_test from
      #359 era) become consistent.
    step_4: >-
      Add explicit clear() calls in test fixture setup to avoid the
      threadlocal storage_mode cache carrying state across tests in the same
      binary. This is a defense-in-depth measure on top of step 1.
    step_5: >-
      Add SHOW search_path + expectation in runForSchema as a post-condition
      assertion. Failing the migration early with SchemaSetupFailed is
      preferable to letting the test discover the wrong search_path further
      down the stack.
  regression_tests:
    - file: tests/integration/tnt_schema_isolation_test.zig
      it: 'regression: ISS-0114 — provisionTenantSchema then pool.acquire sets tenant_<uuid> in search_path'
      target: 'TC-TNT-02-02, TC-TNT-03-01, TC-TNT-03-05'
    - file: tests/integration/tnt_schema_isolation_test.zig
      it: 'regression: ISS-0114 — two concurrent connections for different tenants have independent search_paths'
      target: 'TC-TNT-03-03'
    - file: tests/integration/tnt_schema_isolation_test.zig
      it: 'regression: ISS-0114 — cross-tenant isolation, fresh UUID with no public.tenant row'
      target: 'TC-TNT-01-03'
    - file: tests/integration/db_integration_test.zig
      it: 'regression: ISS-0114 — store.append() atomic write with default-tenant context'
      target: 'TC-DB-03-01'

