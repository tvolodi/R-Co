affected_source_files:
  - file: src/db/pool.zig
    function: applyRequestStorageRouting
    lines: '173-260'
    change: >-
      Treat absence of public.tenant row as a signal that the tenant storage_mode
      SHOULD be SCHEMA (rather than defaulting to LEGACY_RLS). The integration
      tests and the bpm_provision_tenant_schema() flow both rely on the tenant
      schema being present immediately after provisioning, even when no
      public.tenant row exists yet. The fallback path should:
        - If the tenant has a tenant_schemas row, trust SCHEMA mode.
        - If the tenant has neither public.tenant NOR tenant_schemas row,
          fall back to LEGACY_RLS (truly unknown tenant).
      Also: explicitly accept the tenant freshly provisioned case by re-querying
      storage_mode after detecting a tenant_schemas row and the absence of a
      public.tenant row.
  - file: src/db/pool.zig
    function: schemaNameForTenant
    lines: '130-160'
    change: >-
      No semantic change required. The function correctly derives
      tenant_<uuid> for non-empty, non-all-zeros tenant IDs. The bug is
      upstream — the routing layer never reaches the SCHEMA branch for
      newly-provisioned tenants.
  - file: src/db/provisioning.zig
    function: provisionTenantSchema
    lines: '44-145'
    change: >-
      Two changes work together:
        1. After bpm_provision_tenant_schema() succeeds, INSERT a
           public.tenant row with storage_mode=SCHEMA if one does not
           already exist (idempotent ON CONFLICT DO NOTHING).
        2. Ensure tenant_context_mod.setStorageMode(.SCHEMA) is called
           BEFORE the function returns, so subsequent pool.acquire()s in
           the same thread receive the correct routing mode.
      This guarantees the integration test path (which immediately calls
      pool.acquire() for the provisioned tenant) does not rely on the
      heuristic fallback in applyRequestStorageRouting.
  - file: src/db/migrations.zig
    function: runForSchema
    lines: '78-100'
    change: >-
      Reinforce the existing SET search_path TO <schema_name>,public
      statement with a verification query (SHOW search_path) and return
      MigrationError.SchemaSetupFailed if the post-condition is not met.
      This guards against any future regression that causes
      applyRequestStorageRouting LEGACY_RLS fallback to overwrite the
      migration runner search_path.
  - file: tests/integration/tnt_schema_isolation_test.zig
    function: makePool
    lines: '60-70'
    change: >-
      After Pool.init, explicitly call
      bpm.api_tenant_context.set("00000000-0000-0000-0000-000000000000")
      followed by bpm.api_tenant_context.clear() to reset the threadlocal
      storage_mode cache. This prevents sticky state from prior test
      contamination (the default all-zeros UUID lookup currently poisons
      the cache for the rest of the test thread).

