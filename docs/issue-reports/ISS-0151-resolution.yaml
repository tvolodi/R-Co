# ---------------------------------------------------------------------------
# Prevention
# ---------------------------------------------------------------------------
prevention:
  - >-
    An unlock with no matching lock is a mechanical, cheap-to-detect defect that
    survived three months and at least nine downstream investigations. Add a linter
    rule asserting pg_advisory_lock / pg_advisory_unlock key pairs balance within a file.
  - >-
    "Remove the lock and rely on idempotency" is valid only if the guarded operation is
    actually idempotent under concurrency. Migrations.runForSchema is check-then-apply
    and documents its own race. Removing a lock must cite the specific mechanism that
    makes the operation safe without it.
  - >-
    GH-402 removed a lock to fix a hang whose real cause (lock_timeout cancelling the
    acquire, ISS-0110) was already diagnosed elsewhere in the same repo. Treating the
    synchronisation primitive as the bug because it is where the symptom surfaces is the
    anti-pattern; the correct move was the lock_timeout bracket, not deletion.
  - >-
    Never judge a multi-binary build step by "N/N tests passed" text - the pass-count
    line can come from the binary that did not fail. Judge by exit code only.
  - >-
    When a step runs multiple binaries concurrently, map the .zig-cache hash in the
    failed-command line to its source file via the PDB before theorising about cause.

