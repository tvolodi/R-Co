# ---------------------------------------------------------------------------
# Two corrections carried into this pass, both confirmed by measurement
# ---------------------------------------------------------------------------
corrections_to_prior_diagnosis:
  - claim: "23505 on schema_migrations_schema_version_uq is the root cause"
    verdict: REFUTED
    evidence: >-
      The 23505 is emitted by TC-TNT-02-05 (tnt_schema_isolation_test.zig:770-796),
      which deliberately inserts a duplicate (schema_name, version) pair and asserts
      it MUST error. Post-fix it still occurs exactly once per run, unchanged, across
      all five runs that exit 0. A signature that is constant across both failing and
      passing runs cannot be the discriminating cause.
  - claim: "ISS-0148's blocking advisory-locked sweep causes the hang"
    verdict: REFUTED
    evidence: >-
      pg_locks and pg_stat_activity sampling during live hangs showed zero ungranted
      locks and zero advisory locks held. Nothing was waiting on a lock. The advisory
      locks were absent from the process entirely - because they had been deleted from
      the source, not because they were contended.

# ---------------------------------------------------------------------------
# Root cause
# ---------------------------------------------------------------------------
root_cause:
  summary: >-
    Commit db362fd (GH-402, 2026-08-03) deleted all three pg_advisory_lock acquires
    from tests/integration/helpers.zig but left the matching pg_advisory_unlock in
    TestHarness.init() in place. Since then the harness has been releasing a lock
    nobody takes, and every concurrent integration test binary has run its migration
    check-and-apply completely unguarded.

  deleted_acquires:
    - site: "runMigrations()"
      key: "hashtext('bpm_test_migrations_public')"
      guarded: "public schema migration check-and-apply pass"
    - site: "runMigrationsForSchema()"
      key: "hashtext($1)  # per schema name"
      guarded: "tenant-schema non-idempotent inline CONSTRAINT/index DDL"
    - site: "TestHarness.init() (the ISS-0107 widened acquire)"
      key: "hashtext('bpm_test_migrations_public')"
      guarded: "configureTestSearchPath + resetTestData + ensureDefaultOidcSeeds"

  orphaned_unlock:
    file: tests/integration/helpers.zig
    detail: >-
      The pg_advisory_unlock survived the deletion, as did the entire ISS-0107 comment
      block that describes in detail the lock bracket that had been removed from
      underneath it. The comment documented a lock that no longer existed.

  why_the_stated_rationale_was_wrong: >-
    db362fd justified removal with "rely on migration idempotency". src/db/migrations.zig
    refutes this in its own ISS-0144 comment: Migrations.run/runForSchema perform
    check-then-apply against an `applied` set read BEFORE the per-file transaction
    begins. Two binaries can both observe a migration file as unapplied; the loser then
    executes DDL against a schema a peer is concurrently building. The per-file
    pg_advisory_xact_lock inside migrations.zig serialises the two transactions relative
    to each other but does not un-stale the first caller's read - which is precisely why
    the harness-level lock existed as well.

  why_this_step_specifically: >-
    zig build test-integration-tnt depends on TWO run artifacts
    (tnt_schema_isolation_test.zig and tnt_backfill_export_cleanup_test.zig). Zig's
    build runner schedules independent sibling steps concurrently, and both binaries
    bootstrap through helpers.zig against the shared public and tenant_default schemas.
    Each binary is 4/4 green when run alone; the failure requires the concurrency.

# ---------------------------------------------------------------------------
# How the two observed symptoms map onto the one cause
# ---------------------------------------------------------------------------
symptom_attribution:
  - symptom: "error: test runner failed to respond for ~1m"
    failing_binary: tests/integration/tnt_backfill_export_cleanup_test.zig
    classification: binary timeout (NOT an assertion failure, NOT a build-step timeout)
    mechanism: >-
      The binary sat behind a peer's uncoordinated shared-schema DDL until the build
      runner's own no-response timeout fired.
  - symptom: '42P01 relation "events_archive"/"events"/"instance_projections" does not exist'
    failing_binary: tests/integration/tnt_schema_isolation_test.zig
    classification: assertion failure
    raised_from: "Migrations.runForSchema <- provisionTenantSchema"
    mechanism: >-
      A migration executing against a schema whose tables a concurrent unguarded peer
      was still creating or had just rebuilt.

  reading_the_output_warning: >-
    In the failing runs the line "19/19 tests passed" and the non-zero exit came from
    DIFFERENT binaries. The pass-count text belonged to tnt_schema_isolation_test while
    tnt_backfill_export_cleanup_test was the one that timed out. Judging this step by
    pass-count text rather than exit code misreports it as green. Binaries were
    identified by mapping the .zig-cache hash in the failed-command line to its source
    file via the PDB debug info.

# ---------------------------------------------------------------------------
# Fix
# ---------------------------------------------------------------------------
fix:
  files_changed:
    - tests/integration/helpers.zig
  description: >-
    Restored all three deleted pg_advisory_lock acquires, each bracketed with the
    proven ISS-0107-rework-1 lock_timeout pattern (SET lock_timeout='90s' / acquire /
    SET lock_timeout='5s'), with release via defer so no error path can leak the lock.

  scope_decision_per_schema_lock: >-
    In runMigrationsForSchema() the lock is taken BEFORE the already-migrated fast path,
    not after it. That fast path reads public.tenant_schemas and public.schema_migrations
    to decide whether to skip the apply entirely - it IS the check half of the
    check-then-apply race, so leaving it outside the lock would let two binaries both
    decide to apply. The key is hashtext(schema), so binaries provisioning different
    tenant schemas still run in parallel; only same-schema work serialises. The commonly
    contended schema is tenant_default, which every binary provisions.

  why_this_does_not_reintroduce_the_gh402_hang: >-
    The hang GH-402 reacted to was never the lock itself. ISS-0110 had already diagnosed
    it: the ambient lock_timeout='5s' set by configureSessionTimeouts() was cancelling
    the acquire statement with 55P03 once enough of the ~19+ concurrent binaries queued
    behind it. The 90s bracket is the established fix for exactly that, and was already
    in use at one of the three acquire sites before db362fd removed it wholesale. The
    wait is bounded, not unbounded.

  interaction_with_ISS_0148:
    ordering_edge_addIntegrationRun: UNCHANGED
    advisory_locked_sweep_clean_test_db: UNCHANGED
    sweep_name_pattern: UNCHANGED (not narrowed)
    explanation: >-
      ISS-0148 serialises the clean_test_db sweep against test binaries at the BUILD
      GRAPH level and makes the sweep itself atomic. ISS-0151 is a different layer: it
      serialises the test binaries against EACH OTHER at the harness level. The two are
      complementary and neither weakens the other. ISS-0148's target signature was
      re-verified at 0 occurrences post-fix.

  constraints_honoured:
    - "No test weakened, skipped, or deleted"
    - "No retry or sleep added to any test"
    - "No timeout raised to hide a hang - the hang's cause was found and removed"
    - "Sweep name pattern not narrowed"
    - "No retry on 42P01 / 23505"
    - "Pass/fail judged by exit code only"

