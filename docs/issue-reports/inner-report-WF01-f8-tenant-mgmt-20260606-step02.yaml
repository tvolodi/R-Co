issues:
  - id: WF01-f8-VAL-01
    severity: MINOR
    requirement_ids: [TM-04, TM-05]
    description: >
      TM-04 and TM-05 both involve Keycloak adapter calls (disable/re-enable realm users)
      but neither references OIDC-19 (Provisioning audit), which mandates that all adapter
      calls be recorded in the platform audit log. There is no acceptance criterion requiring
      that deactivation/reactivation operations appear in the audit log. This is not a
      contradiction (the requirements do not prohibit auditing), but explicit coverage
      would improve traceability.
    recommendation: >
      Add OIDC-19 to the See: block of TM-04 and TM-05, and add an AC to each:
      "GIVEN a successful deactivation/reactivation, WHEN the audit log is queried,
      THEN an audit entry recording the actor, operation, and outcome is present."

  - id: WF01-f8-VAL-02
    severity: MINOR
    requirement_ids: [TM-04]
    description: >
      TM-04 specifies two backend operations: (1) set public.tenant status to 'inactive'
      and (2) disable all Keycloak realm users. No acceptance criterion addresses partial
      failure (e.g. DB write succeeds but Keycloak call fails). The requirement does not
      contradict OIDC-18 (which is scoped to provisioning endpoints), but the absence of
      an explicit error-handling AC leaves ambiguity for BACKEND-DEV implementation.
    recommendation: >
      Add an AC: "GIVEN the Keycloak user-disable step fails during deactivation, WHEN
      the error occurs, THEN the tenant status in public.tenant is NOT changed and the
      endpoint returns an appropriate error response to the caller."

verdict: PASS
