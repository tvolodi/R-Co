summary: >
  Produced the WF-03 Step 2 Type E prose fix design for the residual-29 T010
  hardcoded-UUID migration tracked by GH #402. The design re-uses the existing
  TestHarness.newUuid (helpers.zig:467) and TestHarness.newUuidString
  (helpers.zig:479) API verbatim — no new helper, no wrapper, no new module.
  The 29 affected files are split into four BACKEND-DEV-friendly batches of
  roughly equal size (8/8/8/5 files; 27/79/53/9 active T010 literals) with
  explicit per-batch file sets, four per-file replacement patterns (P1-P4),
  four validation gates per batch (G1 lint, G2 zig build test, G3 focused
  integration, G4 full integration suite), stale-inventory handling rules,
  and a deferred one-line MAJOR→BLOCKER promotion at
  tools/lint_test_isolation.py:84 that is gated on the live lint reporting
  MAJOR < 10 across the entire tests/integration tree after Batch D lands.
  The design is complete enough for BACKEND-DEV Step 3 to apply it
  mechanically — every file in every batch has its replacement pattern
  enumerated and its expected lint delta computed from the live `--json`
  output captured at design time.

