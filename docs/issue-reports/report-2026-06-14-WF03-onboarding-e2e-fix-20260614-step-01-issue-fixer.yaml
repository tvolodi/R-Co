diagnosis:
  category: E
  category_label: "Test code error (test-harness navigation pattern is wrong; source code is correct)"
  is_source_code_bug: false
  is_test_harness_bug: true
  severity: BLOCKER

  root_cause:
    type: test_harness_spa_navigation_race
    summary: |
      The navigateSpa helper in web/tests/e2e/pipeline.ts (lines 171-177) drives SPA
      navigation via window.history.pushState + window.dispatchEvent(new PopStateEvent).
      React Router v6.4+ createBrowserRouter (used in web/src/router.tsx) does not
      deterministically react to a synthetic popstate dispatched in the same microtask
      as the pushState. Three failure modes result:
        1. Target route never renders → waitForSelector('nav'/'form')/getByRole('link',
           {name: /register tenant/i}) time out.
        2. RegisterTenantPage's <Navigate to='/instances'> role guard never fires →
           onb-ui-01:115 redirect assertion fails.
        3. page.evaluate inside navigateSpa returns after the JS context is torn down
           by an in-flight router reconciliation → Playwright 'execution context destroyed'.
      The proven alternative lives in web/tests/e2e/tenants.e2e.spec.ts:74-79: a LOCAL
      navigateSpa that uses page.goto(targetPath, {waitUntil:'domcontentloaded'}) +
      page.waitForURL. The F8 tenant-management E2E suite has been green on this pattern
      for two weeks. Session injection via addInitScript (pipeline.ts:138-165) re-runs on
      every page.goto, so authenticated state survives the navigation.

  evidence:
    - file: web/tests/e2e/pipeline.ts
      lines: 171-177
      quote: |
        export async function navigateSpa(page: Page, targetPath: string): Promise<void> {
          await page.evaluate((nextPath) => {
            window.history.pushState({}, '', nextPath)
            window.dispatchEvent(new PopStateEvent('popstate'))
          }, targetPath)
          await page.waitForURL((url) => `${url.pathname}${url.search}` === targetPath, { timeout: 10_000 })
        }
    - file: web/tests/e2e/tenants.e2e.spec.ts
      lines: 74-79
      quote: |
        async function navigateSpa(page: Page, targetPath: string): Promise<void> {
          // Use page.goto for reliable SPA navigation — addInitScript from loginWithToken
          // restores the session before every page load, so the user stays authenticated.
          await page.goto(targetPath, { waitUntil: 'domcontentloaded' })
          await page.waitForURL((url) => `${url.pathname}${url.search}` === targetPath, {
            timeout: 10_000,
          })
        }
    - file: web/src/components/layout/AppShell.tsx
      lines: 117-121
      note: AppShell renders a bare <nav> element wrapping visibleNav.map(NavLink). No data-testid='nav-sidebar' attribute; tests fall back to the 'nav' selector. This works only if AppShell renders — it does not render when the SPA navigation race loses the route change.
    - file: web/src/components/layout/AppShell.tsx
      line: 28
      note: NAV_ITEMS includes { to: '/admin/onboarding/new', label: 'Register Tenant', roles: ['PLATFORM_ADMIN'] }. The link is present and role-gated correctly for PLATFORM_ADMIN. Not a UI bug.
    - file: web/src/pages/admin/onboarding/RegisterTenantPage.tsx
      lines: 234-235
      quote: |
        if (!session?.roles.includes('PLATFORM_ADMIN')) {
          return <Navigate to="/instances" replace />
        }
      note: Role guard IS present and would redirect a non-platform-admin. The reason onb-ui-01:115 fails is that the component never mounts (navigation race), not that the guard is missing.
    - file: web/src/pages/admin/onboarding/OnboardingProgressPage.tsx
      lines: 107-108
      note: Same role-guard pattern present.
    - file: web/src/pages/admin/onboarding/OnboardingResultPage.tsx
      lines: 137-138
      note: Same role-guard pattern present.
    - file: web/src/auth/ProtectedRoute.tsx
      lines: 8-35
      note: Route-level wrapper only checks isAuthenticated, not roles. Not the cause of these failures but a non-blocking follow-up consideration for CODE-DESIGNER.
    - file: web/src/router.tsx
      lines: 39-67
      note: /admin/onboarding/* routes are children of the '/' route wrapped by <ProtectedRoute>. No per-route role enforcement; relies on per-component <Navigate>.

  symptom_to_root_cause_mapping:
    ADHOC-TNT-TEST-003:
      onb-ui-01:55_nav_sidebar_timeout: navigateSpa (pushState) did not trigger React Router to mount /admin/users under AppShell; nav selector never resolves.
      onb-ui-01:115_role_guard_assertion_failed: RegisterTenantPage never mounted, so the <Navigate> role guard never fired; assertion logic operating on a stuck prior page.
      onb-ui-02:63_register_button_timeout: loginAsAdmin calls navigateSpa(page, '/admin/onboarding/new') then waitForSelector('form'); form never rendered because the route never mounted.
    ADHOC-TNT-TEST-004:
      pipeline.ts:179_execution_context_destroyed: page.evaluate inside navigateSpa ran during an in-flight React Router reconciliation triggered by the synthetic popstate, tearing down the JS context mid-evaluate.
      onb-wizard:91_nav_selector_timeout_on_retry: Same pushState-based navigateSpa unreliability on retry; retry cannot recover because the underlying pattern is broken, not transient.

  files_to_change:
    - web/tests/e2e/pipeline.ts
  files_considered_but_NOT_root_cause:
    - web/src/components/layout/AppShell.tsx
    - web/src/pages/admin/onboarding/RegisterTenantPage.tsx
    - web/src/pages/admin/onboarding/OnboardingProgressPage.tsx
    - web/src/pages/admin/onboarding/OnboardingResultPage.tsx
    - web/src/auth/ProtectedRoute.tsx
    - web/src/router.tsx

recommended_fix_strategy:
  primary_action: |
    Rewrite navigateSpa in web/tests/e2e/pipeline.ts to use
      await page.goto(targetPath, { waitUntil: 'domcontentloaded' })
      await page.waitForURL((url) => `${url.pathname}${url.search}` === targetPath, { timeout: 10_000 })
    mirroring the proven pattern in web/tests/e2e/tenants.e2e.spec.ts:74-79.
  rationale: |
    page.goto forces a full document load that deterministically bootstraps
    React + React Router + AppShell on the target URL. loginWithToken's addInitScript
    re-runs on every page.goto, so authenticated state is preserved automatically.
    The F8 tenant-management suite has been green on this pattern for two weeks.
  secondary_optional_followup: |
    CODE-DESIGNER may want to introduce a role-aware ProtectedRoute variant
    (e.g. <ProtectedRoute requireRole='PLATFORM_ADMIN'>) and wrap /admin/onboarding/*
    routes. Punt to a separate WF-02; do NOT bundle into this WF-03 fix.
  what_NOT_to_do:
    - "Do NOT add data-testid='nav-sidebar' to AppShell.tsx as the primary fix — the 'nav' fallback selector already matches when AppShell renders."
    - "Do NOT change the role guard logic in RegisterTenantPage/Progress/Result — those are correct."
    - "Do NOT raise the test timeouts — the failure is deterministic under the pushState pattern; longer timeouts will not help."
    - "Do NOT add waits/retries around the pushState pattern — it is fundamentally racy."

