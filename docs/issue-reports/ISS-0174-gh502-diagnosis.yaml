    - "`zig build test-lua` exits 0 with 71/71 tests passed."
    - "`zig build test` exits 0."
    - "`tools/verify_test_env.py` exits 0 (full infrastructure healthy — DB + Keycloak up)."
  post_change_validation:
    must_pass:
      - "`zig build test-lua` exits 0 with the migrated `summary()` and the new real-call test."
      - "`zig build test` exits 0."
      - "`zig build test-env-verify` exits 0."
      - "The new test (`ISS-0174: CapabilitySet.summary() compiles and renders both branches`) passes and asserts on (a) the empty-grants branch returning the literal `\"(none)\"`, (b) the multi-grant branch containing every inserted grant string and the `, ` separator, (c) the returned slice being a valid 0-terminator-free `[]const u8` (length matches a known sum of inserted-grant-len + 2 between each pair)."
    mutation_test:
      - "Inject `const _bad: u32 = \"definitely not a u32\";` into the body of `summary()` (anywhere after `defer buf.deinit(allocator);`)."
      - "Run `zig build test-lua`. Target MUST exit non-zero with a Zig type error citing the injected statement. Capture the failure mode in the step-03 (BACKEND-DEV) handoff."
      - "Revert the mutation. Re-run `zig build test-lua` to confirm the target returns to green."
    lint:
      - "`python tools/lint_handoffs.py handoffs/WF03-GH502-20260808/` exits 0 after every step handoff write."
      - "`python tools/lint_test_isolation.py tests/integration` shows no new findings (this issue is `src/lua/`-scoped, not integration, so a delta here would indicate scope creep)."
      - "`python tools/lint_test_wiring.py` is unchanged (SHOULD-2 is a follow-up, not a blocker)."
  out_of_scope:
    - "ISS-0172 / GH-500 (the pin-form upgrade and the linter upgrade) is handled in its own WF-03 run. This diagnosis treats ISS-0172 as a known context, not as scope to fix here."
    - "ISS-0173 / GH-501 (zero-callers census) is acknowledged as SHOULD-1 but not in scope for this run."
    - "Renaming or removing `summary()` is rejected per the fix_plan decision; not in scope."

