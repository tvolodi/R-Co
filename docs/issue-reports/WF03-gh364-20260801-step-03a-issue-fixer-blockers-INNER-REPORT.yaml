blockers:
  - id: GH-366
    local_issue: ISS-0107 (regression — recommend new local entry ISS-0110)
    severity: BLOCKER
    title: "test-integration-others-internal barrier group deadlocks (40P01) and lock-timeouts (55P03) among itself under full concurrent `zig build test-integration`, recurrence of the closed ISS-0107 fix fc5884b"
    category: B
    environment_or_code: code defect (NOT environment; reproduces identically on freshly-migrated, empty-row db_test container per the Step 3 inner report)
    evidence:
      - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log line 16: `POSTGRES ERROR: ... C40P01 deadlock detected ... Process 171024 waits for RowShareLock on relation 2184446 ... Process 171029 waits for AccessExclusiveLock on relation 2184428 ... blocked by process 171024` (audit_iss103_test pair)"
      - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log line 660: `C40P01 deadlock detected ... Process 170916 waits for AccessExclusiveLock on relation 2184485 ... Process 171029 waits for AccessExclusiveLock on relation 2184367 ... blocked by process 170916` (iss101_timers_failed_status_test pair)"
      - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log line 59..203+: 44 occurrences of `POSTGRES ERROR: ... C55P03 canceling statement due to lock timeout ... runMigrations failed: error.ServerError ... helpers.zig:99:5: ... in runMigrations ... conn.exec(\"SELECT pg_advisory_lock(hashtext('bpm_test_migrations_public'))\", .{}) ... helpers.zig:442:13: ... in init`"
      - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log: zero occurrences of any ISS-503 / iss503 / test_iss503 identifier in any failure window — the #364 barrier from commit 35471e7 remains effective."
      - "tests/integration/helpers.zig line 99: `try conn.exec(\"SELECT pg_advisory_lock(hashtext('bpm_test_migrations_public'))\", &.{});` — the original `runMigrations` lock acquire."
      - "tests/integration/helpers.zig lines 486-488: `try conn.exec(\"SET lock_timeout = '90s'\", &.{}); try conn.exec(\"SELECT pg_advisory_lock(hashtext('bpm_test_migrations_public'))\", &.{}); try conn.exec(\"SET lock_timeout = '5s'\", &.{});` — the widened-lock acquire, bracketed by ISS-0107 rework 1."
      - "tests/integration/helpers.zig line 203: `try conn.exec(\"SET lock_timeout = '5s'\", &.{});` — the ambient 5s ceiling set by configureSessionTimeouts() at the top of TestHarness.init()."
    root_cause:
      classification: code defect (regression of closed ISS-0107)
      mechanism: >-
        The same root-cause class as ISS-0107's rework-1 (Postgres
        lock_timeout cancelling a serializing acquire under queue pressure),
        but at the OTHER critical-section acquire site in TestHarness.init()
        that ISS-0107 rework-1 did not bracket. With fc5884b widening the
        TestHarness.init() critical section to ~6x its prior size, the
        through-put of `runMigrations` releases per second drops; therefore
        the original line-99 `pg_advisory_lock` (which is acquired before
        the widened section can be acquired, so the queue forms on line-99
        BEFORE the line-487 widened-lock queue even has a chance to be
        bracketed by 90s lock_timeout) now sees the same queue-depth wait
        that the line-487 acquire saw pre-rework. Because the line-99
        acquire is not bracketed by a wider lock_timeout, Postgres cancels
        it with 55P03 once a binary waits past the 5s ceiling, returning
        error.ServerError to `runMigrations` and aborting TestHarness.init().
        The 40P01 deadlocks observed (lines 16 and 660) are a related but
        distinct sub-symptom: two binaries' post-init per-test transactions
        race for AccessExclusiveLock on shared `tenant_default` business
        tables (oid 2184485/2184367 are the recreated tenant_default
        instance_projections/process_definitions class — same relation
        family ISS-0107's rework-1 verified earlier). The current run
        observes both 40P01 (deadlock) and 55P03 (lock-timeout) within the
        same captured log because the queue depth at line-99 alternates
        between \"waits past 5s and gets cancelled\" (55P03) and
        \"both parties hold and request incompatible AccessExclusiveLocks
        cyclically\" (40P01).
      verified_by: "ISSUE-FIXER re-derived the line-99 acquire site from current source (tests/integration/helpers.zig:99) and matched it to 44 stack traces in the captured log via `select-string -path ... -pattern helpers.zig:99`."
      falsified_hypotheses:
        - "Reopening of ISS-0106: zero ISS-503 identifiers in the log; the #364 barrier from PR #367 / commit 35471e7 holds."
        - "pg.zig deadlock-masking: vendor/pg/pg.zig readUntilReady() returns PgError.ServerError on ErrorResponse — 55P03 is propagated as a real error, not silently swallowed."
        - "Database environment drift: Step 3 inner report verified the run was against a freshly-migrated, empty-row db_test container; the 40P01 OIDs (2184446, 2184428, 2184485, 2184367) are NEW OIDs produced by the latest migrate, not stale OIDs from a long-lived container."
    chosen_resolution:
      strategy: "Bracket the line-99 `runMigrations` lock acquire with the same `SET lock_timeout = '90s'` / `SET lock_timeout = '5s'` pattern that ISS-0107 rework-1 successfully applied at line 487. This is the minimal, root-cause-correct extension of the proven fix to the second of the two advisory-lock acquire sites in TestHarness.init(). No retry, no sleep, no global timeout inflation, no driver change. Stays well within the <=5 file Fix Scope Rule (1 of 5: tests/integration/helpers.zig)."
      affected_files:
        required:
          - "tests/integration/helpers.zig (add SET lock_timeout = '90s' / '5s' bracket around the existing pg_advisory_lock acquire at line 99 inside runMigrations())"
        no_change_expected:
          - "build.zig (no DAG change; the barrier remains the structurally correct mechanism for the ISS-503-specific overlap closed by #364)"
          - "tests/integration/test_iss503_rls_removal.zig (no behavioral change)"
          - "vendor/pg/pg.zig (driver already correctly propagates ServerError)"
          - "tools/lint_migration_schema.py"
        cross_cutting: "CHANGELOG.md entry + docs/anti-patterns.md cross-reference to GH-366 / ISS-0110 (recommended). CHANGELOG may already cover under the broader ISS-0107 entry — confirm before adding."
      explicit_non_solutions:
        - "Do not retry on 55P03 (retries mask the queue depth problem and can starve the queue)."
        - "Do not raise the ambient 5s lock_timeout globally (would mask genuine hangs in unrelated code paths)."
        - "Do not remove the line-99 lock (it is essential — it serializes the `public` migration check-and-apply pass for the same reason ISS-0090 required it)."
        - "Do not introduce a new lock key (would reopen the same two-key race ISS-0107 explicitly considered and rejected)."
        - "Do not globally serialize all integration binaries (would erase the throughput gain ISS-0106's barrier introduced)."
      affected_areas_for_rework_estimate:
        integration_surface: medium
        rationale: "tests/integration/helpers.zig is a single file in the integration test helper layer; the change is small and surgical, but verification requires re-running the full zig build test-integration with BPM_TEST_DB_URL on a freshly-migrated db_test, plus re-running the focused zig build test-integration-iss503 and zig build test targets."
      branch_strategy: inline-on-current-branch
      branch_strategy_rationale: >-
        Land GH-366 fix inline on feature/WF03-gh364-20260801 because: (a)
        the file change is 1 file and <=10 lines, well within
        GitHub Branch Management's "small follow-up on active branch"
        pattern; (b) the branch is already the canonical home for the
        #364 + blocker-fix chain (it was force-pushed to include the ISS-0108
        / ISS-0109 fixes from #371 and #372, which themselves landed as
        commits on the same branch); (c) opening a sibling or nested branch
        would generate a 3-way merge conflict on helpers.zig when the
        current branch's Step Final rebase runs; (d) the branch name
        `feature/WF03-gh364-20260801` already encompasses the broader
        "restore full integration suite green" scope, which is exactly what
        the blocker fixes serve.
    - id: GH-374
      local_issue: new local entry recommended (ISS-0111)
      severity: MAJOR
      title: "Integration linter tests invoke Windows Store Python alias instead of repository interpreter"
      category: tooling / environment (NOT a code defect in the BPM domain logic — purely a Windows subprocess-resolution issue)
      environment_or_code: code defect with environment dependency (the test code assumes `python3` is on PATH; on Windows, the AppExecutionAlias for python3 hijacks bare `python3` to point at the Microsoft Store stub)
      evidence:
        - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log line 3260: `linter stderr: Python was not found; run without arguments to install from the Microsoft Store, or disable this shortcut from Settings > Apps > Advanced app settings > App execution aliases.`"
        - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log lines 3256-3321: TC-TNT-02-03 and TC-TNT-02-04 both fail with `expected 1, found 49` and `expected 0, found 49` respectively (exit code 49 = Windows Store alias `python3` exit code when no real interpreter is found at that alias target)."
        - "tests/integration/tnt_schema_isolation_test.zig line 592: `.argv = &.{ \"python3\", \"tools/lint_migration_schema.py\", scratch_path }`"
        - "tests/integration/tnt_schema_isolation_test.zig line 660: `.argv = &.{ \"python3\", \"tools/lint_migration_schema.py\", scratch_path }` (second invocation, same broken pattern)"
        - "where.exe python3 on the current host: `C:\\Users\\tvolo\\AppData\\Local\\Microsoft\\WindowsApps\\python3.exe` (first hit, AppExecutionAlias — matches the failure mode), then `C:\\Users\\tvolo\\AppData\\Local\\Python\\bin\\python3.exe` (second hit, real shim)."
        - "Repository .venv has `C:\\Users\\tvolo\\dev\\ai-dala\\R-Co\\.venv\\Scripts\\python.exe` available — the natural choice for both invocations, but neither test currently uses it."
      root_cause:
        classification: code defect (test code uses bare `python3`, which is unsafe on Windows)
        mechanism: >-
          tnt_schema_isolation_test.zig's TC-TNT-02-03 and TC-TNT-02-04
          invoke `python3` as the argv[0] of std.process.run. On Windows,
          PATH lookup for bare `python3` resolves to
          `C:\\Users\\tvolo\\AppData\\Local\\Microsoft\\WindowsApps\\python3.exe`,
          the Microsoft Store AppExecutionAlias stub, which prints the
          `Python was not found...` message and exits with code 49. The
          tests assert specific exit codes (1 for BLOCKER violation, 0 for
          acceptance); exit 49 violates both, so both tests fail. The
          repository DOES have a usable `.venv\\Scripts\\python.exe`
          interpreter, but the test ignores it. On Linux/macOS the bare
          `python3` would resolve to a real interpreter (typically
          /usr/bin/python3) and the tests would pass; this is a Windows-
          specific failure mode that does not surface on CI Linux agents.
      chosen_resolution:
        strategy: >-
          Replace the literal `\"python3\"` argv[0] in both invocations
          with an explicit, environment-overridable interpreter path.
          Preferred implementation: add a small helper at the top of
          tests/integration/tnt_schema_isolation_test.zig (or in
          tests/integration/helpers.zig as a shared utility) that
          resolves the interpreter in this order: (1) `$BPM_TEST_PYTHON`
          environment variable if set; (2) `.venv\\Scripts\\python.exe`
          relative to cwd if it exists; (3) `python3` on PATH (preserving
          current Linux/macOS behavior). Both std.process.run argv arrays
          then use this resolved string. No DB interaction, no advisory
          locks, no build-graph change.
        affected_files:
          required:
            - "tests/integration/tnt_schema_isolation_test.zig (replace `\\\"python3\\\"` argv with helper-resolved interpreter at lines 592 and 660)"
          optional:
            - "tests/integration/helpers.zig (add the shared resolution helper if a second test file ever needs the same logic — currently not required)"
        no_change_expected:
          - "tools/lint_migration_schema.py (the linter itself is correct; only the invocation needs the right interpreter)"
          - "build.zig"
        explicit_non_solutions:
          - "Do not disable TC-TNT-02-03/04 (they are valid tests; the fix is to invoke them with the correct interpreter)."
          - "Do not hard-code the user's absolute Python path (env-dependent and brittle across machines)."
          - "Do not disable the Microsoft Store AppExecutionAlias (out-of-repo config change; cannot rely on this for CI)."
          - "Do not change tools/lint_migration_schema.py to also accept `--python` (the test code is the right place to fix invocation)."
        affected_areas_for_rework_estimate:
          integration_surface: low
          rationale: "Single-file test fix; verification requires re-running TC-TNT-02-03 and TC-TNT-02-04 (either via focused test target or the full suite)."
        branch_strategy: inline-on-current-branch
        branch_strategy_rationale: >-
          Single-file change in a test file that is already part of the
          #364 verification scope. No conflict with any other blocker
          fix (GH-366 modifies helpers.zig; GH-374 modifies
          tnt_schema_isolation_test.zig). Land inline on
          feature/WF03-gh364-20260801.
    - id: GH-359
      local_issue: ISS-0101 (open — pre-existing latent landmine)
      severity: MAJOR
      title: "tenant_default shadow table + OutOfOrderMigration false-positive on cold-start db_test"
      category: B
      environment_or_code: environment + latent schema (NOT a regression introduced by #364 or fc5884b; the latent risk was known and accepted by ISS-0101's body — does not block normal pipeline operation because db_test is normally a long-lived container with migrations already applied)
      evidence:
        - "docs/issues/ISS-0101.json: status=OPEN, severity=MAJOR, body explicitly says 'does not block normal pipeline operation (long-lived `db_test` container masks it), but is a latent landmine for any future environment reset, CI cold-start, or new-developer onboarding that recreates `db_test` from scratch'."
        - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log lines 3325-3330: TC-TNT-03-01 fails with `duplicate key value violates unique constraint \\\"schema_migrations_schema_version_uq\\\" ... Key (schema_name, version)=(tenant_6dd34ae1145f4b6b92522845bd1c235b, 001_event_store.sql) already exists.` This is the exact symptom the GBL-104 cleanup migration targets (migrations/GBL-104_iss0108_drop_stray_tenant_schema_migrations.sql, merged in #371). The root issue is that 001_event_store.sql / 055_xc06_backwards_compatibility.sql historically created a stray tenant_default.schema_migrations shadow table on cold-start; although #371 schema-qualified both source migrations AND added GBL-104 to drop existing shadow copies, a long-lived db_test container may still carry pre-#371 shadow rows that the cleanup migration did not touch (cold-start vs warm)."
        - "scratch/WF03-gh364-20260801-step03-full-integration-utf8.log lines 3326-3377: TC-TNT-03-01/03/05 fail with `expected search_path to contain 'tenant_*', got: 'public'` and `relation \\\"events\\\" does not exist`. These are search_path-related symptoms consistent with the same shadow-table-contamination class: when the harness's tenant_default provisioning races another binary's provision + shadow-table-create, the search_path set on one connection doesn't reflect another connection's resolved view of which tenant_default tables exist."
        - "tests/integration/db_integration_test.zig (current HEAD): TC-DB-01-01/02 now schema-qualify `public.schema_migrations` (merged via #371 / commit 025baec). The shadow-table symptom therefore only affects TC-TNT-03-* tests in tnt_schema_isolation_test.zig, not TC-DB-01-01/02 directly."
      root_cause:
        classification: environment (pre-existing latent landmine; latent because TC-DB-01-01/02 are already fixed at HEAD per #371)
        mechanism: >-
          On a long-lived, warm db_test container, the tenant_default
          schema may carry a pre-#371 shadow `schema_migrations` table
          left over from before migration tracking was consolidated onto
          public.schema_migrations. The GBL-104 cleanup migration added
          in #371 only drops shadow copies whose containing tenant
          schema is still referenced in public.tenant at the time
          GBL-104 runs; if a warm container has shadow copies for
          tenant schemas that have since been removed from
          public.tenant, GBL-104 misses them. The shadow table has
          the same (schema_name, version) UNIQUE constraint as the
          canonical public.schema_migrations, so when two concurrent
          binaries both try to insert 001_event_store.sql into the
          shadow table, one loses with 23505. The TC-TNT-03-* search_path
          failures are downstream effects: the shadow table's existence
          can confuse Pool.acquire() / applyRequestTenantContext() into
          resolving tenant_default tables that don't actually exist in
          the canonical tenant schema.
      chosen_resolution:
        strategy: >-
          Pure environment cleanup with no source change required. Drop
          the stray `tenant_default.schema_migrations` shadow table from
          the live db_test container BEFORE the next full-suite run.
          One-time command (no migration, no per-run step):
          `docker-compose exec db_test psql -U bpm -d bpm_test -c \"DROP TABLE IF EXISTS tenant_default.schema_migrations;\"`.
          After this, ISS-0101's symptom class disappears for this
          container's lifetime. The longer-term remediation (audit
          001_event_store.sql / 055_xc06_backwards_compatibility.sql
          and confirm schema-qualification holds, audit
          clean_test_db.py's reset path) remains tracked under ISS-0101
          as its own work item but is NOT on the critical path for #364
          closure.
        affected_files:
          required:
            - "scratch/_cleanup_drop_gh359_shadow.sql (one-time SQL executed against db_test; lives in scratch/ because it is environment-only, not a permanent artefact)"
            - "docs/issue-reports/WF03-gh364-20260801-step-03-backend-dev-INNER-REPORT.yaml (already records GH-359 as a surfaced blocker — no update required)"
          no_change_required_for_source:
            - "migrations/* (already addressed by GBL-104 from #371)"
            - "tests/integration/db_integration_test.zig (already schema-qualified at HEAD)"
            - "tests/integration/tnt_schema_isolation_test.zig (symptom only — environment fix is sufficient)"
            - "build.zig"
        explicit_non_solutions:
          - "Do not write a new migration to drop tenant_default.schema_migrations (GBL-104 already does this for tenant schemas still referenced in public.tenant; a fresh migration would itself race the existing cold-start path it is meant to clean up)."
          - "Do not modify tests/integration/tnt_schema_isolation_test.zig to work around the shadow table (the test correctly expects tenant schema resolution)."
          - "Do not drop the public db_test container (would lose legitimate test state for the rest of the suite)."
        affected_areas_for_rework_estimate:
          integration_surface: low
          rationale: "One environment command, no source change. Verification is re-running the full zig build test-integration and confirming TC-TNT-03-* no longer fail with the 23505/schema_migrations_schema_version_uq symptom."
        branch_strategy: environment-only (no commit, no PR)
        branch_strategy_rationale: >-
          GH-359 requires no source change to the current branch. The
          drop is a one-time SQL executed against the running container,
          recorded only in scratch/. If a CI cold-start path needs to
          automate the drop, that belongs to a follow-up issue under
          ISS-0101, not the current WF-03 #364 workflow.
sequential_remediation_order:
  rationale: >-
    Order by (a) safety / non-invasiveness, (b) independence, (c) verification
    cost. GH-359 is the safest first step (environment-only, no source
    change, no DB schema migration; drops a single shadow table that is
    confirmed present per the captured log). GH-374 is the safest code
    change (single-file, deterministic, no DB interaction, runs in seconds).
    GH-366 is the most invasive (single-file but requires full
    zig build test-integration re-run to verify the fix actually
    eliminates the queue-depth symptom, and verification must observe
    zero 40P01 AND zero 55P03 simultaneously — exactly the bar #364
    requires). All three land on the same feature branch with separate
    commits, so an interim Step 3 verification after GH-359 + GH-374 (and
    before GH-366) can be used to confirm the residual failures are
    exclusively the line-99 55P03 class before applying the lock_timeout
    bracket.
  recommended_order:
    - step: 1
      blocker: GH-359
      action: "One-time `docker-compose exec db_test psql -U bpm -d bpm_test -c \"DROP TABLE IF EXISTS tenant_default.schema_migrations;\"` (or equivalent direct psql call against BPM_TEST_DB_URL). No source change. Record the executed SQL and resulting `\dt tenant_default.*` confirmation in scratch/_gh359_cleanup.log."
      verify: "Re-run full `zig build test-integration`; confirm TC-TNT-03-01/03/05 no longer emit 23505 on schema_migrations_schema_version_uq and no longer report `relation \"events\" does not exist` from a shadow-table-resolution path. Expected: TC-TNT-03-* failures either disappear entirely or reduce to a different class (in which case the TC-DB-01-01/02 path becomes the next focus)."
      owner: BACKEND-DEV
