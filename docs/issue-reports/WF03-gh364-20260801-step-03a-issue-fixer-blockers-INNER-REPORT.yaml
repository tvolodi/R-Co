  decision: all-three-inline-on-current-branch
  decision_summary: >-
    All three blockers land inline on the existing
    `feature/WF03-gh364-20260801` branch as three separate, atomic commits:
    GH-359 (environment-cleanup note in scratch/ only — no commit needed on
    the branch), GH-374 (single-file commit on tnt_schema_isolation_test.zig),
    GH-366 (single-file commit on helpers.zig). Final commit text should
    chain `feat(WF03-gh364-20260801): resolve blockers GH-359, GH-374, GH-366`
    for clarity, OR keep them as three separate commits and let the Step
    Final squash them into a single PR merge commit. No nested or sibling
    branches are opened.
  rationale:
    surface_overlap_zero: "GH-359 modifies scratch/ only (no source); GH-374 modifies tests/integration/tnt_schema_isolation_test.zig (lines 591-593 and 659-661); GH-366 modifies tests/integration/helpers.zig (lines 99-100 region). These three files do not overlap, so any ordering of the three commits produces a clean three-way diff."
    conflict_with_existing_branch: "None. tests/integration/helpers.zig was last modified in commit fc5884b (ISS-0107), which is an ancestor of HEAD 9ff3580. The proposed GH-366 edit is in the same file but at a DIFFERENT line region (line 99 vs lines 486-488), so the edit does not overlap with fc5884b's change and merges cleanly via fast-forward."
    pr_clutter_avoided: "Opening three new branches (e.g. feature/WF03-gh366-regression-20260801, feature/WF03-gh374-python-path-20260801, feature/WF03-gh359-shadow-cleanup-20260801) would generate three PRs against main that all need to merge before the parent #364 PR can complete its Step Final cleanup. The current branch already carries the active #364 verification chain (Step 00 / Step 01 / Step 02 / Step 02b / Step 03); piling three nested branches on top obscures the release history and multiplies the merge-conflict surface area."
    github_branch_management_compliance: "The CLAUDE.md 'GitHub Branch Management (MANDATORY)' rule already requires DOC-UPDATER Step Final to merge-and-delete the feature branch as the final step. Adding more short-lived branches to be merged-and-deleted multiplies that work without benefit."
