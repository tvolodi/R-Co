summary: >-
  WF-03 Step 0.5/1 triage for the three independent blockers that prevented the
  Step 3 verification of GitHub #364 / ISS-0106 from certifying a green full
  `zig build test-integration`. Blockers GH-366, GH-374, and GH-359 are
  independent: none were introduced by #364's merged PR #367 / commit 35471e7,
  and they do not regress each other. GH-366 is a true regression of the
  previously-closed ISS-0107 fix fc5884b (specifically, the line-99
  `runMigrations` advisory-lock acquire is now being cancelled by Postgres
  55P03 because queue depth from the widened line-487 critical section makes
  the narrower line-99 acquire wait beyond the ambient 5s lock_timeout — the
  same root-cause class as ISS-0107's original rework, but at a different
  acquire site that ISS-0107 rework 1 did not bracket). GH-374 is a new,
  pure-environment Windows defect (the tnt_schema_isolation_test.zig subprocess
  launches bare `python3` which Windows resolves to the Microsoft Store
  AppExecutionAlias instead of the repository's `.venv`). GH-359 is the
  pre-existing ISS-0101 latent landmine (long-lived db_test container still
  carries pre-ISS-0091 stray `tenant_default.schema_migrations` shadow-table
  artifact that unqualified TC-DB-01-01/02 references would still resolve
  against if the test connection's `tenant_default,public` search_path picks
  it up). Each blocker maps cleanly to an existing local ISS and existing
  GitHub issue — no duplicate issues were filed. Safe sequential remediation
  order is GH-359 first (environment cleanup, no source changes, non-
  invasive), then GH-374 (single-file, deterministic, no DB interaction), then
  GH-366 (single-file helpers.zig edit following the proven ISS-0107 pattern,
  must be last because its verification re-runs the full suite). All three
  blockers should land inline on `feature/WF03-gh364-20260801` rather than on
  nested or sibling branches — they are surface-area-tiny (1 file each, plus
  1 environment-cleanup command), do not touch any of the #364-approved
  surfaces (build.zig barrier, tests/integration/test_iss503_rls_removal.zig
  doc comment), and would otherwise pile up three short-lived branches
  obscuring the release history. No source changes were implemented by this
  triage handoff.
