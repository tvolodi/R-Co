summary: >
  Designed and implemented an end-to-end integration test for the
  LUA-12 / LUA-15 / LUA-16 production wiring delivered by commits
  c5a12c9d and d0e74f73. One file, nine test cases (2 + 4 + 3), all
  pass on `zig build test-integration-iss0625`. Found and fixed a
  production-side segfault in `tableToScriptValue` (`lua_next` was
  iterating with the wrong relative index after `lua_pushnil` shifted
  the stack). Filed a follow-up issue (ISS-0626 / GH-595) for a known
  LUA-16 limitation (stack_trace is empty on LuaJIT 2.1 because call
  frames unwind before `lua_pcall` returns to C; proper fix is to
  install `debug.traceback` as the errfunc argument to `lua_pcall`).

