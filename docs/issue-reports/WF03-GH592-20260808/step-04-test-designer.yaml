production_fix_summary:
  file: src/lua/host_context.zig
  function: tableToScriptValue
  bug: >
    After `bindings.lua_pushnil(L)`, the relative index `idx` (computed
    BEFORE the push, pointing to the table) now points to the nil
    we just pushed. `lua_next(L, idx)` then iterates over nil, which
    raises a segfault in LuaJIT 2.1 `lj_tab_next` at 0xffffffffffffffff.
  fix: change `lua_next(L, idx)` to `lua_next(L, idx - 1)`
  triggered_by: TC-ISS-0625-LUA-15-int-04 (which exercises a registry-backed details table)
  reference: comment in src/lua/host_context.zig around line 239

