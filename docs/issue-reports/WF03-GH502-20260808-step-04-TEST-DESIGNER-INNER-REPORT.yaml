   `const _bad: u32 = "definitely not a u32";` into the body of `summary()` and
   ran `zig build test-lua`. Build went RED with:
   ```
   src\lua\capabilities.zig:74:15: error: unused local constant
   src\lua\capabilities.zig:74:27: error: expected type 'u32', found '*const [20:0]u8'
   referenced by:
       test.ISS-0174 / GH-502: ...: src\lua_test_root.zig:311:39
   ```
   This is the second independent confirmation (the first is BACKEND-DEV's
   `scratch/_iss0174_mutation_red.log`) that the body of `summary()` is now
   genuinely analysed by Zig's semantic analyser — the exact failure mode
   ISS-0172 / GH-500 documents for type-only pins.
3. **Post-revert:** mutation reverted (`git diff` = 0 bytes for
   `src/lua/capabilities.zig`); `zig build test-lua` returns to green with
   `72/72 tests passed`.
4. **Full build:** `zig build test --summary all` reports
   `85/85 steps succeeded; 945/1009 tests passed (64 skipped)`. The 64 skips
   are pre-existing `error.SkipZigTest` markers in other suites (not from this
