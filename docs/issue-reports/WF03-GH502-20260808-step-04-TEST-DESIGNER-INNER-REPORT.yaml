## Summary

TEST-DESIGNER validated the regression-locked test coverage for ISS-0174 / GH-502
(`CapabilitySet.summary()` Zig 0.16 unmanaged-`ArrayList` migration). The new
`ISS-0174 / GH-502: CapabilitySet.summary() compiles, runs, and renders both
branches` test block is already present at `src/lua_test_root.zig:294` (added by
BACKEND-DEV in commit 30d449f6) and exercises TC-CS-01..05 for real:

| TC | Branch | Asserts on |
|---|---|---|
| TC-CS-01 | empty grants | literal `"(none)"`, length 6, free is a no-op |
| TC-CS-02 | single grant | grant verbatim, length 20, no `,` separator |
| TC-CS-03 | multiple grants | sorted join: `"audit:log, service:call:payment, variable:write"` |
| TC-CS-04 (implicit) | allocator honoured | `std.testing.allocator` owns the slice; `defer free` succeeds |
| TC-CS-05 (implicit) | caller owns slice | explicit `free` is required (caught by leak detector if omitted) |

Independent fresh-session verification:

1. **Pre-mutation:** `zig build` exits 0; `zig build test-lua` reports
   `72/72 tests passed` (was 71/71 pre-fix, +1 from new block).
