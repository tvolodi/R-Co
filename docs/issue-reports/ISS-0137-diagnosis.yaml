# ---------------------------------------------------------------------------
# LINTER CHANGES REQUIRED
# ---------------------------------------------------------------------------
linter_changes_required:
  exclusion_mechanism:
    currently_supported: false
    evidence: >-
      tools/lint_test_wiring.py has no allowlist, no skip file, no inline-comment
      pragma, and no CLI flag beyond --quiet. Read end to end: SCAN_DIRS is the
      only filter and it is a hardcoded ("src", "tests") tuple. There is
      therefore NO way today to record disposition (e) DOCUMENTED_EXCLUSION.
    required_if_disposition_e_used: true
    current_diagnosis_uses_disposition_e: false
    note: >-
      This diagnosis assigns ZERO files to DOCUMENTED_EXCLUSION, so the linter
      change is not strictly blocking for the current 55. It becomes blocking if
      CODE-DESIGNER converts tests/unit/wasm_executor_test.zig (or
      repository_artifacts_test.zig) to an exclusion after judging the Wasmtime
      link / live-DB questions flagged above.
    recommended_design: >-
      Add a `tools/test_wiring_exclusions.yaml` (YAML per CLAUDE.md output rules)
      with entries {path, reason, issue_ref, added_at}. Load it in main(),
      subtract from `unwired`, and PRINT every excluded path with its reason on
      every run so an exclusion can never become invisible. Require a non-empty
      `reason` and `issue_ref` -- an exclusion without a filed issue is exactly
      the "silently unreachable" state this linter exists to prevent. Do NOT
      implement it as an inline source comment: that would let a future agent
      silence the gate by editing the file the gate measures, which CLAUDE.md's
      "Never Satisfy a Gate by Editing What It Measures" directive forbids.

  other_recommended_improvements:
    - id: L-1
      severity: MINOR
      change: >-
        Report the per-file test-block COUNT alongside each [UNWIRED] line.
        The tool currently reports 55 files but not that they carry 350 test
        blocks -- the count is what conveys the real coverage gap and would have
        made ISS-0137's severity obvious at filing time (it is currently MINOR;
        350 never-executed test blocks arguably is not MINOR).
    - id: L-2
      severity: MINOR
      change: >-
        Resolve NAMED module imports, not only relative .zig imports. Today
        IMPORT_LITERAL requires a literal ".zig" suffix, so the linter cannot
        follow `@import("bpm")` -> src/bpm.zig. Parsing build.zig's
        b.createModule name->root_source_file map and following named edges
        would let the linter distinguish RC-1 (module exists but is never
        rooted) from RC-3 (module does not exist at all) automatically. It
        would also, correctly, still report all 21 src/ files as unwired --
        being reachable as a module is not the same as having your tests run.
    - id: L-3
      severity: MINOR
      change: >-
        Warn when an addTest root file is a shim (<= SHIM_OWN_TEST_BLOCK_MAX own
        test blocks) that contains NEITHER `_ = @import(...)` NOR
        `refAllDecls` -- i.e. a target that compiles and silently runs zero
        tests. That is the exact trap src/transition_test_root.zig's doc comment
        documents for src/bpm.zig, and nothing currently detects it.

# ---------------------------------------------------------------------------
# GREEN-MAIN GATE RISK
# ---------------------------------------------------------------------------
green_main_gate_risk:
  headline: >-
    Wiring naively -- adding all 55 files to `zig build test` -- would break the
    Green-Main Gate in three independent ways at once.

  risks:
    - id: G-1
      severity: BLOCKER
      name: "Live-service tests on a service-free gate"
      detail: >-
        34 of the 55 files require Postgres (BPM_TEST_DB_URL) and 2 of those
        additionally require Keycloak at localhost:8081. `zig build test` is the
        WF-02 Step 00a Green-Main Gate and must pass on a machine with no
        docker-compose stack. Putting any of these 34 on `test` turns the gate
        permanently red on every developer machine and in any CI job that does
        not provision services.
      mitigation: >-
        Honour the unit_vs_integration_split section above exactly: 21 src/ files
        + 11 tests/unit files + iss206 go on `test`; all 20 tests/integration
        files (incl. oidc13/oidc14, which are DB-free but belong to the
        integration cluster) go on `test-integration` via main_test.zig.

    - id: G-2
      severity: MAJOR
      name: "Never-executed tests are presumed rotten"
      detail: >-
        These 350 test blocks have not compiled or run for months. The GH #428
        precedent is direct evidence of what happens: when transition.zig's 30
        in-file tests were finally wired in, 7 of them failed against ownership-
        model drift AND the exercise surfaced two real production memory bugs.
        Expect a comparable failure rate here -- roughly 20-25% of 350 is 70-90
        failing blocks. Wiring all 55 in one commit produces an unreadable red
        wall with no attribution.
      mitigation: >-
        Land the clusters in the order given, one commit each, re-running
        `python tools/lint_test_wiring.py` and the relevant zig build step after
        every cluster. Every genuine test failure discovered is a NEW issue: file
        it (ISS + GitHub, per CLAUDE.md "No Issue Left Local-Only") and enqueue
        it onto handoffs/WF03-gh439-testwiring-20260806/issue_queue.json for
        draining via WF-03 Steps 1-7 on THIS branch.

    - id: G-3
      severity: MAJOR
      name: "Compile failures, not test failures -- 22 files cannot build today"
      detail: >-
        The 22 RC-3 files reference 15 named modules that do not exist in
        build.zig. A naive `_ = @import(...)` into an existing aggregator makes
        the WHOLE aggregator fail to compile, taking every currently-green test
        in that binary down with it. tests/unit/api_test_root.zig,
        bpm_src_test_root.zig and bpm_main_test_root.zig each carry 6-12
        currently-passing files -- a bad import there is a much larger blast
        radius than the file being wired.
      mitigation: >-
        Never add an RC-3 file to an EXISTING aggregator. Create the missing
        b.createModule declarations first, verify with a NEW dedicated
        aggregator root (tests/unit/oidc_unit_test_root.zig etc.), and only
        attach that new root to `test` once it compiles standalone.

    - id: G-4
      severity: MINOR
      name: "ISS-0136 concurrent -lc cache-lock deadlock"
      detail: >-
        build.zig's aggregator comments (lines 169-176, 224-229, 244-248)
        document an upstream Zig cache-lock deadlock triggered by too many
        concurrent libc-linked zig-test compile jobs. Several new modules here
        need .link_libc = true (env_mod consumers, api/identity paths). Adding
        6-10 new standalone addTest targets would push the concurrent -lc count
        back up.
      mitigation: >-
        Prefer AGGREGATOR_SHIM roots over per-file addTest targets throughout.
        This diagnosis proposes 6 src/ shims + 3 tests/unit aggregators = 9 new
        targets rather than 42, and NEW_ADDTEST_ROOT is deliberately assigned to
        zero files for this reason.

    - id: G-5
      severity: MINOR
      name: "ISS-0106 DDL race on test-integration"
      detail: >-
        Any new addTest attached directly to `test_integration_step` instead of
        the `test_integration_others_step` barrier can run concurrently with
        test_iss503_rls_removal.zig's AccessExclusiveLock-holding DDL.
      mitigation: >-
        Wire all 12 RC-2/RC-3 integration files through
        tests/integration/main_test.zig's import list. main_test.zig is already
        behind the barrier, so no new barrier edges are required and the risk
        is eliminated by construction.

