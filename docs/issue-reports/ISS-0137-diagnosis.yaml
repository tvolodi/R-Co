  shim_pattern:
    reference_file: src/transition_test_root.zig
    two_variants:
      - name: REFALLDECLS_SHIM
        use_when: "Target is a PRODUCTION file whose tests must run; the file reaches siblings by relative path and cannot be its own module root."
        body: 'pub const x = @import("path/to/file.zig"); test { std.testing.refAllDecls(x); }'
        placement_rule: >-
          The shim must sit at or above the shallowest directory the target's
          relative @import chain escapes to. transition.zig reaches
          ../definition/graph.zig, so its shim lives at src/, not src/engine/.
      - name: AGGREGATOR_SHIM
        use_when: "Several TEST files share one named module and have no colliding top-level test names."
        body: 'test { _ = @import("a_test.zig"); _ = @import("b_test.zig"); }'
        examples: [tests/unit/api_test_root.zig, tests/unit/bpm_src_test_root.zig, tests/unit/graph_test_root.zig, tests/unit/bpm_main_test_root.zig]

