# ---------------------------------------------------------------------------
# UNIT vs INTEGRATION SPLIT -- the Green-Main Gate boundary
# ---------------------------------------------------------------------------
unit_vs_integration_split:
  principle: >-
    `zig build test` is the Green-Main Gate. It must stay runnable on a machine
    with NO Postgres and NO Keycloak. Any file whose tests touch a live service
    goes on `test-integration` (or a `test-integration-*` sibling), never on
    `test`.

  goes_on_zig_build_test:
    count: 33
    test_blocks: 141
    count_note: >-
      33 files / 141 test blocks total: the 21 src/ production files (74 blocks),
      11 tests/unit files (56 blocks), tests/unit/repository_artifacts_test.zig
      (1 block, conditional -- see below), and
      tests/integration/iss206_token_multiset_test.zig is NOT counted here (it is
      routed to test-integration for wiring simplicity despite being DB-free).
    files_summary: >-
      All 21 src/**/*.zig production files (their in-file test bodies were
      individually inspected: zero Pool/Conn/query/BPM_TEST_DB_URL/http
      references inside any test block), plus 12 of the 13 tests/unit files
      (all except the deleted event_store_test_orig.zig).
    exact_list:
      - src/api/tenant_context.zig
      - src/api/pipeline_context.zig
      - src/obs/metrics.zig
      - src/env.zig
      - src/config/identity_provider.zig
