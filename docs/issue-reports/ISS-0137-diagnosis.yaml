summary: >-
  55 test-bearing .zig files under src/ and tests/ are unreachable from every
  b.addTest(...) root in build.zig, so their 350 test blocks have never
  executed. They fall into exactly three mechanical causes, none of which is a
  single "someone forgot one line" mistake -- each is a structural consequence
  of how build.zig composes modules.

# ---------------------------------------------------------------------------
# ROOT CAUSE
# ---------------------------------------------------------------------------
root_cause:
  statement: >-
    Zig runs a file's `test` blocks only when the file is reachable from an
    addTest root through *analyzed declarations*. build.zig composes almost
    everything as named `b.createModule(...)` imports rather than as addTest
    roots, and a named module that is only *imported* (never rooted, never
    refAllDecls'd) is compiled but its test blocks are never discovered. Three
    distinct mechanisms produce the 55:

  mechanisms:
    - id: RC-1
      name: "Named-module-only production files (module != addTest root)"
      count: 21
      applies_to: "all 21 src/**/*.zig entries"
      detail: >-
        This is the exact ISS-0132 / GH #428 defect class, unfixed everywhere
        except src/engine/transition.zig. Files like src/api/tenant_context.zig,
        src/obs/metrics.zig, src/env.zig and src/config/identity_provider.zig
        are handed to build.zig only as `tenant_context_mod`, `obs_metrics_mod`,
        `env_mod`, `idp_config_mod` -- created with b.createModule, listed in
        `vendor_imports`, consumed by the exe and by the `unit_tests` addTest
        whose root is src/main.zig. Because main.zig reaches them by *named*
        import ("tenant_context", "obs_metrics", "env"), and because a named
        module is a separate compilation unit whose root is the module file
        itself -- not a declaration analyzed from main.zig's root -- Zig never
        discovers their test blocks. transition.zig had precisely this shape
        and was fixed by adding src/transition_test_root.zig; the same fix was
        never generalised to the other 21.
      subcase_orphaned_trees:
        note: >-
          A stronger variant affects src/repository/{activation,artifacts,schemas}.zig
          and all five src/simulation/*.zig files: these are not even reachable
          by *any* path from src/main.zig. src/repository/mod.zig and
          src/simulation/mod.zig (the aggregators that do re-export them) are
          themselves unreachable -- main.zig imports only
          repository/service_catalog.zig directly, and simulation/mod.zig is
          re-exported only from src/bpm.zig, which is a module root for
          bpm_src_mod but is NOT itself an addTest root and carries neither a
          test block nor refAllDecls (exactly the failure mode
          src/transition_test_root.zig's doc comment warns about in its point 2).
        verified_by: "tools/lint_test_wiring.py BFS: src/bpm.zig, src/repository/mod.zig, src/simulation/mod.zig all report reachable=False"

    - id: RC-2
      name: "Integration tests never added to tests/integration/main_test.zig's import list"
      count: 12
      applies_to: >-
        effects_subsystem_test, env01_tenant_type_field_test,
        exp601_tier_quota_test, iss206_token_multiset_test, repository_test,
        oidc31/oidc35, xc01/xc02/xc03/xc05/xc06
      detail: >-
        tests/integration/main_test.zig is the sole aggregator root for
        `zig build test-integration` (plus ~35 sibling one-off addTest roots).
        It pulls in ~90 test files by explicit `const x = @import("...")` lines.
        These 12 files were written and committed but the corresponding import
        line was never added, and no dedicated addTest root was created for
        them either. Nothing fails when the line is omitted -- the suite still
        compiles and reports green -- so the omission is invisible.

    - id: RC-3
      name: "Tests referencing named modules that do not exist in build.zig at all"
      count: 22
      applies_to: >-
        all 8 oidc08..oidc15/oidc34 integration tests and 8 of the 13
        tests/unit files (test_oidc06/08/27/29/30/33, repository_artifacts,
        repository_canonicaliser, wasm_executor)
      detail: >-
        These files import named modules -- "claim_mapping", "jit_provisioning",
        "identity_stability", "realm_tenant_binding", "tenant_claim_source",
        "realm_provisioning", "realm_deletion", "oidc_migration_helper",
        "repository", "jwks_cache", "oidc_bench", "realm_seed",
        "oidc_test_token_helper", "oidc_coexistence", "wasm" -- and NOT ONE of
        those 15 module names is declared anywhere in build.zig (verified by
        grep for `.name = "<m>"`). These files therefore cannot even be
        compiled today: wiring them requires *first* creating the missing
        b.createModule declarations, not merely adding an import line. This is
        the strictly hardest cluster and the reason ISS-0102's six files sat
        unfixed for a week -- the previous diagnosis treated it as an
        import-list omission (RC-2) when it is actually a missing-module
        problem.

  why_undetected_for_months: >-
    None of the three mechanisms produces any error. `zig build test` and
    `zig build test-integration` both exit 0 while silently running zero tests
    from these files. tools/lint_test_wiring.py -- written under GH #428 -- is
    the first mechanism in the repo that can observe the condition, and it is
    deliberately NOT a dependency of `zig build test` (build.zig lines
    1531-1544) precisely because turning it on today would fail the
    Green-Main Gate for this pre-existing backlog.

