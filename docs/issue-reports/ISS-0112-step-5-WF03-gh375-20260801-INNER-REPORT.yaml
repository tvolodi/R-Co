issues_found:
  - severity: BLOCKER
    description: |
      Step 3 implementation broke the integration test suite with an
      incomplete signature change. src/db/migrations.zig::Migrations.
      runForSchema gained a 5th required parameter `force_reconcile: bool`
      but the three direct integration test call sites were not updated.
      19 of 53 integration test binaries fail to compile. The Step 3
      implementation self-review claimed `zig build test exits 0` which
      is true (unit tests still pass), but failed to run `zig build
      test-integration` which would have surfaced the regression.
    affected_files:
      - tests/integration/helpers.zig:181
      - tests/integration/audit_iss103_test.zig:44
      - tests/integration/exp103_instance_waits_test.zig:81
    root_cause: |
      Design prescribed "Zig default-param idiom: force_reconcile: bool = false"
      but Zig has no default-param support. BACKEND-DEV chose required-param
      + wrapper pattern but only updated one internal caller (the convenience
      overload Migrations.run) and src/db/provisioning.zig:112. The
      integration test direct call sites were not searched for or updated.
    design_oversight: |
      Step 2b CODE-DESIGN-VALIDATOR approved the design with the claim
      "No external callers exist (verified by `grep -r 'runForSchema' src/
      tests/`)" but `tests/integration/helpers.zig` was not in the
      searched path — the grep would have found at least 70 importers
      of helpers.zig (which transitively call runForSchema) plus the
      two direct callers (audit_iss103_test.zig, exp103_instance_waits_test.zig).
      Future signature changes MUST grep both tests/ and web/src/.

  - severity: BLOCKER
    description: |
      Compile-failing binary count increased from 13 (baseline) to 19
      (current). Net regression: 6 additional broken binaries. Net
      reduction in test surface: 1238 baseline tests executable → 26
      current. The 42-failure cluster cannot be re-evaluated until the
      compile regression is fixed.

