suspected_root_cause:
  tc03: >-
    The per-tenant bpm_audit_validate_chain re-created by
    migrations/1110_iss0122_validator_zero_sentinel_per_tenant.sql
    DO block calls tenant_default.bpm_audit_compute_chain_hash(...)
    with the trace_id argument hard-coded to NULL (the migration
    comment says "NULL passed to bpm_audit_compute_chain_hash for
    the trace_id argument so the function compiles against
    audit_entries regardless of whether the schema has the trace_id
    column"). However, the corresponding trigger function
    tenant_default.bpm_audit_apply_chain_hash (also re-created by
    1109) computes the chain hash using NEW.trace_id (the actual
    row value, e.g. 'iss0122-test'). Because the canonical payload
    embeds trace_id, validator's expected_chain and trigger's
    stored chain_hash diverge whenever trace_id IS NOT NULL.
    bpm_audit_chain_canonical_payload (the TEXT overload, lines
    17-21 in tenant_default.bpm_audit_chain_canonical_payload)
    renders trace_id as 'trace_id=<value>' or 'trace_id=~' for
    NULL — the literal difference is enough to flip the SHA-256.
    Verified empirically by computing the canonical payload via
    SELECT bpm_audit_chain_canonical_payload(...) directly and
    SHA-256-hashing it: matches the stored chain_hash for both
    ASCII and non-UTF-8 rows when the same trace_id is supplied;
    mismatches when trace_id=NULL is supplied.
  tc04: >-
    The TC-04 INSERT statement is built by std.fmt.bufPrint and
    embeds the same $1 placeholder in two places with conflicting
    inferred types: (i) VALUES($1, $2, ...) where the column is
    tenant_id UUID — PG infers uuid; (ii) inside the resource_id
    expression as $1::text — PG infers text. With both usages,
    PG raises SQLSTATE 42P08 'inconsistent types deduced for
    parameter $1 (text versus uuid)' during PREPARE/Parse.
    Reproduced manually with the same SQL via PREPARE p1 AS ...
    EXECUTE p1('0000...', '0000...').
