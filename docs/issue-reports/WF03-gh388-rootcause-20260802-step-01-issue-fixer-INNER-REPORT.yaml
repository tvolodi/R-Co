summary: >-
  Diagnosed two independent failures in tests/integration/audit_chain_utf8_test.zig
  introduced by PR #398 (e5bbaea, "fix(ISS-0122): audit chain UTF-8 resilience"):
    (a) TC-ISS-0122-03 — validator returns 3 issues instead of 0, because
        migration 1110_iss0122_validator_zero_sentinel_per_tenant.sql
        intentionally passes NULL for the trace_id argument when calling
        bpm_audit_compute_chain_hash, but the trigger function (1109 +
        tenant_default.bpm_audit_apply_chain_hash) hashes against the actual
        r.trace_id / NEW.trace_id value. Result: validator expected_chain
        never matches the trigger-stored chain_hash whenever trace_id IS
        NOT NULL — both rows in TC-03 fail to match, plus a prev_chain_hash
        propagation issue.
    (b) TC-ISS-0122-04 — connection-abort cascade rooted in C42883
        'inconsistent types deduced for parameter $1 (text versus uuid)'
        emitted by PostgreSQL when the dynamically-built INSERT contains the
        same placeholder $1 referenced both as the tenant_id UUID column
        match and as $1::text inside a string concatenation. PostgreSQL
        cannot pick a single type and rejects the prepared statement.
        Once the first INSERT raises, the worker thread's connection enters
        'current transaction is aborted' state (25P02) for every subsequent
        command in that transaction.
