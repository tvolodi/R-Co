candidate_fix:
  category: Mixed (A — code-defect + D — test-defect)
  category_label: Migration bug + test SQL type ambiguity
  changes:
    - target: migrations/1110_iss0122_validator_zero_sentinel_per_tenant.sql
      description: >-
        In the DO block's CREATE OR REPLACE FUNCTION
        %I.bpm_audit_validate_chain(...) body, change the inner compute
        call so the trace_id argument is the row's r.trace_id (not
        NULL). Currently the inline body passes NULL for trace_id,
        which makes the validator diverge from the trigger whenever
        the audit row has trace_id IS NOT NULL. Apply the same fix to
        public.bpm_audit_validate_chain (which already passes r.trace_id
        correctly) by adding a CREATE OR REPLACE in this migration to
        normalize across all tenant_* schemas. The fix is idempotent
        under CREATE OR REPLACE and does not require new
        schema_migrations ledger entries if 1110 is reapplied via the
        per-tenant DO loop. Alternative: ship migration 1111 with the
        corrected body.
    - target: tests/integration/audit_chain_utf8_test.zig
      description: >-
        In TC-ISS-0122-04, replace the conflicting `$1` reuse with
        either a separate `$3` placeholder (and add tenant_id to the
        params tuple) OR remove the `$1::text` cast entirely — embed
        the index in the resource_id via std.fmt.bufPrint (the index
        is already being interpolated that way) and stop including
        the tenant_id inside the resource_id expression. The trigger
        pipeline cares only about the chain hash and prev-chain-hash
        continuity; the test's goal is to verify chain continuity
        under concurrent non-UTF-8 inserts, not the literal
        resource_id value.
      location: >-
        audit_chain_utf8_test.zig:343-353 (worker thread B SQL) and
        audit_chain_utf8_test.zig:388-398 (connection A SQL). Replace
        `|| $1::text || '-i{d}'` with a constant suffix (e.g.
        `|| '-i{d}'`) since the per-iteration index is already
        embedded via the bufPrint argument.
  alternative_fix_paths:
    - >-
      For the test SQL, use prepare-execute with named parameters
      via libpq's text protocol ($1 in one place only). Simplest:
      drop the resource_id tenant-id concatenation; the chain-continuity
      assertion does not require it.
