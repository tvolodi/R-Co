# Diagnosis Report

## Handoff Assumption vs. Reality

The handoff described OIDC-F-05 and OIDC-F-06 as "not implemented — neither has any
code." This is incorrect. Both requirements are implemented:

- **OIDC-F-05**: `src/api/routes/tenant_config.zig` implements `GET /api/tenant-config?host={hostname}`.
  The route is registered in `src/main.zig` at line 403.
- **OIDC-F-06**: `web/src/auth/tenantConfig.ts` fetches the endpoint by hostname.
  `web/src/auth/OidcManager.ts` (`getOidcManager()`) calls `fetchTenantConfig(window.location.hostname)`
  on every cold start. `ProtectedRoute.tsx` and `OidcCallbackPage.tsx` both use `getOidcManager()`.

The implementation is functionally correct for its stated design assumption:
**subdomain-per-tenant** routing (e.g. `acme1.localhost` → `bpm-acme1` realm). The UAT
acceptance criteria in the requirements document use the same assumption
(`GET /api/tenant-config?host=acme1.localhost`).

## Actual Root Cause

**Category A — Logic error / design gap in shared-hostname environments.**

When Alice navigates to `http://127.0.0.1:8080` after her tenant is onboarded:

1. `window.location.hostname` = `127.0.0.1`
2. Frontend calls `GET /api/tenant-config?host=127.0.0.1`
3. Backend queries `tenant_hostnames WHERE hostname = '127.0.0.1'` → no match
   (the onboarding registered `pl-tenant-{uuid}.example.com`, not `127.0.0.1`;
   furthermore, `tenant_hostnames.hostname` has a UNIQUE constraint so `127.0.0.1`
   can only ever be bound to one tenant regardless)
4. Endpoint falls back to returning `bpm-default` realm
5. OidcManager (cached singleton) initialises with `bpm-default` authority
6. Alice is redirected to `http://localhost:8081/realms/bpm-default` login
7. Alice's credentials are in the `swiftroute` realm — authentication fails

**Alice is effectively locked out of the BPM console despite a successful onboarding.**

## Confirmed Facts

| Check | Result |
|---|---|
| `src/api/routes/tenant_config.zig` exists | CONFIRMED — queryRealmByHostname + JSON response |
| Route registered in `src/main.zig` | CONFIRMED — line 403 |
| `web/src/auth/tenantConfig.ts` fetches endpoint | CONFIRMED — line 18 |
| `getOidcManager()` uses dynamic config | CONFIRMED — OidcManager.ts lines 41-46 |
| `tenant_hostnames` has UNIQUE hostname constraint | CONFIRMED — migration schema |
| No hostname binding exists for `127.0.0.1` | CONFIRMED — no INSERT; onboarding registers `.example.com` |
| OidcManager cache means wrong realm is reused | CONFIRMED — `_resolvedManager` singleton, set once on cold start |

## Missing Feature

There is no **realm hint mechanism** — no way for the frontend to specify which Keycloak
realm to use when hostname-based discovery returns the default tenant.

The requirements do not address single-hostname / local-development access by tenant users.
The SHOULD requirement TD-UI-03 (parse `iss` from token to detect realm) only helps
*post*-login; it cannot help Alice get to the correct Keycloak login page in the first place.

## Recommended Fix (for CODE-DESIGNER)

### Backend (src/api/routes/tenant_config.zig)
- Add optional `?realm=<slug>` query parameter.
- When `realm` is present, query: `SELECT idp_realm_id FROM tenant WHERE slug = $1 LIMIT 1`.
- If found, return that tenant's OIDC config. Skip hostname lookup entirely.
- Fallback order: realm param → hostname lookup → default.

### Frontend (web/src/auth/tenantConfig.ts)
- Before hostname fetch, read `new URLSearchParams(window.location.search).get('realm')`.
- If present, call `GET /api/tenant-config?realm=<slug>` instead of `?host=<hostname>`.
- Store resolved config in `sessionStorage` under key `bpm_realm_hint` so subsequent
  SPA navigations within the session reuse it (avoids the singleton cache issue).
- On cold start (no sessionStorage entry), fall through to current hostname logic.

### Onboarding Result Page (web/src/pages/admin/onboarding/OnboardingResultPage.tsx)
- Add a "Open your workspace" button/link that navigates to:
  `${window.location.origin}/?realm=${result.slug}`
- This gives Alice a single-click path to the correct Keycloak realm login without
  requiring DNS configuration.

### Security note
The `?realm` parameter selects which Keycloak realm the browser is redirected to for
login. It does not bypass authentication, grant access tokens, or change what the Keycloak
realm enforces. The parameter is equivalent to typing a realm URL in a browser — it is
not a privilege escalation path.

