issues_found:
  - severity: BLOCKER
    description: >-
      The design's §Public interface changes scopes killIdleConnections to
      application_name LIKE '<effective>%' while the default effective value is
      GetTestApplicationName() == 'bpm-test-'. This matches harness B's distinct
      bpm-test-<uuid-b> session, so harness A still terminates B. The test plan
      contradicts PostgreSQL LIKE semantics when it says the filter matches B
      but must not terminate it. Redesign must generate one stable owner tag per
      OS test process, assign that same owner tag to every connection opened by
      that process, and bind killIdleConnections to the caller's exact owner tag
      (or an equivalently safe ownership predicate).
  - severity: BLOCKER
    description: >-
      Acceptance criterion (b) requires concurrent test-integration execution,
      but §Optional cross-process test explicitly defers the only real
      cross-process regression. The two-harness same-process test cannot prove
      separate processes do not terminate each other, particularly while each
      harness currently receives a distinct UUID. The required regression must
      launch or coordinate two independent test processes and assert neither
      receives SQLSTATE 57P01/error.ConnectionFailed.
  - severity: MAJOR
    description: >-
      The design leaves two security-sensitive implementation choices open:
      §Public interface changes says SET application_name interpolation and
      parameterized SELECT set_config are both acceptable, while §Implementation
      notes leaves the choice to BACKEND-DEV; it likewise interpolates the
      optional prefix into LIKE SQL. This violates implementation-without-
      ambiguity and the prepared-statement rule. Specify one parameterized
      set_config implementation and one bound predicate with validated values.
  - severity: MAJOR
    description: >-
      The Type E artefact contains implementation code, including a fenced SQL
      query in §Current structure, concrete std.fmt.allocPrint/conn.exec body
      steps, exact Zig call-site statements, and a full Zig documentation-comment
      patch. Type E validation permits signatures and behavior descriptions, not
      function bodies or implementation patches.
  - severity: MAJOR
    description: >-
      The error taxonomy does not define a concrete failure contract for the
      pg_terminate_backend self/ownership guard. It says the pid guard 'should
      never trip' and would be a no-op, but does not specify how an ownership
      mismatch is detected, named, logged, or propagated. The corrected exact-
      owner predicate needs an explicit guard behavior and error/logging contract.
  - severity: MAJOR
    description: >-
      The mandatory completeness checklist requires a data-flow diagram. The
      design has prose under §State transitions but no ASCII or Mermaid data-flow
      diagram showing connection tagging, ownership selection, cleanup query,
      and concurrent-process boundaries.
  - severity: MINOR
    description: >-
      The function name GetTestApplicationName is capitalized unlike Zig's
      lower-camel function convention. The requested signature is present, so
      this is not independently gate-blocking, but rework should use a consistent
      public API name if the issue contract permits it.
