summary: >-
  Validated the Type E design at src/design/iss0602_test_isolation.md. The
  mandatory lint passed, but the hard gate failed because the proposed
  application_name predicate matches every bpm-test connection rather than
  only connections owned by the caller, so the two-harness regression test
  would terminate harness B instead of proving isolation. The design also
  leaves security-sensitive SQL construction and the SET mechanism ambiguous,
  and it contains implementation-level Zig/SQL snippets despite the Type E
  prose-only requirement.
