summary: >-
  Rework 1 on Step 2a to clear the SECURITY-REVIEWER Step 2c hard gate for
  PRM-02..05 (promotion pipeline). Fixed all three findings. BLOCKER 1
  (INV-1): promotion_reviews is now tenant-isolated — migration 096 is marked
  `-- scope: tenant_only` (per-tenant provisioning only, never public),
  GBL-143 drops the historical public shadow, and promotion_reviews was added
  to BUSINESS_TABLES in both tools/lint_migration_schema.py and the
  tnt_schema_isolation_test.zig runtime-isolation list (21 -> 22 tables).
  BLOCKER 2 (INV-2): handleApproveReview no longer accepts approved_by from
  the request body — the approver and the DEFINITION_PROMOTION_APPROVED event
  actor are derived from the authenticated actor (actor.user_id) server-side,
  and the self-approval gate now compares two server-side values; any extra
  body field (including approved_by) returns 422 UNKNOWN_FIELD. MAJOR
  (INV-1/INV-6): a single owner-tenant decision (the review row's tenant_id =
  target tenant) is now enforced on every promotion path — submitReview inserts
  under the target tenant's schema, and approveReview/rejectReview/
  markReviewApplied/markReviewFailed/supersedeReview switch to the review's
  owner tenant before their DB work, so DEFINITION_PROMOTION_REJECTED/
  _APPROVED/_APPLIED are all written under the same owner tenant.
  markReviewApplied now records the authenticated applying principal as the
  DEFINITION_PROMOTION_APPLIED event actor. Verified: zig build check exit 0
  (compile + scoped fmt), lint_migration_schema 0 violations,
  lint_sql_table_refs OK, lint_sql_param_types 0 issues, migrations applied to
  bpm_test (GBL-143 in public pass; 096 applied to tenant_default), and
  test-integration-tnt exit 0 with the updated 22-table isolation list.
