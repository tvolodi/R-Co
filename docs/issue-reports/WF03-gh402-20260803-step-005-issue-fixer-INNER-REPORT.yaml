    - file: "tests/integration/exp103_instance_waits_test.zig"
      literals_seen: ["e1030100-0000-0000-0000-000000000001", "e1030100-0000-0000-0000-000000000000", "e1030100-0000-0000-0000-000000000002", "e1030200-0000-0000-0000-000000000001", "e1030200-0000-0000-0000-000000000000", "e1030200-0000-0000-0000-000000000002"]
