    use_for: "textual SQL parameters (e.g. ::text casts, parameterized pg queries, JSON bodies)"

root_cause:
  category: "test-fixture-quality"
  statement: >
    Integration test files INSERT hardcoded 16-byte/36-byte UUID literals
    directly into SQL fixture statements. When two test files (or two test
    blocks within a file) reuse the same literal in the same shared
    bpm_test database, the second INSERT collides via unique-constraint
    23505 or overwrites prior data, contaminating the test environment.
    Per INV-TI-3, all test fixtures must use per-test UUIDs generated
    fresh at the start of each test block.
  evidence_samples:
    - file: "tests/integration/db_integration_test.zig"
      literals_seen: ["db0301aa-0000-0000-0000-000000000001", "db0301bb-0000-0000-0000-000000000001", "db0302cc-0000-0000-0000-000000000001", "db0302dd-0000-0000-0000-000000000001", "acac0000-0000-0000-0000-000000000002"]
    - file: "tests/integration/ext02_webhook_dispatch_test.zig"
