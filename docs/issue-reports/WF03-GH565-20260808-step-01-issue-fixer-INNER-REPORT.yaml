    - file: src/repository/service_catalog.zig (line 155)
      description: registerService does SELECT id FROM public.tenant WHERE id = $1::uuid before INSERT
    - file: src/repository/service_catalog.zig (line 478)
      description: updateServiceScope calls public.bpm_active_defs_for_service via pool connection
    - file: src/repository/service_catalog.zig (line 543)
      description: deleteService calls public.bpm_active_defs_for_service via pool connection
    - file: tests/integration/helpers.zig (TestHarness)
      description: h.conn is a transaction-bound connection; INSERTs are uncommitted
    - file: tests/integration/svc04_admin_api_test.zig (lines 391-440, 660-720)
      description: TC-SVC-04-06 and TC-SVC-04-08 already use pool.acquire()/release pattern for process_definitions inserts
  cross_check:
    - "TC-SVC-04-01, 03, 04, 07, 11, 12 PASS — none require pre-existing fixture tenants"
    - "TC-SVC-04-06 PASS — uses pool.acquire() for process_definitions, isolates correctly"
    - "TC-SVC-04-08 PASS in isolation — uses pool.acquire() for process_definitions"
fix:
  category: A-test-fix
  pattern: >
    Replace h.conn.exec INSERT into public.tenant with a helper that acquires a
    pool connection, runs the INSERT, and releases the connection. Pattern:
    1. acquire pool connection
    2. INSERT INTO public.tenant ...
    3. release connection
    The committed row is then visible to other pool connections under
    READ COMMITTED isolation.
  affected_tests:
    - TC-SVC-04-02: register tenant-scoped (line 234) — needs tenant in public.tenant
    - TC-SVC-04-05: update scope (line 282) — needs tenant in public.tenant
    - TC-SVC-04-09: list excludes other tenants (line 605) — needs two tenants
    - TC-SVC-04-10: admin list returns all (line 681) — needs tenant in public.tenant
  unaffected_tests:
    - "TC-SVC-04-06 (line 372) — already uses pool.acquire() for process_definitions"
    - "TC-SVC-04-08 (line 502) — already uses pool.acquire() for process_definitions"
