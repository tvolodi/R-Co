summary: >-
  Diagnosed the 42-test integration failure cluster as test-infrastructure drift,
  not application logic. The shared db_test database has a migration-ledger/schema
  mismatch and leaked LEGACY_RLS fixture tenants; affected tests consequently see
  missing columns/tables, unprovisioned tenant schemas, stale constraints, or the
  iss503 pre-flight cutoff. The issue is a BLOCKER under the Green-Main Gate.
root_cause:
  type: test-infrastructure-drift
  details: >-
    Category F/environment-configuration: the live db_test migration ledger is
    inconsistent with the repository baseline (public.schema_migrations reports
    1 row while migrations/ contains 97 SQL files), and prior zig build migrate
    output recorded every migration as skip in scratch/WF03-gh364-20260801-step03e/_build_migrate_final.log
    lines 1-74. The schema probe reports only public and tenant_default schemas and
    51 public tables, while tenant_rows.txt reports 10 tenants: 1 SCHEMA default
    plus 9 LEGACY_RLS test fixtures. The default harness seed in
    tests/integration/helpers.zig does not set tenant_type='test', and
    tools/clean_test_db.py deletes only tenant_type='test' rows, so production-
    defaulted fixture rows leak into later runs. This directly matches
    test_infrastructure_guide.md §3 INV-TI-1/INV-TI-2 and §10's anti-pattern
    about bare public.tenant fixtures. Evidence clusters: A webhook tests at
    _integration_final.log lines 13213-16646 include invalid UTF8/missing-contract
    failures; B tenant isolation at lines 6384-6484 and 38774-38845 reports missing
    events and public-only search_path; C ISS-503 cutoff at lines 8713-8717 reports
    one LEGACY_RLS tenant; D ADP/OIDC contract tests at lines 23258-35661 report
    absent expected migration effects; E service/entity/env tests at lines
    38865-39030 and 38985-42354 report missing scope/realm columns and leaked
    production tenant rows. The failure therefore cannot be trusted as evidence
    about application behavior until baseline and fixture isolation are repaired.
