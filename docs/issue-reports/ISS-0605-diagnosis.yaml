severity: MAJOR
category: test-environment data hygiene — same half-provisioned state as GH-443/ISS-0140

# ---------------------------------------------------------------------------
summary: |
  C4 schema baseline fails because the shared db_test database (port 5434)
  holds 5 `public.tenant` rows with `storage_mode='SCHEMA'` and slug pattern
  `tenant-<uuid>` that were inserted by an integration test binary WITHOUT a
  matching `public.tenant_schemas` registration or Postgres `tenant_<uuid>`
  schema — the exact half-provisioned state previously filed as GH-443
  / ISS-0140 (closed 2026-08-05). `tools/clean_test_db.py` already contains a
  defensive DELETE for this exact state (lines 332-336), but `clean_test_db`
  is not part of the `zig build test-env-verify` pipeline, so the orphans
  survive every baseline run until an operator runs `clean_test_db.py` (or
  a successful `zig build clean-test-db` step) by hand.

# ---------------------------------------------------------------------------
