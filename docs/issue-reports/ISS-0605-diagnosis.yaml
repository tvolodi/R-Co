prevention:
  test_design: |
    - Any new test that inserts a public.tenant row with storage_mode
      'SCHEMA' MUST co-locate a bpm_provision_tenant_schema() or
      provisionTenantSchema() call within the same fn scope, or assert
      `slug LIKE 'tc-%'` to opt out of C4 (C4 must be taught to
      exempt tc-% slugs — see "gate hardening" below). Add to
      docs/guides/test_developer_guide.md as a hard rule.
  gate_hardening: |
    - verify_test_env.py's C4 must self-heal: it should call
      clean_test_db.py BEFORE verify_schema_baseline.py --check-tenants
      in every run, so transient orphan rows never block the gate.
    - The defensive DELETE in clean_test_db.py (lines 332-336) is the
      canonical remediation and must be invoked by the test gate, not
      only by operators.
  monitoring: |
    - tools/verify_schema_baseline.py should emit a structured
      [WARN] (not [FAIL]) line when it finds orphans whose slug is
      `tc-%`, `svc%`, `env%`, `exp%`, `adp%`, `webhook%`, or matches
      the existing --include-fixtures patterns — those are
      operator-curated and may be left alone, but their presence
      should be visible to operators running the gate.
  documentation: |
    - Add a "Test fixture invariant: public.tenant ⇔ public.tenant_schemas
      ⇔ Postgres schema" entry to docs/anti-patterns.md with the
      half-provisioned-state diagnosis and the link to this ISS.
    - Update docs/guides/test_developer_guide.md §11 (test isolation
      rules) to mandate co-location of provisionTenantSchema() with
      storage_mode='SCHEMA' INSERTs.

