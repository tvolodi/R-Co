# ---------------------------------------------------------------------------
root_cause:
  direct_cause: |
    5 `public.tenant` rows exist with `storage_mode='SCHEMA'`, slug pattern
    `tenant-<uuid>` (matches the deterministic slug derived from
    `provisionTenantSchema()` step 6a's INSERT), `tenant_type='production'`,
    status='ACTIVE', and created_at between 2026-08-07T08:25:39Z and
    2026-08-07T08:25:49Z. NONE of these 5 rows has a matching
    `public.tenant_schemas` entry, and NONE has a matching
    `information_schema.schemata` schema. They are foreign-keyed to no
    other table (public.tenant has no tenant_schemas FK). Verified live
    against the test database at BPM_TEST_DB_URL=postgres://bpm:bpm@localhost:5434/bpm_test:
      SELECT count(*) FROM public.tenant WHERE storage_mode='SCHEMA'  →  6
      SELECT count(*) FROM public.tenant_schemas                       →  1
      SELECT count(*) FROM information_schema.schemata
        WHERE schema_name LIKE 'tenant_%'                              →  1
    The single tenant_schemas row is the legitimate `tenant_default` entry
    (slug='default'); the 5 `tenant-<uuid>` rows are orphans.
  root_cause_class: |
    (1) Caller omission: integration test fixtures insert `public.tenant`
        rows but never call `bpm_provision_tenant_schema()` /
        `provisionTenantSchema()`, so the Postgres schema and the
        `tenant_schemas` registry row are never created.
    (2) Cleanup incompleteness: `clean_test_db.py` has a defensive DELETE
        for exactly this state (lines 332-336), but it is a manual /
        `zig build clean-test-db` step, NOT a precondition of
        `zig build test-env-verify`. The 5 orphans have survived every
        baseline run since they were created ~3 hours before this handoff.
  why_it_recurred: |
    ISS-0140 (GH-443) closed the same defect on 2026-08-05 by adding the
    defensive DELETE in `clean_test_db.py`. That fix removes the orphans
    on the next manual cleanup, but it does NOT prevent the underlying
    caller-omission bug from producing new orphans, nor does it make the
    `zig build test-env-verify` gate self-heal — it only narrows the
    window. Five new orphans have now accumulated, confirming the gap.
  why_gbl_116_gbl_123_did_not_catch_it: |
    GBL-116 pre-flight requires tenant_schemas.migrations_applied_at
    IS NOT NULL for every public.tenant row; the orphans have no
    tenant_schemas row at all, so GBL-116 would trip on them IF applied to
    db_test — but GBL-116 itself only ran on production-shaped databases
    during its own migration. GBL-123 narrows further to non-tc-%
    production LEGACY_RLS rows; the orphans are SCHEMA-mode and tc-%
    pattern is NOT used (their slug is `tenant-<uuid>`, not `tc-<x>`), so
    GBL-123's pre-flight also did not fire.

