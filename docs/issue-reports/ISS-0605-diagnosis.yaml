      rows via the lines 332-336 sweep. Baseline now reports
      [OK] check_tenant_schemas_consistent.
  - step: 4
    action: |
      Confirm test-env-verify gates on a clean DB.
    command: "zig build test-env-verify"
    expected: "exit 0, all checks C0..C7 PASS"

# ---------------------------------------------------------------------------
candidate_fix:
  decision: |
    The 5 orphans are immediate data-residue, not a code defect. Apply a
    narrow, safe, self-healing fix that:
      (a) Removes the current orphans via the existing
          `tools/clean_test_db.py` sweep (no new DELETE statement
          authored; the file already handles this state).
      (b) Makes the C4 gate self-heal by having `tools/verify_test_env.py`
          call `clean_test_db.py` BEFORE `verify_schema_baseline.py`
          runs in --check-tenants mode. This closes the recurrence
          window: any future half-provisioned row is removed on the
          next `zig build test-env-verify`, so a transient race
          (provisioning crash, killed test, parallel binary) never
          gets to block the gate.
      (c) Lint-level guard: tests/integration/*_test.zig that insert
          public.tenant rows with `storage_mode='SCHEMA'` MUST also call
          `bpm_provision_tenant_schema()` (or `provisionTenantSchema()`)
          so the row is born in a consistent state. Add a
          `tools/lint_test_tenant_provisioning.py` that scans
          tests/integration for the `INSERT INTO public.tenant ... 'SCHEMA'`
          pattern and asserts a co-located `bpm_provision_tenant_schema`
          or `provisionTenantSchema` call within the same fn scope.
  scope: |
    - Modify tools/verify_test_env.py: pre-step
      `clean_test_db.py` (or its no-op guard if BPM_TEST_DB_URL is not
      set) immediately before C4's `verify_schema_baseline.py --check-tenants`.
      Place the call BEFORE C3, because C3 also touches the test DB and
      reading the test DB after the sweep is the new invariant.
    - Optionally --auto-fix flag for verify_schema_baseline.py that
      RE-runs `clean_test_db.py --include-fixtures` when C4 fails, so a
      one-command path exists for `zig build test-env-verify` remediation.
    - Add tests/integration/iss0605_orphan_self_heal_test.zig (a
      regression test that inserts a single half-provisioned
      public.tenant row, runs the verify_test_env.py C4 step end-to-end,
      and asserts the row is gone and C4 reports OK).
    - Add tests/integration/lint_tenant_provisioning_test.zig that
      invokes the new lint script over a fixture tree containing a
      known-bad and a known-good test file and asserts the right
      findings.
  why_not_just_remove_the_orphans: |
    Deleting the 5 rows satisfies C4 today but does NOT prevent the same
    state from recurring on the next test run, as ISS-0140 demonstrated:
    its resolution explicitly noted "the underlying provisioning-vs-cleanup
    race … is a larger concurrency undertaking, tracked separately if it
    recurs" — and it has recurred. The minimum viable fix MUST (a) close
    the recurrence window by making C4 self-heal, and (b) add a regression
    test that fails if the gate ever regresses to a permanent FAIL.
  what_we_are_NOT_changing: |
    - No new migration SQL. The asymmetry direction this issue reports
      (public.tenant row, no tenant_schemas row) is the OPPOSITE of what
      migration 1135 backfills, and adding a new migration to clean up
      runtime test-fixture data leaks migration-runner concerns into
      test-environment hygiene — wrong layer.
    - No change to `provisionTenantSchema()` Step 4 / Step 6a atomicity
      (a single-tx fix). The earlier ISS-0140 already judged that out of
      scope for a MINOR data-hygiene issue; it remains out of scope here.
      If atomicity becomes urgent, file a separate ISSUE — do not bundle.
    - No deletion of legitimate `public.tenant` rows. The sweep targets
      `slug != 'default'` AND `storage_mode='SCHEMA'` AND
      `NOT EXISTS (tenant_schemas)` — three predicates that
      collectively identify only the orphan state.

