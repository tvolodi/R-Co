summary: >-
  WF-03 Step 2 design artefacts produced for the two remaining code blockers
  surfaced by the Step 3 verification of GitHub #364 / ISS-0106: GH-366
  (GitHub #366 / ISS-0107 regression at a different acquire site —
  `tests/integration/helpers.zig:99`) and GH-374 (Windows bare-`python3`
  Microsoft Store AppExecutionAlias failure in
  `tests/integration/tnt_schema_isolation_test.zig` lines 591-593 and
  659-661). Both classified as Type E (cross-cutting; novel design work —
  function-internal timeout scoping for GH-366, cross-platform subprocess
  interpreter resolution with explicit ownership/lifetime for GH-374). One
  design artefact per blocker. No source, build, test, or migration files
  modified. No implementation code. Both designs pass the mandatory design
  lint (MAJOR=0, BLOCKER=0; only MINOR E030 noise from legitimate
  references to the real `public.schema_migrations` / `public.events` test
  SQL content — the linter cannot distinguish canonical platform tables
  and quoted test fixture content from business-table references, which is
  a known over-flag cataloged in the inner report for DOC-UPDATER's later
  housekeeping pass). Both designs explicitly:
  (1) preserve the previously-approved #364 barrier from
      `src/design/fix-ISS-0106.md` (build.zig structure and
      `tests/integration/test_iss503_rls_removal.zig` doc comment block are
      untouched by both designs);
  (2) reuse the proven ISS-0107 Rework-1 pattern only where the source
      AND the captured log evidence validate it (the line-99 bracket
      mirrors the line-487 bracket byte-for-byte on the same connection
      type and timeout values, not a re-derivation);
  (3) reject blanket timeout inflation, retries, sleeps, second lock
      keys, global integration serialization, env-bypassing workarounds,
      and MSW / HTTP / subprocess mocking (none of which appear in either
      design);
  (4) specify fresh full-suite and focused test verification including
      the same `select-string` log-scan pattern already used in the
      Step 3 inner report, plus TC-DB-01-01/02 actual passing output as
      the hard acceptance bar for the parent run.
classification:
  GH-366: E
  GH-374: E
  category: "Type E for both — novel cross-cutting work (function-internal lock_timeout scoping for GH-366; cross-platform subprocess interpreter resolution with explicit ownership/lifetime for GH-374). Neither blocker maps to a CRUD endpoint (Type A), list page (Type B), migration + test pair (Type C), or React Flow node (Type D). Per templates/lego-catalog.md §Selection rules rule 5 ('Type E otherwise'), both are unambiguously Type E. No Type A-D parameter file is generated; the design artefacts are prose at src/design/fix-ISS-0110.md and src/design/fix-ISS-0111.md."
classification_rationale:
  GH-366: "Cross-cutting: Postgres session-level vs. statement-level vs. transaction-local timeout semantics + lock-key disjointness + failure-path correctness across TestHarness.init()'s function boundary. The proven ISS-0107 Rework-1 pattern (lines 486-488) is the model, but applying it to the OTHER acquire site in the same function (line 99) requires explicit reasoning about why the same bracket works at line 99 but not at line 144 (different lock key, different critical-section width), and why 'duplicate' is not 'redundant' here. The design is novel, not a template instantiation. Type E."
  GH-374: "Cross-cutting: cross-platform subprocess resolution (Windows AppExecutionAlias hijack vs. POSIX `/usr/bin/python3` semantics) + multi-callsite consistency (two `std.process.run` argv arrays must use the same resolved path) + lifetime-of-allocated-path ownership (the helper returns a `[]const u8` whose ownership and freeing responsibility is explicit and call-site-managed via `defer alloc.free(python)`). The strict 3-step priority order (env override → venv → bare fallback) is a domain-specific design choice that the lego catalog does not template. Type E."
