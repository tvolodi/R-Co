  The cited log file scratch/WF03-gh375-20260801/test-runner-step5c/zig_test_integration.log
  is UTF-16 LE encoded. The byte offsets 1480582 and 1480767 referenced in the handoff
  correspond to character offsets 740291 and 740384 in the decoded log. At those offsets
