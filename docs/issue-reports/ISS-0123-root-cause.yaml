prevention:
  - Add a search-and-fail lint to tools/lint_sql_table_refs.py (or equivalent) that walks
    src/ and tests/integration/ for references to legacy table names (dead_letter_queue,
    form_schema_registry, audit_log, etc.) and reports every hit. Run it in zig build
    before tests.
  - Add a tearDown/cleanup helper to tests/integration/helpers.zig that is called automatically
    after any test that installs a db trigger without a savepoint wrapper. Document the
    invariant that any CREATE TRIGGER / CREATE FUNCTION inside an integration test must be
    wrapped in a savepoint with a defer that drops the trigger/function before commit.
  - Run `SELECT column_name FROM information_schema.columns WHERE table_schema = current_schema()
    AND table_name = 'dead_letter_items'` as part of the test infrastructure health check
    and fail fast if `source_ref` is missing.

