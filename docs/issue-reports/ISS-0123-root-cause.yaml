recommended_fix: |
  TWO-PART FIX (one source-code change, one infra fix):

  1. PRODUCTION CODE (Cluster B — root fix):
     Rename every reference to `dead_letter_queue` in src/dlq/store.zig (lines 148, 262, 361,
     408, 416, 428, 461, 511, 625, 691, 746) to `dead_letter_items` to match the rename done
     in migration 072. Search src/event_store/, src/admin/, src/dlq/, src/api/ for any
     remaining `dead_letter_queue` literals (excluding src/api/middleware/audit.zig and
     migration files) and replace. This is the canonical name per migration 072.

  2. DLQ INTEGRATION TESTS (Cluster B — secondary fix):
     Rename `dead_letter_queue` to `dead_letter_items` in tests/integration/obs05_dlq_test.zig
     (lines 33, 37, 73, 234, 344, 357, 459) and tests/integration/obs06_alerts_test.zig
     (lines 32, 56) for consistency. Tests must use the post-rename canonical name.

  3. TEST ISOLATION (Cluster A — secondary fix):
     tests/integration/obs05_dlq_test.zig lines 427-449 install trg_bpm_test_fail_audit_insert
     on db_test without a wrapper transaction. Move trigger creation inside a savepoint and
     add an EXPLICIT cleanup at the start of the next test or use a dedicated test schema
     for OBS-05 audit-failure scenarios. Currently the trigger leaks into neighbouring tests
     (adp09_tamper_evident_audit_chain_test, oidc16_26_agent_lifecycle_foundations_test).

  4. DB SCHEMA RECONCILIATION (Cluster B — infra fix):
     Verify the test database has the dead_letter_items table with all columns from migration 021
     in the search_path. If a stale public.dead_letter_queue still exists with the pre-021
     column set (because GBL-073 was skipped due to migration_window_active=TRUE), set
     public.onboarding_registry.migration_window_active=FALSE and re-run zig build migrate
     so GBL-073 drops the stale relation.

  The most likely single-shot resolution is (1) + (2): once src/dlq/store.zig points to
  dead_letter_items and the test fixtures agree, Cluster B disappears. Cluster A is
  addressed by (3) without any production change.

