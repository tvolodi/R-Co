corrected_hypothesis: |
  The handoff's hypothesis that src/db/audit.zig (Cluster A) and tests/integration/iss202_merge_atomicity_test.zig +
  iss203_idempotency_keys_test.zig + iss205_webhook_outbox_test.zig (Cluster B) are the
  source of the source_ref C42703 errors is INCORRECT:

  - src/db/audit.zig does not exist. Audit code lives in src/obs/audit.zig and src/api/middleware/audit.zig.
  - src/events/store.zig does not exist. Event store code lives in src/event_store/store.zig.
  - migrations/GBL-102_audit_immutability.sql and GBL-103_audit_immutability_guard.sql do NOT exist.
    The actual audit immutability migrations are 020_obs03_audit_entries.sql and 051_xc02_audit_immutability.sql.
  - The `source_ref` column does NOT exist in the event_store table. It exists in
    dead_letter_queue (added by migration 021, preserved through rename to dead_letter_items by migration 072).
  - Tests iss202 / iss203 / iss205 do NOT reference `source_ref` anywhere. Their
    separate failures are unrelated infrastructure drift (FK violation on variable_schemas,
    check constraint on webhook_deliveries, DebugAllocator leaks).

actual_root_cause: |
  Both the P0001 audit-guard cluster and the C42703 source_ref cluster originate from
  the DLQ (dead-letter queue) subsystem, not from event_store / iss202-203-205.

  - CLUSTER A (P0001) is concentrated in tests/integration/obs05_dlq_test.zig:TC-OBS-05-INT-01
    (lines 427-449) which DELIBERATELY installs a BEFORE-INSERT trigger `trg_bpm_test_fail_audit_insert`
    that raises P0001 'forced audit insert failure for test'. The subsequent P0001
    `audit_entries is immutable` raise is the `bpm_audit_immutable_guard()` from migration 020,
    re-fired when the failed INSERT bubbles through `bpm_audit_on_mutation()` line 43.
    The 2 extra P0001 occurrences in tests/integration/adp09_tamper_evident_audit_chain_test:TC-ADP-09-01
    and tests/integration/oidc16_26_agent_lifecycle_foundations_test:TC-OIDC-22-01 are caused by
    the same root cause: the obs05_dlq_test installs the trigger with NO cleanup `defer`, so it
    leaks into the next test processes via shared db_test state. The defer blocks at
    obs05_dlq_test.zig:448-449 only clean up if the test's main flow runs to completion.

  - CLUSTER B (C42703 source_ref) is concentrated in tests/integration/obs05_dlq_test.zig:TC-OBS-05-INT-01/03
    and tests/integration/obs06_alerts_test.zig:TC-OBS-06-INT-05. Both tests (and the production
    src/dlq/store.zig) INSERT into `dead_letter_queue`. In the active test database, this table
    exists in the search_path schema but lacks the `source_ref` / `item_type` columns added by
    migration 021_obs05_dead_letter_context.sql. PostgreSQL returns C42703
    'column "source_ref" of relation "dead_letter_queue" does not exist'. This happens because
    either (a) the table was created in a schema where migration 021 was NOT applied (fresh
    public schema or a partial-migration tenant), or (b) the search_path routes through
    public.dead_letter_queue which GBL-073 should have dropped but in some databases still exists
    with the pre-021 column set.

