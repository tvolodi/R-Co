deallocation_analysis:
  cleanup_function_exists: true
  cleanup_function_location: src/definition/store.zig:1318
  cleanup_function_name: freeDefinitionGraph
  cleanup_implementation: |
    The function properly frees all allocated memory:
    - Iterates through graph.nodes, frees id, label (optional), attributes (optional)
    - Frees graph.nodes array
    - Iterates through graph.edges, frees id, source, target, condition (optional), transform (optional)
    - Frees graph.edges array
  
  api_wrapper_exists: true
  api_wrapper_location: src/api/routes/definitions.zig:802
  api_wrapper_name: freeDefinition
  api_wrapper_implementation: |
    Frees all Definition-level allocations:
    - def.name
    - def.version
    - def.description (optional)
    - def.stage (optional)
    - calls freeDefinitionGraph(allocator, def.graph)
  
  problem: |
    The cleanup functions exist but are NOT consistently called by all Definition consumers.
    Only src/api/routes/definitions.zig:handleGetById uses "defer freeDefinition(allocator, def)".
    Other load sites do NOT call cleanup.

ownership_analysis:
  struct_definition: src/definition/graph.zig:87-103
  struct_has_deinit: false
  ownership_model: |
    The Definition struct contains:
      - id: Uuid (value type, no allocation)
      - name: []const u8 (allocated by rowToDefinition)
      - version: []const u8 (allocated by rowToDefinition)
      - description: ?[]const u8 (allocated by rowToDefinition if present)
      - status: DefinitionStatus (enum, no allocation)
      - graph: DefinitionGraph (contains allocated slices)
      - created_by: Uuid (value type)
      - created_at, updated_at, archived_at: integers
      - stage: ?[]const u8 (allocated if present)
    
    DefinitionGraph struct (src/definition/graph.zig:81-84):
      - nodes: []const GraphNode (allocated array + each node has allocated strings)
      - edges: []const GraphEdge (allocated array + each edge has allocated strings)
    
    Ownership: The allocator passed to getById/create/getByName/getActiveByName/activate
    is expected to own all these allocations for the lifetime of the Definition. Caller
    MUST explicitly free them via freeDefinition() or freeDefinitionGraph().
    
    Problem: This contract is not enforced by the type system (no deinit method),
    and most callers are unaware of the requirement.

root_cause:
  primary: |
    parseGraphJson performs allocator.dupe() on 8 different fields per graph (5 required,
    3 optional) plus 2 array allocations. These allocations are returned as part of the
    DefinitionGraph which is embedded in the Definition struct. Neither DefinitionGraph
    nor Definition has a deinit method, so the compiler does not enforce cleanup.
    
    Callers must manually call freeDefinitionGraph() or the API wrapper freeDefinition(),
    but this requirement is not documented and most callers do not do it.
  
  secondary: |
    rowToDefinition (line 1396) also allocates name, version, description, stage strings
    separately from the graph allocations. These add 2-4 more allocations per Definition
    that also need cleanup via freeDefinition().

affected_callers:
  properly_cleaned:
    - location: src/api/routes/definitions.zig:80
      function: handleGetById
      cleanup: "defer freeDefinition(allocator, def)"
      note: "Only known caller that properly cleans up"
  
  leaking:
    - location: tests/integration/iss601_state_snapshots_test.zig:189
      function: TC-ISS-601-01
      issue: "const draft = def_store.create(...) - never freed"
    
    - location: tests/integration/iss601_state_snapshots_test.zig:201
