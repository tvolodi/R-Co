issue_id: ISS-0601-LEAK-001
github_issue: https://github.com/tvolodi/R-Co/issues/406
title: Memory leak in src/definition/store.zig parseGraphJson
discovered_in_run: WF03-gh401-20260803
diagnosis_date: 2026-08-03T10:46:13Z

symptom_summary: |
  Every Definition loaded with a non-empty graph_json field leaks memory.
  Tests/integration/iss601_state_snapshots_test.zig reports 48 leaks in TC-ISS-601-01
  and 42 leaks in TC-ISS-601-05. The leaks are for allocated strings (node IDs, labels,
  edge sources/targets, etc.) that are never freed.

