  potential_additional_leaks:
    note: |
      Any code path that calls def_store.create(), def_store.getById(),
      def_store.getByName(), def_store.getActiveByName(), or def_store.activate()
      without a corresponding freeDefinition() or freeDefinitionGraph() call will leak.
      
      Full search found 100+ potential call sites across the codebase. Manual audit
      required to identify all leakers.

fix_strategies:
  strategy_1:
    name: "Add Definition.deinit() method"
    implementation: |
      Add a public deinit method to the Definition struct in src/definition/graph.zig:
      
      pub fn deinit(self: Definition, allocator: std.mem.Allocator) void {
          allocator.free(self.name);
          allocator.free(self.version);
          if (self.description) |d| allocator.free(d);
          if (self.stage) |s| allocator.free(s);
          freeDefinitionGraph(allocator, self.graph);
      }
      
      This makes the cleanup contract explicit and allows idiomatic Zig cleanup:
      
      const def = try store.getById(allocator, id);
      defer def.deinit(allocator);
    
    pros:
      - Idiomatic Zig pattern
      - Type-enforced cleanup via compiler (defer expected)
      - Clear ownership model
    
    cons:
      - Requires updating ALL callers to add defer statements
      - Breaking API change (though internal to this codebase)
      - Need to audit 100+ call sites
    
    impact: HIGH - requires changes to every Definition load site

  strategy_2:
    name: "Use arena allocator in rowToDefinition/parseGraphJson"
    implementation: |
      Modify rowToDefinition and parseGraphJson to accept two allocators:
      - arena_allocator for all string dupes (owned by the Definition lifetime)
      - temp_allocator for temporary allocations
      
      Caller creates an ArenaAllocator, passes it to getById/create/etc, and
      deinits the arena when done with the Definition:
      
      var arena = std.heap.ArenaAllocator.init(allocator);
      defer arena.deinit();
      const def = try store.getById(arena.allocator(), id);
      // All allocations freed by arena.deinit()
    
    pros:
      - Single cleanup call (arena.deinit()) frees everything
      - No need to track individual allocations
      - Less error-prone than manual cleanup
    
    cons:
      - Changes function signatures (breaking change)
      - Arena grows with Definition size (might be wasteful for short-lived uses)
      - Still requires caller discipline (create arena, defer deinit)
    
    impact: HIGH - requires signature changes and caller updates

  strategy_3:
    name: "Document cleanup requirement + add helper"
    implementation: |
      1. Add clear documentation to all load functions stating that caller
         must call freeDefinition() when done
      2. Make freeDefinition() public in store.zig (currently in API only)
      3. Add lint rule or test to detect missing cleanup
      4. Fix all known leakers in this WF-03
    
    pros:
      - Minimal API changes
      - Allows incremental fixing
      - Preserves existing function signatures
    
    cons:
      - Relies on human discipline, not type system
      - Easy to miss in future code
      - No compile-time enforcement
      - Still requires auditing all call sites
    
    impact: MEDIUM - documentation + spot fixes

recommended_fix: strategy_1
recommendation_rationale: |
  Strategy 1 (add Definition.deinit()) is the most idiomatic Zig pattern and provides
  compile-time enforcement through the type system. The "defer x.deinit()" pattern is
  standard in Zig and immediately visible in code review. While it requires updating
  all callers, this is a one-time cost that prevents future leaks.
  
  Strategy 2 (arena allocator) would also work but changes function signatures more
  invasively and doesn't match the existing codebase pattern (most structs with
  allocations have deinit methods, not arena requirements).
  
  Strategy 3 (documentation only) is too weak - this issue demonstrates that
  undocumented cleanup contracts are easily missed.

implementation_steps:
  step_1:
    description: "Add Definition.deinit() to src/definition/graph.zig"
    code_location: "src/definition/graph.zig after line 103"
    code: |
      /// Free all allocations owned by this Definition.
      /// Must be called with the same allocator used to load the Definition.
      pub fn deinit(self: Definition, allocator: std.mem.Allocator) void {
          allocator.free(self.name);
          allocator.free(self.version);
          if (self.description) |d| allocator.free(d);
          if (self.stage) |s| allocator.free(s);
          
          // Free graph allocations
          for (self.graph.nodes) |n| {
              allocator.free(n.id);
              if (n.label) |l| allocator.free(l);
              if (n.attributes) |attrs| allocator.free(attrs);
          }
          allocator.free(self.graph.nodes);
          
          for (self.graph.edges) |e| {
              allocator.free(e.id);
              allocator.free(e.source);
              allocator.free(e.target);
              if (e.condition) |c| allocator.free(c);
              if (e.transform) |t| allocator.free(t);
          }
          allocator.free(self.graph.edges);
      }
  
  step_2:
    description: "Update all Definition load sites to call defer def.deinit(allocator)"
    priority: "Fix test files first (4-5 call sites), then API handlers (~8 call sites)"
    test_sites:
      - tests/integration/iss601_state_snapshots_test.zig (5 calls)
      - Other integration tests as discovered
    api_sites:
      - src/api/routes/definitions.zig (replace freeDefinition calls with def.deinit)
      - src/definition/export_import.zig
      - Any engine code that loads definitions
  
  step_3:
    description: "Remove the old freeDefinition wrapper from definitions.zig"
    note: "Keep freeDefinitionGraph in store.zig as a public helper if needed for partial cleanup"
  
  step_4:
    description: "Run memory leak detection to verify fix"
    command: "zig build test-integration-iss601 with leak detection enabled"

impact_assessment:
  memory_leak_severity: MAJOR
  leak_magnitude: |
    For a typical BPM process definition with 10 nodes and 12 edges:
    - Node IDs: ~10 strings × 8 bytes avg = 80 bytes
    - Node labels: ~10 strings × 20 bytes avg = 200 bytes (optional)
    - Node attributes: ~5 strings × 50 bytes avg = 250 bytes (optional)
    - Edge IDs: ~12 strings × 8 bytes avg = 96 bytes
    - Edge sources/targets: ~24 strings × 8 bytes avg = 192 bytes
    - Edge conditions: ~6 strings × 40 bytes avg = 240 bytes (optional)
    - Arrays: 2 × 8 bytes = 16 bytes
    - Total: ~1074 bytes per Definition load
    
    For the failing tests:
    - TC-ISS-601-01: 48 leaks reported → ~48-100 allocations × avg 20 bytes = ~1-2 KB
    - TC-ISS-601-05: 42 leaks reported → similar magnitude
  
  production_impact: |
    In production, this leak would accumulate with every Definition load:
    - API GET /definitions/:id - leaks on every request
    - Instance creation - loads Definition once per instance
    - Definition list operations - leaks one Definition per page item
    
    For a system loading 1000 definitions/hour:
    - 1000 × 1 KB = 1 MB/hour leaked
    - 24 MB/day
    - 8.7 GB/year (requires restart)
    
    This is a gradual memory exhaustion risk.
  
  test_impact: |
    Integration tests fail leak detection when run with ASAN or valgrind.
    Blocks ISS-601 acceptance because TC-ISS-601-01 and TC-ISS-601-05 both
    fail with leak reports.

prior_solutions:
