# Root Cause
root_cause:
  category: "migration-logic-error"
  summary: |
    GBL-128_exp501_secrets.sql (lines 67-76) attempts to add webhook_subscriptions.secret_ref
    column conditionally using `IF to_regclass('webhook_subscriptions') IS NOT NULL`. However:
    
    1. GBL-128 is a GBL-prefixed migration → runs ONLY against public schema per src/db/migrations.zig
    2. GBL-073 (GBL-112) dropped public.webhook_subscriptions at line 59
    3. Therefore GBL-128's IF check evaluates to FALSE and secret_ref is never added to public
    4. GBL-133_iss0112_schema_ledger_reconcile.sql (lines 200-204) attempts to fix this but
       only adds the column to public.webhook_subscriptions (which doesn't exist)
    5. Neither migration touches SCHEMA-mode tenant schemas (e.g., tenant_default)
    6. Result: secret_ref column is missing from webhook_subscriptions in all SCHEMA-mode tenant schemas
  
  technical_details:
    - GBL-128 guard condition: "IF to_regclass('webhook_subscriptions') IS NOT NULL"
    - Guard evaluates against current schema (public) where table was already dropped
    - GBL migrations have no mechanism to apply DDL to tenant schemas
    - Schema-per-tenant (SPT) migrations for tenant schemas are separate from GBL migrations

