# Resolution Strategy
resolution_strategy:
  approach: "Create corrective migration to add secret_ref to webhook_subscriptions in all SCHEMA-mode tenant schemas"
  
  implementation_steps:
    - step: 1
      description: "Create new migration file (e.g., migrations/NNN_iss0112_add_secret_ref_to_tenant_schemas.sql)"
      details: |
        Migration must:
        - Query public.tenant WHERE storage_mode='SCHEMA'
        - For each SCHEMA tenant, execute ALTER TABLE in their schema:
          ALTER TABLE <tenant_schema>.webhook_subscriptions
          ADD COLUMN IF NOT EXISTS secret_ref TEXT;
        - Use idempotent ADD COLUMN IF NOT EXISTS to handle re-runs
    
    - step: 2
      description: "Ensure migration is NOT GBL-prefixed (must run as regular numbered migration)"
      details: |
        Regular numbered migrations can use dynamic SQL to iterate over tenant schemas.
        GBL-prefixed migrations are restricted to public schema only.
    
    - step: 3
      description: "Test migration against current db_test state"
      details: |
        - Apply migration: zig build migrate
        - Verify: psql query confirms secret_ref exists in tenant_default.webhook_subscriptions
        - Run affected tests: zig build test-integration-ext02
    
    - step: 4
      description: "Backfill secret_ref values per GBL-128 pattern"
      details: |
        For existing rows in tenant webhook_subscriptions tables:
        UPDATE <tenant_schema>.webhook_subscriptions
        SET secret_ref = COALESCE(secret_ref, 'sec://tenant/' || <tenant_slug> || '/webhook/subscription-' || id::text)
        WHERE secret_ref IS NULL;

