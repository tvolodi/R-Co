  correction: >-
    The issue's "51 alloc sites / 12 errdefer" figure is OUTDATED and
    UNDERSTATED. transition.zig's production region (lines 1-2166, excluding the
    29 in-file test blocks) actually holds 110 allocation sites against 15
    errdefer guards. The ratio is worse than reported, not better. The figure was
    presumably counted before the EXP-301/302 effects work (60fae79) and the
