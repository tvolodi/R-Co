    unchanged and reinforced: errdefer coverage is sparse relative to allocation
    density, which is precisely why the leak class recurs.

parse_graph_json_defects:
  - id: PGJ-1
    severity: BLOCKER
    location: src/definition/store.zig:1327 and 1375
    defect: double-free of the std.json.Parsed value on the success path
    detail: >-
      Line 1327 registers `errdefer parsed.deinit()`. Line 1375 calls
      `parsed.deinit()` unconditionally just before the successful return.
      In Zig an errdefer does NOT run on the success path, so on success
      parsed.deinit() runs exactly once — that part is correct. The real defect
      is ordering: `parsed.deinit()` at 1375 is a plain statement, so if any
      code were later added between 1375 and the return that can fail, the
      errdefer would fire on an already-deinit'd Parsed. More immediately, the
      construct is fragile and inconsistent with the `defer`-based ownership
      used everywhere else in the file. Converted to a single `defer` so the
      lifetime is expressed once and cannot desynchronise.
  - id: PGJ-2
    severity: MAJOR
    location: src/definition/store.zig:1340-1348
    defect: partially-constructed node leaks on a mid-struct allocation failure
    detail: >-
      nodes_copy[i] is built from a struct literal with THREE fallible dupes
      (.id, .label, .attributes) evaluated before the assignment completes and
      before `nodes_built += 1` executes. If `.label`'s dupe succeeds and
      `.attributes`' dupe then fails, the `.id` and `.label` allocations are
      already made but nodes_built has not been incremented — so the errdefer at
      1331 frees only indices < nodes_built and never touches them. Both blocks
      leak. checkAllAllocationFailures lands a forced failure on exactly this
      index and reports the leak deterministically.
  - id: PGJ-3
    severity: MAJOR
    location: src/definition/store.zig:1363-1373
    defect: same partial-construction leak in the edges loop
    detail: >-
      Identical shape with FIVE fallible dupes (.id, .source, .target,
      .condition, .transform). A failure on the 3rd, 4th or 5th leaks the
      preceding 2-4 allocations for the same reason as PGJ-2. Additionally, when
      the edges loop fails, the nodes errdefer at 1331 correctly unwinds
      nodes_copy — so the nodes side is only leaky within its own partial row.

remedy:
  - Add allocation-failure tests for parseGraphJson using
    std.testing.checkAllAllocationFailures, covering a graph with optional
    fields populated (label, attributes, condition, transform) so the
    multi-dupe struct literals are exercised at every failure index.
  - Wire src/definition/store.zig into an addTest root so those tests actually
    run under `zig build test` — without this the tests are inert, which is the
    original ISS-0102/GH #428 defect repeated.
  - Fix PGJ-1/2/3 by building each struct field into a local with its own
    errdefer before assembling the struct, so every intermediate allocation is
    owned by a guard at all times.

