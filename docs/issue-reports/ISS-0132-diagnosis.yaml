severity: MAJOR
title: >-
  DebugAllocator leaks recur across 18 pipeline runs because no test exercises
  allocation-failure / error paths

summary: >-
  ISS-0132 is a CLASS defect: the leak signature returns because leaks live on
  allocation-failure and error paths that no test reaches. The remedy named in
  the issue is std.testing.checkAllAllocationFailures, which re-invokes a
  function once per allocation index with that allocation forced to fail, so
  every error path is exercised and any leak becomes a deterministic failure.

