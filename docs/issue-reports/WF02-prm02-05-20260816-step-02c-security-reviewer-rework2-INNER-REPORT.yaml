issues_found:
  - severity: MINOR
    invariant: "none (functional, not a security invariant)"
    description: >
      timestampToIso now returns a fixed "1970-01-01T00:00:00Z" placeholder
      (and ignores its argument), so `created_at` in the promotion-context
      response (handleGetPromotionContext) is no longer the review's creation
      time. The pre-existing code was equally broken — it returned a pointer to
      a local stack buffer AND the caller freed it (double defect: dangling
      stack pointer + free-on-string-literal segfault). TEST-DESIGNER's fix
      removes the crash but leaves the field constant. This is a functional
      regression on the reviewed data path, NOT an INV-1..INV-8 violation
      (server-populated field, no unauthorised data exposure, no authorisation
      signal). Recommend a follow-up to implement real ISO formatting (the code
      comment already carries the TODO).
  - severity: MINOR
    invariant: "none (robustness, not a security invariant)"
    description: >
      fillRandom ignores the return value of std.os.linux.getrandom. On Linux a
      failure (e.g. EINTR) would leave uuid_bytes partially undefined. impact is
      bounded: the bytes only feed a synthetic `promotion_id` used as an event
      idempotency key, not an access-control token, and getrandom(2) blocks
      rather than failing on entropy starvation for a 16-byte request. The
      function mirrors the pre-existing src/api/routes/onboarding.zig fillRandom
      pattern; all platforms use a CSPRNG (getrandom / RtlGenRandom
      (SystemFunction036) / arc4random_buf). Not a security-invariant violation.
