    schema_migrations shadows from any tenant schema still referenced in public.tenant at the
    time GBL-104 ran).
  alternative_path_not_taken: |
    If the precondition had been TRUE, the planned exact SQL (run in a single transaction
    against BPM_TEST_DB_URL = postgres://bpm:bpm@localhost:5434/bpm_test) would have been:
        BEGIN;
          SELECT pg_advisory_xact_lock(hashtext('gh359_drop_shadow_authorization'));
          DROP TABLE IF EXISTS tenant_default.schema_migrations;
        COMMIT;
    Followed by:
        REINDEX TABLE public.schema_migrations;    -- not strictly required, defensive
        ANALYZE public.schema_migrations;         -- not strictly required, defensive
