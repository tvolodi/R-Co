explicit_non_solutions_reasserted:
  - No sleep calls on the test path.
  - No retry-on-40P01 / deadlock-retry wrappers around any query, including db_integration_test.zig's COUNT(*).
  - No lock_timeout or deadlock_timeout inflation as a workaround.
  - No advisory-lock wrapping of db_integration_test.zig's COUNT(*) or TestHarness.init() alone — insufficient; ISS-503's raw external connection is not covered.
  - No change to vendor/pg/pg.zig driver behavior — pg.zig's readUntilReady() returns PgError.ServerError after ErrorResponse; no retry path or empty-success conversion exists.
  - No global serialization of all ~19+ test-integration binaries — over-reach; only the single raw-DDL outlier (ISS-503) needs to be ordered.
