root_cause_confirmed: true
root_cause_option_selected: "(a) modified — see mechanism_finding below. Neither pure declaration-order racing nor a panic-before-defer bug; the actual mechanism is a retry-on-every-init migration guard combined with a same-binary, whole-suite blast radius."

mechanism_finding: >
  TestHarness.init() (tests/integration/helpers.zig line 413) is NOT a
  one-time-per-binary bootstrap. Every single call — and every one of
  db_integration_test.zig's, adp04b's, and tm01/03/04/05's test blocks that use
  TestHarness.init() or a raw pool call after fixture setup calls it
  independently — invokes runMigrations() (helpers.zig line 440), which calls
  bpm.migrations.Migrations.run() (src/db/migrations.zig line 53) unconditionally.
  Migrations.run()/runForSchema() re-queries "SELECT version FROM
  public.schema_migrations WHERE schema_name = $1" FRESH on every call (line
  160-164 of migrations.zig) — there is no in-process cache of "already checked
  this run." If GBL-102 (or GBL-084, numerically earlier and still unscoped) is
  not yet recorded as applied, Migrations.run() re-attempts it, re-evaluates its
  pre-flight guard against whatever public.tenant rows exist AT THAT INSTANT,
  and — per GBL-102's own header comment — does NOT record itself as applied on
  failure, so it stays perpetually retriable. This means: (1) test declaration
  order in main_test.zig's comptime{} block is IRRELEVANT to whether the guard
  "has run yet," because it re-runs on every init call throughout the entire
  binary's lifetime, not once at binary startup; (2) it only takes ONE
  service.createTenant() call anywhere in the ~70-file binary to leave a
  production+LEGACY_RLS row in place at the moment ANY LATER
  TestHarness.init() call happens (including one belonging to a completely
  unrelated test file), for that later call to fail. TC-DB-01-01/02 are simply
  two of the (many) call sites that surface the guard's failure as their own
  test failure — they did not cause the leak and are not special; any other
  TestHarness.init() caller running at an unlucky moment would show the same
  symptom.

execution_order_finding: >
  Zig's default single-threaded test runner executes test{} blocks from a
  single compiled binary in an order that is an implementation artifact of
  comptime import resolution and declaration order within main_test.zig's
  comptime{} block (helpers, db_integration, event_store, ..., adp04b at line
  97's import position, ..., tm01 at line 123's import position, ...) — this is
  NOT a documented, stable Zig language guarantee (the Zig test runner does not
  publish an execution-order contract; there is no project convention doc that
  asserts one either — grep of docs/agents/ and docs/guides/ found no such
  claim). This project's own tests already implicitly acknowledge the runner is
  NOT single-pass/ordered-safe: helpers.zig's runMigrations() takes a
  pg_advisory_lock specifically because "every integration test binary calls
  TestHarness.init() -> runMigrations() independently" (ISS-0090 comment,
  helpers.zig line 88), and the full suite runs with concurrency (TEST-RUNNER's
  own report notes "N=28" concurrent test workers). Given retry-on-every-init
  semantics (mechanism_finding above), declaration order would not fix this
  even if it were guaranteed: reordering adp04b/tm0x to declare before
  db_integration_test only guarantees their PASSING test bodies run first — it
  does nothing about a defer-based cleanup that fires at the END of each test
  function, potentially interleaved with hundreds of other tests' init calls
  under the real runner's actual (concurrent, non-deterministic) scheduling.

defer_semantics_verification: >
  Confirmed correct per standard Zig behavior and per this codebase's own usage
  pattern: a `try expect(...)` / any `try` expression that returns an error
  from a test function DOES unwind the stack and run all previously-registered
  `defer` statements in that function's scope — this is ordinary Zig control
  flow (`return err` triggers deferred cleanup exactly like a normal early
  return), distinct from a panic/segfault/`unreachable` hit, which does NOT run
  defers. Verified this is not just assumed but structurally guaranteed in
  every test examined: adp04b_tenant_realm_binding_test.zig's TC-ADP-04b-02..05
  and tm01_tenant_list_test.zig's TC-TM-01-01, TC-TM-03-01..04, TC-TM-04-01..04,
  TC-TM-05-01..03 all call `cleanupTenantBySlug(&pool, slug)` (a bare pre-clean,
  ignoring its own errors internally via `catch return`/`catch {}`) and THEN
  immediately register `defer cleanupTenantBySlug(&pool, slug)` — BEFORE calling
  `service.createTenant()` or any other fallible operation. So even if
  `service.createTenant()` itself failed, the defer is already armed and would
  still fire. Grepped both files and src/identity/service.zig,
  src/identity/registry.zig for `catch unreachable`: zero matches — no
  panic-prone code path exists in the createTenant() call chain that these
  tests exercise. This RULES OUT option (b) from the task ("some tm0x/adp04b
  test panicked before reaching its defer") as the mechanism. The defers are
  correctly written and, when a test binary runs to completion, they do clean
  up (TEST-RUNNER's earlier post-hoc `clean_test_db.py` run confirmed rows can
  be swept). The 15 leaked rows found mid-run are not evidence of a broken
  defer — they are evidence that OTHER, still-in-flight or already-completed
  copies of these tests (this is a shared, long-lived, concurrently-run
  container — see below) had inserted rows that had not yet been cleaned at the
  moment some other test's TestHarness.init() call queried tenant state.

separate_binary_hypothesis_ruled_out: >
  Option (c) from the task ("re-verify whether these tests run in a separate
  process/binary from db_integration_test after all") was explicitly checked
  against build.zig. FINDING: db_integration_test.zig, adp04b_tenant_realm_binding_test.zig,
  and tm01_tenant_list_test.zig are ALL compiled into the exact same root source
  file, tests/integration/main_test.zig (confirmed via its comptime{} import
  block, lines 21/97/123 and 171/209/222 of main_test.zig), which is used as the
  root_module for TWO separate b.addTest() artifacts in build.zig: the primary
  `integration_tests` artifact (line 838, backing `run_integration_tests`,
  wired into the main `test-integration` step at line 1245) AND a
  confusingly-named second artifact `env_integration_tests` (backing
  `run_env_integration_tests`, wired into `test-integration-env` at line
  1425-1427) that ALSO uses root_source_file = "tests/integration/main_test.zig"
  — i.e. `test-integration-env` is NOT a scoped subset containing only
  ENV-01..05 tests; it is a second, independently-compiled copy of the SAME
  ~70-file, ~700-test binary, sharing the same test content as the main
  `test-integration` step, just running as its own separate OS process. This
  directly explains a detail in TEST-RUNNER's Step-5 report that otherwise
  looks contradictory: TEST-RUNNER ran `zig build test-integration-env`
  expecting an "isolated single-binary run via test-integration-env with zero
  cross-binary contention" to rule out concurrency, and found the identical 15
  leaked rows and identical TC-DB-01-01/02 failure there too. That is not
  evidence the failure is concurrency-independent in the way TEST-RUNNER
  concluded — `test-integration-env` still runs the FULL ~700-test suite
  (db_integration_test + adp04b + tm01/03/04/05 + everything else) as one
  self-contained binary; "isolated from other build steps" is not the same as
  "isolated from adp04b/tm0x," which are baked into the same binary regardless
  of which of the two build-step names invokes it. This build.zig naming
  collision (an "env"-suffixed step secretly running the entire suite) is a
  separate, minor documentation/tooling clarity issue, noted below, but it does
  confirm there is exactly ONE test-content binary in play for this bug, not
  two — ruling out option (c) as originally framed (there is no version of
  main_test.zig that excludes adp04b/tm0x while including db_integration_test).

why_this_makes_declaration_order_and_isolated_reruns_both_ineffective: >
  Because (1) the guard re-checks live DB state on every TestHarness.init()
  call throughout the binary's full runtime (not once at startup) and (2) both
  build steps TEST-RUNNER tried compile the identical full-suite content, there
  is no way to observe TC-DB-01-01/02 "passing in isolation from adp04b/tm0x"
  using any EXISTING build.zig step — every step that includes
  db_integration_test.zig also includes adp04b/tm0x, because they are the same
  main_test.zig file compiled twice under two names. A same-file declaration
  reorder cannot fix a check that reruns continuously for the binary's entire
  lifetime and can be tripped by any of ~15+ call sites scattered across the
  file, not just the first one.

recommendation_for_fix_design: >
  Three fix layers are warranted, ranked by correctness/robustness. Recommend
  CODE-DESIGNER scope at minimum (1); (2) and (3) are defense-in-depth and
  strongly recommended given the guard's demonstrated fragility to ANY
  production-tenant fixture leak anywhere in a 70-file, 700-test shared binary.

  (1) PREFERRED / MINIMAL CORRECT FIX — Make adp04b/tm01/tm03/tm04/tm05's
  tenant cleanup unconditional and leak-proof the same way TC-SPT-01-06's
  ISS-0099 fix already does it (per anti-patterns.md's existing entry for
  ISS-0100): these tests are legitimately exercising the real
  service.createTenant() production path, so they should NOT be converted to
  tenant_type='test' (that would falsify what they are testing — TC-ADP-04b-01
  explicitly asserts against the DEFAULT tenant's real idp_realm_id backfill,
  and TC-TM-0x tests assert against real HTTP-shaped service outputs). Their
  existing `defer cleanupTenantBySlug(...)` pattern is already structurally
  correct (verified above — always armed before any fallible call) and DOES
  work when a given test's own lifecycle completes normally. The actual gap is
  that a *concurrently running or not-yet-reached* copy of these tests, in a
  suite of ~700 tests sharing one live DB, can have a row in-flight (created,
  not yet cleaned) at the exact instant another, unrelated test's
  TestHarness.init() call queries tenant state. This is not fixable by
  touching adp04b/tm0x's own cleanup code — their cleanup already runs
  correctly at the end of THEIR OWN test. The fix belongs on the GUARD, not the
  producers:

  (2) SUPPLEMENTARY BUT NECESSARY — GBL-102's guard must not be a hard, global,
  same-invocation blocker for a condition that is EXPECTED transient state
  during a live test run (a test in progress that legitimately has a real
  production-shaped tenant row mid-lifecycle, about to be cleaned by its own
  defer moments later). Two sub-options, either acceptable:
    (2a) Scope GBL-102's guard to exclude tenant slugs matching the test-fixture
    naming convention actually used across this codebase (`tc-*` prefix — grep
    confirms every test-created tenant slug in adp04b/tm0x, and indeed across
    essentially the whole tests/integration/ tree, is prefixed `tc-<area>-<nn>`
    or similar; this convention is informally consistent but NOT currently
    documented/enforced anywhere — see caveat below). This keeps the guard
    correct for its real purpose (blocking RLS removal while a REAL production
    tenant, which would never be named `tc-*`, is still LEGACY_RLS) while
    making it immune to any test's fixture, present or future, without
    requiring every test file to individually adopt tenant_type='test'.
    (2b) Make TestHarness.init() itself resilient: catch a GBL-102 pre-flight
    failure specifically and treat it as "migration not yet applicable in this
    environment" rather than propagating it as a hard test failure — but this
    is a broader, riskier behavior change to the shared test harness init path
    that could mask genuine regressions; NOT recommended over (2a).
  Caveat on (2a): the `tc-*` prefix convention is real and consistent in every
  file grepped for this diagnosis, but it is informal — there is no lint rule
  or doc enforcing it, so a future test author using a different prefix would
  silently defeat the guard's exclusion. If (2a) is adopted, it should be
  paired with a naming-convention lint (extending
  tools/lint_test_isolation.py) that flags any INSERT/service.createTenant()
  call in tests/integration/ whose slug does not start with an allowlisted
  test-fixture prefix, so the exclusion pattern stays enforceable rather than
  tribal knowledge.

  (3) OPTIONAL HARDENING — Fix the `test-integration-env` build.zig step-naming
  confusion identified above (env_integration_tests uses
  tests/integration/main_test.zig, the FULL suite, not a scoped ENV-01..05
  subset its name implies). This is not the root cause of ISS-0100's rework gap,
  but it directly caused TEST-RUNNER to believe it had achieved run-isolation
  when it had not, costing a wasted verification cycle. Recommend either
  renaming the step to make clear it runs the full suite, or (better, if
  low-risk) giving it a genuinely scoped root_module analogous to
  test_integration_svc_step's dedicated svc_integration_tests artifact, so
  future "run in isolation" attempts are trustworthy.

  NOT recommended: (a) reordering main_test.zig's import/comptime declarations
  — proven ineffective above, since the guard rechecks continuously rather than
  once at binary start; a build.zig step-ordering change that reorders which
  BUILD STEPS run relative to each other doesn't help either, because the leak
  and the check both happen inside the SAME already-running binary, not across
  step boundaries. (b) isolating TC-DB-01-01/02 into their own dedicated build
  step/binary — would genuinely fix TC-DB-01-01/02's own symptom (make them
  pass reliably) but does not fix the underlying issue: ANY other
  TestHarness.init() caller in the full ~700-test suite (there are dozens) is
  equally exposed to the same guard trip from the same adp04b/tm0x leak
  mid-run; isolating only the two originally-reported tests would just relocate
  where the next instance of this exact failure surfaces, next time a
  different unlucky test happens to call TestHarness.init() while an
  adp04b/tm0x fixture is momentarily still present. Fixing the guard's scope
  (2a) fixes it for every current and future caller, not just these two.

