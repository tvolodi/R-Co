acceptance_criteria_status:
  - criterion: "Actual execution order of db_integration_test.zig vs adp04b/tm0x tests within main_test.zig determined with evidence"
    status: MET
    note: >
      Determined that a fixed declaration/execution order is not the operative
      variable at all — the guard re-runs continuously on every
      TestHarness.init() call throughout the binary's life, so "order" between
      any two specific test files does not determine the outcome; any of ~15+
      TestHarness.init() call sites can trip on any other call site's
      momentarily-uncommitted-cleanup fixture, regardless of declaration order.
  - criterion: "Root cause of WHY guard-check rows were present pinned down precisely"
    status: MET
    note: >
      Retry-on-every-init migration semantics (GBL-102 never records itself as
      applied while ANY production+LEGACY_RLS row exists anywhere,
      re-evaluated fresh on every call) + legitimate, correctly-implemented
      service.createTenant() fixture usage in adp04b/tm0x whose cleanup is
      correct but necessarily has non-zero in-flight windows within a
      ~700-test, partly-concurrent shared-DB suite. Not a missing-cleanup bug,
      not a panic-skips-defer bug, not a separate-binary bug (ruled out with
      evidence above).
  - criterion: "Recommendation for the minimal correct fix, with rationale"
    status: MET
    note: "See recommendation_for_fix_design above — guard-scoping (2a) is the minimal correct layer; (1)/(3) are supporting context, not required code changes to adp04b/tm0x themselves."
  - criterion: "docs/issues/ISS-0100.json updated with this refined understanding"
    status: MET
  - criterion: "next_action set to route to CODE-DESIGNER for a rework design"
    status: MET

