issue_id: "ISS-0181"
severity: "MAJOR"
gh_issue: "https://github.com/tvolodi/R-Co/issues/512"
symptoms:
  - "--no-baseline lint reports 184 T010 BLOCKERs across 45 integration files; all are currently baselined."
  - "Fixed UUID fixtures can collide when test binaries share bpm_test (INV-TI-2)."
root_cause: "The linter uses a lexical UUID-literal rule (T010) and the affected Zig integration fixtures predate the CSPRNG-backed TestHarness UUID helpers. The literals are reused across concurrent binaries, so database rows can collide. T020 detects module-level mutable var declarations; T030 detects allocation-like calls in a test block without defer; T050 requires BPM_TEST_DB_URL; T060 detects production-defaulting tenant creation with non-allowlisted slugs. These are distinct checks and must not be conflated with this T010 migration."
linter_classification:
  T010: "Any quoted canonical UUID except the all-zero sentinel; BLOCKER."
  T011: "Deterministic seed UUID generator; BLOCKER."
  T020: "Column-zero module-level mutable var; MAJOR."
  T030: "Allocation-like call in a test block without defer; MAJOR."
  T040: "SkipZigTest in a block carrying requirement coverage hint; BLOCKER."
  T050: "Integration file lacks BPM_TEST_DB_URL reference; MAJOR."
  T060: "Unprefixed production-defaulting tenant creation or raw tenant INSERT omitting tenant_type; MAJOR."
helpers:
  file: "tests/integration/helpers.zig"
  newUuid_signature: "pub fn newUuid(self: *TestHarness) bpm.uuid.Uuid"
  newUuidString_signature: "pub fn newUuidString(self: *TestHarness, allocator: std.mem.Allocator) ![]u8"
  implementation: "CSPRNG UUID v4; newUuid is allocation-free, newUuidString allocates canonical 36-byte representation; caller frees returned slice."
  substitution_limits:
    - "Compile-time constants and declarations requiring comptime values cannot call runtime helpers."
    - "SQL text or expected values that intentionally assert a documented system identity must retain the fixed UUID."
    - "Call sites must have a live TestHarness and allocator, and defer allocator.free for allocated strings."
