  - command: "Read tests/integration/test_iss503_rls_removal.zig lines 18-38 (module header)"
    finding: >
      Explicit acknowledgement by the ISS-503 test author that GBL-084 "has
      almost certainly already been applied once, globally" by the time that
      suite runs, and that the real migration runner's applied.contains check
      makes re-application "a permanent no-op" once successful -- confirming
      the retry-until-first-success semantics and that this is known,
      documented behavior of the migration runner, not a hidden edge case.
  - command: "grep 'db_integration_test' build.zig and tests/integration/main_test.zig"
    finding: >
      db_integration_test.zig has no standalone build.zig target; it is
      imported into main_test.zig and runs as part of run_integration_tests,
      which is one of ~23 dependencies of the single shared `test-integration`
      b.step. clean_test_db.step is a dependency of test-integration_step
      (and each test-integration-* variant) but Zig's build graph runs a
      shared step once per invocation regardless of how many targets declare
      a dependency edge to it -- confirmed by build.zig lines 1237-1445 where
      every test-integration-* step independently calls
      `.dependOn(&clean_test_db.step)` on the SAME clean_test_db artifact.
  - command: "Read docs/agents/workflows/WF-04_full_test_run.md lines 155-162"
    finding: >
      Confirms the documented policy: schema_migrations is deliberately never
      wiped by clean_test_db.py ("this is what lets migrations stay
      skip-on-already-applied instead of re-running non-idempotent DDL"). This
      is correct for ordinary idempotent migrations, but interacts badly with
      GBL-084's fail-open-non-recording pre-flight guard: a migration that can
      legitimately fail-and-retry defeats the "already applied, skip" fast
      path that the rest of the migration set relies on for safety.

why_guard_sees_leaked_rows_despite_working_cleanup: >
  clean_test_db.py's DELETE sweep is correct and sufficient IF it runs
  immediately before the check that queries tenant state. It does not run
  between individual test binaries within one `zig build test-integration...`
  invocation (Zig deduplicates the shared clean_test_db build step to once per
  invocation), and it does not run automatically between two SEPARATE `zig
  build` invocations unless the second invocation's own target also depends on
  clean_test_db.step (which all test-integration-* steps do, but that
  dependency only cleans BEFORE that invocation's tests start -- it does
  nothing about the fact that a target's own tests, or a different binary
  built into the same step's dependency graph, can insert new leaked rows
  DURING that same invocation, and the ISS-503 guard is retried afterward
  in-process by any later TestHarness.init() call that still needs to record
  GBL-084 as applied). The fixture-insert bug (recommendation 1) generates the
  leak; the retry-until-success migration semantics (recommendation 2 territory)
  is what turns a same-invocation leak into a same-invocation, cross-test-binary
  failure.

recommendation_for_fix_design: >
  Two independent fixes are warranted; recommend both be scoped into the
  CODE-DESIGNER handoff, but if forced to choose ONE root fix, fix (1) is more
  correct and lower-risk than a build.zig step-ordering change:

  (1) PREFERRED — Fix the fixture-insert bug at its source (candidate
  resolution (b) from ISS-0100.json, scoped down): give every disposable
  integration-test tenant fixture insert (ensureDefaultOidcSeeds' SVC-01..04
  block, and every other bare "INSERT INTO tenant (id, slug, display_name,
  status/idp_realm_id, ...)" across the affected files) an explicit
  `tenant_type = 'test'` plus `production_tenant_id` pointing at the default
  tenant, matching env01_tenant_type_field_test.zig's own pattern and
  satisfying ck_tenant_type_fk_coherence. This makes clean_test_db.py's
  existing `tenant_type = 'test'` sweep branch (not just the broader
  'production' branch) the primary cleanup path, and — more importantly — it
  is a data-hygiene fix that is correct regardless of GBL-084/ISS-503's
  retry semantics: a properly-typed test fixture is unambiguous test data at
  the moment it is inserted, not a full production/LEGACY_RLS impostor for
  however long it happens to survive. This does not fully close the race
  (rows still exist until the next clean_test_db.py sweep even if
  tenant_type='test'), but it is the correct normalization step and directly
  fixes the issue as originally filed.

  (2) SUPPLEMENTARY — Scope the ISS-503 pre-flight guard itself
  (migrations/GBL-084_rls_removal.sql) to exclude non-production fixture
  noise, e.g. add "AND tenant_type = 'production'" to the guard's COUNT query
  once (1) ships, so that even a still-not-yet-cleaned test-typed fixture
  cannot block the migration. This is a narrower, defense-in-depth change and
  should NOT replace (1) — a guard that only counts tenant_type='production'
  rows is still vulnerable to any future fixture insert that (re)introduces
  the bare-INSERT-defaults-to-production bug, whereas fixing the inserts
  closes the leak at its source for every current and future consumer of
  public.tenant, not just this one guard.

  NOT recommended as the primary fix: a build.zig step-ordering change to run
  clean_test_db before every individual test binary (rather than once per
  `zig build` invocation) would fix the symptom but is high blast-radius
  (touches ~30 build steps), reintroduces the exact per-binary serialization
  cost the shared-step design was chosen to avoid, and does nothing for the
  underlying data-hygiene bug that a human auditing public.tenant outside the
  build system (e.g. via psql) would still trip over.

