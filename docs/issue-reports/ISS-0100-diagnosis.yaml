symptom: >
  After running the full test-integration-svc suite once, a subsequent
  migrations-related test (db_integration_test.zig TC-DB-01-01/TC-DB-01-02)
  fails because an ISS-503 pre-flight guard (migrations/GBL-084_rls_removal.sql)
  raises "N tenant(s) still in LEGACY_RLS mode", counting leaked
  production-typed fixture tenants as real production tenants.

orch_pre_investigation_confirmed: true
orch_finding_summary: >
  tools/clean_test_db.py already contains
  "DELETE FROM public.tenant WHERE tenant_type = 'production' AND slug != 'default'"
  (present since commit 106bb44, predates this issue). Verified live against
  db_test: 15 leaked LEGACY_RLS production rows went to 0 after running the
  script, zero FK RESTRICT errors. Candidate resolution (a) from the issue is
  already implemented and works correctly when it runs. ORCH's hypothesis was
  that the real defect is a step-ordering/visibility gap: clean_test_db.py runs
  once per `zig build` invocation (shared build-graph dependency), so rows
  inserted by test fixtures during one invocation remain visible to any check
  that runs later in the same invocation, or to a later invocation that starts
  before an intervening clean-test-db run.

root_cause_confirmed: true
root_cause: >
  Two independent, compounding defects — both confirmed with direct evidence,
  not just ORCH's step-ordering hypothesis (which is real but not the whole
  story):

  (1) FIXTURE-INSERT BUG (confirmed, matches ISS-0100's original framing):
  Every `INSERT INTO tenant` / `INSERT INTO public.tenant` across the affected
  files (tests/integration/helpers.zig::ensureDefaultOidcSeeds SVC-01..04 block,
  svc01_service_catalog_scope_test.zig, svc04_admin_api_test.zig,
  adp07_agent_role_reserved_usernames_test.zig, adp04a_external_identity_linkage_test.zig,
  tenant_config_realm_test.zig, oidc09/10/11/12/15/35, env01/02/03/05_test.zig
  [some paths in env0*_test.zig DO set tenant_type explicitly per
  env01_tenant_type_field_test.zig -- verified those are the exception, not
  the rule]) omits both `tenant_type` and `storage_mode`. Per
  migrations/GBL-080_env01_tenant_type_field.sql, tenant_type defaults to
  'production'; per migrations/086_iss107_tenant_storage_mode.sql,
  storage_mode defaults to 'LEGACY_RLS'. So every one of these bare inserts
  creates a row that is SIMULTANEOUSLY tenant_type='production' AND
  storage_mode='LEGACY_RLS' -- exactly the row shape GBL-084's pre-flight
  guard counts. None of the slugs collide with clean_test_db.py's 'default'
  exclusion (verified by grep -- svc-t1, svc-t2, svc04-*, iss107-t3..t5, etc.
  are all distinct from 'default'), so this is a genuine leak, not a masked
  collision.

  (2) RETRY-UNTIL-SUCCESS MIGRATION SEMANTICS (new finding, sharpens ORCH's
  step-ordering hypothesis into its precise mechanism): GBL-084's own header
  comment (migrations/GBL-084_rls_removal.sql lines 7-9) states that if the
  pre-flight RAISE EXCEPTION fires, "zero DDL changes are made... the migration
  runner... does NOT record this migration as applied in public.schema_migrations."
  tests/integration/helpers.zig's TestHarness.init() -> runMigrations() calls
  bpm.migrations.Migrations.run() unconditionally on every single test binary
  startup (see helpers.zig line 113), which re-applies any migration not yet
  recorded in schema_migrations -- including GBL-084. Combined with (1): if
  ANY test in a build invocation inserts a production/LEGACY_RLS fixture tenant
  BEFORE GBL-084 has ever successfully recorded itself as applied on this test
  database, every subsequent TestHarness.init() call in that SAME invocation
  (and in any later invocation, until an intervening clean_test_db.py sweep
  removes the leaked rows AND a TestHarness.init() call successfully re-runs
  GBL-084 to record it) will re-attempt and re-fail GBL-084's guard. This is
  confirmed directly by tests/integration/test_iss503_rls_removal.zig's own
  header comment (lines 18-38), which states GBL-084 "has almost certainly
  already been applied once, globally" by the time that suite runs -- i.e. the
  test author already knew this migration runs opportunistically on every
  harness init until it first succeeds.

  MECHANISM PRODUCING THE EXACT SEQUENCE IN THE ISSUE REPORT: `zig build
  test-integration-svc` runs svc01/svc04 tests (via TestHarness.init() and/or
  ensureDefaultOidcSeeds' committed-before-transaction fixture block), which
  insert 8-9 production/LEGACY_RLS tenant rows that are NOT rolled back (they
  are committed outside the per-test transaction specifically so pool-based
  operations can see them -- see helpers.zig lines 357-362 comment). If GBL-084
  had not yet successfully recorded itself as applied on this test database
  before this run (e.g. first run against a freshly created db_test volume, or
  any earlier run where the guard had also failed), the guard fires and fails
  during this run too, still un-recorded. clean_test_db.py has NOT yet run
  again (it only runs at the START of the next `zig build` invocation). A
  second, separate `zig build test-integration` (or any invocation touching
  db_integration_test.zig, which is compiled into tests/integration/main_test.zig)
  invokes TestHarness.init() again, which retries GBL-084 against a public.tenant
  table that still contains the leaked LEGACY_RLS rows from the svc run ->
  guard fails again -> TC-DB-01-01/02 (or any other test whose TestHarness.init()
  happens to be the one that triggers the migration attempt) fails with "N
  tenant(s) still in LEGACY_RLS mode."

  db_integration_test.zig is not a standalone build target -- it is imported
  into tests/integration/main_test.zig (`const db_integration =
  @import("db_integration_test.zig")`), which is built as `run_integration_tests`
  and wired into the shared `test-integration` step alongside ~20 other
  integration test binaries. This means TC-DB-01-01/02 is exposed to whatever
  schema_migrations/public.tenant state exists at the time `zig build
  test-integration` runs -- there is no re-clean between the individual test
  binaries dependency-ordered under that one step, only a single clean_test_db
  run at the very start of the whole `zig build test-integration` invocation.

