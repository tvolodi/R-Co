disproven_premise:
  claim: "A per-tenant schema_migrations ledger table is never created during tenant provisioning; tenant provisioning is therefore defective."
  verdict: "DISPROVEN — the described state is the intended design."
  evidence:
    - "src/db/migrations.zig:154-158 — schema_migrations is created in `public` only: `CREATE TABLE IF NOT EXISTS public.schema_migrations (schema_name, version, applied_at)`."
    - "src/db/migrations.zig:236 — read path is `SELECT version FROM public.schema_migrations WHERE schema_name = $1`, always qualified."
    - "src/db/migrations.zig:529 — write path is `INSERT INTO public.schema_migrations (schema_name, version) VALUES ($1, $2)`, always qualified."
    - "migrations/GBL-132_iss0108_drop_stray_tenant_schema_migrations.sql — exists specifically to DROP any stray per-tenant copies, documenting that their absence is deliberate."
    - "migrations/001_event_store.sql and 055_xc06_backwards_compatibility.sql historically issued an unqualified `CREATE TABLE IF NOT EXISTS schema_migrations (...)`; because these are non-GBL migrations Migrations.runForSchema replays them once per tenant schema under `<schema>,public` search_path, creating shadow copies. The unqualified CREATE was fixed and GBL-132 cleans up old shadows."
    - "Verified on a freshly migrated pristine database (WF03-ISS-0150-20260807 measurement): 108/108 migrations applied, ZERO per-tenant ledger tables created, no 42P01 error raised."
  consequence: "Tenant provisioning is NOT defective. Implementing per-tenant ledgers would have contradicted ISS-504/ISS-0091 design. A correct fix does not introduce per-tenant ledgers."

# ============================================================================
# Section 4 — The real failures (three independent root causes)
# ============================================================================
real_root_causes:
  - id: RC-1
    title: "Migration renamed GBL-084 -> GBL-123; the test still reads the old filename"
    status: FIXED     # fixed in PR #519 (commit 4d593ef)
    explains_blocks: 3
    detail: |
      Commit db362fd (GH #405) renamed migrations/GBL-084_rls_removal.sql
      to migrations/GBL-123_rls_removal.sql but did not update
      tests/integration/test_iss503_rls_removal.zig, which still calls
      readGbl084Sql() reading "GBL-084_rls_removal.sql" from disk. TC-ISS503-01/02/03
      therefore failed with error.FileNotFound BEFORE running any SQL.
      The `tenant_<uuid>.schema_migrations does not exist` lines visible in
      the original log were the sibling binary's stderr bleeding into TC-ISS503-01's
      captured output block — Zig attributes a test binary's interleaved stderr
      to whichever block happens to be running at that moment.
    files:
      - "tests/integration/test_iss503_rls_removal.zig"
      - "tests/integration/main_test.zig"
    fixed_in: "PR #519 / commit 4d593ef"
  - id: RC-2
    title: "xc05/xc06 fixtures write to a table name that has never existed"
    status: FIXED
    explains_blocks: 11
    detail: |
      tests/integration/xc05_deterministic_replay_test.zig and
      xc06_backwards_compatibility_test.zig issue `INSERT INTO instances (...)`
      and `SELECT ... FROM instances`. There is no `instances` relation in any
      schema in this database and there never was one — the projection table
      is `instance_projections` (created by 005_instances.sql under that
      name). The fixtures also named a `created_at` column (the real column
      is `started_at`) and omitted `definition_id`, which is NOT NULL with
      no default. Additionally TC-XC-06-01 asserted the core business tables
      exist in `table_schema='public'`, but non-GBL migrations apply per
      tenant schema, so they live in `tenant_default`.
    files:
      - "tests/integration/xc05_deterministic_replay_test.zig"
      - "tests/integration/xc06_backwards_compatibility_test.zig"
    fixed_in: "PR #519 / commit 4d593ef"
  - id: RC-3
    title: "OIDC tests insert unqualified into `tenant`, hitting a stale tenant_default shadow copy"
    status: FIXED
    explains_blocks: 19
    detail: |
      45 table names exist in BOTH `public` and `tenant_default`, and they
      diverge in columns because GBL-prefixed migrations only ever apply
      to `public`. `public.tenant` has the `tenant_type` column (added by
      GBL-119_env01_tenant_type_field.sql); the stale `tenant_default.tenant`
      copy does not. Six OIDC test files write `INSERT INTO tenant
      (... tenant_type ...)`. Under TestHarness's search_path
      `tenant_default,public`, an unqualified write resolves to
      tenant_default.tenant — a stale duplicate lacking `tenant_type`. Every
      reference was qualified as `public.tenant` in the fix.
    files:
      - "tests/integration/oidc09_jit_provisioning_test.zig"
      - "tests/integration/oidc10_attribute_sync_test.zig"
      - "tests/integration/oidc11_identity_stability_test.zig"
      - "tests/integration/oidc12_realm_tenant_binding_test.zig"
      - "tests/integration/oidc15_realm_deletion_test.zig"
      - "tests/integration/oidc35_onboarding_test.zig"
    fixed_in: "PR #519 / commit 4d593ef"
    systemic_root_cause_forwarded_to: "ISS-0185 / GH #518 (45 business tables duplicated between public and tenant_default with diverging columns)"

