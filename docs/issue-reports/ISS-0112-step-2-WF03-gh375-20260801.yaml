summary: |
  Produced src/design/fix-iss0112.md — a 5-change Type E design that
  reconciles the test-infrastructure drift identified by Step 1. The five
  interlocking changes are: (1) a corrective migration
  migrations/GBL-105_iss0112_schema_ledger_reconcile.sql that idempotently
  back-fills the public.schema_migrations ledger and per-tenant-schema
  ledgers, plus adds the missing webhook_subscriptions.secret_ref column,
  public.tenant_realm_binding table, tenant.entity_type_instances table,
  and the tenant_storage_mode_check / webhook_deliveries_status_check
  constraint upgrades observed in the failing clusters A/D/E; (2) an
  applier guard in src/db/migrations.zig::Migrations.runForSchema that
  introduces a force_reconcile flag and a per-migration
  `reapply_on_drift: true` header comment convention so corrective
  migrations are recorded rather than silently skipped when the ledger
  is missing the row but the target objects are present (the same
  idempotent pattern GBL-104 used); (3) a smaller-blast-radius per-test
  isolation change in tests/integration/helpers.zig::ensureDefaultOidcSeeds
  that sets tenant_type='test' on the canonical 'default' tenant row
  and relocates the 9 SVC-* fixture INSERTs out of the shared helper
  into each consuming test file with defer cleanup; (4) a CLI flag
  broadening tools/clean_test_db.py with --include-fixtures so operators
  can drop leaked LEGACY_RLS fixture tenants that default to
  tenant_type='production' (off by default; byte-for-byte today's
  behavior without the flag); (5) a new tools/verify_schema_baseline.py
  that mechanically enforces docs/guides/test_infrastructure_guide.md §6
  (the four INV-TI-1 checks plus the expected CHECK constraint list),
  with --check-tenants strict mode and --auto-fix one-shot reconcile
  mode, exit codes 0/1/2. The design flags the 6-file touch surface as
  exceeding the WF-03 §Fix size constraint and provides rationale per
  the closed-circuit justification (each change is meaningless without
  its companions). Type E is justified per templates/lego-catalog.md
  rule 5; the Type C lego was considered and rejected for the
  corrective migration because it is a multi-statement ledger reconcile
  that does not match the single-table DDL shape codegen_migration.py
  keys on, matching the precedent set by GBL-101/GBL-102/GBL-104. Five
  acceptance criteria enumerated for Step 3 to validate against.
