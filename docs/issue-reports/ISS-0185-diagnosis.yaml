    GLOBAL = the table has no `tenant_id` column on either copy (or the
    public copy has scope/owner_tenant_id distinguishing it as a global
    registry). PER_TENANT = the table has a `tenant_id` column on at least
    one copy and the column shape is identical between schemas. HYBRID =
    the table legitimately serves both global and per-tenant rows by
    design (e.g. service_catalog) — already addressed by GBL-117.

