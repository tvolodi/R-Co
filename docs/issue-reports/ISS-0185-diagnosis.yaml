root_causes_identified:

  - id: RC-A
    title: "Migration scope header absent — non-GBL files default to all_schemas"
    status: ROOT
    explains_duplicates: 45
    detail: >-
      Per src/db/migrations.zig::migrationScope, a migration's scope is
      `.public_only` only when the filename begins with `GBL-` OR the file
      body carries `-- scope: public` in the first 1 KiB. Every one of the
      45 source migrations that creates a duplicated table is non-GBL and
      carries no scope header, so the runner defaults each to `.all_schemas`
      and replays the CREATE TABLE once per tenant schema — producing the
      shadow copy in tenant_default.

  - id: RC-B
    title: "Global tables created with unqualified identifiers, masking the wrong-pass creation"
    status: ROOT
    detail: >-
      For tables that should be global-only (agent_bootstrap_*, idp_*,
      oidc_*, federation_*, jit_*, realm_*, instance_definition_snapshots,
      instance_waits, obs_*, metric_snapshots, subsystem_health_probe,
      onboarding_registry, repository_artifacts, artifact_versions,
      event_payload_store, event_type_registry_producers, tenant_*,
      variable_schemas), the CREATE TABLE statement is unqualified. With
      search_path = "tenant_default,public" during the per-tenant pass,
      the table is created in tenant_default — and on the public pass
      too, so both schemas end up with a copy. The same pattern would
      apply to any future GBL-only ALTER (e.g. adding
      `public.tenant.tenant_type`); only the public copy would receive
      the column, exactly as observed.

  - id: RC-C
    title: "Per-tenant tables created without tenant_id column on the public copy"
    status: ROOT
    detail: >-
      For per-tenant data (artifact_activations, entity_*, group_roles,
      role_permissions, sessions, sla_records, subprocess_links,
      user_groups, webhook_deliveries), the migration creates an identical
      table in both schemas without distinguishing tenant_id — so the
      public copy is an unused, identical shadow that drifts away if a
      later GBL ALTER only touches the public copy.

  - id: RC-D
    title: "No linter guard for dual-schema table names in unqualified SQL"
    status: ROOT
    detail: >-
      tools/lint_migration_schema.py and tools/lint_sql_param_types.py
      detect GBL filename prefix and asymmetric SQL casts but do not
      detect duplicate table names across the public and tenant_default
      schemas. Once a table name exists in both, the
      search_path="tenant_default,public" default of TestHarness silently
      routes any unqualified reference to the tenant_default copy,
      producing the recurring ISS-0089/0126/0144/0150 symptom (column X
      does not exist on a column that demonstrably exists) — all four
      prior runs patched call sites, never the source.

non_causes_ruled_out:

  - claim: "All 45 are GBL drift — a single root cause"
    verdict: PARTIALLY WRONG
    evidence: >-
      3 of the 45 (rate_limit_buckets, service_catalog, tenant) have
      already been addressed in patches GBL-117/119/122 — but those
      were one-table fixes, not a pattern fix. The remaining 42 are
      unresolved and need the same pattern applied.

  - claim: "Tables-with-tenant_id-column are always per-tenant"
    verdict: NOT ALWAYS
    evidence: >-
      onboarding_registry has tenant_id but is referenced by
      src/bootstrap/audit.zig as public.onboarding_registry and was
      classified as GLOBAL by the audit history (it tracks onboarding
      requests across all tenants). The "tenant_id" test is a useful
      heuristic but not a sufficient one — column shape + application
      usage must agree.

fix_plan:
  - "GBL-134: Drop the 37 GLOBAL shadow copies in tenant_default (one DROP per table) IF EXISTS, scoped via dynamic SQL over public.tenant."
  - "GBL-135: Drop the 8 PER_TENANT shadow copies in public (DROP TABLE IF EXISTS public.<name>), idempotent."
  - "Annotate every non-GBL migration that creates one of these tables with `-- scope: public` (37 files) so future fresh provisions stop creating the shadow."
  - "Annotate the per-tenant-source migrations with `-- scope: all_schemas` (semantic no-op but explicit + linter-detectable)."
  - "tools/lint_dual_schema_table_names.py: reject any new migration that creates a table name already present in any other schema (information_schema.tables check across public + tenant_*) at migration-time."
  - "Extend tools/lint_migration_schema.py to fail CI when the set-intersection of public and tenant_default table names has more than the explicitly allow-listed names."

