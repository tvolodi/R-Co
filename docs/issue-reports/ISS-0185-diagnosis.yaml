measurement_method: >-
  For each of the 45 table names reported by the issue, queried
  information_schema.columns on both `public` and `tenant_default` copies
  and recorded:
    1. Column set diff (only_pub / only_tenant).
    2. presence of `tenant_id` column on either copy.
    3. presence of `scope` / `owner_tenant_id` column on public copy.
  Also grepped src/**/*.zig for `public.<name>` and unqualified
  `<name>` references to triangulate which copy the application actually
  reads and writes.
  Tool: scratch/_iss0185_diag.py, _iss0185_classify.py,
  _iss0185_tenant_id.py, _iss0185_column_diff.py, _iss0185_inspect.py.

classification_table:
