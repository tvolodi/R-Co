summary: >-
  The 45 business tables duplicated between public and tenant_default exist
  because non-GBL migrations were authored without explicit `-- scope: public`
  (or `-- scope: all_schemas`) headers AND the runner treated them as
  all_schemas (the default). The actual intent, measured from the
  application-code usage of these tables and the per-table column shape, is
  clear: 37 are GLOBAL registries (the public copy is canonical; the
  tenant_default copy is a permanently-empty shadow), 8 are PER_TENANT data
  (the tenant_default copy is canonical; the public copy is the shadow). The
  drift was masked by the 3 corrective GBL migrations GBL-117/119/122 that
  each added a column to the public copy of one of these tables
  (service_catalog.scope/owner_tenant_id, tenant.tenant_type,
  rate_limit_buckets.*), but the team never addressed the underlying
  duplication pattern — every earlier non-GBL migration that touches an
  unqualified table name continues to leak a stray copy into every tenant
  schema, and every later GBL ALTER lands only on the public copy.

environment_note: >-
