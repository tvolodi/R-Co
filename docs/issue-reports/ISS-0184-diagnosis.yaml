    root_cause_hypothesis: >
      Not yet diagnosed to a single statement-level cause -- these are HTTP-layer
      validation-outcome mismatches (422 Unprocessable / 500 Internal / wrong 200-vs-409),
      not raw SQL errors, so the DB server log does not directly point at the failing
      statement the way clusters C1/C2 did. The first test in the file (register returns
      422 instead of 201) is the most likely root trigger, with the remaining 5 failures
