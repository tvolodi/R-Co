summary: >
  ISS-0184's own counts were stale. Re-measured against a freshly migrated database
  (workspace r-co-2, ports 5452/5453; zig build migrate reported "No new migrations to
  apply" -- schema was already current): 635 pass, 9 skip, 88 fail, 1 crashed, 733 total,
  52 leaks. This does NOT match the issue's stated 62-failures-across-31-files baseline;
  the failure surface has shifted since ISS-0184 was filed (2026-08-07), most likely
  because several adjacent fixes landed in between (GH #520, #521, #522, #526, #528,
  #533, #537, #542, #545, #556 all RESOLVED on 2026-08-07 per handoffs/global_queue.json).
  The issue's error-mix hypothesis (85x C22021, 19x C42883, 11x C42P01, 11x C23514,
  11x C23505, 7x C23502) is PARTIALLY CORRECT but the 85x C22021 figure is a
  misdiagnosis: those 85 "invalid byte sequence" errors are the postgres-server-log
  footprint of tests/integration/audit_chain_utf8_test.zig deliberately feeding 0xAA
  bytes into the audit chain trigger to prove migration 1107's EXCEPTION guard catches
  them -- that file's 4 tests (TC-ISS-0122-01..04) are NOT in the current failure list.
  They are expected internal errors, caught and handled; not a defect.

  93 real failures were clustered by root cause into 11 groups. During triage, 3 of those
  groups turned out to be recurrences of issues that were already filed and (incorrectly)
  believed resolved/closed -- ISS-0094/GH#348, ISS-0112/GH#375, ISS-0100/GH#357 -- rather
  than new defects, so they were updated/reopened with the current reproduction instead of
  being filed as new issue numbers. 2 further groups are already-covered by two OPEN,
  QUEUED issues (ISS-0185, ISS-0183) and needed no action. 1 small, well-understood,
  single-file production leak is flagged as a direct-fix candidate for this run's later
  steps. 4 remaining distinct clusters are genuinely new and were filed as ISS-0616
  through ISS-0619.

clusters:
  - id: C1
    title: "audit_entries.resource_id is TEXT but 6+ test files bind the query param as ::uuid"
    signature: 'PostgreSQL C42883 "operator does not exist: text = uuid" (18 occurrences in db log)'
    affected_tests:
      - "ext02_webhook_dispatch_test.zig (TC-EXT-02-INT-02,03,04,05,06,07,08,09,10 -- cascading in-transaction aborts from the first hit)"
      - "obs03_audit_log_test.zig (TC-OBS-03-INT-01,02,03,06)"
      - "obs05_dlq_test.zig (TC-OBS-05-INT-02,03)"
      - "adp02_tenant_scope_test.zig (TC-ADP-02-05)"
      - "adp06_pipeline_run_correlation_test.zig (TC-ADP-06-02,03)"
      - "oidc09_jit_provisioning_test.zig (TC-OIDC-09-06)"
      - "xc02_audit_immutability_test.zig (TC-XC-02-04,05,07)"
      - "xc06_backwards_compatibility_test.zig (TC-XC-06-03,05,06,07)"
      - "exp201_202_entities_test.zig, exp401_exp402_comp_restore_test.zig, exp601_tier_quota_test.zig, repository_test.zig, sim01_04_simulation_mode_test.zig (further cascades, same signature)"
    root_cause_hypothesis: >
      migrations/GBL-081/GBL-082 changed audit_entries.resource_id from UUID to TEXT
      (confirmed live: \d tenant_default.audit_entries shows resource_id | text). Many
      test files still write "resource_id = $N::uuid" when querying it. Reproduced
      directly: `PREPARE q(text) AS SELECT ... WHERE resource_id = $1; EXECUTE q(...)`
      against tenant_default raises exactly "operator does not exist: text = uuid" via
      psql. Confirmed 6 files with 18+ occurrences via
      `grep -rn "resource_id = \$[0-9]::uuid" tests/integration/`.
      This is the single largest real cluster in the current run (accounts for the
      majority of the 42 "PgError.ServerError"-signature failures once cascading
      same-transaction aborts are collapsed to their root statement).
    collision_found: >
      GH #348 / ISS-0094 ("GBL-081/GBL-082 ... never apply to tenant_default") is OPEN
      and describes the SAME resource_id/TEXT/UUID story but from the OPPOSITE direction:
      it recorded the column staying UUID-typed (dispatch bug never applying the type
      migration to tenant schemas). Live verification shows that original defect is now
      RESOLVED -- resource_id is genuinely TEXT on tenant_default today. What C1 found is
      a follow-on: the column type got fixed, but 6+ test call sites were never updated
      to match, so they still cast the bind param to ::uuid. Same underlying story,
      inverse-direction defect.
    disposition: REUSED_EXISTING_ISSUE
    action_taken: >
      Did not file a new issue. Updated docs/issues/ISS-0094.json (new title, new
      resolution text marking the original premise resolved, new occurrence entry with
      full C1 reproduction) and posted an update comment to GH #348 with the same
      information. Added GH-348 to handoffs/global_queue.json (severity MAJOR) since it
      was not previously queued.
      Fix is mechanical: remove the ::uuid cast from resource_id bind params in the
      6 affected files.
    tracked_as: ISS-0094 / GH #348 (reopened content, issue stayed open throughout)
    severity: MAJOR

  - id: C2
    title: "webhook_subscriptions.secret_ref/secret_key_id columns exist in migration file but never reach freshly-provisioned tenant schemas"
    signature: 'PostgreSQL C42703 "column \"secret_ref\" of relation \"webhook_subscriptions\" does not exist" (8 occurrences) and "column s.secret_ref does not exist" (2 occurrences)'
    affected_tests:
      - "ext02_webhook_dispatch_test.zig TC-EXT-02-INT-01 (expected 201, found 500 -- the observable symptom)"
    root_cause_hypothesis: >
      migrations/1134_iss0112_add_secret_ref_to_tenant_schemas.sql adds the columns via
      a `-- scope: public`-tagged DO-block that iterates `SELECT id, slug FROM
      public.tenant WHERE storage_mode='SCHEMA'` **at migration-apply time** and ALTERs
      each existing tenant schema found then. It is not part of the per-tenant DDL that
      src/db/provisioning.zig's provisionTenantSchema() -> migrations.Migrations.runForSchema()
      applies when a NEW tenant schema is created after migrations have already run --
      confirmed by reading provisioning.zig and migrations.zig: runForSchema applies only
      migrations whose scope is per-tenant (non-GBL, no `scope: public` header); 1134 is
      explicitly public-only. Every test-created tenant (which is every test tenant,
      since tenant creation happens at test run time, long after migration 1134 already
      ran once against whatever tenants existed then) therefore never gets these two
      columns. src/api/routes/webhooks.zig reads/writes both columns unconditionally.
    collision_found: >
      GH #375 / ISS-0112 ("Migration/schema drift ... break 42 integration tests") was
      CLOSED (PR #413, migration 1134, run WF03-gh375-20260804) with acceptance criteria
      explicitly listing "webhook_subscriptions.secret_ref" as fixed. The closure was
      premature: PR #413's fix only covers tenants that existed at migration-apply time,
      not tenants created afterward (i.e. every test tenant), so the exact symptom GH#375
      claimed to fix still reproduces today.
    disposition: REOPENED_EXISTING_ISSUE
    action_taken: >
      Reopened GH #375 with `gh issue reopen` and a comment explaining the incomplete
      fix, reproduction, and the correct fix direction (move the ADD COLUMN DDL into a
      proper per-tenant-scoped migration file instead of a one-time public-only DO-block).
      Updated docs/issues/ISS-0112.json status to REOPENED, cleared resolved_at, added a
      "PARTIAL / REOPENED" resolution note preserving the original (now-superseded) text
      for history. Added GH-375 to handoffs/global_queue.json (severity MAJOR).
    tracked_as: ISS-0112 / GH #375 (reopened)
    severity: MAJOR

  - id: C3
    title: "store.zig rowToEventRecord leaks 3 duped strings on the duplicate-idempotency-key read-back path"
    signature: "DebugAllocator leak, 3 allocations, in dupe__anon_* called from rowToEventRecord"
    affected_tests:
      - "event_store_integration_test.zig TC-ES-03-01 (duplicate idempotency_key returns original event with is_duplicate=true)"
    root_cause_hypothesis: >
      src/event_store/store.zig:472 `append()`'s duplicate-idempotency-key path calls
      `rowToEventRecord(allocator, live_rows.rows[0], "")` to re-read and return the
      original event. rowToEventRecord itself (lines 1178, 1180, 1190) allocator.dupe()s
      event_type, payload, and metadata into the returned record -- but on this
      already-exists code path in append(), the caller never frees or takes ownership of
      those 3 strings once the record is constructed and returned up through the test.
      Exact same shape as the already-RESOLVED GH #526 (store.zig rowToDefinition leak,
      zero errdefer guards) -- this is a second, sibling instance of the same missing-
      ownership-transfer pattern in the same file, on a different function.
    disposition: DIRECT_FIX_CANDIDATE
    rationale_for_direct_fix: >
      Single file, single function, small fix (either free the 3 fields when the
      duplicate branch discards the record, or make ownership explicit at the call
      site). Same shape and same file as the already-resolved GH #526, so the fix
      pattern is proven. Low risk, no schema/migration involvement.
    severity: MINOR

