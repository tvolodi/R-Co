  - id: C6
    title: "svc04_admin_api_test: service registration/scope-change validation returns unexpected status codes (422/500/200 vs expected 201/200/409)"
    signature: "Zig assertion mismatches on HTTP status codes: expected 201 found 422 (x3), expected 200 found 500, expected 409 found 500, expected 409 found 200"
    affected_tests:
