  - id: C10
    title: "env01_test: 12 stale tenant_type-misconfigured rows found where 0 expected -- ALREADY COVERED by ISS-0100"
    signature: "Zig assertion: expected 0, found 12 (tenant rows with tenant_type != 'production' and production_tenant_id set)"
    affected_tests:
      - "env01_test.zig TC-ENV-01-03 (existing tenant rows have tenant_type='production' and production_tenant_id IS NULL)"
    root_cause_hypothesis: >
      Cross-test pollution, confirmed. GH #357 / ISS-0100 ("Integration test fixtures leak
      production-typed tenant rows ... clean_test_db.py cleanup misses them") is OPEN and
      describes exactly this symptom. Live verification after this run's test pass:
      `SELECT tenant_type, storage_mode, count(*) FROM public.tenant GROUP BY 1,2` shows
      15 production/LEGACY_RLS + 17 production/SCHEMA = 32 leaked production-typed rows
      sitting in the database, matching ISS-0100's documented mechanism (most INSERT INTO
      public.tenant statements across the test suite, including the shared
      ensureDefaultOidcSeeds() harness seed, omit tenant_type, defaulting it to
      'production'; tools/clean_test_db.py only sweeps tenant_type='test' rows). This
      fully explains env01_test's "expected 0, found 12" -- distinguishing hypothesis (a)
      genuine backfill gap vs (b) cross-test pollution from the original cluster
      description: it is (b), confirmed.
    disposition: ALREADY_COVERED
    covered_by: ISS-0100 (GH #357, OPEN, not previously queued)
    action_taken: >
      Not re-filed as a new issue -- would have been a pure duplicate of #357's own
      documented mechanism and affected-areas list. Added GH-357 to
      handoffs/global_queue.json (severity MAJOR) since it was not previously queued
      despite being open since 2026-07-31.
    severity: n/a (tracked under ISS-0100)

  - id: C11
    title: "Two OS-level socket errors (INVALID_HANDLE, CONNECTION_REFUSED) under full-suite connection contention"
    signature: "error.Unexpected NTSTATUS=0xc0000008 (INVALID_HANDLE); error.Unexpected NTSTATUS=0xc0000236 (CONNECTION_REFUSED)"
    affected_tests:
      - "db_integration_test.zig TC-DB-03-02 (exited with code 3 / crashed)"
      - "xc02_audit_immutability_test.zig TC-XC-02-01"
    root_cause_hypothesis: >
      Not a code defect in either test. Both are low-level Windows socket errors during
      connection teardown/rollback under ~20 concurrent test binaries contending for the
      same PostgreSQL instance -- the same class of infra flakiness already fixed for
      other symptoms in ISS-0182/ISS-0186/ISS-0187/GH-521/GH-528/GH-556 (pool exhaustion,
      advisory-lock contention, port contention). Given this class has been repeatedly
      fixed piecemeal rather than systemically, filing a new piecemeal fix for these two
      specific occurrences is unlikely to be durable; recommend treating as noise unless
      it reproduces deterministically on a re-run. Not filed as a new issue in this pass
      -- flagging for awareness only. If it reproduces on a subsequent
      test-integration-svc run, it should be filed then with the reproduction evidence.
    disposition: NOTED_NOT_FILED
    severity: n/a

