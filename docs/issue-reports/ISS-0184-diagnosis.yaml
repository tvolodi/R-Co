  - id: C8
    title: "sch02_timer_polling_test: 2 scheduler-behavior assertions fail (skip-locked-timer count, forced-failure rollback)"
    signature: "Zig assertion: skipped_locked > 0 (found 0); expected error.TransactionFailed found {fired:0, skipped_locked:0}"
    affected_tests:
      - "sch02_timer_polling_test.zig TC-SCH-02-02 (scheduler skips locked timers and does not fire CANCELLED timers)"
      - "sch02_timer_polling_test.zig TC-SCH-02-03 (firing rollback keeps timer PENDING when event append fails)"
    root_cause_hypothesis: >
      Not fully traced. TC-SCH-02-03 sets up a duplicate idempotency_key collision on
      purpose to force pollDueTimers() into a transaction failure, but the poller instead
      returns a normal {fired:0, skipped_locked:0} result -- suggesting the poller may be
      silently swallowing the forced DB error rather than surfacing
      SchedulerError.TransactionFailed, or the collision setup itself isn't landing
      (needs verification the INSERT that pre-seeds the conflicting idempotency_key
      actually commits before pollDueTimers runs). TC-SCH-02-02's locked-timer skip count
      being 0 instead of >0 suggests either the row-lock isn't being held by the
      concurrent locker helper the test expects, or the poller's SKIP LOCKED query isn't
      hitting the intended row. Two related but distinct scheduler-logic questions in one
      file; needs a scheduler-code read (src/scheduler or bpm.scheduler_poller) beyond
      this diagnosis pass's scope.
    disposition: SPLIT
    filed_as: ISS-0618
    github_issue: https://github.com/tvolodi/R-Co/issues/567
    severity: MAJOR

