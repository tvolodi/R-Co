fix_sequencing:
  rationale: |
    The three requirements have a non-trivial dependency graph:
      - LUA-15 must land first because executeSource's failed-pcall branch
        is the read site for the explicit-failure discriminator; LUA-16
        uses that same branch to decide between SCRIPT_ERROR (runtime)
        vs no-event (explicit failure is LUA-15's job).
      - LUA-16 depends on LUA-15 (shared branch + shared ScriptResult
        shape change) AND on LUA-08/09 (instruction_count /
        memory_peak_bytes sources) per the issue's sequencing note.
      - LUA-12 is independent of LUA-15/16; it can land in parallel
        with the LUA-15 work, but its ServiceCatalog-reachability
        decision affects ExecutionContext field layout (which LUA-15
        may also want to extend, e.g. for an explicit_failure channel
        installation helper).
    Sibling batch 2 (ISS-0624, LUA-11/13) is itself in scope for a
    different run; that run also adds fields to ExecutionContext
    (pending_writes, StructuredLogger, trace_id). Co-evolving
    ExecutionContext in two concurrent runs would create merge
    conflicts and is the obvious reason the original 9-requirement
    scope was split into batches. This run should not touch LUA-11
    /LUA-13 scope.
  recommended_order:
    - step: "1. CODE-DESIGNER: produce src/design/lua-tranche-3-fix.md with the two decisions (LUA-12 scope + return shape) and the LUA-15/16/08/09 wiring plan"
      artifacts_out:
        - src/design/lua-tranche-3-fix.md
      decisions_to_make:
        - "LUA-12 scope"
        - "LUA-12 return shape"
        - "ScriptResult.error_kind enum (RuntimeError / ExplicitFailure / CompileError)"
        - "ScriptErrorPayload construction: surface on ScriptResult OR push via event_store directly (the executor does no I/O per transition.zig precedent — the engine-side worker reads ScriptResult and emits)"
    - step: "1b. CODE-DESIGN-VALIDATOR: hard gate on the design above"
      artifacts_out:
        - handoffs/WF03-GH592-20260808/step-01b-design-validation.json
    - step: "2. BACKEND-DEV: implement LUA-15 (registry migration + ScriptResult.error_kind)"
      artifacts_out:
        - src/lua/host_api/fail.zig
        - src/lua/executor.zig (executeSource pcall branch)
        - tests under src/lua/ for fail + executeSource
      blocked_by: step 1b PASS
    - step: "3. TEST-DESIGNER: write tests/specs/LUA-15.md-impl against the new branch + tests per TC-LUA-15-01..16"
      artifacts_out:
        - tests/specs/LUA-15.md-impl
        - test file(s) under src/lua/ or tests/integration/
      blocked_by: step 2 (tests must exercise the real wiring)
    - step: "3b. TEST-DESIGN-VALIDATOR: hard gate"
      blocked_by: step 3
    - step: "4. BACKEND-DEV: implement LUA-12 (ServiceCatalog scope decision applied) + LUA-16 (captureStackTrace + ScriptErrorPayload surface)"
      artifacts_out:
        - src/lua/host_api/call_service.zig
        - src/lua/executor.zig (captureStackTrace call site, only if LUA-08/09 also land in this run)
        - src/lua/events.zig (ScriptErrorPayload surface method)
        - tests
      blocked_by: step 3b PASS
      conditional: |
        LUA-16 ScriptErrorPayload construction MUST be skipped if
        LUA-08/09 do not land in the same run; otherwise the
        instruction_count field would always be 0 and read as
        misleadingly broken. If LUA-08/09 are deferred, only the
        captureStackTrace portion of LUA-16 lands and the
        ScriptErrorPayload surface is deferred.
    - step: "5. TEST-RUNNER: run zig build, zig build test, zig build test-integration"
      blocked_by: step 4
    - step: "6. DOC-UPDATER: update requirement_status.yaml, CHANGELOG.md, close-out per WF-03"
      blocked_by: step 5 PASS
    - step: "Final. BACKEND-DEV: git-merge per GH-merge protocol"

