prevention:
  - rule: |
      Every function that opens a transaction with BEGIN and issues unqualified
      table queries MUST issue SET LOCAL search_path immediately after BEGIN
  - pattern: "Follow ISS-0130 / PR #531 pattern for all new transactional code"
  - verification: |
      Grep for 'conn.exec("BEGIN"' → verify SET LOCAL search_path follows within
      3 lines (accounting for errdefer and comments)

architectural_note: |
  This is the third instance of the stale-session-search_path pattern:
  1. ISS-0114: pool.zig routing resolver fallback
  2. ISS-0130: migrations.zig per-transaction SET LOCAL (RESOLVED)
  3. ISS-0128: event_store.zig per-transaction SET LOCAL (this issue)
  
  The session-level SET search_path issued by applyRequestStorageRouting
  (src/db/pool.zig:258) is a baseline but cannot be trusted when connections
  are reused from the pool. Every transactional code path must use SET LOCAL
  to guarantee schema visibility within its own transaction.

