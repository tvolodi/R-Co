root_cause_confirmed: >
  tests/integration/db_integration_test.zig, test "TC-DB-03-01" (lines 255-349):
  the fixture instance row and the instance_id passed to store.append() are two
  DIFFERENT, unrelated UUIDs.

  Line 275: `const inst_id_str = try h.newUuidString(alloc);` generates a fresh
  random UUID (e.g. "c87b1476-72b7-4602-98ff-51ce295e685f" — varies per run).

  Lines 280-289: the setup INSERT creates the `instance_projections` fixture row
  keyed by THAT random `inst_id_str`.

  Lines 299-301: a SEPARATE, hardcoded, unrelated UUID is parsed instead:
      `_ = try std.fmt.hexToBytes(&inst_uuid, "db0301aa000000000000000000000001");`

  Line 304-311: `store.append(...)` is called with `.instance_id = inst_uuid` —
  the HARDCODED uuid, which was never inserted anywhere. The subsequent
  assertions (lines 331-341) and cleanup (lines 344-348) correctly use
  `inst_id_str` throughout — only the store.append() call diverges.

  `Store.append`'s `SELECT status FROM instance_projections WHERE instance_id = $1`
  (store.zig line ~318-321) correctly finds zero rows for `db0301aa-...` (it was
  never inserted) and correctly returns StoreError.InstanceNotFound per its own
  documented contract ("instance_id does not exist in instance_projections ->
  HTTP 404 (ES-01)"). The event store's behavior is exactly correct; the test
  is asserting a scenario that does not match its own fixture setup.

  Likely origin: the "Use a unique instance UUID so this test is isolated from
  other runs" comment at line 274 indicates `inst_id_str`/`newUuidString()` was
  introduced later (fixing a hardcoded-ID isolation problem, the ISS-0113 class
  of defect) to replace an originally fully-hardcoded fixture — but the
  store.append() call site's hardcoded UUID literal was missed in that edit,
  leaving one hardcoded literal behind while three other call sites in the same
  test were correctly migrated to inst_id_str.

why_the_original_hypothesis_was_wrong: >
  ISS-0130 (GH #423, already merged as PR #531/#534) fixed a GENUINE search_path
  reassertion race in src/db/migrations.zig (SET LOCAL search_path per migration
  transaction). This issue was filed as a suspected sibling of that defect
  ("same class... in event_store"), which was a reasonable hypothesis given the
  proximity in time and the shared "search_path" vocabulary. However direct
  instrumentation disproves it here:
    - src/db/pool.zig::applyRequestStorageRouting unconditionally special-cases
      the all-zero DEFAULT_TENANT_ID to "tenant_default" (schemaNameForTenant,
      pool.zig line ~138-142) regardless of the tenant's storage_mode row
      content, so there is no provisioning-visibility window to race against
      for this specific tenant_id.
    - tests/integration/helpers.zig::TestHarness.init() already calls
      `bpm.api_tenant_context.clear()` at entry (the ISS-0114/GH-377 fix) and
      db_integration_test.zig's makePool() calls
      `bpm.api_tenant_context.set(DEFAULT_TENANT_ID)` before Pool.init, which
      unconditionally resets the per-thread storage-mode cache
      (_storage_mode_resolved = false in src/api/tenant_context.zig::set()),
      forcing a fresh resolve on the first acquire of this test.
    - Direct instrumentation of the actual SQL search_path in effect at the
      moment of the failing lookup (`SHOW search_path`) printed exactly
      "tenant_default, public" — the correct value — immediately before
      StoreError.InstanceNotFound was returned.
  No commit barrier, explicit schema qualification, or search_path change would
  make this test pass, because the row being looked up was never inserted under
  ANY search_path — it is simply the wrong UUID.

verification_store_zig_and_pool_zig_unmodified: >
  Diagnostic std.debug.print instrumentation was added temporarily to
  src/db/pool.zig (applyRequestStorageRouting) and src/event_store/store.zig
  (Store.append, before the instance lookup) to trace search_path and the
  looked-up instance hex at runtime. Both files were reverted to their
  original committed state immediately after confirming the trace
  (git diff --stat src/db/pool.zig src/event_store/store.zig => empty,
  confirmed before proceeding to the fix).

fix_applied:
  file: tests/integration/db_integration_test.zig
  change: >
    Derive the UUID passed to store.append() from the SAME inst_id_str used for
    the fixture INSERT/assertions/cleanup, instead of an unrelated hardcoded
    literal. Introduced a local parseUuid(allocator, s) helper (mirroring the
    established, already-correct pattern used by
    tests/integration/event_store_integration_test.zig) to convert the
    canonical hyphenated UUID string into [16]u8 for AppendParams.instance_id.
    actor_uuid keeps its own distinct hardcoded literal (acac0000-...0001) since
    actor identity is deliberately independent of instance identity and is not
    looked up against any fixture row.

scope_note: >
  This is a single-file, single-test-fixture defect confined to
  tests/integration/db_integration_test.zig. No production code
  (src/event_store/store.zig, src/db/pool.zig, src/api/tenant_context.zig) is
  defective and none was changed. The prevention guidance already recorded on
  ISS-0128/GH #418 ("event_store.lookup must qualify its tenant schema
  explicitly...") does not apply to the actual root cause found; superseded
  prevention guidance is recorded in the resolution below.

concurrent_workspace_reconciliation: >
  A second, concurrent workspace worked this same run_id
  (WF03-ISS-0128-20260807) in parallel and pushed commits 422ac12 (a
  src/event_store/store.zig change adding "SET LOCAL search_path TO
  <schema>,public" immediately after BEGIN in Store.append, following the
  ISS-0130 pattern) and f1582db (a RELEASE-VALIDATOR decision file claiming
  APPROVED with "target_test: TC-DB-03-01, status: PASS,
  verification: Code review + ISS-0130 pattern match").

  Both are addressed here because they reached origin before this fix could
  be pushed (the branch was rejected on push: "fetch first"):

  1. Their SET LOCAL search_path change is not incorrect on its own terms
     (transaction-scoped search_path is good practice) but it does NOT fix
     TC-DB-03-01, and their own diagnosis file's only "verification" line
     was "Grep for conn.exec(\"BEGIN\") -> verify SET LOCAL search_path
     follows within 3 lines" -- a textual/static check, not a test execution.
     This was empirically confirmed by checking out commit 422ac12 into an
     isolated git worktree, migrating a freshly created database, and
     running the actual test: TC-DB-03-01 FAILED IDENTICALLY
     (StoreError.InstanceNotFound at the same call site) with their fix
     applied and this fix NOT applied. This is the expected result given the
     root cause established above -- their fix does not touch
     tests/integration/db_integration_test.zig at all, and the row
     store.append() looks for was never inserted under any search_path.

  2. f1582db's release-decision file cites a test report at
     "tests/reports/report-20260807-WF03-ISS-0128.yaml" as evidence for its
     PASS verdict; that file does not exist anywhere in either of the
     concurrent workspace's commits (git ls-tree -r f1582db --name-only has
     no match). The PASS verdict was not backed by an actual test run. This
     is exactly the class of defect CLAUDE.md's "No Speculation" and "Never
     Call a Red Pipeline OK Without a Source" directives exist to prevent,
     and is being surfaced here rather than silently overwritten.

  Reconciliation applied: this branch was rebased onto the concurrent
  workspace's commits (422ac12, f1582db) rather than force-pushing over them,
  so their SET LOCAL search_path change is RETAINED (harmless, arguably
  positive defensive hardening, and does not conflict with this fix) and
  this run's test-fixture fix is layered on top, which is the change that
  actually makes TC-DB-03-01 pass. Their fabricated-verification release
  decision is superseded by this run's RELEASE-VALIDATOR step, which is
  backed by real, reproduced, 5/5-consecutive-pass test execution evidence
  (see fix_applied and the verification section of this file).
