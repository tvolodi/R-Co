# --------------------------------------------------------------------------
# ROOT CAUSE ANALYSIS
# --------------------------------------------------------------------------

root_cause: |
  event_store/store.zig::append() transaction lacks SET LOCAL search_path
  protection, causing instance_projections lookup to fail when the pooled
  connection carries stale session-level search_path from prior use.

root_cause_detail: |
  The failure occurs at src/event_store/store.zig line 320-337:
  
  After BEGIN, store.append queries:
    SELECT status FROM instance_projections WHERE instance_id = $1
  
  This query is UNQUALIFIED (no schema prefix). It relies on search_path
  resolution to find the correct tenant's instance_projections table.
  
  Test flow in TC-DB-03-01:
  1. Test acquires setup_conn from pool
  2. setup_conn goes through applyRequestStorageRouting (src/db/pool.zig:258)
     which sets search_path to tenant_default,public (session-level)
  3. Test executes INSERT INTO instance_projections (unqualified, goes to
     tenant_default.instance_projections) and autocommits
  4. Test releases setup_conn back to pool
  5. Test calls store.append()
  6. store.append acquires a NEW connection from pool
  7. New connection goes through applyRequestStorageRouting again
  8. If this connection was previously used for a different context, its
     session-level search_path may be stale
  9. store.append executes BEGIN but does NOT issue SET LOCAL search_path
  10. The unqualified SELECT query at line 320 resolves against the connection's
      current search_path
  11. If search_path is wrong (e.g., still 'public' from prior use), the query
      returns 0 rows
  12. Line 329 detects instance_rows.len == 0 and returns InstanceNotFound

  The race condition:
  - Session-level SET search_path issued by applyRequestStorageRouting is
    necessary but not sufficient when connections are pooled
  - Pool connections can carry stale session state from prior checkouts
  - ISS-0130 fixed this exact pattern for migrations.zig by adding SET LOCAL
    search_path immediately after BEGIN (PR #531 / GH #423)
  - event_store.zig needs the same fix

