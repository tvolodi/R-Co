summary: >
  The stated root-cause hypothesis (search_path / schema-visibility race between
  tenant provisioning and event_store.lookup, analogous to ISS-0130) is INCORRECT
  for this failure. Live instrumentation of both the connection-routing layer
  (src/db/pool.zig::applyRequestStorageRouting) and the lookup query itself
  (src/event_store/store.zig::Store.append) confirms the connection's search_path
  is correctly set to "tenant_default, public" at the exact moment of the failing
  lookup. StoreError.InstanceNotFound is the CORRECT return value given the actual
  arguments passed to store.append — the defect is a test-fixture bug in
  tests/integration/db_integration_test.zig's TC-DB-03-01, not a production defect
  in the event store or connection pool.

