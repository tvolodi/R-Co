# --------------------------------------------------------------------------
# RESOLUTION STRATEGY
# --------------------------------------------------------------------------

resolution_strategy: |
  Apply the ISS-0130 pattern (PR #531) to event_store.zig::append():
  
  1. After BEGIN (line 306), immediately issue SET LOCAL search_path
  2. Use tenant_id from params to derive schema name via schemaNameForTenant
  3. SET LOCAL is transaction-scoped, auto-reset on COMMIT/ROLLBACK
  4. All subsequent unqualified queries in the transaction will resolve correctly
  
  Pattern to implement (from migrations.zig as reference):
  
    conn.exec("BEGIN", &.{}) catch return StoreError.TransactionFailed;
    errdefer conn.exec("ROLLBACK", &.{}) catch {};
    
    // NEW: Set transaction-scoped search_path
    const schema_name = deriveSchemaName(params.tenant_id);
    const set_path_sql = try std.fmt.allocPrint(
        allocator,
        "SET LOCAL search_path TO {s},public",
        .{schema_name}
    );
    defer allocator.free(set_path_sql);
    conn.exec(set_path_sql, &.{}) catch {
        conn.exec("ROLLBACK", &.{}) catch {};
        return StoreError.TransactionFailed;
    };
    
    // Existing: pipeline_run_id set_config
    if (effective_pipeline_run_id.len > 0) { ... }
    
    // Existing: instance_projections query (now guaranteed correct schema)
    const instance_rows = conn.query(...);

