    result: "FAILS -- migration bootstrap itself is broken, before any test runs"
    failing_migration: migrations/011_webhook_subscriptions.sql
    error: >
      "Migration scope mismatch: 011_webhook_subscriptions.sql is declared
      public-only (GBL- prefix or '-- scope: public') but performs unqualified
      table work that needs the per-tenant pass."
    confirmed_systemic: >
      Pre-seeding the ledger row for 011 and re-running migrate reproduces the
      identical error at the next affected file, 022_obs06_alerting_state.sql.
      A full scan found 9 affected files total, all last touched by the same
      commit.
    root_cause_commit: a2a8c68 (PR #569, ISS-0185 / GH #518, merged 2026-08-08)
    root_cause_mechanism: >
      a2a8c68 added '-- scope: public' headers to 9 numeric migration files as
      part of ISS-0185's dual-schema-shadow cleanup, without qualifying those
      files' CREATE TABLE / INSERT INTO statements with 'public.'. The
      scope-mismatch guard (declaresUnqualifiedTableWork() in
      src/db/migrations.zig, built by ISS-0604/GH-470 for exactly this defect
      class) correctly fires on fresh apply.
    why_invisible_until_now: >
      db_test container created 2026-08-06, three days before a2a8c68 merged
      2026-08-08. public.schema_migrations already recorded all 9 files as
      applied before the defect entered their content, so migrate silently
      skips re-evaluating them on any long-lived shared database. This is the
      shared_db_container_trap pattern already documented in
      docs/anti-patterns.md from ISS-0150's own 2026-08-07 resolution,
      recurring against a different migration set.
    affected_files:
