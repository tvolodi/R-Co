findings:
  - id: AUD-01
    severity: HIGH
    title: Committed binary artifacts (~15 MB) tracked in git
    detail: >-
      8 binary files tracked that should never be in version control.
      zig-out-check/bin/bpm-platform.exe (7.5 MB) + .pdb committed in 10b86c8
      (PR #71). scratch/zig-cache-wf03-intfix/**/*.exe,.pdb,.obj (6 files)
      committed in dd038c8 (PR #62). zig-out-check/ is NOT in .gitignore (only
      zig-out/ is).
    fix: >-
      Add zig-out-check/ to .gitignore, then
      git rm -r --cached zig-out-check scratch/zig-cache-wf03-intfix.
    files:
      - zig-out-check/bin/bpm-platform.exe
      - zig-out-check/bin/bpm-platform.pdb
      - scratch/zig-cache-wf03-intfix/
      - .gitignore

  - id: AUD-02
    severity: HIGH
    title: zig build test aborts the whole runner on a DB-touching unit test
    detail: >-
      tests/unit/test_api08_auth.zig::TC-IDN-04-05b calls ensureTenantDefaultSchema
      -> provisionTenantSchema -> runForSchema, which panics. The test intends to
      skip without BPM_TEST_DB_URL, but a local .env sets it, so it connects to a
      DB in an unexpected state and aborts the entire test runner, taking unrelated
      tests down. Build itself is fine; this is a test-isolation fragility (panic
      path instead of typed error in a unit test).
    fix: >-
      Make ensureTenantDefaultSchema failures return a typed error / SkipZigTest
      instead of panicking, so one bad DB state cannot kill the whole runner.
    files:
      - tests/unit/test_api08_auth.zig
      - src/db/provisioning.zig
      - src/db/migrations.zig

