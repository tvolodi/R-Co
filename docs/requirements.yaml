  SBX-01:
    id: SBX-01
    title: Orchestrator role gate on task-spec submission
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** IDN-05, separating the orchestrating agent from the implementing agent at the API layer.

      > Task-spec submission at `POST /api/v1/agent/task-specs` SHALL require the `agent.submit_task_spec` scope AND the `tenant_orchestrator` realm role on the verified token. Either credential alone SHALL return HTTP 403 `orchestrator_role_required`. The check SHALL execute in the request handler, not in a gateway rule and not by deploying the two agent classes to separate network segments, so a direct call to the service port is subject to the same gate. A principal holding both `tenant_orchestrator` and `tenant_implementer` SHALL be rejected at token verification with HTTP 403 `conflicting_agent_roles`.

      **Acceptance Criteria:**
      - GIVEN a token carrying `agent.submit_task_spec` but not the `tenant_orchestrator` realm role, WHEN a task spec is submitted, THEN the platform returns HTTP 403 `orchestrator_role_required` and writes no `task_specs` row.
      - GIVEN a token carrying the `tenant_orchestrator` realm role but not the `agent.submit_task_spec` scope, WHEN a task spec is submitted, THEN the same HTTP 403 `orchestrator_role_required` is returned.
      - GIVEN a token carrying both credentials, WHEN a task spec is submitted, THEN it is accepted and persisted with the server-set principal of SBX-02.
      - GIVEN a caller bypasses the gateway and calls the service port directly with an implementer token, WHEN the handler executes, THEN the role gate still returns HTTP 403 `orchestrator_role_required`.
      - GIVEN a token whose `realm_access.roles` carries both `tenant_orchestrator` and `tenant_implementer`, WHEN any agent endpoint is called, THEN the platform returns HTTP 403 `conflicting_agent_roles` at token verification.
      - Every rejected submission appends `TaskSpecSubmissionRejected` naming the principal, the tenant, and which of the two credentials was absent.

      **See:** IDN-05, IDN-02, SBX-02, SBX-03, AGT-02, XC-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:05Z'
    workflow: PW-12
  SBX-02:
    id: SBX-02
    title: Server-authoritative orchestrator principal
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SBX-01, making the orchestrator identity server-authoritative.

      > The task-spec handler SHALL set `spec.orchestrator_principal` to the subject of the verified token before the spec is canonicalised, and SHALL discard any `orchestrator_principal` present in the request body without raising an error. The persisted JSON is therefore authoritative, and because canonicalisation precedes hashing, the AGT-04 `spec_hash` covers the server-set value. A spec cannot be registered under an orchestrator identity the caller does not hold.

      **Acceptance Criteria:**
      - GIVEN a token whose subject is `orch-a`, WHEN a spec is submitted with no `orchestrator_principal` in the body, THEN the persisted spec carries `orchestrator_principal` of `orch-a`.
      - GIVEN a token whose subject is `orch-a`, WHEN a spec is submitted with `"orchestrator_principal": "orch-b"` in the body, THEN the submitted value is discarded, the persisted spec carries `orch-a`, and no error is returned.
      - GIVEN the same submission, WHEN `spec_hash` is computed, THEN it is computed over the canonical JSON carrying `orch-a`, so a client that computed its hash over `orch-b` receives HTTP 409 `spec_hash_mismatch` on artifact submission.
      - GIVEN two orchestrators submit byte-identical spec bodies, WHEN both are persisted, THEN their canonical forms differ in `orchestrator_principal` and their `spec_hash` values differ.
      - GIVEN a persisted spec, WHEN it is read back, THEN `orchestrator_principal` matches the token subject recorded in the `TaskSpecSubmitted` audit entry for that submission.
      - The force-set runs before canonicalisation, so no code path hashes a client-supplied principal.

      **See:** SBX-01, AGT-04, AGT-05, IDN-05, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:07Z'
    workflow: PW-12
  SBX-03:
    id: SBX-03
    title: Orchestrator excluded from sandbox claim
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SBX-01, denying the orchestrator execution authority over sandboxes.

      > The sandbox claim endpoint SHALL reject any caller holding the `tenant_orchestrator` realm role with HTTP 403 `orchestrator_may_not_claim`, and SHALL require the `tenant_implementer` realm role, returning HTTP 403 `implementer_role_required` otherwise. The orchestrator retains supervisory read across every sandbox in its tenant through `GET /api/v1/agent/sandboxes`, which exposes state, owner principal, and `task_spec_id` and exposes no execution endpoint. An orchestrator therefore cannot drive a sandbox while holding cross-sandbox visibility.

      **Acceptance Criteria:**
      - GIVEN a caller holding `tenant_orchestrator`, WHEN it calls the claim endpoint, THEN the platform returns HTTP 403 `orchestrator_may_not_claim` and the sandbox remains unowned.
      - GIVEN a caller holding neither agent realm role, WHEN it calls the claim endpoint, THEN the platform returns HTTP 403 `implementer_role_required`.
      - GIVEN a caller holding `tenant_orchestrator`, WHEN it calls `GET /api/v1/agent/sandboxes`, THEN it receives state, owner principal, and `task_spec_id` for every sandbox in its tenant and for no sandbox outside it.
      - GIVEN a caller holding `tenant_orchestrator`, WHEN it calls any sandbox execution route, THEN the platform returns HTTP 403 `orchestrator_may_not_claim`; supervisory read grants no execution path.
      - GIVEN a caller holding `tenant_implementer`, WHEN it calls `GET /api/v1/agent/sandboxes`, THEN the listing is restricted to sandboxes bound to that principal.
      - Every rejected claim appends `SandboxClaimRejected` naming the acting principal, the sandbox, and the rejection identifier.

      **See:** SBX-01, SBX-04, SBX-05, SBX-06, IDN-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:08Z'
    workflow: PW-12
  SBX-04:
    id: SBX-04
    title: Sandbox ownership binding at claim
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SBX-03, binding a sandbox to exactly one implementing agent.

      > A claim SHALL bind the sandbox to the triple `(tenant_id, agent_principal, task_spec_id)` under the unique index `ux_sandbox_owner`. One sandbox has exactly one owner, and one task spec has exactly one sandbox. A claim against a sandbox already bound to a different principal SHALL return HTTP 409 `sandbox_already_claimed` without naming the current owner. Every request that operates inside a claimed sandbox SHALL be checked against the bound `agent_principal`, and a mismatch SHALL return the SBX-05 sentinel rather than a distinct error.

      **Acceptance Criteria:**
      - GIVEN an unowned sandbox in the caller's tenant, WHEN an implementer claims it with a `task_spec_id`, THEN the binding row is written, `claimed_at` is set, and the platform returns HTTP 201.
      - GIVEN a sandbox bound to principal `impl-a`, WHEN principal `impl-b` in the same tenant claims it, THEN the platform returns HTTP 409 `sandbox_already_claimed` and the response body does not name `impl-a`.
      - GIVEN a sandbox bound to `impl-a` for `task_spec_id` T, WHEN `impl-a` claims a second sandbox for the same T, THEN the platform returns HTTP 409 `sandbox_already_claimed`; the unique index covers the task spec as well as the sandbox.
      - GIVEN a sandbox bound to `impl-a`, WHEN `impl-b` issues an execution request inside it, THEN the platform returns HTTP 403 `sandbox_not_accessible`, the same sentinel returned for an unknown sandbox.
      - GIVEN two implementers claim one unowned sandbox concurrently, WHEN both execute, THEN the unique index admits exactly one binding and the other receives HTTP 409 `sandbox_already_claimed`.
      - GIVEN a released sandbox, WHEN it is claimed again, THEN a new binding row is written and the prior owner has no residual access.

      **See:** SBX-03, SBX-05, SBX-06, AGT-03, TNT-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:09Z'
    workflow: PW-12
  SBX-05:
    id: SBX-05
    title: Single sentinel for inaccessible sandboxes
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SBX-04, closing the sandbox existence oracle across tenants.

      > A sandbox that does not exist, a sandbox owned by another tenant, and a sandbox owned by another principal in the caller's tenant SHALL all return HTTP 403 `sandbox_not_accessible` with a byte-identical response body and an identical header set. One sentinel error covers all three cases, so no response code, body, header, or latency difference can be used to establish that a `sandbox_id` exists outside the caller's ownership. The tenant scope filter SHALL be applied in the same query that loads the sandbox row, so a found-then-rejected path that would differ in timing does not exist.

      **Acceptance Criteria:**
      - GIVEN a `sandbox_id` that exists in no tenant, WHEN an implementer references it, THEN the platform returns HTTP 403 `sandbox_not_accessible`.
      - GIVEN a `sandbox_id` that exists in another tenant, WHEN an implementer references it, THEN the response body and headers are byte-identical to the unknown-sandbox case above.
      - GIVEN a `sandbox_id` in the caller's tenant bound to another principal, WHEN an execution request is issued, THEN the same HTTP 403 `sandbox_not_accessible` is returned.
      - GIVEN the sentinel is returned, WHEN the row is loaded, THEN the tenant predicate is part of the loading query, so the unknown and cross-tenant cases execute the same statement shape and return in the same latency band.
      - GIVEN a caller probing 100 sequential UUIDs, WHEN each returns the sentinel, THEN no response distinguishes an existing sandbox from a nonexistent one, and after 20 sentinel responses in one minute the principal receives HTTP 429 `probe_rate_exceeded`.
      - HTTP 409 `sandbox_already_claimed` of SBX-04 is returned only for a sandbox already visible to the caller within its own tenant, so it discloses no cross-tenant existence.

      **See:** SBX-04, SBX-06, TNT-01, XC-05, FIL-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:10Z'
    workflow: PW-12
  SBX-06:
    id: SBX-06
    title: Sandbox release, reclaim, and claim audit
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SBX-04, defining release, reclaim, and the audit record for sandbox ownership.

      > Only the bound `agent_principal` SHALL release a sandbox; a release by any other caller returns HTTP 403 `sandbox_not_accessible`. A sandbox whose owner has issued no request for 60 minutes SHALL be reclaimed by the pool manager, which clears the binding, sets state `released`, and appends `SandboxReclaimed` naming the prior owner. Claims, rejected claims, releases, and reclaims SHALL each append an audit entry carrying the acting principal, `tenant_id`, `sandbox_id`, and `task_spec_id`, so a probing burst is visible in the audit record even though SBX-05 gives the prober no response signal.

      **Acceptance Criteria:**
      - GIVEN a sandbox bound to `impl-a`, WHEN `impl-b` calls release, THEN the platform returns HTTP 403 `sandbox_not_accessible` and the binding is unchanged.
      - GIVEN a sandbox bound to `impl-a`, WHEN an orchestrator calls release, THEN the platform returns HTTP 403 `sandbox_not_accessible`; supervisory read grants no release authority.
      - GIVEN a sandbox bound to `impl-a`, WHEN `impl-a` calls release, THEN state becomes `released`, the binding row is cleared, and `SandboxReleased` is appended.
      - GIVEN an owner that issues no request for 61 minutes, WHEN the pool manager evaluates idleness, THEN the sandbox is released, `SandboxReclaimed` is appended naming the prior owner, and the sandbox becomes claimable by another implementer.
      - GIVEN a principal that triggers 30 sentinel responses in one minute, WHEN the audit log is read, THEN 30 `SandboxClaimRejected` entries name that principal and the requested `sandbox_id` values, and the entries carry the owning tenant even though no response did.
      - GIVEN an implementing agent terminates while holding a claim, WHEN 60 minutes elapse, THEN the sandbox is reclaimed and its `task_spec_id` is claimable again without operator action.

      **See:** SBX-04, SBX-05, SBX-03, OBS-03, XC-05, ADP-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:11:11Z'
    workflow: PW-12
  VLD-01:
    id: VLD-01
    title: Typed environment from definition context
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL build a typed environment for expression validation from the definition's own declarations: the `variable_schema`, the declared result schemas of referenced service catalog entries (REPO-07, SVC-01), the declared output schemas of referenced `module_ref` modules (PLC-01), and the field types of each human task's form schema. The declared type names map as follows: `string`, `text` and `enum` to string; `integer`, `decimal` and `money` to number; `boolean` to bool; `date` and `datetime` to timestamp; `list<T>` to a list of the mapped element type; `object` to map.

      **Acceptance Criteria:**
      - GIVEN `variable_schema` declares a type name outside the mapping table, WHEN the environment is built, THEN the platform returns HTTP 422 `UnknownVariableType` naming the variable and the type.
      - GIVEN a SERVICE_TASK references a catalog entry that declares no result schema, WHEN the environment is built, THEN the platform returns HTTP 422 `UndeclaredResultSchema` naming the node and the reference.
      - GIVEN two form fields in one human task scope declare the same name with different types, WHEN the environment is built, THEN the platform returns HTTP 422 `ConflictingFieldType` naming both declarations.
      - The environment is derived from declarations only; no instance variable value contributes a type.
      - A node output type is visible only to expression sites on nodes reachable after that node, and a form field type only inside its own human task scope.

      **See:** PD-06, EE-05, REPO-07, SVC-01, PLC-01, VLD-02
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-16T08:21:15Z'
    workflow: PW-02
    note: 'Released via WF03-vld-impl-bugs-20260816 (stage 16, expression validation; ISS-0709/GH #799
      fix verified 40/40 + 14/14 + 5/5).'
    implemented_in:
    - src/validation/mod.zig
    - src/validation/env.zig
    - src/validation/scope.zig
    - src/validation/typecheck.zig
    - src/validation/site.zig
    - src/validation/pd06.zig
