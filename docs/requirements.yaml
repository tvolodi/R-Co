  EE-01:
    id: EE-01
    title: Start instance
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > An authorised caller SHALL start a process instance by supplying a definition ID (or name + version), an optional correlation key (unique per definition), and an initial variables map (JSON object). The platform returns an `instance_id` and sets status = ACTIVE.

      **Acceptance Criteria:**
      - GIVEN an authorised caller submits a valid start request with an existing ACTIVE definition ID, WHEN processed, THEN the platform returns HTTP 201 with `instance_id` (UUID), `status = ACTIVE`, and `created_at`.
      - GIVEN a `correlation_key` is supplied, WHEN a second start request is made for the same definition with the same correlation key, THEN HTTP 409 is returned (uniqueness per definition).
      - GIVEN no `correlation_key` is supplied, no uniqueness constraint is applied; multiple keyless instances of the same definition may run concurrently.
      - `initial_variables` MUST be a JSON object (not null, not array). An empty object `{}` is permitted.
      - GIVEN a definition that is not in ACTIVE status, WHEN a start request is made, THEN HTTP 409 is returned.
      - A snapshot of the definition graph is stored atomically with the instance creation event (PD-08).
      - The execution token is placed on the START node; the first task activation (EE-03) fires immediately for the first non-START node.

      **See:** PD-08 (snapshot stored on start), EE-02 (transition function moves token off START immediately), EE-09 (initial_variables populate the instance variable map)

      **Edge cases:**
      - `initial_variables = null`: rejected with HTTP 422; use `{}` for empty variables.
      - Starting from a definition by name when there is no ACTIVE version: HTTP 404.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/definition/snapshot.zig
    - src/definition/store.zig
    - migrations/005_instances.sql
    - src/engine/instance.zig
    - src/api/routes/instances.zig
    - tests/integration/ee01_start_instance_test.zig
    released_at: '2026-05-22'
    release_run: WF02-ee01-20260522
    type: requirement
  EE-02:
    id: EE-02
    title: Pure transition function
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > The execution engine SHALL implement a pure function: `(DefinitionSnapshot, InstanceState, Event) → NewInstanceState`. This function MUST have no I/O and be independently unit-testable.

      **Acceptance Criteria:**
      - GIVEN any `(DefinitionSnapshot, InstanceState, Event)` triple, WHEN the transition function is called, THEN it returns a new `InstanceState` without performing any I/O (no database reads, no network calls, no file system access).
      - The function MUST be deterministic: identical inputs MUST always produce identical outputs.
      - A test suite MUST exercise the function directly with in-memory inputs without starting the platform; this test suite MUST pass at 100% before the function is integrated with persistence (per stage note).
      - The function covers all node-type transitions defined in PD-05 and gateway rules in EE-05, EE-06, EE-07.
      - An unknown event type passed to the function MUST return an error state, not panic or crash.

      **See:** EE-01 (provides the DefinitionSnapshot and initial InstanceState), EE-03..EE-10 (all runtime behaviours route through this function), NFR-07 (purity enables crash-safe replay)

      **Edge cases:**
      - InstanceState with a token on a non-existent node ID: the function MUST return an error state identifying the inconsistency.
      - Calling the function with the same inputs twice in rapid succession: both calls return identical output (no side effects).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    - src/main.zig
    - tests/unit/engine_test.zig
    type: requirement
  EE-03:
    id: EE-03
    title: Task activation
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > Upon entering a node, the platform SHALL create a Task record with status = PENDING and persist it atomically with the state transition event.

      **Acceptance Criteria:**
      - GIVEN the execution token enters a HUMAN_TASK node, WHEN the transition function produces a new state, THEN the persistence layer creates a Task record with `status = PENDING`, `task_id` (UUID), `instance_id`, `node_id`, `assignee_type`, `assignee_ref`, and `created_at`.
      - The Task record creation and the state transition event append MUST occur in a single transaction (DB-03).
      - START and END nodes MUST NOT create Task records.
      - EXCLUSIVE_GATEWAY and PARALLEL_GATEWAY nodes MUST NOT create Task records (gateway evaluation is internal to the transition function).
      - A newly created Task is visible to `GET /tasks` immediately after its transaction commits.

      **See:** EE-02 (transition function determines which node is entered), EE-04 (task completion is the next step), DB-03 (atomic write), API-04 (task retrieval endpoints)

      **Edge cases:**
      - Activation of a HUMAN_TASK where `assignee_ref` is a group with no current members: Task is created in PENDING status; assignment resolution is deferred to runtime.
      - Token entering an END node: instance transitions to COMPLETED; no task is created; timer cancellation (SCH-03) is triggered.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    - src/engine/instance.zig
    - migrations/005_instances.sql
    - src/tasks/store.zig
    - src/api/routes/tasks.zig
    - src/main.zig
    - src/bpm.zig
    - tests/unit/test_engine_apply.zig
    - tests/unit/test_tasks_store.zig
    - tests/unit/test_tasks_api.zig
    released_at: '2026-05-22'
    release_run: WF02-ee03-20260522
    type: requirement
  EE-04:
    id: EE-04
    title: Complete task
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > An authorised caller SHALL complete an active task by submitting an output variables map. The engine evaluates outgoing edge conditions, activates the next node(s), and records a `TASK_COMPLETED` event.

      **Acceptance Criteria:**
      - GIVEN an authorised caller submits `POST /tasks/:id/complete` with an `output_variables` JSON object, WHEN the task is PENDING, THEN the platform merges output variables per EE-09, evaluates outgoing edge conditions, activates the next node(s), appends a `TASK_COMPLETED` event, and returns HTTP 200.
      - GIVEN the task does not exist, THEN HTTP 404 is returned.
      - GIVEN the task has status ≠ PENDING (already COMPLETED or CANCELLED), THEN HTTP 409 is returned.
      - The task status change, variable merge, state transition, and `TASK_COMPLETED` event MUST all commit in a single transaction.
      - `output_variables` may be an empty object `{}`; this is valid (task completed with no output).

      **See:** EE-09 (variable merge logic including collision policy), EE-05 (if next node is EXCLUSIVE_GATEWAY, conditions evaluated after merge), EE-03 (next node activation follows completion), DB-03 (atomic transaction)

      **Edge cases:**
      - `output_variables = null`: rejected with HTTP 422; use `{}` for no output.
      - TASK_WORKER completing a task assigned to a different user: HTTP 403 (per IDN-03 role matrix).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/tasks/store.zig
    - src/engine/instance.zig
    - src/api/routes/tasks.zig
    test_spec: tests/specs/EE-04.md
    test_run: WF02-ee04-20260522-run-01.md
    tested_at: '2026-05-22'
    released_at: '2026-05-22T02:08:26Z'
    release_run: WF02-ee04-20260522
    type: requirement
  EE-05:
    id: EE-05
    title: Exclusive gateway
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > When the execution token reaches an EXCLUSIVE_GATEWAY, the platform SHALL evaluate outgoing edge CEL conditions in declared order and follow the first edge whose condition evaluates to `true`. One edge MAY be designated as the **default edge** via a boolean `is_default` flag in the edge definition. The default edge is evaluated last, regardless of declared order, and does not carry a condition expression. If no condition matches and no default edge is defined, the engine transitions the instance to ERROR status per EE-10.

      **Acceptance Criteria:**
      - GIVEN the execution token reaches an EXCLUSIVE_GATEWAY, WHEN CEL conditions are evaluated in declared edge order, THEN the token follows the first edge whose condition evaluates to `true` against the current instance variables.
      - GIVEN one edge has `is_default = true`, WHEN no non-default condition evaluates to `true`, THEN the token follows the default edge (evaluated last regardless of declared order).
      - GIVEN no condition evaluates to `true` and no default edge exists, WHEN all conditions are exhausted, THEN the instance transitions to ERROR status per EE-10, with a structured reason identifying the gateway node ID and the evaluated conditions.
      - A CEL runtime error (e.g. type mismatch) on a condition expression MUST be treated as `false` for that condition.
      - Exactly one outgoing edge is followed per evaluation; never zero, never more than one.

      **See:** PD-06 (conditions are validated at definition creation time), EE-02 (gateway evaluation is inside the pure transition function), EE-10 (error path when no condition matches), EE-09 (variables are merged before gateway evaluation)

      **Edge cases:**
      - Condition expression accessing an undefined variable: CEL returns a runtime error → treated as `false`.
      - All non-default conditions are `false` and a default edge exists: default edge is followed correctly.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    - vendor/cel/cel.zig
    test_spec: tests/specs/EE-05.md
    test_run: WF02-ee05-20260522-run-01.md
    tested_at: '2026-05-22'
    released_at: '2026-05-22T05:58:50Z'
    release_run: WF02-ee05-20260522
    type: requirement
  EE-06:
    id: EE-06
    title: Parallel gateway (split)
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > A PARALLEL_GATEWAY SHALL activate all outgoing edges simultaneously, creating concurrent execution tokens. Each token progresses independently.

      **Acceptance Criteria:**
      - GIVEN the execution token reaches a PARALLEL_GATEWAY with N outgoing edges, WHEN evaluated, THEN N independent execution tokens are created simultaneously, one per outgoing edge.
      - Each token progresses independently; task completions on one branch do not block other branches.
      - The split event MUST be recorded in the event log.
      - All N tokens are created in a single transaction (DB-03).

      **See:** EE-02 (split logic is inside the pure transition function), EE-07 (the join that corresponds to this split), EE-09 (variables from parallel branches merge at join per collision policy)

      **Edge cases:**
      - PARALLEL_GATEWAY with 2 outgoing edges where one branch immediately reaches the join before the other starts: join waits for the second token (see EE-07).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    test_spec: tests/specs/EE-06.md
    test_run: WF02-ee06-20260522-test-run.json
    tested_at: '2026-05-22'
    released_at: '2026-05-22T08:37:11Z'
    release_run: WF02-ee06-20260522
    type: requirement
  EE-07:
    id: EE-07
    title: Parallel gateway (join)
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > A PARALLEL_GATEWAY acting as join SHALL wait until all **active** incoming tokens have arrived before activating the single outgoing edge. An incoming branch that was cancelled (via EE-08) contributes no token and is excluded from the join count. If all branches of a parallel split are cancelled before any reaches the join, the join node is also cancelled and the instance transitions to CANCELLED status.

      **Acceptance Criteria:**
      - GIVEN N active tokens approaching a PARALLEL_GATEWAY join, WHEN all N active tokens have arrived, THEN the join fires and a single outgoing token is created.
      - "Active" excludes tokens on branches cancelled via EE-08.
      - GIVEN one branch is cancelled and all remaining active branches arrive at the join, WHEN the last active token arrives, THEN the join fires normally (cancelled branch excluded from count).
      - GIVEN all branches of a split are cancelled before any reaches the join, WHEN the last cancellation occurs, THEN the join node is also cancelled and the instance transitions to CANCELLED status.
      - The join fires exactly once regardless of the arrival order of concurrent tokens.

      **See:** EE-06 (the split that created the tokens), EE-08 (branch cancellation that affects the join count), DB-03 (join firing is a single atomic transaction)

      **Edge cases:**
      - Variable key collision from two parallel branches merging at join: EE-09 collision policy applies (overwrite + log).
      - All branches cancelled: the final `INSTANCE_CANCELLED` event covers both the branch cancellations and the join cancellation.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    test_spec: tests/specs/EE-07.md
    test_run: WF02-ee07-20260522-test-run.json
    tested_at: '2026-05-22'
    released_at: '2026-05-22T09:29:30Z'
    release_run: WF02-ee07-20260522
    last_updated: '2026-05-22T09:29:30Z'
    type: requirement
  EE-08:
    id: EE-08
    title: Instance cancellation
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > An authorised caller SHALL cancel a running instance. All open tasks SHALL be set to CANCELLED. All pending timers for the instance SHALL be cancelled atomically (see SCH-03). All in-flight SERVICE_TASK HTTP calls SHALL be abandoned (best-effort; no retry). An `INSTANCE_CANCELLED` event is appended. Cancelled instances are terminal.

      **Acceptance Criteria:**
      - GIVEN an authorised caller submits `POST /instances/:id/cancel`, WHEN the instance is ACTIVE, THEN all open tasks are set to CANCELLED, all pending timers are cancelled (SCH-03), in-flight SERVICE_TASK calls are abandoned (best-effort), an `INSTANCE_CANCELLED` event is appended, and instance status is set to CANCELLED. HTTP 200 is returned.
      - GIVEN the instance is already CANCELLED or COMPLETED, THEN HTTP 409 is returned.
      - The task cancellations, timer cancellations, status change, and `INSTANCE_CANCELLED` event MUST all commit in a single transaction.
      - Cancelled instances are terminal: no further operations (task completion, event append) may be performed on them.

      **See:** SCH-03 (timer cancellation called atomically here), EE-07 (parallel join behaviour when branches are cancelled), API-03 (HTTP endpoint), IDN-03 (PROCESS_OPERATOR or above may cancel)

      **Edge cases:**
      - Cancelling an instance with no open tasks or timers: valid; `INSTANCE_CANCELLED` event is still appended.
      - Concurrent cancellation while a task is being completed: the first operation to acquire the row-level lock wins; the other receives HTTP 409.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/instance.zig
    test_spec: tests/specs/EE-08.md
    test_run: tests/reports/WF02-ee08-20260522-test-report.json
    tested_at: '2026-05-22'
    released_at: '2026-05-22T10:31:41Z'
    release_run: WF02-ee08-20260522
    type: requirement
  EE-09:
    id: EE-09
    title: Variable scoping
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > Instance variables SHALL be a mutable JSON object. Task output variables SHALL be merged into the instance variable map upon task completion per the variable collision policy defined above.

      **Acceptance Criteria:**
      - GIVEN task completion with `output_variables` containing key K not present in the instance map, WHEN merged, THEN K is inserted into the instance map.
      - GIVEN task completion with `output_variables` containing key K already present, and the new value is schema-compatible (or no schema is defined), WHEN merged, THEN K is overwritten and a `VARIABLE_OVERWRITTEN` event is appended recording the key, old value, and new value.
      - GIVEN task completion with `output_variables` containing key K already present, and a registered variable schema rejects the new value, WHEN merge is attempted, THEN the merge is NOT applied, the instance transitions to ERROR status (EE-10), and an `EXECUTION_ERROR` event is appended.
      - Variable state after merge is immediately accessible to subsequent CEL condition evaluations (EE-05).

      **See:** EE-04 (merge triggered by task completion), EE-10 (schema violation error path), EE-05 (variables read by gateway conditions post-merge)

      **Edge cases:**
      - Empty `output_variables = {}`: merge is a no-op; no `VARIABLE_OVERWRITTEN` event is appended.
      - Duplicate key in one task completion's JSON object: standard JSON semantics (last value wins in the parsed object before merge).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    - src/engine/instance.zig
    - src/bpm.zig
    - src/tools/json_schema.zig
    - src/api/routes/tasks.zig
    - tests/unit/test_ee09_merge_variables.zig
    - tests/integration/ee09_merge_variables_test.zig
    - build.zig
    released_at: '2026-05-22T11:44:54Z'
    release_run: WF02-ee09-20260522
    type: requirement
  EE-10:
    id: EE-10
    title: Execution error handling
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > If the engine encounters an unresolvable condition (no matching gateway edge and no default edge, schema violation on variable merge), it SHALL set the instance to ERROR status, record an `EXECUTION_ERROR` event with a structured reason, and halt progression. The instance remains in ERROR status until an operator retries or discards it via the dead letter API (see OBS-05).

      **Acceptance Criteria:**
      - GIVEN an unresolvable condition (no matching gateway edge + no default edge, or schema violation on variable merge), WHEN detected, THEN `status` is set to ERROR and an `EXECUTION_ERROR` event is appended containing: error type, affected node or field, a human-readable reason, and the instance variable state at the time of the error.
      - GIVEN an instance in ERROR status, WHEN a task completion is attempted, THEN HTTP 409 is returned.
      - Instances in ERROR status remain in ERROR until an operator action (retry or discard via OBS-05).
      - The transition to ERROR and the `EXECUTION_ERROR` event append MUST be atomic (single transaction).
      - `EXECUTION_ERROR` events MUST carry sufficient context for an operator to diagnose the root cause without replaying the instance.

      **See:** EE-05 (gateway no-match triggers this), EE-09 (schema violation triggers this), OBS-05 (dead letter API for retry/discard)

      **Edge cases:**
      - Two concurrent operations that both trigger EE-10 on the same instance: the first to commit wins; the second sees `status = ERROR` and its operation is rejected with HTTP 409.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/instance.zig
    test_spec: tests/specs/EE-10.md
    test_run: tests/reports/EE-10-test-run.json
    tested_at: '2026-05-22'
    released_at: '2026-05-22T12:30:36Z'
    release_run: WF02-ee10-20260522
    last_updated: '2026-05-22T12:30:36Z'
    type: requirement
  EE-11:
    id: EE-11
    title: State reconstruction
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > At any time, the platform SHALL be able to reconstruct the full current state of any instance by replaying its event log from the beginning. Reconstructed state MUST be identical to persisted state. Reconstruction MUST complete within the time bound defined in NFR-04.

      **Acceptance Criteria:**
      - GIVEN an instance with N events in its event log, WHEN state reconstruction is invoked, THEN the platform replays all N events through the pure transition function (EE-02) and produces an `InstanceState` equal to the persisted projection, field-for-field: same active tokens, same variable map, same task set, same instance status.
      - Reconstruction MUST complete within NFR-04 (≤ 5 seconds for up to 10,000 events).
      - Reconstruction MUST be possible even if the read-model (projection table) is corrupt or absent.
      - After successful reconstruction, the platform MAY write the result back to the projection table to restore the read model.
      - Reconstruction that spans both `events` and `events_archive` tables (ES-07) MUST produce identical results to pre-archival reconstruction.

      **See:** EE-02 (reconstruction uses the pure transition function), ES-02 (ordered event retrieval is the input), NFR-04 (time bound), ES-06 (point-in-time reconstruction uses a filtered event list)

      **Edge cases:**
      - Instance with 0 events: reconstructed state = initial state (token on START, empty variables, ACTIVE status).
      - Event log contains an `EXECUTION_ERROR` event: reconstructed status = ERROR.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/transition.zig
    - src/engine/instance.zig
    - src/event_store/store.zig
    - src/bpm.zig
    - migrations/003_event_archive.sql
    - src/engine/reconstruction.zig
    - src/api/routes/instances.zig
    - src/main.zig
    - tests/unit/reconstruction_test.zig
    released_at: '2026-05-22T13:24:54Z'
    release_run: WF02-ee11-20260522
    last_updated: '2026-05-22T13:24:54Z'
    type: requirement
  EE-12:
    id: EE-12
    title: Concurrent instance safety
    stage: 3
    priority: MUST
    status: RELEASED
    body: |-
      > Multiple instances of the same definition SHALL execute concurrently without interference. Instance state MUST be fully isolated.

      **Acceptance Criteria:**
      - GIVEN 100 instances of the same definition running simultaneously, WHEN state transitions are applied to each, THEN no instance's state (variable map, task set, event log, token positions) is corrupted by another instance's operation.
      - Database row-level locking MUST be used to serialise concurrent operations on the same instance; cross-instance contention MUST be zero (no global lock held across instance boundaries).
      - Two concurrent task completions on the SAME instance: one succeeds; the other receives HTTP 409 (optimistic concurrency control or row-level lock).
      - Load test: 100 concurrent task completions across 100 distinct instances MUST all succeed without deadlock or data corruption.

      **See:** DB-03 (transactional writes prevent corruption within one instance), ES-01 (event log isolation is per `instance_id`)

      ---

      ## Stage 4 — REST API & Authentication

      **Goal:** The platform is accessible over HTTP with a documented, authenticated REST API. All core operations (definition management, instance lifecycle, task operations, history) are exposed.

      **Note on authentication bootstrapping:** Stage 4 requires Bearer token authentication (API-08), but token issuance (IDN-04) is not available until Stage 5. During Stage 4 development and testing, a **bootstrap token** SHALL be configurable via environment variable (`BPM_BOOTSTRAP_TOKEN`). This token grants PLATFORM_ADMIN privileges and MUST be disabled (startup fatal error) in production environments (detected via `BPM_ENV=production`).

      ### Pagination

      All list endpoints use cursor-based pagination. Cursors are opaque base64-encoded strings containing a sort key and a record ID. Cursors expire after 24 hours. If the underlying data changes between pages (e.g. a new instance is created), the page boundary reflects the cursor's sort key — new records inserted after cursor creation may not appear until a fresh query is issued. Clients MUST NOT attempt to parse or construct cursors.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/engine/instance.zig
    - src/api/routes/tasks.zig
    test_spec: tests/specs/EE-12.md
    test_run: EE-12-run-01.md
    tested_at: '2026-05-22'
    released_at: '2026-05-22'
    release_run: WF02-ee12-20260522
    type: requirement
  ENV-01:
    id: ENV-01
    title: Tenant carries a type field distinguishing production from test
    stage: 14
    priority: MUST
    status: RELEASED
    body: |-
      > The `tenant` table SHALL gain a `tenant_type` column (`production` or `test`)
      > and a `production_tenant_id` foreign key that links a test tenant to its
      > paired production tenant. A production tenant has no parent reference. A test
      > tenant always references exactly one production tenant. This relationship is
      > enforced by a database constraint and by the onboarding API.

      **Acceptance Criteria:**
      - GIVEN the migration is applied, THEN `public.tenant` has:
        - `tenant_type TEXT NOT NULL DEFAULT 'production' CHECK (tenant_type IN ('production', 'test'))`
        - `production_tenant_id UUID NULL REFERENCES public.tenant(id) ON DELETE RESTRICT`
        - Constraint: `CHECK ((tenant_type = 'production' AND production_tenant_id IS NULL) OR (tenant_type = 'test' AND production_tenant_id IS NOT NULL))`
      - GIVEN all existing tenant rows at migration time, THEN they are set to
        `tenant_type = 'production'`, `production_tenant_id = NULL`.
      - GIVEN `POST /api/v1/tenants/onboard` is called with `tenant_type = 'test'`
        and a valid `production_tenant_id`, THEN a test tenant is provisioned with
        its own schema, Keycloak realm, admin user, and hostname — identical to a
        production tenant onboarding, with the link recorded.
      - GIVEN `POST /api/v1/tenants/onboard` is called with `tenant_type = 'test'`
        and no `production_tenant_id` (or an invalid one), THEN HTTP 422 is returned:
        `"test tenant requires a valid production_tenant_id"`.
      - GIVEN `POST /api/v1/tenants/onboard` is called with `tenant_type = 'production'`
        and a non-null `production_tenant_id`, THEN HTTP 422 is returned:
        `"production tenant must not have a production_tenant_id"`.
      - GIVEN `GET /api/v1/admin/tenants`, THEN the response includes `tenant_type`
        and `production_tenant_id` for every entry.
      - A production tenant with one or more test tenants linked to it MUST NOT be
        deleted while those links exist (`ON DELETE RESTRICT`).

      **See:** ENV-02 (isolation level of test tenant), ENV-03 (definition promotion
      from test to production), ENV-04 (UI labelling), ENV-05 (test tenant
      lifecycle), TNT-01 (test tenant gets its own schema, same as production)

      **Edge cases:**
      - A test tenant can be linked to only one production tenant; a production tenant
        may have multiple test tenants linked to it (one-to-many).
      - `tenant_type` and `production_tenant_id` are immutable after creation:
        `PATCH /api/v1/tenants/:id` MUST NOT allow changing these fields; HTTP 422
        if attempted.
      - Slug convention for test tenants: recommended but not enforced by the platform
        (e.g. `swiftroute-test`); operators choose the slug freely.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-env-batch1-20260610
    test_spec: tests/specs/ENV-01.md
    test_run: tests/reports/report-20260611-WF02-env-batch1-20260610.yaml
    tested_at: '2026-06-11'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-env-batch1-20260610
    release_decision: docs/status/release-stage14-env-batch1-20260611.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  ENV-02:
    id: ENV-02
    title: Test tenant is fully isolated from its paired production tenant
    stage: 14
    priority: MUST
    status: RELEASED
    body: |-
      > A test tenant SHALL have exactly the same isolation level from its paired
      > production tenant as from any other unrelated tenant. The `production_tenant_id`
      > link is a metadata relationship only; it confers no shared data access, no
      > shared schema, no shared Keycloak realm, and no shared service credentials.
      > A process running in the test tenant CANNOT read or write data in the
      > production tenant by any platform mechanism.

      **Acceptance Criteria:**
      - GIVEN tenant T (production) and tenant T-test (test, linked to T), WHEN a
        process instance runs in T-test and issues any platform API call, THEN the
        call is scoped to T-test's schema and Keycloak realm; no call can resolve
        resources in T's schema.
      - GIVEN T-test's connection pool connection, THEN `search_path` is set to
        `tenant_<T-test-uuid>, public` (TNT-03); `tenant_<T-uuid>` is not in the
        path and cannot be accessed by unqualified table references.
      - GIVEN T-test's Keycloak realm, THEN it is a separate realm from T's realm;
        tokens issued by T-test's realm are rejected by T's API endpoints and vice
        versa.
      - GIVEN a service with `scope = 'tenant'` and `owner_tenant_id = T` (the
        production tenant), WHEN T-test attempts to activate a definition referencing
        that service, THEN activation is rejected (SVC-03); the test tenant does NOT
        automatically inherit production tenant's scoped services.
      - GIVEN T-test's schema is on the same PostgreSQL server as T, WHEN a query
        runs in T-test's connection, THEN it cannot access `tenant_<T-uuid>.*` via
        an unqualified name (different search_path) and cannot access it via a
        qualified name unless the DB user has been explicitly granted cross-schema
        access (which MUST NOT be done by the platform).
      - The `production_tenant_id` column is used only by ENV-03 (promotion) and
        ENV-04 (UI labelling); no other platform subsystem grants special access
        based on this relationship.

      **See:** ENV-01 (tenant_type and link model), ENV-03 (controlled promotion
      path), TNT-01 (schema isolation), TNT-03 (search_path per tenant), SVC-03
      (service availability check applies equally to test tenants)

      **Edge cases:**
      - Operator manually grants PostgreSQL cross-schema privileges: this is outside
        the platform's control; the platform provides no mechanism for it and does
        not test for it. Documentation MUST warn against this.
      - Test tenant's service_catalog entries: a test tenant may register its own
        tenant-scoped services (e.g. pointing to a mock or staging endpoint) without
        affecting the production tenant's catalog.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-env-batch1-20260610
    test_spec: tests/specs/ENV-02.md
    test_run: tests/reports/report-20260611-WF02-env-batch1-20260610.yaml
    tested_at: '2026-06-11'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-env-batch1-20260610
    release_decision: docs/status/release-stage14-env-batch1-20260611.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  ENV-03:
    id: ENV-03
    title: Process definition promotion from test tenant to production tenant
    stage: 14
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL provide an API endpoint that promotes an `ACTIVE` process
      > definition from a test tenant to its paired production tenant. The promoted
      > definition is created as a new `DRAFT` version on the production tenant.
      > Publishing it to `ACTIVE` on production is a separate, explicit admin action.
      > Promotion is append-only: it never overwrites or deletes existing production
      > definitions.

      **Acceptance Criteria:**
      - `POST /api/v1/tenants/:test_tenant_id/promote/:definition_name` (platform-admin
        or tenant-admin with PROCESS_DESIGNER role on both tenants):
        - Verifies `:test_tenant_id` has `tenant_type = 'test'`.
        - Verifies the caller has PROCESS_DESIGNER role on the test tenant AND on
          the linked production tenant.
        - Finds the `ACTIVE` definition with the given `definition_name` in the test
          tenant's schema.
        - Exports the definition graph (reuses `PD-09` export logic).
        - Imports it as a new `DRAFT` version on the production tenant (`PD-09`
          import logic), incrementing the version number if the name already exists.
        - Returns HTTP 201 with the new definition record on the production tenant
          (`definition_id`, `version`, `status = DRAFT`).
      - GIVEN the test tenant has no `ACTIVE` definition with the given name, THEN
        HTTP 404: `"no active definition named '<name>' in test tenant"`.
      - GIVEN the caller has PROCESS_DESIGNER on the test tenant but not on the
        production tenant, THEN HTTP 403.
      - The promoted definition on production is `DRAFT`; it is NOT automatically
        activated. A separate `POST /definitions/:id/publish` call by an authorised
        user is required.
      - Promotion is recorded as an audit entry on both the test tenant and the
        production tenant with `action = 'DEFINITION_PROMOTED'`, cross-referencing
        the source `definition_id` and the target `definition_id`.
      - Promotion does not transfer service catalog entries, form schemas, or event
        type registrations; those must be independently registered on the production
        tenant before the promoted definition can be activated.

      **See:** ENV-01 (test/production link), ENV-02 (isolation — promotion is the
      only controlled bridge), PD-09 (export/import mechanism reused), PD-08
      (definition activation remains a separate step), SVC-03 (activation on
      production validates service availability independently)

      **Edge cases:**
      - Definition references a service with `scope = 'tenant'` belonging to the
        test tenant: the import succeeds (definition is `DRAFT`); activation on
        production will fail (SVC-03) until a matching service is registered for the
        production tenant. The promotion response includes a WARNING listing
        unresolved service references.
      - Production tenant already has an `ACTIVE` definition with the same name:
        promotion imports a new `DRAFT` version with version = current_max + 1; the
        existing `ACTIVE` is not touched.
      - Promoting to a production tenant that is in `status = 'INACTIVE'`: HTTP 409,
        `"production tenant is not active"`.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-env-batch1-20260610
    test_spec: tests/specs/ENV-03.md
    test_run: tests/reports/report-20260611-WF02-env-batch1-20260610.yaml
    tested_at: '2026-06-11'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-env-batch1-20260610
    release_decision: docs/status/release-stage14-env-batch1-20260611.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  ENV-04:
    id: ENV-04
    title: UI clearly labels test tenants and blocks accidental production actions
    stage: 14
    priority: MUST
    status: PENDING
    body: |-
      > The platform UI SHALL display a persistent, visually distinct indicator on
      > every page when the user is operating within a test tenant. Actions that
      > would affect the paired production tenant SHALL require an explicit
      > confirmation step. Test-tenant pages SHALL NOT render any production data.

      **Acceptance Criteria:**
      - GIVEN the authenticated user's tenant has `tenant_type = 'test'`, THEN every
        page in the UI renders a persistent banner or badge (e.g. yellow bar at the
        top of the screen) containing the text `"TEST ENVIRONMENT"` and the name of
        the paired production tenant.
      - GIVEN the user is on a test tenant and clicks "Promote to Production" (ENV-03
        trigger), THEN a confirmation modal is shown: `"You are about to promote
        '<definition_name>' to production tenant '<production_display_name>'. This
        will create a DRAFT version that requires separate activation. Confirm?"`.
        The action proceeds only after explicit confirmation.
      - GIVEN the user is on a production tenant (`tenant_type = 'production'`), THEN
        no test-environment banner is shown and no `TEST ENVIRONMENT` text appears
        anywhere on the page.
      - GIVEN the admin tenant switcher (if present), THEN test tenants are shown
        with a `[TEST]` suffix in the tenant name and are visually distinguished from
        production tenants (e.g. different icon or colour).
      - GIVEN the user is on a test tenant and navigates to the Instance list, THEN
        only instances belonging to the test tenant are shown; no production instances
        are visible.
      - The "Promote to Production" button is only shown on the Process Definition
        detail page when the current tenant is a test tenant and the definition status
        is `ACTIVE`.

      **See:** ENV-01 (tenant_type field), ENV-03 (promotion API called by this UI),
      SH-01 (shell navigation), SH-03 (role-aware navigation)

      **Edge cases:**
      - User has access to both the test tenant and the production tenant (separate
        user accounts, separate logins): the banner reflects the current session's
        tenant only.
      - Test tenant display name does not contain "test" or "staging": the banner
        still appears because it is driven by `tenant_type`, not the name string.
      - Mobile or narrow viewport: the `TEST ENVIRONMENT` banner remains visible
        (fixed position); it is not collapsible.
    body_source: individual-file
    alt_sources: []
    note: Found untracked during a docs/requirements/ audit (2026-07-21). Sibling requirements ENV-01/02/03/05
      are RELEASED but ENV-04 was never in this tracker. Its pipeline run (handoffs/WF02-env-batch2-20260610)
      has all steps still PENDING with null results -- dispatched but never executed. No banner/indicator
      component found in web/src. Genuinely not built.
    type: requirement
  ENV-05:
    id: ENV-05
    title: Test tenant lifecycle management
    stage: 14
    priority: SHOULD
    status: RELEASED
    body: |-
      > A platform-admin SHALL be able to reset a test tenant (wipe all process
      > instances, definitions, and user data while preserving the tenant record,
      > schema, and Keycloak realm) and to decommission a test tenant (full deletion
      > including schema and realm). Neither action SHALL affect the paired production
      > tenant.

      **Acceptance Criteria:**
      - `POST /api/v1/admin/tenants/:test_tenant_id/reset` (platform-admin only):
        - Verifies the tenant has `tenant_type = 'test'`.
        - Truncates all business data tables in `tenant_<uuid>` schema:
          `events`, `events_archive`, `instance_projections`, `tasks`, `tokens`,
          `timers`, `audit_entries`, `audit_log`, `dead_letter_items`,
          `webhook_subscriptions` (subscriptions recreated from scratch),
          `process_definitions`.
        - Does NOT truncate: `users`, `groups`, `roles`, `api_tokens`,
          `event_type_registry`, `repository_form_schemas` (identity and schema
          definitions are preserved).
        - Returns HTTP 200: `{ "reset_at": "<timestamp>", "tables_truncated": [...] }`.
        - The paired production tenant is not touched.
      - `DELETE /api/v1/admin/tenants/:test_tenant_id` (platform-admin only):
        - Verifies the tenant has `tenant_type = 'test'`.
        - Drops the `tenant_<uuid>` schema (CASCADE).
        - Deletes the Keycloak realm for the test tenant.
        - Removes rows from `public.tenant`, `public.tenant_schemas`,
          `public.tenant_hostnames`, `public.tenant_realm_binding`.
        - Returns HTTP 204.
        - The paired production tenant is not touched; `ON DELETE RESTRICT` on
          `production_tenant_id` means this DELETE on a test tenant succeeds because
          the test tenant is the child, not the parent.
      - GIVEN `POST /api/v1/admin/tenants/:id/reset` is called on a tenant with
        `tenant_type = 'production'`, THEN HTTP 422:
        `"reset is only allowed for test tenants"`.
      - GIVEN `DELETE /api/v1/admin/tenants/:id` is called on a tenant with
        `tenant_type = 'production'`, THEN HTTP 422:
        `"production tenants cannot be deleted via this endpoint; use decommission
        procedure"`.
      - Reset is atomic: if any truncation fails, the transaction is rolled back and
        the tenant is left in a consistent (though unmodified) state.

      **See:** ENV-01 (tenant_type enforcement), ENV-02 (production tenant not
      affected), TNT-01 (schema isolation makes reset safe — only target schema is
      touched), TNT-06 (full server migration, a distinct operation)

      **Edge cases:**
      - Reset while process instances are actively running (in-flight tasks): reset
        returns HTTP 409: `"tenant has active instances; stop or cancel them before
        resetting"`.
      - Test tenant schema partially corrupted (migration failure): DELETE still
        attempts `DROP SCHEMA CASCADE`; if it fails, error is returned with details
        and the `public.tenant` row is NOT removed.
      - Multiple test tenants linked to the same production tenant: each can be reset
        or deleted independently; deleting one does not affect the others.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-env-batch1-20260610
    test_spec: tests/specs/ENV-05.md
    test_run: tests/reports/report-20260611-WF02-env-batch1-20260610.yaml
    tested_at: '2026-06-11'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-env-batch1-20260610
    release_decision: docs/status/release-stage14-env-batch1-20260611.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  ES-01:
    id: ES-01
    title: Append event
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL append a typed, immutable event record to the event log for a given process instance. Each event carries: `event_id` (UUID v4), `instance_id`, `event_type`, `payload` (JSON), `actor_id`, and `created_at` (UTC timestamp with microsecond precision).

      **Acceptance Criteria:**
      - GIVEN a valid append request with all required fields, WHEN processed, THEN the platform returns HTTP 201 with the persisted event record including the platform-assigned `event_id` (UUID v4) and `created_at` (UTC, microsecond precision).
      - `event_id` MUST be a version-4 UUID. No two events in the event log MAY share the same `event_id`.
      - `instance_id` MUST reference an existing process instance; if the instance does not exist, the platform returns HTTP 404.
      - `event_type` MUST be a non-empty string. The registry validation rule (ES-05) is applied before the record is persisted.
      - `payload` MUST be a valid JSON object (not null, not a JSON array, not a scalar). An empty object `{}` is permitted. If `payload` exceeds 4 KB in serialised form, it MUST be stored in a side table with the event log row containing only a reference (per NFR-05).
      - `actor_id` MUST be a non-empty string. A null or absent `actor_id` MUST be rejected with HTTP 422.
      - `created_at` MUST be stored in UTC with microsecond precision. Two events appended within the same microsecond on the same instance receive distinct, monotonically increasing sequence numbers (tie-broken by sequence, not by timestamp).
      - Once persisted, no field of an event record SHALL be modifiable by any API or internal operation.
      - Appending an event to a CANCELLED or COMPLETED instance MUST be rejected with HTTP 409.

      **See:** ES-03 (idempotency key deduplicates concurrent appends), ES-05 (type registry validates `event_type` and `payload` schema before persist), DB-03 (append and state-table update are one atomic transaction), NFR-05 (8 KB page / 4 KB payload side-table rule)

      **Edge cases:**
      - `payload = null`: rejected with HTTP 422.
      - `payload = []` (JSON array): rejected with HTTP 422.
      - `payload = {}` (empty object): accepted; no schema violation.
      - `actor_id = ""` (empty string): rejected with HTTP 422.
      - Payload size exactly at 4 KB: stored inline. One byte over: stored in side table.
      - Concurrent appends to the same instance: serialised by row-level lock; both succeed with distinct sequence numbers.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-02:
    id: ES-02
    title: Ordered read
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > Events for an instance SHALL be retrievable in strict append order (sequence number). Concurrent reads MUST NOT return events out of sequence.

      **Acceptance Criteria:**
      - GIVEN an instance with N persisted events, WHEN events are retrieved, THEN they are returned sorted by ascending sequence number with no gaps.
      - A read issued during a concurrent append sees only fully committed events; no partially-committed event is visible.
      - Concurrent reads by multiple callers for the same instance each receive the same ordered sequence for events that have already committed.
      - An attempt to read events for a non-existent instance MUST return HTTP 404.
      - Sequence numbers are monotonically increasing per instance; rolled-back transactions leave no gap in the committed sequence.

      **See:** ES-06 (point-in-time variant of this query), ES-04 (global stream applies the same ordering guarantee cross-instance), EE-11 (state reconstruction depends on this ordering guarantee)

      **Edge cases:**
      - Instance with zero events: returns an empty ordered list, HTTP 200.
      - Read issued exactly as an append commits: the reader sees either N or N+1 events (snapshot isolation); never a partial state.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-03:
    id: ES-03
    title: Event idempotency
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > Each event append SHALL include a caller-supplied idempotency key. The key is **global** in scope — unique across all instances and event types. Duplicate submissions with the same key MUST be silently deduplicated and return the original event record.

      **Acceptance Criteria:**
      - GIVEN an append request with idempotency key K that has already committed, WHEN the same K is submitted again (any payload, any instance), THEN the platform returns HTTP 200 with the original event record unchanged; no new event is inserted.
      - GIVEN an append request with a fresh key K, WHEN processed, THEN the event is persisted and HTTP 201 is returned.
      - If two concurrent requests arrive with the same key before either commits, exactly one MUST commit as a new event; the other MUST be deduplicated against it. The platform MUST NOT return two distinct event records for the same key.
      - Deduplication MUST be durable: a duplicate submitted after a platform restart returns the original record.
      - A missing or empty idempotency key MUST be rejected with HTTP 422.
      - Idempotency keys MUST be accepted up to 255 characters. Keys longer than 255 characters MUST be rejected with HTTP 422.

      **See:** ES-01 (event record structure returned on deduplication), DB-03 (uniqueness enforced by database unique constraint within the transaction)

      **Edge cases:**
      - Same key resubmitted with a different `payload`: deduplication wins; original payload is returned, new payload is silently discarded.
      - Same key resubmitted against a different `instance_id`: still deduplicated (key is global).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-04:
    id: ES-04
    title: Global event stream
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL expose a global ordered stream of all events across all instances, usable for projections and read-model rebuilding.

      **Acceptance Criteria:**
      - GIVEN events appended across multiple instances, WHEN the global stream is queried, THEN it returns all events ordered by a global sequence number that is monotonically increasing across all instances.
      - The global stream MUST support cursor-based pagination: a caller can resume from any position using an opaque cursor without re-reading earlier events.
      - A caller replaying the global stream from position 0 MUST arrive at a state consistent with the union of all per-instance ordered reads (ES-02).
      - The global stream includes events from all instances regardless of instance status.
      - Reading the global stream MUST NOT block ongoing event appends or per-instance reads.

      **See:** ES-02 (per-instance ordering is a subset of global ordering), ES-01 (event record structure in the stream), EE-11 (state reconstruction may use global stream as input)

      **Edge cases:**
      - Empty platform (no events): returns empty stream, HTTP 200.
      - Cursor older than 24 hours (per API-06 spec): platform MUST return HTTP 410 with a message to re-query from the beginning or a known checkpoint.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-05:
    id: ES-05
    title: Event type registry
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > All event types SHALL be registered with a name, schema version, and JSON Schema. Appending an event with an unregistered or schema-invalid payload MUST be rejected with HTTP 422 and a structured error listing all validation failures, using RFC 9457 Problem Details format.

      **Acceptance Criteria:**
      - GIVEN an event type T with a valid JSON Schema registered, WHEN a caller appends an event with `event_type = T` and a payload valid against the schema, THEN the append proceeds normally.
      - GIVEN event type T is not registered, WHEN a caller appends an event with `event_type = T`, THEN the platform returns HTTP 422 with an RFC 9457 body identifying the unknown event type.
      - GIVEN event type T is registered, WHEN a caller appends a payload that fails the registered schema, THEN the platform returns HTTP 422 with an RFC 9457 body listing every validation failure (field path, constraint violated, actual value).
      - An event type name MUST be a non-empty string of ≤ 128 characters. Registering a duplicate name+version combination MUST be rejected with HTTP 409.
      - The JSON Schema stored per event type MUST itself be valid JSON Schema (draft-07 or later). Submitting an invalid schema document MUST be rejected with HTTP 422.
      - Updating an existing event type's schema MUST use a new schema version; overwriting an existing version is rejected with HTTP 409.

      **See:** ES-01 (`event_type` field and payload validated here before persist), API-07 (general input validation layer; ES-05 adds domain-level validation on top)

      **Edge cases:**
      - Payload is `{}` and schema has no required fields: valid.
      - Payload is `{}` and schema requires fields: rejected with HTTP 422 listing all missing required fields.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/registry.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-06:
    id: ES-06
    title: Point-in-time query
    stage: 1
    priority: MUST
    status: RELEASED
    body: |-
      > Callers SHALL be able to request the event list for an instance up to a specific sequence number or timestamp, enabling state reconstruction at any point in history.

      **Acceptance Criteria:**
      - GIVEN an instance with events at sequence numbers 1..N, WHEN queried with `up_to_sequence = K` (K ≤ N), THEN the platform returns exactly events 1..K in ascending sequence order.
      - GIVEN a query with `up_to_timestamp = T`, THEN the platform returns all events whose `created_at ≤ T` in ascending sequence order.
      - If both `up_to_sequence` and `up_to_timestamp` are supplied, `up_to_sequence` takes precedence.
      - If `up_to_sequence` exceeds the highest committed sequence number, the platform returns all events (no error).
      - If `up_to_sequence = 0`, the platform returns an empty list, HTTP 200.
      - An attempt to query a non-existent instance MUST return HTTP 404.

      **See:** ES-02 (base ordered-read guarantee this query specialises), EE-11 (state reconstruction uses point-in-time query as its core operation)

      **Edge cases:**
      - `up_to_timestamp` in the future: returns all currently committed events.
      - `up_to_timestamp` before the first event's `created_at`: returns empty list, HTTP 200.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-07:
    id: ES-07
    title: Retention policy
    stage: 1
    priority: SHOULD
    status: RELEASED
    body: |-
      > The platform SHALL support configurable event retention policies per event type: keep forever, keep N days, or keep N events. Expired events SHALL be moved to a dedicated `events_archive` table (same schema), not deleted. Archived events SHALL be retrievable via a separate API endpoint (GET /archive/events). Archival MUST NOT affect active instance state reconstruction.

      **Acceptance Criteria:**
      - GIVEN a "keep N days" policy on event type T, WHEN the archival process runs, THEN all events of type T with `created_at < NOW() - N days` are moved atomically from `events` to `events_archive` in a single transaction.
      - GIVEN a "keep N events" policy on event type T, WHEN the archival process runs, THEN the oldest events of type T beyond the N most-recent per instance are moved to `events_archive`.
      - GIVEN a "keep forever" policy, archival MUST NOT touch events of that type.
      - Archived events are retrievable via `GET /archive/events` with the same field structure as live events (ES-01 schema).
      - GIVEN an instance whose early events have been archived, WHEN state reconstruction (EE-11) is requested, THEN reconstruction reads from both `events` and `events_archive` and produces a result identical to pre-archival reconstruction.
      - The archival operation MUST be idempotent: running it twice produces the same result.

      **See:** ES-01 (archived events retain the same record structure), EE-11 (reconstruction must span both tables), DB-03 (archival move is one transaction)

      **Edge cases:**
      - An event is being read during archival: archival transaction must not block reads beyond the DB lock timeout.
      - Retention policy changed mid-operation: the new policy applies on the next archival run.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  ES-08:
    id: ES-08
    title: Event metadata
    stage: 1
    priority: SHOULD
    status: RELEASED
    body: |-
      > Each event SHALL carry an optional free-form metadata map (string → string) for tracing, correlation IDs, and source tagging without polluting the business payload.

      **Acceptance Criteria:**
      - GIVEN an append request that includes a `metadata` field (JSON object with string keys and string values), WHEN the event is persisted, THEN the metadata is stored verbatim and returned in all read operations for that event.
      - GIVEN an append request with no `metadata` field, WHEN the event is persisted, THEN `metadata` defaults to `{}` and is returned as such.
      - A `metadata` value that is not a string (e.g. number, object, array) MUST be rejected with HTTP 422 identifying the offending key.
      - `metadata` keys MUST be non-empty strings of ≤ 128 characters. Values MUST be strings of ≤ 1,024 characters. Violations MUST be rejected with HTTP 422.
      - The total number of metadata entries per event MUST NOT exceed 50; exceeding this limit is rejected with HTTP 422.
      - `metadata` is NOT validated against the event type's JSON Schema (ES-05); it is orthogonal to the business payload.

      **See:** ES-01 (metadata is an additional field on the event record), API-09 (trace_id SHOULD be propagated into metadata automatically by the platform)

      **Edge cases:**
      - `metadata = null`: treated as absent; defaults to `{}`.
      - `metadata = {}`: valid.
      - Duplicate metadata keys in the submitted object: last-write-wins (standard JSON semantics).
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
    - src/event_store/store.zig
    test_spec: tests/specs/ES-01-08.md
    test_run: WF02-stage1-integration-20260520-run-01.md
    tested_at: '2026-05-21'
    released_at: '2026-05-21'
    release_run: WF02-stage1-release-20260521
    type: requirement
  EXP-101:
    id: EXP-101
    title: State a scale anchor in the architecture
    stage: Expansion
    status: RELEASED
    body: |-
      **Why:** No target scale is stated; schema-per-tenant simplifications are unjustified without a ceiling (gap §5; ASCOA-GO §1.1). Document-only.
      **Tasks:** Add a "Scale anchor" section; state target + ceiling tenant counts; annotate every single-primary / single-sweep simplification to cite it; list large-N escape hatches (`db_host` sharding, read replicas) as deferred.
      **Acceptance:** Architecture doc has a scale-anchor section referenced by each single-node claim.
      **Owner:** REQ-ANALYST + human.
    body_source: expansion-backlog
    alt_sources: []
    released_at: '2026-06-12'
    type: requirement
    backlog_tier: P1
  EXP-102:
    id: EXP-102
    title: Wire src/expr into transition.zig as production gateway condition evaluator; retire vendor/cel
    stage: Expansion
    status: RELEASED
    body: |-
      **Why:** Two expression engines coexist (`vendor/cel` live; `src/expr` built but unwired, Open Q1). Tenants (forms, entity constraints, gateways) must depend on one engine.
      **Tasks:** Differential corpus harness (CEL vs `expr` over stored gateway conditions); wire `src/expr` into `src/engine/transition.zig`; cut over; retire `cel` for new work. Keep transition fn pure.
      **Acceptance:** Gateway conditions evaluate via `src/expr`; differential suite passes; no production module imports `cel`.
      **Touchpoints:** `src/engine/transition.zig`, `src/expr/*`, `vendor/cel`.
    body_source: expansion-backlog
    alt_sources: []
    implemented_in:
    - src/engine/transition.zig
    - src/expr/
    released_at: '2026-06-12'
    type: requirement
    backlog_tier: P1
  EXP-103:
    id: EXP-103
    title: Persist instance_waits descriptors atomically on timer/task arm and resolve
    stage: Expansion
    status: RELEASED
    body: |-
      **Why:** Make a tenant dump self-sufficient so restore can re-arm in-flight waits (gap §5; ASCOA-GO C2).
      **Tasks:** `instance_waits` table (kind ∈ `timer|catch_event|human_task`, `fire_at`, correlation/task ref); write it in the **same transaction** that arms the wait.
      **Acceptance:** Arming any wait creates exactly one descriptor row in the same txn; crash between arm and commit leaves neither.
      **Touchpoints:** `migrations/*`, `src/scheduler/*`, `src/tasks/*`, `src/engine/instance.zig`.

      ---

      ## EPIC-2 — Dynamic entity subsystem (Wave 1) — *the headline build*

      > Implements gap analysis §3. Entities are **event-sourced**; the read/query surface is **one
      > real relational table per entity with real typed columns and B-tree indexes**, regenerated from
      > the log. JSONB only for free-form, never-queried fields. "Field promotion" = **re-projection**.
    body_source: expansion-backlog
    alt_sources: []
    implemented_in:
    - src/engine/instance.zig
    - migrations/093_exp103_instance_waits.sql
    test_spec: tests/specs/EXP-103.md
    released_at: '2026-06-12'
    type: requirement
    backlog_tier: P1
  EXP-201:
    id: EXP-201
    title: Entity definition format + Repository artifact
    stage: Expansion
    status: RELEASED
    body: |-
      **Why:** BPM has no first-class dynamic-entity abstraction; a standard set of forms/projections is insufficient for ERP/CRM/HRM reference data (gap §3.2).
      **Tasks:** JSON entity-definition (fields, types, indexes, FKs, constraints; `queried: true` ⇒ projection column, free-form ⇒ JSONB); register as a new Repository `kind = entity` artifact; version the **logical shape**; pin from in-flight instances like `definition_snapshot`.
      **Acceptance:** An entity definition canonicalises + hashes deterministically; logical-shape versions retained while referenced; validator rejects a field marked both queried and JSONB-only.
      **Depends on:** EXP-102 · **Touchpoints:** `src/repository/*`, `src/definition/*`.
    body_source: expansion-backlog
    alt_sources: []
    implemented_in:
    - src/entities/definition.zig
    - src/entities/validator.zig
    - src/entities/mod.zig
    - src/repository/canonicaliser.zig
    - migrations/094_entity_subsystem.sql
    test_spec: tests/specs/EXP-201.md
    test_run: tests/reports/report-2026-06-14-WF02-exp201-202-20260612-step04-rework.yaml
    tested_at: '2026-06-14'
    released_at: '2026-06-14'
    release_run: WF02-exp201-202-20260612
    release_decision: docs/status/release-exp201-202-20260614.yaml
    last_updated: '2026-06-14T09:16:17Z'
    type: requirement
    backlog_tier: P0
  EXP-202:
    id: EXP-202
    title: Entity command API -> event family
    stage: Expansion
    status: RELEASED
    body: |-
      **Why:** System of record stays the event log (guardrail; principle #1).
      **Tasks:** `ENTITY_RECORD_CREATED|UPDATED|DELETED` event family (payload = field values, keyed by record id); REST commands (`POST/PATCH/DELETE /entities/:type/:id`) that append events inside one transaction; reuse existing idempotency + audit chaining.
      **Acceptance:** A create/update/delete appends exactly one event; replaying the stream reproduces record state; idempotent re-submit is a no-op.
      **Depends on:** EXP-201 · **Touchpoints:** new `src/entities/*`, `src/event_store/*`, `src/api/routes/*`.
    body_source: expansion-backlog
    alt_sources: []
    implemented_in:
    - src/entities/events.zig
    - src/entities/commands.zig
    - src/entities/projector.zig
    - src/api/routes/entities.zig
    - migrations/094_entity_subsystem.sql
    test_spec: tests/specs/EXP-202.md
    test_run: tests/reports/report-2026-06-14-WF02-exp201-202-20260612-step04-rework.yaml
    tested_at: '2026-06-14'
    released_at: '2026-06-14'
    release_run: WF02-exp201-202-20260612
    release_decision: docs/status/release-exp201-202-20260614.yaml
    last_updated: '2026-06-14T09:16:17Z'
    type: requirement
    backlog_tier: P0
  EXP-203:
    id: EXP-203
    title: Typed projection tables (generated DDL) + projector
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Real columns + B-tree indexes for everything queryable; **no JSONB indexing** (gap §3.3, guardrail).
      **Tasks:** Generate one table per entity type from the definition (typed columns, declared indexes, FKs; one optional `freeform JSONB` column for never-queried fields); a projector folds the entity event stream into it; rebuildable on demand.
      **Acceptance:** Querying a defined entity hits real columns/indexes (`EXPLAIN` shows index scans, no JSONB GIN); dropping + rebuilding the projection from events yields identical rows.
      **Depends on:** EXP-202 · **Touchpoints:** `src/entities/*`, `src/repository/projections/*`, `migrations/*`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P0
  EXP-204:
    id: EXP-204
    title: Re-projection in place of expand/contract
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Schema evolution without ASCOA-GO's dual-write / lost-write hazard (gap §3.3).
      **Tasks:** On an entity-definition shape change, build the new projection table from the log and atomically swap the read pointer (reuse Repository atomic activation); old projection retained until no pinned instance needs it.
      **Acceptance:** Adding/retyping a queryable field rebuilds the projection from events with zero dual-write window; rollback = reactivate prior projection; no JSONB migration step exists.
      **Depends on:** EXP-203 · **Touchpoints:** `src/entities/*`, `src/definition/promotion.zig`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-205:
    id: EXP-205
    title: Entity query API (list/filter/sort/keyset)
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** ERP/CRM/HRM are query-heavy; the SPA list views need it (gap §3).
      **Tasks:** Definition-driven list/filter/sort over **projection columns only**, keyset pagination + max page size; enforce read permissions incl. server-side field stripping.
      **Acceptance:** Filter/sort on a projection column paginates by keyset; a filter on a non-projected (free-form) field is rejected; unauthorised fields stripped server-side.
      **Depends on:** EXP-203 · **Touchpoints:** `src/entities/*`, `src/api/pagination.zig`, `src/api/authorization.zig`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-206:
    id: EXP-206
    title: Command-time optimistic concurrency (narrow)
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Append-only removes most conflicts; a *command validating against current state* still needs a guard (gap §3.4) — extend the existing task-claim CAS pattern, not a platform-wide `row_version`.
      **Tasks:** Optional `expected_version`/sequence token on entity update + task-completion commands; reject stale with 409; check inside the appending transaction so a stale task completion leaves the token un-advanced and the task claimed.
      **Acceptance:** Concurrent stale update → one 409; stale task completion does not advance the token.
      **Depends on:** EXP-202 · **Touchpoints:** `src/entities/*`, `src/tasks/store.zig`.

      ---

      ## EPIC-3 — Async outbound effects (Wave 1)

      > Implements gap analysis §4.3(1). Moves external I/O out of the step so the engine stays pure.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-301:
    id: EXP-301
    title: Effects subsystem + effects-worker + result re-entry
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** BPM currently calls external systems synchronously inside the step (external latency = lock-hold time) (gap §4.2).
      **Tasks:** `effects` module (HTTP connector: per-call timeout, retry/backoff, dead-letter; email channel; secrets by reference); effects-worker consuming delivery rows; result re-enters as `effect.completed`/`effect.failed` carrying the originating `correlation_id`; idempotency key derived from the effect event id.
      **Acceptance:** A process expresses `emit effect → wait on catch event → branch on outcome`; retries are at-least-once with a stable idempotency header; no engine-path module performs network I/O.
      **Depends on:** EXP-501 (secrets) · **Touchpoints:** new `src/effects/*`, `src/webhook/*` (reuse outbox), `src/engine/*`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-302:
    id: EXP-302
    title: Migrate service tasks off inline I/O
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Remove synchronous external calls from the step (gap §4.3, open Q3).
      **Tasks:** Convert `src/engine/service_task.zig` to emit effect events; **owner decides** whether any low-risk synchronous service tasks remain.
      **Acceptance:** Service-task semantics expressed as effect emit + re-entry; engine path I/O-free.
      **Depends on:** EXP-301 · **Touchpoints:** `src/engine/service_task.zig`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-303:
    id: EXP-303
    title: Stub effects executor for sandboxes
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Make `notifications_sent`-style assertions checkable/deterministic (ASCOA-GO FR-OUT-5); feeds EXP-7.
      **Acceptance:** In a sandbox, an emitted effect increments a recorded count and performs nothing.
      **Depends on:** EXP-301 · **Touchpoints:** `src/effects/*`, `src/simulation/*`.

      ---

      ## EPIC-4 — Compensation / error-boundary constructs (Wave 2)

      > Implements gap analysis §4.3(2) — "saga processes as transactions" as engine constructs rather
      > than hand-modeled paired service tasks. ASCOA-GO defers this to v2; BPM can lead.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-401:
    id: EXP-401
    title: Compensation handler + error-boundary node types
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Today compensation is copy-pasted per process (e.g. `quarantine`/`release-quarantine`); make it declarative and auditable.
      **Tasks:** Add a compensation-handler attachable to a scope/activity and an error-boundary event that triggers it on error/cancel; engine records compensation as first-class events; graph validator checks handler reachability and that compensated activities are reversible.
      **Acceptance:** A definition declares a compensation handler; on a triggered error the engine fires it and the audit log shows the compensation chain; cancelling a scope runs registered compensations in reverse order.
      **Depends on:** EXP-301 (compensation often performs effects) · **Touchpoints:** `src/engine/*`, `src/definition/graph.zig`, validator.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-402:
    id: EXP-402
    title: Restore reconciliation using wait descriptors
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Even with event replay, restoring a tenant can leave instances waiting on already-fired timers/keys (gap §5; ASCOA-GO C2).
      **Tasks:** Restore flow: replay/restore events + rebuild projections → re-arm waits from `instance_waits` (EXP-103) → mark un-re-armable instances `restored_orphan` (surface via DLQ/observability).
      **Acceptance:** Restore a tenant with an instance waiting on a timer + a human task, after those fired live; reconcile; assert nothing hung and no stale key suppresses recovery.
      **Depends on:** EXP-103 · **Touchpoints:** `src/admin/*`, `src/db/*`.

      ---

      ## EPIC-5 — Secrets module (Wave 1)
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P2
  EXP-501:
    id: EXP-501
    title: Per-tenant envelope-encrypted secrets, resolved by reference
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Only `hmac_secret` "encrypted at rest" exists; effects/connectors need managed tenant credentials (gap §5; ASCOA-GO §12.7).
      **Tasks:** `secrets` module: per-tenant secrets under envelope encryption (data keys wrapped by host KMS/env master key); resolution **by reference** at execution; values never in definitions/logs/traces; module owns webhook HMAC keys (key id now; grace-window rotation later).
      **Acceptance:** A script/effect receives a secret only by reference; no value appears in any log/trace/definition; key material is envelope-encrypted at rest.
      **Depends on:** EXP-101 · **Touchpoints:** new `src/secrets/*`, `src/webhook/*`.

      ---

      ## EPIC-6 — Tier → quota model (Wave 2)
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-601:
    id: EXP-601
    title: Central tier→quota enforcement in kernel middleware
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** No tier→quota mapping today; must be central as entities (storage), files, and sandboxes multiply (gap §5; ASCOA-GO FR-TIER).
      **Tasks:** Tier classification → script CPU/memory limits, entity-storage / file / concurrent-sandbox quotas, agent retry budget; enforced in kernel middleware, configured in one place.
      **Acceptance:** Exceeding a tenant quota is rejected centrally; limits live in one config surface.
      **Depends on:** EXP-202 · **Touchpoints:** `src/api/middleware/*`, `src/config/*`.

      ---

      ## EPIC-7 — Agent loop: ephemeral sandboxes + threat model (Wave 3)

      > Gated on owner decision (gap §7 Q6): is agent-authored *tenant* logic a near-term surface? If
      > later phase, this epic is P3.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P2
  EXP-701:
    id: EXP-701
    title: Sandbox threat-model document
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Two untrusted runtimes (Lua + Wasm) + agent pipeline; the written model is owed before untrusted code runs in production (gap §5; ASCOA-GO FR-NFR-4). Document-only; can start anytime.
      **Acceptance:** Reviewed/signed-off doc covering Lua + Wasm host-API surface, capability gating, fuel/memory/timeout limiters, sandbox-control auth; referenced as a go-live gate.
      **Owner:** ARCHITECT + human.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P1
  EXP-702:
    id: EXP-702
    title: Ephemeral sandbox tier (warm pool, claim-to-ready)
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** The agent loop needs throwaway per-agent environments distinct from the UAT runtime (gap §5; ASCOA-GO FR-ENV-1..7).
      **Tasks:** `tenant_<slug>_sbx_<uuid>` schemas from a background-replenished warm pool (platform DDL pre-built); claim path = acquire + entity projection DDL + fixtures; sub-second claim-to-ready measured on the full path; torn down on every exit; same isolation + Wasm caps as production.
      **Acceptance:** Claim-to-ready measured vs the sub-second target on the full path; sandbox passes the cross-tenant isolation suite.
      **Depends on:** EXP-203 · **Touchpoints:** new `src/sandbox/*`, `src/db/provisioning.zig`.
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P2
  EXP-703:
    id: EXP-703
    title: Virtual clock + assertion/control API + sandbox auth
    stage: null
    status: UNTRACKED
    body: |-
      **Why:** Timer/approval processes must be testable deterministically; the control surface must be authenticated (gap §5; ASCOA-GO FR-ENV-8/9, FR-AGT-2/8/9).
      **Tasks:** `execute|assert|trace|advance_clock|complete_task` with frozen-clock + seeded RNG + stub effects (EXP-303); agents as per-tenant Keycloak service principals; sandbox bound to `(tenant, agent, task_spec)`; role simulation confined to sandboxes.
      **Acceptance:** A two-step timer+approval process passes deterministically across repeated runs; a non-owning principal is denied; role simulation rejected in staging/production.
      **Depends on:** EXP-702, EXP-303, `src/oidc/agent_lifecycle.zig` · **Touchpoints:** `src/sandbox/*`, `src/oidc/*`, `src/api/middleware/auth.zig`.

      ---

      ## Execution order

      | Wave | Epics / issues | Gate to next |
      |---|---|---|
      | **0** | EXP-101, EXP-102, EXP-103 | One expression engine; scale stated; waits persisted |
      | **1** | EXP-201→206, EXP-301→303, EXP-501 | Entities queryable via typed projections; external I/O async; secrets managed |
      | **2** | EXP-401→402, EXP-601 | Compensation declarative; restore reconciles; quotas central |
      | **3** | EXP-701→703 | Agent loop behind a signed threat model |

      **Suggested first vertical slice.** One tenant; one custom entity (e.g. `equipment_inspection`) stored as events and projected into a typed table; one two-step approval process whose approval is a user-task node; one DSL formula and one Lua script; one outbound notification via the **stub** effects executor; queried through the entity query API; promoted once through the human gate. This thread exercises EXP-102, EXP-201/202/203/205/206, EXP-301/303, EXP-501 — validating the **events→typed-projection** model and the **async-effects** model together before breadth is built.

      ---

      *Touchpoints name likely modules from the current `src/`/`web/` tree and may shift on implementation. Every issue inherits the inviolable guardrails above.*
    body_source: expansion-backlog
    alt_sources: []
    type: requirement
    backlog_tier: P2
  EXT-01:
    id: EXT-01
    title: Service task node type
    stage: 6
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL support a SERVICE_TASK node type that invokes an external HTTP endpoint (URL, method, and optional headers defined in the node configuration) as part of process execution. Response payload (on HTTP 2xx) is merged into instance variables. **Failure handling:** configurable timeout (default 30s); on timeout, non-2xx response, or network error, the platform SHALL retry up to N times (configurable per node, default 3) with exponential back-off. After exhausting retries, the failed invocation is moved to the DLQ (OBS-05) and the instance transitions to ERROR status (EE-10).

      **Acceptance Criteria:**
      - GIVEN execution reaches a SERVICE_TASK node, WHEN the HTTP call receives an HTTP 2xx response, THEN the JSON response body is merged into instance variables per EE-09.
      - GIVEN an HTTP 2xx response body that is not a JSON object, THEN it is NOT merged; instance transitions to ERROR (EE-10).
      - Timeout default is 30 seconds; configurable per node via `timeout_ms`. On timeout: counted as a failure, retry logic applies.
      - GIVEN N retries are exhausted, THEN the failed invocation is moved to OBS-05 DLQ and the instance transitions to ERROR per EE-10.
      - The platform MUST NOT follow HTTP redirects automatically. Redirect responses (3xx) MUST be treated as failures.

      **See:** EE-09 (response merge into variables), EE-10 (ERROR path on exhausted retries), OBS-05 (DLQ storage), API-09 (trace_id included in outgoing request headers)

      **Edge cases:**
      - SERVICE_TASK URL containing a template variable that resolves to an empty string: rejected at node activation with EE-10.
      - HTTP 429 from the external service: treated as a failure; retry logic applies.
    body_source: functional-doc
    alt_sources:
    - individual-file
    implemented_in:
