    status: UNTRACKED
    body: |-
      - **Epic:** EPIC-4 · **Priority:** P2 · **Estimate:** S · **Labels:** identity, docs, tests
      - **Depends on:** —
      - **Context:** §6.7 — roles live in both `user_roles` and `api_tokens.roles[]`; authority was
