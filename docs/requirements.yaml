  AGT-01:
    id: AGT-01
    title: Agent artifact envelope with kind discrimination
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** SIM-01, promoting agent run output from a simulation artifact to a first-class stored envelope.

      > An authoring agent SHALL submit its work through `POST /api/v1/agent/artifacts` as an envelope carrying `kind`, `task_spec_id`, `attempt_count`, `spec_hash`, `payload`, and `non_deterministic_fields`. `kind` is an enum over `test_report`, `design_artifact`, `patch_set`, `scenario_run` and SHALL discriminate the schema the `payload` is validated against. An envelope whose `kind` is outside the enum returns HTTP 400 `unknown_artifact_kind`; a payload that fails the schema selected by its `kind` returns HTTP 422 `artifact_payload_invalid` naming the failing JSON pointer.

      **Acceptance Criteria:**
      - GIVEN an envelope with `kind` of `test_report`, WHEN the payload is validated, THEN it is checked against the `test_report` schema and against no other schema.
      - GIVEN an envelope with `kind` of `patch_set` carrying a `test_report` payload, WHEN it is validated, THEN the platform returns HTTP 422 `artifact_payload_invalid` with the JSON pointer of the first failing member, and writes no `agent_artifacts` row.
      - GIVEN an envelope with `kind` of `benchmark`, WHEN it is parsed, THEN the platform returns HTTP 400 `unknown_artifact_kind` naming the received value and listing the four accepted discriminants.
      - GIVEN a valid envelope, WHEN it is stored, THEN the `agent_artifacts` row carries `kind` as a column, and a query filtering on `kind` returns that row without parsing the payload.
      - GIVEN an envelope carrying two payload members that each match a different `kind` schema, WHEN it is validated, THEN only the schema named by `kind` is applied and unrecognised members are rejected; the schema is closed, and unknown members are not ignored.
      - The four payload schemas are versioned alongside the envelope and are published at `GET /api/v1/agent/artifacts/schemas`.

      **See:** SIM-01, AGT-02, AGT-03, AGT-04, AGT-07, ENV-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:38Z'
    workflow: PW-11
  AGT-02:
    id: AGT-02
    title: Non-production artifact environment enforcement
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** ENV-01, confining agent artifacts to non-production environments.

      > Agent artifacts SHALL persist only in the `staging` schema of a non-production deployment. A submission handled by a deployment whose environment class is `production` SHALL return HTTP 403 `wrong_environment` before the payload is parsed and before any schema validation runs. The environment class SHALL be read from deployment configuration; an `environment` field present in the request body or in a header is discarded and never consulted.

      **Acceptance Criteria:**
      - GIVEN a production deployment, WHEN an artifact is submitted, THEN the platform returns HTTP 403 `wrong_environment`, writes no row, and records no payload content in logs.
      - GIVEN a production deployment, WHEN a submission carries a valid envelope, THEN the environment check runs before schema selection, so an invalid payload on a production deployment still yields HTTP 403 `wrong_environment` and never HTTP 422.
      - GIVEN a request body carrying `"environment": "staging"` against a production deployment, WHEN it is handled, THEN the field is discarded and the response is HTTP 403 `wrong_environment`.
      - GIVEN a staging deployment, WHEN an artifact is submitted and accepted, THEN the row is written to the `staging` schema and no artifact table exists in the production schema.
      - GIVEN a promotion of platform code from staging to production, WHEN the production deployment starts, THEN the artifact submission route is present and returns HTTP 403 `wrong_environment` for every call; the route is not removed, so its absence cannot be probed.
      - Every rejected submission appends `ArtifactSubmissionRejected` with the environment class and the calling principal.

      **See:** ENV-01, ENV-03, AGT-01, AGT-03, SBX-01, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:39Z'
    workflow: PW-11
  AGT-03:
    id: AGT-03
    title: Artifact submission idempotency per attempt
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** AGT-01, making artifact submission safe to retry.

      > Artifact submission SHALL be idempotent on `(tenant_id, task_spec_id, attempt_count)`, which is a unique index on `agent_artifacts`. The platform SHALL execute `INSERT ... ON CONFLICT (tenant_id, task_spec_id, attempt_count) DO UPDATE SET touched_at = now() RETURNING xmax = 0 AS inserted` and SHALL use `inserted` to distinguish a fresh insert from a re-hit: `true` returns HTTP 201, `false` with a matching `spec_hash` returns HTTP 200 carrying the existing `artifact_id`, and `false` with a differing `spec_hash` returns HTTP 409 `spec_hash_mismatch` carrying both hashes. A re-hit SHALL NOT replace the stored payload.

      **Acceptance Criteria:**
      - GIVEN no row exists for the triple, WHEN an artifact is submitted, THEN `xmax = 0` evaluates true, the platform returns HTTP 201, and `artifact_id` is the newly created UUID.
      - GIVEN a row exists for the triple and the submitted `spec_hash` matches the stored one, WHEN the same envelope is resubmitted, THEN the platform returns HTTP 200 with the original `artifact_id`, `touched_at` advances, and the stored `payload` is byte-identical to the payload stored on the first call.
      - GIVEN a row exists for the triple and the submitted `spec_hash` differs, WHEN the envelope is submitted, THEN the platform returns HTTP 409 `spec_hash_mismatch` carrying `stored_spec_hash` and `submitted_spec_hash`, and the stored row is unmodified.
      - GIVEN an agent whose network call times out after the server committed, WHEN the agent retries the identical envelope, THEN it receives HTTP 200 and exactly one row exists for the triple.
      - GIVEN the stored maximum `attempt_count` for a task spec is 3, WHEN an envelope with `attempt_count` of 2 is submitted, THEN the platform returns HTTP 409 `attempt_count_regressed`.
      - GIVEN two submissions for the same triple arrive concurrently, WHEN both execute, THEN exactly one observes `xmax = 0` true and returns HTTP 201, and the other returns HTTP 200 or HTTP 409 by `spec_hash` comparison.

      **See:** AGT-01, AGT-04, AGT-05, AGT-06, API-10
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:40Z'
    workflow: PW-11
  AGT-04:
    id: AGT-04
    title: Immutable task specs bound by spec hash
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** PD-08, applying content-addressed immutability to agent task specs.

      > A task spec SHALL be immutable once written. Its identity SHALL be `spec_hash`, the SHA-256 of the RFC 8785 canonical JSON serialisation of the spec document, stored as 64 lowercase hex characters in `task_specs.spec_hash`. Key order, insignificant whitespace, and number formatting in the submitted document SHALL NOT change the hash. A changed spec is a new spec with a new `task_spec_id` and a new `spec_hash`; there is no update path on `task_specs`.

      **Acceptance Criteria:**
      - GIVEN one spec document serialised twice with different key orders and different insignificant whitespace, WHEN both are canonicalised and hashed, THEN both produce the same 64-character `spec_hash`.
      - GIVEN a spec whose numeric field is written as `1.0` in one submission and `1` in another, WHEN both are canonicalised, THEN RFC 8785 number formatting is applied and the resulting hashes are equal.
      - GIVEN a stored `task_specs` row, WHEN any update to its spec document is attempted, THEN the platform returns HTTP 409 `task_spec_immutable` and the stored row is unmodified.
      - GIVEN a spec differing from a stored spec in exactly one field value, WHEN it is registered, THEN it receives a different `spec_hash` and a different `task_spec_id`, and the stored spec remains addressable.
      - GIVEN an artifact submitted with a `spec_hash` that matches no `task_specs` row in the tenant, WHEN it is handled, THEN the platform returns HTTP 404 `task_spec_not_found`.
      - `spec_hash` covers the server-set `orchestrator_principal` of SBX-02, so a spec cannot be re-registered under a different orchestrator identity without changing its hash.

      **See:** PD-08, REPO-07, AGT-03, AGT-05, SBX-02, PIN-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:41Z'
    workflow: PW-11
  AGT-05:
    id: AGT-05
    title: Non-zero RNG seed folded into spec identity
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** AGT-04, binding run determinism into spec identity.

      > A task spec SHALL carry `rng_seed` as a uint64, SHALL be rejected with HTTP 400 `rng_seed_zero` when that value is 0, and SHALL fold `rng_seed` into the canonical JSON before `spec_hash` is computed. Two specs that differ only in their seed therefore carry different identities, and an agent cannot reuse one spec identity for runs that would diverge. A zero seed is refused rather than defaulted, so an unset seed cannot silently produce a run whose determinism is unrecorded.

      **Acceptance Criteria:**
      - GIVEN a spec with `rng_seed` of 0, WHEN it is registered, THEN the platform returns HTTP 400 `rng_seed_zero` and writes no `task_specs` row.
      - GIVEN a spec with `rng_seed` absent, WHEN it is registered, THEN the platform returns HTTP 400 `rng_seed_zero`; no default seed is substituted.
      - GIVEN two specs identical apart from `rng_seed` values 42 and 43, WHEN both are registered, THEN their `spec_hash` values differ and both rows persist.
      - GIVEN a spec registered with `rng_seed` of 42, WHEN an artifact is submitted claiming a `spec_hash` computed with `rng_seed` omitted from the canonical form, THEN the hashes differ and the submission returns HTTP 409 `spec_hash_mismatch`.
      - GIVEN a scenario run replayed with the stored spec, WHEN the seed is read from the spec rather than from the environment, THEN the replay uses the same seed that produced the original artifact.
      - `rng_seed` is serialised in the canonical JSON as an unsigned integer with no exponent form, so its contribution to `spec_hash` is stable across submitters.

      **See:** AGT-04, AGT-03, SIM-01, AGT-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:42Z'
    workflow: PW-11
  AGT-06:
    id: AGT-06
    title: Dual-sweep artifact retention
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** PIN-01, tying artifact retention to the version pair the artifact was produced against.

      > Artifact retention SHALL be a dual sweep. Sweep 1 deletes artifacts in state `needs_review` whose `created_at` is older than `STAGING_REVIEW_TTL_DAYS` (default 30). Sweep 2 deletes an artifact in state `verified` only when the pinned `(task_spec_version, process_definition_version)` pair recorded in `artifact_version_pins` has been collected AND `verified_at` is older than `STAGING_VERIFIED_TTL_DAYS` (default 365); the later of the two moments governs. A verified artifact is exempt from the needs-review TTL for as long as anything still pins its version pair.

      **Acceptance Criteria:**
      - GIVEN an artifact in state `needs_review` created 31 days ago, WHEN sweep 1 runs, THEN the row is deleted and the authoring agent must resubmit to restore it.
      - GIVEN an artifact in state `verified` created 400 days ago, WHEN sweep 1 runs, THEN the row is untouched; the state predicate excludes verified artifacts from the needs-review TTL.
      - GIVEN a verified artifact whose pinned version pair is still collected-pending and whose `verified_at` is 400 days old, WHEN sweep 2 runs, THEN the row is retained because the pin has not been collected.
      - GIVEN a verified artifact whose pinned version pair was collected 100 days ago and whose `verified_at` is 200 days old, WHEN sweep 2 runs, THEN the row is retained because 365 days have not elapsed since verification.
      - GIVEN a verified artifact whose pin was collected and whose `verified_at` is 366 days old, WHEN sweep 2 runs, THEN the row is deleted.
      - GIVEN an artifact transitions to `verified`, WHEN the transition commits, THEN an `artifact_version_pins` row carrying `(artifact_id, task_spec_version, process_definition_version)` is written in the same transaction.
      - Both sweeps run on a daily schedule at 03:00 UTC, sweep 1 before sweep 2, and each carries a state predicate that makes a re-run a no-op.

      **See:** PIN-01, PIN-02, ES-07, AGT-03, AGT-04, IR-07
    body_source: backlog-migration-20260807
