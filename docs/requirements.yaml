    type: requirement
    note: 'ISS-0112 fix: service catalog fixture hygiene + schema baseline'
  SVC-02:
    id: SVC-02
    title: Plugin handlers declare scope and optional owner tenant at registration
    stage: 13
    priority: MUST
    status: RELEASED
    body: |-
      > Every plugin handler registered via the plugin interface (EXT-03) SHALL
      > declare a `scope` (`global` or `tenant`) and, when `scope = tenant`, an
      > `owner_tenant_id`. The plugin dispatch path SHALL check scope before invoking
      > a handler: a tenant-scoped plugin is only invoked for its owning tenant's
      > process instances. Global plugins are invoked for all tenants.

      **Acceptance Criteria:**
      - GIVEN the `PluginRegistration` struct, THEN it gains fields:
        - `scope: PluginScope` where `PluginScope = enum { global, tenant }`
        - `owner_tenant_id: ?Uuid` (null for global, required for tenant-scoped)
      - GIVEN `registerPlugin()` is called with `scope = .tenant` and
        `owner_tenant_id = null`, THEN registration fails with
        `error.TenantScopedPluginRequiresOwnerId` before `freezePluginRegistry()`.
      - GIVEN a SERVICE_TASK node executes for an instance belonging to tenant T,
        WHEN the plugin registry is consulted, THEN only plugins with
        `scope = .global` OR `(scope = .tenant AND owner_tenant_id == T)` are
        eligible for dispatch.
      - GIVEN a tenant-scoped plugin P is registered for tenant T, WHEN a
        SERVICE_TASK executes for tenant U (U ≠ T), THEN plugin P is not invoked;
        the built-in handler or a global plugin takes precedence per EXT-03 priority
        rules.
      - GIVEN a global plugin and a tenant-scoped plugin are both registered for the
        same node type, and the executing instance belongs to the tenant-scoped
        plugin's owning tenant, THEN the tenant-scoped plugin takes precedence over
        the global one.
      - `freezePluginRegistry()` validates that no two tenant-scoped plugins share
        the same `(node_type, owner_tenant_id)` combination; duplicate registration
        is a fatal startup error.
      - The plugin registry remains in-process and startup-only (EXT-03 constraint
        unchanged); tenant scoping is a filter on dispatch, not a dynamic loading
        mechanism.

      **See:** SVC-01 (service catalog scope model — same pattern applied to
      plugins), EXT-03 (plugin interface base requirement), SVC-03 (definition
      activation checks plugin availability)

      **Edge cases:**
      - A global plugin is registered for a node type that also has a built-in
        handler: global plugin takes precedence over built-in (EXT-03 rule unchanged).
      - A tenant-scoped plugin's owner tenant is deprovisioned at runtime: the plugin
        remains registered (in-process, frozen) but its `owner_tenant_id` no longer
        resolves to an active tenant; dispatch silently falls through to the global
        plugin or built-in. A startup-time warning is logged if a registered plugin's
        owner tenant does not exist in `public.tenant`.
    body_source: individual-file
    alt_sources: []
    note: Implemented in run WF02-svc-batch1-20260610; source files not individually tracked.
    test_spec: tests/specs/SVC-02.md
    test_run: tests/reports/report-20260610-WF02-svc-batch1-20260610.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-svc-batch1-20260610
    release_decision: docs/status/release-stage13-svc-batch1-20260610.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  SVC-03:
    id: SVC-03
    title: Definition activation validates service and plugin availability
    stage: 13
    priority: MUST
    status: RELEASED
    body: |-
      > When a process definition is activated (status set to `ACTIVE`), the platform
      > SHALL validate that every SERVICE_TASK node's referenced service or plugin is
      > available to the activating tenant. A definition that references a
      > tenant-scoped service or plugin belonging to a different tenant MUST be
      > rejected at activation time, not at runtime.

      **Acceptance Criteria:**
      - GIVEN a process definition D for tenant T contains a SERVICE_TASK node with
        `service_id = "X"`, WHEN D is activated, THEN the platform checks:
        - If `service_catalog` has an entry for `"X"` with `scope = 'global'`: PASS.
        - If `service_catalog` has an entry for `"X"` with `scope = 'tenant'` and
          `owner_tenant_id = T`: PASS.
        - If `service_catalog` has an entry for `"X"` with `scope = 'tenant'` and
          `owner_tenant_id ≠ T`: FAIL — HTTP 422,
          `"service X is not available to tenant T"`.
        - If `service_catalog` has no entry for `"X"`: FAIL — HTTP 422,
          `"service X is not registered"`.
      - GIVEN a process definition D for tenant T contains a SERVICE_TASK node with
        `plugin_handler = "P"`, WHEN D is activated, THEN the platform checks the
        plugin registry: if P is `scope = .tenant` and `owner_tenant_id ≠ T`,
        activation is rejected with HTTP 422.
      - GIVEN all SERVICE_TASK references resolve correctly for tenant T, WHEN D is
        activated, THEN activation proceeds normally per existing PD-08 rules.
      - Activation validation is atomic: if any single SERVICE_TASK reference fails,
        the entire activation is rejected; no partial activation occurs.
      - The validation runs at activation time (status DRAFT → ACTIVE) and also at
        re-activation time (DEPRECATED → ACTIVE); it does not run on DRAFT creation.

      **See:** SVC-01 (service catalog scope), SVC-02 (plugin scope), PD-08
      (definition snapshot and activation), ADP-08 (service task catalog reference)

      **Edge cases:**
      - A definition was activated when a service was global, then the service is
        changed to tenant-scoped for a different tenant: existing `ACTIVE` definition
        is not retroactively invalidated; the change takes effect on the next
        activation attempt.
      - A definition references both a service_id (catalog lookup) and a
        plugin_handler (plugin registry lookup) on the same node: both are validated;
        both must pass.
      - `service_id` and `plugin_handler` both absent on a SERVICE_TASK node: existing
        validation error (PD-05 node attribute check) catches this before SVC-03
        validation runs.
    body_source: individual-file
    alt_sources: []
    note: Implemented in run WF02-svc-batch1-20260610; source files not individually tracked.
    test_spec: tests/specs/SVC-03.md
    test_run: tests/reports/report-20260610-WF02-svc-batch1-20260610.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-11T00:00:00Z'
    release_run: WF02-svc-batch1-20260610
    release_decision: docs/status/release-stage13-svc-batch1-20260610.yaml
    last_updated: '2026-06-11T00:00:00Z'
    type: requirement
  SVC-04:
    id: SVC-04
    title: Admin UI and API for service catalog scope management
    stage: 13
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL expose API endpoints and an admin UI view that allow a
      > platform-admin to register, update scope, and deregister services in the
      > catalog. Tenant admins SHALL be able to view the services available to their
      > tenant (global + their own tenant-scoped services) but not register or modify
      > entries.

      **Acceptance Criteria:**
      - `POST /api/v1/admin/services` (platform-admin only): registers a new service
        with fields `service_id`, `endpoint_url`, `scope` (`global` | `tenant`),
        `owner_tenant_id` (required if `scope = tenant`), `request_schema`,
        `response_schema`, `auth_method`, `timeout_ms`, `max_retries`. Returns HTTP
        201 with the created entry.
      - `PATCH /api/v1/admin/services/:service_id` (platform-admin only): allows
        updating `scope` and `owner_tenant_id` on an existing entry. Returns HTTP 200.
        Changing scope from `global` to `tenant` on a service already referenced by
        multiple tenants' active definitions: returns HTTP 409 listing the conflicting
        tenants.
      - `DELETE /api/v1/admin/services/:service_id` (platform-admin only): removes
        the service. Returns HTTP 409 if any `ACTIVE` definition references the
        service (lists the definition IDs).
      - `GET /api/v1/services` (any authenticated role, tenant-scoped): returns all
        `scope = global` entries plus `scope = tenant` entries where
        `owner_tenant_id` matches the caller's tenant. Does not return other tenants'
        scoped services.
      - `GET /api/v1/admin/services` (platform-admin only): returns all entries
        regardless of scope or tenant.
      - The admin UI (`ADM-UI` section) includes a "Services" page showing the
        services available to the current tenant, with columns: service_id, scope,
        endpoint, timeout, retries. Platform-admins see an additional "Owner tenant"
        column and a "Register service" button.

      **See:** SVC-01 (service catalog scope model), SVC-03 (activation validation
      uses this catalog), ADP-08 (service task catalog reference at runtime),
      ADM-UI-01 (admin section pattern)

      **Edge cases:**
      - `PATCH` changes `owner_tenant_id` from tenant A to tenant B: existing active
        definitions for tenant A that reference this service are not immediately
        invalidated, but a WARNING audit entry is written. Next activation attempt
        for those definitions will fail.
      - Registering a service with a `service_id` that already exists: HTTP 409.
      - Tenant admin attempts `POST /api/v1/admin/services`: HTTP 403.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - migrations/GBL-133_iss0112_schema_ledger_reconcile.sql
    - tests/integration/helpers.zig
    test_spec: tests/specs/SVC-04.md
    test_run: tests/reports/report-20260610-WF02-svc-batch1-20260610.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-11T00:00:00Z'
