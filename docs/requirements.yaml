  TNT-02:
    id: TNT-02
    title: Migration runner enforces search_path isolation
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > The migration runner SHALL execute each migration file inside the target
      > tenant schema by setting `search_path = <tenant_schema>, public` on the
      > connection before running the SQL. Migration files SHALL NOT use explicit
      > `public.` table qualifiers for business tables. A linter SHALL reject any
      > migration file that references `public.<business_table>` at CI time.

      **Acceptance Criteria:**
      - GIVEN `migrations.runForSchema(pool, migrations_dir, "tenant_abc123")` is
        called, WHEN a migration file contains `CREATE TABLE events (...)`, THEN the
        table is created in `tenant_abc123.events`, not `public.events`.
      - GIVEN the migration runner acquires a connection, THEN it issues
        `SET search_path = <tenant_schema>, public` as the first statement on that
        connection before executing any migration SQL.
      - GIVEN a migration file contains the string `public.events`,
        `public.instance_projections`, `public.tasks`, `public.tokens`,
        `public.timers`, `public.audit_entries`, `public.audit_log`, `public.users`,
        `public.groups`, `public.group_members`, `public.roles`, `public.user_roles`,
        `public.api_tokens`, `public.webhook_subscriptions`,
        `public.dead_letter_items`, `public.event_type_registry`, or
        `public.repository_form_schemas`, WHEN the CI linter runs, THEN the pipeline
        fails with an error identifying the file and the offending line.
      - GIVEN a migration file contains `public.tenant_schemas`, `public.tenant`, or
        `public.schema_migrations` (legitimate global references), WHEN the CI linter
        runs, THEN no error is raised for those specific references.
      - GIVEN two tenant schemas A and B exist, WHEN a migration is applied to schema
        A, THEN schema B is not touched and its `schema_migrations` tracking row is
        unchanged.
      - The `schema_migrations` table in `public` tracks `(schema_name, version)` as
        a composite primary key; a migration applied to `tenant_abc` records
        `(schema_name='tenant_abc', version=NNN)` and does not affect the
        `(schema_name='public', version=NNN)` row.

      **See:** TNT-01 (business tables in tenant schemas), TNT-03 (search_path on
      connection checkout), TNT-05 (backfill migration applies this runner to
      existing tenants)

      **Edge cases:**
      - Migration file that uses a DO $$ BEGIN … END $$ block with dynamic SQL: the
        linter checks string literals within the block for `public.<business_table>`
        patterns.
      - Migration that creates a function in `public` (e.g. a trigger helper): allowed
        if the function does not reference business tables by schema-qualified name.
      - Migration applied to `public` schema (global infrastructure): runner uses
        `search_path = public`; no tenant schema is set; linter rules do not apply
        to global-scope migration files (distinguished by filename prefix `GBL-`).
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch1-20260609
    test_spec: tests/specs/TNT-02.md
    test_run: tests/reports/report-20260610-WF02-tnt-batch1-20260609.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-10T02:49:11Z'
    release_run: WF02-tnt-batch1-20260609
    release_decision: docs/status/release-stage12-tnt-batch1-20260610.yaml
    last_updated: '2026-06-10T02:49:11Z'
    type: requirement
  TNT-03:
    id: TNT-03
    title: Connection pool sets search_path per tenant on checkout
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > The connection pool SHALL set `search_path = <tenant_schema>, public` on
      > every connection immediately after resolving the tenant context for a request.
      > No query issued within that request SHALL access a different tenant's schema.
      > The `search_path` MUST be reset to a safe default when the connection is
      > returned to the pool.

      **Acceptance Criteria:**
      - GIVEN a request is resolved to tenant `swiftroute` (schema
        `tenant_abc123def456...`), WHEN a connection is acquired from the pool, THEN
        the pool issues `SET search_path = tenant_abc123def456, public` before
        returning the connection to the caller.
      - GIVEN any SQL query issued on that connection that references an unqualified
        table name (e.g. `SELECT * FROM events`), THEN PostgreSQL resolves it to
        `tenant_abc123def456.events`, not `public.events`.
      - GIVEN a connection is returned to the pool after a request completes, THEN
        the pool resets `search_path = public` on that connection before it can be
        reused for another request.
      - GIVEN a request with no resolved tenant (bootstrap token, platform-admin
        system call), WHEN a connection is acquired, THEN `search_path = public` is
        set and no tenant schema is prepended.
      - GIVEN two concurrent requests for different tenants A and B, WHEN both
        acquire connections from the pool simultaneously, THEN each connection has
        its own `search_path` set independently; no connection serves rows from the
        wrong tenant schema.
      - The `search_path` setting MUST NOT be set via a session-level `SET` that
        persists across connection reuse; it MUST be re-applied on every checkout.
      - Pool connection validation (DB-02 stale connection check) MUST re-apply the
        correct `search_path` after a reconnect.

      **See:** TNT-01 (business tables in tenant schemas), TNT-02 (migration runner
      uses same search_path pattern), ADP-03 (tenant context resolution from bearer
      token), DB-02 (connection pool and stale connection handling)

      **Edge cases:**
      - Connection checkout within a database transaction: `search_path` is set
        before the transaction begins; it MUST NOT be reset mid-transaction.
      - Nested pool acquisitions (e.g. a service that acquires a second connection
        for a sub-query): each acquisition independently sets `search_path` to the
        same tenant schema for the same request context.
      - `search_path` reset on return fails (DB error): connection is discarded from
        the pool, not returned, to avoid cross-tenant contamination.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch1-20260609
    test_spec: tests/specs/TNT-03.md
    test_run: tests/reports/report-20260610-WF02-tnt-batch1-20260609.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-10T02:49:11Z'
    release_run: WF02-tnt-batch1-20260609
    release_decision: docs/status/release-stage12-tnt-batch1-20260610.yaml
    last_updated: '2026-06-10T02:49:11Z'
    type: requirement
  TNT-04:
    id: TNT-04
    title: Platform startup audits public schema
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > The `public` schema SHALL be the platform's routing and cluster management
      > layer only. It SHALL contain the canonical list of tables below and nothing
      > else. Any table not on this list that is found in `public` at startup or
      > detected by the schema linter SHALL cause a startup warning logged at ERROR
      > level.

      **Permitted tables in `public`:**

      | Table | Purpose |
      |---|---|
      | `tenant` | Master tenant registry (id, slug, display_name, status) |
      | `tenant_schemas` | Maps tenant_id → schema_name; used by pool for search_path |
      | `tenant_hostnames` | Maps hostnames → tenant_id for subdomain routing |
      | `tenant_realm_binding` | Maps OIDC realm → tenant_id |
      | `schema_migrations` | Tracks applied migrations per schema_name |
      | `onboarding_registry` | Idempotency and state tracking for tenant onboarding sagas |
      | `service_catalog` | Global and tenant-scoped service registrations (SVC-01) |
      | `repository_artifacts` | Content-addressed artifact store (global) |
      | `repository_activations` | Per-tenant artifact version activations |
      | `alerting_state` | Platform-wide alerting configuration |

      **Acceptance Criteria:**
      - GIVEN the platform starts, THEN it runs a schema audit: it queries
        `information_schema.tables WHERE table_schema = 'public'` and compares the
        result against the permitted list above.
      - GIVEN the audit finds a table not on the permitted list, THEN the platform
        logs an ERROR-level message naming the unexpected table and continues (no
        hard stop, to allow zero-downtime migration windows).
      - GIVEN the audit finds all tables on the permitted list and nothing else, THEN
        the platform logs an INFO-level message `"public schema audit: CLEAN"`.
      - GIVEN a migration is applied that would create a new table in `public`, THEN
        the CI migration linter (TNT-02) MUST require that the table name is added to
        the permitted list in this requirement's definition before the migration is
        merged.
      - The `tenant_id UUID NOT NULL` column and all Row Level Security policies on
        business tables that were added by migrations 027 and 028 (ADP-01/ADP-02)
        are removed as part of the TNT-05 backfill migration once all tenants are
        confirmed migrated.

      **See:** TNT-01 (business tables in tenant schemas), TNT-02 (migration linter),
      TNT-05 (backfill removes business tables from public), SVC-01 (service_catalog
      scope field added here)

      **Edge cases:**
      - During the migration window (TNT-05 in progress): business tables temporarily
        exist in both `public` (legacy rows) and `tenant_<uuid>` (migrated rows);
        the audit produces a WARNING rather than ERROR during this window, identified
        by a migration-window flag in `onboarding_registry`.
      - Functions and sequences in `public`: not checked by the audit; only `BASE
        TABLE` and `VIEW` types are validated.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch1-20260609
    test_spec: tests/specs/TNT-04.md
    test_run: tests/reports/report-20260610-WF02-tnt-batch1-20260609.yaml
    tested_at: '2026-06-10'
    released_at: '2026-06-10T02:49:11Z'
    release_run: WF02-tnt-batch1-20260609
    release_decision: docs/status/release-stage12-tnt-batch1-20260610.yaml
    last_updated: '2026-06-10T02:49:11Z'
    type: requirement
  TNT-05:
    id: TNT-05
    title: Backfill migration moves existing tenant data out of public schema
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > A one-time backfill migration SHALL copy all rows belonging to each tenant
      > from the business tables in `public` into the corresponding tables in
      > `tenant_<uuid>`, verify row counts, and then remove those rows from `public`.
      > The migration SHALL be idempotent and safe to re-run. It SHALL not cause
      > downtime: writes to `public` business tables continue during the migration
      > window and are drained before the final cutover.

      **Acceptance Criteria:**
      - GIVEN the backfill migration runs for tenant T, WHEN it completes, THEN:
        - `SELECT count(*) FROM tenant_<T_uuid>.<table>` equals the count of rows
          that were in `public.<table> WHERE tenant_id = T_uuid` before the migration.
        - `SELECT count(*) FROM public.<table> WHERE tenant_id = T_uuid` equals 0.
        - The result is the same for every business table listed in TNT-01.
      - GIVEN the backfill migration is interrupted mid-run, WHEN it is re-run, THEN
        it resumes without duplicating rows (idempotency via `ON CONFLICT DO NOTHING`
        on insert into the tenant schema).
      - GIVEN a tenant has zero rows in `public` (newly provisioned tenant), WHEN the
        backfill runs for that tenant, THEN it completes successfully with no-ops.
      - GIVEN the backfill completes for all tenants, THEN the business table
        `tenant_id` column constraints and RLS policies added by migrations 027/028
        are dropped in a subsequent cleanup migration.
      - The migration is executed per-tenant sequentially; it does not lock the entire
        `public` table for the duration (uses row-level locks and batched copies).
      - A migration-window flag is set in `public.onboarding_registry` (or a
        dedicated `public.migration_windows` table) at the start and cleared at
        completion; the TNT-04 schema audit uses this flag to downgrade ERROR to
        WARNING during the window.
      - The backfill migration records per-tenant progress in a `public.tnt05_progress`
        table so that partial runs can be inspected and resumed.

      **See:** TNT-01 (target state), TNT-02 (migration runner), TNT-03 (search_path),
      TNT-04 (public schema audit), DB-03 (transactional integrity during copy)

      **Edge cases:**
      - A row in `public.<table>` with `tenant_id = 00000000-0000-0000-0000-000000000000`
        (default tenant): copied to `tenant_default.<table>`.
      - A row with a `tenant_id` that does not exist in `public.tenant`: logged as
        an orphan; not migrated; written to a `public.tnt05_orphans` table for manual
        review.
      - Foreign key relationships between business tables (e.g. `tasks` references
        `instance_projections`): migration copies tables in dependency order
        (instances before tasks, definitions before instances).
      - Very large tenants (millions of rows): migration uses batched inserts of
        10,000 rows per transaction to limit lock duration and WAL pressure.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch2-20260609
    last_updated: '2026-06-10T11:08:25Z'
    type: requirement
  TNT-06:
    id: TNT-06
    title: Tenant schema export and import for server migration
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL provide a procedure (CLI command or admin API endpoint)
      > that exports a single tenant's complete schema and data as a PostgreSQL dump,
      > imports it into a target PostgreSQL server, updates the routing registry, and
      > verifies the tenant is operational on the new server — all within a
      > maintenance window of under 10 minutes for tenants up to 10 GB of data.

      **Acceptance Criteria:**
      - GIVEN a tenant T is on server S1, WHEN the export procedure runs, THEN it
        produces a self-contained dump of `tenant_<T_uuid>` schema (DDL + data) that
        can be restored on any PostgreSQL 15+ server without modification.
      - GIVEN the dump is restored on server S2, WHEN the import procedure updates
        `public.tenant_schemas` on S1 to record `db_host = S2`, THEN all subsequent
        requests for tenant T are routed to S2.
      - GIVEN the migration completes, WHEN a process instance is started for tenant
        T, THEN it uses S2 and the event is written to `tenant_<T_uuid>.events` on S2.
      - GIVEN the migration completes, WHEN the old schema on S1 is dropped (operator
        action, separate step), THEN no data loss occurs because S2 is the authoritative
        source.
      - The export procedure MUST pause new writes to the tenant (put the tenant in
        read-only mode via a `tenant.status = 'MIGRATING'` flag) for the final
        sync phase only; reads continue throughout.
      - `public.tenant_schemas` MUST gain a `db_host TEXT` column (defaulting to the
        current server's `BPM_DB_URL` host) so the connection pool can route per-tenant
        to different PostgreSQL servers.
      - The connection pool (TNT-03) MUST use `db_host` from `tenant_schemas` to
        select which server connection to use for a given tenant.
      - The entire procedure (export → restore → routing update → verify) MUST complete
        in under 10 minutes for a tenant schema up to 10 GB.

      **See:** TNT-01 (schema-per-tenant foundation), TNT-03 (connection pool
      routing), TNT-04 (public schema registry), DB-01 (PostgreSQL foundation),
      NFR-03 (availability — migration window minimised)

      **Edge cases:**
      - Tenant has active in-flight process instances during migration: they complete
        on S1 until read-only mode is engaged; the dump captures final state.
      - S2 restore fails mid-way: routing is not updated; tenant remains on S1;
        partial dump on S2 is cleaned up by the procedure.
      - `tenant_schemas.db_host` not set (single-server deployment): pool falls back
        to `BPM_DB_URL`; behaviour is identical to current single-server operation.
      - Tenant schema size exceeds 10 GB: procedure emits a warning; migration is
        still attempted but the 10-minute SLA no longer applies.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch2-20260609
    last_updated: '2026-06-10T11:08:25Z'
    type: requirement
  TNT-07:
    id: TNT-07
    title: Remove RLS policies and tenant_id columns from public business tables
    stage: 12
    priority: MUST
    status: RELEASED
    body: |-
      > Once TNT-05 backfill is confirmed complete for all tenants, the Row Level
      > Security policies, RLS enablement, and `tenant_id` columns added by
      > migrations 027 and 028 to business tables in `public` SHALL be removed.
      > Schema isolation (TNT-01 through TNT-03) replaces RLS as the tenant
      > separation mechanism. The `bpm_effective_tenant_id()` function SHALL also
      > be dropped.

      **Acceptance Criteria:**
      - GIVEN TNT-05 is complete and all tenant data is confirmed in tenant schemas,
        WHEN this migration runs, THEN:
        - `ALTER TABLE public.<table> DISABLE ROW LEVEL SECURITY` succeeds for each
          business table that had RLS enabled.
        - `DROP POLICY <policy> ON public.<table>` succeeds for each policy created
          by migration 028.
        - `ALTER TABLE public.<table> DROP COLUMN IF EXISTS tenant_id` succeeds for
          each business table that had the column.
        - `DROP FUNCTION IF EXISTS public.bpm_effective_tenant_id()` succeeds.
      - GIVEN this migration is applied and a query is issued directly against
        `public.events` without a `tenant_id` filter, THEN it returns zero rows
        (because no business data remains in `public` after TNT-05).
      - GIVEN this migration is applied, WHEN `zig build test` is run, THEN all
        integration tests pass (no test relies on RLS filtering in `public`).
      - This migration is gated: it MUST NOT run until a pre-flight check confirms
        that every known `tenant_id` in `public.tenant` has a corresponding row in
        `public.tenant_schemas` with `migrations_applied_at IS NOT NULL`, and
        `public.tnt05_progress` shows all tenants at status `COMPLETED`.
      - The migration is idempotent: running it twice produces no error.

      **See:** TNT-05 (backfill must complete first), TNT-01 (target architecture),
      TNT-04 (public schema permitted table list enforced after this migration)

      **Edge cases:**
      - A business table in `public` that never had RLS enabled (added after migration
        028): the `DISABLE ROW LEVEL SECURITY` and `DROP POLICY` steps are no-ops;
        `DROP COLUMN tenant_id` still applies if the column exists.
      - Pre-flight check fails for one tenant (e.g. provisioning failed): migration
        aborts with an error listing the unready tenants; no DDL changes are made.
      - `bpm_effective_tenant_id()` referenced by a trigger or view that was not
        cleaned up: `DROP FUNCTION` fails with a dependency error; the migration
        aborts and lists the dependent objects for manual cleanup.
    body_source: individual-file
    alt_sources: []
    implemented_in:
    - WF02-tnt-batch2-20260609
    last_updated: '2026-06-10T11:08:25Z'
    type: requirement
