    type: requirement
    last_updated: '2026-08-13T20:55:36Z'
    workflow: PW-16
    note: 'Released via WF02-pw13-pw16-batch19-20260813 (Batch 19). RELEASE-VALIDATOR APPROVED: type-check
      0, lint 0, 110/110 unit tests, build 0.'
    implemented_in:
    - web/src/components/forms/FieldFactory.tsx
    - web/src/components/forms/DynamicFormRenderer.tsx
    - web/src/components/forms/ariaHints.ts
    - web/src/components/forms/fieldRegistry.ts
    - web/tests/a11y/aria-validator.ts
