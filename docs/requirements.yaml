    type: requirement
    last_updated: '2026-08-07T16:09:43Z'
    workflow: PW-11
  AGT-07:
    id: AGT-07
    title: Deprecated envelope field names rejected
    stage: '17'
    priority: SHOULD
    status: DRAFT
    body: |-
      > **Extends:** AGT-01, refusing silent compatibility shims on the envelope.

      > A deprecated envelope field name SHALL be rejected as a validator error and SHALL NOT be aliased to its replacement. The legacy name `ignore_fields` SHALL return HTTP 400 `deprecated_field:ignore_fields` naming the replacement `non_deterministic_fields`; the submitted value is discarded and no artifact row is written. A stale submitter therefore fails loudly at the boundary rather than storing an artifact whose exclusion set was read from a field the platform no longer defines.

      **Acceptance Criteria:**
      - GIVEN an envelope carrying `ignore_fields`, WHEN it is validated, THEN the platform returns HTTP 400 `deprecated_field:ignore_fields` with the replacement name in the response body, and writes no `agent_artifacts` row.
      - GIVEN an envelope carrying both `ignore_fields` and `non_deterministic_fields`, WHEN it is validated, THEN the same HTTP 400 is returned; the presence of the current field does not excuse the deprecated one.
      - GIVEN an envelope carrying `ignore_fields` with an empty array, WHEN it is validated, THEN the same HTTP 400 is returned; an empty deprecated field is still an error.
      - GIVEN a deprecated field is rejected, WHEN the stored artifact set is inspected, THEN no row exists whose `non_deterministic_fields` column was populated from a deprecated name.
      - GIVEN a future field rename, WHEN the replacement is introduced, THEN the prior name is added to the deprecated-name set with its own `deprecated_field:<name>` identifier rather than to an alias map.
      - The deprecated-name check runs before payload schema validation, so a submitter using a deprecated name receives HTTP 400 rather than HTTP 422.

      **See:** AGT-01, AGT-03, API-10
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:44Z'
    workflow: PW-11
  CAC-UI-01:
    id: CAC-UI-01
    title: Tenant segment in every query key
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** IDN-02, extending tenant isolation from the API boundary into the client cache.

      > Every factory exported from `web/src/api/queryKeys.ts` SHALL emit a key of the shape `[kind, tenantSlug, ...rest]` with `tenantSlug` at index 1, for every kind in `definition`, `instance`, `task`, `eventType`, `timer`, `dlq`, `audit`, `user`, `role`, `branding`, `metrics` and `health`. The factory SHALL read the slug from `auth/tenantConfig.getActiveTenantSlug()`; a caller SHALL NOT pass a slug into a factory, so a stale component prop cannot widen a key. A factory invoked before the session resolves SHALL throw `MissingTenantContextError` rather than emit a key without the segment. No `useQuery`, `useMutation` or `queryClient` call SHALL take an inline array literal as its key.

      **Acceptance Criteria:**
      - GIVEN every exported factory in `web/src/api/queryKeys.ts`, WHEN each is invoked with a fixed active slug, THEN element 1 of the returned array equals that slug; a factory missing the segment fails this pure static key-shape check with no HTTP.
      - GIVEN any factory signature accepting a `tenantSlug` parameter, WHEN the key-shape check runs, THEN it fails naming that factory, since the slug is read from the session and not from a caller.
      - GIVEN a hook passing an inline array literal to `useQuery`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails reporting the file path and pattern name `inline-query-key`; this is a pure static scan with no HTTP.
      - GIVEN a Playwright E2E signs in to SwiftRoute against the real backend and opens the Instance List, WHEN `queryClient.getQueryCache().getAll()` is read in the page, THEN every cached key holds `swiftroute` at index 1 and no key omits the segment.
      - GIVEN a factory is invoked before `auth/tenantConfig` resolves the session, WHEN it runs, THEN `MissingTenantContextError` is thrown and no request is issued.

      **See:** CAC-UI-02, CAC-UI-03, CAC-UI-04, GRD-UI-02, IDN-02, ENV-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:45Z'
    workflow: PW-15
  CAC-UI-02:
    id: CAC-UI-02
    title: Cache disposal on tenant switch and sign-out
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > On a tenant switch emitted by `web/src/components/TenantHeader.tsx`, the SPA SHALL call `queryClient.removeQueries()` for every cached key whose element 1 equals the outgoing slug, and SHALL complete that disposal before the first query of the incoming tenant is issued. On sign-out the SPA SHALL call `queryClient.clear()` before the identity provider redirect. The regression test covering this SHALL be named `cache-isolation-on-tenant-switch` and SHALL be referenced by that name in `tests/specs/PIPELINE-tenant-cache.md`. Client-side key scoping is defence in depth; the Platform API remains the enforcing tenant boundary.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E named `cache-isolation-on-tenant-switch` signs in as a user holding membership in both SwiftRoute and Vortex on the real backend, WHEN the user switches from SwiftRoute to Vortex without reloading, THEN reading `queryClient.getQueryCache().getAll()` in the page returns no key whose element 1 equals `swiftroute`.
      - GIVEN that switch, WHEN the Instance List is re-rendered, THEN the intermediate frame shows `SkeletonLayout` and no SwiftRoute row appears in any captured frame.
      - GIVEN a request to a SwiftRoute route is in flight when the switch fires, WHEN the response arrives, THEN it is discarded because its key was removed, and no SwiftRoute row enters the Vortex cache.
      - GIVEN the user signs out, WHEN the cache is read immediately before the Keycloak redirect in that E2E, THEN `getQueryCache().getAll()` returns an empty array.
      - GIVEN `tests/specs/PIPELINE-tenant-cache.md`, WHEN it is read, THEN it names `cache-isolation-on-tenant-switch` and maps it to CAC-UI-02; this is a pure static specification check.
      - No HTTP mocking is used at any point; both tenants are real seeded tenants on the running backend.

      **See:** CAC-UI-01, CAC-UI-04, IDN-02, IDN-05, ADM-UI-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:46Z'
    workflow: PW-15
  CAC-UI-03:
    id: CAC-UI-03
    title: Cache lifetime tiers by data class
    stage: F8
    priority: SHOULD
    status: DRAFT
    body: |-
      > Each key factory in `web/src/api/queryKeys.ts` SHALL declare one of three cache lifetime tiers defined in `web/src/api/cacheTiers.ts`. The `volatile` tier applies to `instance`, `task`, `timer` and `dlq` with `staleTime` 0 s and `gcTime` 30 s. The `session` tier applies to `definition`, `eventType`, `user` and `role` with `staleTime` 60 s and `gcTime` 5 min. The `reference` tier applies to `branding` and `health` with `staleTime` 15 min and `gcTime` 30 min. The tier SHALL be declared on the factory; a hook SHALL NOT override `staleTime` or `gcTime` at the call site.

      **Acceptance Criteria:**
      - GIVEN every exported factory in `web/src/api/queryKeys.ts`, WHEN the tier declaration is read, THEN each factory names exactly one of `volatile`, `session` or `reference`; an undeclared factory fails this pure static check with no HTTP.
      - GIVEN a hook passing `staleTime` or `gcTime` inline to `useQuery`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails reporting the file path and pattern name `inline-stale-time`; this is a pure static scan with no HTTP.
      - GIVEN a Playwright E2E opens the Instance List against the real backend, navigates to the Definition List and returns, WHEN the page network log is read, THEN the instance list was refetched on the second mount because its `staleTime` is 0 s.
      - GIVEN the same E2E returns to the Definition List within 60 s, WHEN the network log is read, THEN no definition list request was issued, because the `session` tier holds the data fresh.
      - GIVEN the branding key, WHEN the same E2E navigates across five routes inside 15 min, THEN exactly one branding request appears in the network log.
      - GIVEN the tier values in `cacheTiers.ts`, WHEN they are compared against the six numbers stated above, THEN each matches.

      **See:** CAC-UI-01, GRD-UI-02, IN-UI-05, DLQ-UI-01, WH-UI-04
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:47Z'
    workflow: PW-15
  CAC-UI-04:
    id: CAC-UI-04
    title: Version-pinned task payload fetch
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** PIN-01, carrying instance version pinning through to the client fetch.

      > A task payload read SHALL request the definition version recorded on the task row as `task.definition_version` through `GET /api/v1/definitions/{key}?version={n}`, and SHALL cache it under the key `['definition', tenantSlug, key, version]`. The currently active version SHALL NOT be substituted for a pinned version at any point. The SPA SHALL compare the `X-Definition-Version` response header against the requested version and, on a mismatch, SHALL discard the response and render `StaleVersionError` rather than open a form against the wrong schema.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E creates an instance from definition version 3 on the real backend and then publishes version 5 of the same definition key, WHEN the user opens the task from that instance, THEN the page network log shows a request carrying `version=3`; no HTTP mocking is used.
      - GIVEN that request resolves, WHEN `queryClient.getQueryCache().getAll()` is read in the page, THEN the cached key equals `['definition', <slug>, <key>, 3]` and no unversioned definition key is present.
      - GIVEN version 5 of the same definition is already cached from the Definition List, WHEN the task opens, THEN the version 5 entry does not satisfy the version 3 read and a separate request is issued.
      - GIVEN the task form renders, WHEN its fields are compared against the version 3 `form_schema` fetched directly from the real API, THEN the field set matches version 3 and not version 5.
      - GIVEN the backend returns `X-Definition-Version: 5` for a request that asked for version 3, WHEN the response is processed, THEN it is discarded and `StaleVersionError` renders per RND-UI-06.
      - GIVEN the pinned version has been purged and the API returns 404, WHEN the state is classified, THEN it is `fetch-failure` and `FetchError` renders with its Retry action.

      **See:** CAC-UI-01, RND-UI-06, RND-UI-03, PIN-01, PD-08, TK-UI-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:48Z'
    workflow: PW-15
  CMP-UI-01:
    id: CMP-UI-01
    title: Generated design token stylesheet
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > `design-tokens/r-co.tokens.json` SHALL be the only file in which a colour, type, spacing or radius value is authored, and `web/src/styles/tokens.css` SHALL be generated from it as `:root` custom properties. The generated key set SHALL equal the token set specified in `docs/guides/frontend_design_system.md` §2.1, §2.2, §3 and §4: `--color-neutral-0` through `--color-neutral-900`, `--color-brand-400` through `--color-brand-700`, the light, base and dark triplets of `--color-success`, `--color-warning`, `--color-error` and `--color-info`, `--surface-page`, `--surface-card`, `--surface-sidebar`, `--surface-overlay`, `--text-primary`, `--text-secondary`, `--text-disabled`, `--text-inverse`, `--border-default`, `--border-focus`, `--border-error`, `--interactive-primary`, `--interactive-primary-hover`, `--interactive-danger`, `--interactive-danger-hover`, `--font-sans`, `--font-mono`, `--text-xs` through `--text-3xl`, `--font-normal` through `--font-bold`, `--space-1` through `--space-16`, `--radius-sm`, `--radius-md`, `--radius-lg`, `--radius-full`, `--sidebar-width`, `--content-max-width` and `--panel-width`.

      **Acceptance Criteria:**
      - GIVEN the committed `web/src/styles/tokens.css`, WHEN the generator is run against `design-tokens/r-co.tokens.json` and the output is compared byte for byte, THEN the files are identical; drift fails `npm run build`. This is a pure static check with no HTTP.
      - GIVEN the token key set parsed from `tokens.css`, WHEN it is compared against the key set enumerated above, THEN the two sets are equal, and a key present in one and absent from the other fails the parity check with the key name.
      - GIVEN `--surface-card`, `--text-primary` and `--interactive-primary` in the generated file, WHEN each is resolved, THEN it resolves through a `var()` reference to a base palette token and holds no literal value of its own.
      - GIVEN a Playwright E2E loads the Instance List against the real backend, WHEN `getComputedStyle(document.documentElement)` is read, THEN every key in the enumerated set resolves to a non-empty value.
      - The generator is invoked by the `build` script, so a hand-edit of `tokens.css` without a matching edit to the JSON cannot reach `main`.

      **See:** CMP-UI-02, CMP-UI-03, CMP-UI-04, GRD-UI-01, GRD-UI-02
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:49Z'
    workflow: PW-14
  CMP-UI-02:
    id: CMP-UI-02
    title: No literal colour values in component code
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > No file under `web/src/` other than `web/src/styles/tokens.css` SHALL contain a literal colour value. The forbidden forms are a six-digit or three-digit hex literal, an `rgb(` or `rgba(` call, and an `hsl(` or `hsla(` call. Component code SHALL reference colour through `var(--color-*)`, `var(--surface-*)`, `var(--text-*)`, `var(--border-*)` or `var(--interactive-*)`. The rule SHALL be enforced by the GRD-UI-01 forbidlist pattern `literal-colour` in both the source scan and the post-build bundle scan.

      **Acceptance Criteria:**
      - GIVEN a `.ts`, `.tsx` or `.css` file under `web/src/` outside `web/src/styles/tokens.css` containing `#339af0`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails reporting the file path, the line number and pattern name `literal-colour`; this is a pure static scan with no HTTP.
      - GIVEN `web/src/styles/tokens.css`, WHEN the same scan runs, THEN the file is skipped because it is the sole entry in the pattern's `allowedPaths`.
      - GIVEN a dependency injects an inline `rgba(` style into a shipped chunk, WHEN the GRD-UI-03 bundle scan runs over `web/dist/assets/*.js`, THEN the scan fails naming the chunk and pattern name `literal-colour`; this is a pure post-build scan with no HTTP.
      - GIVEN the fixture `web/tests/guards/fixtures/offender/literal-colour.txt`, WHEN the GRD-UI-04 META control runs, THEN the pattern matches it; and GIVEN `web/tests/guards/fixtures/bystander/literal-colour.txt` holding `var(--color-brand-600)` and the string `#hash-anchor`, WHEN the control runs, THEN the pattern does not match it.
      - GIVEN a Playwright E2E loads the Definition List against the real backend, WHEN the computed background of a `StatusBadge` with `status="ACTIVE"` is read, THEN it equals the resolved value of `--color-success-light`.

      **See:** CMP-UI-01, CMP-UI-03, GRD-UI-01, GRD-UI-02, GRD-UI-03, GRD-UI-04
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:50Z'
    workflow: PW-14
  CMP-UI-03:
    id: CMP-UI-03
    title: Shared UI component library
    stage: F8
    priority: SHOULD
    status: DRAFT
    body: |-
      > `web/src/components/ui/` SHALL contain `Button`, `DataTable`, `ConfirmDialog`, `Toast`, `JsonEditor`, `StatusBadge`, `PageLayout`, `FilterBar` and `PaginationControls`, each with the prop names and enum values specified in `docs/guides/frontend_design_system.md` §5.4 and §7.1 through §7.6. `StatusBadge` SHALL cover every status in the §5.1, §5.2 and §5.3 tables across the domains `definition`, `instance`, `task`, `timer` and `dlq`. Canvas node geometry SHALL follow the §6.1 dimensions and the §6.2 runtime states. Every destructive action - cancel instance, delete definition, revoke token, discard DLQ item - SHALL route through `ConfirmDialog` with `confirmVariant="danger"`; `window.confirm` and `window.alert` SHALL NOT appear in `web/src/`.

      **Acceptance Criteria:**
      - GIVEN the exported prop types of the nine components, WHEN they are compared against the §5.4 and §7.1 to §7.6 signatures, THEN every prop name and every enum member matches character for character; a renamed or dropped prop fails the pure static signature check.
      - GIVEN a call to `window.confirm` or `window.alert` anywhere under `web/src/`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails with pattern name `native-confirm` and the file path; this is a pure static scan with no HTTP.
      - GIVEN a Playwright E2E opens a running instance on the real backend and presses Cancel Instance, WHEN the frame is inspected, THEN `ConfirmDialog` is mounted with a danger-variant confirm control and the cancel request has not yet been issued in the page network log.
      - GIVEN that E2E dismisses the dialog, WHEN the network log is read, THEN no cancel request was issued and the instance remains `ACTIVE` when re-read from the real API.
      - GIVEN a Playwright E2E renders one `StatusBadge` per status in the §5.1 to §5.3 tables, WHEN each computed background, text colour and dot colour is read, THEN each equals the token named for that row.
      - GIVEN a canvas node of each type in §6.1, WHEN its bounding box is measured in a Playwright E2E of the Process Designer against a real definition, THEN width and minimum height equal the values in that table.

      **See:** CMP-UI-01, CMP-UI-02, RND-UI-02, IN-UI-05, DLQ-UI-01, TK-UI-01, PD-UI-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:52Z'
    workflow: PW-14
  CMP-UI-04:
    id: CMP-UI-04
    title: Tenant brand override at bootstrap
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** ONB-UI-01, giving a provisioned tenant a visual identity in the SPA.

      > The SPA bootstrap SHALL call `GET /api/v1/tenants/{slug}/branding` before the first React render with a budget of 400 ms, and SHALL write the returned values onto `document.documentElement.style` as `--color-brand-400`, `--color-brand-500`, `--color-brand-600` and `--color-brand-700`. Those four are the complete set of tenant-writable tokens; a response key outside the set SHALL be dropped and counted in `brandOverride.rejected`. Semantic tokens `--color-success`, `--color-warning`, `--color-error` and `--color-info`, every neutral, every type token and every spacing token SHALL be identical across all tenants so status colour carries the same meaning everywhere. A timeout SHALL leave the default brand palette and SHALL NOT delay the first render past the budget.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E signs in to SwiftRoute against the real backend where a branding row is seeded, WHEN the first contentful paint is captured, THEN the computed background of a `Button variant="primary"` already equals the tenant `brand600` value and no later repaint changes it.
      - GIVEN the same E2E switches to Vortex whose branding row differs, WHEN the primary button background is read again, THEN it equals the Vortex `brand600` value while the computed value of `--color-error` is unchanged between the two tenants.
      - GIVEN the real branding endpoint returns a payload carrying `neutral900` alongside the four brand keys, WHEN the bootstrap applies it, THEN `--color-neutral-900` is unchanged, `brandOverride.rejected` equals 1, and the rejected key is recorded in the platform audit log rather than in a user-facing toast.
      - GIVEN the branding endpoint returns a non-hex string for `brand500`, WHEN the bootstrap applies the response, THEN `--color-brand-500` keeps its default value, the other three overrides are applied, and `brandOverride.rejected` equals 1.
      - GIVEN the branding request exceeds 400 ms against the real backend, WHEN the render proceeds, THEN the default brand palette is in effect and the app renders without waiting further.
      - GIVEN a tenant brand value that fails a 4.5:1 contrast ratio against `--surface-card`, WHEN it is submitted, THEN it is rejected at bootstrap and the GRD-UI-06 `color-contrast` rule reports no `serious` violation on the resulting page.

      **See:** CMP-UI-01, ONB-UI-01, ADM-UI-01, GRD-UI-06, IDN-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:53Z'
    workflow: PW-14
  CMP-UI-05:
    id: CMP-UI-05
    title: Field registry extension point
    stage: F8
    priority: SHOULD
    status: DRAFT
    body: |-
      > `web/src/components/forms/FieldRegistry.ts` SHALL expose `registerField(typeKey, component)` and `resolveField(typeKey)`, where `typeKey` is the JSON Schema `type` and `format` pair, for example `string:date` or `string:iban`. `FieldFactory.tsx` SHALL resolve every field through `resolveField`, and its existing switch SHALL survive only as the seed that registers the seven built-in mappings specified in `docs/guides/frontend_design_system.md` §7.6. A second registration of the same `typeKey` SHALL throw `DuplicateFieldTypeError` at module load. An unregistered `typeKey` SHALL render `<UnsupportedFieldNotice>` naming the key rather than throwing. Adding a field type SHALL be one `registerField` call and SHALL change no file under `web/src/pages/`.

      **Acceptance Criteria:**
      - GIVEN the seven §7.6 mappings, WHEN the registry module loads, THEN `resolveField` returns a component for each of `string:text`, `string:date`, `string:date-time`, `string:enum`, `number`, `boolean` and `string:long-text`; this is a pure static module check with no HTTP.
      - GIVEN a commit that adds a new field type, WHEN the diff is scanned, THEN it touches `FieldRegistry` registrations and a new component file and touches no file under `web/src/pages/`; a changed page file fails the check.
      - GIVEN `registerField` is called twice with `string:iban`, WHEN the module loads, THEN `DuplicateFieldTypeError` is thrown before the first render and the error names the duplicated key.
      - GIVEN a Playwright E2E opens a human task on the real backend whose `form_schema` carries a property with an unregistered `typeKey`, WHEN the form renders, THEN `UnsupportedFieldNotice` is shown naming that key and the remaining fields stay submittable; the task is completed through the real API in the same test.
      - GIVEN a field type registered after bootstrap, WHEN a Playwright E2E opens a task whose schema uses it, THEN the registered component renders and carries the full GRD-UI-07 ARIA attribute set without a per-screen edit.

      **See:** CMP-UI-06, CMP-UI-03, GRD-UI-07, TK-UI-01, PD-UI-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:54Z'
    workflow: PW-14
  CMP-UI-06:
    id: CMP-UI-06
    title: Generic interpreter architecture rule
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > `docs/guides/frontend_design_system.md` §10 SHALL record the architecture rule verbatim: "The SPA is a generic interpreter of server-delivered definitions; it contains no hand-coded screen for any tenant entity." The same section SHALL record the directory contract: `web/src/components/renderers/` holds rendering logic, `web/src/pages/` holds thin route shells, and `web/src/components/canvas/` is definition-authoring only. No file under `web/src/` SHALL contain a tenant slug literal or a branch on tenant identity, which the GRD-UI-01 forbidlist pattern `tenant-slug-in-source` SHALL enforce.

      **Acceptance Criteria:**
      - GIVEN `docs/guides/frontend_design_system.md`, WHEN §10 is read, THEN it contains the rule sentence above verbatim and the three-directory contract; a pure static documentation check fails on absence.
      - GIVEN a file under `web/src/` containing the literal `swiftroute`, `vortex` or `meridian`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails reporting the file path and pattern name `tenant-slug-in-source`; this is a pure static scan with no HTTP.
      - GIVEN a file under `web/src/pages/` calling `fetch` or `axios` directly, WHEN the source scan runs, THEN the scan fails with pattern name `raw-fetch-outside-client`, since a route shell reads through `web/src/api/client.ts` alone.
      - GIVEN the fixture `web/tests/guards/fixtures/bystander/tenant-slug-in-source.txt` containing the word `vortexes` inside a comment about vector maths, WHEN the GRD-UI-04 META control runs, THEN the pattern does not match it.
      - GIVEN a Playwright E2E signs in as SwiftRoute and then as Vortex against the real backend, WHEN the same route is rendered for both, THEN the component tree is identical and the difference between the two screens comes from server-delivered schema and definition payloads alone.

      **See:** CMP-UI-05, CMP-UI-04, GRD-UI-01, GRD-UI-02, PD-UI-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:55Z'
    workflow: PW-14
  DDL-01:
    id: DDL-01
    title: Pure platform DDL validator
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** MIG-01, adding a pre-flight gate ahead of the tenant fanout.

      > The platform SHALL validate every migration statement through `ValidatePlatformDDL`, a pure function over parsed statement descriptors that holds no database handle, opens no connection, reads no clock, and reads no environment variable. It SHALL reject the statement classes that hold `ACCESS EXCLUSIVE` for a duration proportional to table size -- `DROP COLUMN`, `CLUSTER`, `VACUUM FULL`, `REINDEX` without `CONCURRENTLY`, and `ALTER COLUMN ... SET DATA TYPE` -- and index statements written without `CONCURRENTLY`. Validation SHALL complete before the fanout of MIG-01 opens a connection to any tenant schema, so a rejected file set touches zero schemas.

      **Acceptance Criteria:**
      - GIVEN a file set containing `ALTER TABLE events DROP COLUMN legacy_flag`, WHEN the migration plan runs, THEN `ValidatePlatformDDL` returns `UnboundedExclusiveLock` naming that statement, the plan exits with status 2, and zero connections are opened to any tenant schema.
      - GIVEN a file set containing `CREATE INDEX idx_events_actor ON events (actor_id)` without `CONCURRENTLY`, WHEN validated, THEN `NonConcurrentIndexBuild` is returned and the file set is REJECTED.
      - GIVEN a file set containing `ALTER TABLE events ALTER COLUMN payload SET DATA TYPE JSONB`, WHEN validated, THEN `UnboundedExclusiveLock` is returned; the accepted route for a type change is the three phases of DDL-03 followed by a rename swap.
      - GIVEN one descriptor list, WHEN `ValidatePlatformDDL` is called from a unit test with no database reachable and no `BPM_DB_URL` set, THEN the call succeeds and returns the same verdict as the in-process call made during a real migration plan.
      - GIVEN a file set of 200 accepted statements, WHEN validated, THEN the verdict is returned in under 100 ms.
      - The verdict and the offending statement text are written to `plat_migration_plan`, and `EXECUTION_MIGRATION_VALIDATED` is appended to the event log.

      **See:** MIG-01 (the tenant fanout this gates), DDL-02 (ordering check run in the same pass), DDL-03 (the accepted rewrite), DDL-05 (namespace check run in the same pass), ADP-12 (regression suite exercising the validator against the default tenant)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T11:18:11Z'
    workflow: PW-05
    implemented_in:
    - src/platform/ddl_validate.zig
    test_spec: tests/specs/DDL-01.md
    test_run: tests/reports/report-20260811-WF02-batch-1.yaml
    released_at: '2026-08-11T11:18:11Z'
  DDL-02:
    id: DDL-02
    title: Expand-then-constrain ordering check
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** DDL-01, adding a cross-statement ordering check to the same validation pass.

      > `ValidatePlatformDDL` SHALL walk each migration file set in declaration order and reject any file set that constrains a column before that column exists and has been backfilled. A `SET NOT NULL`, an `ADD CONSTRAINT` written without `NOT VALID`, or an `ADD COLUMN ... NOT NULL` without a constant default appearing ahead of its expand and backfill statements SHALL be rejected with `ConstrainBeforeExpand`, naming both the constraining statement and the statement it depends on.

      **Acceptance Criteria:**
      - GIVEN a file set running `ALTER TABLE instances ADD COLUMN first_event_at TIMESTAMPTZ NOT NULL`, WHEN validated, THEN `ConstrainBeforeExpand` is returned, because the column carries no constant default and no backfill precedes the constraint.
      - GIVEN a file set running `ALTER TABLE instances ADD COLUMN first_event_at TIMESTAMPTZ NULL` followed immediately by `ALTER TABLE instances ALTER COLUMN first_event_at SET NOT NULL` with no backfill statement between them, WHEN validated, THEN `ConstrainBeforeExpand` is returned naming both statements.
      - GIVEN a file set that adds the column nullable, adds `CHECK (first_event_at IS NOT NULL) NOT VALID`, backfills, then runs `VALIDATE CONSTRAINT`, WHEN validated, THEN the verdict is ACCEPT.
      - GIVEN an `ADD CONSTRAINT ... FOREIGN KEY` written without `NOT VALID`, WHEN validated, THEN `ConstrainBeforeExpand` is returned; a foreign key added without `NOT VALID` scans the whole table under a lock that blocks writes on both referencing and referenced tables.
      - The rejection message names the file and the byte offset of both the constraining statement and the statement it depends on.

      **See:** DDL-01 (the validator this extends), DDL-03 (the three-phase form that satisfies this rule), DDL-04 (the backfill that must sit between expand and constrain)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T14:00:40Z'
    workflow: PW-05
    implemented_in:
    - src/platform/ddl_validate.zig
    test_spec: tests/specs/DDL-02.md
    test_run: tests/reports/report-20260811-WF02-batch-2.yaml
    released_at: '2026-08-11T14:00:40Z'
  DDL-03:
    id: DDL-03
    title: Phased DDL generation
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > **Extends:** DDL-02, turning the ordering rule into generated output.

      > The platform SHOULD compile every column addition carrying a constraint into exactly three phases: an expand phase issuing `ALTER TABLE t ADD COLUMN c <type> NULL` together with `ALTER TABLE t ADD CONSTRAINT c_nn CHECK (c IS NOT NULL) NOT VALID`; a backfill phase (DDL-04); and a constrain phase issuing `ALTER TABLE t VALIDATE CONSTRAINT c_nn` followed by `ALTER TABLE t ALTER COLUMN c SET NOT NULL`. A change that cannot be expressed in three phases SHALL be rejected with `PhaseGenerationFailed` rather than emitting a statement that takes a wider lock.

      **Acceptance Criteria:**
      - GIVEN a declared column addition with a NOT NULL constraint, WHEN the generator runs, THEN it emits exactly three phase groups and the emitted phase 3 references the constraint name created in phase 1.
      - GIVEN phase 3 executes, WHEN `VALIDATE CONSTRAINT` runs, THEN it holds `SHARE UPDATE EXCLUSIVE` and not `ACCESS EXCLUSIVE`, so concurrent reads and writes on the table continue.
      - GIVEN `ALTER COLUMN c SET NOT NULL` runs after a validated `CHECK (c IS NOT NULL)`, WHEN it executes, THEN PostgreSQL derives the guarantee from the validated constraint and performs no full table scan.
      - GIVEN a requested change the generator cannot express in three phases, WHEN generation runs, THEN `PhaseGenerationFailed` is returned and no statement is executed against any tenant schema.
      - GIVEN `VALIDATE CONSTRAINT` finds a violating row, WHEN phase 3 runs, THEN it is rolled back with `BackfillIncomplete`, phase 2 re-runs for that tenant, and phase 3 is retried.
      - Every phase statement runs with `lock_timeout = 3s` and `statement_timeout = 60s`; a tenant exceeding either is recorded FAILED at that phase and the fanout continues to the next tenant.

      **See:** DDL-01, DDL-02, DDL-04 (phase 2), MIG-01 (the tenant fanout executing each phase)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:58Z'
    workflow: PW-05
  DDL-04:
    id: DDL-04
    title: Idempotent batched backfill
    stage: '16'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** DDL-03, specifying the backfill phase.

      > The backfill phase SHALL be idempotent and batched. The generated statement is `UPDATE t SET c = <expr> WHERE c IS NULL AND ctid = ANY (ARRAY(SELECT ctid FROM t WHERE c IS NULL LIMIT $1))`, executed in a loop with one transaction per batch until an iteration reports zero updated rows. The loop SHALL NOT run inside an outer transaction. `backfill_batch_size` defaults to 5000 rows with an upper bound of 50000. A generated backfill whose predicate is not bounded by `IS NULL` SHALL be rejected with `NonIdempotentBackfill`.

      **Acceptance Criteria:**
      - GIVEN a backfill is interrupted after 40 of 100 batches and the migration runner restarts, WHEN the migration is re-run, THEN it resumes against the same `c IS NULL` predicate, rows already backfilled are skipped, and the end state is identical to an uninterrupted run.
      - GIVEN a generated backfill whose predicate is not bounded by `IS NULL`, WHEN validated, THEN `NonIdempotentBackfill` is returned and no statement is executed.
      - GIVEN a backfill batch, WHEN it executes, THEN it holds `ROW EXCLUSIVE` on the table and commits before the next batch begins; no transaction spans two batches.
      - GIVEN a batch exceeds 5 s, WHEN the next batch is planned, THEN `backfill_batch_size` is halved for that tenant with a floor of 500 rows.
      - GIVEN ten consecutive iterations report no progress, WHEN the loop detects the stall, THEN it stops and escalates with the remaining `IS NULL` row count for each tenant.
      - Rows updated per batch and remaining `IS NULL` rows per tenant are recorded in `plat_migration_state`.

      **See:** DDL-03 (the three phases), DDL-02 (why the backfill must precede the constraint), MIG-01, DB-02 (one pooled connection per batch, released between batches)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:09:59Z'
    workflow: PW-05
  DDL-05:
    id: DDL-05
    title: Reserved plat_ object namespace
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** SPT-01, reserving an object namespace inside every tenant schema.

      > The prefix `plat_` SHALL be reserved for platform-owned objects in every tenant schema. Tenant-authored DDL that creates, renames, or alters an object whose name begins with `plat_` SHALL be refused with HTTP 422 before any statement is executed. Every object the platform itself creates inside a tenant schema SHALL carry the prefix, so ownership is decidable from the name alone without a catalog lookup. The check runs inside `ValidatePlatformDDL` in the same pass as the lock-class and ordering checks.

      **Acceptance Criteria:**
      - GIVEN a tenant submits DDL creating a table named `plat_outbox`, WHEN validated, THEN `ReservedNamespace` is returned, the API responds 422 with the offending object name in the body, and no statement is executed.
      - GIVEN a tenant submits `ALTER TABLE plat_correlation_cursor RENAME TO cursor_backup`, WHEN validated, THEN `ReservedNamespace` is returned and the API responds 422.
      - GIVEN a platform migration creates an object in a tenant schema without the `plat_` prefix, WHEN validated, THEN `UnreservedPlatformObject` is returned and the file set is REJECTED.
      - GIVEN a tenant creates a table named `platform_orders`, WHEN validated, THEN the verdict is ACCEPT; the reservation matches the exact prefix `plat_` and does not match a longer word sharing its first four characters.
      - GIVEN a file set failing the namespace check and the lock-class check, WHEN validated, THEN the first failure in statement order is reported, so one plan run yields one deterministic verdict.

      **See:** DDL-01 (the validating pass), SPT-01 (the schema-per-tenant layout this reservation partitions), MIG-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T07:15:35Z'
    workflow: PW-05
    implemented_in:
    - src/platform/ddl_namespace.zig
    test_spec: tests/specs/DDL-05.md
    test_run: tests/reports/report-20260811-WF02-batch-0.yaml
    released_at: '2026-08-11T07:15:35Z'
  FIL-01:
    id: FIL-01
    title: Human task attachment upload
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** API-10, adding a document-bearing sub-resource to the human task surface.

      > The platform SHALL accept a file attachment against an open human task through `POST /api/v1/tasks/{task_id}/attachments` as a single multipart part. The caller MUST hold `attachment.write` on the task. The platform generates `attachment_id` as a UUID, computes the SHA-256 of the payload, stores `filename` verbatim, and returns `201 Created` with `{attachment_id, filename, size_bytes, sha256, content_type}`. `filename` is a display value only and is never used to construct the storage object key. `content_type` MUST be one of `application/pdf`, `image/jpeg`, `image/png`, `text/csv`.

      **Acceptance Criteria:**
      - GIVEN a caller without `attachment.write` on the task, WHEN it posts an attachment, THEN the platform returns HTTP 403 `attachment_write_forbidden`, writes no `attachments` row, and stores no object.
      - GIVEN a multipart part with `content_type` outside the allowlist, WHEN it is posted, THEN the platform returns HTTP 415 `content_type_not_allowed` and names the received type in the response body.
      - GIVEN a successful upload, WHEN the response is read, THEN it carries a server-generated `attachment_id` and the computed `sha256`, and it carries no storage object key, bucket name, or storage URL.
      - GIVEN a `filename` containing `../` or an absolute path prefix, WHEN the attachment is stored, THEN the string is persisted verbatim in the `attachments.filename` column and the object key is built solely from `tenant_slug`, `attachment_id`, and `sha256`.
      - GIVEN `task_id` names a task in another tenant, WHEN an attachment is posted, THEN the platform returns HTTP 404 and creates no row.
      - `GET /api/v1/tasks/{task_id}/attachments` lists `attachment_id`, `filename`, `size_bytes`, `content_type`, and `state` for attachments in state `active`.

      **See:** API-10, IDN-05, TNT-01, FIL-02, FIL-03, FIL-04, FIL-05, FIL-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:01Z'
    workflow: PW-09
  FIL-02:
    id: FIL-02
    title: Tenant-prefixed storage object keys
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** TNT-01, pushing tenant isolation down into the object storage client.

      > Every attachment object SHALL be stored under the key `<tenant_slug>/<attachment_id>/<sha256>`. The storage client SHALL compare the key prefix against the tenant slug of the authenticated session on every call it makes, and SHALL raise `CrossTenantObjectKey` when the prefix does not match. No caller-supplied value reaches the key: `tenant_slug` is derived from the session, `attachment_id` is server-generated, and `sha256` is computed from the payload bytes. The isolation check lives in the storage client, not in the route handler, so every call path is covered by one check.

      **Acceptance Criteria:**
      - GIVEN a session bound to tenant `swiftroute`, WHEN the storage client is called with a key whose first path segment is `vortex`, THEN it raises `CrossTenantObjectKey`, issues no request to the object store, and the caller receives HTTP 500.
      - GIVEN an upload, WHEN the object key is assembled, THEN it equals `<tenant_slug>/<attachment_id>/<sha256>` with `tenant_slug` taken from the session claim and never from the request path, body, query string, or header.
      - GIVEN two tenants upload byte-identical files, WHEN both objects are stored, THEN the keys differ in their first path segment and neither read path can reach the other object.
      - GIVEN any code path that reads, writes, or deletes an attachment object, WHEN it calls the storage client, THEN the prefix check executes; no path bypasses the client to address the object store directly.
      - `CrossTenantObjectKey` is recorded to the event log with the session tenant and the offending key prefix.

      **See:** TNT-01, XC-05, FIL-01, FIL-05, FIL-06, FIL-08
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:02Z'
    workflow: PW-09
  FIL-03:
    id: FIL-03
    title: Transactional attachment quota accounting
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** FIL-01, binding storage accounting to the upload write.

      > The `attachments` row insert, the `tenant_storage_usage.bytes_used` increment, and the `outbox` row carrying `AttachmentUploaded` SHALL be written in one database transaction. The platform SHALL reject an upload that would drive `bytes_used + size_bytes` above `tenant_storage_usage.bytes_quota` with HTTP 507 `tenant_quota_exhausted`, rolling back all three writes together. A quota breach therefore leaves no attachment row, no counter movement, and no outbox event.

      **Acceptance Criteria:**
      - GIVEN a tenant with `bytes_quota` of 1 GiB and `bytes_used` of 1020 MiB, WHEN a 10 MiB upload commits, THEN `bytes_used` reads 1030 MiB and exactly one `outbox` row carrying `AttachmentUploaded` exists for that `attachment_id`.
      - GIVEN the same tenant at `bytes_used` of 1020 MiB, WHEN a 30 MiB upload is attempted, THEN the platform returns HTTP 507 `tenant_quota_exhausted`, `bytes_used` still reads 1020 MiB, and no `attachments` row exists for the generated `attachment_id`.
      - GIVEN the transaction fails after the `attachments` insert, WHEN the failure is observed, THEN the counter increment and the outbox row are absent, and the orphaned storage object is collected by FIL-08.
      - GIVEN two uploads for one tenant commit concurrently, WHEN both succeed, THEN `bytes_used` reflects both sizes; the counter row is updated under a row lock taken in the same transaction.
      - GIVEN a successful sweep B purge (FIL-07), WHEN the purge transaction commits, THEN `bytes_used` is decremented by that attachment's `size_bytes` in the same transaction that sets state `purged`.
      - The response body of HTTP 507 carries `bytes_used`, `bytes_quota`, and the rejected `size_bytes`.

      **See:** FIL-01, FIL-04, FIL-07, FIL-08, TNT-01, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:03Z'
    workflow: PW-09
  FIL-04:
    id: FIL-04
    title: Per-tier single-upload size cap
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** FIL-01, bounding a single upload before storage is contacted.

      > A single upload SHALL be capped by the tenant's subscription tier: 10 MiB for `free`, 50 MiB for `standard`, 250 MiB for `enterprise`. The cap SHALL be enforced against the streamed part as it is read, and the platform SHALL abort with HTTP 413 `upload_exceeds_tier_cap` at the moment the byte count crosses the cap, before the object store is contacted and before any transaction is opened. The single-upload cap is independent of the tenant quota of FIL-03; a part under the cap can still be refused with HTTP 507.

      **Acceptance Criteria:**
      - GIVEN a `free`-tier tenant, WHEN a 12 MiB part is uploaded, THEN the platform returns HTTP 413 `upload_exceeds_tier_cap` carrying the tier name and the cap in bytes, and no object is written to the store.
      - GIVEN a part whose declared `Content-Length` is under the cap but whose streamed body exceeds it, WHEN the byte count crosses the cap during the read, THEN the read is aborted at that byte and HTTP 413 is returned; the declared length is not trusted.
      - GIVEN an `enterprise`-tier tenant, WHEN a 200 MiB part is uploaded and quota allows it, THEN the upload commits and `size_bytes` reads 209715200.
      - GIVEN a tenant whose tier changes from `standard` to `free`, WHEN a 30 MiB upload is attempted after the change, THEN it is refused with HTTP 413; attachments stored under the prior tier stay readable.
      - The cap check runs before the FIL-03 transaction opens, so a refused upload consumes no quota and emits no outbox row.

      **See:** FIL-01, FIL-03, FIL-08, TNT-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:04Z'
    workflow: PW-09
  FIL-05:
    id: FIL-05
    title: Signed time-limited attachment download URL
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** FIL-01, adding a time-limited download grant that carries no session.

      > Attachment download SHALL be authorised by an HMAC-SHA256 signature over the payload `kid`, `exp`, `attachment_id`, `tenant_slug` joined by LF (`\n`) in exactly that order. `tenant_slug` SHALL be derived server-side from the authenticated session at signing time and re-derived from the session at verification time; a slug present in the URL, body, or a header is discarded. `kid` selects the signing key from the active key set. The platform issues `GET /api/v1/attachments/{attachment_id}/download?kid=<kid>&exp=<unix_seconds>&sig=<base64url>` with `exp = now + 300` seconds. Verification checks `exp` first and recomputes the signature second.

      **Acceptance Criteria:**
      - GIVEN a signed URL, WHEN the signature is recomputed at verification, THEN the payload is the four components joined by LF in the order `kid`, `exp`, `attachment_id`, `tenant_slug`; any reordering, omission, or alternate separator produces a different signature and HTTP 403 `signature_invalid`.
      - GIVEN a link whose `exp` is in the past, WHEN it is followed, THEN the platform returns HTTP 403 `signature_invalid` without recomputing the signature and without reading the object.
      - GIVEN a link with a modified `attachment_id` but the original `sig`, WHEN it is followed, THEN the platform returns HTTP 403 `signature_invalid` and streams no bytes.
      - GIVEN a caller that appends `tenant_slug=vortex` to a link signed for `swiftroute`, WHEN the link is followed, THEN the query parameter is discarded, the slug is taken from the session, the signature verifies against `swiftroute`, and the vortex value has no effect on the outcome.
      - GIVEN a signing key retired at time T, WHEN a link bearing that `kid` is followed before T plus 300 seconds, THEN it verifies; after T plus 300 seconds it returns HTTP 403 `signature_invalid`.
      - Signed URLs are issued with a 300-second lifetime and carry no session cookie or bearer token.

      **See:** FIL-01, FIL-02, FIL-06, IDN-05, XC-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:05Z'
    workflow: PW-09
  FIL-06:
    id: FIL-06
    title: Probe-safe cross-tenant attachment reads
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** FIL-05, closing the existence oracle on the attachment read path.

      > A request for an attachment that does not exist and a request for an attachment owned by another tenant SHALL both return HTTP 404 `attachment_not_found` with a byte-identical response body and an identical header set. The attachment read path SHALL NOT return HTTP 403 for a cross-tenant reference at any endpoint, so no response code, body, header, or latency difference can be used to establish that an `attachment_id` exists in another tenant.

      **Acceptance Criteria:**
      - GIVEN a `swiftroute` session and an `attachment_id` that exists in `vortex`, WHEN metadata is requested, THEN the platform returns HTTP 404 `attachment_not_found`.
      - GIVEN the same session and a UUID that exists in no tenant, WHEN metadata is requested, THEN the response body and headers are byte-identical to the cross-tenant case above.
      - GIVEN a cross-tenant `attachment_id`, WHEN a download link is requested, THEN the platform returns HTTP 404 and issues no signed URL, so the signing path leaks no existence signal either.
      - GIVEN a cross-tenant reference, WHEN the tenant scope filter is applied, THEN it is applied in the same query that loads the row, so a found-then-rejected code path that would differ in latency does not exist.
      - Every cross-tenant attachment reference appends an audit entry naming the session tenant, the requested `attachment_id`, and the owning tenant, even though the response carries no such detail.

      **See:** FIL-05, FIL-02, TNT-01, XC-05, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:06Z'
    workflow: PW-09
  FIL-07:
    id: FIL-07
    title: Attachment delete grace period and reaper sweeps
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** FIL-01, giving deletion a grace period and a staged reaper.

      > Attachment deletion SHALL be a request, not an immediate removal. `DELETE /api/v1/attachments/{attachment_id}` sets `delete_requested_at` and leaves `state = 'active'`; the attachment stays readable and stays counted against quota for a 30-day grace period. A scheduled reaper SHALL then run three sweeps in the fixed order A, B, C on every tick: sweep A marks `active` rows past the grace period as `pending_delete`; sweep B deletes the storage object and then commits `state = 'purged'`, `purged_at = now()` together with the `bytes_used` decrement; sweep C deletes `purged` rows older than 7 days from the projection.

      **Acceptance Criteria:**
      - GIVEN a delete request at time T, WHEN the attachment is read at T plus 29 days, THEN it is still downloadable and `bytes_used` still includes its `size_bytes`.
      - GIVEN `delete_requested_at` at T, WHEN sweep A runs after T plus 30 days, THEN `UPDATE attachments SET state='pending_delete' WHERE state='active' AND delete_requested_at <= now() - interval '30 days'` moves the row and a download attempt then returns HTTP 404 `attachment_not_found`.
      - GIVEN a `pending_delete` row, WHEN sweep B completes, THEN the storage object is absent, `state` reads `purged`, `purged_at` is set, and `bytes_used` has been decremented by `size_bytes` in the same transaction as the state change.
      - GIVEN a `purged` row with `purged_at` older than 7 days, WHEN sweep C runs, THEN the projection row is deleted and the `AttachmentPurged` entry remains in the event log.
      - GIVEN a tick in which sweep B fails for one attachment, WHEN sweeps continue, THEN sweep C still runs for unrelated rows and the failed attachment stays `pending_delete` for the next tick.
      - The reaper runs every 15 minutes and executes sweeps in the order A, B, C within one tick.

      **See:** FIL-01, FIL-03, FIL-08, ES-07, ADP-11
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:08Z'
    workflow: PW-09
  FIL-08:
    id: FIL-08
    title: Reaper ordering and predicate idempotency
    stage: '17'
    priority: SHOULD
    status: DRAFT
    body: |-
      > **Extends:** FIL-07, fixing the ordering and idempotency conventions the reaper depends on.

      > Every storage call SHALL be issued before the surrounding database transaction is opened, on the upload path and on the deletion path alike, so no database lock is held across a streaming transfer and a storage failure leaves no database write. Reaper idempotency SHALL come from a `WHERE expected_state` predicate on each sweep rather than from an advisory lock or a row lock held across the storage call. A re-run after a crash therefore matches zero rows for work already advanced. Storage objects with no `attachments` row and an age above 24 hours SHALL be collected as orphans by sweep B.

      **Acceptance Criteria:**
      - GIVEN an upload, WHEN execution is traced, THEN the object-store write completes before `BEGIN` is issued for the FIL-03 transaction; no transaction is open while payload bytes are transferred.
      - GIVEN sweep B, WHEN execution is traced, THEN the object-store DELETE completes before `BEGIN` is issued for the state-change transaction; a failed DELETE means no transaction is opened and the row stays `pending_delete`.
      - GIVEN sweep A is re-run immediately after a successful run, WHEN the statement executes, THEN `WHERE state='active' AND delete_requested_at <= now() - interval '30 days'` matches 0 rows and the sweep commits without effect.
      - GIVEN the reaper process is terminated between sweep B's storage delete and its commit, WHEN the next tick runs, THEN sweep B re-issues the storage DELETE, treats a missing object as success, and commits the state change and the counter decrement.
      - GIVEN two reaper instances tick concurrently, WHEN both run sweep B for one row, THEN the `WHERE state='pending_delete'` predicate lets exactly one commit the state change and the other updates 0 rows; no advisory lock is taken.
      - GIVEN a storage object with no `attachments` row and an age above 24 hours, WHEN sweep B runs, THEN the object is deleted as an orphan.

      **See:** FIL-02, FIL-03, FIL-07, ADP-05, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:09Z'
    workflow: PW-09
  GRD-UI-01:
    id: GRD-UI-01
    title: Forbidlist as single guard source of truth
    stage: F8
    priority: MUST
    status: DRAFT
    body: |-
      > `web/tests/guards/forbidlist.ts` SHALL be the only file in the repository in which a banned frontend pattern is authored. It SHALL export `PATTERNS: GuardPattern[]` where `GuardPattern` is `{ name, regex, appliesTo: 'source' | 'bundle' | 'both', allowedPaths: string[], rationale }`, and `rationale` SHALL name the directive or requirement the pattern defends. The list SHALL be seeded with `msw-import`, `http-mock-adapter`, `raw-fetch-outside-client`, `literal-colour`, `native-confirm`, `tenant-slug-in-source`, `inline-query-key`, `inline-stale-time`, `missing-query-state-boundary` and `test-only-or-skip`. Both the source scan and the bundle scan SHALL import from this module and SHALL declare no regex of their own.

      **Acceptance Criteria:**
      - GIVEN `web/tests/guards/source-scan.spec.ts` and `web/tests/guards/bundle-scan.spec.ts`, WHEN each is parsed, THEN neither contains a regular expression literal and both import `PATTERNS` from `forbidlist.ts`; this is a pure static check with no HTTP.
      - GIVEN every entry in `PATTERNS`, WHEN the schema check runs, THEN each carries a non-empty `name`, `regex`, `appliesTo`, `allowedPaths` and `rationale`, and each `rationale` names a directive or a requirement ID.
      - GIVEN the ten seed pattern names above, WHEN `PATTERNS` is read, THEN each is present exactly once and no name is duplicated.
      - GIVEN the pattern `msw-import` whose `rationale` cites DIRECTIVE T-2, WHEN it is applied, THEN it matches an import of `msw`, `msw/node` or `setupServer`, since R-Co forbids MSW and every form of HTTP mocking outright.
      - GIVEN a regex declared in any file under `web/tests/guards/` other than `forbidlist.ts`, WHEN the single-source assertion runs, THEN it fails naming that file.

      **See:** GRD-UI-02, GRD-UI-03, GRD-UI-04, GRD-UI-05, CMP-UI-02
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:10Z'
    workflow: PW-16
  GRD-UI-02:
    id: GRD-UI-02
    title: Frontend source scan gate
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > `web/tests/guards/source-scan.spec.ts` SHALL apply every `PATTERNS` entry whose `appliesTo` is `source` or `both` to `web/src/**/*.{ts,tsx,css}`. A match on a path outside that pattern's `allowedPaths` SHALL fail the gate. `allowedPaths` SHALL be honoured exactly: `raw-fetch-outside-client` permits `web/src/api/client.ts` and `literal-colour` permits `web/src/styles/tokens.css`. The scan SHALL run with no network access and SHALL complete within 30 s. `npm run guards` SHALL be a required status check, so a merge SHALL NOT proceed on a scan failure.

      **Acceptance Criteria:**
      - GIVEN a file under `web/src/` matching any source-applicable pattern outside its `allowedPaths`, WHEN the scan runs, THEN the gate fails and reports the file path, the line number and the pattern name; this is a pure static scan with no HTTP.
      - GIVEN `web/src/api/client.ts` containing a direct `fetch` call, WHEN the scan runs, THEN `raw-fetch-outside-client` does not fire, because that path is the pattern's sole allowed entry.
      - GIVEN a component under `web/src/components/` containing a direct `axios` call, WHEN the scan runs, THEN the gate fails with pattern name `raw-fetch-outside-client` and that component's path.
      - GIVEN a clean tree, WHEN the scan runs on a machine with no network route, THEN it exits 0 within 30 s, since it reads files and matches regexes and issues no request.
      - GIVEN a scan failure, WHEN `npm run guards` reports its exit code, THEN it is non-zero and the required status check blocks the merge.

      **See:** GRD-UI-01, GRD-UI-03, GRD-UI-05, CMP-UI-02, CMP-UI-06, CAC-UI-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T18:11:08Z'
    workflow: PW-16
    released_at: '2026-08-13T18:11:08Z'
  GRD-UI-03:
    id: GRD-UI-03
    title: Post-build bundle scan gate
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > `web/tests/guards/bundle-scan.spec.ts` SHALL delete the build output with `rmSync('web/dist', { recursive: true, force: true })`, run a real `vite build`, and apply every `PATTERNS` entry whose `appliesTo` is `bundle` or `both` to `web/dist/assets/*.js`. The scan SHALL fail rather than pass when the build produces no assets, so an empty directory cannot yield a vacuous pass. The bundle scan exists because a banned module can enter the shipped artefact through a dependency without appearing in `web/src/`.

      **Acceptance Criteria:**
      - GIVEN a populated `web/dist/` from an earlier run, WHEN the scan starts, THEN the directory is deleted before `vite build` runs, so no stale chunk is scanned; this is a pure post-build scan with no HTTP.
      - GIVEN `vite build` produces no file under `web/dist/assets/`, WHEN the scan evaluates its input set, THEN the gate fails naming the empty output rather than reporting zero violations.
      - GIVEN a transitive dependency that bundles `msw` into a chunk while no file under `web/src/` imports it, WHEN the scan runs, THEN the source scan passes, the bundle scan fails naming the chunk file and pattern name `msw-import`, and the merge is blocked.
      - GIVEN a chunk containing an inline `rgba(` literal injected by a dependency, WHEN the scan runs, THEN the gate fails with pattern name `literal-colour` and the chunk file name.
      - GIVEN a clean build, WHEN the scan runs, THEN it exits 0 within a 180 s budget covering the `rmSync` and the `vite build`.

      **See:** GRD-UI-01, GRD-UI-02, GRD-UI-04, GRD-UI-05, CMP-UI-02
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T18:11:09Z'
    workflow: PW-16
    released_at: '2026-08-13T18:11:09Z'
  GRD-UI-04:
    id: GRD-UI-04
    title: Two-sided META control per guard pattern
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > Every entry in `PATTERNS` SHALL carry a two-sided META control in `web/tests/guards/meta-control.spec.ts`. The control SHALL assert that the pattern matches `web/tests/guards/fixtures/offender/<pattern>.txt`, a synthetic offender, and that it does not match `web/tests/guards/fixtures/bystander/<pattern>.txt`, an innocent bystander. A pattern added without both fixtures SHALL fail the gate. The META controls SHALL run before the source scan and the bundle scan, so a dead or over-broad guard is reported before its clean result is trusted.

      **Acceptance Criteria:**
      - GIVEN a pattern whose regex was edited so it no longer matches its offender fixture, WHEN the META control runs, THEN the gate fails naming the pattern as unmatched against its offender; this is a pure static check with no HTTP.
      - GIVEN a pattern whose regex was widened so it matches its bystander fixture, WHEN the control runs, THEN the gate fails naming the pattern as over-broad against its bystander.
      - GIVEN an entry added to `PATTERNS` with no offender file or no bystander file, WHEN the fixture completeness check runs, THEN the gate fails naming the pattern and the missing fixture path.
      - GIVEN the full guard suite, WHEN `npm run guards` executes, THEN the META controls complete within 5 s and run before the source scan and the bundle scan in that order.
      - GIVEN `web/tests/guards/fixtures/bystander/native-confirm.txt` containing the identifier `confirmVariant` and a comment about a confirmation dialog, WHEN the `native-confirm` control runs, THEN the pattern does not match it, since it targets `window.confirm` and `window.alert` alone.

      **See:** GRD-UI-01, GRD-UI-02, GRD-UI-03, GRD-UI-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T18:11:10Z'
    workflow: PW-16
    released_at: '2026-08-13T18:11:10Z'
  GRD-UI-05:
    id: GRD-UI-05
    title: Redacted guard violation reporting
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > A guard violation SHALL be reported as `{ file, line, patternName }` and SHALL NOT carry the matched substring or any surrounding source text, so a credential or token caught by a pattern is never printed to a CI log. The same redacted records SHALL be written to `tests/reports/report-<date>-<run_id>.yaml`. A redaction assertion SHALL run over the reporter output as part of the guard suite.

      **Acceptance Criteria:**
      - GIVEN a source file containing the string `sk-live-0123456789abcdef` that a pattern matches, WHEN the source scan reports the violation, THEN the report contains the file path, the line number and the pattern name and does not contain the matched string; this is a pure static check with no HTTP.
      - GIVEN any guard failure, WHEN the reporter output is inspected by the redaction assertion, THEN each record has exactly the keys `file`, `line` and `patternName` and no additional key.
      - GIVEN a reporter change that emits the matched content, WHEN the redaction assertion runs, THEN the gate fails before the run report is published.
      - GIVEN a completed guard run with violations, WHEN `tests/reports/report-<date>-<run_id>.yaml` is read, THEN it lists the same redacted records in YAML and carries no matched content.
      - GIVEN a completed guard run with no violations, WHEN the report is read, THEN the violation list is empty and the report still names every pattern that was evaluated.

      **See:** GRD-UI-02, GRD-UI-03, GRD-UI-04, ENV-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T18:11:11Z'
    workflow: PW-16
    released_at: '2026-08-13T18:11:11Z'
  GRD-UI-06:
    id: GRD-UI-06
    title: Accessibility gate per canonical surface
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > An accessibility gate SHALL run `@axe-core/playwright` against each canonical surface - Task Inbox, Instance List, Instance Detail, Definition List, Process Designer and Login - as one Playwright test per surface against the real backend. Any violation with impact `serious` or `critical` SHALL fail the gate, naming the rule ID, the impact and the target selector. Violations with impact `moderate` or `minor` SHALL be recorded in the run report at severity MINOR and SHALL NOT block. The `color-contrast` rule SHALL remain enabled, because the gate executes in a real Chromium page where pixel measurement is available.

      **Acceptance Criteria:**
      - GIVEN each of the six canonical surfaces loaded against the real backend with seeded data, WHEN axe runs on it in a Playwright test, THEN the gate fails on any `serious` or `critical` violation and the failure names the rule ID, the impact and the target selector; no HTTP mocking is used.
      - GIVEN the axe configuration for the gate, WHEN it is read, THEN `color-contrast` is not in the disabled rule set.
      - GIVEN a `moderate` violation on the Instance Detail surface, WHEN the gate completes, THEN it exits 0 and the violation is written to `tests/reports/report-<date>-<run_id>.yaml` at severity MINOR.
      - GIVEN Keycloak, PostgreSQL or the API is unreachable, WHEN the gate starts, THEN it returns FAIL with severity BLOCKER naming the unreachable services and runs no surface, rather than reporting a clean pass.
      - GIVEN a tenant brand override applied per CMP-UI-04, WHEN the gate runs on the Task Inbox, THEN `color-contrast` reports no `serious` violation for text drawn on `--surface-card`.
      - GIVEN all six surfaces, WHEN the gate runs, THEN each completes within a 30 s budget.

      **See:** GRD-UI-07, CMP-UI-01, CMP-UI-04, TK-UI-01, IN-UI-05, PD-UI-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T20:55:35Z'
    workflow: PW-16
    note: Released via WF02-pw13-pw16-batch19-20260813 (Batch 19). RELEASE-VALIDATOR APPROVED. Axe-core
      on-page runtime scan DEFERRED to WF-05 UAT by design (gate runtime-skips when @axe-core/playwright
      absent); gate module + reporter + config fully implemented and unit-tested.
    implemented_in:
    - web/tests/a11y/a11yGate.ts
    - web/tests/a11y/a11yConfig.ts
    - web/tests/a11y/reportWriter.ts
    - web/tests/a11y/axe-build-flag.ts
    - web/tests/e2e/a11y-gate.e2e.spec.ts
    - web/tests/unit/a11yGate.test.ts
    - web/tests/unit/a11yConfig.test.ts
    released_at: '2026-08-13T20:55:35Z'
  GRD-UI-07:
    id: GRD-UI-07
    title: Generated per-field ARIA wiring
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** CMP-UI-05, making ARIA wiring a property of the field registry rather than of each screen.

      > `FieldFactory` SHALL emit, for every field it generates, a `<label htmlFor>` bound to the input id, `aria-required` reflecting the JSON Schema `required` list, `aria-describedby` pointing at the field hint node, and `aria-invalid` with `aria-errormessage` pointing at the field error node whenever the field is in error. `DynamicFormRenderer` SHALL set `aria-busy` on the form element while a submit is in flight. Whenever `aria-invalid` is `true`, the node referenced by `aria-errormessage` SHALL exist in the DOM.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E opens a human task on the real backend whose `form_schema` has five properties, WHEN the form renders, THEN every generated field carries a `<label htmlFor>` matching its input id, `aria-required`, and `aria-describedby` resolving to an existing hint node; no HTTP mocking is used.
      - GIVEN a required field is submitted empty, WHEN validation fails in that E2E, THEN the field carries `aria-invalid="true"` and `aria-errormessage` pointing at a node that exists in the DOM and holds the error text.
      - GIVEN a field sets `aria-invalid="true"` with a dangling `aria-errormessage` reference, WHEN the ARIA assertion runs on the Task Inbox surface, THEN the gate fails naming the field key.
      - GIVEN the form is submitted against the real API, WHEN the request is in flight, THEN the form element carries `aria-busy="true"`, and when the response settles the attribute is removed.
      - GIVEN a field type registered per CMP-UI-05 after the built-in seed, WHEN a task using it renders, THEN it carries the full attribute set without an edit to any file under `web/src/pages/`.
      - GIVEN the Task Inbox with a rendered form, WHEN the GRD-UI-06 axe scan runs on it, THEN there is no `serious` or `critical` violation of the `label`, `aria-valid-attr-value` or `aria-required-attr` rules.

      **See:** GRD-UI-06, CMP-UI-05, CMP-UI-03, TK-UI-01
    body_source: backlog-migration-20260807
