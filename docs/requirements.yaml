  PAR-03:
    id: PAR-03
    title: Partition-scoped retention and archival
    stage: '16'
    priority: MUST
    status: TESTED
    body: |-
      > **Extends:** ADP-11, giving the deletion prohibition a physical retention mechanism.

      > Retention SHALL be partition-scoped. An `events` partition older than `archive_after_months` (default 13) SHALL be aged out by `ALTER TABLE events DETACH PARTITION events_YYYY_MM CONCURRENTLY` followed by `ALTER TABLE events_archive ATTACH PARTITION events_YYYY_MM FOR VALUES FROM ... TO ...`, a catalog operation that moves no rows. Hard deletion by `DROP TABLE` SHALL be confined to partitions of `events_ephemeral`, which holds only event types whose retention class is `delete`. No `DELETE` statement SHALL run against `events` or `events_archive` at any point.

      **Acceptance Criteria:**
      - GIVEN an event type in the set `{INSTANCE_*, TASK_*, GATEWAY_*, EXECUTION_*}`, WHEN retention class `delete` is configured for it, THEN configuration is rejected with `RetentionClassForbidden` and the type never routes to `events_ephemeral`.
      - GIVEN a 14-month-old `events` partition holding 40 million rows, WHEN it ages out, THEN the detach and attach complete without copying a row, and the rows remain readable through `events_archive`.
      - GIVEN an `events_ephemeral` partition older than `ephemeral_drop_after_months` (default 3), WHEN a drop is attempted, THEN the guard `SELECT count(*) FROM events_ephemeral_YYYY_MM WHERE split_part(event_type, '_', 1) IN ('INSTANCE', 'TASK', 'GATEWAY', 'EXECUTION')` must return 0 before `DROP TABLE` executes.
      - GIVEN that guard returns a non-zero count, WHEN the scheduler evaluates it, THEN `Adp11GuardTripped` is raised as a BLOCKER, the partition stays attached, and no drop occurs.
      - GIVEN a detach commits but the archive attach fails, WHEN the failure is recorded, THEN the partition exists standalone in state `ORPHAN_PARTITION`, remains queryable, and the attach is retried on the next maintenance run.
      - Detach and drop each append `EXECUTION_PARTITION_DETACHED` or `EXECUTION_PARTITION_DROPPED` to the event log.

      **See:** ADP-11 (the deletion prohibition this implements), ES-07 (the retention policy surface), IR-07 (archives remain queryable), PAR-01, PAR-06 (reconstruction spanning both parents)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T18:38:47Z'
    workflow: PW-06
    note: AC1-AC5 met; AC6 (EXECUTION_PARTITION_DETACHED / EXECUTION_PARTITION_DROPPED event emission)
      NOT MET -- zero call sites in src/, confirmed by grep. Tracked as ISS-0670 / GH-711 (OPEN, MAJOR),
      same umbrella issue as PAR-02 AC5. Held at TESTED, not RELEASED, until AC6 is implemented -- see
      docs/status/release-stage16-WF02-batch-3-20260811.yaml for RELEASE-VALIDATOR's full reasoning.
    implemented_in:
    - src/scheduler/partition_retention.zig
    - migrations/1149_par03_retention_class.sql
    test_spec: tests/specs/PAR-03.md
    test_run: tests/reports/report-20260811-WF02-batch-3.yaml
    tested_at: '2026-08-11T18:24:52Z'
  PAR-04:
    id: PAR-04
    title: Partition constraints declared before attach
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > Every partition SHALL carry `CHECK (tenant_id IS NOT NULL)` and a CHECK matching its own range bounds, both declared on the standalone table before `ATTACH PARTITION` is issued. With both constraints present PostgreSQL validates the attach from the catalog and takes `SHARE UPDATE EXCLUSIVE`; without them it scans the partition under a stronger lock. An attach against a partition missing either constraint SHALL be refused with `AttachScanRequired`.

      **Acceptance Criteria:**
      - GIVEN a standalone partition carrying both CHECKs, WHEN `ATTACH PARTITION` runs, THEN it acquires `SHARE UPDATE EXCLUSIVE` on the parent, scans no partition rows, and completes in under 50 ms whatever the partition size.
      - GIVEN a standalone partition missing `CHECK (tenant_id IS NOT NULL)`, WHEN an attach is attempted, THEN `AttachScanRequired` is returned and the attach does not run.
      - GIVEN an attach exceeds 1 s, WHEN the duration is observed, THEN it is reported as `AttachScanRequired`, since only a missing matching constraint causes the scan.
      - GIVEN an attached partition, WHEN a row with `tenant_id IS NULL` is inserted, THEN the insert is rejected by the partition-level CHECK, so the tenant scoping invariant holds per partition and not only on the parent.
      - The range CHECK on each partition matches the `FOR VALUES FROM ... TO ...` bounds used in the attach exactly; a mismatch is detected and rejected before the statement is issued.

      **See:** PAR-01, PAR-02 (constraints declared at creation time), PAR-03 (the attach archival depends on), DDL-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T18:38:41Z'
    workflow: PW-06
    implemented_in:
    - src/db/partition_attach.zig
    test_spec: tests/specs/PAR-04.md
    test_run: tests/reports/report-20260811-WF02-batch-3.yaml
    tested_at: '2026-08-11T18:24:52Z'
    release_run: WF02-batch-3-20260811
    release_decision: docs/status/release-stage16-WF02-batch-3-20260811.yaml
    released_at: '2026-08-11T18:38:41Z'
  PAR-05:
    id: PAR-05
    title: Online conversion to a partitioned event log
    stage: '16'
    priority: MUST
    status: TESTED
    body: |-
      > The one-time conversion of an existing `events` table into a partitioned parent SHALL run online. A new parent is created alongside, historical rows are backfilled in `created_at` windows of one calendar month with one transaction per window and `ON CONFLICT (event_id, created_at) DO NOTHING`, and the tables are exchanged by a rename swap inside a single transaction. `plat_event_idempotency` SHALL be created and populated before the swap, so global `idempotency_key` uniqueness is never absent.

      **Acceptance Criteria:**
      - GIVEN conversion begins, WHEN the parent is created, THEN it is `CREATE TABLE events_part (LIKE events INCLUDING DEFAULTS INCLUDING IDENTITY) PARTITION BY RANGE (created_at)`, and the live `events` table continues to accept appends unchanged.
      - GIVEN a month between `min(created_at)` and the lead horizon has no partition, WHEN conversion validates coverage, THEN `PartitionRangeGap` is raised naming the missing month and no backfill starts.
      - GIVEN a backfill window is interrupted and re-run, WHEN it repeats, THEN `ON CONFLICT (event_id, created_at) DO NOTHING` absorbs the duplicates and the end state is identical to an uninterrupted run.
      - GIVEN the swap transaction, WHEN it runs, THEN it replays the catch-up window since the last backfilled row and issues `ALTER TABLE events RENAME TO events_legacy; ALTER TABLE events_part RENAME TO events;` in one transaction with `lock_timeout = 3s`; a lock timeout rolls the transaction back, leaves both tables intact and readable, and the swap is retried at the next maintenance window.
      - GIVEN the swap has committed, WHEN per-month `count(*)` is compared between `events_legacy` and the new partitions, THEN every month matches; a mismatch raises `ConversionRowCountMismatch` and the inverse rename restores the original `events`.
      - `events_legacy` is retained read-only for one full `archive_after_months` cycle and then attached to `events_archive`; it is never emptied row by row.

      **See:** PAR-01 (the target shape), PAR-03 (how the legacy table finally ages out), PAR-04, DDL-04 (the batched-backfill discipline this reuses)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T06:32:35Z'
    workflow: PW-06
    note: 'AC1-AC5 met (online conversion pipeline: parent creation, resumable per-month backfill with
      idempotent ON CONFLICT DO NOTHING, transactional swap, reconcileOrRollback() with inverse-rename
      on mismatch -- all independently re-run 6/6 passing). Trailing AC sentence (events_legacy retained
      read-only for one archive_after_months cycle then attached to events_archive, never emptied row
      by row) NOT MET -- PartitionConverter has no code path handing events_legacy to PartitionRetention.runArchivalAging()
      (PAR-03). Tracked as ISS-0686 / GH-733 (OPEN, MAJOR). Held at TESTED, not RELEASED, until archival
      integration is implemented -- see docs/status/release-stage16-WF02-batch-4-20260811.yaml for RELEASE-VALIDATOR''s
      full reasoning.'
    implemented_in:
    - src/db/partition_conversion.zig
    - src/scheduler/partition_maintenance.zig
  PAR-06:
    id: PAR-06
    title: Time-bounded instance reconstruction queries
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > Partition pruning is driven by `created_at` while instance reconstruction identifies work by `instance_id`. The platform SHALL resolve this by bounding every reconstruction query with a time predicate, not by accepting per-partition index fan-out. `instances.first_event_at` and `instances.last_event_at` SHALL be maintained in the same transaction as every append, and the reconstruction query SHALL be `SELECT * FROM events WHERE instance_id = $1 AND created_at >= $2 AND created_at < $3 ORDER BY sequence_num`, with `$2` and `$3` taken from those two columns.

      **Acceptance Criteria:**
      - GIVEN an instance whose events all fall in one calendar month and 13 partitions are attached, WHEN reconstruction runs, THEN the query plan shows exactly one partition scanned and the other 12 pruned.
      - GIVEN an instance whose lifetime crosses into a month already moved to `events_archive`, WHEN reconstruction runs, THEN the same bounded predicate is applied to `events_archive`, the two result sets are merged by `sequence_num`, and the result is identical to reconstruction performed before that partition was aged out.
      - GIVEN `instances.first_event_at` or `instances.last_event_at` is NULL, WHEN reconstruction is requested, THEN `ReconstructionWindowMissing` is returned, the projection row is repaired by one scan of the event log for that instance, and the bounded query is retried.
      - GIVEN an append for an instance, WHEN it commits, THEN `last_event_at` is advanced in the same transaction, so the window can never exclude a committed event.
      - GIVEN a reconstruction submitted without a time predicate, WHEN it is received, THEN it is refused rather than executed; unbounded reconstruction is not a supported query form.
      - The upper bound is `last_event_at` plus one microsecond, so the exclusive `<` comparison still includes the final event.

      **See:** PAR-01, PAR-03, XC-05 (deterministic replay depends on reconstruction returning the same events), IR-07 (archived partitions remain queryable), ES-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T06:32:11Z'
    workflow: PW-06
    implemented_in:
    - migrations/1150_par06_instance_projections_event_window.sql
    - src/engine/reconstruction.zig
    - src/event_store/store.zig
    released_at: '2026-08-12T06:32:11Z'
  PIN-01:
    id: PIN-01
    title: Dependency version resolution at instance start
    stage: '16'
    priority: MUST
    status: TESTED
    body: |-
      > **Extends:** PD-08, from the process graph to the non-graph versioned artefacts an instance depends on.

      > The platform SHALL enumerate and resolve every versioned reference in the definition snapshot at instance start: service catalog references on SERVICE_TASK nodes (REPO-07, SVC-01), the definition's `variable_schema` version, and `module_ref` semver ranges on SUB_PROCESS nodes (PLC-01). Each reference resolves to an entry `{kind, ref, resolved_id, version, source}` with `kind` in `catalog_entry`, `variable_schema`, `module` and `source` in `resolved`, `override`, `inherited`. Resolution completes before the instance row is written.

      **Acceptance Criteria:**
      - GIVEN a SERVICE_TASK reference that names no catalog entry with an active version, WHEN the instance is started, THEN the platform returns HTTP 422 `UnresolvedCatalogRef` naming the node and the reference, and writes no instance row.
      - GIVEN a `module_ref` semver range matching no published module version, WHEN the instance is started, THEN the platform returns HTTP 422 `UnresolvedModuleRef` naming the node, the range and the versions available.
      - GIVEN initial variables that violate the resolved `variable_schema` version, WHEN the instance is started, THEN the platform returns HTTP 422 `VariableSchemaViolation` listing each failing field.
      - GIVEN `pin_overrides` naming a version that does not exist, WHEN the instance is started, THEN the platform returns HTTP 422 `UnresolvedPinOverride` and writes no partial pin set.
      - `pinned_versions[]` is ordered by `kind` then `ref`, so two starts of the same definition against the same catalog produce byte-identical payloads.

      **See:** PD-08, REPO-07, SVC-01, PLC-01, PIN-02, PIN-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T06:32:49Z'
    workflow: PW-03
    note: 'AC3/AC4/AC5 met (VariableSchemaViolation validation, UnresolvedPinOverride resolution, deterministic
      (kind, ref) ordering -- all independently re-run 9/9 passing, including confirmation that two BLOCKER/MAJOR
      bugs found mid-run against this exact AC surface, ISS-0679 VariableSchemaViolation false-positive
      and ISS-0683/GH-727 AC4 double-free, are genuinely fixed). AC1/AC2 (service_catalog version/status
      resolution, PLC-01 module-catalog resolution) NOT MET -- service_catalog has no version/status column
      and PLC-01 does not exist in this codebase. Tracked as ISS-0672 / GH-306 (OPEN). Unlike a typical
      partial-release gap, this was a deliberate, validated scope-phasing decision made explicitly by
      CODE-DESIGNER at Step 1 (src/design/pin-01-dependency-version-resolution.md Scoping note and Open
      questions #1/#2) and confirmed PASS by CODE-DESIGN-VALIDATOR at Step 1b KNOWING AC1/AC2 were out
      of scope -- not a late discovery or quality escape. This provenance does not change the release
      marking (PIN-01 is one requirement with 5 MUST-priority AC bullets; 2 of 5 remain unimplemented
      regardless of how early or deliberately that was decided) but lower risk than a typical gap: a bounded,
      tracked scope-phasing decision with a clear unblock condition (service_catalog schema changes +
      PLC-01 shipping). Held at TESTED, not RELEASED -- see docs/status/release-stage16-WF02-batch-4-20260811.yaml
      partially_approved_requirements[1].scope_marking_rationale for full reasoning.'
    implemented_in:
    - src/engine/pin_resolver.zig
    - src/engine/instance.zig
  PIN-02:
    id: PIN-02
    title: Pin set recorded in INSTANCE_STARTED
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL record the resolved pin set as the `pinned_versions[]` field of the `INSTANCE_STARTED` event payload, appended in the same transaction as the instance row insert. The event log is the record of record for pins; no side table stores them.

      **Acceptance Criteria:**
      - GIVEN an instance start commits, WHEN the event log is read, THEN `INSTANCE_STARTED` carries one `pinned_versions[]` entry per enumerated reference plus one entry of kind `variable_schema`.
      - GIVEN the `INSTANCE_STARTED` append fails, WHEN the transaction ends, THEN it rolls back and no instance row exists, so no committed instance has an unrecorded pin set.
      - GIVEN a request for the effective pin set, WHEN it is served, THEN the values come from the event log; no pin table is queried.
      - GIVEN a definition carrying zero service catalog and zero module references, WHEN the instance starts, THEN `pinned_versions[]` contains exactly the `variable_schema` entry.
      - Every entry records `source` as `resolved`, `override` or `inherited`.

      **See:** PD-08, PIN-01, PIN-04, ES-07, IR-07
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T06:32:16Z'
    workflow: PW-03
    implemented_in:
    - migrations/1151_pin02_instance_started_pinned_versions.sql
    - src/engine/instance.zig
    - src/engine/pin_resolver.zig
    released_at: '2026-08-12T06:32:16Z'
  PIN-03:
    id: PIN-03
    title: No fallback to latest version
    stage: '16'
    priority: MUST
    status: TESTED
    body: |-
      > The platform SHALL resolve every versioned dependency during execution through the instance's pin set. A reference with no pin entry raises the typed error `PinMissing` and the step enters the standard retry then dead-letter path. The engine SHALL NOT resolve the current active version in place of a missing pin, and retiring or deprecating a pinned version SHALL NOT affect instances already pinned to it.

      **Acceptance Criteria:**
      - GIVEN a node whose reference has no entry in the pin set, WHEN the node executes, THEN `PinMissing` is raised naming the reference and no catalog lookup for the latest version occurs.
      - GIVEN a newer catalog entry version is published while an instance is in flight, WHEN the instance next reaches a SERVICE_TASK using that reference, THEN it invokes the pinned version.
      - GIVEN the pinned catalog entry version is set to DEPRECATED after the instance started, WHEN the node executes, THEN execution proceeds on the pinned version.
      - GIVEN the retry budget for a `PinMissing` step is exhausted, WHEN the last retry fails, THEN the step lands in the dead-letter queue with the reference name in the payload.
      - No code path substitutes the current active version for a missing or unresolvable pin entry.

      **See:** PIN-01, PIN-02, PIN-05, REPO-07, PLC-01, EE-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T17:00:33Z'
    workflow: PW-03
    note: 'AC1/AC2/AC4/AC5 met (PinMissing raised naming the reference with no catalog lookup, pinned
      version invoked despite a newer catalog entry published in flight, retry-budget-exhausted DLQ entry
      naming the reference, no fallback path for a missing pin against a fully live catalog entry -- all
      independently re-run 4/4 passing). AC3 (WHEN the pinned catalog entry version is set to DEPRECATED
      after the instance started, THEN execution proceeds on the pinned version) NOT MET -- service_catalog
      has no version/status column, so no DEPRECATED value exists anywhere in the schema for any code
      path to branch on; TC-PIN-03-05, the file''s own designated AC3 test, does not drive node execution
      after the catalog mutation and is mechanically identical to the AC2 test (re-checks resolved_id
      equality only). Tracked as ISS-0672 / GH-306 (OPEN) -- the SAME issue already blocking PIN-01 AC1/AC2
      from batch-4, same root cause (service_catalog schema gap). Unlike a typical partial-release gap,
      this was a deliberate, validated scope-phasing decision made explicitly by CODE-DESIGNER at Step
      1 (src/design/pin-03-no-fallback-to-latest-version.md Scoping note and Open questions #1, flagged
      as a BLOCKING gap before implementation began) and confirmed PASS by CODE-DESIGN-VALIDATOR at Step
      1b KNOWING AC3 was out of scope -- not a late discovery or quality escape. This provenance does
      not change the release marking (PIN-03 is one requirement with 5 MUST-priority AC bullets; 1 of
      5 remains unimplemented regardless of how early or deliberately that was decided), consistent with
      PIN-01''s own precedent for this exact issue. Held at TESTED, not RELEASED -- see docs/status/release-stage16-WF02-batch-5-20260812.yaml
      partially_approved_requirements[0].scope_marking_rationale for full reasoning. When ISS-0672/GH-306
      is resolved (service_catalog gains a version/status column), PIN-01 AC1/AC2 and PIN-03 AC3 should
      be revisited together in the same follow-up batch.'
    implemented_in:
    - src/engine/instance.zig
    - src/engine/pin_resolver.zig
  PIN-04:
    id: PIN-04
    title: Pin resolution on replay and in sub-processes
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL read the effective pin set during state reconstruction from `INSTANCE_STARTED` and the most recent `INSTANCE_PINS_REBOUND` event, never from the live service catalog or module registry. A sub-process child instance inherits its parent's pin set and adds entries only for references the parent does not carry. `GET /api/v1/instances/{id}/pins` returns the effective set with the source event identifier for each entry.

      **Acceptance Criteria:**
      - GIVEN a completed instance whose catalog has changed since it ran, WHEN its state is reconstructed, THEN the reconstructed dependency versions equal the versions recorded in `INSTANCE_STARTED`.
      - GIVEN a child instance started with `parent_instance_id`, WHEN its pin set is written, THEN entries for references the parent already pins carry `source = inherited` and the parent's version.
      - GIVEN a child reference that resolves to a version differing from an inherited pin, WHEN the child starts, THEN the inherited pin is used and the conflict is recorded in the child's `INSTANCE_STARTED` payload.
      - GIVEN a call to `GET /api/v1/instances/{id}/pins`, WHEN it is served, THEN each entry names the event identifier it was read from.
      - Reconstruction issues no read against the service catalog or the module registry.

      **See:** PIN-02, PIN-03, PIN-05, IR-07, XC-05, PLC-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T17:00:03Z'
    workflow: PW-03
    implemented_in:
    - src/engine/instance.zig
    - src/engine/pin_resolver.zig
    - src/api/routes/pin_rebind.zig
    released_at: '2026-08-12T17:00:03Z'
  PIN-05:
    id: PIN-05
    title: Explicit instance pin rebind
    stage: '16'
    priority: SHOULD
    status: RELEASED
    body: |-
      > The platform SHALL change an instance's pins only through `POST /api/v1/instances/{id}/rebind-pins`, which takes explicit `{kind, ref, version}` entries and a mandatory reason, and appends `INSTANCE_PINS_REBOUND` recording the prior version, the new version, the actor and the reason for each changed entry. The operation is all-or-nothing and is rejected on a terminal instance. No automatic process upgrades a running instance's pins.

      **Acceptance Criteria:**
      - GIVEN a running instance, WHEN a valid rebind is submitted, THEN `INSTANCE_PINS_REBOUND` is appended carrying `prior_version`, `new_version`, actor and reason for each changed entry.
      - GIVEN a rebind naming a reference absent from the current pin set, WHEN it is processed, THEN the platform returns HTTP 422 `UnknownPinRef` and applies none of the entries in the request.
      - GIVEN an instance in `COMPLETED`, `CANCELLED` or `FAILED`, WHEN a rebind is submitted, THEN the platform returns HTTP 409 `InstanceNotRebindable`.
      - GIVEN a rebind request with no reason field, WHEN it is validated, THEN the platform returns HTTP 422.
      - No scheduled job, catalog publication or definition promotion changes the pin set of a running instance.

      **See:** PIN-02, PIN-03, PIN-04, PRM-08, ADP-11
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T17:00:09Z'
    workflow: PW-03
    implemented_in:
    - src/api/routes/pin_rebind.zig
    released_at: '2026-08-12T17:00:09Z'
  PRM-01:
    id: PRM-01
    title: Promotion plan and diff report
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** ENV-03, replacing a direct test-tenant to production-tenant copy with a computed, reviewable plan.

      > The platform SHALL compute a promotion plan before any write to the target tenant. The plan diffs the source tenant's definition version against the target tenant's active version across the process graph, the `variable_schema`, service catalog bindings (REPO-07) on SERVICE_TASK nodes, `module_ref` resolutions (PLC-01) on SUB_PROCESS nodes, and permission rules. Each plan entry carries `{type, id, change_kind, before, after}` with `change_kind` in `added`, `modified`, `removed`, and the plan is rendered as a human-readable change list alongside its JSON form. Submission is `POST /api/v1/promotions` and requires the `promotion.submit` permission.

      **Acceptance Criteria:**
      - GIVEN a caller without `promotion.submit`, WHEN it calls `POST /api/v1/promotions`, THEN the platform returns HTTP 403 and creates no `promotion_reviews` row.
      - GIVEN the target tenant holds no version of `process_key`, WHEN the plan is computed, THEN every plan entry carries `change_kind = added` and the plan is accepted.
      - GIVEN the source and target definitions are identical after canonicalisation, WHEN the plan is computed, THEN the platform returns HTTP 422 `EmptyPromotionPlan` and creates no review row.
      - GIVEN `source_tenant_id` names a production tenant, WHEN the promotion is submitted, THEN the platform returns HTTP 422 `InvalidPromotionSource`.
      - The plan is computed before any transaction that writes to the target tenant is opened.

      **See:** ENV-03, PD-08, REPO-07, PLC-01, PRM-02, PRM-03, VLD-04
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-12T17:00:15Z'
    workflow: PW-01
    implemented_in:
    - src/api/routes/promotions.zig
    released_at: '2026-08-12T17:00:15Z'
  PRM-02:
    id: PRM-02
    title: Conflict pre-flight rejection
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL run conflict detection as the first step of the promotion pipeline, before any transaction opens. A conflict exists when the target tenant's active version of `process_key` is greater than the `base_version` the source branched from. On conflict the platform returns a typed `ConflictRejection` naming each conflicting definition with its source-side change and its target-side change, appends exactly one `DEFINITION_PROMOTION_REJECTED` event in its own transaction, and moves no version pointer.

      **Acceptance Criteria:**
      - GIVEN the target active version is greater than `base_version`, WHEN the promotion is submitted, THEN the platform returns HTTP 409 `PromotionConflict` with a body listing `{definition_id, source_change, target_change}` for each conflict.
      - GIVEN a conflict is detected, WHEN the rejection is recorded, THEN exactly one `DEFINITION_PROMOTION_REJECTED` event is appended and the target tenant's active version pointer is unchanged.
      - GIVEN a conflict is detected, THEN no `promotion_reviews` row and no `promotion_assertion_runs` row is created.
      - GIVEN a conflict is detected, THEN the rejection path holds no transaction open against the target tenant schema at the time the conflict is raised.
      - The conflict check executes before the plan digest is computed (PRM-03) and before the review row is inserted (PRM-04); no ordering makes it run later.

      **See:** PRM-01, PRM-03, PRM-04, PRM-05, ENV-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-15T23:28:26Z'
    workflow: PW-01
    note: Released via WF02-prm02-05-20260816 (stage 16, promotion pipeline).
    implemented_in:
    - src/definition/promotion_digest.zig
    - src/definition/promotion_review.zig
    - src/definition/promotion_conflict.zig
    - src/api/routes/promotion_review.zig
    - src/bpm.zig
    released_at: '2026-08-15T23:28:26Z'
  PRM-03:
    id: PRM-03
    title: Plan digest binds approval to a diff
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL bind every approval to a `plan_digest`: the lowercase hexadecimal SHA-256 over the canonical JSON serialisation of the promotion plan, where canonical means object keys sorted lexicographically and no insignificant whitespace, over the entry shape `{type, id, changes}`. The digest and the full serialised plan are stored on the `promotion_reviews` row at submit time. Approve and apply both require the digest in the request body, and a mismatch is rejected with HTTP 409 `PlanDigestMismatch`.

      **Acceptance Criteria:**
      - GIVEN two byte-identical plans, WHEN each is digested, THEN both produce the same 64-character lowercase hexadecimal string.
      - GIVEN an approve request whose body digest differs from the stored digest, WHEN it is processed, THEN the platform returns HTTP 409 `PlanDigestMismatch` and the review remains in `pending_review`.
      - GIVEN an apply request whose body digest differs from the stored digest, WHEN it is processed, THEN the platform returns HTTP 409 `PlanDigestMismatch` and claims no sandbox.
      - GIVEN the source definition changes after an approval, WHEN a new promotion is submitted, THEN a new digest and a new review row are created, and the earlier approval cannot be applied to the new plan.
      - The reviewer context endpoint serves the plan stored at submit time and never re-computes a live diff.

      **See:** PRM-01, PRM-02, PRM-04, PRM-05, PRM-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-15T23:28:27Z'
    workflow: PW-01
    note: Released via WF02-prm02-05-20260816 (stage 16, promotion pipeline).
    implemented_in:
    - src/definition/promotion_digest.zig
    - src/definition/promotion_review.zig
    - src/definition/promotion_conflict.zig
    - src/api/routes/promotion_review.zig
    - src/bpm.zig
    released_at: '2026-08-15T23:28:27Z'
  PRM-04:
    id: PRM-04
    title: Promotion review state machine
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL persist promotion approvals in a `promotion_reviews` table holding `id`, `tenant_id`, `plan_digest`, `def_type`, `def_id`, the serialised plan, `status`, `requested_by`, `approved_by`, `approved_at`, `superseded_by`, `row_version`, `created_at` and `updated_at`. `status` is constrained by a CHECK over exactly six values: `pending_review`, `approved`, `rejected`, `applied`, `failed`, `superseded`. The permitted edges are pending_review to approved, pending_review to rejected, pending_review to superseded, approved to applied, approved to failed, and approved to superseded. A partial unique index `promotion_reviews_plan_digest_active_uniq` over `(tenant_id, plan_digest) WHERE status IN ('pending_review','approved')` permits at most one live review per digest.

      **Acceptance Criteria:**
      - GIVEN a review in `pending_review`, WHEN it is approved, THEN `status` becomes `approved` with `approved_by` and `approved_at` set; from any other source status the platform returns HTTP 400 `InvalidReviewTransition`.
      - GIVEN a live review for `(tenant_id, plan_digest)`, WHEN a second submission produces the same digest, THEN the platform returns HTTP 409 `DuplicateReview` raised by the partial unique index.
      - GIVEN a review in `approved` whose assertion re-run fails, WHEN the failure is recorded, THEN `status` becomes `failed`.
      - GIVEN a promotion applies, WHEN the version pointer moves, THEN `status` moves `approved` to `applied` and `DEFINITION_PROMOTION_APPLIED` is appended in the same transaction as the pointer move.
      - A transition outside the enumerated edge set is rejected by the CHECK constraint at the database and with HTTP 400 at the API.

      **See:** PRM-02, PRM-03, PRM-05, PRM-06, PRM-08
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-15T23:28:28Z'
    workflow: PW-01
    note: Released via WF02-prm02-05-20260816 (stage 16, promotion pipeline).
    implemented_in:
    - src/definition/promotion_digest.zig
    - src/definition/promotion_review.zig
    - src/definition/promotion_conflict.zig
    - src/api/routes/promotion_review.zig
    - src/bpm.zig
    released_at: '2026-08-15T23:28:28Z'
  PRM-05:
    id: PRM-05
    title: Non-skippable human approval gate
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL require an approved review before a promotion is applied, and SHALL provide no request parameter, header, flag or configuration value that bypasses the check. The principal recorded in `requested_by` cannot approve its own review. `GET /api/v1/promotions/{id}/context` returns the stored plan, the assertions carried by the artifact, the `NEEDS_REVIEW` package and the `plan_digest`, so the reviewer decides on exactly the diff the digest binds.

      **Acceptance Criteria:**
      - GIVEN a review whose status is not `approved`, WHEN `POST /api/v1/promotions/{id}/apply` is called, THEN the platform returns HTTP 400 `InvalidReviewTransition` and claims no sandbox.
      - GIVEN an approve request whose principal equals `requested_by`, WHEN it is processed, THEN the platform returns HTTP 403 and the review remains in `pending_review`.
      - GIVEN a request body carrying an unrecognised field intended to skip the gate, WHEN it is processed, THEN the platform returns HTTP 422 for the unknown field; no skip field exists in the schema.
      - GIVEN a pre-vetted platform-published template installed during provisioning, WHEN it reaches the target tenant, THEN it is promoted through a separate entry point that never calls apply, rather than through a bypass flag on apply.
      - The context response contains the serialised plan, `assertions[]`, the `NEEDS_REVIEW` package and `plan_digest` in one document.

      **See:** PRM-03, PRM-04, PRM-06, SOL-02, IDN-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-15T23:28:29Z'
    workflow: PW-01
    note: Released via WF02-prm02-05-20260816 (stage 16, promotion pipeline).
    implemented_in:
    - src/definition/promotion_digest.zig
    - src/definition/promotion_review.zig
    - src/definition/promotion_conflict.zig
    - src/api/routes/promotion_review.zig
    - src/bpm.zig
    released_at: '2026-08-15T23:28:29Z'
  PRM-06:
    id: PRM-06
    title: Pre-promotion assertion re-run
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL re-run the assertions carried by the promotion artifact as a pre-production gate, in an ephemeral sandbox built from the promotion-candidate definitions and loaded with only the artifact's `fixtures[]`. The replay runs under a frozen clock, an RNG seeded from the artifact's `rng_seed`, and the stub effect recorder, and strips `non_deterministic_fields` before comparison. Each run is recorded in `promotion_assertion_runs` with `UNIQUE (tenant_id, idempotency_key)` and key `promotion_rerun:<review_id>:<plan_digest>`.

      **Acceptance Criteria:**
      - GIVEN apply is called twice for the same review and digest, WHEN the second call runs, THEN it returns the outcome already recorded under the idempotency key and claims no second sandbox.
      - GIVEN organic rows exist in the source tenant, WHEN the sandbox is loaded, THEN the sandbox contains only the rows named in `fixtures[]`.
      - GIVEN the same artifact is replayed twice, WHEN results are compared after stripping `non_deterministic_fields`, THEN the two result sets are identical.
      - GIVEN any assertion fails, WHEN the run completes, THEN `promotion_assertion_runs.status` is `failed`, the review moves `approved` to `failed`, the platform returns HTTP 422 listing the failing assertion identifiers, and the target active version pointer is unchanged.
      - GIVEN no ephemeral sandbox becomes free within 60 seconds, WHEN the claim times out, THEN the platform returns HTTP 503 `SandboxUnavailable` and the review remains `approved`.

      **See:** PRM-04, PRM-05, PRM-07, ENV-01, ENV-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-14T03:12:25Z'
    workflow: PW-01
    note: Released via WF02-prm-batch1-20260814
    released_at: '2026-08-14T03:12:25Z'
  PRM-07:
    id: PRM-07
    title: Sandbox teardown does not block promotion
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL release the claimed sandbox on every exit path of the assertion re-run, including assertion failure, infrastructure failure and panic. A release failure appends `PROMOTION_ASSERTION_TEARDOWN_FAILED`, sets `promotion_assertion_runs.status` to `teardown_failed`, and is surfaced on the promotion read endpoint, but never converts a passing run into a promotion failure.

      **Acceptance Criteria:**
      - GIVEN every assertion passed and the sandbox release then fails, WHEN the pipeline continues, THEN the promotion applies, `promotion_assertion_runs.status` is `teardown_failed`, and `PROMOTION_ASSERTION_TEARDOWN_FAILED` is appended.
      - GIVEN the assertion replay panics, WHEN the panic unwinds, THEN the sandbox release is still invoked before the error is returned.
      - GIVEN a teardown failure was recorded, WHEN `GET /api/v1/promotions/{id}` is called, THEN the response names the failed teardown and the sandbox identifier.
      - A teardown failure never sets `promotion_reviews.status` to `failed` and never blocks the version pointer move.
      - GIVEN a leaked sandbox, WHEN the sandbox reaper next runs, THEN the sandbox is reclaimed and the reclamation is recorded against the same run.

      **See:** PRM-06, PRM-04, ENV-01, ENV-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-14T03:12:26Z'
    workflow: PW-01
    note: Released via WF02-prm-batch1-20260814
    released_at: '2026-08-14T03:12:26Z'
  PRM-08:
    id: PRM-08
    title: Promotion rollback by version pointer move
    stage: '16'
    priority: SHOULD
    status: RELEASED
    body: |-
      > **Extends:** PD-08. Because every instance carries a definition snapshot, reverting the active version affects only instances started afterwards.

      > The platform SHALL support promotion rollback as a version pointer move: `POST /api/v1/definitions/{process_key}/rollback` re-points the tenant's active version to a version that was previously active in that tenant and appends `DEFINITION_VERSION_ROLLED_BACK`. No DDL executes, because a promotion carries none. In-flight instances continue on their PD-08 snapshot and their PIN-02 pin set, and the `promotion_reviews` row that applied the reverted version moves to `superseded`.

      **Acceptance Criteria:**
      - GIVEN version V2 is active and V1 was active before it, WHEN rollback to V1 is requested, THEN the active pointer becomes V1, `DEFINITION_VERSION_ROLLED_BACK` is appended, and no schema change is executed.
      - GIVEN instances started under V2, WHEN the rollback completes, THEN those instances continue on their PD-08 snapshot and their recorded `pinned_versions[]` are unchanged.
      - GIVEN a version that was never active in this tenant, WHEN rollback names it, THEN the platform returns HTTP 422 `VersionNeverActive`.
      - GIVEN the rollback succeeds, WHEN the review is closed, THEN the `promotion_reviews` row that applied V2 moves to `superseded` with `superseded_by` naming the rollback event.
      - GIVEN a caller without the platform-admin role, WHEN rollback is requested, THEN the platform returns HTTP 403.

      **See:** PD-08, PRM-04, PRM-06, PIN-02, ENV-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-14T03:12:27Z'
    workflow: PW-01
    note: Released via WF02-prm-batch1-20260814
    released_at: '2026-08-14T03:12:27Z'
  PRM-09:
    id: PRM-09
    title: Solution pack update conflict resolution
    stage: '16'
    priority: SHOULD
    status: RELEASED
    body: |-
      > **Extends:** SOL-02, which installs a solution pack into a target tenant. This requirement governs the case SOL-02 does not cover: a *later* version of a pack offered to a tenant that has since modified what the earlier version installed.

      > The platform SHALL treat a solution pack update as a three-way comparison rather than an overwrite. When pack `P` at version `Vb` was installed into a tenant and version `Vn` is offered, the platform SHALL compute, per artefact in the pack closure, the difference between the **base** (the artefact exactly as `Vb` installed it, recorded at install time), **theirs** (the tenant's current active artefact), and **incoming** (`Vn`). Each artefact SHALL be classified `unchanged`, `clean_update` (only the pack changed), `local_only` (only the tenant changed), or `conflict` (both changed). A `conflict` artefact SHALL NOT be applied until a resolution of `keep_local`, `take_incoming` or `merged` is recorded against that artefact, with the resolving principal and timestamp. The update SHALL be delivered as a single `PRM-01` promotion plan, so an update reaching a tenant passes the same `PRM-05` gate as any other change.

      **Acceptance Criteria:**
      - GIVEN pack `P` at `Vb` was installed and the tenant has not modified any installed artefact, WHEN `Vn` is offered, THEN every changed artefact is classified `clean_update`, the plan lists them, and no per-artefact resolution is requested.
      - GIVEN the tenant modified definition `D` after installing `Vb` and `Vn` also changes `D`, WHEN the update plan is computed, THEN `D` is classified `conflict`, the plan carries the base, local and incoming forms of `D`, and applying the plan without a resolution for `D` returns HTTP 409 `UnresolvedTemplateConflict` naming `D`.
      - GIVEN a `conflict` artefact with a recorded resolution of `keep_local`, WHEN the update is applied, THEN the tenant's artefact is left byte-identical, `TEMPLATE_UPDATE_CONFLICT_RESOLVED` is appended carrying the resolution and the resolving principal, and the recorded base for that artefact advances to `Vn` so the next update compares against `Vn` rather than `Vb`.
      - GIVEN an artefact classified `local_only`, WHEN the update is applied, THEN that artefact is not touched and it is reported in the plan as retained, so a tenant customisation is never lost to an update that did not concern it.
      - GIVEN the install record for `Vb` is absent, so no base form exists, WHEN `Vn` is offered, THEN every artefact the tenant already holds is classified `conflict` rather than `clean_update`, because the platform cannot prove the tenant did not modify it.
      - No code path applies a pack update to an artefact classified `conflict` without a recorded resolution; a plan carrying an unresolved conflict is rejected by `PRM-02` before any transaction opens.

      **See:** SOL-01, SOL-02, SOL-03, PLC-01, PD-09, PRM-01, PRM-02, PRM-05, ENV-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-14T03:12:28Z'
    workflow: PW-01
    note: Released via WF02-prm-batch1-20260814
    released_at: '2026-08-14T03:12:28Z'
  QRY-01:
    id: QRY-01
    title: Structured entity query surface
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** API-06, generalizing cursor-paged reads from fixed endpoints to tenant-defined entity projections.

      > The platform SHALL expose one structured query surface over entity projections at `POST /api/v1/entities/{entity_key}/query`. The request body carries `filters` as an array of `{field, op, value}` nodes, `sort` as an array of `{field, dir}` nodes, `page_size`, and `cursor`. `op` is an enum over `eq`, `neq`, `lt`, `lte`, `gt`, `gte`, `in`, `contains`; `dir` is an enum over `asc`, `desc`. No request field is concatenated into statement text: the compiler emits allowlisted column and key references and binds every literal as a positional parameter. The surface reads committed typed projection tables `ent_<entity_key>` and performs no write.

      **Acceptance Criteria:**
      - GIVEN a filter node with `op` outside the enum, WHEN the request is parsed, THEN the platform returns HTTP 400 `operator_not_recognised` naming the received value, and no statement is executed.
      - GIVEN a filter value containing `' OR 1=1 --`, WHEN the query executes, THEN the value is bound as a positional parameter, the result set is the rows whose column equals that literal string, and the statement text contains no part of the value.
      - GIVEN a request body carrying a raw SQL fragment in any field, WHEN it is parsed, THEN it is rejected by the request model before compilation; the surface accepts no field whose contents reach the database as statement text.
      - GIVEN a valid query, WHEN it executes, THEN it reads only `ent_<entity_key>` in the caller's tenant and issues no INSERT, UPDATE, or DELETE.
      - GIVEN the entity projection is rebuilt from the event log, WHEN the same query is re-issued, THEN the request document is unchanged and remains valid; the query surface holds no per-record state and defines no record placement states.
      - `EntityQueryExecuted` is appended with `entity_key`, the filter field names, and the row count; filter values are not recorded.

      **See:** API-06, API-10, ADP-09, TNT-01, QRY-02, QRY-03, QRY-04, QRY-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:53Z'
    workflow: PW-10
  QRY-02:
    id: QRY-02
    title: Declared filterable field allowlist
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** QRY-01, bounding the queryable surface to an explicit allowlist.

      > A field SHALL be filterable or sortable only when it is a typed column of the `ent_<entity_key>` projection table or an entry in that entity type's declared `filterable_jsonb_keys`. Each `filterable_jsonb_keys` entry names a top-level key in the `payload` column and declares its type as `text`, `numeric`, `boolean`, or `timestamptz`; the compiler emits `payload ->> '<key>'` with the declared cast. A field that is neither a typed column nor a declared key SHALL be rejected with HTTP 400 `filter_field_not_allowlisted` naming the field. An undeclared key is an error, never an empty result and never a silently dropped predicate.

      **Acceptance Criteria:**
      - GIVEN entity type `production_batch` declares `filterable_jsonb_keys` of `supplier_name` (text) and `defect_rate` (numeric), WHEN a query filters on `supplier_name`, THEN the compiler emits `payload ->> 'supplier_name' = $1` and returns the matching rows.
      - GIVEN a query filters on `payload` key `internal_note`, which is present in stored records but absent from `filterable_jsonb_keys`, WHEN the request is validated, THEN the platform returns HTTP 400 `filter_field_not_allowlisted` with `"field": "internal_note"` and executes no statement.
      - GIVEN a query sorts on an undeclared key, WHEN the request is validated, THEN the same HTTP 400 `filter_field_not_allowlisted` is returned; the sort allowlist and the filter allowlist are the same set.
      - GIVEN a filter applies `contains` to the numeric key `defect_rate`, WHEN the request is validated, THEN the platform returns HTTP 400 `operator_not_valid_for_type` naming the field and the operator.
      - GIVEN a tenant admin adds `internal_note` to `filterable_jsonb_keys` with type `text`, WHEN the earlier rejected query is re-issued, THEN it executes and returns rows without any change to the request document.
      - A typed column and a declared key of the same name resolve to the typed column; the entity type registry rejects a `filterable_jsonb_keys` entry that shadows a typed column name at declaration time.

      **See:** QRY-01, QRY-03, QRY-05, ADP-09, TNT-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:54Z'
    workflow: PW-10
  QRY-03:
    id: QRY-03
    title: Keyset pagination with a bounded page size
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** API-06, applying keyset paging to the generic entity query surface.

      > Pagination SHALL be keyset-based. `page_size` defaults to 50 and SHALL NOT exceed 200; a larger value returns HTTP 400 `page_size_exceeds_max` and the query is not executed. The platform SHALL append `record_id` as the final sort term on every query so the ordering key is total, and SHALL accept at most 2 client-supplied sort nodes. `cursor` is the base64url encoding of the previous page's last row ordered tuple; the platform decodes it into the keyset predicate. Offset pagination is not offered on this surface.

      **Acceptance Criteria:**
      - GIVEN `page_size` of 500, WHEN the query is validated, THEN the platform returns HTTP 400 `page_size_exceeds_max` carrying the maximum of 200, and executes no statement.
      - GIVEN `page_size` omitted, WHEN the query executes, THEN 50 rows at most are returned and the response echoes `page_size` of 50.
      - GIVEN a sort of `created_at desc`, WHEN the statement is compiled, THEN the ORDER BY is `created_at DESC, record_id DESC`, and two rows sharing a `created_at` value have a deterministic relative order across pages.
      - GIVEN a page whose row count reaches `page_size`, WHEN the platform selects `LIMIT page_size + 1`, THEN the extra row is dropped from `items` and its ordered tuple is encoded as `next_cursor`; the final page returns `next_cursor` of null.
      - GIVEN a cursor issued under a sort of `created_at desc` and a follow-up request sorting on `batch_number asc`, WHEN the cursor is decoded, THEN the platform returns HTTP 400 `cursor_sort_mismatch` and the client restarts from the first page.
      - GIVEN a cursor that is not valid base64url or that decodes to a non-tuple, WHEN it is decoded, THEN the platform returns HTTP 400 `cursor_malformed`.
      - GIVEN rows are inserted between two page requests, WHEN the second page is fetched with the cursor, THEN no row from the first page reappears; the cursor encodes column values, not a row offset.

      **See:** API-06, QRY-01, QRY-02, ADP-09
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:55Z'
    workflow: PW-10
  QRY-04:
    id: QRY-04
    title: Empty envelope for unauthorised entity types
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** QRY-01, closing the entity type existence oracle.

      > An `entity_key` that is not registered in the caller's tenant and an `entity_key` the caller has no `entity.read` grant for SHALL both return HTTP 200 with the empty envelope `{"items": [], "next_cursor": null}`. The query surface SHALL NOT return HTTP 403 or HTTP 404 for an entity type at any point, so a caller cannot use the response to establish which entity types a tenant has defined or which ones it is excluded from.

      **Acceptance Criteria:**
      - GIVEN a caller without `entity.read` on `production_batch`, WHEN it queries that entity type, THEN the platform returns HTTP 200 with `{"items": [], "next_cursor": null}`.
      - GIVEN a caller queries `entity_key` `nonexistent_type`, WHEN the registry lookup misses, THEN the response body and headers are byte-identical to the unauthorised case above.
      - GIVEN a caller with the grant queries an entity type holding zero matching rows, WHEN the query executes, THEN the response is the same empty envelope; the three cases are indistinguishable to the client.
      - GIVEN an unauthorised entity type, WHEN the request also carries an undeclared filter key, THEN the authorisation outcome is decided first and the response is HTTP 200 with the empty envelope, not HTTP 400; the QRY-02 error path is not reachable without a read grant.
      - GIVEN an unauthorised or unknown entity type, WHEN the request is handled, THEN no `ent_<entity_key>` table is queried and the response is produced from the registry lookup alone.
      - Every empty-envelope response for an unauthorised or unknown entity type appends an audit entry naming the caller, the tenant, and the requested `entity_key`.

      **See:** QRY-01, QRY-02, QRY-05, IDN-05, TNT-01, OBS-03
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:56Z'
    workflow: PW-10
  QRY-05:
    id: QRY-05
    title: Server-side field stripping on query results
    stage: '17'
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** QRY-01, enforcing field-level read grants on the server.

      > Fields the caller has no read grant for SHALL be removed from every item before serialisation. A stripped field SHALL be absent from the JSON object, not present with a null value, an empty string, or a redaction marker, so the response carries no signal that the field exists. Stripping SHALL happen on the server; the client is never sent a value it is expected to hide. A stripped field remains usable as a filter or sort term only when the caller holds the read grant for it.

      **Acceptance Criteria:**
      - GIVEN a quality manager without `entity.read.cost`, WHEN the production batch list is queried, THEN no item carries a `unit_cost_eur` key at all.
      - GIVEN a managing director holding `entity.read.cost`, WHEN the same query is issued, THEN every item carries `unit_cost_eur` and the row set is identical to the quality manager's row set.
      - GIVEN a caller without the grant on `unit_cost_eur`, WHEN it filters on `unit_cost_eur`, THEN the platform returns HTTP 400 `filter_field_not_allowlisted` naming the field; an ungranted field is not a queryable field for that caller.
      - GIVEN a caller without the grant on `unit_cost_eur`, WHEN it sorts on `unit_cost_eur`, THEN the same HTTP 400 is returned and no ordering by the ungranted field is performed.
      - GIVEN stripping removes every field of an item except `record_id`, WHEN the response is serialised, THEN the item is still present with `record_id` alone; row visibility and field visibility are separate decisions.
      - Stripping is applied to the serialised item after the statement returns, and the stripped field names are not listed anywhere in the response.

      **See:** QRY-01, QRY-02, QRY-04, IDN-05, TNT-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:58Z'
    workflow: PW-10
  RND-UI-01:
    id: RND-UI-01
    title: Six-state renderer union and single error classifier
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** API-06, narrowing the platform error contract into a closed client-side state union.

      > The SPA SHALL export the type `RendererState = 'loading' | 'success' | 'fetch-failure' | 'permission-denied' | 'stale-version' | 'rate-limit'` from `web/src/utils/classifyError.ts`, and `classifyError()` SHALL be the only function in `web/src/` that reads an HTTP status off a query error. The mapping is fixed: 401 and 403 to `permission-denied`, 409 to `stale-version`, 429 carrying `Retry-After` to `rate-limit`, every other non-2xx status and every transport failure to `fetch-failure`. `web/src/components/ui/QueryStateBoundary.tsx` SHALL be the only consumer of the union and SHALL switch on it exhaustively with a `never` default arm. Every page component under `web/src/pages/` that calls `useQuery` SHALL render its body inside `<QueryStateBoundary>`.

      **Acceptance Criteria:**
      - GIVEN a page component under `web/src/pages/` that calls `useQuery` without wrapping its body in `<QueryStateBoundary>`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails with pattern name `missing-query-state-boundary` and the file path; this is a pure static scan with no HTTP.
      - GIVEN a seventh member is added to `RendererState` without a matching switch arm, WHEN `npm run type-check` runs, THEN it exits non-zero at the `never` default arm of `QueryStateBoundary`; this is a pure static check with no HTTP.
      - GIVEN a file under `web/src/` other than `classifyError.ts` that reads `error.response.status`, WHEN the source scan runs, THEN the scan fails with pattern name `status-read-outside-classifier`.
      - GIVEN a Playwright E2E against the real backend drives a page through a 403 and then a successful read, WHEN each frame is inspected, THEN exactly one state subtree is present at a time and no error component is mounted beside a populated `DataTable`.
      - GIVEN a 429 response arrives with no `Retry-After` header from the real rate limiter, WHEN `classifyError()` runs in a Playwright E2E, THEN it returns `fetch-failure` rather than `rate-limit`.

      **See:** RND-UI-02, RND-UI-03, RND-UI-04, RND-UI-05, RND-UI-06, GRD-UI-02, API-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T16:40:09Z'
    workflow: PW-13
    released_at: '2026-08-13T16:40:09Z'
  RND-UI-02:
    id: RND-UI-02
    title: Loading state with skeleton layout
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > The `loading` state SHALL render `web/src/components/ui/SkeletonLayout.tsx` with `aria-busy="true"` on the content region and five skeleton rows whose column widths match the column widths the resolved `DataTable` will use. On resolution to `success`, `aria-busy` SHALL be removed and `DataTable` SHALL receive `isLoading={false}`. No frame between navigation and resolution SHALL render an empty content region.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E navigates to the Instance List against the real backend, WHEN the first frame after navigation is captured, THEN `SkeletonLayout` is already mounted and the content region carries `aria-busy="true"`.
      - GIVEN the same E2E waits for the query to resolve, WHEN the resolved frame is captured, THEN `aria-busy` is absent from the content region and the skeleton rows are unmounted.
      - GIVEN the skeleton frame and the resolved frame are both captured in that E2E, WHEN the bounding box of each table column is compared between the two frames, THEN each column width is identical and no horizontal shift occurs.
      - GIVEN a page renders `DataTable` with `isLoading={true}` outside a `QueryStateBoundary`, WHEN the GRD-UI-02 source scan runs, THEN the scan fails with pattern name `missing-query-state-boundary`; this is a pure static scan with no HTTP.
      - The skeleton rows draw from `--color-neutral-200` and `--color-neutral-100` and hold no literal colour value, which the GRD-UI-02 scan asserts under pattern name `literal-colour`.

      **See:** RND-UI-01, CMP-UI-01, CMP-UI-03, GRD-UI-02, IN-UI-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T16:40:31Z'
    workflow: PW-13
    released_at: '2026-08-13T16:40:31Z'
  RND-UI-03:
    id: RND-UI-03
    title: Fetch failure state with explicit retry
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > The `fetch-failure` state SHALL render `web/src/components/ui/FetchError.tsx` with `role="alert"` and a single `onRetry` action bound to the query's `refetch()`. React Query automatic retry SHALL be set to 0 for every query passing through `QueryStateBoundary`, so a retry occurs only on a user action. A recovered read SHALL NOT fire a success toast.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E deletes a process definition through the real API and then navigates to that definition's detail route, WHEN the real 404 arrives, THEN `FetchError` renders with `role="alert"` and one Retry control; no HTTP mocking is used, the 404 comes from the real backend.
      - GIVEN the same E2E restarts the API container with `docker-compose restart bpm-platform` and requests the Instance List, WHEN the transport failure surfaces, THEN `FetchError` renders and no partial table is shown.
      - GIVEN the container reports healthy again, WHEN the user presses Retry in that E2E, THEN the state returns to `loading`, then to `success`, and the screen shows the instance rows.
      - GIVEN a query resolves after a failed attempt, WHEN the success frame is inspected, THEN no toast is present in the toast region.
      - GIVEN any query registered on `QueryStateBoundary`, WHEN its options object is read in a pure static scan of `web/src/hooks/`, THEN `retry` is 0 and no hook overrides it inline.

      **See:** RND-UI-01, RND-UI-05, GRD-UI-02, API-06, IN-UI-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-13T16:40:32Z'
    workflow: PW-13
    released_at: '2026-08-13T16:40:32Z'
  RND-UI-04:
    id: RND-UI-04
    title: Leak-free permission denied surface
    stage: F8
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** IDN-02, giving role enforcement a client-side surface that discloses nothing about the protected resource.

      > The `permission-denied` state SHALL render `web/src/components/ui/PermissionDenied.tsx`. Its rendered subtree SHALL contain the string "You do not have access to this area. Contact your tenant administrator." and a link to the Task Inbox, and SHALL contain no HTTP status number, no `problem.type` URI, no `problem.detail` text, no resource UUID, and no backend-authored message. The state SHALL be reached on both 401 and 403 without a full page reload.

      **Acceptance Criteria:**
      - GIVEN a Playwright E2E signs in through the real Keycloak realm as a SwiftRoute driver who holds no `bpm-admin` role, WHEN the user navigates to the Definition List, THEN the real backend returns 403 and `PermissionDenied` renders; no HTTP mocking is used.
      - GIVEN that rendered subtree, WHEN its `textContent` is matched in the same E2E against `/40[13]|application\/problem|urn:problem|[0-9a-f]{8}-[0-9a-f]{4}-/`, THEN there is no match.
      - GIVEN that rendered subtree, WHEN its text is read, THEN it equals the fixed copy above plus the Task Inbox link label, and contains no other text node.
      - GIVEN a user holds the role at page load and the role is revoked through the real Keycloak admin API mid-session, WHEN the next query fires in that E2E, THEN the boundary switches to `permission-denied` and the browser performs no navigation.
      - GIVEN a page renders `PermissionDenied`, WHEN the axe scan of GRD-UI-06 runs on that surface, THEN there is no `serious` or `critical` violation.

      **See:** RND-UI-01, IDN-02, IDN-05, ADM-UI-01, GRD-UI-06
