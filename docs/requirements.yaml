  MIG-01:
    id: MIG-01
    title: Platform migration control table
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL record platform migration state in a single cross-tenant control table `platform.platform_migrations`, holding one row per `(migration_id, tenant_id)` with `status` in `pending`, `done`, `failed`, plus `error_msg`, `completed_at` and `run_id`. The table carries `UNIQUE (migration_id, tenant_id)` as the upsert anchor and the partial index `platform_migrations_resume_idx ON (migration_id, status) WHERE status IN ('pending','failed')` covering the resume query. This replaces reliance on the per-schema `schema_migrations` table as the only record of migration state.

      **Acceptance Criteria:**
      - GIVEN a fanout begins, WHEN the control rows are seeded, THEN exactly one row exists per enabled tenant at `status = 'pending'`, keyed by `(migration_id, tenant_id)`.
      - GIVEN the table is created, WHEN its constraints are inspected, THEN `UNIQUE (migration_id, tenant_id)` exists and `status` is constrained by a CHECK over exactly `pending`, `done`, `failed`.
      - GIVEN the resume query runs, WHEN its plan is inspected, THEN it uses `platform_migrations_resume_idx`.
      - GIVEN a tenant fails, WHEN its row is written, THEN `error_msg` carries the SQLSTATE and the message text and `completed_at` is null.
      - GIVEN a tenant succeeds, WHEN its row is written, THEN `completed_at` is set and `error_msg` is null.

      **See:** SPT-01, MIG-02, MIG-04, MIG-05, ENV-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T07:15:36Z'
    workflow: PW-04
    implemented_in:
    - migrations/1144_platform_migrations_control_table.sql
    test_spec: tests/specs/MIG-01.md
    test_run: tests/reports/report-20260811-WF02-batch-0.yaml
    released_at: '2026-08-11T07:15:36Z'
  MIG-02:
    id: MIG-02
    title: Control row commits with the DDL
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL upsert a tenant's `platform.platform_migrations` row to `done` inside the same transaction that applies that tenant's DDL steps, so a `done` row proves the DDL committed. A per-tenant failure is recorded as `status = 'failed'` with `error_msg` in a separate transaction opened after the tenant transaction has rolled back.

      **Acceptance Criteria:**
      - GIVEN a tenant's DDL commits, WHEN the transaction ends, THEN the `done` row committed in that same transaction.
      - GIVEN a DDL statement raises, WHEN the transaction ends, THEN it rolls back and neither partial DDL nor a `done` row survives in that schema.
      - GIVEN the tenant transaction rolled back, WHEN the failure is recorded, THEN `status = 'failed'` and `error_msg` are written in their own transaction.
      - GIVEN the failure-recording transaction itself fails, WHEN the fanout continues, THEN the row remains `pending` and the MIG-04 resume query covers it.
      - No code path writes a tenant's control row on a connection other than the one applying that tenant's DDL.

      **See:** MIG-01, MIG-03, MIG-04, MIG-05, SPT-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T07:15:38Z'
    workflow: PW-04
    implemented_in:
    - migrations/1144_platform_migrations_control_table.sql
    - src/platform/migration_fanout.zig
    test_spec: tests/specs/MIG-02.md
    test_run: tests/reports/report-20260811-WF02-batch-0.yaml
    released_at: '2026-08-11T07:15:38Z'
  MIG-03:
    id: MIG-03
    title: Tenant migration fanout with continue on failure
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL apply a migration across a snapshot of enabled tenants ordered by `tenant_id`, holding `pg_try_advisory_lock(hashtext(migration_id))` on the platform database for the duration of the run. A failure in tenant N SHALL NOT prevent tenants N+1 through M from being attempted; per-tenant errors are collected and the run continues to the end of the snapshot.

      **Acceptance Criteria:**
      - GIVEN tenant N fails, WHEN the run continues, THEN tenants N+1 through M are still attempted and each has a `done` or `failed` row when the run ends.
      - GIVEN the advisory lock for `migration_id` is already held, WHEN a second run is requested, THEN the platform returns HTTP 409 `MigrationAlreadyRunning`.
      - GIVEN two different `migration_id` values, WHEN both are run, THEN they may execute concurrently because the lock key is derived from `migration_id`.
      - GIVEN a tenant is created after the snapshot is taken, WHEN it is provisioned, THEN the tenant onboarding path applies the full migration set and inserts `done` rows, so the tenant is not left behind by the concurrent fanout.
      - GIVEN the snapshot is exhausted, WHEN the run returns, THEN the response carries `{run_id, done, failed, pending}` counts.

      **See:** SPT-01, MIG-01, MIG-02, MIG-04, MIG-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T07:15:39Z'
    workflow: PW-04
    implemented_in:
    - migrations/1144_platform_migrations_control_table.sql
    - src/platform/migration_fanout.zig
    test_spec: tests/specs/MIG-03.md
    test_run: tests/reports/report-20260811-WF02-batch-0.yaml
    released_at: '2026-08-11T07:15:39Z'
  MIG-04:
    id: MIG-04
    title: Migration resume for pending and failed tenants
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL provide `POST /api/v1/admin/migrations/{migration_id}/resume`, which applies the migration only to tenants whose control row is `pending` or `failed`, reading that set through `platform_migrations_resume_idx`. Tenants whose row is `done` are never re-applied.

      **Acceptance Criteria:**
      - GIVEN rows in `done`, `pending` and `failed`, WHEN resume runs, THEN DDL is applied to the `pending` and `failed` tenants only.
      - GIVEN every row for the migration is `done`, WHEN resume runs, THEN it executes no DDL and returns zero counts.
      - GIVEN resume selects its tenant set, WHEN the query plan is inspected, THEN it reads through `platform_migrations_resume_idx`.
      - GIVEN a resume run, WHEN tenants are processed, THEN they are processed in `tenant_id` order, so the failure list is reproducible between a run and its resume.
      - Resume applies the MIG-02 rule: each tenant's control row is upserted in the same transaction as that tenant's DDL.

      **See:** MIG-01, MIG-02, MIG-03, MIG-05, MIG-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T11:18:12Z'
    workflow: PW-04
    implemented_in:
    - src/platform/migration_fanout.zig
    test_spec: tests/specs/MIG-04.md
    test_run: tests/reports/report-20260811-WF02-batch-1.yaml
    released_at: '2026-08-11T11:18:12Z'
  MIG-05:
    id: MIG-05
    title: Idempotent migration re-run
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL make a migration run idempotent through `ON CONFLICT (migration_id, tenant_id) DO UPDATE ... WHERE status != 'done'`. Re-running a completed migration is a no-op for tenants already `done`, and opens no transaction against their schemas. A migration file is frozen once any tenant holds a `done` row for its `migration_id`.

      **Acceptance Criteria:**
      - GIVEN a migration completed for a tenant, WHEN the migration is run again, THEN no DDL executes for that tenant and its `completed_at` is unchanged.
      - GIVEN a tenant row in `failed`, WHEN the migration is run again, THEN the tenant is re-attempted and its row is updated.
      - GIVEN a tenant row in `done`, WHEN the seeding step of a re-run executes, THEN the conflict clause leaves `status`, `completed_at` and `error_msg` untouched and does not move the row back to `pending`.
      - GIVEN a tenant row in `done`, WHEN the fanout loop reaches that tenant, THEN it is skipped without opening a transaction against that tenant schema.
      - GIVEN any tenant holds a `done` row for `migration_id`, WHEN the migration file content changes, THEN the change is rejected and a new `migration_id` is required.

      **See:** MIG-01, MIG-02, MIG-03, MIG-04, MIG-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T11:18:13Z'
    workflow: PW-04
    implemented_in:
    - src/platform/migration_fanout.zig
    test_spec: tests/specs/MIG-05.md
    test_run: tests/reports/report-20260811-WF02-batch-1.yaml
    released_at: '2026-08-11T11:18:13Z'
  MIG-06:
    id: MIG-06
    title: Migration admin surface and fix-forward policy
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > The platform SHALL expose a migration admin surface requiring the platform-operator role: `POST /api/v1/admin/migrations/run` to start a fanout, `GET /api/v1/admin/migrations/{migration_id}/status` returning aggregate `pending`, `done` and `failed` counts with a per-tenant list carrying `error_msg` and `completed_at`, and `POST /api/v1/admin/migrations/{migration_id}/resume`. A defective migration is corrected by authoring a new `migration_id` that fixes forward; issuing compensating DDL across tenant schemas is prohibited, because a partial compensation leaves schemas divergent.

      **Acceptance Criteria:**
      - GIVEN a caller without the platform-operator role, WHEN it calls run, status or resume, THEN the platform returns HTTP 403.
      - GIVEN a `migration_id` matching no file in the migration set, WHEN run is called, THEN the platform returns HTTP 404 `UnknownMigration` and writes no control rows.
      - GIVEN a fanout that ended with failures, WHEN status is called, THEN the response carries the three counts and a per-tenant list with `error_msg` and `completed_at`.
      - GIVEN a defective migration already applied to some tenants, WHEN it is corrected, THEN the correction is a new `migration_id` with its own fanout and no reverse DDL is issued across tenant schemas.
      - GIVEN any migration has outstanding `pending` rows, WHEN the application starts, THEN it refuses to serve traffic and names the migration.

      **See:** SPT-01, MIG-01, MIG-03, MIG-04, API-06
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T11:18:15Z'
    workflow: PW-04
    implemented_in:
    - src/api/routes/platform_migrations.zig
    - src/operations/pending_migration_gate.zig
    test_spec: tests/specs/MIG-06.md
    test_run: tests/reports/report-20260811-WF02-batch-1.yaml
    released_at: '2026-08-11T11:18:15Z'
  OBP-01:
    id: OBP-01
    title: Outbox depth cap and cached depth counter
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > The outbox SHOULD have a per-tenant depth cap `BPM_OUTBOX_DEPTH_CAP`, read from the environment at startup with a default of 50000 and never inferred from disk, memory, or observed throughput. Depth SHALL be read from a cached counter that the outbox drainer refreshes every 250 ms; no request path SHALL issue `SELECT count(*) FROM plat_outbox`. A cached value older than 5 s SHALL be treated as at-cap.

      **Acceptance Criteria:**
      - GIVEN the drainer is running, WHEN it completes a publish cycle, THEN it writes the current pending-row count to the shared counter, and the counter is no more than 250 ms behind the table.
      - GIVEN an ingress request, WHEN the depth check runs, THEN it reads one cached integer and adds under 1 ms to the request; no `count(*)` is executed on the request path.
      - GIVEN the counter has not been refreshed for more than 5 s, WHEN the depth check runs, THEN depth is treated as at-cap and the gate closes; loss of depth visibility closes ingress rather than opening it.
      - GIVEN two tenants, WHEN one reaches its cap, THEN the other tenant's depth, gate state, and refusal counters are unaffected; all of them are keyed per tenant schema.
      - `BPM_OUTBOX_DEPTH_CAP` and `BPM_OUTBOX_LOW_WATER` are documented in `.env.example` with their defaults and their empty-value behaviour.

      **See:** OBP-02 (external refusal reading this depth), OBP-03 (internal overflow reading this depth), OBP-04 (the hysteresis gate), API-10 (rate limiting, a separate control on a different dimension)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:24Z'
    workflow: PW-08
  OBP-02:
    id: OBP-02
    title: External ingress refusal before transaction
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > **Extends:** API-10, adding a capacity-driven refusal distinct from rate limiting.

      > When outbox depth is at or above the cap, external ingress SHALL be refused with HTTP 429 and header `Retry-After: 5`, returned by middleware before `BEGIN` is issued, before a pool connection is taken, and before the idempotency key is recorded. The response body SHALL be `{"error":"outbox_at_capacity","depth":<n>,"cap":<n>}`. A refused request SHALL leave the caller's idempotency key unused.

      **Acceptance Criteria:**
      - GIVEN depth is at the cap, WHEN an external caller posts to ingress with idempotency key K, THEN the response is 429 with `Retry-After: 5`, and no row for K exists in `plat_idempotency_key`.
      - GIVEN the same caller retries with key K after the gate reopens, WHEN the request is handled, THEN it is processed as a first attempt and not as a replay of a request that never ran.
      - GIVEN a refused request, WHEN the database is inspected, THEN no transaction was opened and no connection was taken from the pool for that request.
      - GIVEN outbox capacity is reached, WHEN a refusal is emitted, THEN the status code is 429 and never 400, 500, or 503; capacity is a throttling condition, not a client error and not a server fault.
      - GIVEN a 429 is emitted on this path without the `Retry-After` header, WHEN the response is validated, THEN it is recorded as a defect; the header is unconditional.
      - Every refusal appends `EXECUTION_INGRESS_REFUSED` carrying tenant, depth, and cap.

      **See:** OBP-01 (the depth this reads), OBP-03 (the internal counterpart), OBP-04, API-10, DB-02 (no pooled connection is taken by a refused request)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:25Z'
    workflow: PW-08
  OBP-03:
    id: OBP-03
    title: Typed outbox overflow on internal emit
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > An internal emit runs inside a step transaction and has no response to write, so it SHALL NOT be refused with a status code. When outbox depth is at or above the cap, `outbox.emit()` SHALL return the typed error `error.OutboxOverflow`, no outbox row SHALL be inserted, the step transaction SHALL roll back, and the node's configured retry policy and the existing dead letter path SHALL handle it. `OutboxOverflow` SHALL appear in the declared error set of `outbox.emit()` and of every caller.

      **Acceptance Criteria:**
      - GIVEN depth is at the cap, WHEN a SERVICE_TASK step calls `outbox.emit()`, THEN it returns `error.OutboxOverflow`, no row is inserted into `plat_outbox`, and every other write of that step is discarded by the rollback.
      - GIVEN a caller of `outbox.emit()` omits `OutboxOverflow` from its declared error set, WHEN the build runs, THEN it fails with an error-set diagnostic; the variant is never absorbed by `catch unreachable` and never mapped to a generic failure.
      - GIVEN a step fails with `OutboxOverflow`, WHEN retries are scheduled, THEN the node's existing retry policy and backoff apply unchanged; no separate retry mechanism and no separate rate limiter is introduced for this path.
      - GIVEN a runaway producer, WHEN its steps fail and back off, THEN its own emit rate falls, so the producer throttles itself while the drainer catches up.
      - GIVEN retry attempts are exhausted while depth stays at the cap, WHEN the step is dead-lettered, THEN the instance transitions to `failed` and the dead letter entry carries `OutboxOverflow`, the attempt count, and the depth observed at each attempt.
      - GIVEN a dead-lettered instance is retried after the gate reopens, WHEN it resumes, THEN it runs against the definition version pinned at instance start (PD-08).

      **See:** OBP-01, OBP-02 (the external counterpart), OBP-04, OBS-05 (dead letter queue), PD-08 (the pinned version used on retry)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:26Z'
    workflow: PW-08
  OBP-04:
    id: OBP-04
    title: Outbox gate hysteresis and escalation
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > The ingress gate SHALL close at `BPM_OUTBOX_DEPTH_CAP` and reopen only when depth falls to `BPM_OUTBOX_LOW_WATER`, fixed at 80 per cent of the cap with a default of 40000. It SHALL NOT reopen at the cap itself. Gate state SHALL be recorded per tenant in `plat_outbox_gate` with the timestamp of the last transition, and each reopen SHALL append `EXECUTION_OUTBOX_GATE_OPENED` carrying the duration the gate was closed.

      **Acceptance Criteria:**
      - GIVEN the cap is 50000 and depth oscillates between 49999 and 50001, WHEN requests arrive, THEN the gate stays closed until depth reaches 40000; it does not flip open and closed per request.
      - GIVEN the gate is closed and the drainer reduces depth to 40000, WHEN the next external request arrives, THEN it is accepted and `EXECUTION_OUTBOX_GATE_OPENED` is appended with the closed duration.
      - GIVEN the gate opens and closes within one 250 ms refresh interval, WHEN the transition is observed, THEN it is recorded as a defect indicating the low-water mark has been set equal to the cap, and the 80 per cent hysteresis is restored.
      - GIVEN more than 100 refusals in one minute for a single tenant, WHEN the rate is evaluated, THEN Platform Admin is escalated, because the drainer is not keeping pace with the emit rate.
      - GIVEN the gate has been closed for more than 300 s, WHEN the duration is evaluated, THEN Platform Admin is paged, the drainer is restarted, and the closed duration is recorded.
      - Gate state is keyed per tenant schema, so one tenant's depth never refuses another tenant's ingress.

      **See:** OBP-01 (cached depth and per-tenant keying), OBP-02 (the refusals counted here), OBP-03, OBS-05
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:27Z'
    workflow: PW-08
  ORD-01:
    id: ORD-01
    title: Effect completion claim guard
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > A BPM Consumer SHALL claim a pending effect completion with `SELECT completion_id, correlation_id, sequence_no FROM plat_effect_completion WHERE status = 'PENDING' ORDER BY correlation_id, sequence_no FOR UPDATE SKIP LOCKED LIMIT 1`, executed inside the transaction that will apply it. `SKIP LOCKED` guarantees no two consumers hold the same completion row. The claim guard SHALL NOT be relied on to serialise two different rows of the same correlation; that is the execute guard of ORD-02.

      **Acceptance Criteria:**
      - GIVEN 8 consumers polling and one `PENDING` row, WHEN they claim concurrently, THEN exactly one consumer receives the row and the other 7 receive no row; none blocks waiting for the lock.
      - GIVEN every `PENDING` row is already locked by another consumer, WHEN a consumer claims, THEN it receives no row, sleeps 200 ms, and repeats without raising an error.
      - GIVEN a consumer process is killed while holding a claim, WHEN its backend exits, THEN the row lock is released with the transaction and the row returns to `PENDING` without operator action.
      - GIVEN two `PENDING` rows of the same `correlation_id` with `sequence_no` 5 and 6, WHEN two consumers claim concurrently, THEN both claims succeed because they are different rows; ordering is decided downstream by ORD-02 and ORD-03, not here.
      - The claim is ordered by `(correlation_id, sequence_no)`, so a consumer that wins a correlation takes its lowest outstanding sequence first.

      **See:** ORD-02 (execute guard), ORD-03 (order guard), ORD-04, DB-02 (one pooled connection per claim transaction)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T14:00:44Z'
    workflow: PW-07
    implemented_in:
    - src/ordering/mod.zig
    - src/ordering/cursor.zig
    - src/ordering/consumer.zig
    - src/ordering/observability.zig
    - migrations/1145_ord01_plat_effect_completion.sql
    test_spec: tests/specs/ORD-01.md
    test_run: tests/reports/report-20260811-WF02-batch-2.yaml
    released_at: '2026-08-11T14:00:44Z'
  ORD-02:
    id: ORD-02
    title: Per-correlation execute guard
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > Inside the claim transaction a BPM Consumer SHALL evaluate `SELECT pg_try_advisory_xact_lock(hashtext(correlation_id)::bigint)` before applying a completion. A `false` result SHALL cause an immediate `ROLLBACK`, returning the row to `PENDING` without incrementing any retry counter, and the consumer SHALL move to another correlation. The lock is transaction-scoped and SHALL NOT be released by an explicit unlock call.

      **Acceptance Criteria:**
      - GIVEN consumer A is applying a completion for correlation X, WHEN consumer B claims another completion for correlation X, THEN B's `pg_try_advisory_xact_lock` returns `false`, B rolls back, and B claims work for a different correlation within the same poll cycle.
      - GIVEN the try-variant is used, WHEN a consumer loses the guard, THEN it does not block; `pg_advisory_xact_lock` is never called on this path, so no pooled connection is held waiting.
      - GIVEN a consumer crashes mid-apply, WHEN its backend exits, THEN the advisory lock is released by the transaction abort and the correlation becomes available to another consumer without operator action.
      - GIVEN two distinct `correlation_id` values whose `hashtext` results collide, WHEN both are claimed, THEN one waits for the other and throughput falls, but neither is misapplied: ordering is decided by the per-correlation cursor of ORD-03, not by the lock key.
      - GIVEN a completion commits, WHEN the transaction ends, THEN the advisory lock is released at `COMMIT` and the successor becomes eligible on the next claim.

      **See:** ORD-01 (claim guard), ORD-03 (order guard evaluated while this lock is held), ORD-04, DB-02
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T14:00:48Z'
    workflow: PW-07
    implemented_in:
    - src/ordering/mod.zig
    - src/ordering/cursor.zig
    - src/ordering/consumer.zig
    - src/ordering/observability.zig
    test_spec: tests/specs/ORD-02.md
    test_run: tests/reports/report-20260811-WF02-batch-2.yaml
    released_at: '2026-08-11T14:00:48Z'
  ORD-03:
    id: ORD-03
    title: Sequence order guard and gap sweeping
    stage: '16'
    priority: SHOULD
    status: DRAFT
    body: |-
      > A completion SHOULD be applied only when `sequence_no = applied_seq + 1`, where `applied_seq` is read from `plat_correlation_cursor` for that `correlation_id` while the execute guard of ORD-02 is held. A completion that is not next in sequence SHALL cause a silent `ROLLBACK` with no error and no retry-count increment, leaving the row `PENDING`. The apply and the cursor advance `UPDATE plat_correlation_cursor SET applied_seq = $2 WHERE correlation_id = $1 AND applied_seq = $2 - 1` SHALL commit in one transaction.

      **Acceptance Criteria:**
      - GIVEN `applied_seq = 4` for correlation X and the completion for sequence 6 arrives before sequence 5, WHEN sequence 6 is claimed, THEN it is not applied, the transaction rolls back silently, its retry counter is unchanged, and the row remains `PENDING`.
      - GIVEN sequence 5 then arrives, WHEN it is applied, THEN `applied_seq` advances to 5 and sequence 6 is applied on the next claim, so the engine observes 5 before 6.
      - GIVEN the conditional cursor update reports 0 updated rows, WHEN the consumer evaluates it, THEN the transaction rolls back and the completion is re-claimed; this guard makes a double-apply impossible even if both other guards were bypassed.
      - GIVEN the apply raises a typed engine error, WHEN the transaction rolls back, THEN neither the instance state change nor the cursor advance is committed, so applied state and `applied_seq` cannot diverge.
      - GIVEN a successor has been `PENDING` for longer than `gap_timeout_seconds` (default 300) while its predecessor is absent, WHEN the gap sweeper runs on its 60 s cadence, THEN every `PENDING` row of that correlation moves to `status = 'DEAD'` and is routed to the dead letter queue as one unit, so no correlation is left half-applied.
      - GIVEN the Effects Worker re-inserts an existing `(correlation_id, sequence_no)`, WHEN the insert runs, THEN it is absorbed by `ON CONFLICT DO NOTHING` and no second apply occurs.

      **See:** ORD-01, ORD-02 (the lock under which the cursor is read and advanced), ORD-04, OBS-05 (dead letter queue receiving a swept correlation)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-07T16:10:30Z'
    workflow: PW-07
  ORD-04:
    id: ORD-04
    title: Cross-correlation parallelism and lag metrics
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > Completions belonging to different `correlation_id` values SHALL continue to be applied in parallel: distinct correlations take distinct advisory lock keys and distinct `plat_correlation_cursor` rows, so `consumer_count` correlations (default 8) are applied concurrently. The platform SHALL expose per-correlation lag `max(sequence_no) - applied_seq`, the age of the oldest `PENDING` row, and the rate at which the execute guard of ORD-02 returns `false`.

      **Acceptance Criteria:**
      - GIVEN 8 correlations each holding a pending completion that is next in sequence, WHEN 8 consumers poll, THEN all 8 are applied concurrently and none is serialised behind another.
      - GIVEN per-correlation lag exceeds 100 unapplied completions, WHEN the sweeper evaluates it, THEN `EXECUTION_CORRELATION_LAG` is appended carrying the `correlation_id`, the lag, and the age of the oldest `PENDING` row, and Platform Admin is escalated.
      - GIVEN the execute guard returns `false` for more than 50 per cent of claim attempts in one minute, WHEN contention is evaluated, THEN `EXECUTION_CORRELATION_CONTENTION` is appended and `consumer_count` is reduced by 2 with a floor of 2.
      - GIVEN a correlation is dead-lettered, WHEN the escalation is raised, THEN it names the `correlation_id` and lists every unapplied `sequence_no`, so the missing emit is identifiable without querying the table.
      - Every applied completion appends `EXECUTION_EFFECT_APPLIED` carrying `correlation_id` and `sequence_no`, so apply order is auditable from the event log alone.

      **See:** ORD-01, ORD-02, ORD-03, OBS-05, PAR-01 (these events are appended to the partitioned event log)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T14:00:51Z'
    workflow: PW-07
    implemented_in:
    - src/ordering/mod.zig
    - src/ordering/cursor.zig
    - src/ordering/consumer.zig
    - src/ordering/observability.zig
    - migrations/1146_ord04_plat_correlation_cursor.sql
    test_spec: tests/specs/ORD-04.md
    test_run: tests/reports/report-20260811-WF02-batch-2.yaml
    released_at: '2026-08-11T14:00:51Z'
  PAR-01:
    id: PAR-01
    title: Monthly range partitioning of the event log
    stage: '16'
    priority: MUST
    status: RELEASED
    body: |-
      > **Extends:** ES-07, replacing the row-by-row archival move with a partition lifecycle.

      > The `events` and `events_archive` tables SHALL be declared `PARTITION BY RANGE (created_at)` with one partition per calendar month, named `events_YYYY_MM`. Because PostgreSQL requires the partition key to appear in every unique constraint, the primary key SHALL widen from `event_id` to `(event_id, created_at)`. Global `idempotency_key` uniqueness SHALL be preserved by the separate non-partitioned table `plat_event_idempotency (idempotency_key TEXT PRIMARY KEY, event_id UUID, created_at TIMESTAMPTZ)`, written in the same transaction as every append.

      **Acceptance Criteria:**
      - GIVEN the converted schema, WHEN `events` is inspected, THEN its partition strategy is RANGE on `created_at`, its primary key is `(event_id, created_at)`, and one partition exists for every calendar month covered by the data.
      - GIVEN two appends supplying the same `idempotency_key` in different calendar months, WHEN the second is attempted, THEN it is rejected by the primary key of `plat_event_idempotency`; partitioning does not narrow idempotency to a per-month scope.
      - GIVEN an append, WHEN it commits, THEN the `events` row and the `plat_event_idempotency` row are written in one transaction; a failure of either rolls back both.
      - GIVEN an append whose `created_at` falls in a month with no attached partition, WHEN it executes, THEN it fails with `PartitionMissingForWrite` and a structured error rather than being routed to another partition.
      - Every partition of `events` and `events_archive` carries the index `(instance_id, sequence_num)`, so per-partition access preserves the ordering reconstruction depends on.

      **See:** ES-07 (the archival requirement this supersedes), ADP-11 (the protected event types), PAR-04 (partition constraints), PAR-05 (the conversion), PAR-06 (reconstruction bounding), DB-01
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T18:38:39Z'
    workflow: PW-06
    implemented_in:
    - migrations/1147_par01_events_partitioning.sql
    - src/event_store/store.zig
    - src/api/errors.zig
    test_spec: tests/specs/PAR-01.md
    test_run: tests/reports/report-20260811-WF02-batch-3.yaml
    tested_at: '2026-08-11T18:24:52Z'
    release_run: WF02-batch-3-20260811
    release_decision: docs/status/release-stage16-WF02-batch-3-20260811.yaml
    released_at: '2026-08-11T18:38:39Z'
  PAR-02:
    id: PAR-02
    title: Proactive future partition creation
    stage: '16'
    priority: MUST
    status: TESTED
    body: |-
      > The scheduler SHALL run `plat_partition_maintenance` daily at 00:15 UTC in every tenant schema and SHALL keep `lead_months` future monthly partitions attached at all times, default 2. Partition creation SHALL be idempotent: creating a partition that already exists and is attached is a no-op. No append SHALL ever be the operation that creates a partition.

      **Acceptance Criteria:**
      - GIVEN today is the 20th of month N and partitions exist through month N, WHEN `plat_partition_maintenance` runs, THEN partitions for months N+1 and N+2 are created and attached before the job returns.
      - GIVEN `plat_partition_maintenance` runs twice within the same day, WHEN the second run executes, THEN it creates nothing, raises no error, and leaves the partition set unchanged.
      - GIVEN the count of attached future partitions falls to 1, WHEN maintenance evaluates lead time, THEN a WARN is raised; falling to 0 raises a BLOCKER before any append can fail with `PartitionMissingForWrite`.
      - GIVEN the maintenance run is missed because the platform was down, WHEN the platform restarts, THEN the run is recovered on the SCH-05 path and the full lead horizon is restored before ingress resumes.
      - Each creation appends `EXECUTION_PARTITION_CREATED` carrying the partition name and its range bounds.

      **See:** PAR-01 (the partitioned tables), PAR-04 (constraints declared at creation time), SCH-05 (recovery of a missed maintenance run), DDL-01 (partition DDL passes the validator first)
    body_source: backlog-migration-20260807
    alt_sources: []
    type: requirement
    last_updated: '2026-08-11T18:38:46Z'
    workflow: PW-06
    note: AC1/AC2/AC3/AC4 met; AC5 (EXECUTION_PARTITION_CREATED event emission) NOT MET -- zero call sites
      in src/, confirmed by grep. Tracked as ISS-0670 / GH-711 (OPEN, MAJOR). Held at TESTED, not RELEASED,
      until AC5 is implemented -- see docs/status/release-stage16-WF02-batch-3-20260811.yaml for RELEASE-VALIDATOR's
      full reasoning.
