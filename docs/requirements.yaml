  PI-09:
    id: PI-09
    title: Operations runbook and fail-fast startup assertion
    stage: '17'
    priority: SHOULD
    status: RELEASED
    body: |-
      **PI-09 — Operations Runbook + Fail-Fast Startup Assertion**

      **GIVEN** a BPM service instance is starting up after `db_pool.Pool.init`,
      **WHEN** `assertDatabaseConfiguration` runs against the connected database,
      **THEN** the service:
      1. Reads the PostgreSQL server version and rejects it if < 14.
      2. Verifies the `pg_trgm` extension is installed.
      3. Verifies the `public` schema contains zero application tables.
      4. On any failure, emits a single FATAL log line via `obs_logger` with a deterministic, alert-pinable text, and exits the process with `EX_CONFIG` (78) before opening any HTTP listener.
      5. On success, returns to the caller so the rest of `main.zig` proceeds to `provisionTenantSchema` and the API server.
      6. Is exercised by `tests/integration/startup_assertions_test.zig` (5/5 PASS), which captures the FATAL log line via `obs_logger` test sink.

      **AND** an operations runbook at `docs/runbook/OPERATIONS.md` documents every required environment variable, the database version/extension expectations, and the recovery procedure for each failure path documented above.
    body_source: reqctl-add
