    title: Formalized per-node retry policy
    stage: BRW — Borrowing from ASCOA-GO
    priority: MUST
    status: DRAFT
    body: |-
      > **Extends:** BRW-OPS-3, per docs/addon-2/03-implementation-order.md's Track ordering.

