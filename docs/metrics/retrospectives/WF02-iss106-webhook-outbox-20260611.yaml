estimation_rule_update_needed: true
estimation_rule_update_rationale: >
  Two consecutive D=2 runs (ISS-101 and ISS-106) show consistent directional bias
  for several steps exceeding the ±25% threshold, warranting estimation rule
  adjustments per docs/agents/metrics.md §6.

step_analysis:
  code-designer: >
    Over by 60% (3.2 min vs 2 min est). The design work involved reconciling the
    existing webhook_deliveries table (created across multiple prior migrations)
    against the architecture contract — requiring more research than a greenfield design.

  code-design-validator: >
    Under by -85% (1.2 min vs 8 min est). The artefact was a single-page migration
    spec with no graph changes, making validation very fast. Matches ISS-101 pattern
    at D=2 (-86%).

  backend-dev: >
    Over by 92.5% (7.7 min vs 4 min est). Implementation required more than just
    writing the migration SQL: BACKEND-DEV also fixed pre-existing migration-tracking
    drift under the Unblock-Everything directive, adding time. The core migration work
    was straightforward (additive ALTER TABLE), but the latent drift fix absorbed extra
    effort.

  test-designer: >
    Over by 320% (4.2 min vs 1 min est). The estimate of 1 min at D=2 is structurally
    too low: even simple integration tests require test scaffolding, UUID fixtures,
    and per-tenant schema setup code. ISS-102 at D=3 showed similar test-designer
    overrun (+56%), suggesting the D=2 estimate needs revision.

  test-design-validator: >
    Under by -90.8% (1.1 min vs 12 min est). 12 min for validating 5 integration tests
    on a single migration is excessive at D=2. Matches ISS-101 pattern (-92.9%).

  test-runner: >
    Over by 160% (2.6 min vs 1 min est). The test-runner estimate of 1 minute at D=2
    is structurally too low — it does not account for DB provisioning, per-tenant
    schema setup, and zig compilation overhead (10-20 min typical). ISS-101 also had
    massive test-runner overrun (+2068%).

  release-validator: >
    On target at +10% (1.1 min vs 1 min est). Release validation was straightforward
    with all acceptance criteria having clear integration-test evidence.

  doc-updater: >
    Over by 335% (8.7 min vs 2 min est). This handoff was previously dispatched and
    hit the session limit mid-task, requiring a full re-dispatch. The 2-minute estimate
    does not account for: reading multiple input artefacts (release decision, test report,
    estimation JSON), writing 3 separate output files (CHANGELOG, requirement status,
    retrospective), and running the retrospective analysis procedure.

estimation_rule_adjustments:
  - step: code-design-validator
    difficulty: 2
    old_estimate: 8
    new_estimate: 5
    reason: >
      Observed 2 consecutive D=2 runs (ISS-101 -86%, ISS-106 -85%) with >25% under.
      Adjustment factor 0.575 applied: 8 * 0.575 = 4.6, rounded to 5.

  - step: backend-dev
    difficulty: 2
    old_estimate: 4
    new_estimate: 6
    reason: >
      Observed 2 consecutive D=2 runs (ISS-101 +131.7%, ISS-106 +92.5%) with >25% over.
      Adjustment factor 1.4625 applied: 4 * 1.4625 = 5.85, rounded to 6.

  - step: test-design-validator
    difficulty: 2
    old_estimate: 12
    new_estimate: 7
    reason: >
      Observed 2 consecutive D=2 runs (ISS-101 -92.9%, ISS-106 -90.8%) with >25% under.
      Adjustment factor 0.546 applied: 12 * 0.546 = 6.55, rounded to 7.

  - step: test-runner
    difficulty: 2
    old_estimate: 1
    new_estimate: 2
    reason: >
      Observed 2 consecutive D=2 runs (ISS-101 +2068%, ISS-106 +160%) with >25% over.
      Adjustment factor 1.8 applied: 1 * 1.8 = 1.8, rounded to 2. The D=2 test-runner
      estimate is structurally too low: compilation + DB provisioning overhead alone
      takes >1 min even for zero tests.

