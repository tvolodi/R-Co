summary: >
  ADHOC run to complete ISS-103 pipeline after migration rename rework.
  The original migration file (087_iss103_audit_resource_id_text_tenant.sql)
  was renamed to GBL-081_iss103_audit_resource_id_text.sql during rework,
  which caused tenant schemas to miss the resource_id UUID-to-TEXT conversion.
  New migration files (089, 090, GBL-091) were created to apply the fix to
  both public and tenant schemas. Audit chain function signatures were updated
  to accept TEXT resource_id. DROP FUNCTION IF EXISTS was added before
  CREATE OR REPLACE FUNCTION to handle parameter type changes.

