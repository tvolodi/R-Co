issues_encountered:
  - issue: OutOfOrderMigration after migration rename
    root_cause: >
      The renamed GBL-081 file had GBL prefix (public schema only).
      The old 087_ file was removed. Tenant schemas had migration 087 applied
      but the file was gone, creating an orphan. New non-GBL files (089, 090)
      restored tenant schema coverage.
    resolution: Created non-GBL migration files with order > max_applied_order.

  - issue: 'cannot change return type of existing function'
    root_cause: >
      CREATE OR REPLACE FUNCTION was used for functions whose parameter types
      changed from UUID to TEXT. PostgreSQL rejects this.
    resolution: Added DROP FUNCTION IF EXISTS ... CASCADE before each CREATE.

  - issue: typeof() not available in PostgreSQL 15
    root_cause: >
      TC-ISS-103-INT-01 used typeof(resource_id) which is not a standard
      PostgreSQL function. The correct function is pg_typeof().
    resolution: Changed typeof() to pg_typeof() in test source.

  - issue: Migration ordering conflict (GBL-089 before 090)
    root_cause: >
      The migrate tool updates max_applied_order during the loop, unlike the
      library function. GBL-089 (order 89) sorted after 090 (order 90) in
      lexicographic order, causing OutOfOrderMigration when max_applied_order
      became 90.
    resolution: Renamed GBL-089 to GBL-091 (order 91 > 90).

prevention_notes:
  - When renaming migration files, always check both public and tenant schema coverage
  - When changing function parameter types in migrations, always use DROP IF EXISTS first
  - Test SQL queries against the correct PostgreSQL version
  - GBL-prefix files only apply to public schema; tenant schemas need non-GBL copies
