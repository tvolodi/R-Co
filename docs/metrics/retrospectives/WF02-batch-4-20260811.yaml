adhoc_infrastructure_fix:
  trigger: >-
    109 orphaned public.tenant rows (storage_mode=SCHEMA, tenant_type=
    production, no matching tenant_schemas row -- the ISS-0605/GH-537
    half-provisioned pattern) had accumulated on the shared bpm_test
    container, discovered while preparing for Step 4's test run.
  what_was_tried_first: >-
    tools/verify_schema_baseline.py --auto-fix (re-applies the GBL-133
    iss0112 schema-ledger-reconcile migration) -- additive/idempotent, ran
    cleanly, but as expected did not address check_tenant_schemas_consistent
    since it only backfills ledger rows, never creates or prunes tenant rows.
  root_cause_and_new_defect: >-
    The already-designed self-heal (tools/clean_test_db.py's targeted DELETE
    for never-fully-provisioned tenant rows, wired into zig build
    test-env-verify's C4 check) reported exit 0 success but silently did
    nothing. Root-caused to a NEW, previously-unknown tooling defect: filed
    as ISS-0684/GH-729 (MAJOR) -- clean_test_db.py resolves psql via
    shutil.which("psql"), which on this host resolves to a WinGet .cmd shim
    that silently drops its -c SQL argument (reproduced directly via
    subprocess.run with explicit argv, no shell involved -- even a
    deliberately invalid query returns a fixed "1" with exit 0), so every
    mutating run_psql() call in that script was a silent no-op on this host.
  unblock: >-
    Ran the exact orphan-row DELETE SQL from clean_test_db.py verbatim
    (unmodified) directly via docker exec into the r-co-db_test-1 container's
    own real psql, bypassing the broken host-side shim -- removed exactly the
    109 orphan rows, no other data or schema changes.
  verification: >-
    python tools/verify_schema_baseline.py --check-tenants -> all 4 checks
    OK, exit 0. zig build test-env-verify (clean shell, no BPM_TEST_DB_URL/
    BPM_DB_URL overrides, loaded purely from .env) -> C0-C9 all PASS,
    "verify_test_env: HEALTHY -- 10 checks passed", exit 0.
  why_this_matters_for_the_pipeline: >-
    A genuinely new tooling defect (not a recurrence of a previously-tracked
    issue), found and fixed inline within its own dedicated ADHOC handoff
    rather than blocking Step 4, matching Unblock-Everything. Third
    consecutive Stage 16 batch run (after batch-2's ISS-0669, batch-3's
    ISS-0671) where a real infrastructure defect outside the batch's own
    requirement scope surfaced mid-run and had to be diagnosed under time
    pressure.

