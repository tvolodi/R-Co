prevention_notes:
  - >-
    Third consecutive Stage 16 batch run (after batch-2's ISS-0669, batch-3's
    ISS-0671) where a genuine infrastructure defect outside the batch's own
    requirement scope surfaced mid-run and had to be diagnosed under time
    pressure -- this run's (ISS-0684, the WinGet psql shim silently dropping
    -c arguments) is a NEW defect, not a recurrence, but continues the
    pattern of the shared long-lived bpm_test container and this host's
    Windows/WinGet toolchain producing a steady stream of environment-layer
    surprises independent of the actual feature work. Worth considering
    whether a one-time host-environment audit (verifying psql, docker, and
    other shelled-out tool resolutions are the real binaries, not shims)
    would catch this class of defect before it costs a mid-run diagnosis.
  - >-
    This run had by far the highest rework/finding density of any Stage 16
    batch to date (9 distinct catches: 1 security FAIL, 1 test-design-
    validator FAIL, 5 own-AC BLOCKER/MAJOR defects, 1 RELEASE-VALIDATOR own
    finding, 1 new infra defect). Every catch was made by the gate whose job
    it is to catch that class of problem (SECURITY-REVIEWER for tenant
    isolation, TEST-DESIGNER/TEST-DESIGN-VALIDATOR for implementation
    correctness and memory safety, RELEASE-VALIDATOR for release-readiness
    completeness), and every one was fixed within this same run's rework
    budget rather than deferred -- this is the pipeline working as intended
    under an unusually large implementation surface (4 requirements touching
    partition DDL, a new pinning subsystem, and event-window bookkeeping
    across 12 call sites), not a sign of process failure. Worth tracking
    whether PAR-05/PIN-01's combined surface (schema/DDL-adjacent plus a
    brand-new resolution subsystem, both tenant-scoped) is inherently higher-
    rework than prior batches' single-table partition-maintenance work, which
    would argue for scoping future batches with comparable surface more
    narrowly.
  - >-
    Second run in a row (after batch-3's PAR-02 AC5/PAR-03 AC6) where
    RELEASE-VALIDATOR's own independent Step 5 verification -- not any
    upstream gate -- caught the specific gap that determined the release
    marking (this run: PAR-05's events_legacy archival-integration gap,
    ISS-0686/GH-733). This is not evidence of an upstream gate failing; it
    is evidence Step 5's independent-verification discipline is earning its
    keep by design, catching a class of gap (design-document prose that was
    never converted into a tracked issue) that no earlier gate is scoped to
    check. Worth considering whether CODE-DESIGN-VALIDATOR's Step 1b review
    should include a check for "Open questions" sections in the design
    document that describe deferred behavior without a corresponding tracked
    issue, closing this gap one step earlier in future runs.

