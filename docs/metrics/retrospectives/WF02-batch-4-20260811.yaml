summary: >-
  WF-02 feature-development run implementing Stage 16's fifth batch (PW-06
  event-store partitioning continued, plus PIN-01/PIN-02's new dependency-
  pinning subsystem). PAR-05 implements online conversion of the live events
  table to a partitioned events_part table (coverage validation, resumable
  per-month backfill absorbing duplicates via ON CONFLICT DO NOTHING,
  transactional swap under lock_timeout, and reconcileOrRollback() with
  inverse-rename on mismatch). PAR-06 bounds instance-reconstruction queries
  by a maintained first_event_at/last_event_at window, merging live and
  events_archive results by sequence_number and pruning to exactly one
  partition per instance month. PIN-01 (scoped to AC3/AC4/AC5 only, AC1/AC2
  explicitly deferred at design time -- see pin_01_scope_decision below)
  resolves variable_schema and pin_overrides deterministically. PIN-02 records
  the resolved pin set directly in the INSTANCE_STARTED event payload, making
  the event log itself the sole record of record. This run had the deepest
  and most eventful pipeline of any Stage 16 batch to date: a SECURITY-REVIEWER
  FAIL->fix->PASS cycle on a genuine cross-tenant data leak (INV-1), a
  TEST-DESIGNER pass that surfaced 5 further own-AC BLOCKER/MAJOR defects
  requiring 3 additional BACKEND-DEV rework cycles, a TEST-DESIGN-VALIDATOR
  FAIL on a memory-safety double-free crash discovered independently of
  SECURITY-REVIEWER's own review, a mid-run ADHOC infrastructure fix (109
  orphaned tenant schemas plus a newly-discovered broken psql-shim tooling
  defect), and RELEASE-VALIDATOR's own additional finding (PAR-05's
  events_legacy archival-integration gap) at Step 5, not caught by any
  earlier gate. RELEASE-VALIDATOR (Step 5) returned PARTIAL: PAR-06 and
  PIN-02 approved RELEASED in full; PAR-05 and PIN-01 held at TESTED
  (tested-with-known-gap), matching the same release-marking pattern
  batch-3 used for PAR-02/PAR-03, with met/unmet ACs enumerated explicitly
  per requirement. DOC-UPDATER (this step) is recording that split
  accurately in docs/requirements.yaml, CHANGELOG.md, and this retrospective.

  Five notable events this run, in the order they occurred: (1) the PIN-01
  scope decision at Step 1/1b (AC1/AC2 marked deliberately out of scope,
  tracked ISS-0672/GH-306) -- a design-time choice, not a defect, but one
  RELEASE-VALIDATOR explicitly flagged needs a different qualitative framing
  than a typical partial-release gap even though the release marking itself
  is identical; (2) SECURITY-REVIEWER's Step 2c FAIL->fix->PASS cycle on
  INV-1 (a cross-tenant data leak in service_catalog resolution: the tenant
  filter referenced a SQL function already dropped by the LEGACY_RLS-to-
  SCHEMA cutover, so the mechanism could never correctly tenant-scope under
  SCHEMA mode), fixed via tenant-scoped parameterized queries and re-reviewed
  PASS; (3) TEST-DESIGNER's Step 3 discovery of 5 further own-AC BLOCKER/
  MAJOR defects against this batch's own implementation (ISS-0676, ISS-0677,
  ISS-0679, ISS-0681, ISS-0683), none of them test-design gaps, requiring 3
  additional BACKEND-DEV rework cycles, 2 further SECURITY-REVIEWER
  re-reviews, and 1 TEST-DESIGN-VALIDATOR FAIL before genuinely passing; (4)
  RELEASE-VALIDATOR's own additional finding (ISS-0686, the PAR-05
  events_legacy archival-integration gap) discovered independently at Step
  5 by reading source directly, not caught by any earlier gate; (5) an
  ADHOC mid-run infrastructure fix for 109 orphaned tenant schemas on the
  shared test container, which also surfaced a brand-new, previously-unknown
  tooling defect (ISS-0684: clean_test_db.py's psql resolution silently
  no-ops on this host's WinGet .cmd shim) rather than being a recurrence of
  any previously-tracked issue.

pin_01_scope_decision:
  decided_at: "Step 1 (CODE-DESIGNER), confirmed Step 1b (CODE-DESIGN-VALIDATOR)"
  what: >-
    AC1 (UnresolvedCatalogRef -- service_catalog version/status resolution)
    and AC2 (UnresolvedModuleRef -- PLC-01 process-module-catalog resolution)
    were marked explicitly out of scope for this batch. Both are genuine,
    confirmed schema/table absences (service_catalog has no version/status
    column; PLC-01 does not exist in this codebase yet), not implementation
    shortcuts -- documented in src/design/pin-01-dependency-version-resolution.md's
    own Scoping note and Open questions #1/#2, and CODE-DESIGN-VALIDATOR
    PASSed the design at Step 1b knowing AC1/AC2 were deferred.
  tracking: "ISS-0672 / GH-306 (OPEN)"
  why_it_matters: >-
    RELEASE-VALIDATOR (Step 5) treated this identically to a typical
    partial-release gap for the RELEASE MARKING (PIN-01 held at TESTED, not
    RELEASED, since 2 of 5 MUST-priority AC bullets have zero implementation
    regardless of how early or deliberately that was decided) but explicitly
    preserved the provenance distinction in its own scope_marking_rationale
    and in requirement_status.yaml's PIN-01 note: this gap is lower-risk than
    a typical partial-release gap (a bounded, tracked scope-phasing decision
    with a clear unblock condition -- service_catalog schema changes plus
    PLC-01 shipping -- discovered and validated in advance, not a late
    surprise or quality escape). Recorded here so a future reader of this
    retrospective sees the same distinction RELEASE-VALIDATOR's own decision
    file preserves.

security_reviewer_rework:
  gate: "Step 2c (SECURITY-REVIEWER)"
  invariant: INV-1 (tenant isolation)
  finding: >-
    pin_resolver.zig's resolveServiceCatalogRef() filtered service_catalog by
    bpm_effective_tenant_id(), a SQL function already dropped by the
    LEGACY_RLS-to-SCHEMA cutover migrations (GBL-116/123/130/131). Every
    SERVICE_TASK instance-start would fail with Postgres 42883 on a
    fully-migrated schema, and even if it hadn't, the mechanism could never
    correctly tenant-scope under SCHEMA mode (pool.zig only sets
    bpm.tenant_id in LEGACY_RLS mode) -- a genuine cross-tenant data leak
    risk, not merely a broken query.
  fix: >-
    Commit 23eff3b2: tenant_id threaded through ResolutionInput and bound as
    a parameterized $2::uuid against service_catalog.owner_tenant_id,
    mirroring service_catalog.zig's existing getServiceForTenant() pattern.
    instance.zig's InstanceStore.create() sources tenant_id from the existing
    threadlocal tenant_context populated by auth middleware (never
    client-supplied). New regression test
    tests/integration/pin01_service_catalog_tenant_scope_test.zig (3 cases:
    cross-tenant denial, same-tenant success, global-scope success) verified
    passing 3/3 against real PostgreSQL.
  reverification: >-
    SECURITY-REVIEWER re-reviewed and returned PASS in commit 39d13534,
    independently confirming the ::uuid binding is genuinely parameterized
    (no string interpolation), tenant_id is sourced from a trustworthy
    request-scoped context, and the regression test proves cross-tenant
    denial rather than only a same-tenant happy path.
  outcome: "FAIL -> fix -> PASS, 1 rework cycle at this specific gate for this specific finding"

test_design_validator_rework:
  gate: "Step 3b (TEST-DESIGN-VALIDATOR)"
  finding: "ISS-0683 / GH-727 -- BLOCKER memory-safety defect"
  description: >-
    A double-free / "Invalid free" panic in pin_resolver.zig's
    applyPinOverrides()/applyOverrideToPins() on PIN-01 AC4's accepting/happy
    path (a valid pin_overrides entry supplied and applied) -- crashing every
    real instance-start that supplied a matching override. Discovered by
    TEST-DESIGN-VALIDATOR's own independent re-run of this batch's tests
    after SECURITY-REVIEWER's REWORK 2 PASS (commit 99fbc164), not by
    SECURITY-REVIEWER itself.
  fix: >-
    Commit 51583e25: applyOverrideToPins() now takes the allocator and
    allocator.dupe()s the incoming resolved_id/version before storing into
    the pin (freeing what it replaces), instead of storing a dangling
    std.json-ParseResult-owned slice that resolve()'s Step 6 cleanup loop
    later double-freed. Applied identically to both the catalog_entry and
    variable_schema override branches.
  reverification: >-
    SECURITY-REVIEWER re-reviewed PASS in commit f9efb490 (REWORK 3
    re-review). TEST-DESIGN-VALIDATOR re-verified PASS afterward.
    RELEASE-VALIDATOR's own live re-run at Step 5 independently confirmed 0
    "Invalid free" panics across 9/9 test-integration-pin01 runs, verifying
    the fix genuinely holds rather than only being claimed fixed.
  outcome: "FAIL -> fix -> PASS, 1 rework cycle at this gate"

test_designer_own_ac_defects:
  gate: "Step 3 (TEST-DESIGNER)"
  description: >-
    TEST-DESIGNER's fail-first test-writing pass against this batch's own
    implementation surfaced 5 further BLOCKER/MAJOR defects, none of them
    test-design gaps -- genuine production-code defects in the code this
    batch was implementing, caught because the tests were written to prove
    the AC's literal wording rather than to pass.
  defects:
    - id: "ISS-0676 / GH-718"
      severity: BLOCKER
      description: >-
        PAR-05 partition_conversion.zig's createParent() never added the
        (event_id, created_at) unique constraint events_part needs for its
        own ON CONFLICT clauses -- blocked backfillOneMonth()/swap() against
        any real PostgreSQL.
    - id: "ISS-0677 / GH-719"
      severity: BLOCKER
      description: >-
        PAR-06 AC4 -- InstanceStore.create() (and 11 other raw INSERT INTO
        events call sites in instance.zig) never set
        instance_projections.first_event_at/last_event_at; only
        Store.append() did.
    - id: "ISS-0679 / GH-721"
      severity: BLOCKER
      description: >-
        PIN-01 AC3 -- validateVariableSchema() passed a single scalar field
        value to registry.validatePayloadAgainstSchema(), whose
        isJsonObject() guard requires a whole JSON object payload; every
        conforming scalar variable was incorrectly rejected.
    - id: "ISS-0681 / GH-724"
      severity: BLOCKER
      description: >-
        PAR-05 AC5 -- reconcileOrRollback()'s mismatch-detection self-join
        against plat_partition_catalog never matched any row because
        backfillOneMonth() never populated the catalog and swap() never
        updated parent_table on rename -- the mismatch-detection loop
        silently no-opped and always returned success.
    - id: "ISS-0683 / GH-727"
      severity: BLOCKER
      description: "See test_design_validator_rework above (same defect, caught again independently at Step 3b)."
  resolution: >-
    Required 3 further BACKEND-DEV rework cycles (commits 29314c89 covering
    ISS-0676/0677/0679, then 01d9f6a3 [REWORK 3, FINAL -- rework budget for
    Step 2a exhausted at 3/3] covering ISS-0681, then 51583e25 covering
    ISS-0683), 2 further SECURITY-REVIEWER re-reviews (confirming each
    rework introduced no new tenant-isolation or injection surface), and 1
    TEST-DESIGN-VALIDATOR FAIL (the ISS-0683 double-free) before this
    batch's implementation genuinely passed. All 5 independently
    re-confirmed fixed by RELEASE-VALIDATOR's own live test re-run at Step
    5 (6/6 PAR-05, 5/5 PAR-06, 9/9 PIN-01, 5/5 PIN-02), not merely by
    reading the issue files' presence.
  why_this_matters_for_the_pipeline: >-
    The highest own-AC defect count of any Stage 16 batch run to date (5,
    versus 0-1 in prior batches) -- caught entirely by TEST-DESIGNER's
    discipline of writing fail-first tests against the AC's literal wording
    rather than adapting tests to the implementation's actual behavior. Every
    one of the 5 was a genuine implementation defect (missing constraint,
    missing call-site coverage, wrong API usage, unpopulated bookkeeping
    table, memory-safety bug), not a missing feature or a test-design
    problem, and all 5 were fixed within this same run's rework budget
    rather than deferred.

