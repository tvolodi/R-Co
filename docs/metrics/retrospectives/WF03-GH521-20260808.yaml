summary: >-
  WF-03 issue-resolving run for ISS-0187 (GitHub #521): src/event_store/store.zig
  appended a second pool.acquire() inside a held lease on the duplicate-idempotency-key
  path, exhausting the pool under parallel execution (TC-EXP-301-08 / TC-EXP-202-05).
  Defect was filed as a separate MAJOR while WF03-ISS-0158-20260807 was resolving
  #479, then queued onto the global queue and claimed by this workspace on 2026-08-08.
  Fix removed the nested acquire (3 lines deleted) and reused the held, ROLLBACK'd
  conn for both duplicate-lookup queries. RELEASE-VALIDATOR APPROVED at step 6
  with all 5 measured NFRs passing (NFR-01 p99_read 1.326ms vs 200ms; NFR-01
  p99_write 9.917ms vs 500ms; NFR-02 throughput 13 932 ev/s vs 1000; NFR-04
  replay_10000 37.799ms vs 5000; NFR-04 replay_snapshot_100000 5.248ms vs 1000).
  DOC-UPDATER completing changelog, issue registry, board, GH closure, and this
  retrospective at step 7.

  All 8 pipeline steps (0.5, 1, 2, 2b, 3, 5, 6, 7) PASS with 0 rework. No test-designer
  or test-design-validator step ran under WF-03 because the regression test was
  authored by BACKEND-DEV at step 3 (the proven WF-03 "backend-dev-writes-test-first"
  optimization; same pattern as WF03-GH526-20260807 on ISS-0206). No incidental
  issues discovered during this run; no findings forwarded to the global queue.
  No requirement status moved (ISS-0187 is not in docs/requirements.yaml -- same
  precedent as ISS-0132, ISS-0158, ISS-0206: defect-class fix against already-RELEASED
  backend code that adds test coverage but implements no requirement).

