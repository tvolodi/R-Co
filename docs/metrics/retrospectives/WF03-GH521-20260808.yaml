prevention_notes:
  - >-
    The WF-03 BACKEND-DEV-first write of the test file (step 3) without a
    separate TEST-DESIGNER round-trip is a stable, repeatable optimization on
    this codebase for defect-class fixes that have a clear prior match. Same as
    WF03-GH526-20260807. Do not move test-writing out of step 3 -- the in-place
    test gives the validator real evidence to verify, and the spec follows
    naturally. Documented here for future retrospectives.
  - >-
    A nested `pool.acquire()` inside a held lease is self-deadlock-shaped: the
    same call path holds a lease and then demands a second one from a finite
    pool. The fix exploits the fact that the held `conn` was `ROLLBACK`'d at
    line 435 of src/event_store/store.zig BEFORE the duplicate-detection branch
    runs, which means it is no longer in any transaction and is safe to issue
    read-only SELECTs against. Future changes to the transaction model in
    `store.append` need to preserve this invariant: any duplicate-detection
    path that reuses the held conn must be reached only AFTER the conn has been
    returned to idle (i.e. transaction ended).
  - >-
    Env-port drift remains a recurring issue. First `zig build bench` failed
    because shell BPM_DB_URL was on port 5433 instead of the .env-documented
    5442 (per docker-compose.override.yml port-drift). The 5433 host port is
    occupied by an unrelated aiqadam-postgres container. Same port-drift
    surface observed in docs/metrics/retrospectives/WF02-iss502-continuation-20260730.yaml.
    Recommend: pre-dispatch env export of BPM_DB_URL=postgres://bpm:bpm@localhost:5442/bpm_dev
    as part of the standard TEST-RUNNER / RELEASE-VALIDATOR pre-check sequence
    (overridable when the dev DB is genuinely on 5433). Not blocking this release.

