    Second consecutive Stage 16 batch run (after batch-4's ISS-0684 psql-shim
    defect) where a defect outside the batch's own requirement scope
    surfaced mid-run and had to be diagnosed and fixed under time pressure
    before the pipeline could proceed -- this run's (ISS-0688/GH-745, dead
