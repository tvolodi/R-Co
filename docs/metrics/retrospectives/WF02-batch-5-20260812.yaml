summary: >-
  WF-02 feature-development run implementing Stage 16's sixth batch (PIN-03
  through PIN-05 completing the dependency-pinning subsystem batch-4 started,
  plus PRM-01 opening the new promotion-plan pipeline). PIN-03 raises
  PinMissing for unpinned references and continues to invoke the pinned
  version despite catalog changes in flight, with no fallback to the current
  active version. PIN-04 reads the effective pin set during reconstruction
  solely from event history, adds sub-process pin inheritance, and exposes
  GET /api/v1/instances/{id}/pins. PIN-05 adds an explicit, all-or-nothing
  pin-rebind endpoint rejected on terminal instances. PRM-01 computes a
  promotion plan (added/modified/removed diff across graph, variable_schema,
  service catalog bindings and module_ref resolutions) before any write to
  the target tenant. RELEASE-VALIDATOR (Step 5) returned PARTIAL: PIN-04,
  PIN-05, PRM-01 approved RELEASED in full; PIN-03 held at TESTED
  (tested-with-known-gap) on AC3, the SAME issue (ISS-0672/GH-306) that held
  PIN-01 AC1/AC2 at TESTED in the immediately preceding batch. DOC-UPDATER
  (this step) is recording that split accurately in docs/requirements.yaml
  (via docs/status/requirement_status.yaml, generated), CHANGELOG.md, and
  this retrospective.

  Four notable events this run, in the order they occurred: (1) the PIN-03
  AC3 scope decision at Step 1/1b (CODE-DESIGNER PARTIAL, CODE-DESIGN-VALIDATOR
  PASS with explicit acknowledgment) -- a design-time choice, not a defect,
  matching PIN-01's own precedent pattern from the prior batch almost exactly;
  (2) an ADHOC mid-run infrastructure fix for ISS-0688/GH-745 (a pre-existing
  regression, NOT part of this batch's own requirements, discovered by
  BACKEND-DEV during Step 2a verification: two dead calls to a dropped SQL
  function bpm_effective_tenant_id() in src/engine/instance.zig plus 9 further
  survivor call sites across five more files, breaking POST /api/v1/instances
  entirely under SCHEMA mode), fixed via an ADHOC BACKEND-DEV dispatch before
  the pipeline could proceed since it blocked this run's own testability, then
  re-reviewed by SECURITY-REVIEWER as part of the normal Step 2c gate; (3) a
  genuine TEST-DESIGNER discovery at Step 3 that PIN-04 AC2/AC3 (sub-process
  pin inheritance and conflict recording) was claimed implemented by
  BACKEND-DEV's Step 2a summary but was actually unimplemented, triggering
  REWORK 1 on the BACKEND-DEV handoff (commit 49ae102a), a SECURITY-REVIEWER
  re-review PASS on the new tenant-data-path logic, and independent
  confirmation by TEST-DESIGN-VALIDATOR that a bundled test-fixture edit in
  that same rework commit was a legitimate reachability fix, not a weakened
  assertion; (4) RELEASE-VALIDATOR's own additional finding (ISS-0689/GH-748,
  a stale doc comment in the PIN-04 test file) discovered independently at
  Step 5.

pin_03_scope_decision:
  decided_at: "Step 1 (CODE-DESIGNER), confirmed Step 1b (CODE-DESIGN-VALIDATOR)"
  what: >-
    AC3 ("GIVEN the pinned catalog entry version is set to DEPRECATED after
    the instance started, WHEN the node executes, THEN execution proceeds on
    the pinned version") was marked explicitly out of scope for this batch.
    service_catalog has no version/status column (confirmed unchanged since
    PIN-01's design first hit this wall in batch-4 by reading
    migrations/049_repository_service_catalog.sql), so no DEPRECATED value
    exists anywhere in the schema for any code path to branch on -- a genuine,
    confirmed schema absence, not an implementation shortcut. Documented in
    src/design/pin-03-no-fallback-to-latest-version.md's own Scoping note and
    Open questions #1 as a "BLOCKING gap" before implementation began, and
    CODE-DESIGN-VALIDATOR PASSed the design at Step 1b knowing AC3 was
    deferred. TEST-DESIGNER's spec (tests/specs/PIN-03.md) and the test
    file's own inline comment (TC-PIN-03-05, lines 679-706) both state in
    writing that the AC3 test is a scoped structural substitute, not full
    coverage -- it re-checks resolved_id equality, the same assertion shape
    as the AC2 test, rather than driving node execution through any
    DEPRECATED-equivalent state.
  tracking: "ISS-0672 / GH-306 (OPEN) -- the SAME issue already blocking PIN-01 AC1/AC2"
  why_it_matters: >-
    RELEASE-VALIDATOR (Step 5) treated this identically to PIN-01's own
    precedent one batch ago: the deliberate, validated, early-disclosed
    provenance changes the QUALITATIVE framing (this is planned, tracked,
    forward-looking scope-phasing, not a missed requirement or a quality
    escape) but does NOT change the RELEASE MARKING itself -- PIN-03 is one
    requirement with 5 MUST-priority AC bullets, and 1 of 5 has no
    implementation behind it regardless of how early or deliberately that was
    decided. RELEASE-VALIDATOR's own scope_marking_rationale additionally
    reasoned explicitly about whether TC-PIN-03-05's structural substitute
    satisfies AC3's SPIRIT well enough to justify RELEASED anyway, and
    concluded no: it provides no incremental evidence beyond what AC2 already
    established, and never reaches AC3's actual "does the node still execute"
    question. Recorded here so a future reader of this retrospective sees
    PIN-01 and PIN-03 as two instances of the same tracked, still-open
    infrastructure gap rather than two unrelated findings. When ISS-0672/
    GH-306 is resolved (service_catalog gains a version/status column), PIN-01
    AC1/AC2 and PIN-03 AC3 should be revisited together in the same follow-up
    batch.

adhoc_infrastructure_fix:
  trigger: >-
    BACKEND-DEV discovered during Step 2a verification (before this batch's
    own PIN-03/04/05/PRM-01 implementation could be validated) that
    InstanceStore.create() in src/engine/instance.zig contained two live
    calls to bpm_effective_tenant_id(), a SQL function already dropped by the
    LEGACY_RLS-to-SCHEMA cutover migrations. Confirmed via git archaeology to
    have been resurrected by a later merge/rebase after SPT-03 had
    deliberately removed it, and confirmed genuinely pre-existing (not
    introduced by this batch) via `git diff main` showing zero prior changes
    at those lines. Broke POST /api/v1/instances entirely under SCHEMA mode
    (every InstanceStore.create() call would 42883-error), which blocked this
    run's own testability since every fixture in every one of this batch's
    tests depends on instance creation.
  scope_found: >-
    The mandated grep sweep of src/ for the same dead function found 9
    further genuine survivor call sites beyond the two named ones, across
    five more files: src/definition/store.zig (7 predicate call sites plus 1
    stale doc comment), src/definition/export_import.zig (2 predicate sites),
    src/definition/snapshot.zig (1 predicate site), src/obs/audit.zig (1
    predicate site in list() plus 1 INSERT site in writeAuditInTx()), and
    src/entities/commands.zig (1 INSERT site in ensureEntityInstanceProjection()).
  fix: >-
    Commit 89b73187 (ADHOC BACKEND-DEV dispatch): the process_definitions
    SELECT predicate was dropped everywhere (SCHEMA-mode search_path already
    scopes it) and every INSERT site now binds tenant_id as an explicit
    $1::uuid parameter sourced from the already-threaded request-scoped
    tenant context. Also added tools/lint_dropped_tenant_function.py as a
    standing CI check (wired into the "Source linters" job) to flag any
    future bpm_effective_tenant_id() call while allowing explanatory
    comments.
  masking_discovery: >-
    BACKEND-DEV's own diagnosis surfaced why this regression had gone
    undetected: a per-tenant-SCHEMA copy of bpm_effective_tenant_id() still
    exists in every tenant_* schema and silently falls back to the all-zero
    UUID (SCHEMA mode never sets the bpm.tenant_id GUC it reads) rather than
    erroring. The 5 named pre-existing test files all exercise the default
    tenant (UUID 00000000-...-000000000000), so the broken code's zero-UUID
    fallback happened to coincidentally match, masking the bug for any tenant
    other than the seeded default.
  verification: >-
    git stash A/B comparison (stashed fix, reran test-integration-main,
    restored fix) confirmed: pre-fix baseline already showed 44 pre-existing,
    unrelated failures (timers, webhooks, effects, DLQ, obs04 timeline);
    post-fix reduces this to 43 (concurrent_instances_test's
    TC-EE-12-01/03, which exercises InstanceStore.create() under concurrency,
    now passes); zero new failures introduced (empty diff of failing-test-name
    sets). Re-reviewed by SECURITY-REVIEWER as part of the normal Step 2c
    gate for this run (not a separate re-review cycle -- folded into the
    same-day Step 2c pass alongside this batch's own new code).
  why_this_matters_for_the_pipeline: >-
    Second consecutive Stage 16 batch run (after batch-4's own mid-run ADHOC
    for orphaned tenant schemas) where a pre-existing defect outside the
    batch's own requirement scope surfaced mid-run and blocked testability --
    fixed inline per Unblock-Everything rather than deferred, with the
    mandated grep-sweep discipline (checking all 11 call sites, not just the
    2 originally reported) catching 9 additional survivors that a narrower
    fix would have missed.

test_designer_pin04_rework:
  gate: "Step 3 (TEST-DESIGNER) discovery, Step 2a REWORK 1 (BACKEND-DEV), Step 2c re-review (SECURITY-REVIEWER), Step 3b independent confirmation (TEST-DESIGN-VALIDATOR)"
  finding: >-
    PIN-04 AC2 (sub-process inherits parent pin) and AC3 (conflict recorded
    in child payload) were claimed implemented by BACKEND-DEV's Step 2a
    summary but were, on TEST-DESIGNER's own reading of the code, entirely
    unimplemented: InstanceStore.create() had no parent_instance_id-aware
    merge step at all, and a grep for pin_inheritance_conflicts/inheritPins
    returned zero matches anywhere outside design docs. TEST-DESIGNER wrote
    two real, fail-first-confirmed tests (TC-PIN-04-03, TC-PIN-04-04) against
    AC2/AC3's literal wording rather than skipping or softening them, and
    reported the gap as a BLOCKER rather than routing around it.
  fix: >-
    Commit 49ae102a (REWORK 1): a new private path,
    createWithParentInheritance(), used only by
    startSubProcessesForPendingEventsInTx(), merges the child's own resolved
    pins against the parent's effective pin set via
    reconstructEffectivePins(). Entries for references the parent already
    pins carry source=inherited and the parent's resolved_id/version; a child
    reference that would otherwise resolve differently instead uses the
    inherited pin, with the conflict recorded in the child's own
    INSTANCE_STARTED payload under pin_inheritance_conflicts.
  bundled_fixture_edit: >-
    The same rework commit also edited
    tests/integration/pin04_pin_resolution_replay_subprocess_test.zig's
    setupParentChildWithServiceTaskChild fixture (adding an
    EXCLUSIVE_GATEWAY + dead-branch SERVICE_TASK + second END node to the
    parent graph, purely additive except for one replaced edge, so that
    PinResolver.resolve() produces a catalog_entry pin on the parent for the
    child to inherit). TEST-DESIGN-VALIDATOR independently verified via `git
    diff dbb2de56..49ae102a` on this file that the change is a legitimate
    reachability fix, not a weakened assertion: exactly one hunk, purely
    additive except for one edge swap that is provably runtime-equivalent to
    the edge it replaced (confirmed against transition.zig's
    EXCLUSIVE_GATEWAY default-fallback handling and its own TC-EE-02-06
    test), and zero `try std.testing.expect*` assertion lines in either
    TC-PIN-04-03 or TC-PIN-04-04 were touched by the diff.
    SECURITY-REVIEWER's independent re-review reached the same conclusion via
    a separate spot-check, corroborating but not substituting for
    TEST-DESIGN-VALIDATOR's own verification.
  reverification: >-
    SECURITY-REVIEWER re-reviewed PASS in commit 4ae9a441, confirming the new
    tenant-data-path merge logic introduces no new tenant-isolation or
    injection surface. TEST-DESIGN-VALIDATOR re-verified PASS afterward
    (commit 38948437). RELEASE-VALIDATOR's own live re-run at Step 5
    independently confirmed 5/5 test-integration-pin04, including both named
    tests, genuinely passing.
  outcome: "Discovered at Step 3, fixed at Step 2a REWORK 1, re-reviewed PASS at Step 2c and Step 3b -- 1 rework cycle"

