    distinct finding nothing earlier was scoped to catch. Here the finding is
    lower-severity than the prior two (a stale comment, not an unimplemented
    AC) precisely because the AC gap it might have described (PIN-04 AC2/AC3)
    was already caught and fixed two gates earlier, at Step 3 -- showing the
    pipeline catching problems progressively earlier as it iterates on the
    same subsystem across batches.

