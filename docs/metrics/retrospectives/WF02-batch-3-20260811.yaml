summary: >-
  WF-02 feature-development run implementing Stage 16's fourth batch, opening
  the event-store partitioning subsystem (PW-06): PAR-01 converts events/
  events_archive to PARTITION BY RANGE (created_at) with a widened
  (event_id, created_at) primary key and a separate plat_event_idempotency
  table for global idempotency-key uniqueness; PAR-02 runs a daily scheduler
  job keeping lead_months future partitions attached proactively so no append
  is ever the operation that creates one; PAR-03 ages partitions out via
  DETACH/ATTACH into events_archive (no row copy) and confines hard DROP to
  events_ephemeral partitions holding only delete-class event types, guarded
  by a live ADP-11-protected-type count check; PAR-04 declares both CHECK
  constraints on every standalone partition before ATTACH so PostgreSQL
  validates from the catalog rather than scanning. CODE-DESIGNER's design
  pass needed two rework cycles (rework_count=2) before CODE-DESIGN-VALIDATOR
  passed it -- see rework_steps below. BACKEND-DEV's implementation needed one
  further rework cycle (rework_count=1) at Step 2a/Step 3 to close PAR-01 AC4
  (StoreError.PartitionMissingForWrite) end to end. SECURITY-REVIEWER passed
  the tenant-data-path gate on the first pass. TEST-DESIGNER/TEST-DESIGN-VALIDATOR
  both re-validated cleanly after the AC4 rework. TEST-RUNNER's Step 4 run hit
  a real, unrelated infrastructure regression (ISS-0671/GH-712, default-tenant
  storage_mode routing) that it root-caused and fixed inline, re-verifying
  every affected target green. RELEASE-VALIDATOR (Step 5) independently
  re-verified everything from source rather than trusting the handoff chain,
  and returned PARTIAL rather than a clean batch approval: PAR-01 and PAR-04
  are RELEASE-worthy in full, but PAR-02 AC5 and PAR-03 AC6 (the
  EXECUTION_PARTITION_CREATED / EXECUTION_PARTITION_DETACHED /
  EXECUTION_PARTITION_DROPPED event-emission clauses) are confirmed
  UNIMPLEMENTED by direct grep of src/ -- a genuine missing-implementation
  gap, not a missing-test gap, root-caused to a real missing design
  convention (no platform/system instance_id exists for Store.append()'s
  InstanceNotFound-gated API to accept a non-instance-scoped event). Per this
  project's own governing rule that a MUST AC with no passing implementation
  cannot be marked RELEASED regardless of how well-documented the deferral
  is, RELEASE-VALIDATOR split the release: PAR-01/PAR-04 -> RELEASED;
  PAR-02/PAR-03 -> TESTED, tracked via ISS-0670/GH-711 (OPEN). DOC-UPDATER
  (this step) is recording that split accurately in both
  docs/requirements.yaml and CHANGELOG.md, and writing this retrospective.

  Two notable events this run: (1) a two-cycle CODE-DESIGNER rework at Step 1
  (PAR-03's design initially specified no append-time retention-class routing
  at all -- rework 1 added it in the wrong layer, rework 2 moved it into
  Store.append() itself and widened PAR-02's partition-creation loop to cover
  events_ephemeral too), the deepest rework chain of any Stage 16 batch run
  today, caught entirely before implementation code existed; (2)
  RELEASE-VALIDATOR's split-release finding, the first PARTIAL verdict (as
  opposed to a rework cycle) issued by any Stage 16 batch run today -- a
  structurally different outcome from a caught-and-fixed rework, since AC5/AC6
  remain genuinely unimplemented at the point of this retrospective and the
  correct response was to record that honestly rather than force a same-batch
  fix into a step that had no rework budget for a CODE-DESIGNER-scoped
  change.

