rework_steps:
  - step: step-01 / step-01b (CODE-DESIGNER / CODE-DESIGN-VALIDATOR -- two-cycle design rework)
    trigger: >-
      CODE-DESIGN-VALIDATOR's first validation pass found PAR-03's original
      design specified no append-time retention-class routing at all --
      runEphemeralDrop() (the ephemeral-partition drop mechanism) had no
      corresponding write path that would ever populate events_ephemeral,
      making the drop mechanism untestable against real data (a BLOCKER: the
      design's own drop mechanism had nothing to drop) and TC-ADP-11-02
      (a MAJOR test-coverage requirement) had no real routing to exercise.
      REWORK 1 addressed this but, per the REWORK 2 summary, placed the
      routing logic in the wrong layer (not detailed further here since only
      the final REWORK 2 handoff was separately persisted with its own
      started_at/completed_at, matching this run's own precedent from prior
      batches of not separately time-stamping intermediate FAIL passes).
    resolution: >-
      REWORK 2 moved append-time retention-class routing into Store.append()
      itself: retention_class is added as a new field on EventTypeRecord,
      fetched by a second (pre-BEGIN) Registry.getType() call, selecting
      target_table = events_ephemeral when retention_class = delete, else
      events -- the previously-hardcoded single INSERT becomes a two-branch
      INSERT with an identical column/placeholder shape in both branches.
      validatePayload()'s own signature was deliberately left unchanged (it
      is a released ES-05 interface with one external call site) -- the
      routing lookup is a second, explicitly-justified getType() call rather
      than plumbing the discarded record out through validatePayload().
      PAR-02's partition-creation loop was widened in the same rework
      (companion edit, same commit) from iterating events alone to iterating
      [events, events_ephemeral], with its lead-time BLOCKER/WARN severity
      count deliberately left scoped to parent_table=events only (an
      ephemeral-partition shortfall surfaces as PartitionMissingForWrite on
      the next delete-class append rather than as a paging alarm --
      explicitly reasoned, not overlooked). Two genuinely open questions
      were flagged as non-blocking implementation-shape judgment calls, not
      AC gaps.
    reverification: >-
      CODE-DESIGN-VALIDATOR (step-01b, this persisted handoff) independently
      re-verified all 5 focus points against actual source rather than the
      design doc's claims: confirmed validatePayload() has exactly one
      external call site (grep), confirmed EventTypeRecord{} is constructed
      in exactly 2 places in registry.zig and freeTypeRecord() currently
      frees exactly 3 fields matching the design's claimed baseline before
      adding a 4th, confirmed PAR-02's design doc genuinely shows the
      widened [events, events_ephemeral] iteration in both its body sketch
      and data-flow diagram (not a claim without substance), and traced
      TC-ADP-11-02's full intended chain end to end confirming no remaining
      gap. All 4 design docs re-verified via tools/lint_design_artefact.py:
      OK, no issues.
    why_this_matters_for_the_pipeline: >-
      The deepest rework chain (2 cycles) of any Stage 16 batch run today,
      but caught entirely at Step 1/1b -- before any implementation code,
      tests, or security review existed -- the cheapest point in the
      pipeline for a design-completeness gap of this depth to surface. The
      gap itself (an entire missing write path, not a missing field) was
      structurally larger than any single-cycle rework seen in batch-0
      (missing coverage), batch-1 (false-positive fixture), or batch-2
      (missing byte-offset fields), which is consistent with two cycles
      being needed rather than one.

  - step: step-2a / step-03 (BACKEND-DEV / TEST-DESIGNER -- PAR-01 AC4 implementation rework)
    trigger: >-
      PAR-01 AC4 ("GIVEN an append whose created_at falls in a month with no
      attached partition, WHEN it executes, THEN it fails with
      PartitionMissingForWrite and a structured error rather than being
      routed to another partition") required a dedicated StoreError variant
      and HTTP mapping that did not exist in the initial implementation slice
      -- Postgres's real check_violation (SQLSTATE 23514) on a missing
      partition was being caught only by the generic TransactionFailed
      catch-all, with no HTTP 503 mapping in src/api/errors.zig.
    resolution: >-
      BACKEND-DEV (step-2a, rework_count=1) added SQLSTATE capture to
      vendor/pg/pg.zig (Conn.last_sqlstate, parsed from the ErrorResponse C
      field, previously discarded entirely) and a Conn.lastSqlState()
      accessor threaded through src/db/pool.zig, since neither shared-
      infrastructure layer preserved SQLSTATE before this change. store.zig's
      append() INSERT catch branch now distinguishes SQLSTATE 23514 from
      every other INSERT failure and returns the new
      StoreError.PartitionMissingForWrite variant. Added
      src/api/errors.zig::problemPartitionMissingForWrite() (HTTP 503).
      Wrote TC-PAR01-04-01, a real integration test that DETACHes the actual
      current-month events partition, asserts the failure and zero rows
      written, then unconditionally reattaches via defer. A genuine
      aliasing bug was found and fixed during this work: lastSqlState()
      returned a slice into the connection's mutable last_sqlstate field,
      read before a ROLLBACK exec() call that silently reset the same
      backing array, corrupting the comparison -- fixed by copying the
      SQLSTATE bytes to a local buffer first.
    reverification: >-
      TEST-DESIGNER (step-03, rework_count=1) independently re-verified
      TC-PAR01-04-01 genuinely proves AC4 per its exact requirements.yaml
      wording (not a paraphrase), ran test-integration-event-store twice in
      a row (29/29 both times) to confirm the detach/reattach cycle is
      idempotent, and re-ran the full previously-passing batch-3 suite to
      confirm the shared vendor/pg/pg.zig and src/db/pool.zig
      SQLSTATE-preservation plumbing introduced no regression across any of
      the 6 batch-specific targets. TEST-DESIGN-VALIDATOR (step-03b) then
      passed the re-validation on its first attempt. RELEASE-VALIDATOR
      (step-05) independently re-read TC-PAR01-04-01's full test body
      against the real store.zig/errors.zig source (not the test report
      alone) and confirmed the fix (commit fa63e32d) is real, not merely
      described.
    why_this_matters_for_the_pipeline: >-
      A fourth distinct rework pattern across the four Stage 16 batches run
      today: batch 0's rework was RELEASE-VALIDATOR-caught missing coverage;
      batch 1's was TEST-DESIGN-VALIDATOR-caught false-positive fixture;
      batch 2's was CODE-DESIGN-VALIDATOR-caught design-completeness (fields
      missing from a struct); this run's implementation-layer rework was
      caught by BACKEND-DEV's own AC-by-AC implementation discipline before
      any downstream gate rejected anything, and in the course of fixing it
      surfaced and fixed a real, separate aliasing bug in shared
      SQLSTATE-handling infrastructure that no prior batch's testing had
      exercised (no earlier Stage 16 batch depended on SQLSTATE
      preservation across a ROLLBACK).

release_validator_finding:
  type: SPLIT_RELEASE (PARTIAL verdict, not a rework cycle)
  scope: "PAR-02 AC5, PAR-03 AC6"
  description: >-
    RELEASE-VALIDATOR (step-05) independently grepped the whole of src/ for
    EXECUTION_PARTITION_CREATED, EXECUTION_PARTITION_DETACHED, and
    EXECUTION_PARTITION_DROPPED and found zero call sites for any of the
    three -- confirming these are a genuine implementation absence (no code
    exists to test), not a test-coverage gap (no test written for existing
    code). Both are plain, unconditional MUST-priority acceptance-criteria
    bullets, phrased identically to every other AC in their respective
    requirements' lists ("Each creation appends...", "Detach and drop each
    append..."). Per docs/anti-patterns.md's governing rule that
    RELEASE-VALIDATOR must return FAIL if any MUST requirement has no
    passing integration-test evidence and that "will be addressed later" is
    not itself an acceptance criterion -- reinforced here by the stronger
    fact that this is missing implementation rather than merely missing
    coverage -- these two specific ACs could not be treated as met. The root
    cause (no platform/system instance_id convention exists for
    Store.append()'s InstanceNotFound-gated API to accept a
    non-instance-scoped event) was correctly scoped by BACKEND-DEV (who
    discovered and filed it during the AC4 rework, step-2a) as needing
    CODE-DESIGNER design input before it can be closed, not a quick
    BACKEND-DEV fix that belonged in this run's rework budget.
  disposition: >-
    PAR-01 and PAR-04 have no comparable gap and were approved RELEASED in
    full. PAR-02 and PAR-03 were held at TESTED (not RELEASED) --
    implemented and tested except for AC5/AC6 respectively -- with
    ISS-0670/GH-711 (OPEN, MAJOR) as the tracking issue, recorded against
    each requirement's note field in docs/requirements.yaml so a future
    release of the EXECUTION_* platform-event design convention closes both
    AC5 and PAR-03's AC6 in one pass rather than each being independently
    rediscovered. Full reasoning:
    docs/status/release-stage16-WF02-batch-3-20260811.yaml.
  why_this_matters_for_the_pipeline: >-
    The first PARTIAL (split) release verdict issued by any Stage 16 batch
    run today, structurally different from a rework cycle: a rework cycle
    means a gate caught something and a later agent fixed it within the same
    run; a split release means the gap survives to the release decision
    itself because the fix genuinely belongs to a different agent role
    (CODE-DESIGNER) and a future run, not because anyone in this run's chain
    failed to do their job. Recording this accurately -- RELEASED for the
    two clean requirements, TESTED with an explicit unmet-AC note and
    tracking issue for the other two, never an unqualified RELEASED that
    would silently claim full AC coverage -- is the entire point of this
    step.

