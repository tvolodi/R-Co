prevention_notes:
  - >-
    This is the second batch in a row (after batch-2's ISS-0669 discovery)
    where a genuine infrastructure defect outside this batch's own
    requirement scope was found and had to be diagnosed under time pressure
    mid-run: ISS-0671/GH-712 (clean_test_db.py's --include-fixtures sweep
    missing a slug != 'default' guard that every other DELETE in the file
    already has). The fix pattern (grep for the guard already used
    elsewhere in the same file, apply it consistently) suggests a
    lint/consistency check over clean_test_db.py's own DELETE statements
    could catch a missing guard automatically rather than relying on a test
    run surfacing it as 22 failing tests first.
  - >-
    ISS-0670/GH-711 (no platform/system instance_id convention for
    Store.append()'s non-instance-scoped EXECUTION_* platform events) now
    blocks not just PAR-02 AC5 and PAR-03 AC6 but, per BACKEND-DEV's own
    step-2a investigation, all 6 other unimplemented EXECUTION_* platform
    events named across docs/requirements.yaml (none of which have an
    implementation to copy either). This is a cross-cutting design gap, not
    specific to this batch's two requirements -- recommend the future
    CODE-DESIGNER pass that resolves it be scoped explicitly as a shared
    platform-event append convention (as BACKEND-DEV's own filing already
    recommended) rather than a narrow PAR-02/PAR-03 patch, so the same gap
    is not independently rediscovered by whichever future batch happens to
    touch the next EXECUTION_* event first.
  - >-
    Two rework cycles occurred in the same run for the first time across
    Stage 16 batches today (CODE-DESIGNER at Step 1/1b, then BACKEND-DEV at
    Step 2a/03) -- both were caught at the correct gate for their kind (a
    design-completeness gap caught before code existed; an
    implementation-completeness gap caught by BACKEND-DEV's own AC
    discipline before any downstream gate needed to reject it), which is
    the pipeline working as intended rather than a sign of process failure.
    Worth tracking whether PAR-03's two-cycle design rework specifically
    (the deepest of any batch today) reflects PAR-03's genuinely higher
    design complexity (a table with three distinct fates -- archive,
    ephemeral-drop, or reject-at-config -- versus PAR-01/PAR-02/PAR-04's
    single-fate designs) or a design-review process gap worth addressing
    generally.

