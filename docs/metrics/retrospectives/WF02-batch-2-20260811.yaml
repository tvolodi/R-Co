prevention_notes:
  - >-
    This is the second time in three Stage 16 batches run today that a
    sequential-connection test was initially mistaken for adequate coverage
    of a literal "N concurrent consumers" acceptance criterion (the first
    being implicit in how AC1 was originally written for ORD-01/ORD-04 by
    BACKEND-DEV at Step 2a, before TEST-DESIGNER's Step 3 review caught it).
    An AC phrased as "GIVEN N consumers polling... WHEN they claim
    concurrently" should be treated as requiring genuine multi-connection,
    multi-thread (or multi-process) test evidence by default, not sequential
    simulation, unless a documented infeasibility justification is written
    and reviewed. TEST-DESIGNER's own test_developer_guide.md workflow already
    caught this correctly this run; consider whether CODE-DESIGNER or
    BACKEND-DEV should flag "genuinely concurrent" ACs explicitly in the
    design artefact itself so the concurrency-test requirement is visible
    before Step 2a implementation, not only at Step 3 review.
  - >-
    ISS-0669/GH-709 (Pool.acquire() loses row-lock isolation under raw
    std.Thread.spawn contention) is now a documented, open, MAJOR-severity
    pre-requisite gate for the future ORD-03/consumer-wiring batch. This is
    carried in three independently-written places (docs/issues/ISS-0669.json,
    docs/status/release-stage16-WF02-batch-2-20260811.yaml's
    issue_iss_0669_reassessment section, and this CHANGELOG.md entry's
    leading blockquote) specifically so it is not lost between now and
    whichever future run picks up ORD-03/multi-consumer wiring -- per the
    explicit instruction that this must not be buried. The future batch's own
    CODE-DESIGNER should restate it explicitly in that batch's design
    artefact so CODE-DESIGN-VALIDATOR has a concrete claim to check, per
    RELEASE-VALIDATOR's own stated recommendation.
  - >-
    Same zero-Green-Main-Gate-defects pattern as batch 1: this run's Step 00a
    found nothing to fix (3.2 min, in line with batch 1's 2.9 min), a sharp
    contrast with batch 0's 56.3-minute Green-Main Gate dominated by
    diagnosing ISS-0663/ISS-0664. ISS-0665 (full test-integration umbrella
