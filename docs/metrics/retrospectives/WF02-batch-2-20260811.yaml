rework_steps:
  - step: step-01b (CODE-DESIGN-VALIDATOR, first pass -- not separately persisted)
    trigger: >-
      CODE-DESIGN-VALIDATOR's first validation pass FAILed (BLOCKER) on
      DDL-02 AC5 ("The rejection message names the file and the byte offset
      of both the constraining statement and the statement it depends on.").
      CODE-DESIGNER's original design doc (src/design/ddl-02-constrain-before-expand-check.md)
      defined ConstrainBeforeExpandDetail with only statement_order/
      statement_text fields -- an ordinal position, not a byte offset, and no
      file field at all. This gap was caught before any implementation code
      existed, the cheapest point in the pipeline for a design-completeness
      gap to surface.
    resolution: >-
      CODE-DESIGNER (step-01, rework_count=1) added file ([]const u8) and
      byte_offset (u32) fields to ddl_validate.zig's StatementDescriptor
      (the DDL-01/DDL-02 type specifically), and four matching fields
      (constraining_statement_file/byte_offset,
      depended_on_statement_file/byte_offset) to ConstrainBeforeExpandDetail.
      Explicitly checked and documented that this is purely additive:
      checkNamespace (DDL-05's function) is called via a 3-field anonymous
      struct literal built from StatementDescriptor, never StatementDescriptor
      itself, so ddl_namespace.zig (already RELEASED) and its own,
      differently-shaped StatementDescriptor type are untouched. Design doc
      gained a new "Which StatementDescriptor?" and "Backward compatibility
      with DDL-05" section documenting this verification.
    reverification: >-
      CODE-DESIGN-VALIDATOR re-validated PASS (step-01b, this persisted
      handoff) -- independently re-confirmed the non-breaking claim by
      reading ddl_validate.zig's checkNamespace call site (line 179) itself
      rather than accepting CODE-DESIGNER's summary, and grepped the whole
      src/ tree for any other checkNamespace/ddl_namespace.StatementDescriptor
      reference (none found outside ddl_namespace.zig's own test blocks).
      Confirmed via git diff (5540e73d..1ccc6b56) that the rework touched
      only the DDL-02 design doc plus handoff/registry/log bookkeeping --
      ORD-01/02/04's design doc and both migration YAMLs are byte-identical,
      no scope creep. tools/lint_design_artefact.py on the updated doc: OK,
      0 issues. BACKEND-DEV (step-2a) later confirmed the mechanical
      consequence flagged in the design doc (DDL-01's own existing unit test
      call sites needed literal updates to supply the two new fields) was
      handled cleanly with all tests passing.
    why_this_matters_for_the_pipeline: >-
      Third distinct rework failure mode across the three Stage 16 batches
      run today: batch 0's rework was RELEASE-VALIDATOR-caught missing
      coverage (an AC with zero passing test evidence); batch 1's rework was
      TEST-DESIGN-VALIDATOR-caught false-positive fixture defect (a test that
      ran and had actually been failing); this run's rework was
      CODE-DESIGN-VALIDATOR-caught design-completeness (an AC's required
      output shape not yet designed), caught at Step 1b before any
      implementation code was written at all -- the cheapest of the three
      gates in terms of downstream rework cost, since no code, no tests, and
      no security review needed to be redone.

  - step: step-03 (TEST-DESIGNER -- concurrency-coverage upgrade, not a rework cycle)
    trigger: >-
      Not a gate FAIL or rework in the formal rework_count sense -- this was
      a task-mandated check ("pay special attention to ORD-01's AC about 8
      concurrent consumers... confirm the existing tests actually exercise
      real concurrent access... or document clearly if infeasible") that
      TEST-DESIGNER executed proactively within its own Step 3 pass. The
      original ORD-01 AC1 / ORD-04 AC1 tests (written by BACKEND-DEV at
      Step 2a) were sequential-only: one connection locking a row, then a
      second connection proving SKIP LOCKED correctly skips it -- a valid
      test of SKIP LOCKED's semantics, but not a genuine proof of the AC's
      literal "8 consumers polling... claim concurrently" scenario.
    resolution: >-
      TEST-DESIGNER added TC-ORD-01-AC1-concurrent and
      TC-ORD-04-AC1-concurrent to tests/integration/ordering_consumer_test.zig:
      8 real std.Thread.spawn OS threads, each on its own pre-acquired
      connection, racing a real claim/guard query via a start-gate spin
      barrier (and, for ORD-04, a second arrival-gate barrier deterministically
      proving all 8 threads hold their guard simultaneously). Writing these
      tests surfaced that racing pool.acquire()+begin() itself (not just the
      subsequent query) across raw OS threads breaks SKIP LOCKED's row-lock
      isolation -- confirmed via a client-side elimination check (distinct
      backend PIDs, distinct per-thread memory addresses) and a
      cross-language elimination check (an equivalent pure-Python
      threading+psycopg2 harness with the same barrier pattern produced
      exactly one winner every time, ruling out PostgreSQL/environment
      causes). Filed as ISS-0669/GH-709 (docs/issues/ISS-0669.json), and
      worked around in the final tests by pre-acquiring all connections
      sequentially from the main thread before spawning the racing threads --
      isolating the tests from the separate, already-broken pool-acquisition
      path so they still genuinely exercise the claim/guard queries ORD-01/
      ORD-02 actually implement.
    reverification: >-
      TEST-DESIGN-VALIDATOR (step-03b) independently assessed the specific
      risk that the workaround could make the concurrency assertion vacuous
      -- traced cursor.claimOneCompletion/tryExecuteGuard to confirm neither
      makes any further pool call once given a connection, so pre-acquiring
      is inert client-side bookkeeping that cannot pre-decide the race.
      RELEASE-VALIDATOR (step-05) independently re-derived, from source
      rather than from TEST-DESIGN-VALIDATOR's claim, that this batch's own
      production code (src/ordering/consumer.zig) never calls pool.acquire()
      from more than one thread, and that no production executable wires the
      consumer loop in yet -- confirming ISS-0669 does not block this
      release while explicitly carrying forward the pre-requisite for the
      future batch that will wire it in.
    why_this_matters_for_the_pipeline: >-
      A genuine infrastructure defect (MAJOR severity, src/db/pool.zig) was
      found not because a gate rejected something, but because TEST-DESIGNER
      held its own coverage to a stricter bar than the minimum the upstream
      design/implementation had already passed with. This is the opposite
      failure direction from batch 0's and batch 1's reworks (both caught
      something already in the pipeline that was insufficient); this is a
      case where strengthening test rigor beyond what was already accepted
      surfaced a real defect in shared infrastructure that no prior Stage 16
      batch's testing had exercised (no earlier batch drove genuine raw-thread
      contention against Pool.acquire()). The correct pipeline response --
      file and forward per Unblock-Everything's forwarding boundary, not fix
      inline (out of TEST-DESIGNER's remit) and not silently work around
      without disclosure -- was followed at every subsequent gate: each of
      TEST-DESIGN-VALIDATOR, RELEASE-VALIDATOR, and now this changelog entry
      independently re-verified the forwarding decision from source rather
      than propagating a prior agent's claim unchecked.

