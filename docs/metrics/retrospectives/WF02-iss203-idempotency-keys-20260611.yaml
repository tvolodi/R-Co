estimation_rule_update_rationale: >
  This is the first D4/medium run in the dataset. The metrics rule (docs/agents/metrics.md §6)
  requires >=2 consecutive runs at the same difficulty and surface combination before adjusting
  estimation_rules.json. No prior D4/medium retrospectives exist to compare against.

  The extreme total overrun (+245.5%, 252 min vs 73 min estimated) is dominated by two factors:

  1. test-designer ran for ~188 minutes wall-clock time (vs 2 min estimated). The 2-minute
     estimate is calibrated for trivial specs. Writing 5 integration tests against real
     PostgreSQL with ON CONFLICT dedup semantics is unambiguously not trivial. The D4/medium
     test-designer estimate of 2 minutes appears to be a data-entry error in estimation_rules.json
     (should be closer to 15-20 min for this surface). However, the cascade timing methodology
     also captures scheduling latency, not just active work time — the true work duration may
     be shorter.

  2. test-runner ran for ~30 min (vs 5 min estimated), because the agent performed inline
     fixes to integration test infrastructure (persistEmittedEventsInTx, missing END nodes,
     build target). These fixes were appropriate per the Unblock-Everything directive but
     inflate the reported duration.

  Recommendation: Monitor ISS-204 through ISS-207 D4/medium runs. If test-designer
  consistently overruns at D4, adjust the estimate from 2 to a higher value.

