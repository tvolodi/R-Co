infrastructure_blockers:
  - description: >
      Audit trigger trg_bpm_audit_process_definitions (and similar triggers on
      instance_projections, tasks, webhook tables) calls bpm_audit_compute_chain_hash
      with a signature expecting audit_entries.resource_id as uuid, but the column
      was changed to text by GBL-081 migration. The function exists with the old
      signature in tenant_default schema. INSERTS fail until triggers are disabled.
  - description: >
      Migration 072 renamed dead_letter_queue to dead_letter_items in tenant_default
      but store.zig code still references the old table name. Other tenant schemas
      created after 072 retain the dead_letter_queue name, making a universal rename
      unsafe.
  - fix: >
      Trigger disable compatibility shim added to helpers.zig applyCompatibilityShims()
      (ALTER TABLE ... DISABLE TRIGGER ALL). Additionally, a VIEW or table rename is
      needed in tenant_default to reconcile dead_letter_queue/dead_letter_items.
  - fix: >
      Manual repair sequence confirmed working on previous DB state:
      1. ALTER TABLE tenant_default.dead_letter_items RENAME TO dead_letter_queue
      2. ALTER TABLE tenant_default.process_definitions DISABLE TRIGGER ALL
      After both fixes, ISS-207-TC1 and ISS-207-TC3 passed.

lessons:
  - "Integration tests with raw SQL INSERTs are fragile against evolving table schemas — prefer using the module's own store/API (DefinitionStore, TaskStore) for setup"
  - "Test harness should apply DB-state reconciliation shims BEFORE the connection transaction starts, not after"
  - "Migration renames must be accompanied by code updates or VIEW compatibility layers"
