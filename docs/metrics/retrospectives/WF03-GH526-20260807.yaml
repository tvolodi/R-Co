prevention_notes:
  - >-
    The WF-03 BACKEND-DEV-first write of the test file (step 3)
    followed by TEST-DESIGNER (step 4) collapsing into a 6-second
    spec-only write is a stable, repeatable optimization on this
    codebase for defect-class fixes that have a clear prior match.
    Do not move test-writing out of step 3 — the in-place test
    gives the validator real evidence to verify, and the spec
    follows naturally. Documented here for future retrospectives.
  - >-
    Env-gate remediation is now structurally separate from
    TEST-RUNNER's actual test execution. Per docs/guides/test_infrastructure_guide.md §3,
    the gate is supposed to be HEALTHY before dispatch. In practice
    it is often not — most runs in this workspace have spent
    non-trivial time clearing stale advisory locks or exporting
    COMPOSE_PROJECT_NAME. Consider adding a recurring "verify_test_env"
    cron job (or pre-dispatch reminder) so ORCH dispatches with a
    HEALTHY gate rather than dispatching and then waiting for
    BACKEND-DEV to remediate. Filed as ISS-0211 (informal note;
    no formal GH issue filed from this run).
  - >-
    A test that has only ever been seen passing has not been shown
    to test anything. The fix's checkAllAllocationFailures test was
    proved to fail against the unfixed parseGraphJson site under
    ISS-0132; the same pattern would prove the new rowToDefinition
    test on unfixed code if anyone ever needed to re-verify.

