summary: >
  WF-03 issue-resolving run for ISS-0206 (GitHub #526): src/definition/store.zig
  rowToDefinition leaked 4 dupes per allocation failure across 9 call sites.
  Same defect class as ISS-0132 (parseGraphJson) — fixed at the parseGraphJson
  site under #427, but rowToDefinition was out of that run's reach because it
  consumes a pg.zig result row, so checkAllAllocationFailures could not drive
  it. This run extracted a fixture-driven rowToDefinitionFromFields signature
  behind the existing column-extraction logic, applied the proven per-field
  errdefer shape, and added the missing allocation-failure test coverage.
  RELEASE-VALIDATOR APPROVED at step 6; DOC-UPDATER completing changelog,
  issue registry, board, GitHub closure, and retrospective at step 7.

  All 10 pipeline steps (0.5, 1, 2, 2b, 3, 4, 4b, 5, 6, 7) PASS with 0
  rework. No incidental issues discovered during this run; no findings
  forwarded to the global queue. No requirement status moved
  (ISS-0206 is not in docs/requirements.yaml — same precedent as ISS-0132,
  defect-class fix against already-RELEASED code that adds test coverage
  but implements no requirement).

