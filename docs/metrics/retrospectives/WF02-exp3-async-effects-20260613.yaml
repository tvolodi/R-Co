# Key findings
findings: |
  1. **Test-designer massive overrun (+600%)**: The initial estimate of 3 minutes was unrealistic. Designing comprehensive tests for a new async effects subsystem required:
     - 7 test cases for transactional outbox (state machine, worker polling, idempotency)
     - 6 test cases for SERVICE_TASK effect emission and resumption semantics
     - 7 test cases for stub executor and deterministic outcome replay
     Total: 20 test cases across three separate test modules.
     
     **Recommendation for next similar feature (complexity level 4)**: Allocate minimum 20-30 minutes for test-designer when the feature involves:
     - New subsystem with worker/polling patterns
     - Cross-module state machine changes
     - Deterministic stub for testing integration
  
  2. **Backend-dev overrun (+233%)**: Implementation required more iteration than the 9-minute estimate:
     - Effects outbox table design and retry logic
     - Worker initialization and polling loop
     - SERVICE_TASK integration with effect emission/resumption
     - Test harness setup (stub executor, mock scenarios)
     Multiple rework cycles to get the integration right.
     
     **Recommendation**: For features involving new subsystems with async I/O patterns, allocate 25-35 minutes (difficulty 4).
  
  3. **Overall variance**: Despite 233% backend overrun and 600% test-designer overrun, the pipeline completed only 15% behind estimate due to quick validation and test execution phases. The "slow" phases (designer, validator) came in 62-74% faster than predicted.
  
  4. **Integration surface was high**: The feature touched engine/transition, API routes, definition, effects module (new), and simulation. This justified the "high" surface rating and may explain why designer validation was quick (clear boundaries) but implementation required iteration (cross-module wiring).

