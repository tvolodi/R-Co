rework_steps:
  - step: step-05 (RELEASE-VALIDATOR, first pass -- not separately persisted)
    trigger: >-
      RELEASE-VALIDATOR's first validation pass returned FAIL on MIG-02 AC4
      ("GIVEN the failure-recording transaction itself fails, WHEN the
      fanout continues, THEN the row remains pending and the MIG-04 resume
      query covers it"). tests/specs/MIG-02.md at that point documented AC4
      as a deliberate, narrow, non-blocking test-coverage deferral ("revisit
      when MIG-04 lands"), reasoning that bpm.pool.Pool had no fault-injection
      hook without violating DIRECTIVE T-1 (no mocking of pool/DB
      components). RELEASE-VALIDATOR correctly rejected this: per this
      project's directives, a MUST requirement's acceptance criterion may
      not ship with zero passing integration-test evidence, however narrow
      or well-documented the deferral -- and, critically, RELEASE-VALIDATOR's
      own finding showed the "no fault-injection hook without mocking" premise
      was simply wrong: Pool.init() takes a real, non-mock pool_size
      parameter, so a genuine resource-exhaustion condition is constructible
      without mocking anything.
    resolution: >-
      TEST-DESIGNER (step-03, rework_count=1) added TC-MIG-02-04 to
      tests/integration/migration_fanout_test.zig: a dedicated pool_size=2
      bpm.pool.Pool (separate from the shared pool_size=5 pool every other
      test in the file uses) drives runFanout with a single fixture tenant
      and a failingStep, so that by the time recordFailureSeparately tries
      to acquire its own connection, the advisory-lock connection plus the
      tenant's own DDL connection have already exhausted the 2-connection
      pool -- producing a REAL PoolError.ExhaustedPool from src/db/pool.zig
      (not a mock, not a simulated error). The test asserts runFanout
      returns normally (no panic/escalation) and the control row is left
      exactly at its seeded pending status, error_msg IS NULL, completed_at
      IS NULL -- matching AC4's exact wording. TEST-DESIGNER fail-first
      verified this live: temporarily widening the dedicated pool to
      pool_size=5 removed the exhaustion and the row correctly became
      failed instead of pending, causing the new assertion to fail as
      expected, then reverted. tests/specs/MIG-02.md's AC4 row and Coverage
      note were rewritten to describe the real mechanism instead of
      documenting a deferral.
    reverification: >-
      TEST-DESIGN-VALIDATOR re-validated PASS (step-03b). TEST-RUNNER
      re-ran and confirmed test-integration-mig02-mig03 9/9 (was 8/8,
      step-04). RELEASE-VALIDATOR (step-05, this persisted handoff)
      independently re-read TC-MIG-02-04 and the production code it
      exercises (applyToTenant/recordFailureSeparately in
      src/platform/migration_fanout.zig) line-by-line -- not just trusting
      the spec/report claims -- confirmed the deferred pool.release() in
      applyToTenant genuinely does not fire until recordFailureSeparately's
      own pool.acquire() call has already executed and failed, then
      independently re-ran zig build test-integration-mig02-mig03 itself
      (9/9, exit 0) and re-ran zig build migrate twice to reconfirm
      idempotency was unaffected by the change. Returned APPROVED.
    why_this_matters_for_the_pipeline: >-
      This is a concrete instance of the pipeline's rework gate doing
      exactly what it exists to do: RELEASE-VALIDATOR did not accept a
      well-written, well-reasoned deferral note at face value, checked
      whether the stated reason (no fault-injection hook without mocking)
      was actually true, found it was not, and forced a genuine fix instead
      of a documentation-only patch. The resulting test is real fault
      injection against production code, not a relaxed assertion or a
      mocked component -- exactly the DIRECTIVE T-1 / anti-pattern
      guidance this pipeline is designed to enforce.

rule_adjustments: []

prevention_notes:
  - >-
    When a test spec documents an acceptance criterion as "deferred because
    no fault-injection hook exists without mocking," treat that premise
    itself as something to verify, not just the deferral's narrowness or
    documentation quality. In this run the premise was simply false: a
    resource-exhaustion condition was directly constructible from a real,
    already-parameterized pool_size config value. RELEASE-VALIDATOR checking
    the premise (not just the deferral's optics) is what surfaced this.
  - >-
    tools/clean_test_db.py's run_psql() over-broad "relation" substring
    match (ISS-0663/GH-700) remains open and unresolved -- it is a gate-
    integrity defect (a cleanup script can report success while leaving
    leaked rows in place) that could mask a real database-state problem on
    a future run's Green-Main Gate. Recommend prioritizing this fix before
    it causes a false-clean gate to mask an unrelated genuine regression.
  - >-
    ISS-0665/GH-702 (full zig build test-integration unreliable under this
    host's default ~40-binary concurrency) means a future ORCH Green-Main
    Gate check should not treat a single full-concurrency failing run as
    proof of a real regression on main -- cross-check failing files via a
    targeted/standalone re-run first, per that issue's own prevention notes.
    This run's RELEASE-VALIDATOR already applied that discipline by
    re-verifying via test-integration-mig02-mig03 / test-integration-gh512
    directly rather than relying on the full umbrella.
  - >-
    docs/requirements.yaml is confirmed as the sole live requirement-status
    tracker; docs/status/requirement_status.yaml is a generated export
    (tools/reqctl.py's own module docstring states this explicitly, and
    reqctl.py render-status is the only supported way to update it). Future
    DOC-UPDATER runs should not need to re-derive this -- it is settled, not
    an open question.

