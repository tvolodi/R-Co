prevention_notes:
  - >
    Same finding as WF02-iss502-continuation-20260730: continuation runs that
    resume a stalled prior WF-02 batch should get their own scoped
    estimation.json (this run did), but the estimate still cannot anticipate
    infra blockers or multi-round rework discovered mid-flight. Consider a
    convention where ORCH adds an explicit "infra-risk" contingency line to
    continuation-run estimates rather than treating ADHOC infra unblocks as
    pure overhead outside the estimate.
  - >
    This is the second consecutive continuation run (after
    WF02-iss502-continuation-20260730, same day) to discover that the
    test-integration umbrella suite had accumulated unrelated build breakage
    since it was last compiled end-to-end. Recommend a periodic (e.g. nightly
    or pre-release) `zig build test-integration` compile-only CI check so
    Zig-version API drift is caught immediately rather than surfacing as an
    ADHOC blocker on whichever unrelated requirement happens to touch the
    umbrella suite next.
  - >
    ISS-503-INFRA-01 (MINOR, from ADHOC-iss503-infra-20260730): running the
    full test-integration umbrella suite with default build-system
    parallelism against one shared bpm_test database produces ~120 spurious
    runtime failures (deadlocks, duplicate-key errors, cross-test tenant-row
    pollution) that do not reproduce when test binaries run individually or
    serially. Not fixed here (systemic, cross-cutting redesign, out of this
    run's scope) -- tracked for a future dedicated test-infra workflow.
  - >
    Both rework rounds in this run were the same class of defect the
    ISS-502 continuation run's prevention_notes already flagged: shared
    mutable public.tenant / public.tenant_id state leaking across test
    blocks. The docs/anti-patterns.md entry exists and was correctly applied
    once the flake was found, but it was not caught by TEST-DESIGNER's first
    draft or by TEST-DESIGN-VALIDATOR's first pass. Consider adding an
    explicit check to tools/lint_test_isolation.py for direct
    INSERT/UPDATE against public.tenant (or any shared, non-per-test-UUID
    table) outside of a transaction that is unconditionally rolled back or
    scoped to a per-test-UUID row, so this class of flake is caught before
    TEST-DESIGN-VALIDATOR rather than by RELEASE-VALIDATOR's repeated-run
    heuristic.

