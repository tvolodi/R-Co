summary: >
  This run resumed WF02-iss501-504-epic5-20260612, a prior WF-02 batch that
  implemented ISS-501..504 but left ISS-502's test-designer/test-runner steps
  at result=null (executeSptCutover() existed and was documented, but no
  integration test had ever been written or run). This run's only assigned
  scope was: write the missing tests/integration/iss502_spt_cutover_test.zig,
  validate it, and get a real TEST-RUNNER pass.

  Scope grew substantially beyond that during execution because of the
  Unblock-Everything directive. TEST-DESIGNER (step 03) discovered that ANY
  fresh-database bootstrap was broken (GBL-084's ISS-503 pre-flight check
  unconditionally failing because the seeded default tenant never gets
  promoted from LEGACY_RLS to SCHEMA on a from-scratch install) -- a
  pre-existing, unrelated infrastructure defect blocking the whole
  integration suite, not just ISS-502. BACKEND-DEV (step 00b) fixed that with
  a new migration (087_default_tenant_storage_mode_cutover.sql), then went
  through one rework round to fix a second pre-existing bug it surfaced along
  the way (SPT_BUSINESS_TABLES incorrectly including webhook_deliveries, plus
  a related missing-SAVEPOINT bug in executeSptCutover()'s best-effort
  schema_migrations copy step that was silently aborting the whole
  transaction on 3 of 4 test cases).

