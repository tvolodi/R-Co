prevention_notes:
  - >
    Continuation runs that resume a stalled prior WF-02 batch should get
    their own scoped estimation.json at dispatch time (even a rough one),
    rather than relying on the original batch estimate -- the two are not
    comparable once the scope has narrowed to "finish what's missing."
  - >
    Fresh-database bootstrap (DROP DATABASE + CREATE DATABASE + full migrate)
    is not exercised by the normal TEST-RUNNER pre-check, which reuses a
    long-lived db_test container. This let the GBL-084 pre-flight gap go
    undetected since GBL-084 was merged. Consider adding a periodic
    fresh-bootstrap CI check so this class of defect surfaces before it
    blocks a requirement's test step.
  - >
    docker-compose.yml declares db_test on host port 5433, but the actually
    running container in this environment was mapped to 5434 -- flagged as
    MINOR by both test-design-validator and test-runner in this run.
    feature/registry-consolidation (commit 8eb85ba) has an unrelated,
    not-yet-merged fix for this; out of scope here per explicit handoff
    instruction not to cherry-pick it.

