rework_steps:
  - step: step-03b (TEST-DESIGN-VALIDATOR, first pass -- not separately persisted)
    trigger: >-
      TEST-DESIGN-VALIDATOR's first validation pass FAILed on
      TC-MIG-04-03 ("resume's tenant snapshot query plan uses
      platform_migrations_resume_idx") in
      tests/integration/migration_resume_test.zig. The test ran EXPLAIN
      against its migration_id with ZERO fixture rows seeded beforehand, so
      Postgres's query planner picked a sequential scan over an
      effectively-empty table on cost grounds alone -- not because the
      index was broken or absent (migrations/1144_platform_migrations_control_table.sql:38
      defines it correctly), but because an empty/near-empty relation gives
      the planner no genuine reason to prefer an index scan. This meant
      zig build test-integration-mig04-mig05 was a real, reproducible 8/9,
      not the 9/9 the original pass-1 work had claimed.
    resolution: >-
      TEST-DESIGNER (step-03, rework_count=1) modified TC-MIG-04-03 to seed
      40 fixture rows (alternating pending/failed status, distinct random
      tenant_id values) under the test's own migration_id BEFORE running
      EXPLAIN, and wrapped the EXPLAIN in its own transaction with
      SET LOCAL enable_seqscan = off, mirroring the already-proven pattern
      in platform_migrations_control_table_test.zig::resume_index_used_by_pending_or_failed_query.
      This gives the planner both a genuine cost-grounded reason (40 rows
      is enough for the partial index to be the cheaper plan) and a
      deterministic guarantee (disabling seqscan removes the fallback that
      could otherwise mask a real regression) to select
      platform_migrations_resume_idx specifically. Seeded rows are cleaned
      up via the existing deferred cleanupControlRows; the EXPLAIN
      transaction itself is rolled back via defer conn.rollback() catch {}.
      tests/specs/MIG-04.md's TC-MIG-04-03 Given clause was rewritten to
      describe the new fixture-seeding + forced-index-scan method instead
      of the old (incorrect) zero-fixture-rows description.
    reverification: >-
      TEST-DESIGN-VALIDATOR re-validated PASS (step-03b, this persisted
      handoff) -- independently confirmed the fix is a genuine regression
      check, not a tautology: SET LOCAL enable_seqscan = off does not force
      a specific index (Postgres always retains a seqscan fallback when no
      index is usable), so the assertion (EXPLAIN output must literally
      contain the string platform_migrations_resume_idx) only passes if the
      planner actually selected that specific partial index. Re-ran
      zig build test-integration-mig04-mig05 --summary all TWICE itself
      with explicit env vars set (not relying on ambient shell state): both
      runs 9/9, exit 0. Confirmed via git diff fda513bf~1..fda513bf that
      REWORK 1 touched only migration_resume_test.zig, tests/specs/MIG-04.md,
      and handoff bookkeeping -- DDL-01 (21/21), MIG-06 (6/6), and the
      MIG-05 AC5 structural non-testable justification were untouched and
      remained valid from the original pass. TEST-RUNNER (step-04)
      confirmed 9/9 again in the full report run. RELEASE-VALIDATOR
      (step-05) independently re-ran the same target itself as part of its
      own cross-check before returning APPROVED.
    why_this_matters_for_the_pipeline: >-
      This is a different failure mode from batch 0's rework, and it shows
      the pipeline's gates catching different classes of defect at
      different stages: batch 0's rework was a RELEASE-VALIDATOR-caught
      MISSING coverage (an AC with zero passing test evidence, deferred
      behind a written justification that turned out to be factually
      wrong). This run's rework was a TEST-DESIGN-VALIDATOR-caught FALSE
      POSITIVE -- a test that existed, ran, and had in fact been failing
      (8/9, not the claimed 9/9), where the defect was in the test's own
      fixture setup rather than in the requirement's coverage story. Caught
      one gate earlier than batch 0's equivalent finding, before
      TEST-RUNNER or RELEASE-VALIDATOR ever saw it, which is a cheaper place
      in the pipeline for this class of defect to be caught.

rule_adjustments: []

prevention_notes:
  - >-
    When a query-plan-shape assertion (EXPLAIN output containing a specific
    index name) is written against a table with few or no seeded rows for
    the fixture's own key, the planner has no genuine cost-based reason to
    prefer the index under test, and the assertion can pass or fail for
    reasons unrelated to whether the index actually exists or is usable.
    The fix pattern used here (seed a realistic row count for the specific
    query key, AND force enable_seqscan off inside a scoped, rolled-back
    transaction) is now precedented twice in this codebase
    (platform_migrations_control_table_test.zig's original instance, and
    this run's migration_resume_test.zig fix) -- future EXPLAIN-based index
    assertions should follow it rather than relying on either seeding alone
    or enable_seqscan alone.
  - >-
    This run had zero infrastructure defects surface during its Green-Main
    Gate, in contrast to batch 0's two. That is worth noting as a positive
    data point on ISS-0663/ISS-0664/ISS-0665's current impact rather than
    re-litigating them here -- ISS-0663 (tools/clean_test_db.py's
    over-broad "relation" substring match) and ISS-0665 (full
    test-integration concurrency reliability) both remain open per batch
    0's retrospective and were not re-triggered by this run's narrower,
    targeted test commands.
  - >-
    MIG-06's known_migration_ids/DdlStep placeholder (empty slice, no-op
    DdlStep at the src/main.zig route-registration call site) is now
    RELEASED as a disclosed, accepted interim state -- confirmed sound at
    Step 1b, Step 2c, Step 3b, and Step 5 independently, each re-reading the
    actual source rather than trusting the prior gate's claim. The
    integration point for closing it is DDL-01's future migration-plan
    CLI/file registry, which does not yet exist. A future batch that builds
    that registry should update src/main.zig's route-registration call site
    (lines ~1147-1189 as of this run) to supply real known_migration_ids
    and a real DdlStep, and should re-run TC-MIG-06-02 against the real
    registry rather than its current test-supplied double.

