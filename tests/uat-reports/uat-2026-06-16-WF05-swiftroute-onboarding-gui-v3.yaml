issues:
  - id: UAT-WF05-v3-001
    severity: MAJOR
    eo_ref: EO-004
    title: >
      Tenant administrator cannot access BPM platform management console
      using company-specific identity credentials
    business_description: >
      After a company is successfully onboarded, the company's designated
      administrator is locked out of the BPM platform management console.
      The platform's management console requires users to sign in through
      the platform's central identity service (BPM Default Realm), but the
      onboarding wizard creates the new administrator's account in the
      company's own dedicated identity service. There is no path for Alice
      to reach her SwiftRoute workspace dashboard using the credentials
      she was assigned during onboarding.
    affected_component: BPM platform frontend authentication
    root_cause_hypothesis: >
      The platform frontend is configured to use only the bpm-default Keycloak
      realm for authentication. Tokens issued by per-tenant realms (e.g.
      swiftroute) are rejected because the token issuer does not match the
      configured OIDC provider. No identity federation or per-tenant login
      routing is implemented in the frontend.
    suggested_action: route_to_wf03

  - id: UAT-WF05-v3-002
    severity: MINOR
    eo_ref: EO-003
    title: >
      Pipeline test does not inject tenant display name or admin display name
    business_description: >
      The onboarding pipeline test correctly injects the company slug and
      administrator username via environment variables, but does not support
      injecting the company display name or the administrator's full name.
      As a result, the test created the company as "Pipeline Tenant 450e0eae"
      instead of "SwiftRoute Ltd", and the administrator's display name was
      set to "PL Admin 450e0eae" instead of "Alice Bauer". This is a gap in
      the test tooling, not in the platform itself.
    affected_component: web/tests/e2e/pipelines/onboarding-wizard.pipeline.e2e.spec.ts
    suggested_action: add_ONBOARDING_PIPELINE_DISPLAY_NAME_and_ADMIN_DISPLAY_NAME_env_vars

overall_summary: >
  The SwiftRoute tenant onboarding wizard completed successfully end-to-end
  through the browser interface. The platform operator was guided clearly
  through form submission, a progress indicator, and a success result screen.
  Alice Bauer's account was created and she can authenticate in the SwiftRoute
  identity workspace. However, the onboarding journey has an open gap: Alice
  cannot reach the BPM platform management console using her SwiftRoute
  credentials. Until this is resolved, SwiftRoute cannot begin using the
  platform for their business processes. This gap must be routed for
  investigation and resolution before the release can be approved.
