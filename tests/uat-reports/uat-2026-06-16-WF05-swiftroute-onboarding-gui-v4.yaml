business_summary: >
  SwiftRoute's workspace was successfully set up through the onboarding wizard and Alice
  Bauer received her credentials immediately. The "Register Tenant" form was completed in
  full and the progress screen confirmed the workspace was being prepared — both as
  expected. Alice can log into her Keycloak account page directly (her credentials work
  in the SwiftRoute identity space). However, when Alice tries to reach the SwiftRoute
  workspace via the intended entry URL with the realm selector, the login completes in
  Keycloak but the workspace fails to open afterwards — the screen keeps refreshing
  without loading her dashboard. Alice cannot access her SwiftRoute workspace through the
  workspace URL entry point. This is the blocking defect for this run.

