        the swiftroute OIDC authority for the token exchange.

issues:
  - id: ISS-UAT-EO004-LOOP
    severity: BLOCKER
    title: >
      Alice cannot reach the SwiftRoute workspace after login — OIDC callback loop
    business_description: >
      When Alice tries to open her SwiftRoute workspace using the workspace entry URL,
      the login screen correctly shows the SwiftRoute sign-in page (not the wrong
      company). Alice's username and password are accepted by Keycloak. But after
      Keycloak confirms her identity, the workspace application keeps reloading without
      ever showing Alice's dashboard. Alice is effectively locked out of her workspace
      even though her credentials are correct.
    suggested_action: route_to_wf03
    technical_context: >
      OIDC auth code was issued by Keycloak swiftroute realm. Callback to
      http://127.0.0.1:4173/auth/callback triggered a redirect loop
      (3+ page-load cycles). Token exchange may be using wrong authority (bpm-default
      instead of swiftroute). Correlates with ISS-0072 incomplete fix — Fix 1 and Fix 2
      are live but token exchange authority may not be updated.

