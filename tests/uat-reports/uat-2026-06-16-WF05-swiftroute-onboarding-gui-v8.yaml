overall_verdict_reason: >
  Two blockers prevented the scenario from passing. First, the onboarding
  saga fails on its first attempt because the code that registers the
  audience and roles mappers sends the request to a Keycloak URL that
  does not exist — the platform's URL builder targets a realm-level
  protocol-mapper path that Keycloak returns 404 for. As a result, the
  platform operator sees an "Onboarding failed" message when they submit
  the new-tenant form. Second, even after a second attempt succeeded in
  provisioning the workspace, Alice Bauer cannot log in: her authentication
  token carries the wrong audience value, so the backend rejects it. Both
  blockers trace to the same URL bug introduced in PR #113.

