outcomes:
  - id: EO-001
    title: >
      Result screen confirms SwiftRoute's workspace was set up successfully
    verdict: FAIL
    severity: BLOCKER
    evidence:
      screenshot_attempt1: >
        web/test-results/pipelines-onboarding-wizar-c66d4-gisters-a-tenant-end-to-end-chromium/test-failed-1.png
      screenshot_attempt2: >
        web/test-results/pipelines-onboarding-wizar-c66d4-gisters-a-tenant-end-to-end-chromium-retry1/test-failed-1.png
    business_summary: >
      When the platform operator submitted the SwiftRoute registration form, the
      onboarding process reported a failure. The screen displayed "Onboarding
      failed" with an error code. The operator was given a "Try Again" button
      but no explanation of what went wrong. The wizard did not show a
      confirmation screen with the company slug or the login URL that Alice would
      use. The workspace was eventually created behind the scenes, but the operator
      had no way to verify this from the wizard — they only saw a failure.
    business_impact: >
      A platform operator registering a new customer company would believe the
      registration failed and would be unable to hand over login details. They
      would need to investigate the internal system state manually to confirm the
      workspace was actually created.
    root_cause_technical: >
      The onboarding backend saga fails at Step 10 (realm-roles mapper) because
      keycloak_urls.protocolMappersCollection generates
      /admin/realms/{realm}/protocol-mappers/models — an endpoint that Keycloak
      returns HTTP 404 for. Step 10 treats any non-201/204/409 status as a
      provisioning failure and aborts the saga. The URL should target the
      bpm-platform-api client's mapper endpoint:
      /admin/realms/{realm}/clients/{client-id}/protocol-mappers/models.
      This bug was introduced by PR #113 which added Step 11 (audience mapper)
      using the same incorrect URL builder, and the existing Step 10 already had
      the same URL bug that was previously hidden because Step 9 silently ignored
      the 404.

