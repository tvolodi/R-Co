      password_policy_note: >
        The swiftroute realm enforces an uppercase character requirement.
        The password "alice-pass-001" (all lowercase) used by the pipeline
        test fails this policy. The password must be reset to "Alice-Pass-001"
        or equivalent before Alice can log in.
    business_summary: >
      Alice Bauer's account was created in the SwiftRoute workspace and is
      active. However, the password set during onboarding does not meet the
      workspace's password policy, which requires at least one uppercase letter.
      Alice cannot log in immediately with the credentials provided during
      onboarding. A separate password reset step is required, which means Alice
      does not gain "immediate access" as the scenario requires.
    root_cause_technical: >
      The onboarding saga creates alice.bauer but does not set a temporary
      password that satisfies the realm's password policy (minUpperCase >= 1).
      The pipeline test attempts login with "alice-pass-001" which fails the
      policy constraint.

  - id: EO-004
    title: >
      Alice's dashboard shows only SwiftRoute's workspace with correct branding
    verdict: FAIL
    severity: BLOCKER
    evidence:
      alice_token_aud: account
      expected_aud: bpm-platform-api
      backend_response: "HTTP 401 invalid token audience"
      audience_mapper_in_client: false
      realm_protocol_mapper_endpoint_status: 404
    business_summary: >
      Alice cannot reach her SwiftRoute workspace. When she logs in through
      the Keycloak authentication screen, her session token is rejected by the
      platform. The platform shows a "Redirecting to login..." loop and Alice
      never sees her workspace dashboard. She is effectively locked out of the
      system that was just created for her company.
    business_impact: >
      SwiftRoute's administrator cannot begin using the platform. No processes
      can be started, no users can be invited, and no company configuration can
      be done. The workspace exists in the system but is inaccessible.
    root_cause_technical: >
      Alice's JWT carries aud="account" instead of aud="bpm-platform-api".
      The backend's audience validation rejects this token with HTTP 401.
      The root cause is the same as EO-001: the keycloak_urls.protocolMappersCollection
      URL returns HTTP 404 from Keycloak, so the audience protocol mapper
      (oidc-audience-mapper with included.client.audience=bpm-platform-api)
      was never added to the bpm-platform-api Keycloak client in the swiftroute
      realm. The oidc-audience-resolve-mapper in the "roles" scope does not
      substitute for an explicit audience mapper because bpm-platform-api has
      no client roles defined.

issues:
  - id: ISS-V8-001
    severity: BLOCKER
    title: >
      Onboarding saga fails at Step 10 due to wrong Keycloak protocol-mapper URL
    business_description: >
      The platform's workspace registration process fails on the first attempt
      for every new company. The operator sees an error message and must retry.
      When retrying, the system recovers by accident (the workspace was partially
      created on the first attempt), but the recovery is silent and unreliable.
    technical_detail: >
      keycloak_urls.protocolMappersCollection generates
      /admin/realms/{realm}/protocol-mappers/models which Keycloak returns
      HTTP 404 for. Steps 10 (realm-roles mapper) and 11 (audience mapper)
      in src/identity/provider/adapters/keycloak/provider.zig both check
      the response status and return ProvisionRealmError on non-201/204/409.
      The correct endpoint for adding protocol mappers to the bpm-platform-api
      client is /admin/realms/{realm}/clients/{client-id}/protocol-mappers/models.
      Step 9 (tenant_id mapper) silently ignores the 404 (uses _ = try) so it
      does not cause a visible failure, but the mapper is also never applied.
    suggested_action: route_to_wf03

  - id: ISS-V8-002
    severity: BLOCKER
    title: >
      Alice cannot access her workspace — JWT audience mismatch persists
    business_description: >
      Even when the workspace is successfully provisioned, Alice Bauer cannot
      log in. The authentication system issues a token that the platform
      does not recognise as valid. Alice sees an endless redirect loop
      rather than her company dashboard.
    technical_detail: >
      Alice's access token from the swiftroute realm has aud="account" because
      the audience mapper (oidc-audience-mapper with
      included.client.audience=bpm-platform-api) was never applied to the
      bpm-platform-api client. This is a consequence of ISS-V8-001. Fixing the
      mapper URL in provisionRealm will resolve both issues simultaneously.
    suggested_action: route_to_wf03

  - id: ISS-V8-003
    severity: MINOR
    title: >
      Onboarding progress page stays at /progress URL on saga failure, blocking
      the pipeline test
    business_description: >
      When workspace registration fails, the page displays the error inline
      on the progress screen rather than navigating to a dedicated result page.
      This is acceptable for a human operator (who sees the error message) but
      causes the automated acceptance test to wait 150 seconds before recognising
      the failure.
    technical_detail: >
      The Playwright pipeline test waits for navigation to
      /admin/onboarding/{id}/result but on saga failure the browser remains on
      /admin/onboarding/{id}/progress (or equivalent). The waitForURL pattern
      should include the failure URL or the progress page should navigate to
      /result with a failure payload regardless of saga outcome.
    suggested_action: route_to_frontend_dev

  - id: ISS-V8-004
    severity: MINOR
    title: >
      Pipeline test total timeout insufficient for two attempts
    business_description: >
      The automated acceptance test stops before it can confirm that the
      workspace registration succeeded on a second attempt, even when the
      workspace is created correctly.
    technical_detail: >
      The 300-second per-test timeout leaves only ~148 seconds for the retry
      attempt after the first 152-second failure. The saga requires ~130 seconds,
      making the timing too tight. Increase the overall test timeout to 600
      seconds or reduce saga duration. ISS-V8-001 is the prerequisite fix —
      once the saga succeeds on the first attempt, this timeout issue disappears.
    suggested_action: route_to_frontend_dev

