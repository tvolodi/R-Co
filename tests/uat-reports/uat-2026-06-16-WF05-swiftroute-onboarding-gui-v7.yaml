  - id: EO-004
    title: "Alice Bauer can access the SwiftRoute workspace and see the SwiftRoute Ltd dashboard"
    verdict: FAIL
    severity: BLOCKER
    business_summary: >
      Alice cannot access her SwiftRoute workspace. After arriving at the SwiftRoute
      sign-in page and entering her credentials, the login completes at the identity
      provider side, but the platform immediately rejects her session. The screen
      shows "Redirecting to login..." in a loop — Alice is never shown her workspace.
      The SwiftRoute sign-in screen branded as "SWIFTROUTE LTD" appeared correctly,
      and the login flow reached the platform callback page (confirming the ISS-0073
      fix for the realm-aware redirect address is working). The rejection happens
      at the next step when the platform validates Alice's identity token.
    root_cause: >
      The SwiftRoute bpm-platform-api Keycloak client was created by the onboarding
      saga without an audience protocol mapper. Alice's identity token carries
      aud="account" instead of aud="bpm-platform-api". The platform backend
      requires the audience claim to match "bpm-platform-api" and rejects the
      token with "invalid token audience" (HTTP 401), triggering an authentication
      loop.
    jwt_evidence:
      iss: "http://localhost:8081/realms/swiftroute"
      aud: "account"
      azp: "bpm-platform-api"
      realm_access_roles:
        - offline_access
        - default-roles-swiftroute
        - uma_authorization
        - PLATFORM_ADMIN
      backend_rejection: "HTTP 401 — invalid token audience"
    screenshot_primary: "scratch/uat-v5-eo-004-05-final.png"
    screenshot_supporting:
      - "scratch/uat-v5-eo-004-02-kc-login.png"
      - "scratch/uat-v5-eo-004-04-after-callback.png"

issues:
  - id: ISS-UAT-V7-001
    severity: BLOCKER
    description: >
      The SwiftRoute workspace login is blocked. After Alice completes her sign-in
      at the SwiftRoute identity page, the platform rejects her session because the
      identity token lacks the correct audience claim. The onboarding process does
      not configure the audience protocol mapper on the SwiftRoute client during
      provisioning, so Alice's token identifies itself as being for the account
      service rather than the platform API. Alice cannot reach her workspace.
    affected_step: EO-004
    fix_required: >
      The onboarding saga must add an audience protocol mapper to the bpm-platform-api
      client in the newly created tenant realm. The mapper should add "bpm-platform-api"
      to the aud claim in all access tokens issued by that client. This is the same
      pattern as required for the realm-roles mapper (ISS-UAT-V6-001).

  - id: ISS-UAT-V7-002
    severity: MINOR
    description: >
      The onboarding progress observation window in the automated test is too short.
      The workspace provisioning completed correctly but the automated test timed out
      before the completion screen appeared. The test allows 120 seconds total, but
      the provisioning took approximately 130 seconds. The result screen evidence
      could not be captured.
    affected_step: EO-001
    fix_required: >
      Increase the test.setTimeout to at least 200 seconds in the onboarding wizard
      pipeline test to accommodate the maximum saga execution time.

