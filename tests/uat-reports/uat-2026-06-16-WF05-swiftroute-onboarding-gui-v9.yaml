  - id: EO-004
    title: Alice sees SwiftRoute Ltd branded dashboard after logging in via browser
    verdict: FAIL
    severity: MAJOR
    business_description: >
      Alice Bauer cannot access her SwiftRoute workspace through the browser.
      When she navigates to the SwiftRoute login page and enters her credentials,
      the Keycloak authentication succeeds, but the platform immediately redirects
      her back to the login page in an infinite loop. Alice never reaches the
      dashboard and cannot see the SwiftRoute Ltd workspace.
    technical_root_cause: >
      The onboarding saga provisions the audience protocol mapper on the
      bpm-platform-api client in the swiftroute Keycloak realm (confirmed by
      aud=bpm-platform-api in Alice's JWT). However, it does not provision a
      roles-flattening protocol mapper. Alice's JWT contains roles under
      realm_access.roles (standard Keycloak format), but the SPA's
      OidcCallbackPage checks payload.roles (a flat top-level claim). Since
      payload.roles is undefined, the callback page considers the token invalid
      and calls window.location.replace('/'), which triggers another login
      redirect — creating an infinite loop. Network trace confirmed: POST to
      Keycloak /token returns 200 (token obtained), then immediately GET to
      Keycloak /auth redirects to a new login — repeated 8+ times.
    evidence:
      - "Playwright EO-003/004 test: EO-003 passed, EO-004 failed (body empty, redirect loop)"
      - "Screenshot at web/test-results/uat-eo-003-004-v5.e2e.../test-failed-1.png: 'Redirecting to login...'"
      - "Network trace: POST /realms/swiftroute/protocol/openid-connect/token -> 200, then GET /auth -> 302 (loop)"
      - "Direct API verification: Alice's token with realm_access.roles works against backend /api/v1/tenants"
      - "JWT payload.roles field: undefined (roles are at realm_access.roles, not flat)"
    fix_required: >
      The onboarding saga must also register a User Realm Role mapper on the
      bpm-platform-api client that maps realm roles to a flat 'roles' claim
      in the JWT. This is a companion protocol mapper alongside the audience mapper
      already being provisioned.
    screenshot: scratch/eo004-screenshots/05-net-trace.png

issues:
  - id: ISS-V9-001
    severity: MAJOR
    description: >
      Alice Bauer cannot access her SwiftRoute workspace through the browser login
      flow. Her Keycloak credentials are accepted but the platform enters an
      infinite redirect loop and never shows the dashboard. The onboarding saga
      does not provision a protocol mapper that flattens realm roles into the
      JWT's top-level 'roles' field, which the SPA's callback page requires
      to accept the token as valid.
    affected_step: 4 (tenant_admin login and dashboard access)
    recommended_fix: >
      In the onboarding saga's Keycloak provisioning step, after adding the
      audience protocol mapper, also POST a User Realm Role mapper to the
      bpm-platform-api client with token_claim_name='roles' and
      claim.name='roles'. This ensures the SPA callback can read roles
      from payload.roles.

