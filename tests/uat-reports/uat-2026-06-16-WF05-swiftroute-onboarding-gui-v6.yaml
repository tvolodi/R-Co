    verdict: FAIL
    severity: BLOCKER
    business_impact: >
      Alice cannot access the SwiftRoute workspace through the BPM platform at all.
      She authenticates successfully with the SwiftRoute identity system, but the moment
      she returns to the platform the system discards her login and sends her back to
      the login page in an endless cycle. The workspace is completely inaccessible.
      SwiftRoute Ltd is effectively cut off from the platform despite a successful
      onboarding registration.
    root_causes:
      - id: RC-01
        description: >
          The platform's onboarding process creates the SwiftRoute identity client without
          the configuration needed to include user role information in the login token.
          Without role information, the platform cannot determine what Alice is allowed to do
          and immediately rejects her session. This issue was identified during UAT and a
          workaround was applied manually, but the underlying onboarding setup is incorrect.
        severity: BLOCKER
        suggested_action: route_to_wf03
        technical_note: "Missing realm-roles protocol mapper on bpm-platform-api client in swiftroute realm"
      - id: RC-02
        description: >
          The platform's tenant management service does not recognise credentials issued by
          the SwiftRoute identity system. When the platform tries to look up SwiftRoute's
          details after Alice logs in, it rejects Alice's SwiftRoute credentials with an
          'invalid token issuer' error. This causes the platform to discard Alice's session
          and restart the login — creating an infinite loop where Alice can never reach
          her workspace. The platform must be updated to accept credentials from tenant
          identity systems, not just the platform's own central identity system.
        severity: BLOCKER
        suggested_action: route_to_wf03
        technical_note: >
          Backend auth middleware only accepts bpm-default realm JWTs.
          GET /api/v1/tenants/swiftroute with swiftroute realm JWT returns 401
          with detail='invalid token issuer'. OidcCallbackPage calls this endpoint
          with the tenant user's JWT before the session is established, triggering
          auth:session-expired event which restarts the OIDC flow.
    evidence: >
      Screen 4 shows the platform momentarily displaying 'Completing sign-in...' after
      Alice's successful authentication with SwiftRoute. Screen 5, taken 15 seconds later,
      shows a new 'Completing sign-in...' with a different authorization code — confirming
      the platform discarded her login and started fresh. The SwiftRoute workspace dashboard
      was never shown. The 'SwiftRoute Ltd' workspace header was not visible at any point.
      Technical evidence: GET /api/v1/tenants/swiftroute with Alice's swiftroute JWT →
      401 Unauthorized "invalid token issuer".
    applicable: true

issues:
  - id: ISS-UAT-V6-001
    title: Onboarding saga omits realm-roles protocol mapper from tenant Keycloak client
    severity: BLOCKER
    description: >
      When the platform onboards a new tenant, it creates an identity client (bpm-platform-api)
      in the new tenant's identity realm without the configuration that maps user roles into
      the login token. Without role information in the token, the platform rejects every login
      attempt from that tenant's users. The correct configuration (present in the platform's
      main identity realm) was missing in the newly created SwiftRoute identity realm.
    affected_step: Step 4 / EO-004
    suggested_action: route_to_wf03

  - id: ISS-UAT-V6-002
    title: BPM platform workspace inaccessible due to tenant identity credential rejection
    severity: BLOCKER
    description: >
      Alice Bauer cannot log in to the SwiftRoute workspace. After authenticating
      successfully with SwiftRoute's identity system, the platform tries to look up
      SwiftRoute's account details. This lookup uses Alice's SwiftRoute credentials, which
      the platform's account service does not accept — it only recognises credentials from
      the platform's own central identity system. The rejection causes the platform to
      discard Alice's session and restart the login cycle indefinitely. Alice is locked out
      despite completing a successful onboarding.
    affected_step: Step 5 / EO-004
    suggested_action: route_to_wf03

  - id: ISS-UAT-V6-003
    title: Onboarding wizard creates tenant identity client with overly restrictive callback configuration
    severity: MAJOR
    description: >
      The onboarding form accepts a 'callback URL' which becomes the only allowed redirect
      address for the tenant's login flow. In a real deployment this would be the company's
      application URL. In the UAT environment the test filled in a placeholder
      (https://app.example.com/cb) and the Keycloak client was created with only that URL.
      When Alice tried to log in through the platform, the login redirect was refused because
      the platform's actual callback address was not on the approved list. The platform's main
      identity realm uses a wildcard (allowing all addresses) but newly created tenant realms
      use a single specific address from the form. This was resolved during UAT by adding the
      test environment address manually, but the production onboarding flow has no mechanism
      to add the platform's own callback addresses to the approved list.
    affected_step: Step 5 / EO-004 (pre-condition)
    suggested_action: route_to_wf03

