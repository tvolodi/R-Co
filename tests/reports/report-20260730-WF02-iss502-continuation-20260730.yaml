verification_methodology: >
  Ran `zig build test-integration-iss502` twice with corrected BPM_TEST_DB_URL:
  (1) via `zig build test-integration-iss502 --summary all` — wrapper printed
  interleaved POSTGRES ERROR lines (expected: idempotent setup probing for
  not-yet-created tables, plus a deliberately-triggered PK-conflict duplicate-key
  error that IS the TC-ISS502-03 test scenario) followed by "failed command: ..."
  in its progress-tree renderer despite the underlying step succeeding — this is
  the known Zig 0.16.0-dev display quirk. Verified the TRUE result via the
  "Build Summary: 5/5 steps succeeded; 4/4 tests passed" line and explicit
  `$?`/PIPESTATUS[0]` capture = 0.
  (2) Isolated re-run redirecting all output to a log file and checking the
  real exit code in the same statement: exit code 0, confirmed independent of
  the wrapper's renderer.
  (3) Located and ran the compiled test binary directly
  (.zig-cache/o/a2b73a7cf9a32daa92c20a89764abc56/test.exe) with
  BPM_TEST_DB_URL and BPM_MIGRATIONS_DIR set explicitly — unambiguous stdout:
  "1/4 ... OK", "2/4 ... OK", "3/4 ... OK", "4/4 ... OK", "All 4 tests passed."
  and BINARY_EXIT:0. All three methods agree: 4/4 real, verified PASS.

