infra_note: >
  BPM_TEST_DB_URL in the ambient shell environment pointed at port 5433
  (postgres://bpm:bpm@localhost:5433/bpm_test), matching docker-compose.yml's
  declared "5433:5432" mapping for db_test. The actually-running r-co-db_test-1
  container had drifted and was mapped to host port 5434 instead (confirmed via
  `docker ps` / `docker port r-co-db_test-1`); port 5433 on this host is occupied
  by an unrelated container (aiqadam-postgres) which likely caused the original
  drift when db_test was recreated. Per the handoff's instructions, this was
  resolved for the session only by exporting a corrected
  BPM_TEST_DB_URL=postgres://bpm:bpm@localhost:5434/bpm_test in the same shell
  invocation as each build/test command (Windows Bash tool resets env between
  calls, so the export had to be chained with `&&` into every test command).
  docker-compose.yml and .env files were NOT modified, and no cherry-pick from
  feature/registry-consolidation was performed, per explicit instruction.
  This same port drift was also the root cause of 21 unit test failures
  (test_api08_auth.zig, all PgError.AuthenticationFailed / PoolError.ConnectionFailed)
  seen on the first zig build test attempt with the stale ambient env var;
  re-running with the corrected port fixed all 21 with no source changes needed.

