notes_on_pre_existing_failures:
  - description: >
      The full 'zig build test-integration' step (main_test.zig) has 272 pre-existing
      failures in a batch of 477 tests, starting with TC-DB-01-01 which expects 6 tables
      in the public schema (schema_migrations, events, instance_projections,
      instance_sequence, event_type_registry, events_archive) but finds only 1
      (schema_migrations). These tables migrated to per-tenant schemas via GBL-073 and
      are not present in public. These failures pre-date ISS-101 and are unrelated
      to the timers.status constraint change.
    severity: pre-existing
    scope: unrelated to ISS-101

remediation_performed:
  - description: >
      The ISS-101 test file (iss101_timers_failed_status_test.zig) was originally
      written using 'SET search_path TO tenant_default,public' which failed because
      the tenant_default schema has no tables (timers live in per-tenant schemas).
      TEST-RUNNER rewrote the test to use provisionTenantSchema (via pool) to create
      a fresh tenant schema per test, then open a direct pg.Conn with the correct
      search_path. This follows the same pattern used by tnt_schema_isolation_test.zig.
  - description: >
      Added iss101_timers_failed_status_test.zig to main_test.zig imports and comptime block.
  - description: >
      Added test-integration-iss101 dedicated build step and run_iss101_integration_tests
      artifact to build.zig. Also wired it into the main test-integration step.

