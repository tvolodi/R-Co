    in the ON CONFLICT UPDATE so the row satisfies the new
    check constraint, OR (b) set tenant_type='production' to
    match the existing default row's state (already
    tenant_type='production', production_tenant_id=NULL).
    Option (b) is the minimal change.
  rationale: >
    All 461 runtime failures trace to TestHarness.init() failing
    in ensureDefaultOidcSeeds with the same constraint violation.
    A 1-line fix to the harness INSERT will unblock every failing
    test binary that uses TestHarness.init() (which is the
