# VERDICT
# -----------------------------------------------------------------------------
verdict: FAIL  # see explanation
verdict_explanation: >
  The Step 3 rework did exactly what it was scoped to do: fix the
  5 compile-error call sites for the new Migrations.runForSchema
  force_reconcile parameter. All 501 integration test binaries now
  compile cleanly. This is a clear PASS for the rework's stated goal.

  However, the re-verify surfaces a separate, pre-existing runtime
  problem: 461 of 624 integration tests fail at TestHarness.init()
  due to ck_tenant_type_fk_coherence check constraint violation.
  The harness INSERT in helpers.zig:362 sets tenant_type='test'
  but omits production_tenant_id, violating the constraint
  ((tenant_type='production') -> (production_tenant_id IS NULL)
   OR (tenant_type='test') -> (production_tenant_id IS NOT NULL)).

  This runtime issue is a different bug (a code-vs-constraint
  mismatch under INV-TI-3) and is NOT a regression introduced by
  the rework — but it IS a blocker for declaring PASS on the
  overall Step 5 verification because the test suite cannot run
  to completion.

  Per the WF-03 Step 5 procedure (test_infrastructure_guide.md §3
  and WF-03_issue_resolving.md §5), TEST-RUNNER must report FAIL
  if tests do not pass; ORCH will then either rework Step 3 once
  more (rework_count: 1/3) or spawn a new WF-03 for the
  constraint issue separately. TEST-RUNNER does NOT have authority
  to retry or rework on its own.

