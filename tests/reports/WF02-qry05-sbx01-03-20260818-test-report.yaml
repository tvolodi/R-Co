    tests: [sbx02_01, sbx02_02, sbx02_03, sbx02_04, sbx02_05]
    description: >
      handleSubmitTaskSpec returns HTTP 400 for all SBX-02 test cases. The
      SBX-02 requirement mandates that the server ignores any
      orchestrator_principal in the request body and uses the token subject
