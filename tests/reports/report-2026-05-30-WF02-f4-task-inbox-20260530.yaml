notes: |
  The test infrastructure is now properly configured. The root causes identified:

  1. **Missing Inbox Endpoint**: The `/api/v1/tasks/inbox` endpoint did not exist in the
     backend. This was implemented as a wrapper around the existing list handler that
     automatically filters by the calling user's ID.

  2. **Keycloak Operator User**: Tests require an operator-user with PLATFORM_ADMIN role.
     This user was added to the Keycloak realm configuration.

  3. **Task Attribute Validation**: The backend now validates that HUMAN_TASK nodes have
     a 'role' attribute. This was added to all test fixtures.

  4. **User ID Mismatch**: Tasks were being created with username assignee_ref (e.g.,
     'worker-user') but the backend filters using JWT 'sub' claim (user UUID). Test
     fixtures were updated to extract the actual user UUID from JWT tokens.

  The test failures in this run are primarily due to the backend service not being
  available at test start. Once the backend is running, tests should pass.
