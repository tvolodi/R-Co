issues:
  - id: ISSUE-001
    severity: MINOR
    description: >
      Confirmed gh_claim.py can still race under close timing (two claims ~54
      minutes apart in this case, both within the 120-minute TTL, is not itself
      surprising -- the concerning part is that gh_claim.py's OWN read of
      origin/main at claim time did not yet reflect r-co-1-loop's earlier
      claim, meaning the claim commit had not propagated/been pulled before
      this workspace's claim ran). This is the same general class of issue
      ISS-0615/GH-563 (fixed earlier this session) addressed for a different
      manifestation (stale TTL, push-visibility-lag). This particular
      occurrence was caught and correctly resolved via git's own
      non-fast-forward push rejection plus careful manual reconciliation --
      not silently lost work. Not re-filed as a new issue; noted here for
      audit visibility. If this pattern recurs, it may warrant tightening
      ISS-0615's fix further (e.g. always `git pull --ff-only` immediately
      before gh_claim.py runs, which the protocol already mandates but may not
      always be followed in practice).
