focus_test:
  id: TC-DB-02-04
  name: "invalid pool_size returns InvalidPoolSize; boundary values succeed"
  file: "tests/integration/db_integration_test.zig"
  result: PASS
  notes: >
    TC-DB-02-04 does NOT appear in the failure list of the v2 integration run.
    The original flake was caused by two defects fixed in this WF:
    (1) hardcoded pool_size=200 exhausting connection slots under concurrent
        test load → replaced with runtime safe_pool_size probe
        (SHOW max_connections + pg_stat_activity count, SkipZigTest if available<2);
    (2) safe_pool_size declared as u16 but PoolConfig.pool_size is u8
        → corrected to u8 (cap of 200 fits in u8).
    docker-compose.yml db_test max_connections raised 250→500 to provide headroom.

