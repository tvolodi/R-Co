# =============================================================================
# Root cause (why the fix failed)
# =============================================================================
root_cause_analysis:
  primary_defect:
    location: src/db/provisioning.zig
    function: provisionTenantSchema
    block: "Step 6a (lines 146-167)"
    description: >-
      The Step 6a INSERT statement populates only (id, storage_mode) for
      public.tenant. The table schema (verified via information_schema.columns
      in test DB) requires 7 NOT NULL columns:
        id           uuid        NOT NULL
        slug         text        NOT NULL
        display_name text        NOT NULL
        status       text        NOT NULL
        created_at   timestamptz NOT NULL
        updated_at   timestamptz NOT NULL
        storage_mode text        NOT NULL
        tenant_type  text        NOT NULL
      The INSERT therefore fails with C23502 'null value in column "slug"
      of relation "tenant"' — every call to provisionTenantSchema for a
      brand-new tenant returns SchemaPromotionFailed.
    count_in_log: 97        # 97 occurrences of "slug" NOT NULL violation in scratch/_impl_integ.log
    cascade_impact: >-
      Because provisionTenantSchema fails AFTER it has already called
      bpm_provision_tenant_schema() (Step 4) and runForSchema (Step 5),
      tenant_<uuid> schemas are CREATED but no public.tenant row exists.
      Subsequent pool.acquire() calls see the schema is provisioned in
      public.tenant_schemas (the new Step 2 fallback in the resolver
      SHOULD catch this) — but the resolver's two-query chain also fails
      silently if the connection's storage_mode cache is poisoned, AND
      tests that acquire before any provision (TC-TNT-03-01/03/05) have
      no tenant_schemas row at all.

  secondary_defects:
    - id: D1
      location: src/db/pool.zig::resolveAndCacheStorageMode
      description: >-
        The new Step 2 fallback (public.tenant_schemas check) is dead
        code for tests that never call provisionTenantSchema (TC-TNT-03-01
        mints a UUID and calls pool.acquire() with no provisioning). The
        fallback is useful only when provisioning succeeded — but Step 6a
        of provisioning is broken, so the fallback never triggers in
        practice for fresh tenants in integration tests. Net: routing
        still falls through to LEGACY_RLS.

    - id: D2
      location: tests/integration/helpers.zig
      description: >-
        bpm.api_tenant_context.clear() in TestHarness.init() is correct in
        isolation but insufficient: it clears the cache for the new test
        thread, but if the underlying DB still has a poisoned
        search_path connection in the pool, the first pool.acquire() in
        the test re-runs the resolver and gets LEGACY_RLS because
        public.tenant_schemas is empty for a fresh UUID. The clear()
        addresses the cache-poisoning symptom but not the root cause.

    - id: D3
      location: tests/integration/db_integration_test.zig:379
      description: >-
        Pre-existing hardcoded UUID (predates ISS-0114 per git blame
        c4e66ca 2026-05-21). Lint BLOCKER; not introduced by this fix.
        Listed for context but out of scope for ISS-0114.

