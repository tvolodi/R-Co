# =============================================================================
# Root cause (why the fix failed)
# =============================================================================
root_cause_analysis:
  primary_defect:
    location: src/db/provisioning.zig
    function: provisionTenantSchema
    block: "Step 6a (lines 146-167)"
    description: >-
      The Step 6a INSERT statement, in the prior run, populated only
      (id, storage_mode) for public.tenant. The table schema requires
      7 NOT NULL columns:
        id           uuid        NOT NULL
        slug         text        NOT NULL
        display_name text        NOT NULL
        status       text        NOT NULL
        created_at   timestamptz NOT NULL
        updated_at   timestamptz NOT NULL
        storage_mode text        NOT NULL
        tenant_type  text        NOT NULL
      The INSERT therefore failed with C23502 'null value in column
      "slug" of relation "tenant"'.
    status_in_retry: FIXED_AT_COMMIT_9905927
    verification: >-
      Zero occurrences of "null value in column 'slug'" in
      scratch/_impl_integ_retry.log. Step 6a now populates: id,
      'tenant-'||replace(id::text,'-',''), 'auto-provisioned',
      'ACTIVE', 'SCHEMA', NOW(), NOW(), 'production'. Migration
      1135_iss0114_backfill_public_tenant_storage_mode.sql matches.
    remaining_fail_count: 4 of 7 affected TCs still FAIL — see
      secondary_defects.

  secondary_defects_carried_over:
    - id: D1
      location: src/db/pool.zig::resolveAndCacheStorageMode
      affected_tcs: [TC-TNT-03-01, TC-TNT-03-03]
      description: >-
        The resolver's public.tenant_schemas fallback returns 0 rows for
        tenant UUIDs that were never provisioned via provisionTenantSchema
        (the test mints a fresh UUID and calls pool.acquire() with no
        provisioning step). Also: tenant_<uuid> schemas created on prior
        runs are not cleaned up, so runForSchema() hits C23505 duplicate
        on (schema_name, version) in schema_migrations.
      recommended_fix: >-
        Tests must either call provisionTenantSchema before acquire,
        OR the test helper must run `DELETE FROM public.schema_migrations
        WHERE schema_name LIKE 'tenant_%'` and drop the leftover schemas
        in TestHarness.init().

    - id: D2
      location: src/event_store/store.zig (interaction with pool.zig resolver)
      affected_tcs: [TC-DB-03-01]
      description: >-
        store.append() looks up the instance before appending; with the
        store's connection set to LEGACY_RLS (resolver falls through
        because createTestInstance never provisioned public.tenant),
        search_path=public, and instance_projections either does not
        exist in public (post-GBL-073) or is masked by tenant RLS
        predicates, returning InstanceNotFound.
      recommended_fix: >-
        TestHarness.init() must populate public.tenant for any
        createTestInstance call, OR store.append() must look up the
        instance via a connection mode that bypasses routing for this
        specific read.

    - id: D3
      location: src/db/migrations.zig::runForSchema
      affected_tcs: [TC-TNT-01-01]
      description: >-
        DROP TRIGGER trg_bpm_audit_apply_chain_hash (or other DDL on
        audit_entries) hits a deadlock against a concurrent audit
        chain writer when run from two test processes concurrently.
        Different defect from ISS-0114 (slug); appears to be an
        intentional cross-test lock contention not addressed by
        either the slug fix or migration 1135.
      recommended_fix: >-
        Sequentialize migration step 4 DROP TRIGGER with a process-
        level lock, OR defer audit chain trigger maintenance to the
        first test that needs it.

    - id: D4
      location: tests/integration/db_integration_test.zig:379
      affected_tcs: []
      description: >-
        Pre-existing hardcoded UUID (predates ISS-0114 per git blame
        c4e66ca 2026-05-21). Lint BLOCKER; not introduced by this fix.
        Listed for context but out of scope for ISS-0114.

