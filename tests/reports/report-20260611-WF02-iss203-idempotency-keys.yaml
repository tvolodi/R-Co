fixes_applied:
  - description: >
      Added persistEmittedEventsInTx() function to src/engine/instance.zig.
      The BACKEND-DEV implementation computed engine: keys in transition() but did
      not persist cascade events as rows in the events table. This function inserts
      each emitted event (timer_created, parallel_split, etc.) with its deterministic
      idempotency_key using ON CONFLICT (idempotency_key) DO NOTHING.
    files_changed:
      - src/engine/instance.zig
  - description: >
      Added test-integration-iss203 build target to build.zig and wired it into
      the main test-integration step.
    files_changed:
      - build.zig
  - description: >
      Fixed test graph definitions: all graphs were missing END nodes (CHK-02
      requires at least one END node in validateGraph). Added END nodes and
      connecting edges to all 5 test case graphs.
    files_changed:
      - tests/integration/iss203_idempotency_keys_test.zig
  - description: >
      Fixed TC-ISS-203-01: removed premature cleanupByName() call that deleted the
      definition row before inst_store.create() could find it. Also removed a
      spurious _ = def_id discard that Zig 0.16 rejects as a pointless discard.
    files_changed:
      - tests/integration/iss203_idempotency_keys_test.zig

