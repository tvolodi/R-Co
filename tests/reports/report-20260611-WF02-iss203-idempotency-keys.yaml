test_cases:
  - test_id: TC-ISS-203-01
    name: "single transition emitted events carry correct deterministic keys"
    layer: integration
    file: tests/integration/iss203_idempotency_keys_test.zig
    status: PASS
    requirement_id: ISS-203
    notes: >
      Verified that after inst_store.create() on a START->TIMER->END definition,
      the events table contains exactly one 'instance_started' row and at least one
      row with idempotency_key LIKE 'engine:%'. Key length == 23, prefix == 'engine:',
      suffix == 16 lowercase hex chars.

  - test_id: TC-ISS-203-02
    name: "replay dedup — ON CONFLICT DO NOTHING absorbs second insert"
    layer: integration
    file: tests/integration/iss203_idempotency_keys_test.zig
    status: PASS
    requirement_id: ISS-203
    notes: >
      Verified that re-inserting an event row with the same engine: idempotency_key
      via ON CONFLICT (idempotency_key) DO NOTHING results in no new rows.
      Event count before and after replay attempt is identical.

  - test_id: TC-ISS-203-03
    name: "client key passthrough — trigger event key stored as-is"
    layer: integration
    file: tests/integration/iss203_idempotency_keys_test.zig
    status: PASS
    requirement_id: ISS-203
    notes: >
      Verified that the instance_started trigger event does NOT have an 'engine:'
      prefix on its idempotency_key (trigger keys are random UUID, not engine-derived).
      On START->HUMAN_TASK definition, zero cascade events have engine: prefix (correct).

  - test_id: TC-ISS-203-04
    name: "different-instance isolation — same transition produces different keys"
    layer: integration
    file: tests/integration/iss203_idempotency_keys_test.zig
    status: PASS
    requirement_id: ISS-203
    notes: >
      Verified that two instances created from the same definition produce different
      engine: idempotency keys. Both keys are 23 chars with engine: prefix.

  - test_id: TC-ISS-203-05
    name: "ordinal uniqueness — N emitted events produce N distinct keys"
    layer: integration
    file: tests/integration/iss203_idempotency_keys_test.zig
    status: PASS
    requirement_id: ISS-203
    notes: >
      Verified that a START->PARALLEL_GATEWAY->[TIMER_A,TIMER_B]->END definition
      produces at least 2 engine: keyed events in the events table. All keys are
      well-formed (23 chars, engine: prefix, hex suffix). COUNT(DISTINCT idempotency_key)
      equals total engine: row count for the instance.

