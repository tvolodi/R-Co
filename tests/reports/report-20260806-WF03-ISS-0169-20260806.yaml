# ---------------------------------------------------------------------------
# Baseline comparison — how NEW was distinguished from PRE-EXISTING
# ---------------------------------------------------------------------------
baseline_comparison:
  method: >-
    A clean worktree of main was created with `git worktree add ../rco-baseline
    main` (main at b3d406d) and `zig build test --summary all` was run there.
    Per-test-binary pass counts were extracted from both runs and diffed. The
    worktree was removed afterwards with `git worktree remove --force`; `git
    worktree list` confirms only the primary checkout remains.
  branch_result: "81/81 steps succeeded; 936/1000 tests passed (64 skipped); exit 0"
  baseline_result: "70/81 steps succeeded (1 failed); 865/929 tests passed (64 skipped); exit 1"
  per_binary_diff: >-
    The diff of per-binary counts between main and the branch is exactly one
    line: the branch has one additional binary reporting `run test 71 pass (71
    total)`. Every other test binary reports an identical pass count on both
    sides. 936 - 865 = 71 and 1000 - 929 = 71, which reconciles exactly with the
    one added binary.
  regressions_found: 0
  interpretation: >-
    The branch adds 71 passing tests and changes no existing test outcome.
  baseline_step_failure:
    what_failed: >-
      The single failing step in the baseline run is the LuaJIT-backed test
      binary, which failed to compile in the worktree.
    is_it_a_main_defect: >-
      Two distinct causes were separated. The first is a genuine repository
      defect and is filed as ISS-0175 / GH #503: vendor/luajit/src/.gitignore
      ignores luajit_relver.txt while vendor/luajit/build.zig line 79 requires it
      as a build input, so a clean checkout fails with "failed to check cache:
      ... luajit_relver.txt file_hash FileNotFound". Copying the file in from the
      primary checkout cleared that error. The second cause is a build-environment
      artifact of the worktree path, not a code difference: dynasm-generated
      buildvm_arch.h emitted #line directives containing unescaped Windows
      backslash paths, producing 77 "unknown escape sequence" errors in
      buildvm.c, and clearing the cache changed the error rather than resolving
      it. Neither cause is attributable to this run's changes.
    effect_on_this_verdict: >-
      None. The comparison this step needed is whether any pre-existing test
      changed outcome, and every pre-existing binary compiled and ran identically
      on both sides. The one binary that failed to build in the baseline is the
      lua binary, and it compiles and passes 71/71 on the branch at the real
      checkout path, which is the stronger result.

