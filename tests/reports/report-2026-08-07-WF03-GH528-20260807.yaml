full_suite_test_result:
  status: INCONCLUSIVE -- BLOCKED BY UNRELATED PRE-EXISTING DEFECT
  summary: >
    Three attempts at a full `zig build test` run (once by BACKEND-DEV during
    implementation, twice by TEST-RUNNER during verification) either produced
    partial results or hung indefinitely. The BACKEND-DEV run that did complete
    showed 909/968 passed, 54 skipped, 5 failed, all 5 in tests/unit/test_api08_auth.zig
    (TC-IDN-04-05a, TC-IDN-04-05b -- PgError.ServerError / QueryFailed during
    ensureTenantDefaultSchema / acquireAdvisoryLock), confirmed via
    `git diff main...HEAD -- tests/unit/test_api08_auth.zig` (empty) to be
    unrelated to this branch, which touches only tests/unit/service_task_test.zig.
  new_defect_discovered: >
    During TEST-RUNNER verification, two further full-suite attempts hung
    indefinitely (25+ minutes, no progress) due to a session-scoped PostgreSQL
    advisory lock (src/db/provisioning.zig acquireAdvisoryLock/releaseAdvisoryLock,
    keyed per-tenant, documented at provisioning.zig:104-116 re: ISS-0131/GH-424)
    being acquired by one test binary's pooled connection and never released --
    confirmed via pg_stat_activity showing the lock-holding backend sitting
    `idle` (not in a query) while other binaries' provisionTenantSchema calls
    queued behind it indefinitely. This reproduced twice independently (different
    PIDs each time) within the same session. This is a distinct, new,
    undocumented failure mode from the already-tracked ISS-0209 (DROP SCHEMA
    CASCADE race, RESOLVED) and ISS-0131 (C40P01 deadlock, OPEN) -- neither
    describes an idle connection retaining a held advisory lock past its
    intended defer-scoped release. Filed separately per CLAUDE.md's incidental-
    discovery / scope-boundary rule (out of scope for GH-528, which touches
    only test-file code with zero relation to src/db/provisioning.zig).
  remedy_applied_this_session: >
    Terminated the stale/idle lock-holding backend(s) via pg_terminate_backend
    to unblock; this is a session-local workaround, not a fix. Root-cause fix
    is out of scope for this run and has been filed as its own issue (see
    provenance note below).

