infra_incident:
  summary: >
    zig build test-integration-event-store initially returned 7/29 (22
    failures), all "relation ... does not exist" (instance_projections,
    event_type_registry, events) against the default tenant's connections.
    Root-caused via docker logs r-co-db_test-1 (real Postgres errors,
    bypassing the broken local psql shim) to public.tenant's default-tenant
    row (id 00000000-0000-0000-0000-000000000000) carrying
    storage_mode='LEGACY_RLS' instead of 'SCHEMA', so
    applyRequestStorageRouting() set search_path TO public instead of
    tenant_default,public -- but every event-store/instance table lives only
    in the tenant_default schema. public.tenant_schemas already had the
    tenant_default row, confirming the schema itself was genuinely
    provisioned; only the routing flag was wrong.
  root_cause: >
    tools/clean_test_db.py's --include-fixtures sweep runs
    "DELETE FROM public.tenant WHERE storage_mode='LEGACY_RLS' AND
    tenant_type='test'" with no slug != 'default' guard, unlike every other
    DELETE in the file. The default tenant's tenant_type is 'test' by design
    (tests/integration/helpers.zig ensureDefaultOidcSeeds()), so when its
    storage_mode was LEGACY_RLS at the moment ORCH's pre-dispatch
    INFRA_UNBLOCK cleanup ran (python tools/clean_test_db.py
    --include-fixtures, clearing 50 leaked rows including "28 LEGACY_RLS
    children"), this statement deleted the harness's persistent default
    tenant fixture along with them. The next test run's
    ensureDefaultOidcSeeds() INSERT ... ON CONFLICT DO UPDATE took the
    plain-INSERT branch (no row to conflict against) and left storage_mode
    at its column default (LEGACY_RLS, migration
    086_iss107_tenant_storage_mode.sql) rather than the SCHEMA mode
    migration 087_default_tenant_storage_mode_cutover.sql had previously
    established. Confirmed by created_at/updated_at on the row both falling
    within minutes of the cleanup + this run.
  classification: >
    Blocking, not incidental -- this directly caused 22/29 failures in one
    of this batch's own required targets, so fixed inline per
    Unblock-Everything rather than filed-and-forwarded only.
  fix_applied:
    - "tools/clean_test_db.py: added 'AND slug != ''default''' to the LEGACY_RLS DELETE in the --include-fixtures branch, matching the guard already used by every other DELETE in the file."
    - "Data repair: UPDATE public.tenant SET storage_mode='SCHEMA', updated_at=NOW() WHERE id='00000000-0000-0000-0000-000000000000' AND storage_mode='LEGACY_RLS' (safe -- tenant_schemas already had the row, confirming the schema was genuinely provisioned)."
  reverification:
    - "zig build test-env-verify: HEALTHY 10/10 (re-run after fix)"
    - "zig build test-integration-event-store: 29/29 (re-run after fix, was 7/29)"
    - "zig build test-integration-par02: 3/3 (re-confirmed unaffected)"
    - "zig build test-integration-par03: 4/4 (re-confirmed unaffected)"
  filed:
    iss_id: ISS-0671
    github_issue: "https://github.com/tvolodi/R-Co/issues/712"
    status: RESOLVED
    note: >
      Filed per No Issue Left Local-Only despite being fixed inline in this
      run (a real defect independent of PAR-01..04's own code). Registered
      in docs/issues/ISS-0671.json and docs/issues/issue_index.json, added
      to handoffs/global_queue.json then marked RESOLVED (not left QUEUED)
      since it was already fixed and re-verified in this same run -- avoids
      a redundant future WF-03 pickup of an already-closed defect. GitHub
      issue closed with resolution comment. Related to, but distinct from,
      the already-open ISS-0663/GH-700 (same file, different bug --
      run_psql()'s substring-based error swallowing).
  tooling_note: >
    The local "psql" resolved on PATH (C:\Users\<user>\AppData\Local\Microsoft\WinGet\Links\psql.cmd)
    is a non-functional shim: it ignores all arguments and always executes
    "docker-compose exec -T db_test psql -U bpm -d bpm_test -c 'SELECT 1'",
    so any ad hoc psql query run directly from this shell prints "1" no
    matter what was asked. Diagnosis instead used
    "docker-compose exec -T db_test psql ..." directly (bypassing the shim)
    and "docker logs r-co-db_test-1" for the real Postgres error text. This
    matches the shim-resolution root cause already documented in
    ISS-0663/GH-700's prevention notes and clean_test_db.py's own
    _PSQL_EXECUTABLE comment (GH-280/ISS-0040); not re-filed as a new issue.

