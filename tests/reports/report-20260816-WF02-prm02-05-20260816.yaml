findings:
  - severity: MAJOR
    fixed: true
    description: >
      Branch-introduced deterministic self-deadlock in tests/integration/prm02_conflict_test.zig
      TC-PRM-02-05. The test acquired the bpm_test_migrations_public session advisory
      lock via helpers.acquireIntegrationLock() on a dedicated connection (held for the
      test's full lifetime) and THEN called helpers.ensureSchemaReady(), which opens a
      separate connection and blocks forever trying to acquire the same advisory lock.
      Observed live: pg_stat_activity showed session 1510 idle holding the advisory lock
      (last query SET lock_timeout = '5s' — the acquireIntegrationLock tail bracket) and
      session 1512 active on SELECT pg_advisory_lock(hashtext('bpm_test_migrations_public')).
      Fixed by reordering ensureSchemaReady() before acquireIntegrationLock(). This file
      was not green before: the TEST-DESIGN-VALIDATOR's own recorded log
      (scratch/tdv-prm02-final.log) shows 0/8 tests passed (8 failed) with
      ensureSchemaReady ConnectionFailed; the 8/8 green result here is the first genuine
      pass of this binary in this run.

