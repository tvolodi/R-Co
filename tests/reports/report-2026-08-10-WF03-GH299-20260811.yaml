      assertDatabaseConfiguration_extension_missing tests do NOT
      capture stderr for the expected FATAL startup.database log line
      emitted by obs_logger. The test author notes that Zig's
      std.io.setStdErr is not portable across Windows/Linux and the
      error return value is sufficient verification. This is a known
      gap; visual verification of the FATAL line format remains a
      manual check.
    severity: MINOR

