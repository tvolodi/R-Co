next_action: "Route to BACKEND-DEV Step 3 (rework)"
rework_recommendation: |
  Per WF-03 §Step 5 procedure: regression introduced → status FAIL → route back
  to BACKEND-DEV Step 3 with the issue list.

  Recommended fix path (any ONE of these is acceptable):

  Option A (preferred — preserves design intent): Add a thin wrapper overload
  that re-exposes the original 4-arg signature as `runForSchema4(allocator,
  pool, migrations_dir, schema_name) -> runForSchema(allocator, pool,
  migrations_dir, schema_name, false)`. The integration tests continue calling
  `runForSchema` and resolve to the 4-arg wrapper. The 5-arg version becomes
  `runForSchemaReconcile(allocator, pool, migrations_dir, schema_name,
  force_reconcile)` and is used only by orchestrators that need the flag.

  Option B (simpler): Make the 5th parameter optional at the call sites by
  updating all three direct callers to pass `false`:
    - tests/integration/helpers.zig:181 -> add `, false` 5th arg
    - tests/integration/audit_iss103_test.zig:44 -> add `, false` 5th arg
    - tests/integration/exp103_instance_waits_test.zig:81 -> add `, false` 5th arg

  Option C (simplest, requires recompile): Update the design to use a default
  parameter via Zig's `?bool` idiom (force_reconcile: ?bool = null) and treat
  null as false inside the body. Updates all call sites to compile again.

  Additionally, Step 2b CODE-DESIGN-VALIDATOR's claim that "no external
  callers exist (verified by grep)" was incorrect — at least 70 test files
  import helpers.zig which has the runForSchema call site. A future
  signature change in this codebase MUST grep `tests/` and `web/src/` for the
  function name, not just `src/`.

  Once the compile errors are resolved, re-run this Step 5 verification.

