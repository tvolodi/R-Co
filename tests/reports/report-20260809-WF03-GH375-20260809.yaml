fixes_verified:
  - file: migrations/1140_iss0112_entity_tables_tenant_scope_corrective.sql
    change: >
      New corrective migration (all_schemas scope by default -- no GBL-
      prefix, no scope header) re-declaring entity_type_instances and
      entity_record_latest with UNQUALIFIED CREATE TABLE/INDEX IF NOT
      EXISTS statements, so runForSchema()'s per-tenant search_path
      mechanism places them into every tenant schema (existing or
      future/reprovisioned), correcting migration 094's public.-qualified
      statements which silently no-op during every tenant pass.
    commit: 7ef5042

