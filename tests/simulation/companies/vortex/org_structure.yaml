  - id: role-production-planner
    name: Production Planner
    permissions: [create_production_order, view_production, view_planning]
  - id: role-line-operator
    name: Line Operator
    permissions: [update_production_status, view_own]
  - id: role-controller
    name: Financial Controller
    permissions: [approve_budget, view_finance]

