services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm
      POSTGRES_DB: bpm_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm -d bpm_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bpm
      POSTGRES_PASSWORD: bpm
      POSTGRES_DB: bpm_test
    ports:
      - "5433:5432"
    command: postgres -c max_connections=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpm -d bpm_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
