events {}

http {
  # Keycloak service-account JWTs embed many roles and can exceed nginx's
  # default 8KB single-header limit. Raise the per-buffer size to 32KB so
  # large Bearer tokens reach the Keycloak admin API without a 400 error.
  large_client_header_buffers 4 32k;

  server {
    listen 8080;

    location = /health/ready {
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    location / {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }
}
