name: CI

# The 2026-08-05 pipeline audit measured every directive in CLAUDE.md against
# 1963 handoffs and found a clean split: directives with a linter behind them
# held near 100%, directives enforced only by agent goodwill drifted to 30-45%.
# The tools existed the whole time — nothing ran them. This workflow is the
# difference between "we fixed these things" and "these things stay fixed".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Platform status (ISS-0170 / GH #497).
  #
  # On 2026-08-06 GitHub Actions went into major_outage at 15:22Z with webhook
  # triggers throttled: runs stopped being created, and queued jobs were never
  # assigned a runner and were cancelled ~15 min later. On a PR that renders as
  # a red X indistinguishable from a failed test. 12/12 runs before the incident
  # succeeded; every cancellation and failure that day came after it opened —
  # yet nothing in the pipeline said so, and the outage was found only because
  # someone opened the status page by hand.
  #
  # This job attaches that explanation to the run automatically. It is
  # DIAGNOSTIC ONLY and always exits 0: a check that could fail here would add
  # a second way for the platform to redden a healthy PR, and one that could
  # pass a build during an outage would mask real failures. Nothing depends on
  # it (`needs:` is deliberately absent) so it cannot delay or gate anything.
  # ---------------------------------------------------------------------------
  platform_status:
    name: Platform status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Actions platform status
        run: python3 tools/check_github_status.py --github

  # ---------------------------------------------------------------------------
  # Bookkeeping — the checks that did not exist when the audit ran.
  # Fast, no toolchain needed, so they fail early and cheaply.
  # ---------------------------------------------------------------------------
  bookkeeping:
    name: Pipeline bookkeeping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint_handoffs --changed diffs against origin/main, and H012 compares
          # orchestrator.log against its committed version. Both need history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Handoff schema, timestamps, encoding (changed files only)
        run: python3 tools/lint_handoffs.py --changed

      - name: Agent instruction consistency
        # Guards the four instruction surfaces (.claude/agents, .github/agents,
        # .github/instructions, CLAUDE.md) against re-diverging from the shared
        # handoff protocol, and rejects any gate defined as a match on command
        # output rather than an exit code.
        run: python3 tools/lint_agent_docs.py

  # ---------------------------------------------------------------------------
  # Source linters — all pre-existing tools that nothing was invoking.
  # ---------------------------------------------------------------------------
  linters:
    name: Source linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SQL parameter type casts
        # Catches the asymmetric-cast pattern behind PostgreSQL C42883 at runtime.
        run: python3 tools/lint_sql_param_types.py src tests

      - name: Legacy table-name references
        run: python3 tools/lint_sql_table_refs.py

      - name: Migration schema conventions
        run: python3 tools/lint_migration_schema.py

      - name: Test isolation
        # HARD GATE (ISS-0171 / GH #498). This was continue-on-error until
        # 2026-08-07, on the stated grounds that a backlog of pre-existing
        # findings had to be cleared first. That was inaccurate: the backlog
        # (184 BLOCKER + 41 MAJOR) is already suppressed by
        # tools/lint_test_isolation.baseline.json, so it was never what made
        # this step fail. The step failed on 3 findings whose LINE NUMBERS had
        # drifted out of sync with the baseline, and the mask meant nobody saw
        # it. Baseline resynced; the step now exits 0 and gates for real.
        #
        # If this starts failing on a finding you believe is already known,
        # the cause is almost certainly line drift, not a new defect --
        # issue_key() is "severity|code|file|line|message". See the
        # regeneration_note in the baseline file before touching this step.
        run: python3 tools/lint_test_isolation.py tests/integration

  # ---------------------------------------------------------------------------
  # Build and unit tests. No database: integration tests need PostgreSQL and
  # Keycloak, which belong in a separate workflow rather than gating every PR.
  # ---------------------------------------------------------------------------
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    # GH #432 fixed: `zig build` and `zig build test` now both compile and pass
    # on Linux. Seven call sites used `std.process.Environ{ .block = .global }`
    # (whose `.global` member exists only on the Windows variant of that
    # struct) plus one unrelated `std.posix.clock_gettime` gap in
    # src/webhook/dispatcher.zig, found by this same cross-compile once the
    # Environ errors were cleared. Both are fixed; this job is now a hard gate.
    # The `transition.zig in-file tests` step below stays non-blocking on its
    # own terms (GH #428, unrelated to this fix).
    #
    # GH #436: since #434 (ISS-0134) made most test binaries libc-linked,
    # `zig build test` intermittently deadlocks on ubuntu-latest. Root-caused
    # against upstream ziglang/zig#22453 ("deadlock when running multiple c
    # compilations in parallel", open, milestone "urgent" as of this fix): a
    # lock-ordering bug in std.Build.Cache.Manifest — one process holds a read
    # lock on cache file A wanting a write lock on file B while another holds
    # the write lock on B wanting the read lock on A. `zig build test` now
    # spawns ~86 concurrent `zig test -lc` jobs that all touch the same
    # shared libc/compiler-rt cache manifests, so this race is reachable even
    # at -j2 (observed once at 4m20s with -j2 already applied) — the flock
    # each side holds is only released when its process exits, which never
    # happens on its own once both sides are waiting on each other.
    # No workaround is documented upstream. Locally, a run that hung under
    # `timeout` always succeeded on retry against the same cache afterward
    # (the SIGKILL releases the flock as soon as the process exits), so this
    # is mitigated with a bounded retry instead of a single hard gate: each
    # attempt gets its own timeout, and only exhausting every attempt fails
    # the job. This trades a slower worst case for not blocking every PR on
    # a timing race in someone else's lock manager.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # setup-zig@v1 resolves 0.16.0 through community mirrors, which returned
      # 404/503 on the first run of this workflow. v2 is current, and the direct
      # download from ziglang.org is kept as a fallback so a mirror outage
      # cannot fail a build for reasons unrelated to the change under test.
      - name: Install Zig
        id: setup_zig
        continue-on-error: true
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Zig (direct fallback)
        if: steps.setup_zig.outcome != 'success'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Confirm Zig is on PATH
        run: zig version

      - name: zig build
        run: zig build -j2

      - name: zig build test
        # Bounded retry for GH #436 / upstream ziglang/zig#22453 — see the
        # job-level comment above. Each attempt gets 5 minutes (the step
        # normally completes in well under a minute; 5 is generous slack, not
        # a tuned deadlock threshold). A `timeout`-killed attempt releases its
        # flock on exit, so the next attempt starts from a clean lock state
        # even though it reuses the same on-disk cache.
        #
        # GitHub Actions runs `run:` blocks as `bash -e {0}` by default. The
        # first version of this loop only set `-uo pipefail`, inheriting `-e`
        # — so `timeout 300 zig build test -j2` returning 124 aborted the
        # whole script on that line, `status=$?` never ran, and the retry
        # never fired (confirmed on PR #438: attempt 1 hung, timed out, and
        # the job failed immediately with no attempt 2). `set +e` around
        # just the timeout call, restoring `-e` after, keeps the rest of the
        # script's error handling intact while letting the loop see a
        # non-zero exit instead of dying on it.
        #
        # GH #448 / ISS-0143: `$status` alone is not trustworthy — but it
        # turned out the fix's first attempt (grepping for a bare "failed
        # command:" line) was ALSO wrong, discovered by running it for real
        # on this same PR. With --summary all, CI runs that print
        # "failed command: .../test --cache-dir=..." mid-stream consistently
        # go on to report "Build Summary: 38/38 steps succeeded; N/M tests
        # passed" moments later, with every leaf in the printed tree showing
        # a genuine `success` (fresh compile+run, real timing/MaxRSS) or
        # `cached` status — i.e. the run actually passed in full. The
        # "failed command:" line only ever appears directly after a
        # "+- run test w" ("w" = waiting) progress-bar line, never after a
        # final result line, and never appears at all on a local run in a
        # real TTY — strong evidence it is a stale/speculative frame from
        # Zig 0.16's live progress renderer that a real terminal overwrites
        # in place but a non-TTY CI log (no ANSI cursor movement) preserves
        # as permanent text. So "failed command:" is NOT a reliable failure
        # signal by itself. The one signal that IS reliable here is the
        # "Build Summary: N/N steps succeeded" line's own N/N — if the
        # numerator ever falls short of the denominator, or the line is
        # missing entirely (a genuine hang/timeout never reaches it), that
        # is unambiguous evidence of a real failure.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::zig build test — attempt $attempt/3"
            out="$(mktemp)"
            set +e
            # --summary all: prints "Build Summary: N/N steps succeeded",
            # the one reliable pass/fail signal for this step (see above).
            timeout 300 zig build test -j2 --summary all 2>&1 | tee "$out"
            status="${PIPESTATUS[0]}"
            set -e
            echo "::endgroup::"
            summary_line="$(grep -o 'Build Summary: [0-9]*/[0-9]* steps succeeded' "$out" | tail -1 || true)"
            if [ -n "$summary_line" ]; then
              done_count="$(echo "$summary_line" | grep -o '[0-9]*/[0-9]*' | cut -d/ -f1)"
              total_count="$(echo "$summary_line" | grep -o '[0-9]*/[0-9]*' | cut -d/ -f2)"
            else
              done_count=""
              total_count=""
            fi
            if [ -n "$summary_line" ] && [ "$done_count" = "$total_count" ]; then
              echo "zig build test attempt $attempt: $summary_line — genuine pass."
              rm -f "$out"
              exit 0
            fi
            if [ -z "$summary_line" ]; then
              echo "zig build test attempt $attempt: no 'Build Summary' line found (exit $status) — treating as a hang/timeout, not the GH #448 cosmetic artifact."
            else
              echo "zig build test attempt $attempt: $summary_line — genuine step failure."
            fi
            rm -f "$out"
            if [ "$attempt" -lt 3 ]; then
              echo "Likely ziglang/zig#22453 (concurrent -lc cache-lock deadlock) — retrying."
            fi
          done
          echo "zig build test failed on all 3 attempts."
          exit 1

      - name: transition.zig in-file tests
        # HARD GATE (ISS-0171 / GH #498). This was continue-on-error while 7 of
        # 30 tests failed under GH #428. #428 is now CLOSED and
        # `zig build test-transition` exits 0, so the stated exit condition
        # ("drop continue-on-error once #428 closes") has been met. The mask
        # simply outlived it.
        #
        # This gate matters more than most: src/engine/transition.zig is the
        # pure-function core that CLAUDE.md forbids all I/O in. A regression
        # here being reported-and-ignored is exactly the failure this repo
        # cannot afford.
        run: zig build test-transition -j2

  # ---------------------------------------------------------------------------
  # Frontend. Skipped entirely when web/ is untouched.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run type-check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Frontend conventions
        # Raw fetch/axios outside client.ts, MSW references, inline query keys,
        # test.skip in Playwright specs, role-gated `disabled` instead of hidden.
        # Takes --root (the repo root containing web/), not a positional path.
        run: python3 tools/lint_frontend_conventions.py

      - name: Build
        working-directory: web
        run: npm run build
